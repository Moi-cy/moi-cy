  <style>

    /* =========================================
       MOI-CY VIDEOS
       SCHLICHT × DARK STREET
    ========================================= */

    .videos-page {
      min-height: 100vh;
      padding: 150px 7vw 110px;
      background: #050505;
    }


    /* =========================================
       ÜBERSCHRIFT
    ========================================= */

    .videos-header {
      max-width: 1200px;
      margin: 0 auto 70px;
    }


    .videos-label {
      display: block;

      margin-bottom: 18px;

      color: #00a8ff;

      font-size: 0.65rem;
      font-weight: 800;

      letter-spacing: 0.18em;
    }


    .videos-title {
      margin: 0;

      color: #f2f2f2;

      font-size: clamp(3.5rem, 8vw, 7rem);

      line-height: 0.9;

      letter-spacing: -0.07em;

      font-weight: 900;
    }


    /* =========================================
       VIDEO GRID
    ========================================= */

    .videos-grid {
      max-width: 1200px;
      margin: 0 auto;

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 28px;
    }


    /* =========================================
       VIDEO
    ========================================= */

    .video-card {
      min-width: 0;
    }


    .video-frame {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #0b0b0b;

      border: 1px solid rgba(255, 255, 255, 0.09);

      overflow: hidden;

      transition:
        border-color 0.3s ease,
        transform 0.3s ease;
    }


    .video-frame:hover {
      border-color: #00a8ff;

      transform: translateY(-3px);
    }


    .video-frame iframe {
      display: block;

      width: 100%;
      height: 100%;

      border: none;
    }


    /* =========================================
       VIDEO NUMMER
    ========================================= */

    .video-number {
      margin-top: 12px;

      color: #555;

      font-size: 0.58rem;

      font-weight: 700;

      letter-spacing: 0.16em;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 900px) {

      .videos-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }


    @media (max-width: 700px) {

      .videos-page {
        padding:
          120px
          6vw
          80px;
      }


      .videos-header {
        margin-bottom: 45px;
      }


      .videos-title {
        font-size: clamp(3.5rem, 17vw, 6rem);
      }


      .videos-grid {
        grid-template-columns: 1fr;

        gap: 38px;
      }


      .video-frame:hover {
        transform: none;
      }

    }

  </style>

</head>
