<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop – Moi-cy</title>

  <meta
    name="description"
    content="Der Moi-cy Shop."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Permanent+Marker&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css?v=shop2">

  <style>

    /* =========================================
       MOI-CY SHOP
       SCHLICHT × DARK STREET
    ========================================= */

    .shop-page {
      min-height: 100vh;
      padding: 150px 7vw 100px;
      background: #050505;
    }


    .shop-header {
      max-width: 1100px;
      margin: 0 auto 70px;
    }


    .shop-label {
      display: block;
      margin-bottom: 18px;

      color: #00a8ff;

      font-size: 0.65rem;
      font-weight: 800;

      letter-spacing: 0.18em;
    }


    .shop-title {
      margin: 0;

      color: #f2f2f2;

      font-size: clamp(3.5rem, 8vw, 7rem);

      line-height: 0.9;

      letter-spacing: -0.07em;

      font-weight: 900;
    }


    /* =========================================
       SHOP GRID
    ========================================= */

    .shop-grid {
      max-width: 1100px;
      margin: 0 auto;

      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 28px;
    }


    .shop-item {
      min-width: 0;
    }


    /* =========================================
       SHOP BILD
    ========================================= */

    .shop-image-link {
      display: block;

      width: 100%;

      text-decoration: none;

      overflow: hidden;
    }


    .shop-image {
      width: 100%;

      aspect-ratio: 1 / 1;

      background: #0d0d0d;

      border: 1px solid rgba(255, 255, 255, 0.09);

      overflow: hidden;

      transition:
        border-color 0.3s ease,
        transform 0.3s ease;
    }


    .shop-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform 0.6s ease,
        filter 0.6s ease;
    }


    .shop-image-link:hover .shop-image {
      border-color: #00a8ff;

      transform: translateY(-3px);
    }


    .shop-image-link:hover .shop-image img {
      transform: scale(1.04);
    }


    /* =========================================
       SHOP BUTTON
    ========================================= */

    .shop-button {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: space-between;

      width: 100%;

      margin-top: 14px;

      padding: 17px 20px;

      border: 1px solid rgba(255, 255, 255, 0.18);

      background: transparent;

      color: #f2f2f2;

      font-size: 0.65rem;

      font-weight: 800;

      letter-spacing: 0.15em;

      text-decoration: none;

      overflow: hidden;

      transition:
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease;
    }


    .shop-button::before {
      content: "";

      position: absolute;

      inset: 0;

      width: 0;

      background: #00a8ff;

      transition: width 0.35s ease;

      z-index: 0;
    }


    .shop-button span,
    .shop-button strong {
      position: relative;

      z-index: 2;
    }


    .shop-button strong {
      color: #00a8ff;

      font-size: 1.1rem;

      font-weight: 400;

      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }


    .shop-button:hover {
      color: #050505;

      border-color: #00a8ff;

      transform: translateY(-3px);
    }


    .shop-button:hover::before {
      width: 100%;
    }


    .shop-button:hover strong {
      color: #050505;

      transform: translateX(6px);
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 700px) {

      .shop-page {
        padding: 120px 6vw 70px;
      }


      .shop-header {
        margin-bottom: 45px;
      }


      .shop-title {
        font-size: clamp(3.5rem, 17vw, 6rem);
      }


      .shop-grid {
        grid-template-columns: 1fr;

        gap: 45px;
      }


      .shop-image {
        aspect-ratio: 1 / 1;
      }


      .shop-button {
        padding: 16px 18px;
      }

    }

  </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

  <a href="index.html" class="logo">

    <span class="logo-mark">
      M
    </span>

    <span>
      Moi-cy
    </span>

  </a>


  <nav class="navigation">

    <a href="index.html">
      HOME
    </a>

    <a href="bilder.html">
      BILDER
    </a>

    <a href="videos.html">
      VIDEOS
    </a>

    <a href="skateplaetze.html">

    </a>

    <a href="kontakt.html">

    </a>

    <a href="shop.html">

    </a>

  </nav>


  <button
    class="menu-button"
    id="menuButton"
    aria-label="Menü öffnen"
  >

    <span></span>
    <span></span>
    <span></span>

  </button>

</header>



<!-- =========================================
     SHOP
========================================= -->

<main>

  <section class="shop-page">


    <!-- ÜBERSCHRIFT -->

    <div class="shop-header">

      <span class="shop-label">
        MOI-CY / SHOP
      </span>

      <h1 class="shop-title">
        Shop
      </h1>

    </div>



    <!-- SHOP PRODUKTE -->

    <section class="shop-grid">


      <!-- =====================================
           LINKER SHOP
           ZAZZLE
      ====================================== -->

      <article class="shop-item">


        <!-- BILD IST KLICKBAR -->

        <a
          href="https://www.zazzle.de/store/moi_cy"
          class="shop-image-link"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Moi-cy Shop auf Zazzle öffnen"
        >

          <div class="shop-image">

            <img
              src="https://placehold.co/900x900/111111/00A8FF?text=ZAZZLE"
              alt="Moi-cy Shop auf Zazzle"
            >

          </div>

        </a>


        <!-- BUTTON IST KLICKBAR -->

        <a
          href="https://www.zazzle.de/store/moi_cy"
          class="shop-button"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span>
            ZUM ZAZZLE SHOP
          </span>

          <strong>
            →
          </strong>

        </a>

      </article>



      <!-- =====================================
           RECHTER SHOP
           TEAMSHIRTS
      ====================================== -->

      <article class="shop-item">


        <!-- BILD IST KLICKBAR -->

        <a
          href="https://shop.teamshirts.de/moi-cy"
          class="shop-image-link"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Moi-cy Shop auf TeamShirts öffnen"
        >

          <div class="shop-image">

            <img
              src="https://placehold.co/900x900/111111/00A8FF?text=TEAMSHIRTS"
              alt="Moi-cy Shop auf TeamShirts"
            >

          </div>

        </a>


        <!-- BUTTON IST KLICKBAR -->

        <a
          href="https://shop.teamshirts.de/moi-cy"
          class="shop-button"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span>
            ZUM TEAMSHIRTS SHOP
          </span>

          <strong>
            →
          </strong>

        </a>

      </article>


    </section>

  </section>

</main>
