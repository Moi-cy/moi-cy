<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop – Moi-cy</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Permanent+Marker&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <div id="site-header"></div>

    <main class="shop-page">

        <section class="shop-hero">
            <div class="shop-hero-inner">
                <span class="shop-kicker">MOI-CY</span>

                <h1>SHOP</h1>

                <p>
                    MOI-CY Skateboarding Stuff.
                    Shirts, Boards und mehr.
                </p>
            </div>
        </section>


        <section class="shop-products">

            <!-- ZAZZLE -->

            <article class="shop-card">

                <a
                    href="https://www.zazzle.de/store/moi_cy"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="shop-image-link"
                >
                    <div class="shop-image-wrap">

                        <img
                            src="bilder/zazzle-1.jpg"
                            alt="MOI-CY Produkte bei Zazzle"
                            class="shop-image"
                        >

                    </div>
                </a>

                <div class="shop-card-content">

                    <span class="shop-card-label">
                        ZAZZLE
                    </span>

                    <h2>MOI-CY COLLECTION</h2>

                    <p>
                        Entdecke die MOI-CY Produkte
                        bei Zazzle.
                    </p>

                    <a
                        href="https://www.zazzle.de/store/moi_cy"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="shop-button"
                    >
                        ZU ZAZZLE
                    </a>

                </div>

            </article>


            <!-- TEAMSHIRTS -->

            <article class="shop-card">

                <a
                    href="https://shop.teamshirts.de/moi-cy"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="shop-image-link"
                >
                    <div class="shop-image-wrap">

                        <img
                            src="bilder/teamshirt-1.jpg"
                            alt="MOI-CY Produkte bei TeamShirts"
                            class="shop-image"
                        >

                    </div>
                </a>

                <div class="shop-card-content">

                    <span class="shop-card-label">
                        TEAMSHIRTS
                    </span>

                    <h2>MOI-CY SHIRTS</h2>

                    <p>
                        MOI-CY Shirts und weitere
                        Produkte bei TeamShirts.
                    </p>

                    <a
                        href="https://shop.teamshirts.de/moi-cy"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="shop-button"
                    >
                        ZU TEAMSHIRTS
                    </a>

                </div>

            </article>

        </section>

    </main>

    <div id="site-footer"></div>

    <script type="module" src="script.js"></script>

</body>
</html>
