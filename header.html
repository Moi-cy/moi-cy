<header class="site-header">

    <div class="header-logo">

        <a href="index.html" aria-label="Moi-cy Startseite">

            <span class="logo-symbol" aria-hidden="true">
                <svg
                    viewBox="0 0 100 100"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <!-- Skateboard -->
                    <g
                        fill="none"
                        stroke="currentColor"
                        stroke-width="7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <!-- Deck -->
                        <path d="M18 47 H82" />

                        <!-- Nose / Tail -->
                        <path d="M18 47 C15 47 13 49 13 52 C13 55 15 57 18 57" />
                        <path d="M82 47 C85 47 87 49 87 52 C87 55 85 57 82 57" />

                        <!-- Achsen -->
                        <path d="M30 57 V62" />
                        <path d="M70 57 V62" />

                        <!-- Wheels -->
                        <circle cx="30" cy="68" r="6" fill="currentColor" stroke="none" />
                        <circle cx="70" cy="68" r="6" fill="currentColor" stroke="none" />
                    </g>
                </svg>
            </span>

            <span class="logo-wordmark">
                <span class="logo-main">MOI</span>
                <span class="logo-mark">-</span>
                <span class="logo-main">CY</span>
            </span>

        </a>

    </div>


    <nav class="main-nav" aria-label="Hauptnavigation">

        <a
            href="bilder.html"
            data-i18n="nav_images"
        >
            BILDER
        </a>

        <a
            href="videos.html"
            data-i18n="nav_videos"
        >
            VIDEOS
        </a>

        <a
            href="skateplaetze.html"
            data-i18n="nav_skateparks"
        >
            SKATEPLÄTZE
        </a>

        <a
            href="kontakt.html"
            data-i18n="nav_contact"
        >
            KONTAKT
        </a>

        <a
            href="shop.html"
            data-i18n="nav_shop"
        >
            SHOP
        </a>

    </nav>


    <div
        class="header-languages"
        aria-label="Sprache"
    >

        <button
            type="button"
            class="language-button active"
            data-language="de"
            aria-pressed="true"
        >
            DE
        </button>

        <button
            type="button"
            class="language-button"
            data-language="en"
            aria-pressed="false"
        >
            EN
        </button>

        <button
            type="button"
            class="language-button"
            data-language="fr"
            aria-pressed="false"
        >
            FR
        </button>

    </div>


    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Menü öffnen"
        aria-expanded="false"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>

</header>
