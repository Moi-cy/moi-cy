<header class="site-header">

    <div class="header-logo">

        <a href="index.html" aria-label="Moi-cy Startseite">

            <span class="logo-symbol" aria-hidden="true">
                <svg
                    viewBox="0 0 100 100"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <!-- Skateboard -->
                    <rect
                        x="20"
                        y="42"
                        width="60"
                        height="10"
                        rx="5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="7"
                    />

                    <!-- Linkes Rad -->
                    <circle
                        cx="30"
                        cy="65"
                        r="7"
                        fill="currentColor"
                    />

                    <!-- Rechtes Rad -->
                    <circle
                        cx="70"
                        cy="65"
                        r="7"
                        fill="currentColor"
                    />

                    <!-- Achsen -->
                    <line
                        x1="30"
                        y1="52"
                        x2="30"
                        y2="59"
                        stroke="currentColor"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                    <line
                        x1="70"
                        y1="52"
                        x2="70"
                        y2="59"
                        stroke="currentColor"
                        stroke-width="5"
                        stroke-linecap="round"
                    />
                </svg>
            </span>

            <span class="logo-wordmark">
                <span class="logo-main">MOI</span>
                <span class="logo-mark">-</span>
                <span class="logo-main">CY</span>
            </span>

        </a>

    </nav>


    <div class="header-languages" aria-label="Sprache">

            data-language="de"
            aria-pressed="true"
        >
            DE
        </button>

        <button
            type="button"

        </button>

        <button
            type="button"
