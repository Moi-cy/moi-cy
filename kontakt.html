<!DOCTYPE html>
<html lang="de">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title
    data-i18n-title="contact_page_title"
  >
    Kontakt – Moi-cy
  </title>

  <meta
    name="description"
    content="Kontakt zu Moi-cy."
    data-i18n-description="contact_meta_description"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Permanent+Marker&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css?v=kontakt3">


  <style>

    /* =========================================
       KONTAKTSEITE
       MINIMAL × DARK STREET
    ========================================= */

    .contact-page {
      min-height: 100vh;

      padding:
        150px
        10vw
        120px;

      display: flex;
      justify-content: center;

      background: #050505;
    }


    .contact-wrapper {
      width: 100%;
      max-width: 850px;
    }


    /* =========================================
       KONTAKT ÜBERSCHRIFT
    ========================================= */

    .contact-page-heading {
      margin-bottom: 65px;
    }


    .contact-page-heading span {
      display: block;

      margin-bottom: 18px;

      color: #00a8ff;

      font-size: 0.68rem;
      font-weight: 700;

      letter-spacing: 0.16em;
    }


    .contact-page-heading h1 {
      margin: 0;

      color: #f2f2f2;

      font-size: clamp(3.5rem, 7vw, 6rem);

      line-height: 0.9;

      letter-spacing: -0.07em;

      font-weight: 900;
    }


    /* =========================================
       FORMULAR
    ========================================= */

    .contact-form {
      width: 100%;
    }


    .form-group {
      margin-bottom: 32px;
    }


    .form-group label {
      display: block;

      margin-bottom: 10px;

      color: #888;

      font-size: 0.65rem;
      font-weight: 700;

      letter-spacing: 0.14em;
    }


    .form-group input,
    .form-group textarea {
      width: 100%;

      padding: 17px 18px;

      border: 1px solid rgba(255, 255, 255, 0.14);

      outline: none;

      background: #0b0b0b;

      color: #f2f2f2;

      font-family: "Inter", sans-serif;

      font-size: 0.9rem;

      transition:
        border-color 0.25s ease,
        background 0.25s ease;
    }


    .form-group input {
      height: 55px;
    }


    .form-group textarea {
      min-height: 190px;

      resize: vertical;
    }


    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #444;
    }


    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #00a8ff;

      background: #080808;
    }


    /* =========================================
       ABSENDEN
    ========================================= */

    .contact-submit {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 25px;

      margin-top: 8px;

      padding: 17px 25px;

      border: 1px solid #00a8ff;

      background: transparent;

      color: #f2f2f2;

      font-family: "Inter", sans-serif;

      font-size: 0.65rem;

      font-weight: 800;

      letter-spacing: 0.15em;

      cursor: pointer;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;
    }


    .contact-submit span {
      color: #00a8ff;

      font-size: 1.1rem;

      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }


    .contact-submit:hover {
      background: #00a8ff;

      color: #050505;

      transform: translateY(-2px);
    }


    .contact-submit:hover span {
      color: #050505;

      transform: translateX(5px);
    }


    /* =========================================
       SPRACHUMSCHALTER
    ========================================= */

    .language-switcher {
      display: flex;

      align-items: center;

      gap: 6px;

      margin-left: 20px;
    }


    .language-switcher button {
      padding: 6px 7px;

      border: 1px solid rgba(255,255,255,0.12);

      background: transparent;

      color: #777;

      font-family: "Inter", sans-serif;

      font-size: 0.6rem;

      font-weight: 800;

      letter-spacing: 0.08em;

      cursor: pointer;

      transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }


    .language-switcher button:hover {
      color: #f2f2f2;

      border-color: #00a8ff;
    }


    .language-switcher button.active {
      color: #050505;

      background: #00a8ff;

      border-color: #00a8ff;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 900px) {

      .language-switcher {
        margin-left: 12px;
      }

    }


    @media (max-width: 700px) {

      .contact-page {
        padding:
          125px
          6vw
          90px;
      }


      .contact-page-heading {
        margin-bottom: 50px;
      }


      .contact-page-heading h1 {
        font-size: clamp(3.2rem, 17vw, 5rem);
      }


      .form-group {
        margin-bottom: 25px;
      }


      .form-group input {
        height: 52px;
      }


      .form-group textarea {
        min-height: 160px;
      }


      .contact-submit {
        width: 100%;
      }


      .language-switcher {
        margin-left: 8px;

        gap: 3px;
      }


      .language-switcher button {
        padding: 5px 6px;

        font-size: 0.55rem;
      }

    }

  </style>

</head>


<body>


<!-- =========================================
     SHARED HEADER
========================================= -->

<div id="site-header"></div>



<!-- =========================================
     KONTAKT
========================================= -->

<main>

  <section class="contact-page">

    <div class="contact-wrapper">


      <!-- ÜBERSCHRIFT -->

      <div class="contact-page-heading">

        <span data-i18n="contact_label">
          MOI-CY / KONTAKT
        </span>

        <h1 data-i18n="contact_title">
          Kontakt
        </h1>

      </div>



      <!-- FORMULAR -->

      <form
        class="contact-form"
        action="https://formsubmit.co/mio@moi-cy.de"
        method="POST"
      >

        <input
          type="hidden"
          name="_subject"
          value="Neue Nachricht über Moi-cy"
          data-i18n-value="contact_subject"
        >

        <input
          type="hidden"
          name="_captcha"
          value="false"
        >


        <!-- NAME -->

        <div class="form-group">

          <label
            for="name"
            data-i18n="contact_name_label"
          >
            NAME
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Dein Name"
            data-i18n-placeholder="contact_name_placeholder"
            autocomplete="name"
            required
          >

        </div>


        <!-- E-MAIL -->

        <div class="form-group">

          <label
            for="email"
            data-i18n="contact_email_label"
          >
            E-MAIL
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="deine@email.de"
            data-i18n-placeholder="contact_email_placeholder"
            autocomplete="email"
            required
          >

        </div>


        <!-- NACHRICHT -->

        <div class="form-group">

          <label
            for="message"
            data-i18n="contact_message_label"
          >
            NACHRICHT
          </label>

          <textarea
            id="message"
            name="message"
            placeholder="Deine Nachricht..."
            data-i18n-placeholder="contact_message_placeholder"
            required
          ></textarea>

        </div>


        <!-- ABSENDEN -->

        <button
          type="submit"
          class="contact-submit"
        >

          <span>
            →
          </span>

          <span data-i18n="contact_submit">
            NACHRICHT SENDEN
          </span>

        </button>

      </form>

    </div>

  </section>

</main>



<!-- =========================================
     SHARED FOOTER
========================================= -->

<div id="site-footer"></div>



<script src="script.js"></script>

</body>
</html>
