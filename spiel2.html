<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Moi-cy Street Rush 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101820;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    background:
        linear-gradient(
            to bottom,
            #68b9e8 0%,
            #bde6f7 42%,
            #7c9c78 43%,
            #51654c 100%
        );
}

.hidden{
    display:none!important;
}

.screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
    background:
        radial-gradient(circle at 50% 20%,rgba(255,255,255,.08),transparent 35%),
        linear-gradient(135deg,#0b1118,#141e27 55%,#080c10);
}

.menuCard{
    width:min(520px,92vw);
    padding:34px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    background:rgba(10,15,21,.92);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
    text-align:center;
}

.logo{
    font-size:58px;
    font-weight:1000;
    letter-spacing:-5px;
    margin-bottom:5px;
}

.logo span{
    color:#79e7ff;
}

.subtitle{
    color:#93a4b4;
    margin-bottom:28px;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
}

button{
    width:100%;
    border:0;
    border-radius:15px;
    padding:17px 20px;
    margin:7px 0;
    color:white;
    background:#202d38;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    transform:translateY(-2px);
    background:#2b3b48;
}

button.primary{
    background:linear-gradient(135deg,#4fd5ff,#287bd9);
    box-shadow:0 10px 30px rgba(47,166,255,.25);
}

button.primary:hover{
    background:linear-gradient(135deg,#72e0ff,#348ce9);
}

.settings{
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    background:#121a22;
    color:#aab8c4;
    font-size:14px;
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

.hudTop{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.position{
    background:rgba(5,10,15,.82);
    border:1px solid rgba(255,255,255,.12);
    border-radius:17px;
    padding:12px 18px;
    min-width:110px;
}

.position small{
    display:block;
    color:#91a0ad;
    font-size:11px;
    text-transform:uppercase;
}

.position strong{
    display:block;
    font-size:34px;
    line-height:34px;
}

.stats{
    text-align:right;
    background:rgba(5,10,15,.75);
    border-radius:17px;
    padding:12px 17px;
}

.stats div{
    margin:2px 0;
}

#raceInfo{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    width:min(600px,90vw);
    background:rgba(5,10,15,.72);
    padding:10px;
    border-radius:15px;
}

.progress{
    height:8px;
    background:#29343d;
    border-radius:20px;
    overflow:hidden;
}

.progressFill{
    height:100%;
    width:0%;
    background:#71ddff;
}

#notice{
    position:absolute;
    left:50%;
    top:23%;
    transform:translateX(-50%);
    font-size:27px;
    font-weight:900;
    text-shadow:0 4px 20px #000;
    opacity:0;
}

#countdown{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:15;
    pointer-events:none;
    font-size:110px;
    font-weight:1000;
    text-shadow:0 8px 40px #000;
}

#mobileControls{
    position:fixed;
    left:0;
    right:0;
    bottom:25px;
    display:flex;
    justify-content:space-between;
    padding:0 20px;
    z-index:30;
    pointer-events:none;
}

.controlGroup{
    display:flex;
    gap:12px;
    pointer-events:auto;
}

.touchBtn{
    width:70px;
    height:70px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(10,15,20,.65);
    border:1px solid rgba(255,255,255,.15);
    font-size:27px;
    user-select:none;
}

.finishCard{
    width:min(500px,92vw);
    background:#0c1218;
    border-radius:28px;
    padding:35px;
    text-align:center;
    box-shadow:0 30px 100px #000;
}

.trophy{
    width:100px;
    height:110px;
    margin:0 auto 20px;
    position:relative;
}

.trophyCup{
    position:absolute;
    width:64px;
    height:62px;
    left:18px;
    top:10px;
    background:linear-gradient(135deg,#fff5a3,#d8a62b);
    border-radius:8px 8px 25px 25px;
}

.trophyCup:before,
.trophyCup:after{
    content:"";
    position:absolute;
    width:25px;
    height:34px;
    border:7px solid #d8a62b;
    top:4px;
}

.trophyCup:before{
    left:-23px;
    border-right:0;
    border-radius:20px 0 0 20px;
}

.trophyCup:after{
    right:-23px;
    border-left:0;
    border-radius:0 20px 20px 0;
}

.trophyStem{
    position:absolute;
    width:12px;
    height:28px;
    background:#d8a62b;
    left:44px;
    top:69px;
}

.trophyBase{
    position:absolute;
    width:60px;
    height:13px;
    background:#b7841d;
    left:20px;
    bottom:10px;
    border-radius:7px;
}

@media(min-width:900px){
    #mobileControls{
        display:none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu" class="screen">
    <div class="menuCard">
        <div class="logo">Moi<span>-cy</span></div>
        <div class="subtitle">Street Rush · 3D Skate Race</div>

        <button class="primary" id="startBtn">🏁 Rennen starten</button>
        <button id="soundBtn">🎵 Musik: AN</button>

        <div class="settings">
            <b>Steuerung</b><br><br>
            ← → Lenken &nbsp; · &nbsp; ↑ Beschleunigen<br>
            ↓ Bremsen &nbsp; · &nbsp; SPACE Springen
        </div>
    </div>
</div>

<div id="finish" class="screen hidden">
    <div class="finishCard">
        <div class="trophy">
            <div class="trophyCup"></div>
            <div class="trophyStem"></div>
            <div class="trophyBase"></div>
        </div>

        <div class="logo" style="font-size:40px">Moi<span>-cy</span></div>
        <h1 id="finishTitle">🏆 Ziel!</h1>
        <p id="finishStats"></p>

        <button class="primary" id="againBtn">Nochmal fahren</button>
        <button id="menuBtn">Hauptmenü</button>
    </div>
</div>

<div id="hud" class="hidden">
    <div class="hudTop">
        <div class="position">
            <small>Position</small>
            <strong id="positionText">1 / 6</strong>
        </div>

        <div class="stats">
            <div>⚡ <span id="speedText">0</span> km/h</div>
            <div>🏁 <span id="distanceText">0</span> m</div>
            <div>⭐ <span id="scoreText">0</span></div>
        </div>
    </div>

    <div id="notice"></div>

    <div id="raceInfo">
        <div class="progress">
            <div class="progressFill" id="progressFill"></div>
        </div>
    </div>
</div>

<div id="countdown" class="hidden">3</div>

<div id="mobileControls" class="hidden">
    <div class="controlGroup">
        <div class="touchBtn" id="leftBtn">←</div>
        <div class="touchBtn" id="rightBtn">→</div>
    </div>

    <div class="controlGroup">
        <div class="touchBtn" id="jumpBtn">↑</div>
        <div class="touchBtn" id="boostBtn">⚡</div>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   MOI-CY STREET RUSH
   Stable single-file pseudo-3D renderer
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}
addEventListener("resize",resize);
resize();

/* ---------- GAME STATE ---------- */

const game={
    running:false,
    countdown:false,
    finished:false,
    music:true,
    time:0,
    score:0,
    distance:0,
    speed:0,
    maxSpeed:105,
    steer:0,
    jump:0,
    jumpVel:0,
    boost:0,
    playerX:0
};

const keys={};

addEventListener("keydown",e=>{
    keys[e.code]=true;

    if(
        ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)
    ) e.preventDefault();

    if(e.code==="Escape" && game.running){
        game.running=false;
        document.getElementById("menu").classList.remove("hidden");
    }
});

addEventListener("keyup",e=>{
    keys[e.code]=false;
});

/* ---------- AUDIO ---------- */

let audioCtx=null;
let musicTimer=null;
let musicNodes=[];

function startMusic(){

    if(!game.music) return;

    if(!audioCtx){
        audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }

    if(musicTimer) return;

    const master=audioCtx.createGain();
    master.gain.value=.045;
    master.connect(audioCtx.destination);

    musicNodes.push(master);

    const notes=[110,138.59,164.81,220,164.81,138.59];

    let index=0;

    musicTimer=setInterval(()=>{

        if(!game.running) return;

        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();

        osc.type="triangle";
        osc.frequency.value=notes[index%notes.length];

        gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            .16,
            audioCtx.currentTime+.05
        );
        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioCtx.currentTime+.75
        );

        osc.connect(gain);
        gain.connect(master);

        osc.start();
        osc.stop(audioCtx.currentTime+.8);

        index++;

    },650);
}

function stopMusic(){
    if(musicTimer){
        clearInterval(musicTimer);
        musicTimer=null;
    }
}

/* ---------- ROAD WORLD ---------- */

const ROAD=7;
const FINISH=5000;

function sky(){

    const g=ctx.createLinearGradient(0,0,0,H*.58);
    g.addColorStop(0,"#4d9bd0");
    g.addColorStop(.55,"#a8d9ec");
    g.addColorStop(1,"#d7e9dc");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    /* sun */

    ctx.fillStyle="rgba(255,245,190,.85)";
    ctx.beginPath();
    ctx.arc(W*.78,H*.14,55,0,Math.PI*2);
    ctx.fill();

    /* distant skyline */

    ctx.fillStyle="#647986";

    for(let i=0;i<18;i++){

        const x=i*(W/18);

        const h=35+(i*19%90);

        ctx.fillRect(
            x,
            H*.47-h,
            W/18+3,
            h
        );
    }
}

function road(){

    /*
      Stable pseudo-3D:
      horizon is fixed.
      Everything is projected from world Z to screen.
    */

    const horizon=H*.39;

    /* grass */

    ctx.fillStyle="#55714d";
    ctx.fillRect(0,horizon,W,H-horizon);

    /* road trapezoid */

    ctx.fillStyle="#34393d";

    ctx.beginPath();
    ctx.moveTo(W*.47,horizon);
    ctx.lineTo(W*.53,horizon);
    ctx.lineTo(W*.91,H);
    ctx.lineTo(W*.09,H);
    ctx.closePath();
    ctx.fill();

    /* sidewalks */

    ctx.fillStyle="#96999a";

    ctx.beginPath();
    ctx.moveTo(W*.45,horizon);
    ctx.lineTo(W*.47,horizon);
    ctx.lineTo(W*.09,H);
    ctx.lineTo(W*.16,H);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(W*.53,horizon);
    ctx.lineTo(W*.55,horizon);
    ctx.lineTo(W*.84,H);
    ctx.lineTo(W*.91,H);
    ctx.closePath();
    ctx.fill();

    /* lane lines */

    for(let i=0;i<22;i++){

        const z=i/22;

        const y=horizon+(z*z)*(H-horizon);

        const roadHalf=.04+z*.41;

        const x1=W/2-roadHalf*W;
        const x2=W/2+roadHalf*W;

        ctx.strokeStyle="#eee";
        ctx.lineWidth=2+z*4;

        ctx.beginPath();
        ctx.moveTo(W/2,y);
        ctx.lineTo(
            W/2,
            y+(H-horizon)*.025*z
        );
        ctx.stroke();
    }

    /* road edge */

    ctx.strokeStyle="#d7d7d7";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.moveTo(W*.45,horizon);
    ctx.lineTo(W*.09,H);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(W*.55,horizon);
    ctx.lineTo(W*.91,H);
    ctx.stroke();
}

/* ---------- PROJECTION ---------- */

function project(x,z,y=0){

    /*
      z is distance in front of camera.
      positive = farther away.
    */

    const horizon=H*.39;

    const near=4;
    const far=240;

    let t=1-Math.max(0,Math.min(z,far))/far;

    /*
      perspective
    */

    const scale=.12+t*1.75;

    const sx=W/2+x*scale*W*.045;

    const sy=
        horizon+
        t*t*(H-horizon)-
        y*scale*H*.055;

    return {
        x:sx,
        y:sy,
        scale
    };
}

/* ---------- CITY ---------- */

function drawBuilding(x,z,w,h){

    if(z<2 || z>240) return;

    const p=project(x,z,0);
    const s=p.scale;

    const width=w*s*W*.018;
    const height=h*s*H*.018;

    ctx.fillStyle="#56636d";

    ctx.fillRect(
        p.x-width/2,
        p.y-height,
        width,
        height
    );

    /* roof */

    ctx.fillStyle="#3d4850";

    ctx.fillRect(
        p.x-width/2,
        p.y-height,
        width,
        Math.max(2,height*.05)
    );

    /* windows */

    if(s>.35){

        const cols=Math.max(2,Math.floor(width/18));
        const rows=Math.max(2,Math.floor(height/28));

        for(let yy=0;yy<rows;yy++){
            for(let xx=0;xx<cols;xx++){

                if((xx+yy)%3===0) continue;

                ctx.fillStyle=
                    (xx+yy)%4===0
                    ? "#ffd878"
                    : "#8fc4d8";

                const wx=
                    p.x-width/2+
                    8*s+
                    xx*(width-14*s)/cols;

                const wy=
                    p.y-height+
                    10*s+
                    yy*(height-18*s)/rows;

                ctx.fillRect(
                    wx,
                    wy,
                    Math.max(2,5*s),
                    Math.max(3,7*s)
                );
            }
        }
    }
}

function drawTree(x,z){

    if(z<3 || z>220) return;

    const p=project(x,z,0);

    const trunk=14*p.scale;
    const crown=35*p.scale;

    ctx.fillStyle="#66462e";

    ctx.fillRect(
        p.x-trunk/2,
        p.y-trunk*4,
        trunk,
        trunk*4
    );

    ctx.fillStyle="#315d38";

    ctx.beginPath();
    ctx.arc(
        p.x,
        p.y-trunk*5,
        crown,
        0,
        Math.PI*2
    );
    ctx.fill();
}

function drawLamp(x,z){

    if(z<4 || z>190) return;

    const p=project(x,z,0);

    const h=95*p.scale;

    ctx.strokeStyle="#20282d";
    ctx.lineWidth=Math.max(1,5*p.scale);

    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x,p.y-h);
    ctx.lineTo(p.x+18*p.scale,p.y-h);
    ctx.stroke();

    ctx.fillStyle="#fff2b0";

    ctx.beginPath();
    ctx.arc(
        p.x+18*p.scale,
        p.y-h,
        Math.max(2,6*p.scale),
        0,
        Math.PI*2
    );
    ctx.fill();
}

function drawCity(){

    /*
      Buildings are deliberately close enough
      to remain visible.
    */

    for(let z=12;z<245;z+=27){

        drawBuilding(-19,z,14,42+(z%4)*9);
        drawBuilding(19,z+7,15,48+(z%5)*8);

        drawTree(-12,z+10);
        drawTree(12,z+20);

        drawLamp(-9,z);
        drawLamp(9,z+14);
    }
}

/* ---------- OBSTACLES ---------- */

function drawBarrier(x,z){

    const p=project(x,z,0);

    if(z>220) return;

    const s=p.scale;

    ctx.fillStyle="#e9e9e9";

    ctx.fillRect(
        p.x-30*s,
        p.y-18*s,
        60*s,
        18*s
    );

    ctx.fillStyle="#e85d4a";

    for(let i=-2;i<3;i++){

        ctx.save();

        ctx.translate(
            p.x+i*18*s,
            p.y-10*s
        );

        ctx.rotate(-.45);

        ctx.fillRect(
            -4*s,
            -12*s,
            8*s,
            25*s
        );

        ctx.restore();
    }
}

/* ---------- SKATERS ---------- */

function drawSkater(x,z,shirt,board,player=false){

    if(z<1 || z>220) return;

    const p=project(x,z,0);

    const s=p.scale;

    const lean=
        player
        ? game.steer*.12
        : Math.sin(z*.05)*.04;

    ctx.save();

    ctx.translate(p.x,p.y);

    ctx.rotate(lean);

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.28)";
    ctx.beginPath();
    ctx.ellipse(
        0,
        3*s,
        22*s,
        7*s,
        0,
        0,
        Math.PI*2
    );
    ctx.fill();

    /* skateboard - LENGTHWISE */

    ctx.fillStyle=board;

    ctx.beginPath();
    ctx.roundRect(
        -5*s,
        -7*s,
        10*s,
        58*s,
        5*s
    );
    ctx.fill();

    /* wheels */

    ctx.fillStyle="#111";

    for(const yy of [3,41]){

        ctx.beginPath();
        ctx.arc(-9*s,yy*s,5*s,0,Math.PI*2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(9*s,yy*s,5*s,0,Math.PI*2);
        ctx.fill();
    }

    /* legs */

    ctx.strokeStyle="#20252a";
    ctx.lineWidth=8*s;
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.moveTo(-6*s,4*s);
    ctx.lineTo(-12*s,28*s);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(6*s,4*s);
    ctx.lineTo(13*s,28*s);
    ctx.stroke();

    /* shoes */

    ctx.fillStyle="#ececec";

    ctx.fillRect(-18*s,25*s,14*s,8*s);
    ctx.fillRect(8*s,25*s,14*s,8*s);

    /* body */

    ctx.fillStyle=shirt;

    ctx.beginPath();
    ctx.roundRect(
        -18*s,
        -42*s,
        36*s,
        42*s,
        8*s
    );
    ctx.fill();

    /* Moi-cy shirt patch */

    ctx.fillStyle="#fff";

    ctx.fillRect(
        -14*s,
        -29*s,
        28*s,
        12*s
    );

    ctx.fillStyle="#101820";
    ctx.font=`bold ${7*s}px Arial`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        "Moi-cy",
        0,
        -23*s
    );

    /* arms */

    ctx.strokeStyle=shirt;
    ctx.lineWidth=7*s;

    ctx.beginPath();
    ctx.moveTo(-15*s,-33*s);
    ctx.lineTo(-29*s,-12*s);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(15*s,-33*s);
    ctx.lineTo(29*s,-12*s);
    ctx.stroke();

    /* neck */

    ctx.fillStyle="#d99a73";

    ctx.fillRect(
        -6*s,
        -49*s,
        12*s,
        10*s
    );

    /* head */

    ctx.beginPath();
    ctx.arc(
        0,
        -62*s,
        16*s,
        0,
        Math.PI*2
    );
    ctx.fill();

    /* hair / helmet */

    ctx.fillStyle=player ? "#171c20" : "#252a30";

    ctx.beginPath();
    ctx.arc(
        0,
        -67*s,
        17*s,
        Math.PI,
        Math.PI*2
    );
    ctx.fill();

    if(player){

        ctx.fillStyle="#4dd5ff";

        ctx.beginPath();
        ctx.arc(
            0,
            -70*s,
            16*s,
            Math.PI,
            Math.PI*2
        );
        ctx.fill();
    }

    ctx.restore();
}

/* ---------- OPPONENTS ---------- */

const opponents=[
    {name:"Rico",x:-3.3,z:0,progress:0,speed:83,shirt:"#df604e",board:"#171717"},
    {name:"Mia",x:3.1,z:0,progress:0,speed:86,shirt:"#d5a0e8",board:"#222"},
    {name:"Jay",x:-1.8,z:0,progress:0,speed:89,shirt:"#e8b84e",board:"#111"},
    {name:"Luca",x:1.7,z:0,progress:0,speed:91,shirt:"#62b6db",board:"#252525"},
    {name:"Niko",x:0,z:0,progress:0,speed:94,shirt:"#78c779",board:"#151515"}
];

/* ---------- RACE ---------- */

function resetRace(){

    game.running=true;
    game.finished=false;
    game.countdown=true;

    game.time=0;
    game.score=0;
    game.distance=0;
    game.speed=0;
    game.playerX=0;
    game.steer=0;
    game.jump=0;
    game.jumpVel=0;
    game.boost=0;

    opponents.forEach((o,i)=>{
        o.progress=0;
        o.z=-12-i*7;
        o.x=[-3.3,3.1,-1.8,1.7,0][i];
    });

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("finish").classList.add("hidden");
    document.getElementById("hud").classList.remove("hidden");
    document.getElementById("mobileControls").classList.remove("hidden");

    startCountdown();
}

function startCountdown(){

    const el=document.getElementById("countdown");

    el.classList.remove("hidden");

    let n=3;

    el.textContent=n;

    const timer=setInterval(()=>{

        n--;

        if(n>0){

            el.textContent=n;

        }else{

            el.textContent="GO!";

            game.countdown=false;

            setTimeout(()=>{
                el.classList.add("hidden");
            },700);

            clearInterval(timer);

            startMusic();
        }

    },800);
}

function update(dt){

    if(!game.running || game.countdown) return;

    game.time+=dt;

    /* acceleration */

    const accelerating=
        keys.ArrowUp ||
        keys.KeyW;

    const braking=
        keys.ArrowDown ||
        keys.KeyS;

    if(accelerating){
        game.speed+=65*dt;
    }else{
        game.speed-=18*dt;
    }

    if(braking){
        game.speed-=85*dt;
    }

    game.speed=Math.max(
        35,
        Math.min(game.maxSpeed,game.speed)
    );

    /* steering */

    game.steer=0;

    if(keys.ArrowLeft || keys.KeyA){
        game.steer=-1;
    }

    if(keys.ArrowRight || keys.KeyD){
        game.steer=1;
    }

    game.playerX+=game.steer*5.5*dt;

    game.playerX=Math.max(
        -5.1,
        Math.min(5.1,game.playerX)
    );

    /* boost */

    if(
        (keys.Space || keys.ShiftLeft) &&
        game.boost<=0
    ){
        game.boost=.8;
    }

    if(game.boost>0){
        game.boost-=dt;
        game.speed=Math.min(
            125,
            game.speed+35
        );
    }

    /* jump */

    if(
        (keys.Space || keys.ArrowUp) &&
        game.jump===0
    ){
        game.jumpVel=7.5;
        game.jump=.01;
    }

    if(game.jump>0){

        game.jump+=game.jumpVel*dt;
        game.jumpVel-=17*dt;

        if(game.jump<=0){

            game.jump=0;
            game.jumpVel=0;
        }
    }

    /* distance */

    game.distance+=game.speed/3.6*dt;

    game.score+=
        game.speed*dt*.5+
        (game.boost>0?8:0);

    /* opponents */

    opponents.forEach(o=>{

        const catchUp=
            game.distance<1000
            ? 1.04
            : 1.0;

        o.progress+=
            o.speed*catchUp/3.6*dt;

        o.z=
            10+
            (game.distance-o.progress)*.72;

        /*
          keep opponents inside the road
        */

        if(Math.random()<dt*.35){
            o.x+=
                (Math.random()-.5)*.5;
        }

        o.x=Math.max(-5,Math.min(5,o.x));
    });

    if(game.distance>=FINISH){
        finishRace();
    }

    updateHUD();
}

function getPosition(){

    let pos=1;

    opponents.forEach(o=>{
        if(o.progress>game.distance){
            pos++;
        }
    });

    return pos;
}

function updateHUD(){

    document.getElementById("positionText").textContent=
        getPosition()+" / 6";

    document.getElementById("speedText").textContent=
        Math.round(game.speed);

    document.getElementById("distanceText").textContent=
        Math.min(FINISH,Math.round(game.distance));

    document.getElementById("scoreText").textContent=
        Math.round(game.score);

    document.getElementById("progressFill").style.width=
        Math.min(
            100,
            game.distance/FINISH*100
        )+"%";
}

function finishRace(){

    game.running=false;
    game.finished=true;

    stopMusic();

    document.getElementById("hud").classList.add("hidden");
    document.getElementById("mobileControls").classList.add("hidden");

    const pos=getPosition();

    document.getElementById("finishTitle").textContent=
        pos===1
        ? "🏆 Du hast gewonnen!"
        : "🏁 Rennen beendet!";

    document.getElementById("finishStats").innerHTML=
        `<b>Position:</b> ${pos} / 6<br>
         <b>Zeit:</b> ${game.time.toFixed(2)} s<br>
         <b>Score:</b> ${Math.round(game.score)}`;

    document.getElementById("finish").classList.remove("hidden");
}

/* ---------- RENDER ---------- */

function render(){

    ctx.clearRect(0,0,W,H);

    sky();
    road();
    drawCity();

    /*
      objects sorted by distance
      far -> near
    */

    const objects=[];

    opponents.forEach(o=>{
        objects.push({
            z:o.z,
            draw:()=>{
                drawSkater(
                    o.x,
                    o.z,
                    o.shirt,
                    o.board
                );
            }
        });
    });

    /*
      barriers
    */

    for(let z=35;z<FINISH;z+=85){

        const relative=
            z-game.distance;

        objects.push({
            z:relative,
            draw:()=>{
                drawBarrier(
                    Math.sin(z*.15)*4,
                    relative
                );
            }
        });
    }

    objects.push({
        z:7,
        draw:()=>{
            drawSkater(
                game.playerX,
                7,
                "#273e52",
                "#61d8ff",
                true
            );
        }
    });

    objects
        .filter(o=>o.z>1 && o.z<230)
        .sort((a,b)=>b.z-a.z)
        .forEach(o=>o.draw());

    /*
      speed lines
    */

    if(game.speed>95){

        ctx.strokeStyle="rgba(255,255,255,.16)";
        ctx.lineWidth=2;

        for(let i=0;i<18;i++){

            const x=Math.random()*W;

            ctx.beginPath();
            ctx.moveTo(x,H*.72);
            ctx.lineTo(x+(Math.random()-.5)*25,H);
            ctx.stroke();
        }
    }
}

/* ---------- MAIN LOOP ---------- */

let last=performance.now();

function loop(now){

    const dt=Math.min(
        .033,
        (now-last)/1000
    );

    last=now;

    update(dt);
    render();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* ---------- UI ---------- */

document.getElementById("startBtn").addEventListener(
    "click",
    ()=>{
        /*
          This click is intentionally where
          audio is unlocked.
        */
        if(!audioCtx){
            audioCtx=new (window.AudioContext||window.webkitAudioContext)();
        }

        if(audioCtx.state==="suspended"){
            audioCtx.resume();
        }

        resetRace();
    }
);

document.getElementById("againBtn").addEventListener(
    "click",
    ()=>{
        resetRace();
    }
);

document.getElementById("menuBtn").addEventListener(
    "click",
    ()=>{
        document.getElementById("finish").classList.add("hidden");
        document.getElementById("menu").classList.remove("hidden");
    }
);

document.getElementById("soundBtn").addEventListener(
    "click",
    ()=>{
        game.music=!game.music;

        document.getElementById("soundBtn").textContent=
            game.music
            ? "🎵 Musik: AN"
            : "🔇 Musik: AUS";

        if(game.music && game.running){
            startMusic();
        }else{
            stopMusic();
        }
    }
);

/* ---------- TOUCH ---------- */

function touchKey(button,code){

    const el=document.getElementById(button);

    el.addEventListener("pointerdown",e=>{
        e.preventDefault();
        keys[code]=true;
    });

    el.addEventListener("pointerup",e=>{
        e.preventDefault();
        keys[code]=false;
    });

    el.addEventListener("pointercancel",()=>{
        keys[code]=false;
    });

    el.addEventListener("pointerleave",()=>{
        keys[code]=false;
    });
}

touchKey("leftBtn","ArrowLeft");
touchKey("rightBtn","ArrowRight");
touchKey("jumpBtn","Space");
touchKey("boostBtn","ShiftLeft");

/* Prevent stuck controls */

addEventListener("blur",()=>{
    for(const k in keys){
        keys[k]=false;
    }
});

/*
  Initial state
*/

render();
</script>
