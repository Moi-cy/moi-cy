<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Moi-cy Street Rush</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101318;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
}

#menu{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(50,60,75,.35),transparent 45%),
    linear-gradient(145deg,#090b0f,#151a20 55%,#080a0d);
  z-index:20;
  color:white;
}

.menuBox{
  width:min(520px,90vw);
  padding:42px;
  border-radius:28px;
  background:rgba(20,24,30,.94);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 100px #000;
  text-align:center;
}

.logo{
  font-size:48px;
  font-weight:900;
  letter-spacing:-3px;
  margin-bottom:5px;
}

.logo span{
  color:#ff4d5a;
}

.subtitle{
  color:#9da5af;
  margin-bottom:32px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  margin:7px 0;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  color:white;
  background:#272e38;
  transition:.15s;
}

button:hover{
  transform:translateY(-2px);
  background:#353e4b;
}

#start{
  background:linear-gradient(135deg,#ff4554,#d91e38);
  box-shadow:0 8px 30px rgba(255,50,70,.25);
}

.controls{
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.1);
  color:#9da5af;
  font-size:13px;
  line-height:1.7;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10;
  display:none;
  color:white;
}

.hudTop{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.panel{
  background:rgba(8,10,13,.72);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:12px 17px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.place{
  font-size:29px;
  font-weight:900;
}

.small{
  color:#9da5af;
  font-size:12px;
}

.boost{
  width:180px;
  height:12px;
  background:#252b32;
  border-radius:20px;
  overflow:hidden;
  margin-top:7px;
}

.boostFill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#36d9ff,#fff45c,#ff6548);
}

.speed{
  font-size:24px;
  font-weight:900;
}

#message{
  position:absolute;
  left:50%;
  top:18%;
  transform:translateX(-50%);
  font-size:44px;
  font-weight:900;
  text-shadow:0 5px 25px #000;
  opacity:0;
  transition:.2s;
}

#finish{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(7px);
  z-index:30;
  color:white;
}

.finishBox{
  width:min(500px,90vw);
  background:#171b21;
  border-radius:25px;
  padding:38px;
  text-align:center;
  box-shadow:0 30px 100px #000;
}

.trophy{
  width:130px;
  height:130px;
  margin:0 auto 20px;
  position:relative;
}

.trophyCup{
  position:absolute;
  left:32px;
  top:15px;
  width:66px;
  height:70px;
  background:linear-gradient(135deg,#ff6673,#d91e38);
  clip-path:polygon(10% 0,90% 0,82% 65%,62% 85%,38% 85%,18% 65%);
}

.trophyCup:before,
.trophyCup:after{
  content:"";
  position:absolute;
  top:5px;
  width:35px;
  height:40px;
  border:8px solid #ff5361;
  border-radius:50%;
}

.trophyCup:before{left:-28px}
.trophyCup:after{right:-28px}

.trophyStem{
  position:absolute;
  width:18px;
  height:30px;
  left:56px;
  top:77px;
  background:#d91e38;
}

.trophyBase{
  position:absolute;
  width:75px;
  height:14px;
  left:27px;
  top:105px;
  border-radius:5px;
  background:#ff4555;
}

#countdown{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:15;
  color:white;
  font-size:120px;
  font-weight:900;
  text-shadow:0 10px 50px #000;
  pointer-events:none;
}

@media(max-width:600px){
  .logo{font-size:38px}
  .menuBox{padding:28px}
  #message{font-size:30px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
  <div class="menuBox">
    <div class="logo">Moi<span>-cy</span></div>
    <div class="subtitle">STREET RUSH · SKATE RACING</div>

    <button id="start">▶ RENNEN STARTEN</button>
    <button id="musicButton">♫ MUSIK: AN</button>

    <div class="controls">
      <b>STEUERUNG</b><br>
      ← → &nbsp; Lenken<br>
      SHIFT &nbsp; Boost benutzen<br>
      P &nbsp; Pause / Menü
      <br><br>
      Sammle ⚡ Boosts auf der Straße.
    </div>
  </div>
</div>

<div id="hud">
  <div class="hudTop">
    <div class="panel">
      <div class="small">POSITION</div>
      <div class="place" id="position">1 / 8</div>
      <div class="small">Runde <span id="lap">1</span> / 3</div>
    </div>

    <div class="panel">
      <div class="speed"><span id="speed">0</span> km/h</div>
      <div class="small">BOOST</div>
      <div class="boost">
        <div class="boostFill" id="boostFill"></div>
      </div>
    </div>
  </div>

  <div id="message"></div>
</div>

<div id="countdown">3</div>

<div id="finish">
  <div class="finishBox">
    <div class="trophy">
      <div class="trophyCup"></div>
      <div class="trophyStem"></div>
      <div class="trophyBase"></div>
    </div>

    <h1 id="finishTitle">Rennen gewonnen!</h1>
    <p id="finishText">Du hast die Street-Race-Challenge gewonnen.</p>
    <button id="again">↻ NOCHMAL FAHREN</button>
    <button id="backMenu">⌂ MENÜ</button>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   MOI-CY STREET RUSH
   Alles in einer Datei.
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* ---------------- AUDIO ---------------- */

let audioCtx=null;
let musicOn=true;
let musicTimer=null;

function startAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }

  if(musicOn && !musicTimer){
    startMusic();
  }
}

function startMusic(){
  if(musicTimer || !audioCtx || !musicOn)return;

  const notes=[110,146.83,164.81,196,220,164.81,146.83,130.81];
  let i=0;

  musicTimer=setInterval(()=>{
    if(!audioCtx || !musicOn)return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="triangle";
    osc.frequency.value=notes[i++%notes.length];

    gain.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.035,audioCtx.currentTime+.03);
    gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+.24);
  },240);
}

function stopMusic(){
  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer=null;
  }
}

function sound(freq=440,duration=.12,type="sine",volume=.04){
  if(!audioCtx)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(volume,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

/* ---------------- GAME STATE ---------------- */

let gameRunning=false;
let paused=false;
let countdown=false;
let gameTime=0;

const road={
  width:1100,
  laneWidth:110
};

const player={
  x:0,
  z:0,
  speed:0,
  targetSpeed:370,
  boost:0,
  boostActive:false,
  color:"#e83c4f",
  shirt:"#eeeeee",
  skin:"#c98d67",
  hair:"#242424"
};

const totalDistance=15000;

const opponents=[];

const colors=[
  "#e44d5b",
  "#3979e8",
  "#f3b93f",
  "#40bd75",
  "#a65ce8",
  "#ef7b32",
  "#3dbdc4"
];

for(let i=0;i<7;i++){

  opponents.push({
    id:i,
    x:(i%5-2)*115,
    z:180+i*230,
    speed:320+Math.random()*80,
    baseSpeed:320+Math.random()*80,
    color:colors[i],
    shirt:"#f0f0f0",
    skin:["#b87954","#c98d67","#8e5b43","#d6a078"][i%4],
    hair:["#171717","#552f20","#202020","#d5b06c"][i%4],
    wobble:Math.random()*10,
    skill:.75+Math.random()*.35
  });
}

let scenery=[];
let boosts=[];
let roadSigns=[];

/* ---------------- WORLD GENERATION ---------------- */

function random(min,max){
  return Math.random()*(max-min)+min;
}

function generateWorld(){

  scenery=[];
  boosts=[];
  roadSigns=[];

  /*
    Gebäude werden sehr dicht gesetzt.
    Dadurch gibt es keine große leere Fläche
    und die Straße bleibt klar erkennbar.
  */

  for(let z=0;z<totalDistance+5000;z+=190){

    const blockGap=random(15,45);

    // linke Gebäudeseite
    scenery.push({
      z:z+random(-20,20),
      side:-1,
      x:random(750,1050),
      width:random(150,250),
      height:random(180,430),
      depth:random(100,180),
      type:Math.random()<.45?"shop":"building",
      color:["#777b82","#9b806d","#626d78","#a08f78","#72777d"][Math.floor(random(0,5))],
      windows:Math.floor(random(2,5))
    });

    // zweites Gebäude links
    scenery.push({
      z:z+random(70,150),
      side:-1,
      x:random(820,1150),
      width:random(130,230),
      height:random(160,390),
      depth:random(90,170),
      type:"building",
      color:["#6d7379","#8a7769","#747d83","#8f8c7d"][Math.floor(random(0,4))],
      windows:Math.floor(random(2,5))
    });

    // rechte Seite
    scenery.push({
      z:z+random(-20,20),
      side:1,
      x:random(750,1050),
      width:random(150,250),
      height:random(180,430),
      depth:random(100,180),
      type:Math.random()<.45?"shop":"building",
      color:["#747a81","#947b69","#65707b","#9b8972","#70757a"][Math.floor(random(0,5))],
      windows:Math.floor(random(2,5))
    });

    // zweites Gebäude rechts
    scenery.push({
      z:z+random(70,150),
      side:1,
      x:random(820,1150),
      width:random(130,230),
      height:random(160,390),
      depth:random(90,170),
      type:"building",
      color:["#6c7279","#8c7566","#727c82","#918979"][Math.floor(random(0,4))],
      windows:Math.floor(random(2,5))
    });

    // Grünflächen hinter den Gebäuden
    scenery.push({
      z:z+random(0,80),
      side:-1,
      x:random(1150,1550),
      width:random(400,650),
      height:0,
      depth:300,
      type:"treearea"
    });

    scenery.push({
      z:z+random(0,80),
      side:1,
      x:random(1150,1550),
      width:random(400,650),
      height:0,
      depth:300,
      type:"treearea"
    });
  }

  // Boosts
  for(let z=400;z<totalDistance-300;z+=random(700,1000)){
    boosts.push({
      z,
      x:random(-250,250),
      taken:false
    });
  }

  // Straßenschilder
  for(let z=300;z<totalDistance;z+=850){
    roadSigns.push({
      z,
      side:Math.random()<.5?-1:1
    });
  }
}

generateWorld();

/* ---------------- INPUT ---------------- */

const keys={};

addEventListener("keydown",e=>{
  keys[e.key]=true;

  if([
    "ArrowLeft",
    "ArrowRight",
    "ArrowUp",
    "ArrowDown",
    " "
  ].includes(e.key)){
    e.preventDefault();
  }

  if(e.key==="Shift"){
    activateBoost();
  }

  if(e.key.toLowerCase()==="p"){
    if(gameRunning){
      paused=!paused;
      if(paused){
        showMessage("PAUSE");
      }
    }
  }
});

addEventListener("keyup",e=>{
  keys[e.key]=false;
});

/*
  WICHTIG:
  Links und rechts werden direkt auf x angewendet.
  Kein invertiertes Koordinatensystem mehr.
*/

function steering(){

  let direction=0;

  if(keys["ArrowLeft"] || keys["a"]){
    direction=-1;
  }

  if(keys["ArrowRight"] || keys["d"]){
    direction=1;
  }

  player.x+=direction*8.5;

  player.x=Math.max(
    -road.width/2+55,
    Math.min(road.width/2-55,player.x)
  );
}

/* ---------------- BOOST ---------------- */

function activateBoost(){

  if(!gameRunning || paused)return;

  if(player.boost>=100 && !player.boostActive){

    player.boostActive=true;
    player.boost=0;

    sound(700,.12,"square",.07);

    setTimeout(()=>{
      player.boostActive=false;
    },3200);
  }
}

/* ---------------- CAMERA / PROJECTION ---------------- */

const camera={
  height:115,
  y:0
};

function project(x,z){

  const relative=z-player.z;

  if(relative<5)return null;

  const fov=700;
  const scale=fov/relative;

  const horizon=H*.42;

  return {
    x:W/2+x*scale,
    y:horizon+camera.height*scale,
    scale
  };
}

/* ---------------- DRAW SKY ---------------- */

function drawSky(){

  const g=ctx.createLinearGradient(0,0,0,H*.5);

  g.addColorStop(0,"#8db1d0");
  g.addColorStop(.55,"#b9c9d5");
  g.addColorStop(1,"#d9ddd8");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // entfernte Häuser-Silhouetten
  ctx.fillStyle="rgba(70,78,83,.28)";

  for(let i=0;i<30;i++){

    const x=i*(W/25)-100;
    const h=30+(i*17%80);

    ctx.fillRect(
      x,
      H*.42-h,
      100,
      h
    );
  }
}

/* ---------------- DRAW GROUND ---------------- */

function drawGround(){

  ctx.fillStyle="#4d6647";
  ctx.fillRect(0,H*.42,W,H*.58);

  // leichte Grasstreifen
  ctx.fillStyle="#58734e";

  for(let i=0;i<15;i++){

    ctx.fillRect(
      0,
      H*.42+i*35,
      W,
      1
    );
  }
}

/* ---------------- ROAD ---------------- */

function roadWidthAt(y){

  const horizon=H*.42;
  const t=Math.max(0,Math.min(1,(y-horizon)/(H-horizon)));

  return 80+t*(W*.62);
}

function drawRoad(){

  const horizon=H*.42;

  ctx.beginPath();
  ctx.moveTo(W/2-35,horizon);
  ctx.lineTo(W/2+35,horizon);
  ctx.lineTo(W/2+W*.44,H);
  ctx.lineTo(W/2-W*.44,H);
  ctx.closePath();

  ctx.fillStyle="#4a4d50";
  ctx.fill();

  // Asphaltstruktur
  ctx.save();
  ctx.globalAlpha=.12;

  for(let i=0;i<90;i++){

    const y=horizon+Math.random()*(H-horizon);

    ctx.fillStyle="#d7d7d7";
    ctx.fillRect(
      Math.random()*W,
      y,
      Math.random()*2+1,
      1
    );
  }

  ctx.restore();

  // Straßenränder
  ctx.strokeStyle="#d8d8d0";
  ctx.lineWidth=5;

  ctx.beginPath();
  ctx.moveTo(W/2-35,horizon);
  ctx.lineTo(W/2-W*.44,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W/2+35,horizon);
  ctx.lineTo(W/2+W*.44,H);
  ctx.stroke();

  // Mittelmarkierung
  for(let z=Math.floor(player.z/80)*80;z<player.z+1800;z+=160){

    const p1=project(0,z);
    const p2=project(0,z+65);

    if(!p1||!p2)continue;

    ctx.strokeStyle="#e4e0c7";
    ctx.lineWidth=Math.max(1,5*p1.scale);

    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.stroke();
  }

  // Querfugen / Fahrbahnmarkierungen
  for(let z=Math.floor(player.z/420)*420;z<player.z+2500;z+=420){

    const p=project(0,z);
    if(!p)continue;

    const width=roadWidthAt(p.y);

    ctx.strokeStyle="rgba(220,220,215,.28)";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(W/2-width*.46,p.y);
    ctx.lineTo(W/2+width*.46,p.y);
    ctx.stroke();
  }
}

/* ---------------- BUILDINGS ---------------- */

function drawBuilding(obj){

  const p=project(
    obj.side*obj.x,
    obj.z
  );

  if(!p)return;

  const s=p.scale;

  if(s<.025)return;

  const w=obj.width*s;
  const h=obj.height*s;

  const x=p.x-(obj.side<0?w:0);
  const y=p.y-h;

  /*
    Vollständig deckender Körper.
    Keine transparenten Gebäude.
  */

  ctx.fillStyle=obj.color;
  ctx.fillRect(x,y,w,h);

  // Seitenfläche für 3D-Effekt
  const sideDepth=30*s;

  ctx.fillStyle="rgba(30,34,38,.35)";

  if(obj.side<0){
    ctx.fillRect(x+w,y,w*.13,h);
  }else{
    ctx.fillRect(x-sideDepth,y,sideDepth,h);
  }

  // Dach
  ctx.fillStyle="rgba(35,38,41,.65)";
  ctx.fillRect(x,y,w,Math.max(2,7*s));

  // Fenster
  const cols=Math.max(2,obj.windows);
  const rows=Math.max(2,Math.floor(obj.height/90));

  const gap=12*s;

  const fw=Math.max(3,(w-gap*(cols+1))/cols);
  const fh=Math.max(4,(h-gap*(rows+1))/rows);

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){

      const wx=x+gap+c*(fw+gap);
      const wy=y+gap+r*(fh+gap);

      ctx.fillStyle=
        (r+c)%4===0
        ?"#d9c27e"
        :"#26343d";

      ctx.fillRect(wx,wy,fw,fh);

      ctx.strokeStyle="rgba(0,0,0,.2)";
      ctx.lineWidth=1;
      ctx.strokeRect(wx,wy,fw,fh);
    }
  }

  // Eingang
  if(s>.12){

    ctx.fillStyle="#292b2e";

    ctx.fillRect(
      x+w*.42,
      y+h*.72,
      w*.16,
      h*.28
    );
  }

  // Shop-Markise
  if(obj.type==="shop" && s>.07){

    ctx.fillStyle="#d04a4f";
    ctx.fillRect(
      x+w*.18,
      y+h*.34,
      w*.64,
      h*.07
    );
  }
}

/* ---------------- TREES / GREEN ---------------- */

function drawTree(obj){

  const p=project(
    obj.side*obj.x,
    obj.z
  );

  if(!p)return;

  const s=p.scale;

  if(s<.02)return;

  const trunk=55*s;
  const h=300*s;

  ctx.fillStyle="#554332";

  ctx.fillRect(
    p.x-trunk*.18,
    p.y-h*.42,
    trunk*.36,
    h*.42
  );

  ctx.fillStyle="#314d32";

  ctx.beginPath();
  ctx.arc(
    p.x,
    p.y-h*.55,
    75*s,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.fillStyle="#3e633c";

  ctx.beginPath();
  ctx.arc(
    p.x-35*s,
    p.y-h*.45,
    55*s,
    0,
    Math.PI*2
  );
  ctx.fill();
}

/* ---------------- SKATEBOARD ---------------- */

function drawSkateboard(x,y,s,rotation=0){

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rotation);

  const deckW=Math.max(15,105*s);
  const deckH=Math.max(3,10*s);

  // Deck
  ctx.fillStyle="#24272b";
  ctx.beginPath();

  ctx.roundRect(
    -deckW/2,
    -deckH/2,
    deckW,
    deckH,
    deckH/2
  );

  ctx.fill();

  // Nose
  ctx.fillStyle="#555b61";

  ctx.beginPath();
  ctx.arc(
    -deckW/2,
    0,
    deckH*.5,
    0,
    Math.PI*2
  );
  ctx.fill();

  // Trucks
  ctx.strokeStyle="#a9adb0";
  ctx.lineWidth=Math.max(1,3*s);

  ctx.beginPath();
  ctx.moveTo(-deckW*.22,deckH*.5);
  ctx.lineTo(-deckW*.22,deckH*1.3);
  ctx.moveTo(deckW*.22,deckH*.5);
  ctx.lineTo(deckW*.22,deckH*1.3);
  ctx.stroke();

  // wheels
  const wheelR=Math.max(3,9*s);

  for(const wx of [-deckW*.25,deckW*.25]){

    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.arc(wx,deckH*1.55,wheelR,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#777";

    ctx.beginPath();
    ctx.arc(wx,deckH*1.55,wheelR*.35,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

/* ---------------- RIDER ---------------- */

function drawRider(rider,isPlayer=false){

  const p=project(rider.x,rider.z);

  if(!p)return;

  const s=Math.min(1.4,p.scale);

  if(s<.045)return;

  const x=p.x;
  const y=p.y;

  const bodyH=125*s;
  const headR=23*s;

  /*
    Skateboard unter dem Fahrer,
    nicht seitlich schwebend.
  */

  drawSkateboard(
    x,
    y+9*s,
    s*.95,
    0
  );

  // Beine
  ctx.strokeStyle=rider.skin;
  ctx.lineWidth=Math.max(4,13*s);
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(x-9*s,y-bodyH*.2);
  ctx.lineTo(x-23*s,y+3*s);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x+8*s,y-bodyH*.2);
  ctx.lineTo(x+22*s,y+3*s);
  ctx.stroke();

  // Körper
  ctx.fillStyle=rider.shirt;

  ctx.beginPath();

  ctx.roundRect(
    x-27*s,
    y-bodyH*.72,
    54*s,
    58*s,
    10*s
  );

  ctx.fill();

  // Moi-cy Shirt
  ctx.fillStyle="#151515";

  ctx.font=`900 ${Math.max(7,15*s)}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "Moi-cy",
    x,
    y-bodyH*.44
  );

  // Arme
  ctx.strokeStyle=rider.skin;
  ctx.lineWidth=Math.max(4,11*s);

  ctx.beginPath();
  ctx.moveTo(x-23*s,y-bodyH*.62);
  ctx.lineTo(x-42*s,y-bodyH*.28);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x+23*s,y-bodyH*.62);
  ctx.lineTo(x+42*s,y-bodyH*.28);
  ctx.stroke();

  // Hals
  ctx.fillStyle=rider.skin;

  ctx.fillRect(
    x-7*s,
    y-bodyH*.82,
    14*s,
    13*s
  );

  // Kopf
  ctx.fillStyle=rider.skin;

  ctx.beginPath();
  ctx.arc(
    x,
    y-bodyH*.95,
    headR,
    0,
    Math.PI*2
  );
  ctx.fill();

  // Haare
  ctx.fillStyle=rider.hair;

  ctx.beginPath();
  ctx.arc(
    x,
    y-bodyH*1.03,
    headR*.95,
    Math.PI,
    Math.PI*2
  );
  ctx.fill();

  // Gesicht
  ctx.fillStyle="#171717";

  ctx.beginPath();
  ctx.arc(
    x-7*s,
    y-bodyH*.96,
    2.2*s,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    x+7*s,
    y-bodyH*.96,
    2.2*s,
    0,
    Math.PI*2
  );
  ctx.fill();

  // Schatten
  ctx.fillStyle="rgba(0,0,0,.25)";

  ctx.beginPath();
  ctx.ellipse(
    x,
    y+15*s,
    55*s,
    10*s,
    0,
    0,
    Math.PI*2
  );
  ctx.fill();

  if(isPlayer){

    ctx.strokeStyle="#ff4555";
    ctx.lineWidth=Math.max(2,4*s);

    ctx.beginPath();
    ctx.arc(
      x,
      y-bodyH*.95,
      headR+7*s,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }
}

/* ---------------- BOOST ITEMS ---------------- */

function drawBoost(item){

  if(item.taken)return;

  const p=project(item.x,item.z);

  if(!p)return;

  const s=p.scale;

  if(s<.035)return;

  const size=25*s;

  ctx.save();

  ctx.translate(p.x,p.y-50*s);

  ctx.rotate(gameTime*2);

  ctx.fillStyle="#fff25a";

  ctx.shadowColor="#ffe600";
  ctx.shadowBlur=20*s;

  ctx.beginPath();
  ctx.moveTo(0,-size);
  ctx.lineTo(size*.45,-size*.15);
  ctx.lineTo(size*.12,-size*.15);
  ctx.lineTo(size*.55,size);
  ctx.lineTo(-size*.25,size*.15);
  ctx.lineTo(-size*.05,size*.15);
  ctx.closePath();

  ctx.fill();

  ctx.restore();
}

/* ---------------- SIGNS ---------------- */

function drawSign(sign){

  const p=project(
    sign.side*600,
    sign.z
  );

  if(!p)return;

  const s=p.scale;

  if(s<.03)return;

  ctx.strokeStyle="#3e454a";
  ctx.lineWidth=Math.max(2,7*s);

  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
  ctx.lineTo(p.x,p.y-160*s);
  ctx.stroke();

  ctx.fillStyle="#f0f0e8";

  ctx.beginPath();

  ctx.roundRect(
    p.x-45*s,
    p.y-190*s,
    90*s,
    55*s,
    5*s
  );

  ctx.fill();

  ctx.fillStyle="#c93242";

  ctx.font=`900 ${Math.max(5,22*s)}px Arial`;
  ctx.textAlign="center";

  ctx.fillText(
    "SKATE",
    p.x,
    p.y-157*s
  );
}

/* ---------------- FINISH LINE ---------------- */

function drawFinishLine(){

  const finishZ=totalDistance;

  for(let z=finishZ;z<finishZ+700;z+=70){

    const p=project(0,z);

    if(!p)continue;

    const width=roadWidthAt(p.y);

    ctx.fillStyle=
      Math.floor(z/70)%2===0
      ?"#f4f4f4"
      :"#202020";

    ctx.fillRect(
      W/2-width*.45,
      p.y,
      width*.9,
      Math.max(2,25*p.scale)
    );
  }

  // Banner
  const p=project(0,finishZ);

  if(p){

    const s=p.scale;

    ctx.strokeStyle="#333";
    ctx.lineWidth=Math.max(2,8*s);

    ctx.beginPath();
    ctx.moveTo(p.x-330*s,p.y);
    ctx.lineTo(p.x-330*s,p.y-240*s);
    ctx.moveTo(p.x+330*s,p.y);
    ctx.lineTo(p.x+330*s,p.y-240*s);
    ctx.stroke();

    ctx.fillStyle="#e83d4d";

    ctx.fillRect(
      p.x-330*s,
      p.y-240*s,
      660*s,
      55*s
    );

    ctx.fillStyle="#fff";

    ctx.font=`900 ${Math.max(7,28*s)}px Arial`;
    ctx.textAlign="center";

    ctx.fillText(
      "MOI-CY FINISH",
      p.x,
      p.y-203*s
    );
  }
}

/* ---------------- WORLD DRAW ---------------- */

function drawWorld(){

  drawSky();
  drawGround();
  drawRoad();

  const visible=[];

  for(const obj of scenery){

    if(
      obj.z>player.z+30 &&
      obj.z<player.z+2300
    ){
      visible.push(obj);
    }
  }

  visible.sort((a,b)=>b.z-a.z);

  for(const obj of visible){

    if(obj.type==="treearea"){

      for(let i=0;i<5;i++){

        const fake={
          z:obj.z+i*50,
          side:obj.side,
          x:obj.x+random(-180,180)
        };

        drawTree(fake);
      }

    }else{

      drawBuilding(obj);
    }
  }

  for(const sign of roadSigns){
    if(sign.z>player.z && sign.z<player.z+2200){
      drawSign(sign);
    }
  }

  for(const item of boosts){
    if(
      !item.taken &&
      item.z>player.z &&
      item.z<player.z+1800
    ){
      drawBoost(item);
    }
  }

  drawFinishLine();

  // Fahrer von hinten nach vorne zeichnen
  const racers=[
    ...opponents,
    {
      ...player,
      z:player.z,
      isPlayer:true
    }
  ];

  racers
    .filter(r=>r.z>player.z-10 && r.z<player.z+1800)
    .sort((a,b)=>b.z-a.z)
    .forEach(r=>drawRider(r,r.isPlayer===true));
}

/* ---------------- COLLISION ---------------- */

function checkBoosts(){

  for(const b of boosts){

    if(
      !b.taken &&
      Math.abs(b.z-player.z)<35 &&
      Math.abs(b.x-player.x)<75
    ){

      b.taken=true;
      player.boost=Math.min(100,player.boost+50);

      sound(900,.15,"sine",.08);

      showMessage("⚡ BOOST!");
    }
  }
}

function checkRacers(){

  for(const r of opponents){

    const dz=Math.abs(r.z-player.z);
    const dx=Math.abs(r.x-player.x);

    if(dz<45 && dx<75){

      if(player.x<r.x){
        r.x+=35;
      }else{
        r.x-=35;
      }

      player.speed*=.94;

      sound(100,.08,"sawtooth",.025);
    }
  }
}

/* ---------------- AI ---------------- */

function updateAI(dt){

  for(const r of opponents){

    /*
      Die Gegner können vor, neben und hinter
      dem Spieler bleiben.
    */

    const difficulty=
      1+
      Math.min(gameTime/70,.16);

    r.speed=
      r.baseSpeed*
      difficulty*
      r.skill;

    // leichtes Ausweichen
    r.wobble+=dt*(.7+r.skill);

    r.x+=Math.sin(r.wobble)*dt*9;

    r.x=Math.max(
      -road.width/2+45,
      Math.min(road.width/2-45,r.x)
    );

    r.z+=r.speed*dt;

    /*
      Wenn Gegner weit zurückfallen,
      bekommen sie einen kleinen Catch-up,
      aber keinen unfairen Teleport.
    */

    if(r.z<player.z-1200){
      r.z+=r.speed*dt*1.35;
    }
  }
}

/* ---------------- PLAYER ---------------- */

function updatePlayer(dt){

  steering();

  let desired=player.targetSpeed;

  if(keys["ArrowUp"]){
    desired+=45;
  }

  if(keys["ArrowDown"]){
    desired-=80;
  }

  if(player.boostActive){
    desired+=250;
  }

  player.speed+=(desired-player.speed)*dt*2.5;

  player.speed=Math.max(80,player.speed);

  player.z+=player.speed*dt;

  checkBoosts();
  checkRacers();
}

/* ---------------- POSITION ---------------- */

function getPosition(){

  let pos=1;

  for(const r of opponents){

    if(r.z>player.z){
      pos++;
    }
  }

  return Math.min(8,pos);
}

/* ---------------- HUD ---------------- */

function updateHUD(){

  const pos=getPosition();

  document.getElementById("position").textContent=
    pos+" / 8";

  document.getElementById("speed").textContent=
    Math.round(player.speed*.42);

  document.getElementById("boostFill").style.width=
    player.boost+"%";

  document.getElementById("lap").textContent=
    Math.min(
      3,
      Math.floor(player.z/(totalDistance/3))+1
    );
}

/* ---------------- MESSAGE ---------------- */

let messageTimer=null;

function showMessage(text){

  const el=document.getElementById("message");

  el.textContent=text;
  el.style.opacity="1";

  clearTimeout(messageTimer);

  messageTimer=setTimeout(()=>{
    el.style.opacity="0";
  },1100);
}

/* ---------------- COUNTDOWN ---------------- */

function startCountdown(){

  countdown=true;

  const el=document.getElementById("countdown");

  el.style.display="flex";

  let n=3;

  el.textContent=n;

  const timer=setInterval(()=>{

    n--;

    if(n>0){

      el.textContent=n;
      sound(400,.12,"square",.06);

    }else{

      el.textContent="GO!";

      sound(850,.2,"square",.07);

      setTimeout(()=>{
        el.style.display="none";
        countdown=false;
      },650);

      clearInterval(timer);
    }

  },850);
}

/* ---------------- FINISH ---------------- */

function finishRace(){

  gameRunning=false;

  document.getElementById("hud").style.display="none";
  document.getElementById("finish").style.display="flex";

  const pos=getPosition();

  if(pos===1){

    document.getElementById("finishTitle").textContent=
      "🏆 Rennen gewonnen!";

    document.getElementById("finishText").textContent=
      "Dein Moi-cy-Pokal gehört dir.";
    
    sound(880,.18,"triangle",.08);

    setTimeout(()=>{
      sound(1100,.25,"triangle",.08);
    },180);

  }else{

    document.getElementById("finishTitle").textContent=
      "Ziel erreicht!";

    document.getElementById("finishText").textContent=
      "Du bist auf Platz "+pos+" gelandet.";
  }
}

/* ---------------- RESET ---------------- */

function resetRace(){

  player.x=0;
  player.z=0;
  player.speed=370;
  player.boost=0;
  player.boostActive=false;

  opponents.forEach((r,i)=>{

    r.x=(i%5-2)*115;
    r.z=180+i*230;

    r.baseSpeed=
      325+
      Math.random()*75;

    r.speed=r.baseSpeed;
  });

  boosts.forEach(b=>b.taken=false);

  gameTime=0;
}

/* ---------------- LOOP ---------------- */

let last=performance.now();

function loop(now){

  const dt=Math.min(
    .035,
    (now-last)/1000
  );

  last=now;

  if(gameRunning && !paused && !countdown){

    gameTime+=dt;

    updatePlayer(dt);
    updateAI(dt);

    if(player.z>=totalDistance){
      finishRace();
    }

    updateHUD();
  }

  drawWorld();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* ---------------- MENU ---------------- */

document.getElementById("start").addEventListener("click",()=>{

  startAudio();

  resetRace();

  document.getElementById("menu").style.display="none";
  document.getElementById("finish").style.display="none";
  document.getElementById("hud").style.display="block";

  gameRunning=true;
  paused=false;

  startCountdown();
});

document.getElementById("again").addEventListener("click",()=>{

  startAudio();

  resetRace();

  document.getElementById("finish").style.display="none";
  document.getElementById("hud").style.display="block";

  gameRunning=true;
  paused=false;

  startCountdown();
});

document.getElementById("backMenu").addEventListener("click",()=>{

  gameRunning=false;

  document.getElementById("finish").style.display="none";
  document.getElementById("hud").style.display="none";
  document.getElementById("menu").style.display="flex";
});

document.getElementById("musicButton").addEventListener("click",()=>{

  musicOn=!musicOn;

  const btn=document.getElementById("musicButton");

  btn.textContent=
    musicOn
    ? "♫ MUSIK: AN"
    : "♫ MUSIK: AUS";

  if(musicOn){

    startAudio();
    startMusic();

  }else{

    stopMusic();
  }
});

/* ---------------- INITIAL ---------------- */

player.speed=370;

/*
  Damit beim ersten Laden bereits eine
  sichtbare Welt vorhanden ist.
*/

drawWorld();

</script>
