<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Moi-cy Skate Rush</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #12072b;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    touch-action: none;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    top: 16px;
    left: 18px;
    right: 18px;
    z-index: 20;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    pointer-events: none;
}

.logo {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 1000;
    font-style: italic;
    letter-spacing: -3px;

    transform: rotate(-5deg);

    text-shadow:
        4px 4px 0 #ff2991,
        8px 8px 0 #4021ad;
}

.logo span {
    color: #fff06a;
}

.stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.stat {
    min-width: 90px;

    padding: 8px 13px;

    border: 2px solid rgba(255,255,255,.85);
    border-radius: 16px;

    background: rgba(24, 8, 52, .65);
    backdrop-filter: blur(10px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.18);
}

.stat small {
    display: block;
    font-size: 9px;
    opacity: .7;
    letter-spacing: 1px;
}

.stat strong {
    display: block;
    margin-top: 2px;
    font-size: 18px;
}

/* =========================
   COMBO
========================= */

#comboBox {
    position: fixed;
    top: 115px;
    left: 50%;

    transform:
        translateX(-50%)
        scale(.7);

    opacity: 0;

    z-index: 25;
    pointer-events: none;

    text-align: center;

    transition:
        transform .18s ease,
        opacity .18s ease;
}

#comboBox.show {
    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);
}

#comboText {
    font-size: clamp(35px, 8vw, 75px);
    font-weight: 1000;
    font-style: italic;

    text-shadow:
        5px 5px 0 #ff2390,
        9px 9px 0 #4421b9;
}

#comboPoints {
    color: #fff16b;
    font-size: 20px;
    font-weight: 900;
}

/* =========================
   TRICK POPUP
========================= */

#trickPopup {
    position: fixed;

    left: 50%;
    top: 43%;

    transform:
        translate(-50%, -50%)
        scale(.5)
        rotate(-6deg);

    opacity: 0;

    z-index: 30;

    pointer-events: none;

    font-size: clamp(28px, 7vw, 70px);
    font-weight: 1000;
    font-style: italic;

    color: #fff36b;

    text-shadow:
        4px 4px 0 #ff268e,
        8px 8px 0 #4220b8;

    transition:
        opacity .15s,
        transform .4s;
}

/* =========================
   PROGRESS
========================= */

.progressWrap {
    position: fixed;

    left: 50%;
    bottom: 17px;

    transform: translateX(-50%);

    width: min(430px, 48vw);
    height: 8px;

    border-radius: 999px;

    background: rgba(255,255,255,.2);

    overflow: hidden;

    z-index: 20;

    pointer-events: none;
}

.progressBar {
    height: 100%;
    width: 0%;

    background: #fff36b;

    box-shadow:
        0 0 15px #fff36b;
}

/* =========================
   MENU
========================= */

#menu {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.16),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            rgba(25,5,55,.25),
            rgba(255,45,140,.18)
        );
}

.menuCard {
    width: min(600px, 94vw);

    padding: 38px 30px;

    text-align: center;

    border: 3px solid rgba(255,255,255,.9);
    border-radius: 32px;

    background: rgba(20, 6, 47, .82);

    backdrop-filter: blur(18px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.35),
        0 0 50px rgba(255,45,150,.2);
}

.menuTitle {
    font-size: clamp(50px, 11vw, 90px);
    line-height: .82;

    font-weight: 1000;
    font-style: italic;

    transform: rotate(-5deg);

    margin-bottom: 18px;

    text-shadow:
        6px 6px 0 #ff2d91,
        11px 11px 0 #4422b7;
}

.menuTitle span {
    color: #fff36b;
}

.subtitle {
    margin-bottom: 26px;

    font-size: 18px;
    opacity: .85;
}

.playButton {
    border: 0;

    padding: 17px 38px;

    border-radius: 999px;

    background:
        linear-gradient(
            135deg,
            #ff2d91,
            #7136ff
        );

    color: white;

    font-size: 21px;
    font-weight: 1000;

    cursor: pointer;

    box-shadow:
        0 7px 0 #311565,
        0 15px 35px rgba(255,40,150,.3);

    transition: .15s;
}

.playButton:hover {
    transform: translateY(-3px) scale(1.03);
}

.playButton:active {
    transform: translateY(5px);

    box-shadow:
        0 2px 0 #311565;
}

.controls {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;

    margin-top: 30px;
}

.control {
    padding: 11px 5px;

    border-radius: 15px;

    background: rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.12);

    font-size: 11px;
}

.control b {
    display: block;

    margin-bottom: 4px;

    color: #fff36b;

    font-size: 17px;
}

/* =========================
   GAME OVER
========================= */

#gameOver {
    position: fixed;
    inset: 0;

    z-index: 110;

    display: none;

    justify-content: center;
    align-items: center;

    background: rgba(17,4,38,.7);

    backdrop-filter: blur(10px);
}

.overCard {
    width: min(500px, 90vw);

    padding: 36px;

    text-align: center;

    border: 3px solid white;
    border-radius: 30px;

    background:
        rgba(23,7,50,.92);

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);
}

.overCard h2 {
    font-size: clamp(40px, 10vw, 62px);

    font-style: italic;

    color: #ff4b9f;

    text-shadow:
        4px 4px 0 #4220b4;
}

.finalScore {
    margin: 18px 0 25px;

    font-size: 23px;
}

/* =========================
   MOBILE BUTTONS
========================= */

.mobileControls {
    position: fixed;

    left: 18px;
    right: 18px;
    bottom: 25px;

    z-index: 50;

    display: flex;
    justify-content: space-between;

    pointer-events: none;
}

.mobileGroup {
    display: flex;
    gap: 9px;
}

.touchBtn {
    width: 64px;
    height: 64px;

    border: 2px solid rgba(255,255,255,.7);
    border-radius: 20px;

    background:
        rgba(25,8,52,.65);

    color: white;

    font-size: 24px;
    font-weight: 1000;

    backdrop-filter: blur(10px);

    pointer-events: auto;
}

.touchBtn:active {
    transform: scale(.88);

    background: #ff3193;
}

@media (min-width: 850px) {
    .mobileControls {
        opacity: .22;
    }
}

/* =========================
   SMALL SCREENS
========================= */

@media (max-width: 600px) {

    #hud {
        top: 10px;
        left: 10px;
        right: 10px;
    }

    .stats {
        gap: 5px;
    }

    .stat {
        min-width: 66px;
        padding: 6px 8px;
    }

    .stat small {
        font-size: 7px;
    }

    .stat strong {
        font-size: 14px;
    }

    .logo {
        font-size: 28px;
    }

    .controls {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .progressWrap {
        width: 42vw;
        bottom: 105px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- ================= HUD ================= -->

<div id="hud">

    <div class="logo">
        Moi-<span>cy</span>
    </div>

    <div class="stats">

        <div class="stat">
            <small>SCORE</small>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <small>COMBO</small>
            <strong id="combo">x1</strong>
        </div>

        <div class="stat">
            <small>DISTANZ</small>
            <strong id="distance">0m</strong>
        </div>

    </div>

</div>

<!-- ================= COMBO ================= -->

<div id="comboBox">

    <div id="comboText">
        COMBO!
    </div>

    <div id="comboPoints">
        +0
    </div>

</div>

<div id="trickPopup"></div>

<!-- ================= PROGRESS ================= -->

<div class="progressWrap">
    <div
        class="progressBar"
        id="progressBar">
    </div>
</div>

<!-- ================= MENU ================= -->

<div id="menu">

    <div class="menuCard">

        <div class="menuTitle">
            MOI-<span>CY</span><br>
            SKATE
        </div>

        <div class="subtitle">
            Skate. Trick. Combo. Repeat. 🛹
        </div>

        <button
            class="playButton"
            onclick="startGame()">

            🛹 START SKATING

        </button>

        <div class="controls">

            <div class="control">
                <b>← →</b>
                Spur wechseln
            </div>

            <div class="control">
                <b>SPACE</b>
                Springen
            </div>

            <div class="control">
                <b>F</b>
                Trick
            </div>

            <div class="control">
                <b>R</b>
                Neustart
            </div>

        </div>

    </div>

</div>

<!-- ================= GAME OVER ================= -->

<div id="gameOver">

    <div class="overCard">

        <h2>
            WIPEOUT! 💥
        </h2>

        <div class="finalScore">
            Score:
            <strong id="finalScore">
                0
            </strong>
        </div>

        <button
            class="playButton"
            onclick="restartGame()">

            🔥 NOCHMAL!

        </button>

    </div>

</div>

<!-- ================= MOBILE ================= -->

<div class="mobileControls">

    <div class="mobileGroup">

        <button
            class="touchBtn"
            id="leftBtn">
            ←
        </button>

        <button
            class="touchBtn"
            id="rightBtn">
            →
        </button>

    </div>

    <div class="mobileGroup">

        <button
            class="touchBtn"
            id="jumpBtn">
            ⬆
        </button>

        <button
            class="touchBtn"
            id="trickBtn">
            ★
        </button>

    </div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W;
let H;

function resize() {

    W = innerWidth;
    H = innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   GAME STATE
========================================================= */

let playing = false;
let gameOver = false;

let score = 0;
let distance = 0;

let combo = 1;
let comboTimer = 0;

let speed = 7;

let lane = 1;
let targetLane = 1;

/*
    WICHTIG:

    playerHeight = echte Höhe des Skaters
    0 = Boden
    100 = hoch in der Luft

    Dadurch bewegt sich der Skater beim Springen
    eindeutig NACH OBEN.
*/

let playerHeight = 0;
let verticalVelocity = 0;

let grounded = true;

let rotation = 0;
let trickActive = false;

let objects = [];
let coins = [];
let particles = [];

let spawnTimer = 0;
let coinTimer = 0;


/* =========================================================
   COLORS
========================================================= */

const colors = [
    "#ff3c9d",
    "#ffdb4d",
    "#6b5cff",
    "#35e0bd",
    "#ff7048",
    "#ffffff"
];


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        if (
            e.code === "Space" ||
            e.key === "ArrowUp" ||
            e.key === "ArrowDown"
        ) {
            e.preventDefault();
        }

        keys[e.key.toLowerCase()] = true;

        if (e.key === "ArrowLeft") {

            targetLane =
                Math.max(
                    0,
                    targetLane - 1
                );
        }

        if (e.key === "ArrowRight") {

            targetLane =
                Math.min(
                    2,
                    targetLane + 1
                );
        }

        if (
            e.code === "Space" ||
            e.key === "ArrowUp"
        ) {

            jump();
        }

        if (
            e.key.toLowerCase() === "f"
        ) {

            trick();
        }

        if (
            e.key.toLowerCase() === "r"
        ) {

            restartGame();
        }

    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[e.key.toLowerCase()] =
            false;

    }
);


/* =========================================================
   TOUCH
========================================================= */

function button(
    id,
    action
) {

    const el =
        document.getElementById(id);

    el.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            action();

        }
    );
}

button(
    "leftBtn",
    () => {

        targetLane =
            Math.max(
                0,
                targetLane - 1
            );

    }
);

button(
    "rightBtn",
    () => {

        targetLane =
            Math.min(
                2,
                targetLane + 1
            );

    }
);

button(
    "jumpBtn",
    jump
);

button(
    "trickBtn",
    trick
);


/* =========================================================
   START
========================================================= */

function startGame() {

    document
        .getElementById("menu")
        .style.display = "none";

    document
        .getElementById("gameOver")
        .style.display = "none";

    playing = true;
    gameOver = false;

    score = 0;
    distance = 0;

    combo = 1;
    comboTimer = 0;

    speed = 7;

    lane = 1;
    targetLane = 1;

    playerHeight = 0;
    verticalVelocity = 0;

    grounded = true;

    rotation = 0;
    trickActive = false;

    objects = [];
    coins = [];
    particles = [];

    spawnTimer = .5;
    coinTimer = 1;
}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    startGame();

}


/* =========================================================
   JUMP
========================================================= */

function jump() {

    if (!playing || gameOver)
        return;

    /*
        Nur springen, wenn wir auf dem Boden sind.
    */

    if (grounded) {

        grounded = false;

        /*
            NEGATIV = nach oben.

            Die Höhe selbst wird anschließend
            mit verticalVelocity verändert.
        */

        verticalVelocity = -17;

        createParticles(
            playerScreenX(),
            playerScreenY() + 32,
            14,
            "#ffffff"
        );
    }
}


/* =========================================================
   TRICK
========================================================= */

function trick() {

    if (!playing || gameOver)
        return;

    if (!grounded) {

        trickActive = true;

        rotation += Math.PI * 2;

        comboTimer = 3;

        const tricks = [
            "KICKFLIP!",
            "HEELFLIP!",
            "360!",
            "BIG AIR!",
            "SKATE GOD!",
            "INSANE!"
        ];

        const name =
            tricks[
                Math.floor(
                    Math.random() *
                    tricks.length
                )
            ];

        showTrick(name);

        score +=
            150 *
            Math.max(
                1,
                Math.floor(combo)
            );

        combo += .5;

        createParticles(
            playerScreenX(),
            playerScreenY(),
            22,
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ]
        );
    }
}


/* =========================================================
   TRICK TEXT
========================================================= */

function showTrick(text) {

    const popup =
        document.getElementById(
            "trickPopup"
        );

    popup.textContent = text;

    popup.style.opacity = "1";

    popup.style.transform =
        "translate(-50%,-50%) scale(1) rotate(-6deg)";

    setTimeout(
        () => {

            popup.style.opacity = "0";

            popup.style.transform =
                "translate(-50%,-70%) scale(1.35) rotate(-6deg)";

        },
        550
    );
}


/* =========================================================
   SPAWN OBSTACLE
========================================================= */

function spawnObject() {

    const types = [
        "barrier",
        "rail",
        "cone",
        "ramp",
        "stairs",
        "box"
    ];

    const type =
        types[
            Math.floor(
                Math.random() *
                types.length
            )
        ];

    objects.push({

        lane:
            Math.floor(
                Math.random() * 3
            ),

        z: 1,

        type,

        passed: false,

        color:
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ]

    });
}


/* =========================================================
   COINS
========================================================= */

function spawnCoinLine() {

    const selectedLane =
        Math.floor(
            Math.random() * 3
        );

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        coins.push({

            lane: selectedLane,

            z:
                1 +
                i * .08,

            collected: false

        });
    }
}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    x,
    y,
    amount,
    color
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push({

            x,

            y,

            vx:
                (Math.random() - .5) *
                8,

            vy:
                (Math.random() - .5) *
                8,

            life: 1,

            size:
                Math.random() *
                5 +
                2,

            color

        });
    }
}


/* =========================================================
   ROAD MATH
========================================================= */

function roadY(z) {

    const horizon =
        H * .47;

    const bottom =
        H * 1.04;

    return (
        horizon +
        Math.pow(
            1 - z,
            2
        ) *
        (bottom - horizon)
    );
}


function roadWidth(z) {

    return (
        70 +
        Math.pow(
            1 - z,
            2
        ) *
        W *
        .82
    );
}


function laneX(
    selectedLane,
    z
) {

    const center =
        W / 2;

    const width =
        roadWidth(z);

    return (
        center +
        (selectedLane - 1) *
        width /
        3
    );
}


/* =========================================================
   PLAYER POSITION
========================================================= */

function playerScreenX() {

    return (
        W / 2 +
        (lane - 1) *
        W *
        .15
    );
}


/*
    HIER IST DER WICHTIGE FIX.

    Je höher playerHeight ist,
    desto kleiner wird Y.

    Kleineres Canvas-Y = weiter OBEN.
*/

function playerScreenY() {

    const groundY =
        H * .76;

    return (
        groundY -
        playerHeight
    );
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    if (!playing || gameOver)
        return;


    /* -------------------------
       SPUR
    ------------------------- */

    lane +=
        (targetLane - lane) *
        Math.min(
            1,
            dt * 14
        );


    /* -------------------------
       SPRUNG
    ------------------------- */

    verticalVelocity +=
        42 * dt;

    playerHeight +=
        verticalVelocity *
        dt;


    /*
        Sobald der Skater wieder
        am Boden ist.
    */

    if (playerHeight <= 0) {

        if (!grounded) {

            if (trickActive) {

                score +=
                    250 *
                    Math.max(
                        1,
                        Math.floor(combo)
                    );

                comboTimer = 3;

                showTrick(
                    "PERFECT LANDING!"
                );

                createParticles(
                    playerScreenX(),
                    H * .76,
                    18,
                    "#fff36b"
                );
            }

            trickActive = false;
        }

        playerHeight = 0;

        verticalVelocity = 0;

        grounded = true;
    }


    /* -------------------------
       ROTATION
    ------------------------- */

    if (!grounded) {

        rotation +=
            dt *
            7;
    }


    /* -------------------------
       SPEED
    ------------------------- */

    speed +=
        dt *
        .12;

    distance +=
        speed *
        dt *
        .8;

    score +=
        speed *
        dt *
        .5;


    /* -------------------------
       COMBO
    ------------------------- */

    if (comboTimer > 0) {

        comboTimer -= dt;

    } else {

        combo =
            Math.max(
                1,
                combo -
                dt * .15
            );
    }


    /* -------------------------
       OBSTACLES
    ------------------------- */

    spawnTimer -= dt;

    if (spawnTimer <= 0) {

        spawnObject();

        spawnTimer =
            Math.max(
                .42,
                1.15 -
                speed *
                .035
            );
    }


    /* -------------------------
       COINS
    ------------------------- */

    coinTimer -= dt;

    if (coinTimer <= 0) {

        spawnCoinLine();

        coinTimer =
            1.8 +
            Math.random() *
            1.2;
    }


    /* -------------------------
       OBJECT MOVEMENT
    ------------------------- */

    for (
        let i =
            objects.length - 1;
        i >= 0;
        i--
    ) {

        const o =
            objects[i];

        o.z -=
            speed *
            .00085 *
            dt *
            60;


        /*
            Kollision genau am Spieler.
        */

        if (
            !o.passed &&
            o.z < .16
        ) {

            o.passed = true;

            const sameLane =
                o.lane ===
                Math.round(lane);

            if (sameLane) {

                /*
                    Rampen dürfen
                    überfahren werden.
                */

                if (
                    o.type === "ramp"
                ) {

                    if (
                        grounded
                    ) {

                        jump();
                    }

                    score +=
                        100 *
                        combo;

                    combo += .2;

                    showTrick(
                        "RAMP!"
                    );

                } else {

                    /*
                        Hoher Sprung =
                        Hindernis übersprungen.
                    */

                    const highEnough =
                        playerHeight >
                        55;

                    if (!highEnough) {

                        crash();

                        return;
                    }

                    score +=
                        100 *
                        combo;

                    combo += .25;

                    showTrick(
                        "CLEAN!"
                    );
                }

            } else {

                score +=
                    25 *
                    combo;
            }
        }


        if (o.z < -.2) {

            objects.splice(i,1);
        }
    }


    /* -------------------------
       COINS UPDATE
    ------------------------- */

    for (
        let i =
            coins.length - 1;
        i >= 0;
        i--
    ) {

        const c =
            coins[i];

        c.z -=
            speed *
            .00085 *
            dt *
            60;

        if (
            !c.collected &&
            c.z < .19
        ) {

            const sameLane =
                c.lane ===
                Math.round(lane);

            const closeEnough =
                playerHeight >
                20;

            if (
                sameLane &&
                closeEnough
            ) {

                c.collected = true;

                score +=
                    75 *
                    combo;

                createParticles(
                    laneX(
                        c.lane,
                        c.z
                    ),
                    roadY(c.z) - 25,
                    8,
                    "#fff36b"
                );
            }
        }

        if (
            c.z < -.2 ||
            c.collected
        ) {

            coins.splice(i,1);
        }
    }


    /* -------------------------
       PARTICLES
    ------------------------- */

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            .25;

        p.life -=
            dt * 1.8;

        if (
            p.life <= 0
        ) {

            particles.splice(i,1);
        }
    }


    updateHUD();
}


/* =========================================================
   CRASH
========================================================= */

function crash() {

    playing = false;

    gameOver = true;

    createParticles(
        playerScreenX(),
        playerScreenY(),
        55,
        "#ff3294"
    );

    createParticles(
        playerScreenX(),
        playerScreenY(),
        35,
        "#fff36b"
    );

    document
        .getElementById(
            "finalScore"
        )
        .textContent =
        Math.floor(score)
            .toLocaleString("de-DE");

    setTimeout(
        () => {

            document
                .getElementById(
                    "gameOver"
                )
                .style.display =
                "flex";

        },
        450
    );
}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    document
        .getElementById(
            "score"
        )
        .textContent =
        Math.floor(score)
            .toLocaleString("de-DE");


    document
        .getElementById(
            "combo"
        )
        .textContent =
        "x" +
        Math.max(
            1,
            Math.floor(combo)
        );


    document
        .getElementById(
            "distance"
        )
        .textContent =
        Math.floor(distance) +
        "m";


    document
        .getElementById(
            "progressBar"
        )
        .style.width =
        (distance % 100) +
        "%";


    const box =
        document.getElementById(
            "comboBox"
        );


    if (combo > 1.2) {

        box.classList.add(
            "show"
        );

        document
            .getElementById(
                "comboPoints"
            )
            .textContent =
            "+" +
            Math.floor(
                combo * 100
            ) +
            " POINTS";

    } else {

        box.classList.remove(
            "show"
        );
    }
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    /* SKY */

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    sky.addColorStop(
        0,
        "#ff4f9d"
    );

    sky.addColorStop(
        .35,
        "#ff986f"
    );

    sky.addColorStop(
        .55,
        "#ffd56a"
    );

    sky.addColorStop(
        1,
        "#53d6bc"
    );

    ctx.fillStyle =
        sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SUN */

    ctx.save();

    ctx.shadowBlur = 60;
    ctx.shadowColor =
        "#fff0a0";

    ctx.fillStyle =
        "#fff2a3";

    ctx.beginPath();

    ctx.arc(
        W * .78,
        H * .25,
        Math.min(W,H) * .105,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();


    /* CLOUDS */

    drawCloud(
        W * .17,
        H * .2,
        1
    );

    drawCloud(
        W * .58,
        H * .14,
        .7
    );


    /* CITY */

    drawCity();


    /* PALMS */

    drawPalm(
        W * .1,
        H * .49,
        1
    );

    drawPalm(
        W * .9,
        H * .49,
        .85
    );
}


/* =========================================================
   CLOUD
========================================================= */

function drawCloud(
    x,
    y,
    scale
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );

    ctx.fillStyle =
        "rgba(255,255,255,.2)";

    ctx.beginPath();

    ctx.arc(
        0,
        10,
        28,
        0,
        Math.PI * 2
    );

    ctx.arc(
        28,
        0,
        38,
        0,
        Math.PI * 2
    );

    ctx.arc(
        65,
        12,
        25,
        0,
        Math.PI * 2
    );

    ctx.fillRect(
        -5,
        10,
        75,
        25
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   CITY
========================================================= */

function drawCity() {

    const base =
        H * .53;

    for (
        let x = 0;
        x < W;
        x += 48
    ) {

        const height =
            35 +
            Math.abs(
                Math.sin(
                    x * .08
                )
            ) *
            85;

        ctx.fillStyle =
            "#34215d";

        ctx.fillRect(
            x,
            base - height,
            38,
            height
        );


        /* windows */

        ctx.fillStyle =
            "rgba(255,222,100,.65)";

        for (
            let y =
                base -
                height +
                13;

            y <
                base -
                8;

            y += 17
        ) {

            if (
                (x + y) % 3 <
                1.5
            ) {

                ctx.fillRect(
                    x + 9,
                    y,
                    5,
                    7
                );
            }
        }
    }
}


/* =========================================================
   PALM
========================================================= */

function drawPalm(
    x,
    y,
    scale
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );

    ctx.strokeStyle =
        "#2b1754";

    ctx.lineWidth =
        9;

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.quadraticCurveTo(
        -10,
        -80,
        10,
        -145
    );

    ctx.stroke();


    ctx.fillStyle =
        "#2b1754";

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        ctx.save();

        ctx.rotate(
            -1.3 +
            i * .43
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            -145,
            10,
            55,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }

    ctx.restore();
}


/* =========================================================
   ROAD
========================================================= */

function drawRoad() {

    const horizon =
        H * .47;


    /* GRASS */

    ctx.fillStyle =
        "#42d0b6";

    ctx.fillRect(
        0,
        horizon,
        W,
        H - horizon
    );


    /* ROAD */

    ctx.fillStyle =
        "#27224a";

    ctx.beginPath();

    ctx.moveTo(
        W/2 - 35,
        horizon
    );

    ctx.lineTo(
        W/2 + 35,
        horizon
    );

    ctx.lineTo(
        W * .98,
        H
    );

    ctx.lineTo(
        W * .02,
        H
    );

    ctx.closePath();

    ctx.fill();


    /* LEFT EDGE */

    ctx.strokeStyle =
        "#ff3d9b";

    ctx.lineWidth =
        11;

    ctx.beginPath();

    ctx.moveTo(
        W/2 - 35,
        horizon
    );

    ctx.lineTo(
        W * .02,
        H
    );

    ctx.stroke();


    /* RIGHT EDGE */

    ctx.strokeStyle =
        "#6e5cff";

    ctx.beginPath();

    ctx.moveTo(
        W/2 + 35,
        horizon
    );

    ctx.lineTo(
        W * .98,
        H
    );

    ctx.stroke();


    /* LANE MARKINGS */

    for (
        let l = 1;
        l < 3;
        l++
    ) {

        ctx.strokeStyle =
            "rgba(255,255,255,.2)";

        ctx.lineWidth =
            4;

        ctx.setLineDash([
            22,
            30
        ]);

        ctx.beginPath();

        ctx.moveTo(
            W/2 +
            (l - 1.5) *
            25,
            horizon
        );

        ctx.lineTo(
            W/2 +
            (l - 1.5) *
            W *
            .63,
            H
        );

        ctx.stroke();
    }

    ctx.setLineDash([]);
}


/* =========================================================
   DRAW COINS
========================================================= */

function drawCoins() {

    for (
        const c of coins
    ) {

        if (c.collected)
            continue;

        const x =
            laneX(
                c.lane,
                c.z
            );

        const y =
            roadY(c.z) -
            25 -
            Math.sin(
                performance.now() *
                .006
            ) *
            5;

        const scale =
            .25 +
            (1 - c.z) *
            1.5;

        ctx.save();

        ctx.translate(
            x,
            y
        );

        ctx.scale(
            scale,
            scale
        );

        ctx.shadowBlur =
            20;

        ctx.shadowColor =
            "#fff36b";

        ctx.fillStyle =
            "#fff36b";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            13,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur =
            0;

        ctx.fillStyle =
            "#ffb92e";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            7,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   DRAW OBJECT
========================================================= */

function drawObject(o) {

    const z =
        Math.max(
            0,
            o.z
        );

    const y =
        roadY(z);

    const x =
        laneX(
            o.lane,
            z
        );

    const scale =
        .25 +
        (1 - z) *
        1.5;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );


    /* SHADOW */

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        9,
        52,
        13,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* BARRIER */

    if (
        o.type ===
        "barrier"
    ) {

        ctx.fillStyle =
            o.color;

        ctx.fillRect(
            -44,
            -56,
            88,
            56
        );

        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            -36,
            -43,
            72,
            9
        );

        ctx.fillRect(
            -36,
            -20,
            72,
            9
        );
    }


    /* RAIL */

    else if (
        o.type ===
        "rail"
    ) {

        ctx.strokeStyle =
            o.color;

        ctx.lineWidth =
            8;

        ctx.beginPath();

        ctx.moveTo(
            -58,
            0
        );

        ctx.lineTo(
            58,
            0
        );

        ctx.stroke();

        ctx.lineWidth =
            6;

        ctx.beginPath();

        ctx.moveTo(
            -40,
            0
        );

        ctx.lineTo(
            -40,
            30
        );

        ctx.moveTo(
            40,
            0
        );

        ctx.lineTo(
            40,
            30
        );

        ctx.stroke();
    }


    /* CONE */

    else if (
        o.type ===
        "cone"
    ) {

        ctx.fillStyle =
            "#ff7045";

        ctx.beginPath();

        ctx.moveTo(
            0,
            -55
        );

        ctx.lineTo(
            -28,
            10
        );

        ctx.lineTo(
            28,
            10
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            -22,
            -10,
            44,
            8
        );
    }


    /* RAMP */

    else if (
        o.type ===
        "ramp"
    ) {

        ctx.fillStyle =
            o.color;

        ctx.beginPath();

        ctx.moveTo(
            -55,
            15
        );

        ctx.lineTo(
            55,
            15
        );

        ctx.lineTo(
            55,
            -50
        );

        ctx.quadraticCurveTo(
            10,
            -72,
            -55,
            15
        );

        ctx.closePath();

        ctx.fill();
    }


    /* STAIRS */

    else if (
        o.type ===
        "stairs"
    ) {

        ctx.fillStyle =
            "#ffda55";

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            ctx.fillRect(
                -55 +
                i * 22,

                -i * 13,

                22,

                i * 13 +
                15
            );
        }
    }


    /* BOX */

    else {

        ctx.fillStyle =
            "#7046df";

        ctx.fillRect(
            -50,
            -35,
            100,
            35
        );

        ctx.fillStyle =
            "#ff4da3";

        ctx.fillRect(
            -40,
            -25,
            80,
            8
        );
    }

    ctx.restore();
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    const x =
        playerScreenX();

    const y =
        playerScreenY();


    ctx.save();

    ctx.translate(
        x,
        y
    );


    /*
        Nur in der Luft drehen.
    */

    if (!grounded) {

        ctx.rotate(
            rotation
        );
    }


    /* SHADOW */

    ctx.save();

    /*
        Der Schatten bleibt am Boden.
    */

    ctx.translate(
        0,
        playerHeight
    );

    ctx.scale(
        1,
        .25
    );

    ctx.fillStyle =
        "rgba(0,0,0,.32)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        36,
        48,
        12,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();


    /* BOARD */

    ctx.strokeStyle =
        "#ff4da4";

    ctx.lineWidth =
        8;

    ctx.beginPath();

    ctx.moveTo(
        -42,
        25
    );

    ctx.lineTo(
        42,
        25
    );

    ctx.stroke();


    /* WHEELS */

    ctx.fillStyle =
        "#fff36b";

    ctx.beginPath();

    ctx.arc(
        -28,
        33,
        7,
        0,
        Math.PI * 2
    );

    ctx.arc(
        28,
        33,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* LEGS */

    ctx.strokeStyle =
        "#24113f";

    ctx.lineWidth =
        10;

    ctx.beginPath();

    ctx.moveTo(
        -10,
        5
    );

    ctx.lineTo(
        -20,
        25
    );

    ctx.moveTo(
        10,
        5
    );

    ctx.lineTo(
        22,
        25
    );

    ctx.stroke();


    /* BODY */

    ctx.fillStyle =
        "#6d42e8";

    ctx.beginPath();

    ctx.roundRect(
        -20,
        -65,
        40,
        70,
        12
    );

    ctx.fill();


    /* SHIRT */

    ctx.fillStyle =
        "#ff4ca3";

    ctx.fillRect(
        -20,
        -35,
        40,
        10
    );


    /* ARMS */

    ctx.strokeStyle =
        "#f3a07c";

    ctx.lineWidth =
        9;

    ctx.beginPath();

    ctx.moveTo(
        -17,
        -52
    );

    ctx.lineTo(
        -38,
        -30
    );

    ctx.moveTo(
        17,
        -52
    );

    ctx.lineTo(
        38,
        -30
    );

    ctx.stroke();


    /* HEAD */

    ctx.fillStyle =
        "#f3a07c";

    ctx.beginPath();

    ctx.arc(
        0,
        -82,
        23,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* CAP */

    ctx.fillStyle =
        "#ffdb4d";

    ctx.beginPath();

    ctx.arc(
        0,
        -90,
        25,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillRect(
        0,
        -91,
        30,
        7
    );


    ctx.restore();
}


/* =========================================================
   PARTICLES DRAW
========================================================= */

function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    drawRoad();


    /*
        Erst weit entfernte
        Objekte.
    */

    objects
        .slice()
        .sort(
            (a,b) =>
                b.z - a.z
        )
        .forEach(
            drawObject
        );


    drawCoins();

    drawPlayer();

    drawParticles();

    requestAnimationFrame(
        render
    );
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();

function gameLoop(time) {

    const dt =
        Math.min(
            .035,
            (time -
                lastTime) /
            1000
        );

    lastTime =
        time;

    update(dt);

    requestAnimationFrame(
        gameLoop
    );
}


/* START */

render();

gameLoop(
    lastTime
);

</script>
