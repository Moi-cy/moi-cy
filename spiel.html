<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moi-cy Skate Rush</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #12052b;
}

body {
  color: white;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background:
    linear-gradient(
      to bottom,
      #ff5f9e 0%,
      #ff9f68 38%,
      #ffd66b 55%,
      #55d6be 100%
    );
}

/* ---------------- HUD ---------------- */

.hud {
  position: fixed;
  top: 18px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 5;
}

.logo {
  font-size: clamp(24px, 4vw, 42px);
  font-weight: 1000;
  letter-spacing: -2px;
  transform: rotate(-4deg);
  text-shadow:
    3px 3px 0 #241044,
    6px 6px 0 #ff3e9e;
}

.logo span {
  color: #fff36d;
}

.stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.stat {
  min-width: 100px;
  padding: 10px 15px;
  border: 3px solid white;
  border-radius: 18px;
  background: rgba(22, 8, 48, .65);
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 25px rgba(0,0,0,.2);
  text-align: center;
}

.stat small {
  display: block;
  font-size: 10px;
  opacity: .75;
  letter-spacing: 1px;
}

.stat strong {
  font-size: 20px;
}

/* ---------------- COMBO ---------------- */

#comboBox {
  position: fixed;
  top: 110px;
  left: 50%;
  transform: translateX(-50%) scale(.7);
  opacity: 0;
  z-index: 10;
  pointer-events: none;
  text-align: center;
  transition: .15s;
}

#comboBox.show {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

#comboText {
  font-size: clamp(30px, 7vw, 70px);
  font-weight: 1000;
  font-style: italic;
  color: #fff;
  text-shadow:
    4px 4px 0 #ff238d,
    8px 8px 0 #4b20c7;
}

#comboPoints {
  color: #fff36d;
  font-weight: 900;
  font-size: 20px;
}

/* ---------------- START SCREEN ---------------- */

#menu {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background:
    radial-gradient(circle at 50% 25%, rgba(255,255,255,.18), transparent 30%),
    linear-gradient(135deg, rgba(31,8,72,.2), rgba(255,40,130,.25));
}

.menuCard {
  width: min(600px, 95vw);
  padding: 38px;
  border: 4px solid white;
  border-radius: 35px;
  text-align: center;
  background: rgba(22, 7, 48, .78);
  backdrop-filter: blur(16px);
  box-shadow:
    0 25px 70px rgba(0,0,0,.35),
    0 0 50px rgba(255,65,167,.35);
}

.menuTitle {
  font-size: clamp(45px, 10vw, 85px);
  line-height: .85;
  font-weight: 1000;
  font-style: italic;
  transform: rotate(-4deg);
  margin-bottom: 15px;
  text-shadow:
    5px 5px 0 #ff2d8d,
    10px 10px 0 #3e22c8;
}

.menuTitle span {
  color: #fff36d;
}

.subtitle {
  font-size: 18px;
  opacity: .85;
  margin-bottom: 25px;
}

.playButton {
  border: 0;
  padding: 17px 42px;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff2e92, #7d35ff);
  color: white;
  font-size: 22px;
  font-weight: 1000;
  cursor: pointer;
  box-shadow:
    0 8px 0 #34166d,
    0 15px 30px rgba(255,35,145,.35);
  transition: .15s;
}

.playButton:hover {
  transform: translateY(-3px) scale(1.03);
}

.playButton:active {
  transform: translateY(5px);
  box-shadow: 0 2px 0 #34166d;
}

.controls {
  margin-top: 30px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.control {
  padding: 10px;
  border-radius: 15px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.18);
  font-size: 12px;
}

.control b {
  display: block;
  color: #fff36d;
  font-size: 18px;
  margin-bottom: 3px;
}

/* ---------------- GAME OVER ---------------- */

#gameOver {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(20,5,42,.65);
  backdrop-filter: blur(8px);
}

.overCard {
  width: min(500px, 90vw);
  padding: 35px;
  text-align: center;
  border: 4px solid white;
  border-radius: 30px;
  background: rgba(24,8,52,.9);
  box-shadow: 0 25px 70px rgba(0,0,0,.4);
}

.overCard h2 {
  font-size: 48px;
  color: #ff559f;
  text-shadow: 3px 3px 0 #4a25bd;
}

.finalScore {
  margin: 15px 0 25px;
  font-size: 25px;
}

/* ---------------- MOBILE BUTTONS ---------------- */

.mobileControls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 15;
}

.mobileGroup {
  display: flex;
  gap: 10px;
}

.touchBtn {
  width: 65px;
  height: 65px;
  border-radius: 22px;
  border: 2px solid rgba(255,255,255,.7);
  background: rgba(24,8,52,.6);
  color: white;
  font-size: 24px;
  font-weight: 900;
  backdrop-filter: blur(8px);
  pointer-events: auto;
}

.touchBtn:active {
  transform: scale(.9);
  background: #ff318f;
}

@media (min-width: 800px) {
  .mobileControls {
    opacity: .35;
  }
}

/* ---------------- TRICK POPUP ---------------- */

#trickPopup {
  position: fixed;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%) rotate(-5deg);
  z-index: 12;
  pointer-events: none;
  font-size: clamp(25px, 6vw, 65px);
  font-weight: 1000;
  font-style: italic;
  color: #fff36d;
  text-shadow:
    4px 4px 0 #ff218b,
    7px 7px 0 #4721bb;
  opacity: 0;
}

/* ---------------- PROGRESS ---------------- */

.progress {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: min(420px, 55vw);
  height: 8px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(255,255,255,.25);
  z-index: 8;
}

.progressBar {
  height: 100%;
  width: 0%;
  background: #fff36d;
  box-shadow: 0 0 15px #fff36d;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="logo">Moi-<span>cy</span></div>

  <div class="stats">
    <div class="stat">
      <small>SCORE</small>
      <strong id="score">0</strong>
    </div>

    <div class="stat">
      <small>COMBO</small>
      <strong id="combo">x1</strong>
    </div>

    <div class="stat">
      <small>DISTANZ</small>
      <strong id="distance">0m</strong>
    </div>
  </div>
</div>

<div id="comboBox">
  <div id="comboText">COMBO!</div>
  <div id="comboPoints">+0</div>
</div>

<div id="trickPopup"></div>

<div class="progress">
  <div class="progressBar" id="progressBar"></div>
</div>

<!-- START MENU -->

<div id="menu">
  <div class="menuCard">

    <div class="menuTitle">
      MOI-<span>CY</span><br>
      SKATE
    </div>

    <div class="subtitle">
      Skate. Trick. Combo. Repeat. 🛹
    </div>

    <button class="playButton" onclick="startGame()">
      🛹 START SKATING
    </button>

    <div class="controls">
      <div class="control">
        <b>← →</b>
        Move
      </div>

      <div class="control">
        <b>SPACE</b>
        Ollie
      </div>

      <div class="control">
        <b>F</b>
        Trick
      </div>

      <div class="control">
        <b>R</b>
        Restart
      </div>
    </div>

  </div>
</div>

<!-- GAME OVER -->

<div id="gameOver">
  <div class="overCard">

    <h2>WIPEOUT! 💥</h2>

    <div class="finalScore">
      Score: <strong id="finalScore">0</strong>
    </div>

    <button class="playButton" onclick="restartGame()">
      🔥 NOCHMAL!
    </button>

  </div>
</div>

<!-- MOBILE CONTROLS -->

<div class="mobileControls">

  <div class="mobileGroup">
    <button class="touchBtn" id="leftBtn">←</button>
    <button class="touchBtn" id="rightBtn">→</button>
  </div>

  <div class="mobileGroup">
    <button class="touchBtn" id="jumpBtn">⬆</button>
    <button class="touchBtn" id="trickBtn">★</button>
  </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;

  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";

  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

  W = innerWidth;
  H = innerHeight;
}

addEventListener("resize", resize);
resize();

/* ---------------- GAME STATE ---------------- */

let playing = false;
let gameOver = false;

let score = 0;
let distance = 0;
let combo = 1;
let comboTimer = 0;

let lane = 1;
let targetLane = 1;

let playerY = 0;
let velocityY = 0;
let grounded = true;

let trickRotation = 0;
let trickActive = false;

let speed = 7;

let objects = [];
let particles = [];
let stars = [];

let spawnTimer = 0;

/* ---------------- COLORS ---------------- */

const neonColors = [
  "#ff3b9d",
  "#ffdb4d",
  "#6c63ff",
  "#39e7c3",
  "#ff7043",
  "#ffffff"
];

/* ---------------- STARS ---------------- */

for (let i = 0; i < 100; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random() * .48,
    size: Math.random() * 2 + 1,
    alpha: Math.random() * .8
  });
}

/* ---------------- INPUT ---------------- */

const keys = {};

addEventListener("keydown", e => {

  keys[e.key.toLowerCase()] = true;

  if (e.key === "ArrowLeft") {
    targetLane = Math.max(0, targetLane - 1);
  }

  if (e.key === "ArrowRight") {
    targetLane = Math.min(2, targetLane + 1);
  }

  if (e.code === "Space") {
    e.preventDefault();
    jump();
  }

  if (e.key.toLowerCase() === "f") {
    trick();
  }

  if (e.key.toLowerCase() === "r") {
    restartGame();
  }
});

addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

/* ---------------- TOUCH ---------------- */

function touchButton(id, action) {

  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    action();
  });
}

touchButton("leftBtn", () => {
  targetLane = Math.max(0, targetLane - 1);
});

touchButton("rightBtn", () => {
  targetLane = Math.min(2, targetLane + 1);
});

touchButton("jumpBtn", jump);
touchButton("trickBtn", trick);

/* ---------------- START ---------------- */

function startGame() {

  document.getElementById("menu").style.display = "none";

  playing = true;
  gameOver = false;

  score = 0;
  distance = 0;
  combo = 1;
  comboTimer = 0;

  lane = 1;
  targetLane = 1;

  playerY = 0;
  velocityY = 0;

  objects = [];
  particles = [];

  speed = 7;

  spawnTimer = 0;
}

/* ---------------- RESTART ---------------- */

function restartGame() {

  document.getElementById("gameOver").style.display = "none";

  startGame();
}

/* ---------------- JUMP ---------------- */

function jump() {

  if (!playing || gameOver) return;

  if (grounded) {

    velocityY = -15;
    grounded = false;

    createParticles(
      playerScreenX(),
      playerScreenY(),
      12,
      "#ffffff"
    );
  }
}

/* ---------------- TRICK ---------------- */

function trick() {

  if (!playing || gameOver) return;

  if (!grounded) {

    trickActive = true;
    trickRotation += Math.PI * 2;

    comboTimer = 3;

    showTrick(
      ["KICKFLIP!", "HEElFLIP!", "360!", "BIG AIR!"][
        Math.floor(Math.random() * 4)
      ]
    );

    score += 150 * combo;

    combo++;

    createParticles(
      playerScreenX(),
      playerScreenY(),
      20,
      neonColors[Math.floor(Math.random() * neonColors.length)]
    );
  }
}

/* ---------------- TRICK POPUP ---------------- */

function showTrick(text) {

  const popup = document.getElementById("trickPopup");

  popup.textContent = text;
  popup.style.opacity = "1";
  popup.style.transform =
    "translate(-50%,-50%) rotate(-5deg) scale(1)";

  setTimeout(() => {

    popup.style.opacity = "0";
    popup.style.transform =
      "translate(-50%,-70%) rotate(-5deg) scale(1.4)";

  }, 500);
}

/* ---------------- OBJECTS ---------------- */

function spawnObject() {

  const types = [
    "barrier",
    "rail",
    "cone",
    "ramp",
    "stair",
    "box"
  ];

  const type =
    types[Math.floor(Math.random() * types.length)];

  objects.push({
    lane: Math.floor(Math.random() * 3),
    z: 1,
    type,
    passed: false,
    color:
      neonColors[
        Math.floor(Math.random() * neonColors.length)
      ]
  });
}

/* ---------------- PARTICLES ---------------- */

function createParticles(x, y, amount, color) {

  for (let i = 0; i < amount; i++) {

    particles.push({
      x,
      y,
      vx: (Math.random() - .5) * 8,
      vy: (Math.random() - .5) * 8,
      life: 1,
      size: Math.random() * 5 + 2,
      color
    });
  }
}

/* ---------------- CAMERA ---------------- */

function roadY(z) {

  const horizon = H * .48;
  const bottom = H * 1.02;

  return horizon + Math.pow(1 - z, 2) * (bottom - horizon);
}

function roadWidth(z) {

  return 70 + Math.pow(1 - z, 2) * W * .8;
}

function laneX(l, z) {

  const center = W / 2;
  const width = roadWidth(z);

  return center + (l - 1) * width / 3;
}

/* ---------------- PLAYER POSITION ---------------- */

function playerScreenX() {

  return W / 2 + (lane - 1) * W * .15;
}

function playerScreenY() {

  return H * .76 - playerY;
}

/* ---------------- UPDATE ---------------- */

function update(dt) {

  if (!playing || gameOver) return;

  /* lane movement */

  lane += (targetLane - lane) * .18;

  /* gravity */

  velocityY += .65;

  playerY += velocityY;

  if (playerY >= 0) {

    if (!grounded && trickActive) {

      comboTimer = 2.5;

      showTrick("CLEAN LANDING!");

      score += 250 * combo;

      createParticles(
        playerScreenX(),
        playerScreenY() + 30,
        15,
        "#fff36d"
      );
    }

    playerY = 0;
    velocityY = 0;
    grounded = true;
    trickActive = false;
  }

  /* rotation */

  if (!grounded) {
    trickRotation += .35;
  }

  /* speed */

  speed += .002;

  distance += speed * .04;

  score += Math.floor(speed * .12);

  /* combo timer */

  if (comboTimer > 0) {

    comboTimer -= dt;

  } else {

    combo = Math.max(1, combo - .03);
  }

  /* objects */

  spawnTimer -= dt;

  if (spawnTimer <= 0) {

    spawnObject();

    spawnTimer =
      Math.max(.38, 1.05 - speed * .035);
  }

  for (let i = objects.length - 1; i >= 0; i--) {

    const o = objects[i];

    o.z -= speed * .0008 * dt * 60;

    if (!o.passed && o.z < .17) {

      o.passed = true;

      if (o.lane === Math.round(lane)) {

        if (playerY < 45 && o.type !== "ramp") {

          crash();
          return;
        }

      } else {

        score += 30 * combo;
      }
    }

    if (o.z < -.15) {

      objects.splice(i, 1);
    }
  }

  /* particles */

  for (let i = particles.length - 1; i >= 0; i--) {

    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vy += .2;

    p.life -= .025;

    if (p.life <= 0) {

      particles.splice(i, 1);
    }
  }

  updateHUD();
}

/* ---------------- CRASH ---------------- */

function crash() {

  gameOver = true;
  playing = false;

  createParticles(
    playerScreenX(),
    playerScreenY(),
    50,
    "#ff3d91"
  );

  document.getElementById("finalScore").textContent =
    Math.floor(score).toLocaleString("de-DE");

  setTimeout(() => {

    document.getElementById("gameOver").style.display =
      "flex";

  }, 400);
}

/* ---------------- HUD ---------------- */

function updateHUD() {

  document.getElementById("score").textContent =
    Math.floor(score).toLocaleString("de-DE");

  document.getElementById("combo").textContent =
    "x" + Math.max(1, Math.floor(combo));

  document.getElementById("distance").textContent =
    Math.floor(distance) + "m";

  document.getElementById("progressBar").style.width =
    Math.min(100, distance % 100) + "%";

  const box = document.getElementById("comboBox");

  if (combo > 1) {

    box.classList.add("show");

    document.getElementById("comboPoints").textContent =
      "+" + Math.floor(combo * 100) + " POINTS";

  } else {

    box.classList.remove("show");
  }
}

/* ---------------- DRAW BACKGROUND ---------------- */

function drawBackground() {

  /* sky */

  const gradient = ctx.createLinearGradient(
    0, 0, 0, H
  );

  gradient.addColorStop(0, "#ff4f9a");
  gradient.addColorStop(.35, "#ff9b70");
  gradient.addColorStop(.55, "#ffd66b");
  gradient.addColorStop(1, "#55d6be");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  /* sun */

  ctx.beginPath();

  ctx.arc(
    W * .78,
    H * .27,
    Math.min(W,H) * .11,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#fff2a1";
  ctx.shadowBlur = 50;
  ctx.shadowColor = "#fff2a1";
  ctx.fill();

  ctx.shadowBlur = 0;

  /* stars */

  for (const s of stars) {

    ctx.globalAlpha = s.alpha;

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
      s.x * W,
      s.y * H,
      s.size,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  ctx.globalAlpha = 1;

  /* skyline */

  drawCity();

  /* palm silhouettes */

  drawPalm(W * .12, H * .47, 1);
  drawPalm(W * .9, H * .46, .8);
}

/* ---------------- CITY ---------------- */

function drawCity() {

  const base = H * .53;

  ctx.fillStyle = "#34205e";

  for (let x = 0; x < W; x += 55) {

    const h =
      30 +
      Math.abs(Math.sin(x * .11)) * 80;

    ctx.fillRect(
      x,
      base - h,
      42,
      h
    );

    ctx.fillStyle = "#ffd95e";

    for (let wy = base - h + 12; wy < base - 8; wy += 17) {

      if (Math.random() > .25) {

        ctx.fillRect(
          x + 10,
          wy,
          5,
          7
        );
      }
    }

    ctx.fillStyle = "#34205e";
  }
}

/* ---------------- PALM ---------------- */

function drawPalm(x, y, scale) {

  ctx.save();

  ctx.translate(x, y);
  ctx.scale(scale, scale);

  ctx.strokeStyle = "#2a1655";
  ctx.lineWidth = 9;

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(
    -10,
    -70,
    10,
    -140
  );
  ctx.stroke();

  ctx.fillStyle = "#2a1655";

  for (let i = 0; i < 7; i++) {

    ctx.save();

    ctx.rotate(
      -1.3 + i * .43
    );

    ctx.beginPath();

    ctx.ellipse(
      0,
      -145,
      10,
      55,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
  }

  ctx.restore();
}

/* ---------------- ROAD ---------------- */

function drawRoad() {

  const horizon = H * .48;

  /* outer area */

  ctx.fillStyle = "#3ed1ba";

  ctx.beginPath();

  ctx.moveTo(0, horizon);
  ctx.lineTo(W, horizon);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);

  ctx.fill();

  /* road */

  ctx.fillStyle = "#25204b";

  ctx.beginPath();

  ctx.moveTo(W/2 - 35, horizon);
  ctx.lineTo(W/2 + 35, horizon);
  ctx.lineTo(W * .98, H);
  ctx.lineTo(W * .02, H);

  ctx.closePath();

  ctx.fill();

  /* colorful road edges */

  ctx.strokeStyle = "#ff3c99";
  ctx.lineWidth = 12;

  ctx.beginPath();

  ctx.moveTo(W/2 - 35, horizon);
  ctx.lineTo(W * .02, H);

  ctx.stroke();

  ctx.strokeStyle = "#6d54ff";

  ctx.beginPath();

  ctx.moveTo(W/2 + 35, horizon);
  ctx.lineTo(W * .98, H);

  ctx.stroke();

  /* lane lines */

  for (let l = 1; l < 3; l++) {

    ctx.strokeStyle =
      "rgba(255,255,255,.2)";

    ctx.lineWidth = 4;

    ctx.setLineDash([25, 30]);

    ctx.beginPath();

    ctx.moveTo(
      W/2 + (l - 1.5) * 25,
      horizon
    );

    ctx.lineTo(
      W/2 + (l - 1.5) * W * .63,
      H
    );

    ctx.stroke();
  }

  ctx.setLineDash([]);
}

/* ---------------- OBJECT DRAWING ---------------- */

function drawObject(o) {

  const z = Math.max(0, o.z);

  const y = roadY(z);
  const x = laneX(o.lane, z);

  const scale =
    .25 + (1 - z) * 1.5;

  ctx.save();

  ctx.translate(x, y);

  ctx.scale(scale, scale);

  /* shadow */

  ctx.fillStyle = "rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    8,
    50,
    12,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  if (o.type === "barrier") {

    ctx.fillStyle = o.color;

    ctx.fillRect(
      -42,
      -55,
      84,
      55
    );

    ctx.fillStyle = "#fff";

    ctx.fillRect(
      -35,
      -43,
      70,
      9
    );

    ctx.fillRect(
      -35,
      -20,
      70,
      9
    );

  } else if (o.type === "rail") {

    ctx.strokeStyle = o.color;
    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(-55,0);
    ctx.lineTo(55,0);

    ctx.stroke();

    ctx.lineWidth = 6;

    ctx.beginPath();

    ctx.moveTo(-40,0);
    ctx.lineTo(-40,30);

    ctx.moveTo(40,0);
    ctx.lineTo(40,30);

    ctx.stroke();

  } else if (o.type === "cone") {

    ctx.fillStyle = "#ff713e";

    ctx.beginPath();

    ctx.moveTo(0,-55);
    ctx.lineTo(-28,10);
    ctx.lineTo(28,10);
    ctx.closePath();

    ctx.fill();

    ctx.fillStyle = "#fff";

    ctx.fillRect(-22,-10,44,8);

  } else if (o.type === "ramp") {

    ctx.fillStyle = o.color;

    ctx.beginPath();

    ctx.moveTo(-55,15);
    ctx.lineTo(55,15);
    ctx.lineTo(55,-50);
    ctx.quadraticCurveTo(
      10,
      -70,
      -55,
      15
    );

    ctx.closePath();

    ctx.fill();

  } else if (o.type === "stair") {

    ctx.fillStyle = "#ffdb55";

    for (let i = 0; i < 5; i++) {

      ctx.fillRect(
        -55 + i * 22,
        -i * 13,
        22,
        i * 13 + 15
      );
    }

  } else if (o.type === "box") {

    ctx.fillStyle = "#7047df";

    ctx.fillRect(
      -50,
      -35,
      100,
      35
    );

    ctx.fillStyle = "#ff4ca4";

    ctx.fillRect(
      -40,
      -25,
      80,
      8
    );
  }

  ctx.restore();
}

/* ---------------- PLAYER ---------------- */

function drawPlayer() {

  const x = playerScreenX();
  const y = playerScreenY();

  ctx.save();

  ctx.translate(x, y);

  if (!grounded) {

    ctx.rotate(
      trickRotation
    );
  }

  /* shadow */

  ctx.save();

  ctx.translate(0, playerY);

  ctx.scale(
    1,
    .3
  );

  ctx.fillStyle = "rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    35,
    48,
    12,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();

  /* skateboard */

  ctx.strokeStyle = "#ff4da6";
  ctx.lineWidth = 8;

  ctx.beginPath();

  ctx.moveTo(-42,25);
  ctx.lineTo(42,25);

  ctx.stroke();

  /* wheels */

  ctx.fillStyle = "#fff36d";

  ctx.beginPath();
  ctx.arc(-28,33,7,0,Math.PI*2);
  ctx.arc(28,33,7,0,Math.PI*2);
  ctx.fill();

  /* legs */

  ctx.strokeStyle = "#24113f";
  ctx.lineWidth = 10;

  ctx.beginPath();

  ctx.moveTo(-10,5);
  ctx.lineTo(-20,25);

  ctx.moveTo(10,5);
  ctx.lineTo(22,25);

  ctx.stroke();

  /* body */

  ctx.fillStyle = "#6c43e8";

  ctx.beginPath();

  ctx.roundRect(
    -20,
    -65,
    40,
    70,
    12
  );

  ctx.fill();

  /* shirt stripe */

  ctx.fillStyle = "#ff4ca4";

  ctx.fillRect(
    -20,
    -35,
    40,
    10
  );

  /* arms */

  ctx.strokeStyle = "#f4a27e";
  ctx.lineWidth = 9;

  ctx.beginPath();

  ctx.moveTo(-17,-52);
  ctx.lineTo(-38,-30);

  ctx.moveTo(17,-52);
  ctx.lineTo(38,-30);

  ctx.stroke();

  /* head */

  ctx.fillStyle = "#f4a27e";

  ctx.beginPath();

  ctx.arc(
    0,
    -82,
    23,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* cap */

  ctx.fillStyle = "#ffdb4d";

  ctx.beginPath();

  ctx.arc(
    0,
    -90,
    25,
    Math.PI,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillRect(
    0,
    -91,
    30,
    7
  );

  ctx.restore();
}

/* ---------------- PARTICLES DRAW ---------------- */

function drawParticles() {

  for (const p of particles) {

    ctx.globalAlpha =
      Math.max(0,p.life);

    ctx.fillStyle =
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

/* ---------------- RENDER ---------------- */

function render() {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawRoad();

  /* far objects first */

  objects
    .slice()
    .sort((a,b) => b.z - a.z)
    .forEach(drawObject);

  drawPlayer();

  drawParticles();

  requestAnimationFrame(render);
}

/* ---------------- GAME LOOP ---------------- */

let lastTime = performance.now();

function loop(time) {

  const dt =
    Math.min(.035, (time-lastTime)/1000);

  lastTime = time;

  update(dt);

  requestAnimationFrame(loop);
}

render();
loop(lastTime);
</script>

</body>
</html>
