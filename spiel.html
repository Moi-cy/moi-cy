<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moi-cy Skate</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

body {
    user-select: none;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================
   START MENU
========================= */

#menu {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.3), transparent 25%),
        linear-gradient(135deg, #ff4d9d, #ff7b35 45%, #ffd84d 75%, #37e0d0);
}

.menu-card {
    width: min(520px, 94vw);
    padding: 34px 28px;
    border: 4px solid white;
    border-radius: 30px;
    background: rgba(20, 10, 45, .82);
    box-shadow:
        0 25px 70px rgba(0,0,0,.4),
        0 0 50px rgba(255,255,255,.15);
    text-align: center;
    backdrop-filter: blur(12px);
}

.logo {
    font-size: clamp(52px, 13vw, 90px);
    line-height: .85;
    font-weight: 1000;
    font-style: italic;
    letter-spacing: -7px;
    color: white;
    text-shadow:
        5px 5px 0 #ff3c91,
        9px 9px 0 #17122e;
    transform: skew(-8deg);
}

.logo-sub {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #ffd84d;
}

.menu-description {
    margin: 25px 0;
    line-height: 1.6;
    color: #eee;
}

.start-btn {
    width: 100%;
    padding: 18px;
    border: 0;
    border-radius: 17px;
    background: linear-gradient(135deg, #ff3c91, #ff6b35);
    color: white;
    font-size: 21px;
    font-weight: 1000;
    cursor: pointer;
    box-shadow: 0 8px 0 #a81f58;
    transition: transform .1s;
}

.start-btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #a81f58;
}

.menu-buttons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.menu-small {
    flex: 1;
    padding: 13px 8px;
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 13px;
    background: rgba(255,255,255,.08);
    color: white;
    font-weight: 800;
    cursor: pointer;
}

.controls {
    margin-top: 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    text-align: left;
    font-size: 13px;
    color: #ddd;
}

.control {
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,.07);
}

kbd {
    display: inline-block;
    padding: 3px 7px;
    border-radius: 5px;
    background: #fff;
    color: #17122e;
    font-weight: 1000;
    margin-right: 4px;
}

/* =========================
   SETTINGS
========================= */

#settings {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(8,5,25,.75);
    backdrop-filter: blur(10px);
}

.settings-card {
    width: min(440px, 94vw);
    padding: 28px;
    border-radius: 25px;
    background: #19122e;
    border: 3px solid white;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.settings-card h2 {
    font-size: 30px;
    margin-bottom: 22px;
}

.setting-row {
    margin-bottom: 20px;
}

.setting-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-weight: 900;
}

input[type="range"] {
    width: 100%;
    accent-color: #ff3c91;
}

.toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px;
    margin-bottom: 9px;
    border-radius: 12px;
    background: rgba(255,255,255,.07);
    font-weight: 800;
}

.toggle {
    width: 52px;
    height: 29px;
    border-radius: 30px;
    background: #555;
    padding: 3px;
    cursor: pointer;
}

.toggle::after {
    content: "";
    display: block;
    width: 23px;
    height: 23px;
    border-radius: 50%;
    background: white;
    transition: transform .2s;
}

.toggle.active {
    background: #ff3c91;
}

.toggle.active::after {
    transform: translateX(23px);
}

.close-settings {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: 0;
    border-radius: 12px;
    background: white;
    color: #19122e;
    font-weight: 1000;
    cursor: pointer;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    display: none;
}

.hud-top {
    display: flex;
    justify-content: space-between;
    padding: 18px;
}

.hud-box {
    min-width: 100px;
    padding: 10px 15px;
    border: 2px solid rgba(255,255,255,.7);
    border-radius: 14px;
    background: rgba(18,10,40,.65);
    backdrop-filter: blur(7px);
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

.hud-label {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
    opacity: .7;
}

.hud-value {
    font-size: 24px;
    font-weight: 1000;
}

#comboBox {
    position: fixed;
    top: 105px;
    left: 50%;
    transform: translateX(-50%) scale(.7);
    opacity: 0;
    font-size: clamp(25px, 7vw, 55px);
    font-weight: 1000;
    font-style: italic;
    color: #ffd84d;
    text-shadow:
        3px 3px 0 #ff3c91,
        6px 6px 0 #17122e;
    transition: .2s;
    white-space: nowrap;
}

#comboBox.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
}

#trickPopup {
    position: fixed;
    top: 180px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: 1000;
    color: white;
    text-shadow: 3px 3px 0 #17122e;
    opacity: 0;
    pointer-events: none;
}

#trickPopup.show {
    animation: popup .8s ease-out;
}

@keyframes popup {
    0% {
        opacity: 0;
        transform: translateX(-50%) translateY(25px) scale(.5) rotate(-5deg);
    }
    25% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1.2) rotate(3deg);
    }
    100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-45px) scale(1);
    }
}

/* =========================
   GAME OVER
========================= */

#gameOver {
    position: fixed;
    inset: 0;
    z-index: 25;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10,5,25,.65);
    backdrop-filter: blur(8px);
}

.gameover-card {
    width: min(430px, 92vw);
    padding: 32px;
    text-align: center;
    border: 3px solid white;
    border-radius: 25px;
    background: #19122e;
}

.gameover-card h2 {
    font-size: 48px;
    color: #ff4d9d;
    font-style: italic;
}

.final-score {
    margin: 20px 0;
    font-size: 30px;
    font-weight: 1000;
}

.restart-btn {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 13px;
    background: #ffd84d;
    color: #19122e;
    font-size: 18px;
    font-weight: 1000;
    cursor: pointer;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls {
    position: fixed;
    inset: auto 0 18px 0;
    z-index: 10;
    display: none;
    justify-content: space-between;
    padding: 0 18px;
    pointer-events: none;
}

.mobile-group {
    display: flex;
    gap: 10px;
    pointer-events: auto;
}

.mobile-btn {
    width: 62px;
    height: 62px;
    border-radius: 18px;
    border: 2px solid rgba(255,255,255,.7);
    background: rgba(20,10,40,.7);
    color: white;
    font-size: 24px;
    font-weight: 1000;
    backdrop-filter: blur(8px);
    touch-action: manipulation;
}

.mobile-btn:active {
    transform: scale(.9);
    background: #ff3c91;
}

@media (max-width: 800px) {
    #mobileControls {
        display: flex;
    }

    .controls {
        display: none;
    }

    .hud-top {
        padding: 10px;
    }

    .hud-box {
        min-width: 80px;
        padding: 7px 10px;
    }

    .hud-value {
        font-size: 18px;
    }
}

@media (min-width: 801px) {
    #mobileControls {
        display: none !important;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================
     MENU
========================= -->

<div id="menu">
    <div class="menu-card">

        <div class="logo">Moi-cy</div>
        <div class="logo-sub">SKATE • RIDE • COMBO</div>

        <div class="menu-description">
            Spring über Hindernisse, sammle Coins,
            lande Tricks und baue riesige Combos!
        </div>

        <button class="start-btn" id="startBtn">
            🛹 SKATE STARTEN
        </button>

        <div class="menu-buttons">
            <button class="menu-small" id="soundBtn">
                🔊 SOUND
            </button>

            <button class="menu-small" id="musicBtn">
                🎵 MUSIK
            </button>

            <button class="menu-small" id="settingsBtn">
                ⚙️ AUDIO
            </button>
        </div>

        <div class="controls">
            <div class="control">
                <kbd>←</kbd><kbd>→</kbd> Spur wechseln
            </div>
            <div class="control">
                <kbd>SPACE</kbd> Springen
            </div>
            <div class="control">
                <kbd>F</kbd> Trick
            </div>
            <div class="control">
                <kbd>R</kbd> Neustart
            </div>
        </div>

    </div>
</div>

<!-- =========================
     SETTINGS
========================= -->

<div id="settings">
    <div class="settings-card">

        <h2>🔊 Audio</h2>

        <div class="setting-row">
            <div class="setting-title">
                <span>Sound Effects</span>
                <span id="sfxValue">80%</span>
            </div>

            <input
                id="sfxVolume"
                type="range"
                min="0"
                max="100"
                value="80"
            >
        </div>

        <div class="setting-row">
            <div class="setting-title">
                <span>Musik</span>
                <span id="musicValue">45%</span>
            </div>

            <input
                id="musicVolume"
                type="range"
                min="0"
                max="100"
                value="45"
            >
        </div>

        <div class="toggle-row">
            <span>🔊 Sound Effects</span>
            <div class="toggle active" id="sfxToggle"></div>
        </div>

        <div class="toggle-row">
            <span>🎵 Hintergrundmusik</span>
            <div class="toggle active" id="musicToggle"></div>
        </div>

        <button class="close-settings" id="closeSettings">
            FERTIG
        </button>

    </div>
</div>

<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="hud-top">

        <div class="hud-box">
            <div class="hud-label">SCORE</div>
            <div class="hud-value" id="score">0</div>
        </div>

        <div class="hud-box">
            <div class="hud-label">COMBO</div>
            <div class="hud-value" id="combo">x1</div>
        </div>

        <div class="hud-box">
            <div class="hud-label">DISTANCE</div>
            <div class="hud-value" id="distance">0m</div>
        </div>

    </div>

    <div id="comboBox">COMBO x2</div>
    <div id="trickPopup">KICKFLIP!</div>

</div>

<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver">
    <div class="gameover-card">

        <h2>WIPEOUT!</h2>

        <div class="final-score">
            <div>Score</div>
            <span id="finalScore">0</span>
        </div>

        <button class="restart-btn" id="restartBtn">
            🛹 NOCHMAL!
        </button>

    </div>
</div>

<!-- =========================
     MOBILE
========================= -->

<div id="mobileControls">

    <div class="mobile-group">
        <button class="mobile-btn" id="leftBtn">←</button>
        <button class="mobile-btn" id="rightBtn">→</button>
    </div>

    <div class="mobile-group">
        <button class="mobile-btn" id="jumpBtn">↑</button>
        <button class="mobile-btn" id="trickBtn">★</button>
    </div>

</div>

<script>
/* =========================================================
   MOI-CY SKATE
   Single-file arcade skateboard game
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize() {
    W = canvas.width = innerWidth * devicePixelRatio;
    H = canvas.height = innerHeight * devicePixelRatio;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

resize();

addEventListener("resize", resize);

/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;

let audioStarted = false;
let musicTimer = null;
let musicStep = 0;

let audioSettings = {
    sfxVolume: Number(localStorage.getItem("moiCySfx") ?? 80),
    musicVolume: Number(localStorage.getItem("moiCyMusic") ?? 45),
    sfxEnabled: localStorage.getItem("moiCySfxEnabled") !== "false",
    musicEnabled: localStorage.getItem("moiCyMusicEnabled") !== "false"
};

function initAudio() {

    if (audioStarted) {
        if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume();
        }
        return;
    }

    audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    masterGain = audioCtx.createGain();
    musicGain = audioCtx.createGain();
    sfxGain = audioCtx.createGain();

    musicGain.connect(masterGain);
    sfxGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    audioStarted = true;

    updateAudioVolumes();

    startMusic();
}

function updateAudioVolumes() {

    if (!audioStarted) return;

    sfxGain.gain.value =
        audioSettings.sfxEnabled
            ? audioSettings.sfxVolume / 100
            : 0;

    musicGain.gain.value =
        audioSettings.musicEnabled
            ? audioSettings.musicVolume / 100
            : 0;
}

/* ---------- generic tone ---------- */

function tone(
    frequency,
    duration = .12,
    type = "sine",
    volume = .15,
    destination = sfxGain,
    slideTo = null
) {

    if (!audioStarted) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(
        frequency,
        audioCtx.currentTime
    );

    if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(
            Math.max(20, slideTo),
            audioCtx.currentTime + duration
        );
    }

    gain.gain.setValueAtTime(
        0.0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime + .01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration + .02);
}

/* ---------- noise ---------- */

function noise(duration = .15, volume = .15) {

    if (!audioStarted) return;

    const bufferSize =
        audioCtx.sampleRate * duration;

    const buffer =
        audioCtx.createBuffer(
            1,
            bufferSize,
            audioCtx.sampleRate
        );

    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
        data[i] =
            (Math.random() * 2 - 1) *
            Math.pow(1 - i / bufferSize, 2);
    }

    const source =
        audioCtx.createBufferSource();

    const gain =
        audioCtx.createGain();

    source.buffer = buffer;

    gain.gain.value = volume;

    source.connect(gain);
    gain.connect(sfxGain);

    source.start();
}

/* =========================================================
   GAME SOUNDS
========================================================= */

function soundJump() {

    tone(230, .08, "square", .12, sfxGain, 430);

    setTimeout(() => {
        tone(500, .1, "triangle", .08);
    }, 45);
}

function soundLand(perfect = false) {

    if (perfect) {
        tone(500, .08, "triangle", .13);
        setTimeout(() => tone(760, .1, "triangle", .13), 70);
        setTimeout(() => tone(1000, .13, "triangle", .12), 140);
    } else {
        tone(130, .08, "square", .1, sfxGain, 90);
    }
}

function soundCoin() {

    tone(880, .07, "square", .1);
    setTimeout(() => {
        tone(1320, .12, "square", .08);
    }, 60);
}

function soundTrick() {

    tone(420, .08, "sawtooth", .08, sfxGain, 800);

    setTimeout(() => {
        tone(720, .1, "square", .09, sfxGain, 1200);
    }, 55);
}

function soundCombo(multiplier) {

    const base = 350 + multiplier * 50;

    tone(base, .1, "triangle", .1);

    setTimeout(() => {
        tone(base * 1.25, .1, "triangle", .1);
    }, 70);

    setTimeout(() => {
        tone(base * 1.5, .14, "triangle", .12);
    }, 140);
}

function soundCrash() {

    noise(.35, .35);

    tone(100, .3, "sawtooth", .18, sfxGain, 45);

    setTimeout(() => {
        tone(55, .2, "square", .12);
    }, 100);
}

function soundClick() {
    tone(500, .06, "square", .07);
}

function soundStart() {

    tone(440, .08, "triangle", .08);

    setTimeout(() => {
        tone(660, .08, "triangle", .09);
    }, 70);

    setTimeout(() => {
        tone(880, .15, "triangle", .1);
    }, 140);
}

/* =========================================================
   PROCEDURAL MUSIC
========================================================= */

const melody = [
    261.63,
    329.63,
    392.00,
    523.25,
    392.00,
    329.63,
    293.66,
    392.00
];

const bass = [
    130.81,
    130.81,
    146.83,
    146.83,
    164.81,
    164.81,
    146.83,
    130.81
];

function musicTick() {

    if (!audioStarted) return;

    if (!audioSettings.musicEnabled) return;

    const m = melody[musicStep % melody.length];
    const b = bass[musicStep % bass.length];

    tone(
        m,
        .13,
        "triangle",
        .07,
        musicGain
    );

    if (musicStep % 2 === 0) {
        tone(
            b,
            .18,
            "sine",
            .045,
            musicGain
        );
    }

    musicStep++;
}

function startMusic() {

    if (musicTimer) {
        clearInterval(musicTimer);
    }

    musicTimer = setInterval(
        musicTick,
        210
    );
}

/* =========================================================
   SETTINGS
========================================================= */

const settings = document.getElementById("settings");

const sfxVolume =
    document.getElementById("sfxVolume");

const musicVolume =
    document.getElementById("musicVolume");

const sfxValue =
    document.getElementById("sfxValue");

const musicValue =
    document.getElementById("musicValue");

const sfxToggle =
    document.getElementById("sfxToggle");

const musicToggle =
    document.getElementById("musicToggle");

sfxVolume.value =
    audioSettings.sfxVolume;

musicVolume.value =
    audioSettings.musicVolume;

function refreshSettingsUI() {

    sfxVolume.value =
        audioSettings.sfxVolume;

    musicVolume.value =
        audioSettings.musicVolume;

    sfxValue.textContent =
        audioSettings.sfxVolume + "%";

    musicValue.textContent =
        audioSettings.musicVolume + "%";

    sfxToggle.classList.toggle(
        "active",
        audioSettings.sfxEnabled
    );

    musicToggle.classList.toggle(
        "active",
        audioSettings.musicEnabled
    );
}

refreshSettingsUI();

sfxVolume.addEventListener("input", () => {

    audioSettings.sfxVolume =
        Number(sfxVolume.value);

    localStorage.setItem(
        "moiCySfx",
        audioSettings.sfxVolume
    );

    updateAudioVolumes();

    soundClick();

    refreshSettingsUI();
});

musicVolume.addEventListener("input", () => {

    audioSettings.musicVolume =
        Number(musicVolume.value);

    localStorage.setItem(
        "moiCyMusic",
        audioSettings.musicVolume
    );

    updateAudioVolumes();

    refreshSettingsUI();
});

sfxToggle.addEventListener("click", () => {

    initAudio();

    audioSettings.sfxEnabled =
        !audioSettings.sfxEnabled;

    localStorage.setItem(
        "moiCySfxEnabled",
        audioSettings.sfxEnabled
    );

    updateAudioVolumes();

    refreshSettingsUI();

    if (audioSettings.sfxEnabled) {
        soundClick();
    }
});

musicToggle.addEventListener("click", () => {

    initAudio();

    audioSettings.musicEnabled =
        !audioSettings.musicEnabled;

    localStorage.setItem(
        "moiCyMusicEnabled",
        audioSettings.musicEnabled
    );

    updateAudioVolumes();

    refreshSettingsUI();
});

document
    .getElementById("settingsBtn")
    .addEventListener("click", () => {

        initAudio();
        settings.style.display = "flex";
        soundClick();
    });

document
    .getElementById("closeSettings")
    .addEventListener("click", () => {

        settings.style.display = "none";
        soundClick();
    });

document
    .getElementById("soundBtn")
    .addEventListener("click", () => {

        initAudio();

        audioSettings.sfxEnabled =
            !audioSettings.sfxEnabled;

        localStorage.setItem(
            "moiCySfxEnabled",
            audioSettings.sfxEnabled
        );

        updateAudioVolumes();
        refreshSettingsUI();

        if (audioSettings.sfxEnabled) {
            soundClick();
        }
    });

document
    .getElementById("musicBtn")
    .addEventListener("click", () => {

        initAudio();

        audioSettings.musicEnabled =
            !audioSettings.musicEnabled;

        localStorage.setItem(
            "moiCyMusicEnabled",
            audioSettings.musicEnabled
        );

        updateAudioVolumes();
        refreshSettingsUI();
    });

/* =========================================================
   GAME STATE
========================================================= */

let running = false;

let score = 0;
let combo = 1;
let distance = 0;

let lane = 1;
let targetLane = 1;

let jumpHeight = 0;
let jumpVelocity = 0;
let grounded = true;

let trickTimer = 0;
let trickRotation = 0;

let speed = 390;

let spawnTimer = 0;
let coinTimer = 0;

let lastTime = 0;

let shake = 0;

let obstacles = [];
let coins = [];
let particles = [];

/* =========================================================
   PLAYER
========================================================= */

const player = {
    x: 0,
    width: 48,
    height: 74,
    tilt: 0,
    wheelRotation: 0
};

function groundY() {
    return innerHeight * .73;
}

function laneX(l) {

    const roadWidth =
        Math.min(innerWidth * .8, 850);

    const left =
        innerWidth / 2 - roadWidth / 2;

    return left +
        roadWidth * ((l + .5) / 3);
}

function playerY() {

    return groundY() -
        jumpHeight -
        player.height;
}

/* =========================================================
   PARTICLES
========================================================= */

function particle(
    x,
    y,
    color,
    amount = 8
) {

    for (let i = 0; i < amount; i++) {

        particles.push({
            x,
            y,
            vx: (Math.random() - .5) * 250,
            vy: (Math.random() - .5) * 250,
            life: .5 + Math.random() * .5,
            maxLife: 1,
            size: 2 + Math.random() * 5,
            color
        });
    }
}

function updateParticles(dt) {

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vy += 500 * dt;
        p.life -= dt;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(0, p.life / p.maxLife);

        ctx.fillStyle = p.color;

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha = 1;
}

/* =========================================================
   OBSTACLES
========================================================= */

const obstacleTypes = [
    "barrier",
    "rail",
    "cone",
    "ramp",
    "stairs",
    "box"
];

function spawnObstacle() {

    const type =
        obstacleTypes[
            Math.floor(
                Math.random() *
                obstacleTypes.length
            )
        ];

    obstacles.push({
        lane: Math.floor(Math.random() * 3),
        y: -100,
        type,
        passed: false,
        width: type === "rail" ? 100 : 65,
        height: type === "ramp" ? 55 : 55
    });
}

function spawnCoin() {

    coins.push({
        lane: Math.floor(Math.random() * 3),
        y: -30,
        collected: false,
        spin: Math.random() * Math.PI * 2
    });
}

/* =========================================================
   COLLISION
========================================================= */

function playerRect() {

    return {
        x: laneX(lane) - 23,
        y: playerY(),
        width: 46,
        height: 72
    };
}

function obstacleRect(o) {

    const x =
        laneX(o.lane);

    return {
        x: x - o.width / 2,
        y: o.y,
        width: o.width,
        height: o.height
    };
}

function intersects(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

/* =========================================================
   TRICKS
========================================================= */

const tricks = [
    "KICKFLIP!",
    "HEELFLIP!",
    "360!",
    "POP SHUVIT!",
    "BIG AIR!",
    "INSANE!"
];

function doTrick() {

    if (!running) return;

    if (jumpHeight <= 10) {
        return;
    }

    if (trickTimer > 0) {
        return;
    }

    trickTimer = .55;

    trickRotation +=
        Math.PI * 2;

    combo++;

    const trick =
        tricks[
            Math.floor(
                Math.random() *
                tricks.length
            )
        ];

    const points =
        250 * combo;

    score += points;

    document.getElementById(
        "trickPopup"
    ).textContent = trick;

    const popup =
        document.getElementById(
            "trickPopup"
        );

    popup.classList.remove("show");

    void popup.offsetWidth;

    popup.classList.add("show");

    soundTrick();
    soundCombo(combo);

    particle(
        laneX(lane),
        playerY() + 30,
        "#ffd84d",
        18
    );

    updateHUD();
}

/* =========================================================
   JUMP
========================================================= */

function jump() {

    if (!running) return;

    if (!grounded) return;

    grounded = false;

    jumpHeight = 1;

    jumpVelocity = 730;

    soundJump();

    particle(
        laneX(lane),
        groundY(),
        "#ffffff",
        12
    );
}

/* =========================================================
   MOVE
========================================================= */

function moveLeft() {

    if (!running) return;

    targetLane =
        Math.max(0, targetLane - 1);
}

function moveRight() {

    if (!running) return;

    targetLane =
        Math.min(2, targetLane + 1);
}

/* =========================================================
   RESET
========================================================= */

function resetGame() {

    score = 0;
    combo = 1;
    distance = 0;

    lane = 1;
    targetLane = 1;

    jumpHeight = 0;
    jumpVelocity = 0;
    grounded = true;

    trickTimer = 0;
    trickRotation = 0;

    speed = 390;

    spawnTimer = .5;
    coinTimer = .8;

    obstacles = [];
    coins = [];
    particles = [];

    player.tilt = 0;

    updateHUD();
}

/* =========================================================
   START
========================================================= */

function startGame() {

    initAudio();
    resetGame();

    running = true;

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "gameOver"
    ).style.display = "none";

    document.getElementById(
        "hud"
    ).style.display = "block";

    soundStart();

    lastTime = performance.now();
}

/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    if (!running) return;

    running = false;

    soundCrash();

    shake = 18;

    document.getElementById(
        "finalScore"
    ).textContent =
        Math.floor(score).toLocaleString("de-DE");

    document.getElementById(
        "gameOver"
    ).style.display = "flex";
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    if (!running) {
        updateParticles(dt);
        return;
    }

    /* speed */

    speed += dt * 5;

    distance += speed * dt * .035;

    score += dt * 12 * combo;

    /* lane movement */

    const laneSpeed = 10;

    lane +=
        (targetLane - lane) *
        Math.min(1, laneSpeed * dt);

    /* wheel */

    player.wheelRotation +=
        speed * dt / 25;

    /* jump physics */

    if (!grounded) {

        jumpVelocity -=
            1750 * dt;

        jumpHeight +=
            jumpVelocity * dt;

        if (jumpHeight <= 0) {

            jumpHeight = 0;

            jumpVelocity = 0;

            grounded = true;

            soundLand(combo >= 3);

            if (combo >= 3) {
                particle(
                    laneX(lane),
                    groundY(),
                    "#ffd84d",
                    16
                );
            }

            if (combo > 1) {
                setTimeout(() => {
                    combo = 1;
                    updateHUD();
                }, 1000);
            }
        }
    }

    if (trickTimer > 0) {
        trickTimer -= dt;
        trickRotation +=
            dt * 20;
    }

    /* obstacle spawning */

    spawnTimer -= dt;

    if (spawnTimer <= 0) {

        spawnObstacle();

        spawnTimer =
            Math.max(
                .55,
                1.25 -
                distance / 1500
            ) +
            Math.random() * .35;
    }

    /* coins */

    coinTimer -= dt;

    if (coinTimer <= 0) {

        spawnCoin();

        coinTimer =
            .65 +
            Math.random() * .9;
    }

    /* obstacles */

    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const o = obstacles[i];

        o.y += speed * dt;

        if (
            !o.passed &&
            o.y > groundY() - 50
        ) {

            o.passed = true;

            if (
                o.lane ===
                Math.round(lane)
            ) {

                const jumping =
                    jumpHeight > 55;

                const isRamp =
                    o.type === "ramp";

                if (
                    isRamp &&
                    jumping
                ) {

                    score += 300 * combo;

                    combo++;

                    soundCombo(combo);

                    particle(
                        laneX(o.lane),
                        o.y,
                        "#37e0d0",
                        20
                    );

                } else if (
                    !jumping &&
                    o.type !== "ramp"
                ) {

                    gameOver();
                    break;
                }
            }
        }

        if (o.y > innerHeight + 150) {
            obstacles.splice(i, 1);
        }
    }

    /* coins */

    const p =
        playerRect();

    for (
        let i = coins.length - 1;
        i >= 0;
        i--
    ) {

        const c = coins[i];

        c.y += speed * dt;

        c.spin += dt * 8;

        const coinRect = {
            x: laneX(c.lane) - 18,
            y: c.y - 18,
            width: 36,
            height: 36
        };

        if (
            !c.collected &&
            intersects(p, coinRect)
        ) {

            c.collected = true;

            score +=
                100 * combo;

            soundCoin();

            particle(
                laneX(c.lane),
                c.y,
                "#ffd84d",
                14
            );
        }

        if (
            c.collected ||
            c.y > innerHeight + 80
        ) {
            coins.splice(i, 1);
        }
    }

    updateParticles(dt);

    /* shake */

    if (shake > 0) {
        shake -=
            30 * dt;
    }

    updateHUD();
}

/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    document.getElementById(
        "score"
    ).textContent =
        Math.floor(score)
            .toLocaleString("de-DE");

    document.getElementById(
        "combo"
    ).textContent =
        "x" + combo;

    document.getElementById(
        "distance"
    ).textContent =
        Math.floor(distance) + "m";

    const comboBox =
        document.getElementById(
            "comboBox"
        );

    if (combo >= 2) {

        comboBox.textContent =
            "COMBO x" + combo;

        comboBox.classList.add("show");

    } else {

        comboBox.classList.remove("show");
    }
}

/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    const h = innerHeight;

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            h
        );

    gradient.addColorStop(
        0,
        "#ff5fa2"
    );

    gradient.addColorStop(
        .42,
        "#ff9a55"
    );

    gradient.addColorStop(
        .72,
        "#ffd84d"
    );

    gradient.addColorStop(
        1,
        "#38ddd0"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        innerWidth,
        h
    );

    /* sun */

    ctx.fillStyle =
        "rgba(255,255,255,.65)";

    ctx.beginPath();

    ctx.arc(
        innerWidth * .8,
        innerHeight * .18,
        70,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* clouds */

    drawCloud(
        innerWidth * .2,
        innerHeight * .18,
        1
    );

    drawCloud(
        innerWidth * .62,
        innerHeight * .27,
        .7
    );

    /* skyline */

    const skylineY =
        innerHeight * .56;

    ctx.fillStyle =
        "rgba(45,30,80,.5)";

    for (
        let x = -20;
        x < innerWidth + 50;
        x += 65
    ) {

        const height =
            40 +
            Math.abs(
                Math.sin(x * .07)
            ) * 130;

        ctx.fillRect(
            x,
            skylineY - height,
            52,
            height
        );

        ctx.fillStyle =
            "rgba(255,255,255,.13)";

        for (
            let wy = skylineY - height + 12;
            wy < skylineY - 10;
            wy += 18
        ) {

            ctx.fillRect(
                x + 9,
                wy,
                7,
                7
            );

            ctx.fillRect(
                x + 27,
                wy,
                7,
                7
            );
        }

        ctx.fillStyle =
            "rgba(45,30,80,.5)";
    }

    /* distant ground */

    ctx.fillStyle = "#35c8b8";

    ctx.fillRect(
        0,
        skylineY,
        innerWidth,
        innerHeight - skylineY
    );
}

function drawCloud(x, y, scale) {

    ctx.fillStyle =
        "rgba(255,255,255,.35)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 28 * scale,
        y - 10 * scale,
        32 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 60 * scale,
        y,
        24 * scale,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

/* =========================================================
   ROAD
========================================================= */

function drawRoad() {

    const roadWidth =
        Math.min(
            innerWidth * .82,
            900
        );

    const left =
        innerWidth / 2 -
        roadWidth / 2;

    const roadY =
        innerHeight * .59;

    /* grass */

    ctx.fillStyle =
        "#27b7a8";

    ctx.fillRect(
        0,
        roadY,
        innerWidth,
        innerHeight - roadY
    );

    /* road */

    ctx.fillStyle =
        "#362554";

    ctx.beginPath();

    ctx.moveTo(
        left,
        roadY
    );

    ctx.lineTo(
        left + 55,
        innerHeight
    );

    ctx.lineTo(
        left + roadWidth - 55,
        innerHeight
    );

    ctx.lineTo(
        left + roadWidth,
        roadY
    );

    ctx.closePath();

    ctx.fill();

    /* road edge */

    ctx.strokeStyle =
        "#ff4d9d";

    ctx.lineWidth = 7;

    ctx.beginPath();

    ctx.moveTo(
        left,
        roadY
    );

    ctx.lineTo(
        left + 55,
        innerHeight
    );

    ctx.moveTo(
        left + roadWidth,
        roadY
    );

    ctx.lineTo(
        left + roadWidth - 55,
        innerHeight
    );

    ctx.stroke();

    /* lane lines */

    ctx.setLineDash([30, 30]);

    ctx.strokeStyle =
        "rgba(255,255,255,.25)";

    ctx.lineWidth = 4;

    for (let i = 1; i < 3; i++) {

        const x =
            left +
            roadWidth * i / 3;

        ctx.beginPath();

        ctx.moveTo(
            x,
            roadY
        );

        ctx.lineTo(
            x,
            innerHeight
        );

        ctx.stroke();
    }

    ctx.setLineDash([]);
}

/* =========================================================
   OBSTACLE DRAWING
========================================================= */

function drawObstacle(o) {

    const x = laneX(o.lane);
    const y = o.y;

    ctx.save();

    if (o.type === "barrier") {

        ctx.fillStyle = "#ff3c91";

        ctx.fillRect(
            x - 35,
            y,
            70,
            25
        );

        ctx.fillStyle = "#ffd84d";

        for (let i = 0; i < 3; i++) {

            ctx.save();

            ctx.translate(
                x - 25 + i * 25,
                y + 12
            );

            ctx.rotate(-.45);

            ctx.fillRect(
                -4,
                -13,
                8,
                26
            );

            ctx.restore();
        }

        ctx.fillStyle = "#222";

        ctx.fillRect(
            x - 30,
            y + 25,
            8,
            28
        );

        ctx.fillRect(
            x + 22,
            y + 25,
            8,
            28
        );
    }

    else if (o.type === "rail") {

        ctx.strokeStyle = "#d7e8ff";
        ctx.lineWidth = 7;

        ctx.beginPath();

        ctx.moveTo(
            x - 48,
            y + 35
        );

        ctx.lineTo(
            x + 48,
            y + 35
        );

        ctx.stroke();

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            x - 35,
            y + 35
        );

        ctx.lineTo(
            x - 25,
            y + 55
        );

        ctx.moveTo(
            x + 35,
            y + 35
        );

        ctx.lineTo(
            x + 25,
            y + 55
        );

        ctx.stroke();
    }

    else if (o.type === "cone") {

        ctx.fillStyle = "#ff6b35";

        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x - 28,
            y + 55
        );

        ctx.lineTo(
            x + 28,
            y + 55
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle = "white";

        ctx.fillRect(
            x - 16,
            y + 30,
            32,
            7
        );
    }

    else if (o.type === "ramp") {

        ctx.fillStyle = "#ff3c91";

        ctx.beginPath();

        ctx.moveTo(
            x - 45,
            y + 55
        );

        ctx.lineTo(
            x + 45,
            y + 55
        );

        ctx.lineTo(
            x + 45,
            y + 35
        );

        ctx.quadraticCurveTo(
            x + 25,
            y,
            x - 45,
            y + 55
        );

        ctx.closePath();

        ctx.fill();

        ctx.strokeStyle = "#ffd84d";
        ctx.lineWidth = 4;

        ctx.stroke();
    }

    else if (o.type === "stairs") {

        ctx.fillStyle = "#ff9b3d";

        for (let i = 0; i < 4; i++) {

            ctx.fillRect(
                x - 38 + i * 10,
                y + 15 + i * 10,
                20 + i * 8,
                40 - i * 8
            );
        }
    }

    else if (o.type === "box") {

        ctx.fillStyle = "#653b91";

        ctx.fillRect(
            x - 35,
            y + 10,
            70,
            45
        );

        ctx.fillStyle = "#ffd84d";

        ctx.fillRect(
            x - 30,
            y + 15,
            60,
            6
        );
    }

    ctx.restore();
}

/* =========================================================
   COIN DRAWING
========================================================= */

function drawCoin(c) {

    const x = laneX(c.lane);
    const y = c.y;

    const width =
        Math.abs(
            Math.cos(c.spin)
        ) * 16 + 4;

    ctx.save();

    ctx.fillStyle = "#ffd84d";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        width,
        20,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = "#fff4a0";
    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.fillStyle = "#ff9d25";

    ctx.font =
        "bold 17px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        "$",
        x,
        y + 6
    );

    ctx.restore();
}

/* =========================================================
   PLAYER DRAWING
========================================================= */

function drawPlayer() {

    const x = laneX(
        Math.round(lane)
    );

    const y = playerY();

    ctx.save();

    ctx.translate(
        x,
        y + player.height / 2
    );

    let tilt =
        (targetLane - lane) * .35;

    if (!grounded) {
        tilt +=
            Math.sin(
                performance.now() / 100
            ) * .05;
    }

    ctx.rotate(tilt);

    /* shadow */

    if (grounded) {

        ctx.restore();

        ctx.save();

        ctx.globalAlpha = .2;

        ctx.fillStyle = "#111";

        ctx.beginPath();

        ctx.ellipse(
            x,
            groundY() + 5,
            35,
            8,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();

        ctx.save();

        ctx.translate(
            x,
            y + player.height / 2
        );

        ctx.rotate(tilt);
    }

    /* skateboard */

    ctx.strokeStyle = "#ff3c91";
    ctx.lineWidth = 8;

    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.moveTo(
        -27,
        27
    );

    ctx.quadraticCurveTo(
        0,
        34,
        27,
        27
    );

    ctx.stroke();

    /* wheels */

    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(
        -18,
        35,
        6,
        0,
        Math.PI * 2
    );

    ctx.arc(
        18,
        35,
        6,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* legs */

    ctx.strokeStyle = "#17122e";
    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(
        -5,
        5
    );

    ctx.lineTo(
        -14,
        27
    );

    ctx.moveTo(
        7,
        5
    );

    ctx.lineTo(
        15,
        27
    );

    ctx.stroke();

    /* body */

    ctx.fillStyle = "#37e0d0";

    ctx.fillRect(
        -13,
        -25,
        26,
        34
    );

    /* arms */

    ctx.strokeStyle = "#ffcfad";
    ctx.lineWidth = 7;

    ctx.beginPath();

    ctx.moveTo(
        -10,
        -18
    );

    ctx.lineTo(
        -28,
        -3
    );

    ctx.moveTo(
        10,
        -18
    );

    ctx.lineTo(
        27,
        -5
    );

    ctx.stroke();

    /* head */

    ctx.fillStyle = "#ffcfad";

    ctx.beginPath();

    ctx.arc(
        0,
        -39,
        14,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* hair */

    ctx.fillStyle = "#17122e";

    ctx.beginPath();

    ctx.arc(
        0,
        -44,
        14,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();

    /* cap */

    ctx.fillStyle = "#ff3c91";

    ctx.beginPath();

    ctx.arc(
        2,
        -48,
        13,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillRect(
        1,
        -48,
        19,
        5
    );

    /* trick board spin */

    if (trickTimer > 0) {

        ctx.save();

        ctx.rotate(
            trickRotation
        );

        ctx.strokeStyle =
            "#ffd84d";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            -30,
            25
        );

        ctx.lineTo(
            30,
            25
        );

        ctx.stroke();

        ctx.restore();
    }

    ctx.restore();
}

/* =========================================================
   DRAW
========================================================= */

function draw() {

    ctx.save();

    if (shake > 0) {

        ctx.translate(
            (Math.random() - .5) *
                shake,
            (Math.random() - .5) *
                shake
        );
    }

    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );

    drawBackground();
    drawRoad();

    for (const c of coins) {
        drawCoin(c);
    }

    for (const o of obstacles) {
        drawObstacle(o);
    }

    drawPlayer();

    drawParticles();

    ctx.restore();
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(time) {

    const dt =
        Math.min(
            .035,
            (time - lastTime) / 1000 || 0
        );

    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e => {

        if (
            e.code === "Space" ||
            e.code === "ArrowUp"
        ) {

            e.preventDefault();

            initAudio();
            jump();
        }

        if (
            e.code === "ArrowLeft" ||
            e.code === "KeyA"
        ) {

            e.preventDefault();

            initAudio();
            moveLeft();
        }

        if (
            e.code === "ArrowRight" ||
            e.code === "KeyD"
        ) {

            e.preventDefault();

            initAudio();
            moveRight();
        }

        if (e.code === "KeyF") {

            e.preventDefault();

            initAudio();
            doTrick();
        }

        if (e.code === "KeyR") {

            e.preventDefault();

            if (!running) {
                startGame();
            }
        }
    }
);

/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        startGame
    );

document
    .getElementById("restartBtn")
    .addEventListener(
        "click",
        startGame
    );

/* =========================================================
   MOBILE
========================================================= */

function mobileAction(
    element,
    action
) {

    element.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            initAudio();

            action();
        }
    );
}

mobileAction(
    document.getElementById("leftBtn"),
    moveLeft
);

mobileAction(
    document.getElementById("rightBtn"),
    moveRight
);

mobileAction(
    document.getElementById("jumpBtn"),
    jump
);

mobileAction(
    document.getElementById("trickBtn"),
    doTrick
);

/* =========================================================
   AUDIO UNLOCK
========================================================= */

document.addEventListener(
    "pointerdown",
    () => {
        if (!audioStarted) {
            initAudio();
        }
    },
    { once: true }
);

</script>

</body>
</html>
