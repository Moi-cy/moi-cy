<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Moi-cy Skate Rush</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#12062b;
    font-family:Arial,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* HUD */

#hud{
    position:fixed;
    top:15px;
    left:18px;
    right:18px;
    z-index:10;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    pointer-events:none;
}

.logo{
    font-size:clamp(28px,5vw,48px);
    font-weight:1000;
    font-style:italic;
    transform:rotate(-5deg);

    text-shadow:
        4px 4px 0 #ff2490,
        8px 8px 0 #4020ae;
}

.logo span{
    color:#fff06a;
}

.stats{
    display:flex;
    gap:7px;
}

.stat{
    min-width:85px;
    padding:8px 12px;

    text-align:center;

    border:2px solid rgba(255,255,255,.8);
    border-radius:15px;

    background:rgba(20,6,48,.65);
    backdrop-filter:blur(8px);
}

.stat small{
    display:block;
    font-size:9px;
    opacity:.7;
}

.stat strong{
    display:block;
    font-size:18px;
}

/* COMBO */

#combo{
    position:fixed;
    top:105px;
    left:50%;

    transform:translateX(-50%) scale(.6);

    opacity:0;

    z-index:15;

    text-align:center;

    pointer-events:none;

    transition:.2s;
}

#combo.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
}

#comboText{
    font-size:clamp(35px,8vw,70px);
    font-weight:1000;
    font-style:italic;

    color:white;

    text-shadow:
        5px 5px 0 #ff2993,
        9px 9px 0 #4420b5;
}

#comboPoints{
    color:#fff16a;
    font-weight:900;
}

/* TRICK */

#trick{
    position:fixed;
    left:50%;
    top:45%;

    transform:
        translate(-50%,-50%)
        scale(.5)
        rotate(-6deg);

    opacity:0;

    z-index:20;

    font-size:clamp(30px,7vw,70px);
    font-weight:1000;
    font-style:italic;

    color:#fff16a;

    text-shadow:
        5px 5px 0 #ff2793,
        9px 9px 0 #4520b8;

    pointer-events:none;

    transition:.3s;
}

/* PROGRESS */

.progress{
    position:fixed;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    width:min(430px,45vw);
    height:8px;

    background:rgba(255,255,255,.2);

    border-radius:20px;

    overflow:hidden;

    z-index:10;
}

.progressBar{
    height:100%;
    width:0%;

    background:#fff16a;

    box-shadow:0 0 15px #fff16a;
}

/* MENU */

#menu{
    position:fixed;
    inset:0;

    z-index:50;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.15),
            transparent 35%
        );
}

.card{
    width:min(600px,94vw);

    padding:40px 30px;

    text-align:center;

    background:rgba(20,6,48,.85);

    border:3px solid white;
    border-radius:32px;

    backdrop-filter:blur(16px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.4);
}

.title{
    font-size:clamp(50px,11vw,90px);
    line-height:.8;

    font-weight:1000;
    font-style:italic;

    transform:rotate(-5deg);

    text-shadow:
        6px 6px 0 #ff2991,
        11px 11px 0 #4220b5;
}

.title span{
    color:#fff16a;
}

.subtitle{
    margin:20px 0 25px;
    opacity:.85;
    font-size:18px;
}

.play{
    border:0;

    padding:17px 40px;

    border-radius:100px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff2991,
            #7138ff
        );

    font-size:21px;
    font-weight:1000;

    cursor:pointer;

    box-shadow:
        0 7px 0 #321468,
        0 15px 35px rgba(255,30,145,.3);
}

.play:active{
    transform:translateY(5px);

    box-shadow:
        0 2px 0 #321468;
}

.controls{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:8px;

    margin-top:30px;
}

.control{
    padding:10px 5px;

    border-radius:14px;

    background:rgba(255,255,255,.06);

    font-size:11px;
}

.control b{
    display:block;

    color:#fff16a;

    font-size:17px;

    margin-bottom:4px;
}

/* GAME OVER */

#gameOver{
    position:fixed;
    inset:0;

    z-index:60;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(15,3,35,.7);

    backdrop-filter:blur(8px);
}

.over{
    width:min(500px,90vw);

    padding:35px;

    text-align:center;

    background:rgba(22,6,48,.92);

    border:3px solid white;
    border-radius:30px;
}

.over h2{
    font-size:55px;
    font-style:italic;

    color:#ff4a9d;

    text-shadow:
        4px 4px 0 #4320b5;
}

.final{
    margin:18px 0 25px;
    font-size:23px;
}

/* MOBILE */

.mobile{
    position:fixed;

    left:18px;
    right:18px;
    bottom:25px;

    z-index:30;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.group{
    display:flex;
    gap:9px;
}

.btn{
    width:64px;
    height:64px;

    border:2px solid rgba(255,255,255,.7);
    border-radius:20px;

    background:rgba(25,7,50,.65);

    color:white;

    font-size:25px;
    font-weight:1000;

    backdrop-filter:blur(8px);

    pointer-events:auto;
}

.btn:active{
    transform:scale(.88);
    background:#ff2f93;
}

@media(min-width:800px){
    .mobile{
        opacity:.15;
    }
}

@media(max-width:600px){

    #hud{
        top:9px;
        left:9px;
        right:9px;
    }

    .logo{
        font-size:28px;
    }

    .stat{
        min-width:60px;
        padding:6px;
    }

    .stat small{
        font-size:7px;
    }

    .stat strong{
        font-size:13px;
    }

    .controls{
        grid-template-columns:repeat(2,1fr);
    }

    .progress{
        bottom:105px;
        width:45vw;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- HUD -->

<div id="hud">

    <div class="logo">
        Moi-<span>cy</span>
    </div>

    <div class="stats">

        <div class="stat">
            <small>SCORE</small>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <small>COMBO</small>
            <strong id="comboNumber">x1</strong>
        </div>

        <div class="stat">
            <small>DISTANZ</small>
            <strong id="distance">0m</strong>
        </div>

    </div>

</div>

<!-- COMBO -->

<div id="combo">

    <div id="comboText">
        COMBO!
    </div>

    <div id="comboPoints">
        +0
    </div>

</div>

<div id="trick"></div>

<!-- PROGRESS -->

<div class="progress">
    <div
        class="progressBar"
        id="progressBar">
    </div>
</div>

<!-- MENU -->

<div id="menu">

    <div class="card">

        <div class="title">
            MOI-<span>CY</span><br>
            SKATE
        </div>

        <div class="subtitle">
            Skate. Trick. Combo. Repeat. 🛹
        </div>

        <button
            class="play"
            onclick="startGame()">

            🛹 START SKATING

        </button>

        <div class="controls">

            <div class="control">
                <b>← →</b>
                Spur
            </div>

            <div class="control">
                <b>SPACE</b>
                Springen
            </div>

            <div class="control">
                <b>F</b>
                Trick
            </div>

            <div class="control">
                <b>R</b>
                Neustart
            </div>

        </div>

    </div>

</div>

<!-- GAME OVER -->

<div id="gameOver">

    <div class="over">

        <h2>
            WIPEOUT! 💥
        </h2>

        <div class="final">
            Score:
            <strong id="finalScore">
                0
            </strong>
        </div>

        <button
            class="play"
            onclick="startGame()">

            🔥 NOCHMAL!

        </button>

    </div>

</div>

<!-- MOBILE -->

<div class="mobile">

    <div class="group">

        <button
            class="btn"
            id="left">
            ←
        </button>

        <button
            class="btn"
            id="right">
            →
        </button>

    </div>

    <div class="group">

        <button
            class="btn"
            id="jump">
            ⬆
        </button>

        <button
            class="btn"
            id="trickBtn">
            ★
        </button>

    </div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   GAME VARIABLES
========================================================= */

let playing = false;
let gameOver = false;

let score = 0;
let distance = 0;

let combo = 1;
let comboTimer = 0;

let speed = 7;


/*
    PLAYER

    lane:
    0 = links
    1 = mitte
    2 = rechts

    jumpHeight:
    0 = Boden

    Wichtig:
    Diese Variable ist IMMER positiv,
    wenn der Spieler in der Luft ist.
*/

let lane = 1;
let targetLane = 1;

let jumpHeight = 0;
let jumpVelocity = 0;

let grounded = true;

let playerRotation = 0;

let trickActive = false;


/* ARRAYS */

let obstacles = [];
let coins = [];
let particles = [];


/* TIMERS */

let obstacleTimer = 0;
let coinTimer = 1;


/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight" ||
            e.key === "ArrowUp"
        ){
            e.preventDefault();
        }


        /* LINKS */

        if(
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ){

            moveLeft();
        }


        /* RECHTS */

        if(
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ){

            moveRight();
        }


        /* SPRUNG */

        if(
            e.code === "Space" ||
            e.key === "ArrowUp"
        ){

            jump();
        }


        /* TRICK */

        if(
            e.key.toLowerCase() === "f"
        ){

            trick();
        }


        /* RESTART */

        if(
            e.key.toLowerCase() === "r"
        ){

            startGame();
        }

    }
);


/* =========================================================
   MOVEMENT
========================================================= */

function moveLeft(){

    if(!playing)
        return;

    targetLane =
        Math.max(
            0,
            targetLane - 1
        );
}


function moveRight(){

    if(!playing)
        return;

    targetLane =
        Math.min(
            2,
            targetLane + 1
        );
}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        !playing ||
        gameOver
    ){
        return;
    }


    /*
        NICHT nochmal springen,
        wenn bereits in der Luft.
    */

    if(!grounded)
        return;


    grounded = false;

    /*
        Positive Höhe.
        Negative Velocity bedeutet:
        Höhe nimmt zuerst zu.
    */

    jumpHeight = 1;

    jumpVelocity = 720;

    trickActive = false;


    createParticles(
        playerX(),
        groundY() + 20,
        14,
        "#ffffff"
    );
}


/* =========================================================
   TRICK
========================================================= */

function trick(){

    if(
        !playing ||
        gameOver
    ){
        return;
    }


    if(!grounded){

        trickActive = true;

        playerRotation +=
            Math.PI * 2;

        comboTimer = 3;


        const tricks = [

            "KICKFLIP!",
            "HEELFLIP!",
            "360!",
            "BIG AIR!",
            "INSANE!",
            "SKATE GOD!"

        ];


        const name =
            tricks[
                Math.floor(
                    Math.random() *
                    tricks.length
                )
            ];


        showTrick(name);


        score +=
            150 *
            Math.max(
                1,
                Math.floor(combo)
            );


        combo += .5;


        createParticles(
            playerX(),
            playerY(),
            22,
            randomColor()
        );
    }
}


/* =========================================================
   TRICK POPUP
========================================================= */

function showTrick(text){

    const el =
        document.getElementById(
            "trick"
        );

    el.textContent = text;

    el.style.opacity = "1";

    el.style.transform =
        "translate(-50%,-50%) scale(1) rotate(-6deg)";


    setTimeout(
        function(){

            el.style.opacity = "0";

            el.style.transform =
                "translate(-50%,-70%) scale(1.4) rotate(-6deg)";

        },
        500
    );
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document
        .getElementById("menu")
        .style.display =
        "none";

    document
        .getElementById("gameOver")
        .style.display =
        "none";


    playing = true;
    gameOver = false;


    score = 0;
    distance = 0;

    combo = 1;
    comboTimer = 0;

    speed = 7;


    lane = 1;
    targetLane = 1;


    /*
        WICHTIG:
        Beim Start IMMER auf Boden.
    */

    jumpHeight = 0;
    jumpVelocity = 0;

    grounded = true;


    playerRotation = 0;

    trickActive = false;


    obstacles = [];
    coins = [];
    particles = [];


    obstacleTimer = .7;
    coinTimer = 1;
}


/* =========================================================
   GROUND
========================================================= */

function groundY(){

    return H * .76;
}


/* =========================================================
   PLAYER X
========================================================= */

function playerX(){

    /*
        Der Skater befindet sich
        immer im unteren Bereich.

        Nur die Spur verändert X.
    */

    return (
        W / 2 +
        (lane - 1) *
        W * .16
    );
}


/* =========================================================
   PLAYER Y
========================================================= */

function playerY(){

    /*
        HIER passiert der eigentliche
        Höhenunterschied.

        Boden:
            groundY()

        Springen:
            groundY() - jumpHeight
    */

    return (
        groundY() -
        jumpHeight
    );
}


/* =========================================================
   SPAWN OBSTACLE
========================================================= */

function spawnObstacle(){

    const types = [

        "barrier",
        "rail",
        "cone",
        "ramp",
        "stairs",
        "box"

    ];


    obstacles.push({

        lane:
            Math.floor(
                Math.random() * 3
            ),

        z: 1,

        type:
            types[
                Math.floor(
                    Math.random() *
                    types.length
                )
            ],

        passed:false,

        color:
            randomColor()
    });
}


/* =========================================================
   SPAWN COINS
========================================================= */

function spawnCoins(){

    const selectedLane =
        Math.floor(
            Math.random() * 3
        );


    for(
        let i = 0;
        i < 6;
        i++
    ){

        coins.push({

            lane:selectedLane,

            z:
                1 +
                i * .075,

            collected:false

        });
    }
}


/* =========================================================
   COLOR
========================================================= */

function randomColor(){

    const colors = [

        "#ff3d9d",
        "#ffdb4d",
        "#6b5cff",
        "#39dfbd",
        "#ff7147",
        "#ffffff"

    ];

    return colors[
        Math.floor(
            Math.random() *
            colors.length
        )
    ];
}


/* =========================================================
   ROAD
========================================================= */

function roadY(z){

    const horizon =
        H * .48;

    const bottom =
        H * 1.04;

    return (
        horizon +
        Math.pow(
            1 - z,
            2
        ) *
        (bottom - horizon)
    );
}


function roadWidth(z){

    return (
        65 +
        Math.pow(
            1 - z,
            2
        ) *
        W *
        .82
    );
}


function laneX(
    selectedLane,
    z
){

    return (
        W / 2 +
        (selectedLane - 1) *
        roadWidth(z) /
        3
    );
}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    x,
    y,
    amount,
    color
){

    for(
        let i = 0;
        i < amount;
        i++
    ){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random() - .5) *
                8,

            vy:
                (Math.random() - .5) *
                8,

            life:1,

            size:
                Math.random() *
                5 +
                2,

            color:color

        });
    }
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(!playing)
        return;


    /* --------------------------------
       SPUR
    -------------------------------- */

    lane +=
        (targetLane - lane) *
        Math.min(
            1,
            dt * 13
        );


    /* --------------------------------
       SPRUNGPHYSIK
    -------------------------------- */

    if(!grounded){

        /*
            Geschwindigkeit nach unten
            reduzieren.

            Dadurch steigt der Spieler
            zuerst nach oben und fällt
            anschließend wieder herunter.
        */

        jumpVelocity -=
            1700 * dt;


        jumpHeight +=
            jumpVelocity * dt;


        /*
            Boden erreicht.
        */

        if(
            jumpHeight <= 0
        ){

            jumpHeight = 0;

            jumpVelocity = 0;

            grounded = true;


            if(trickActive){

                score +=
                    250 *
                    Math.max(
                        1,
                        Math.floor(combo)
                    );

                comboTimer = 3;


                showTrick(
                    "PERFECT LANDING!"
                );


                createParticles(
                    playerX(),
                    groundY(),
                    18,
                    "#fff16a"
                );
            }


            trickActive = false;
        }
    }


    /* --------------------------------
       ROTATION
    -------------------------------- */

    if(!grounded){

        playerRotation +=
            dt * 8;
    }


    /* --------------------------------
       SPEED
    -------------------------------- */

    speed +=
        dt * .10;

    distance +=
        speed *
        dt *
        .8;

    score +=
        speed *
        dt *
        .5;


    /* --------------------------------
       COMBO
    -------------------------------- */

    if(comboTimer > 0){

        comboTimer -= dt;

    }else{

        combo =
            Math.max(
                1,
                combo -
                dt * .15
            );
    }


    /* --------------------------------
       OBSTACLES
    -------------------------------- */

    obstacleTimer -= dt;

    if(
        obstacleTimer <= 0
    ){

        spawnObstacle();

        obstacleTimer =
            Math.max(
                .48,
                1.2 -
                speed * .035
            );
    }


    /* --------------------------------
       COINS
    -------------------------------- */

    coinTimer -= dt;

    if(
        coinTimer <= 0
    ){

        spawnCoins();

        coinTimer =
            2 +
            Math.random() *
            1.2;
    }


    /* --------------------------------
       MOVE OBSTACLES
    -------------------------------- */

    for(
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ){

        const o =
            obstacles[i];


        o.z -=
            speed *
            .00085 *
            dt *
            60;


        /*
            KOLLISIONSPUNKT
        */

        if(
            !o.passed &&
            o.z < .16
        ){

            o.passed = true;


            const sameLane =
                o.lane ===
                Math.round(lane);


            if(sameLane){

                /*
                    Rampen sind ungefährlich.
                */

                if(
                    o.type === "ramp"
                ){

                    score +=
                        100 * combo;

                    combo += .2;

                    showTrick(
                        "RAMP!"
                    );


                    if(grounded){

                        grounded = false;

                        jumpHeight = 1;

                        jumpVelocity = 900;
                    }

                }else{

                    /*
                        Hindernis nur
                        gefährlich, wenn
                        nicht hoch genug.
                    */

                    if(
                        jumpHeight < 55
                    ){

                        crash();

                        return;
                    }


                    score +=
                        100 * combo;

                    combo += .25;

                    showTrick(
                        "CLEAN!"
                    );
                }
            }
        }


        if(
            o.z < -.2
        ){

            obstacles.splice(
                i,
                1
            );
        }
    }


    /* --------------------------------
       COINS
    -------------------------------- */

    for(
        let i =
            coins.length - 1;

        i >= 0;

        i--
    ){

        const c =
            coins[i];


        c.z -=
            speed *
            .00085 *
            dt *
            60;


        if(
            !c.collected &&
            c.z < .18
        ){

            const sameLane =
                c.lane ===
                Math.round(lane);


            if(
                sameLane &&
                jumpHeight > 5
            ){

                c.collected = true;

                score +=
                    75 *
                    Math.max(
                        1,
                        Math.floor(combo)
                    );


                createParticles(
                    laneX(
                        c.lane,
                        c.z
                    ),
                    roadY(c.z) - 20,
                    8,
                    "#fff16a"
                );
            }
        }


        if(
            c.z < -.2 ||
            c.collected
        ){

            coins.splice(
                i,
                1
            );
        }
    }


    /* --------------------------------
       PARTICLES
    -------------------------------- */

    for(
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            .2;

        p.life -=
            dt * 1.8;


        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );
        }
    }


    updateHUD();
}


/* =========================================================
   CRASH
========================================================= */

function crash(){

    playing = false;

    gameOver = true;


    createParticles(
        playerX(),
        playerY(),
        60,
        "#ff3194"
    );


    createParticles(
        playerX(),
        playerY(),
        35,
        "#fff16a"
    );


    document
        .getElementById(
            "finalScore"
        )
        .textContent =
        Math.floor(score)
        .toLocaleString("de-DE");


    setTimeout(
        function(){

            document
                .getElementById(
                    "gameOver"
                )
                .style.display =
                "flex";

        },
        400
    );
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document
        .getElementById(
            "score"
        )
        .textContent =
        Math.floor(score)
        .toLocaleString("de-DE");


    document
        .getElementById(
            "comboNumber"
        )
        .textContent =
        "x" +
        Math.max(
            1,
            Math.floor(combo)
        );


    document
        .getElementById(
            "distance"
        )
        .textContent =
        Math.floor(distance) +
        "m";


    document
        .getElementById(
            "progressBar"
        )
        .style.width =
        (distance % 100) +
        "%";


    const comboEl =
        document.getElementById(
            "combo"
        );


    if(
        combo > 1.2
    ){

        comboEl.classList.add(
            "show"
        );

        document
            .getElementById(
                "comboPoints"
            )
            .textContent =
            "+" +
            Math.floor(
                combo * 100
            ) +
            " POINTS";

    }else{

        comboEl.classList.remove(
            "show"
        );
    }
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    /* SKY */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#ff4f9d"
    );

    gradient.addColorStop(
        .35,
        "#ff9971"
    );

    gradient.addColorStop(
        .55,
        "#ffd86b"
    );

    gradient.addColorStop(
        1,
        "#54d5bd"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SUN */

    ctx.save();

    ctx.shadowBlur = 60;

    ctx.shadowColor =
        "#fff0a0";

    ctx.fillStyle =
        "#fff2a4";

    ctx.beginPath();

    ctx.arc(
        W * .78,
        H * .25,
        Math.min(W,H) * .105,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();


    /* CITY */

    drawCity();


    /* PALMS */

    drawPalm(
        W * .09,
        H * .49,
        1
    );

    drawPalm(
        W * .9,
        H * .49,
        .8
    );
}


/* =========================================================
   CITY
========================================================= */

function drawCity(){

    const base =
        H * .53;


    for(
        let x = 0;
        x < W;
        x += 48
    ){

        const height =
            35 +
            Math.abs(
                Math.sin(
                    x * .08
                )
            ) *
            85;


        ctx.fillStyle =
            "#34205d";

        ctx.fillRect(
            x,
            base - height,
            38,
            height
        );


        ctx.fillStyle =
            "rgba(255,220,100,.6)";


        for(
            let y =
                base -
                height +
                13;

            y <
                base - 8;

            y += 17
        ){

            if(
                (x + y) % 3 < 1.5
            ){

                ctx.fillRect(
                    x + 9,
                    y,
                    5,
                    7
                );
            }
        }
    }
}


/* =========================================================
   PALM
========================================================= */

function drawPalm(
    x,
    y,
    scale
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );


    ctx.strokeStyle =
        "#2a1654";

    ctx.lineWidth = 9;

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.quadraticCurveTo(
        -10,
        -80,
        10,
        -145
    );

    ctx.stroke();


    ctx.fillStyle =
        "#2a1654";


    for(
        let i = 0;
        i < 7;
        i++
    ){

        ctx.save();

        ctx.rotate(
            -1.3 +
            i * .43
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            -145,
            10,
            55,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }


    ctx.restore();
}


/* =========================================================
   ROAD
========================================================= */

function drawRoad(){

    const horizon =
        H * .48;


    /* GRASS */

    ctx.fillStyle =
        "#42d1b7";

    ctx.fillRect(
        0,
        horizon,
        W,
        H - horizon
    );


    /* ROAD */

    ctx.fillStyle =
        "#27214b";

    ctx.beginPath();

    ctx.moveTo(
        W/2 - 35,
        horizon
    );

    ctx.lineTo(
        W/2 + 35,
        horizon
    );

    ctx.lineTo(
        W * .98,
        H
    );

    ctx.lineTo(
        W * .02,
        H
    );

    ctx.closePath();

    ctx.fill();


    /* LEFT EDGE */

    ctx.strokeStyle =
        "#ff3d9c";

    ctx.lineWidth = 11;

    ctx.beginPath();

    ctx.moveTo(
        W/2 - 35,
        horizon
    );

    ctx.lineTo(
        W * .02,
        H
    );

    ctx.stroke();


    /* RIGHT EDGE */

    ctx.strokeStyle =
        "#6d5cff";

    ctx.beginPath();

    ctx.moveTo(
        W/2 + 35,
        horizon
    );

    ctx.lineTo(
        W * .98,
        H
    );

    ctx.stroke();


    /* LANES */

    ctx.strokeStyle =
        "rgba(255,255,255,.18)";

    ctx.lineWidth = 4;

    ctx.setLineDash([
        22,
        30
    ]);


    for(
        let l = 1;
        l < 3;
        l++
    ){

        ctx.beginPath();

        ctx.moveTo(
            W/2 +
            (l - 1.5) *
            25,
            horizon
        );

        ctx.lineTo(
            W/2 +
            (l - 1.5) *
            W *
            .63,
            H
        );

        ctx.stroke();
    }


    ctx.setLineDash([]);
}


/* =========================================================
   COINS DRAW
========================================================= */

function drawCoins(){

    const time =
        performance.now() *
        .006;


    for(
        const c of coins
    ){

        if(c.collected)
            continue;


        const x =
            laneX(
                c.lane,
                c.z
            );


        const y =
            roadY(c.z) -
            35 +
            Math.sin(time) *
            5;


        const scale =
            .25 +
            (1 - c.z) *
            1.5;


        ctx.save();

        ctx.translate(
            x,
            y
        );

        ctx.scale(
            scale,
            scale
        );


        ctx.shadowBlur =
            20;

        ctx.shadowColor =
            "#fff16a";


        ctx.fillStyle =
            "#fff16a";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            13,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.shadowBlur = 0;


        ctx.fillStyle =
            "#ffb72f";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            7,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.restore();
    }
}


/* =========================================================
   OBJECT DRAW
========================================================= */

function drawObstacle(o){

    const z =
        Math.max(
            0,
            o.z
        );


    const x =
        laneX(
            o.lane,
            z
        );


    const y =
        roadY(z);


    const scale =
        .25 +
        (1 - z) *
        1.5;


    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );


    /* SHADOW */

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        10,
        50,
        12,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* BARRIER */

    if(
        o.type ===
        "barrier"
    ){

        ctx.fillStyle =
            o.color;

        ctx.fillRect(
            -45,
            -55,
            90,
            55
        );


        ctx.fillStyle =
            "white";

        ctx.fillRect(
            -36,
            -42,
            72,
            9
        );

        ctx.fillRect(
            -36,
            -20,
            72,
            9
        );
    }


    /* RAIL */

    else if(
        o.type ===
        "rail"
    ){

        ctx.strokeStyle =
            o.color;

        ctx.lineWidth = 8;

        ctx.beginPath();

        ctx.moveTo(
            -58,
            0
        );

        ctx.lineTo(
            58,
            0
        );

        ctx.stroke();


        ctx.lineWidth = 6;

        ctx.beginPath();

        ctx.moveTo(
            -40,
            0
        );

        ctx.lineTo(
            -40,
            30
        );

        ctx.moveTo(
            40,
            0
        );

        ctx.lineTo(
            40,
            30
        );

        ctx.stroke();
    }


    /* CONE */

    else if(
        o.type ===
        "cone"
    ){

        ctx.fillStyle =
            "#ff7045";

        ctx.beginPath();

        ctx.moveTo(
            0,
            -55
        );

        ctx.lineTo(
            -28,
            10
        );

        ctx.lineTo(
            28,
            10
        );

        ctx.closePath();

        ctx.fill();


        ctx.fillStyle =
            "white";

        ctx.fillRect(
            -22,
            -10,
            44,
            8
        );
    }


    /* RAMP */

    else if(
        o.type ===
        "ramp"
    ){

        ctx.fillStyle =
            o.color;

        ctx.beginPath();

        ctx.moveTo(
            -55,
            15
        );

        ctx.lineTo(
            55,
            15
        );

        ctx.lineTo(
            55,
            -50
        );

        ctx.quadraticCurveTo(
            10,
            -72,
            -55,
            15
        );

        ctx.closePath();

        ctx.fill();
    }


    /* STAIRS */

    else if(
        o.type ===
        "stairs"
    ){

        ctx.fillStyle =
            "#ffda55";


        for(
            let i = 0;
            i < 5;
            i++
        ){

            ctx.fillRect(
                -55 +
                i * 22,

                -i * 13,

                22,

                i * 13 +
                15
            );
        }
    }


    /* BOX */

    else {

        ctx.fillStyle =
            "#7046df";

        ctx.fillRect(
            -50,
            -35,
            100,
            35
        );

        ctx.fillStyle =
            "#ff4ca3";

        ctx.fillRect(
            -40,
            -25,
            80,
            8
        );
    }


    ctx.restore();
}


/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(){

    const x =
        playerX();

    const y =
        playerY();


    ctx.save();

    ctx.translate(
        x,
        y
    );


    /*
        Schatten wird separat auf
        dem Boden gezeichnet.
    */

    ctx.save();

    ctx.translate(
        0,
        jumpHeight
    );

    ctx.scale(
        1,
        .25
    );

    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        37,
        50,
        12,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();


    /*
        Nur der Spieler dreht sich.
    */

    if(!grounded){

        ctx.rotate(
            playerRotation
        );
    }


    /* BOARD */

    ctx.strokeStyle =
        "#ff4da4";

    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(
        -43,
        25
    );

    ctx.lineTo(
        43,
        25
    );

    ctx.stroke();


    /* WHEELS */

    ctx.fillStyle =
        "#fff16a";

    ctx.beginPath();

    ctx.arc(
        -28,
        34,
        7,
        0,
        Math.PI * 2
    );

    ctx.arc(
        28,
        34,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* LEGS */

    ctx.strokeStyle =
        "#24113f";

    ctx.lineWidth = 10;

    ctx.beginPath();

    ctx.moveTo(
        -10,
        5
    );

    ctx.lineTo(
        -20,
        25
    );

    ctx.moveTo(
        10,
        5
    );

    ctx.lineTo(
        22,
        25
    );

    ctx.stroke();


    /* BODY */

    ctx.fillStyle =
        "#6d42e8";

    ctx.beginPath();

    ctx.roundRect(
        -20,
        -65,
        40,
        70,
        12
    );

    ctx.fill();


    /* SHIRT */

    ctx.fillStyle =
        "#ff4ca3";

    ctx.fillRect(
        -20,
        -35,
        40,
        10
    );


    /* ARMS */

    ctx.strokeStyle =
        "#f3a07c";

    ctx.lineWidth = 9;

    ctx.beginPath();

    ctx.moveTo(
        -17,
        -52
    );

    ctx.lineTo(
        -38,
        -30
    );

    ctx.moveTo(
        17,
        -52
    );

    ctx.lineTo(
        38,
        -30
    );

    ctx.stroke();


    /* HEAD */

    ctx.fillStyle =
        "#f3a07c";

    ctx.beginPath();

    ctx.arc(
        0,
        -82,
        23,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* CAP */

    ctx.fillStyle =
        "#ffdb4d";

    ctx.beginPath();

    ctx.arc(
        0,
        -90,
        25,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillRect(
        0,
        -91,
        30,
        7
    );


    ctx.restore();
}


/* =========================================================
   PARTICLES DRAW
========================================================= */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();

    drawRoad();


    /*
        Objekte weit hinten zuerst.
    */

    obstacles
        .slice()
        .sort(
            (a,b) =>
                b.z - a.z
        )
        .forEach(
            drawObstacle
        );


    drawCoins();

    drawPlayer();

    drawParticles();


    requestAnimationFrame(
        render
    );
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function loop(time){

    const dt =
        Math.min(
            .035,
            (time -
                lastTime) /
            1000
        );


    lastTime =
        time;


    update(dt);


    requestAnimationFrame(
        loop
    );
}


/* =========================================================
   MOBILE BUTTONS
========================================================= */

document
    .getElementById("left")
    .addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            moveLeft();
        }
    );


document
    .getElementById("right")
    .addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            moveRight();
        }
    );


document
    .getElementById("jump")
    .addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            jump();
        }
    );


document
    .getElementById("trickBtn")
    .addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            trick();
        }
    );


/* =========================================================
   START
========================================================= */

render();

loop(lastTime);

</script>
