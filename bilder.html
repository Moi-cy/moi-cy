<!DOCTYPE html>
<html lang="de">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title data-i18n-title>
    Bilder – Moi-cy
  </title>

  <meta
    name="description"
    data-i18n-description
    content="Bilder von Moi-cy – Skateboarding, Sessions und Skateparks."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Permanent+Marker&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css?v=bilder2"
  >


  <style>

    /* =========================================
       MOI-CY BILDER
       SCHLICHT × DARK STREET
    ========================================= */

    .bilder-page {
      min-height: 100vh;

      padding:
        150px
        7vw
        110px;

      background: #050505;
    }


    /* =========================================
       ÜBERSCHRIFT
    ========================================= */

    .bilder-header {
      max-width: 1200px;

      margin:
        0
        auto
        70px;
    }


    .bilder-label {
      display: block;

      margin-bottom: 18px;

      color: #00a8ff;

      font-size: 0.65rem;
      font-weight: 800;

      letter-spacing: 0.18em;
    }


    .bilder-title {
      margin: 0;

      color: #f2f2f2;

      font-size:
        clamp(3.5rem, 8vw, 7rem);

      line-height: 0.9;

      letter-spacing: -0.07em;

      font-weight: 900;
    }


    /* =========================================
       SPRACHUMSCHALTER
    ========================================= */

    .language-switcher {
      display: flex;

      align-items: center;

      gap: 5px;

      margin-left: 20px;
    }


    .language-switcher button {
      padding:
        7px
        8px;

      border:
        1px solid
        rgba(255, 255, 255, 0.14);

      background:
        transparent;

      color:
        rgba(255, 255, 255, 0.5);

      font-family:
        Inter,
        sans-serif;

      font-size:
        0.62rem;

      font-weight:
        800;

      letter-spacing:
        0.08em;

      cursor:
        pointer;

      transition:
        0.25s ease;
    }


    .language-switcher button:hover,
    .language-switcher button.active {
      color:
        #050505;

      background:
        #00a8ff;

      border-color:
        #00a8ff;
    }


    /* =========================================
       BILDER GRID
    ========================================= */

    .bilder-grid {
      max-width: 1200px;

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 20px;
    }


    /* =========================================
       BILD
    ========================================= */

    .bild {
      position: relative;

      width: 100%;

      aspect-ratio: 4 / 3;

      overflow: hidden;

      background: #0d0d0d;

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      cursor: pointer;

      transition:
        border-color 0.3s ease,
        transform 0.3s ease;
    }


    .bild img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      filter:
        grayscale(35%)
        brightness(0.75)
        contrast(1.05);

      transition:
        transform 0.6s ease,
        filter 0.6s ease;
    }


    .bild:hover {
      border-color: #00a8ff;

      transform:
        translateY(-3px);
    }


    .bild:hover img {
      transform:
        scale(1.06);

      filter:
        grayscale(0%)
        brightness(0.9)
        contrast(1.08);
    }


    /* =========================================
       BILD NUMMER
    ========================================= */

    .bild-number {
      position: absolute;

      left: 16px;
      bottom: 14px;

      z-index: 2;

      color:
        rgba(255, 255, 255, 0.55);

      font-size:
        0.55rem;

      font-weight:
        700;

      letter-spacing:
        0.15em;

      pointer-events:
        none;
    }


    /* =========================================
       WENN KEINE BILDER VORHANDEN SIND
    ========================================= */

    .bilder-loading {
      max-width: 1200px;

      margin: 0 auto;

      color:
        rgba(255, 255, 255, 0.45);

      font-size:
        0.75rem;

      letter-spacing:
        0.12em;
    }


    /* =========================================
       LIGHTBOX
    ========================================= */

    .lightbox {
      position: fixed;

      inset: 0;

      z-index: 2000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 40px;

      background:
        rgba(0, 0, 0, 0.94);

      backdrop-filter:
        blur(10px);
    }


    .lightbox.active {
      display: flex;
    }


    .lightbox-image {
      max-width: 88vw;
      max-height: 84vh;

      object-fit: contain;

      border:
        1px solid
        rgba(255, 255, 255, 0.12);

      box-shadow:
        0 0 60px
        rgba(0, 0, 0, 0.8);

      user-select:
        none;
    }


    /* =========================================
       LIGHTBOX SCHLIESSEN
    ========================================= */

    .lightbox-close {
      position: absolute;

      top: 25px;
      right: 30px;

      width: 48px;
      height: 48px;

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(255, 255, 255, 0.18);

      background:
        rgba(5, 5, 5, 0.7);

      color:
        #f2f2f2;

      font-size:
        1.6rem;

      font-weight:
        300;

      cursor:
        pointer;

      transition:
        color 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
    }


    .lightbox-close:hover {
      color:
        #050505;

      border-color:
        #00a8ff;

      background:
        #00a8ff;
    }


    /* =========================================
       LIGHTBOX PFEILE
    ========================================= */

    .lightbox-arrow {
      position: absolute;

      top: 50%;

      transform:
        translateY(-50%);

      width: 52px;
      height: 52px;

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(255, 255, 255, 0.18);

      background:
        rgba(5, 5, 5, 0.7);

      color:
        #f2f2f2;

      font-size:
        1.4rem;

      cursor:
        pointer;

      transition:
        color 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease,
        transform 0.25s ease;
    }


    .lightbox-arrow:hover {
      color:
        #050505;

      border-color:
        #00a8ff;

      background:
        #00a8ff;
    }


    .lightbox-prev {
      left: 25px;
    }


    .lightbox-next {
      right: 25px;
    }


    /* =========================================
       LIGHTBOX INFO
    ========================================= */

    .lightbox-counter {
      position: absolute;

      left: 50%;
      bottom: 25px;

      transform:
        translateX(-50%);

      color:
        #666;

      font-size:
        0.6rem;

      font-weight:
        700;

      letter-spacing:
        0.16em;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 900px) {

      .bilder-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 700px) {

      .bilder-page {
        padding:
          120px
          6vw
          80px;
      }


      .bilder-header {
        margin-bottom:
          45px;
      }


      .bilder-title {
        font-size:
          clamp(3.5rem, 17vw, 6rem);
      }


      .bilder-grid {
        grid-template-columns:
          1fr;

        gap:
          18px;
      }


      .bild:hover {
        transform:
          none;
      }


      .bild:hover img {
        transform:
          none;
      }


      .lightbox {
        padding:
          20px;
      }


      .lightbox-image {
        max-width:
          94vw;

        max-height:
          78vh;
      }


      .lightbox-close {
        top:
          15px;

        right:
          15px;

        width:
          42px;

        height:
          42px;
      }


      .lightbox-arrow {
        width:
          44px;

        height:
          44px;
      }


      .lightbox-prev {
        left:
          12px;
      }


      .lightbox-next {
        right:
          12px;
      }


      .lightbox-counter {
        bottom:
          18px;
      }


      .language-switcher {
        margin-left:
          10px;
      }

    }

  </style>

</head>


<body>


<!-- =========================================
     GEMEINSAMER HEADER
========================================= -->

<div id="site-header"></div>



<!-- =========================================
     BILDER
========================================= -->

<main>

  <section class="bilder-page">


    <div class="bilder-header">

      <span
        class="bilder-label"
        data-i18n="images_label"
      >
        MOI-CY / BILDER
      </span>


      <h1
        class="bilder-title"
        data-i18n="images_title"
      >
        Bilder
      </h1>

    </div>


    <!-- =====================================
         BILDER GRID
         WIRD AUTOMATISCH GEFÜLLT
    ====================================== -->

    <section
      class="bilder-grid"
      id="bilderGrid"
    >
    </section>


    <div
      class="bilder-loading"
      id="bilderLoading"
    >
      BILDER WERDEN GELADEN...
    </div>


  </section>

</main>



<!-- =========================================
     LIGHTBOX
========================================= -->

<div
  class="lightbox"
  id="lightbox"
  aria-hidden="true"
>


  <button
    class="lightbox-close"
    id="lightboxClose"
    type="button"
    aria-label="Bild schließen"
    data-i18n-aria="lightbox_close"
  >
    ×
  </button>


  <button
    class="lightbox-arrow lightbox-prev"
    id="lightboxPrev"
    type="button"
    aria-label="Vorheriges Bild"
    data-i18n-aria="lightbox_previous"
  >
    ←
  </button>


  <img
    class="lightbox-image"
    id="lightboxImage"
    src=""
    alt=""
  >


  <button
    class="lightbox-arrow lightbox-next"
    id="lightboxNext"
    type="button"
    aria-label="Nächstes Bild"
    data-i18n-aria="lightbox_next"
  >
    →
  </button>


  <div
    class="lightbox-counter"
    id="lightboxCounter"
  >
    00 / 00
  </div>


</div>



<!-- =========================================
     GEMEINSAMER FOOTER
========================================= -->

<div id="site-footer"></div>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="script.js"></script>

<script src="components.js"></script>


<script>

  /* =========================================
     AUTOMATISCHE BILDERERKENNUNG
     
     Die Seite sucht automatisch nach:
     
     bilder/bild-1.jpg
     bilder/bild-2.jpg
     bilder/bild-3.jpg
     ...
     
     Du musst bilder.html danach nicht
     mehr ändern.
  ========================================= */


  const bilderGrid =
    document.getElementById("bilderGrid");


  const bilderLoading =
    document.getElementById("bilderLoading");


  const lightbox =
    document.getElementById("lightbox");


  const lightboxImage =
    document.getElementById("lightboxImage");


  const lightboxClose =
    document.getElementById("lightboxClose");


  const lightboxPrev =
    document.getElementById("lightboxPrev");


  const lightboxNext =
    document.getElementById("lightboxNext");


  const lightboxCounter =
    document.getElementById("lightboxCounter");


  let bildElements = [];


  let currentImage = 0;


  /* =========================================
     PRÜFEN, OB EIN BILD EXISTIERT
  ========================================= */

  function imageExists(src) {

    return new Promise((resolve) => {

      const image =
        new Image();


      image.onload = () => {

        resolve(true);

      };


      image.onerror = () => {

        resolve(false);

      };


      image.src =
        src + "?check=" + Date.now();

    });

  }


  /* =========================================
     ALLE BILDER SUCHEN
     
     Wir prüfen automatisch bild-1.jpg
     bis bild-100.jpg.
     
     Dadurch kannst du später einfach
     weitere Bilder hinzufügen.
  ========================================= */

  async function loadImages() {

    const foundImages = [];


    for (
      let number = 1;
      number <= 100;
      number++
    ) {

      const filename =
        `bilder/bild-${number}.jpg`;


      const exists =
        await imageExists(filename);


      if (exists) {

        foundImages.push({
          number: number,
          src: filename
        });

      }

    }


    /* =====================================
       GRID AUFBAUEN
    ====================================== */

    foundImages.forEach(
      (imageData, index) => {

        const card =
          document.createElement("div");


        card.className =
          "bild";


        card.dataset.index =
          index;


        const image =
          document.createElement("img");


        image.src =
          imageData.src;


        image.alt =
          `Moi-cy Bild ${String(imageData.number).padStart(2, "0")}`;


        const number =
          document.createElement("span");


        number.className =
          "bild-number";


        number.textContent =
          String(
            imageData.number
          ).padStart(2, "0");


        card.appendChild(image);

        card.appendChild(number);


        bilderGrid.appendChild(card);

      }
    );


    /* =====================================
       BILDER ELEMENTE AKTUALISIEREN
    ====================================== */

    bildElements =
      document.querySelectorAll(".bild");


    /* =====================================
       LADEN-TEXT VERSTECKEN
    ====================================== */

    bilderLoading.style.display =
      "none";


    /* =====================================
       KLICKS AUF BILDER
    ====================================== */

    bildElements.forEach(
      (bild, index) => {

        bild.addEventListener(
          "click",
          () => {

            openLightbox(index);

          }
        );

      }
    );


    /* =====================================
       FALLS KEINE BILDER GEFUNDEN WURDEN
    ====================================== */

    if (
      foundImages.length === 0
    ) {

      bilderLoading.textContent =
        "KEINE BILDER GEFUNDEN.";

      bilderLoading.style.display =
        "block";

    }

  }


  /* =========================================
     LIGHTBOX ÖFFNEN
  ========================================= */

  function openLightbox(index) {

    if (
      bildElements.length === 0
    ) {

      return;

    }


    currentImage =
      index;


    updateLightbox();


    lightbox.classList.add(
      "active"
    );


    lightbox.setAttribute(
      "aria-hidden",
      "false"
    );


    document.body.style.overflow =
      "hidden";

  }


  /* =========================================
     LIGHTBOX AKTUALISIEREN
  ========================================= */

  function updateLightbox() {

    const image =
      bildElements[currentImage]
        .querySelector("img");


    lightboxImage.src =
      image.src;


    lightboxImage.alt =
      image.alt;


    lightboxCounter.textContent =
      String(
        currentImage + 1
      ).padStart(2, "0")
      +
      " / "
      +
      String(
        bildElements.length
      ).padStart(2, "0");

  }


  /* =========================================
     LIGHTBOX SCHLIESSEN
  ========================================= */

  function closeLightbox() {

    lightbox.classList.remove(
      "active"
    );


    lightbox.setAttribute(
      "aria-hidden",
      "true"
    );


    document.body.style.overflow =
      "";

  }


  /* =========================================
     VORHERIGES BILD
  ========================================= */

  function previousImage() {

    if (
      bildElements.length === 0
    ) {

      return;

    }


    currentImage--;


    if (
      currentImage < 0
    ) {

      currentImage =
        bildElements.length - 1;

    }


    updateLightbox();

  }


  /* =========================================
     NÄCHSTES BILD
  ========================================= */

  function nextImage() {

    if (
      bildElements.length === 0
    ) {

      return;

    }


    currentImage++;


    if (
      currentImage >=
      bildElements.length
    ) {

      currentImage = 0;

    }


    updateLightbox();

  }


  /* =========================================
     BUTTONS
  ========================================= */

  lightboxClose.addEventListener(
    "click",
    closeLightbox
  );


  lightboxPrev.addEventListener(
    "click",
    previousImage
  );


  lightboxNext.addEventListener(
    "click",
    nextImage
  );


  /* =========================================
     HINTERGRUND KLICKEN
  ========================================= */

  lightbox.addEventListener(
    "click",
    (event) => {

      if (
        event.target === lightbox
      ) {

        closeLightbox();

      }

    }
  );


  /* =========================================
     TASTATUR
  ========================================= */

  document.addEventListener(
    "keydown",
    (event) => {

      if (
        !lightbox.classList.contains(
          "active"
        )
      ) {

        return;

      }


      if (
        event.key === "Escape"
      ) {

        closeLightbox();

      }


      if (
        event.key === "ArrowLeft"
      ) {

        previousImage();

      }


      if (
        event.key === "ArrowRight"
      ) {

        nextImage();

      }

    }
  );


  /* =========================================
     BILDER LADEN
  ========================================= */

  loadImages();

</script>

</body>
</html>
