<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MOI-CY – Karte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ==============================
       PANEL
    ============================== */

    #panel {
      position: fixed;
      z-index: 1000;

      top: 16px;
      left: 16px;

      width: min(430px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);

      color: white;
      background: rgba(15, 15, 15, 0.96);

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(0,0,0,.45);

      overflow: hidden;

      transition:
        transform .25s ease,
        opacity .25s ease;
    }

    #panel.collapsed {
      transform: translateX(calc(-100% - 25px));
      opacity: 0;
      pointer-events: none;
    }

    .panel-inner {
      padding: 18px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }

    /* ==============================
       TITEL
    ============================== */

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 16px;
    }

    .panel-title h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 1px;
    }

    #closePanelButton,
    #openPanelButton {
      border: 0;
      cursor: pointer;
    }

    #closePanelButton {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      background: #292929;
      color: white;

      font-size: 20px;
    }

    #closePanelButton:hover {
      background: #3b3b3b;
    }

    #openPanelButton {
      position: fixed;
      z-index: 1100;

      left: 16px;
      top: 16px;

      width: 46px;
      height: 46px;

      display: none;

      border-radius: 50%;

      background: rgba(15,15,15,.96);
      color: white;

      box-shadow:
        0 8px 25px rgba(0,0,0,.4);

      font-size: 20px;
    }

    #openPanelButton.visible {
      display: block;
    }

    /* ==============================
       SUCHE
    ============================== */

    .search-box {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;

      height: 48px;
      padding: 0 14px;

      border-radius: 12px;
      border: 1px solid #444;

      background: #202020;
      color: white;

      outline: none;
      font-size: 15px;
    }

    #searchInput:focus {
      border-color: #777;
    }

    #searchButton {
      width: 52px;
      height: 48px;

      border: 0;
      border-radius: 12px;

      background: white;
      color: #111;

      cursor: pointer;

      font-size: 21px;
      font-weight: bold;
    }

    #searchButton:hover {
      background: #ddd;
    }

    .hint {
      margin: 8px 2px 15px;

      color: #999;

      font-size: 12px;
      line-height: 1.45;
    }

    /* ==============================
       SEKTIONEN
    ============================== */

    .section {
      margin-top: 15px;
      padding-top: 15px;

      border-top:
        1px solid rgba(255,255,255,.1);
    }

    .section-title {
      margin-bottom: 10px;

      color: #ddd;

      font-size: 13px;
      font-weight: bold;
      letter-spacing: .8px;
    }

    /* ==============================
       ROUTE
    ============================== */

    .route-row {
      display: flex;
      gap: 7px;

      margin-bottom: 7px;
    }

    .route-row input {
      flex: 1;
      min-width: 0;

      height: 40px;
      padding: 0 11px;

      border: 1px solid #444;
      border-radius: 9px;

      background: #202020;
      color: white;

      outline: none;
    }

    .remove-stop {
      width: 40px;
      height: 40px;

      border: 0;
      border-radius: 9px;

      background: #292929;
      color: #aaa;

      cursor: pointer;
      font-size: 18px;
    }

    .remove-stop:hover {
      background: #3a3a3a;
      color: white;
    }

    .route-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      margin-top: 9px;
    }

    .action {
      min-height: 40px;
      padding: 0 13px;

      border: 0;
      border-radius: 9px;

      background: #292929;
      color: white;

      cursor: pointer;

      font-size: 12px;
      font-weight: 600;
    }

    .action:hover {
      background: #3a3a3a;
    }

    .action.primary {
      background: white;
      color: #111;
    }

    .action.primary:hover {
      background: #ddd;
    }

    /* ==============================
       SKATEPARK
    ============================== */

    .radius-buttons {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 6px;

      margin-bottom: 9px;
    }

    .radius-button {
      height: 38px;

      border: 1px solid #444;
      border-radius: 8px;

      background: #202020;
      color: #aaa;

      cursor: pointer;

      font-size: 12px;
      font-weight: bold;
    }

    .radius-button:hover {
      border-color: #777;
    }

    .radius-button.active {
      background: white;
      color: #111;
      border-color: white;
    }

    #searchParksButton {
      width: 100%;
      min-height: 44px;

      border: 0;
      border-radius: 10px;

      background: #e53935;
      color: white;

      cursor: pointer;

      font-size: 12px;
      font-weight: bold;
      letter-spacing: .4px;
    }

    #searchParksButton:hover {
      background: #c62828;
    }

    #searchRouteParksButton {
      width: 100%;
      min-height: 44px;

      margin-top: 7px;

      border: 1px solid #e53935;
      border-radius: 10px;

      background: transparent;
      color: #ff6b67;

      cursor: pointer;

      font-size: 12px;
      font-weight: bold;
    }

    #searchRouteParksButton:hover {
      background: rgba(229,57,53,.1);
    }

    /* ==============================
       KARTENTYP
    ============================== */

    .map-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .map-switch button {
      height: 40px;

      border: 1px solid #444;
      border-radius: 8px;

      background: #202020;
      color: #aaa;

      cursor: pointer;

      font-size: 11px;
      font-weight: bold;
    }

    .map-switch button.active {
      background: white;
      color: #111;
      border-color: white;
    }

    /* ==============================
       STATUS
    ============================== */

    #status {
      min-height: 20px;

      margin-top: 12px;

      color: #aaa;

      font-size: 12px;
      line-height: 1.45;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .spinner {
      width: 12px;
      height: 12px;

      border: 2px solid #555;
      border-top-color: white;

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ==============================
       ERGEBNISSE
    ============================== */

    #results {
      margin-top: 10px;
    }

    .result-summary {
      margin-bottom: 8px;

      color: #999;

      font-size: 12px;
    }

    .park-result {
      margin-bottom: 7px;
      padding: 10px;

      border: 1px solid transparent;
      border-radius: 10px;

      background: #1d1d1d;

      cursor: pointer;
    }

    .park-result:hover {
      border-color: #555;
    }

    .park-name {
      margin-bottom: 5px;

      color: white;

      font-size: 13px;
      font-weight: bold;
    }

    .park-meta {
      color: #999;

      font-size: 11px;
      line-height: 1.5;
    }

    /* ==============================
       ROTE MARKER
    ============================== */

    .skate-marker {
      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #e53935;

      border: 3px solid white;

      box-shadow:
        0 0 0 2px rgba(229,57,53,.35),

    /* ==============================
       POPUP
    ============================== */

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
    }

    .leaflet-popup-content {
      margin: 12px 14px;

      font-size: 13px;
      line-height: 1.5;
    }

    .popup-title {
      margin-bottom: 5px;

      font-size: 15px;
      font-weight: bold;
    }

    .popup-line {
      color: #555;
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 600px) {
      #panel {
        top: 8px;
        left: 8px;

        width: calc(100vw - 16px);
        max-height: calc(100vh - 16px);
      }

      .panel-inner {
        padding: 14px;
        max-height: calc(100vh - 16px);
      }

      #openPanelButton {
        top: 8px;
        left: 8px;
      }
    }
  </style>
</head>

<div id="map"></div>

<button

      <button

    <!-- =========================================

    ========================================== -->

    </div>

    <div id="results"></div>

  </div>

</aside>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin=""
></script>


<script>
"use strict";

/* ============================================================
   MOI-CY – KARTEN.JS
   ============================================================ */


/* ============================================================
   KONFIGURATION
   ============================================================ */

const DEFAULT_CENTER = [49.1, 8.4];
const DEFAULT_ZOOM = 6;

const MAP_BOUNDS = L.latLngBounds(
  [-85.05112878, -180],
  [85.05112878, 180]
);

const NOMINATIM_URL =
  "https://nominatim.openstreetmap.org/search";

const PHOTON_URL =
  "https://photon.komoot.io/api/";

const OSRM_URL =
  "https://router.project-osrm.org/route/v1/driving/";

const OVERPASS_SERVERS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
];

const OSM_TILES =
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";

const SATELLITE_TILES =
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";

const MAX_PARKS = 15;


/* ============================================================
   DOM
   ============================================================ */

const panel =
  document.getElementById("panel");

const closePanelButton =
  document.getElementById(
    "closePanelButton"
  );

const openPanelButton =
  document.getElementById(
    "openPanelButton"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const searchButton =
  document.getElementById(
    "searchButton"
  );

const routeFields =
  document.getElementById(
    "routeFields"
  );

const addStopButton =
  document.getElementById(
    "addStopButton"
  );

const routeButton =
  document.getElementById(
    "routeButton"
  );

const searchParksButton =
  document.getElementById(
    "searchParksButton"
  );

const searchRouteParksButton =
  document.getElementById(
    "searchRouteParksButton"
  );

const statusElement =
  document.getElementById("status");

const resultsElement =
  document.getElementById("results");

const mapModeButton =
  document.getElementById(
    "mapModeButton"
  );

const satelliteModeButton =
  document.getElementById(
    "satelliteModeButton"
  );


/* ============================================================
   KARTE
   ============================================================ */

const map = L.map("map", {

  center:
    DEFAULT_CENTER,

  zoom:
    DEFAULT_ZOOM,

  minZoom:
    2,

  maxZoom:
    18,

  maxBounds:
    MAP_BOUNDS,

  maxBoundsViscosity:
    1,

  worldCopyJump:
    false,

  zoomControl:
    false,

  preferCanvas:
    true

});


/* Zoom unten rechts */
L.control.zoom({
  position: "bottomright"
}).addTo(map);


/* ============================================================
   KARTENLAYER
   ============================================================ */

const osmLayer =
  L.tileLayer(
    OSM_TILES,
    {
      maxZoom: 19,

      attribution:
        "&copy; OpenStreetMap contributors"
    }
  );

const satelliteLayer =
  L.tileLayer(
    SATELLITE_TILES,
    {
      maxZoom: 19,

      attribution:
        "Tiles &copy; Esri"
    }
  );

osmLayer.addTo(map);


/* ============================================================
   LAYER
   ============================================================ */

const routeLayer =
  L.layerGroup().addTo(map);

const parkLayer =
  L.layerGroup().addTo(map);


/* ============================================================
   STATE
   ============================================================ */

let selectedRadius = 5;

let currentRoute = null;

let currentRouteStops = [];

let lastParkResults = [];

let geocodeCache =
  new Map();

let parkCache =
  new Map();

let currentMapMode =
  "map";


/* ============================================================
   HILFSFUNKTIONEN
   ============================================================ */

function normalizeText(value) {

  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /ß/g,
      "ss"
    )
    .trim();

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371;

  const p1 =
    lat1 *
    Math.PI /
    180;

  const p2 =
    lat2 *
    Math.PI /
    180;

  const dp =
    (lat2 - lat1) *
    Math.PI /
    180;

  const dl =
    (lon2 - lon1) *
    Math.PI /
    180;

  const a =
    Math.sin(dp / 2) ** 2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl / 2) ** 2;

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );

}


function formatDistance(km) {

  if (km < 1) {
    return (
      Math.round(km * 1000) +
      " m"
    );
  }

  return (
    km.toFixed(1) +
    " km"
  );

}


function formatArea(area) {

  if (
    !Number.isFinite(area) ||
    area <= 0
  ) {
    return "unbekannt";
  }

  if (area < 1000) {
    return (
      Math.round(area) +
      " m²"
    );
  }

  return (
    (area / 1000).toFixed(1) +
    " Tsd. m²"
  );

}


function setStatus(
  message,
  loading = false
) {

  if (loading) {

    statusElement.innerHTML =
      `<span class="loading">
        <span class="spinner"></span>
        ${escapeHtml(message)}
      </span>`;

  } else {

    statusElement.textContent =
      message;

  }

}


function clearResults() {
  resultsElement.innerHTML = "";
}


/* ============================================================
   TIMEOUT
   ============================================================ */

async function fetchWithTimeout(
  url,
  options = {},
  timeout = 8000
) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try {

    return await fetch(
      url,
      {
        ...options,
        signal:
          controller.signal
      }
    );

  } finally {

    clearTimeout(timer);

  }

}


/* ============================================================
   GEOCODING
   ============================================================ */

function searchVariants(query) {

  const original =
    String(query || "")
      .trim();

  const variants = [];

  if (!original) {
    return variants;
  }

  variants.push(original);

  const transliterated =
    original
      .replace(/ä/gi, "ae")
      .replace(/ö/gi, "oe")
      .replace(/ü/gi, "ue")
      .replace(/ß/gi, "ss");

  if (
    normalizeText(
      transliterated
    ) !==
    normalizeText(
      original
    )
  ) {
    variants.push(
      transliterated
    );
  }

  return variants;
}


async function geocodeNominatim(
  query,
  signal
) {

  const url =
    NOMINATIM_URL +
    "?format=jsonv2" +
    "&addressdetails=1" +
    "&limit=5" +
    "&dedupe=1" +
    "&accept-language=de" +
    "&q=" +
    encodeURIComponent(query);

  const response =
    await fetchWithTimeout(
      url,
      {
        headers: {
          Accept:
            "application/json"
        }
      },
      7500
    );

  if (!response.ok) {
    throw new Error(
      "Nominatim Fehler"
    );
  }

  return response.json();
}


async function geocodePhoton(
  query
) {

  const url =
    PHOTON_URL +
    "?q=" +
    encodeURIComponent(query) +
    "&limit=5&lang=de";

  const response =
    await fetchWithTimeout(
      url,
      {
        headers: {
          Accept:
            "application/json"
        }
      },
      7500
    );

  if (!response.ok) {
    throw new Error(
      "Photon Fehler"
    );
  }

  const data =
    await response.json();

  return (
    data.features || []
  ).map(feature => {

    const coordinates =
      feature.geometry
        ?.coordinates || [];

    const props =
      feature.properties || {};

    return {
      lat:
        Number(
          coordinates[1]
        ),

      lon:
        Number(
          coordinates[0]
        ),

      display_name:
        [
          props.name,
          props.city,
          props.state,
          props.country
        ]
          .filter(Boolean)
          .join(", ")
    };

  });
}


async function geocode(
  query,
  signal
) {

  const clean =
    String(query || "")
      .trim();

  if (!clean) {
    throw new Error(
      "Leerer Suchbegriff."
    );
  }

  const key =
    normalizeText(clean);

  if (
    geocodeCache.has(key)
  ) {
    return geocodeCache.get(key);
  }

  const variants =
    searchVariants(clean);

  let candidates = [];

  /* Nominatim */
  for (
    const variant of variants
  ) {

    try {

      const data =
        await geocodeNominatim(
          variant,
          signal
        );

      if (data.length) {

        candidates =
          data.map(item => ({
            lat:
              Number(item.lat),

            lon:
              Number(item.lon),

            display_name:
              item.display_name ||
              variant
          }));

        break;
      }

    } catch (error) {

      if (
        error.name ===
        "AbortError"
      ) {
        throw error;
      }

    }

  }


  /* Photon Fallback */
  if (!candidates.length) {

    for (
      const variant of variants
    ) {

      try {

        candidates =
          await geocodePhoton(
            variant
          );

        if (
          candidates.length
        ) {
          break;
        }

      } catch (error) {

        if (
          error.name ===
          "AbortError"
        ) {
          throw error;
        }

      }

    }

  }


  if (!candidates.length) {

    throw new Error(
      `"${clean}" wurde nicht gefunden.`
    );

  }


  const result =
    candidates[0];

  geocodeCache.set(
    key,
    result
  );

  return result;
}


/* ============================================================
   ROUTENPARSER
   ============================================================ */

function parseRouteString(
  text
) {

  return String(text || "")
    .trim()
    .split(
      /\s*(?:→|->|=>)\s*|\s+(?:nach|bis|to)\s+/i
    )
    .map(
      value =>
        value.trim()
    )
    .filter(Boolean);

}


/* ============================================================
   ROUTENFELDER
   ============================================================ */

function createRouteField(
  value = "",
  removable = false
) {

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "route-row";

  const input =
    document.createElement(
      "input"
    );

  input.type =
    "text";

  input.value =
    value;

  input.placeholder =
    routeFields.children.length === 0
      ? "Start"
      : "Ziel / Zwischenstopp";

  row.appendChild(
    input
  );


  if (removable) {

    const button =
      document.createElement(
        "button"
      );

    button.type =
      "button";

    button.className =
      "remove-stop";

    button.textContent =
      "×";

    button.addEventListener(
      "click",
      () => row.remove()
    );

    row.appendChild(
      button
    );

  }

  routeFields.appendChild(
    row
  );

}


function getRouteFields() {

  return [
    ...routeFields.querySelectorAll(
      "input"
    )
  ]
    .map(
      input =>
        input.value.trim()
    )
    .filter(Boolean);

}


function setRouteFields(
  stops
) {

  routeFields.innerHTML =
    "";

  stops.forEach(
    (stop, index) => {

      createRouteField(
        stop,
        index >= 2
      );

    }
  );

  while (
    routeFields.children.length < 2
  ) {

    createRouteField(
      "",
      routeFields.children.length >= 2
    );

  }

}


setRouteFields([
  "",
  ""
]);


/* ============================================================
   ROUTE BERECHNEN
   ============================================================ */

async function calculateRoute(
  suppliedStops = null
) {

  const names =
    suppliedStops ||
    getRouteFields();

  if (names.length < 2) {

    setStatus(
      "Bitte mindestens Start und Ziel eingeben."
    );

    return;

  }

  routeButton.disabled =
    true;

  try {

    setStatus(
      "Orte werden gesucht …",
      true
    );

    const locations =
      [];

    /*
     * Nicht Promise.all:
     * dadurch werden die Geocoder
     * nicht gleichzeitig unnötig belastet.
     */
    for (
      const name of names
    ) {

      const location =
        await geocode(name);

      locations.push(
        location
      );

    }


    setStatus(
      "Route wird berechnet …",
      true
    );


    const coordinates =
      locations
        .map(
          location =>
            `${location.lon},${location.lat}`
        )
        .join(";");


    const url =
      OSRM_URL +
      coordinates +
      "?overview=full" +
      "&geometries=geojson" +
      "&steps=false";


    const response =
      await fetchWithTimeout(
        url,
        {},
        10000
      );


    if (!response.ok) {
      throw new Error(
        "Routingserver nicht erreichbar."
      );
    }


    const data =
      await response.json();


    if (
      data.code !== "Ok" ||
      !data.routes?.length
    ) {

      throw new Error(
        "Keine Route gefunden."
      );

    }


    currentRoute =
      data.routes[0];

    currentRouteStops =
      locations;


    drawRoute(
      currentRoute,
      locations
    );


    const bounds =
      L.geoJSON(
        currentRoute.geometry
      ).getBounds();


    map.fitBounds(
      bounds,
      {
        padding: [
          70,
          70
        ]
      }
    );


    setStatus(
      `Route gefunden · ${formatDistance(
        currentRoute.distance / 1000
      )} · ca. ${Math.round(
        currentRoute.duration / 3600
      )} h`
    );


  } catch (error) {

    setStatus(
      error.message ||
      "Route konnte nicht berechnet werden."
    );

  } finally {

    routeButton.disabled =
      false;

  }

}


/* ============================================================
   ROUTE ZEICHNEN
   ============================================================ */

function drawRoute(
  route,
  locations
) {

  routeLayer.clearLayers();


  const shadow =
    L.geoJSON(
      route.geometry,
      {
        style: {
          color: "#000",
          weight: 8,
          opacity: .3
        }
      }
    );

  routeLayer.addLayer(
    shadow
  );


  const line =
    L.geoJSON(
      route.geometry,
      {
        style: {
          color: "#ffffff",
          weight: 4,
          opacity: .95
        }
      }
    );

  routeLayer.addLayer(
    line
  );


  locations.forEach(
    location => {

      const marker =
        L.circleMarker(
          [
            location.lat,
            location.lon
          ],
          {
            radius: 6,
            color: "#111",
            weight: 2,
            fillColor: "#fff",
            fillOpacity: 1
          }
        );


      marker.bindPopup(
        `<b>${escapeHtml(
          location.display_name
        )}</b>`
      );


      routeLayer.addLayer(
        marker
      );

    }
  );

}


/* ============================================================
   SKATEPARK-FILTER
   ============================================================ */

const EXCLUDED_TERMS = [
  "spielplatz",
  "playground",
  "kinderspielplatz",
  "pumptrack",
  "bmx",
  "minigolf",
  "bolzplatz",
  "fussball",
  "fußball",
  "soccer",
  "basketball",
  "volleyball",
  "fitness",
  "parcours"
];


function isValidSkatepark(
  element
) {

  const tags =
    element.tags || {};

  const name =
    normalizeText(
      tags.name ||
      tags["name:de"] ||
      ""
    );

  const description =
    normalizeText(
      tags.description ||
      tags.note ||
      ""
    );

  const semantic =
    `${name} ${description}`;


  const excluded =
    EXCLUDED_TERMS.some(
      term =>
        semantic.includes(
          normalizeText(term)
        )
    );


  /*
   * Eindeutiger OSM-Skatepark.
   */
  if (
    tags.leisure ===
    "skatepark"
  ) {

    return !excluded;

  }


  /*
   * Manche OSM-Einträge sind leider nur
   * als sport=skateboard eingetragen.
   *
   * Diese werden nur genommen,
   * wenn Name/Beschreibung Skate-Bezug
   * erkennen lässt.
   */
  if (
    tags.sport ===
    "skateboard"
  ) {

    if (excluded) {
      return false;
    }

    return (
      semantic.includes("skate") ||
      semantic.includes("skatepark")
    );

  }


  /*
   * Weitere häufige Kombination:
   * leisure + skateboard.
   */
  if (
    tags.leisure &&
    (
      tags.skateboard === "yes" ||
      tags.skateboard === "designated"
    )
  ) {

    if (excluded) {
      return false;
    }

    return (
      semantic.includes("skate")
    );

  }


  return false;
}


/* ============================================================
   ELEMENT-MITTELPUNKT
   ============================================================ */

function elementCenter(
  element
) {

  if (
    Number.isFinite(
      Number(element.lat)
    ) &&
    Number.isFinite(
      Number(element.lon)
    )
  ) {

    return {
      lat:
        Number(element.lat),

      lon:
        Number(element.lon)
    };

  }


  const geometry =
    element.geometry || [];


  if (
    geometry.length === 0
  ) {
    return null;
  }


  let lat = 0;
  let lon = 0;


  geometry.forEach(
    point => {

      lat +=
        Number(point.lat);

      lon +=
        Number(point.lon);

    }
  );


  return {

    lat:
      lat / geometry.length,

    lon:
      lon / geometry.length

  };

}


/* ============================================================
   FLÄCHE SCHÄTZEN
   ============================================================ */

function estimateArea(
  element
) {

  const geometry =
    element.geometry || [];


  /*
   * Nur geschlossene Wege
   * haben eine sinnvoll schätzbare Fläche.
   */
  if (
    geometry.length < 3
  ) {
    return null;
  }


  const first =
    geometry[0];


  const lat0 =
    Number(first.lat);


  const lon0 =
    Number(first.lon);


  const R =
    6371000;


  const lat0Rad =
    lat0 *
    Math.PI /
    180;


  const points =
    geometry.map(
      point => {

        const lat =
          Number(point.lat) *
          Math.PI /
          180;

        const lon =
          Number(point.lon) *
          Math.PI /
          180;

        return {

          x:
            (
              lon -
              lon0 * Math.PI / 180
            ) *
            Math.cos(lat0Rad) *
            R,

          y:
            (
              lat -
              lat0Rad
            ) *
            R

        };

      }
    );


  let area = 0;


  for (
    let i = 0;
    i < points.length;
    i++
  ) {

    const a =
      points[i];

    const b =
      points[
        (i + 1) %
        points.length
      ];


    area +=
      a.x * b.y -
      b.x * a.y;

  }


  area =
    Math.abs(area) / 2;


  if (
    !Number.isFinite(area) ||
    area <= 0 ||
    area > 1000000
  ) {

    return null;

  }


  return area;

}


/* ============================================================
   PARK NORMALISIEREN
   ============================================================ */

function normalizePark(
  element,
  reference
) {

  const center =
    elementCenter(
      element
    );


  if (!center) {
    return null;
  }


  const tags =
    element.tags || {};


  const area =
    estimateArea(
      element
    );


  return {

    id:
      `${element.type}/${element.id}`,

    lat:
      center.lat,

    lon:
      center.lon,

    name:
      tags.name ||
      tags["name:de"] ||
      "Skatepark",

    distance:
      distanceKm(
        reference.lat,
        reference.lon,
        center.lat,
        center.lon
      ),

    area,

    lighting:
      tags.lit === "yes"
        ? "Ja"
        : tags.lit === "no"
          ? "Nein"
          : "unbekannt",

    surface:
      tags.surface ||
      tags["surface:material"] ||
      "unbekannt",

    tags

  };

}


/* ============================================================
   OVERPASS
   ============================================================ */

async function queryOverpass(
  query,
  deadline
) {

  let lastError =
    null;


  for (
    const server of
    OVERPASS_SERVERS
  ) {

    const remaining =
      deadline -
      Date.now();


    if (
      remaining <= 0
    ) {

      throw new Error(
        "Zeitlimit erreicht."
      );

    }


    try {

      const response =
        await fetchWithTimeout(
          server,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded;charset=UTF-8"
            },

            body:
              "data=" +
              encodeURIComponent(query)
          },
          Math.min(
            remaining,
            8500
          )
        );


      if (!response.ok) {

        throw new Error(
          `Overpass HTTP ${response.status}`
        );

      }


      return await response.json();


    } catch (error) {

      lastError =
        error;

    }

  }


  throw (
    lastError ||
    new Error(
      "Kein Overpass-Server erreichbar."
    )
  );

}


/* ============================================================
   LOKALE PARK-QUERY
   ============================================================ */

function buildLocalQuery(
  center,
  radiusKm
) {

  const radius =
    radiusKm * 1000;


  /*
   * Mehrere bekannte OSM-Strukturen.
   *
   * leisure=skatepark
   * ist der Haupttreffer.
   *
   * sport=skateboard dient als
   * zusätzlicher Fallback.
   */
  return `
    [out:json][timeout:8];
    (
      nwr[
        "leisure"="skatepark"
      ](
        around:${radius},
        ${center.lat},
        ${center.lon}
      );

      nwr[
        "sport"="skateboard"
      ](
        around:${radius},
        ${center.lat},
        ${center.lon}
      );

      nwr[
        "skateboard"="yes"
      ](
        around:${radius},
        ${center.lat},
        ${center.lon}
      );

      nwr[
        "skateboard"="designated"
      ](
        around:${radius},
        ${center.lat},
        ${center.lon}
      );
    );

    out geom tags;
  `;

}


/* ============================================================
   LOKALE SKATEPARK-SUCHE
   ============================================================ */

async function searchLocalParks() {

  const center =
    map.getCenter();


  searchParksButton.disabled =
    true;


  setStatus(
    `Suche nach Skateparks im Radius von ${selectedRadius} km …`,
    true
  );


  try {

    const key =
      [
        center.lat.toFixed(4),
        center.lng.toFixed(4),
        selectedRadius
      ].join("|");


    let parks;


    if (
      parkCache.has(key)
    ) {

      parks =
        parkCache.get(key);

    } else {

      const deadline =
        Date.now() + 10000;


      const query =
        buildLocalQuery(
          {
            lat: center.lat,
            lon: center.lng
          },
          selectedRadius
        );


      const data =
        await queryOverpass(
          query,
          deadline
        );


      const unique =
        new Map();


      (
        data.elements || []
      )
        .filter(
          isValidSkatepark
        )
        .forEach(
          element => {

            const park =
              normalizePark(
                element,
                {
                  lat: center.lat,
                  lon: center.lng
                }
              );


            if (
              park
            ) {

              unique.set(
                park.id,
                park
              );

            }

          }
        );


      parks =
        [...unique.values()]
          .sort(
            (a,b) =>
              (b.area || 0) -
              (a.area || 0)
          );


      parkCache.set(
        key,
        parks
      );

    }


    lastParkResults =
      parks;


    displayParks(
      parks
    );


    if (
      parks.length
    ) {

      setStatus(
        `${parks.length} passende Skateparks gefunden.`
      );

    } else {

      setStatus(
        "Keine Skateparks gefunden. Versuche einen größeren Radius."
      );

    }


  } catch (error) {

    setStatus(
      "Die Skatepark-Suche ist fehlgeschlagen. Bitte erneut versuchen."
    );


    resultsElement.innerHTML =
      `
      <div class="result-summary">
        Der Server hat nicht rechtzeitig geantwortet.
        <br>
        Bitte erneut versuchen.
      </div>
      `;


  } finally {

    searchParksButton.disabled =
      false;

  }

}


/* ============================================================
   PARKS ANZEIGEN
   ============================================================ */

function displayParks(
  parks
) {

  parkLayer.clearLayers();

  clearResults();


  /*
   * Maximal 15 auf der Karte.
   */
  parks
    .slice(0, MAX_PARKS)
    .forEach(
      park => {

        parkLayer.addLayer(
          createParkMarker(
            park
          )
        );

      }
    );


  if (
    !parks.length
  ) {

    resultsElement.innerHTML =
      `
      <div class="result-summary">
        Keine Skateparks gefunden.
      </div>
      `;

    return;

  }


  const visible =
    Math.min(
      MAX_PARKS,
      parks.length
    );


  const summary =
    parks.length > MAX_PARKS
      ? `${visible} von ${parks.length} Skateparks`
      : `${parks.length} Skateparks`;


  const summaryElement =
    document.createElement(
      "div"
    );


  summaryElement.className =
    "result-summary";

  summaryElement.textContent =
    summary;


  resultsElement.appendChild(
    summaryElement
  );


  parks
    .slice(0, MAX_PARKS)
    .forEach(
      park => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "park-result";


        item.innerHTML =
          `
          <div class="park-name">
            🔴 ${escapeHtml(
              park.name
            )}
          </div>

          <div class="park-meta">
            ${formatDistance(
              park.distance
            )}
            ·
            ${
              park.area
                ? formatArea(
                    park.area
                  ) +
                  " geschätzt"
                : "Größe unbekannt"
            }
            · Licht:
            ${escapeHtml(
              park.lighting
            )}
            · Oberfläche:
            ${escapeHtml(
              park.surface
            )}
          </div>
          `;


        item.addEventListener(
          "click",
          () => {

            map.setView(
              [
                park.lat,
                park.lon
              ],
              15,
              {
                animate: true
              }
            );


            parkLayer.eachLayer(
              layer => {

                if (
                  !layer.getLatLng
                ) {
                  return;
                }


                const position =
                  layer.getLatLng();


                if (
                  Math.abs(
                    position.lat -
                    park.lat
                  ) < 0.000001 &&
                  Math.abs(
                    position.lng -
                    park.lon
                  ) < 0.000001
                ) {

                  layer.openPopup();

                }

              }
            );

          }
        );


        resultsElement.appendChild(
          item
        );

      }
    );

}

/* ============================================================
   ROUTE-SAMPLING
   ============================================================ */

/*
 * Hier lag das Hauptproblem der vorherigen Version.
 *
 * Statt nur 3–6 Punkte der Route zu nehmen,
 * wird die KOMPLETTE Route regelmäßig abgetastet.
 *
 * Dadurch bekommt beispielsweise eine lange
 * Karlsruhe → München Route Suchbereiche
 * entlang der gesamten Strecke.
 */

function sampleRoute(
  geometry,
  radiusKm
) {

  const coordinates =
    geometry?.coordinates || [];


  if (
    coordinates.length < 2
  ) {
    return [];
  }


  /*
   * Gesamtlänge berechnen.
   */
  let totalKm = 0;


  for (
    let i = 1;
    i < coordinates.length;
    i++
  ) {

    const a =
      coordinates[i - 1];

    const b =
      coordinates[i];


    totalKm +=
      distanceKm(
        a[1],
        a[0],
        b[1],
        b[0]
      );

  }


  /*
   * Suchpunkt-Abstand.
   *
   * Die Suchkreise überlappen bewusst.
   *
   * Bei 5 km Radius:
   * ungefähr alle 7 km
   *
   * Bei 10 km:
   * ungefähr alle 14 km
   *
   * Bei 25 km:
   * ungefähr alle 30 km
   *
   * Bei 50 km:
   * ungefähr alle 55 km
   */
  let spacingKm;


  if (radiusKm <= 5) {

    spacingKm = 7;

  } else if (
    radiusKm <= 10
  ) {

    spacingKm = 14;

  } else if (
    radiusKm <= 25
  ) {

    spacingKm = 30;

  } else {

    spacingKm = 55;

  }


  /*
   * Bei extrem langen Routen
   * begrenzen wir die Anzahl etwas.
   */
  let count =
    Math.ceil(
      totalKm /
      spacingKm
    ) + 1;


  count =
    Math.max(
      2,
      Math.min(
        count,
        80
      )
    );


  const samples =
    [];


  /*
   * Gleichmäßig über die gesamte
   * Koordinatenliste verteilen.
   */
  for (
    let i = 0;
    i < count;
    i++
  ) {

    const index =
      Math.round(
        i *
        (coordinates.length - 1) /
        (count - 1)
      );


    const coordinate =
      coordinates[index];


    samples.push({

      lat:
        coordinate[1],

      lon:
        coordinate[0]

    });

  }


  return samples;

}


/* ============================================================
   ROUTE-SKATEPARK-QUERY
   ============================================================ */

function buildRouteParkQuery(
  points,
  radiusKm
) {

  const radius =
    radiusKm * 1000;


  /*
   * Alle Suchkreise werden in EINEM
   * Overpass-Request zusammengefasst.
   *
   * Dadurch ist die Route nicht auf
   * einen einzelnen Abschnitt begrenzt.
   */

  const blocks =
    points.map(
      point =>
        `
        nwr[
          "leisure"="skatepark"
        ](
          around:${radius},
          ${point.lat},
          ${point.lon}
        );

        nwr[
          "sport"="skateboard"
        ](
          around:${radius},
          ${point.lat},
          ${point.lon}
        );

        nwr[
          "skateboard"="yes"
        ](
          around:${radius},
          ${point.lat},
          ${point.lon}
        );

        nwr[
          "skateboard"="designated"
        ](
          around:${radius},
          ${point.lat},
          ${point.lon}
        );
        `
    );


  return `
    [out:json][timeout:8];
    (
      ${blocks.join("\n")}
    );
    out geom tags;
  `;

}


/* ============================================================
   DISTANZ PARK → ROUTE
   ============================================================ */

function distanceParkToRoute(
  park,
  routePoints
) {

  let minimum =
    Infinity;


  routePoints.forEach(
    point => {

      const distance =
        distanceKm(
          park.lat,
          park.lon,
          point.lat,
          point.lon
        );


      if (
        distance < minimum
      ) {

        minimum =
          distance;

      }

    }
  );


  return minimum;

}


/* ============================================================
   PARKS ENTLANG DER ROUTE
   ============================================================ */

async function searchParksAlongRoute() {

  if (
    !currentRoute?.geometry
  ) {

    setStatus(
      "Bitte zuerst eine Route berechnen."
    );

    return;

  }


  searchRouteParksButton.disabled =
    true;


  try {

    setStatus(
      "Die komplette Route wird nach Skateparks durchsucht …",
      true
    );


    const routePoints =
      sampleRoute(
        currentRoute.geometry,
        selectedRadius
      );


    if (
      routePoints.length < 2
    ) {

      throw new Error(
        "Route konnte nicht ausreichend abgetastet werden."
      );

    }


    setStatus(
      `${routePoints.length} Suchbereiche entlang der Route werden geprüft …`,
      true
    );


    const query =
      buildRouteParkQuery(
        routePoints,
        selectedRadius
      );


    /*
     * HARTE 10-Sekunden-GRENZE
     */
    const deadline =
      Date.now() + 10000;


    const data =
      await queryOverpass(
        query,
        deadline
      );


    const unique =
      new Map();


    (
      data.elements || []
    )
      .filter(
        isValidSkatepark
      )
      .forEach(
        element => {

          /*
           * Für die Routensuche wird der
           * nächstgelegene Routenteil als
           * Referenz verwendet.
           */
          const center =
            elementCenter(
              element
            );


          if (!center) {
            return;
          }


          const park =
            normalizePark(
              element,
              {
                lat:
                  center.lat,

                lon:
                  center.lon
              }
            );


          if (!park) {
            return;
          }


          park.routeDistance =
            distanceParkToRoute(
              park,
              routePoints
            );


          /*
           * Nur Parks innerhalb des
           * gewünschten Radius behalten.
           */
          if (
            park.routeDistance >
            selectedRadius
          ) {
            return;
          }


          unique.set(
            park.id,
            park
          );

        }
      );


    /*
     * Sortierung:
     * zuerst näher an der Route.
     *
     * Bei gleicher Routennähe:
     * größere Parks zuerst.
     */
    const parks =
      [...unique.values()]
        .sort(
          (a,b) => {

            const distanceDifference =
              a.routeDistance -
              b.routeDistance;


            if (
              Math.abs(
                distanceDifference
              ) > 0.1
            ) {

              return (
                distanceDifference
              );

            }


            return (
              (b.area || 0) -
              (a.area || 0)
            );

          }
        );


    lastParkResults =
      parks;


    parkLayer.clearLayers();

    clearResults();


    /*
     * Marker für die ersten 15.
     */
    parks
      .slice(0, MAX_PARKS)
      .forEach(
        park => {

          parkLayer.addLayer(
            createRouteParkMarker(
              park
            )
          );

        }
      );


    if (
      !parks.length
    ) {

      setStatus(
        "Keine Skateparks entlang der Route gefunden."
      );


      resultsElement.innerHTML =
        `
        <div class="result-summary">
          Keine passenden Skateparks entlang dieser Route gefunden.
        </div>
        `;


      return;

    }


    const visible =
      Math.min(
        MAX_PARKS,
        parks.length
      );


    resultsElement.innerHTML =
      `
      <div class="result-summary">
        ${
          parks.length > MAX_PARKS
            ? `${visible} von ${parks.length}`
            : parks.length
        }
        Skateparks entlang der Route
      </div>
      `;


    parks
      .slice(0, MAX_PARKS)
      .forEach(
        park => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "park-result";


          item.innerHTML =
            `
            <div class="park-name">
              🔴 ${escapeHtml(
                park.name
              )}
            </div>

            <div class="park-meta">
              ${park.routeDistance.toFixed(
                1
              )} km von der Route
              ·
              ${
                park.area
                  ? formatArea(
                      park.area
                    ) +
                    " geschätzt"
                  : "Größe unbekannt"
              }
              · Licht:
              ${escapeHtml(
                park.lighting
              )}
              · Oberfläche:
              ${escapeHtml(
                park.surface
              )}
            </div>
            `;


          item.addEventListener(
            "click",
            () => {

              map.setView(
                [
                  park.lat,
                  park.lon
                ],
                15,
                {
                  animate: true
                }
              );


              parkLayer.eachLayer(
                layer => {

                  if (
                    !layer.getLatLng
                  ) {
                    return;
                  }


                  const p =
                    layer.getLatLng();


                  if (
                    Math.abs(
                      p.lat -
                      park.lat
                    ) < 0.000001 &&
                    Math.abs(
                      p.lng -
                      park.lon
                    ) < 0.000001
                  ) {

                    layer.openPopup();

                  }

                }
              );

            }
          );


          resultsElement.appendChild(
            item
          );

        }
      );


    setStatus(
      `${parks.length} Skateparks entlang der Route gefunden.`
    );


  } catch (error) {

    setStatus(
      "Die Suche entlang der Route ist fehlgeschlagen. Bitte erneut versuchen."
    );


    resultsElement.innerHTML =
      `
      <div class="result-summary">
        Der Kartendienst hat nicht rechtzeitig geantwortet.
        <br>
        Bitte erneut versuchen.
      </div>
      `;


  } finally {

    searchRouteParksButton.disabled =
      false;

  }

}


/* ============================================================
   ROUTEN-PARK-MARKER
   ============================================================ */

function createRouteParkMarker(
  park
) {

  const icon =
    L.divIcon({

      className:
        "",

      html:
        `<div class="skate-marker"></div>`,

      iconSize:
        [18,18],

      iconAnchor:
        [9,9],

      popupAnchor:
        [0,-9]

    });


  const marker =
    L.marker(
      [
        park.lat,
        park.lon
      ],
      {
        icon
      }
    );


  marker.bindPopup(
    `
    <div class="popup-title">
      ${escapeHtml(
        park.name
      )}
    </div>

    <div class="popup-line">
      Entfernung zur Route:
      <b>${park.routeDistance.toFixed(
        1
      )} km</b>
    </div>

    <div class="popup-line">
      Größe:
      <b>
        ${
          park.area
            ? formatArea(
                park.area
              ) +
              " geschätzt"
            : "unbekannt"
        }
      </b>
    </div>

    <div class="popup-line">
      Beleuchtung:
      <b>${escapeHtml(
        park.lighting
      )}</b>
    </div>

    <div class="popup-line">
      Oberfläche:
      <b>${escapeHtml(
        park.surface
      )}</b>
    </div>
    `
  );


  return marker;

}


/* ============================================================
   EINHEITLICHE SUCHE
   ============================================================ */

async function performSearch() {

  const query =
    searchInput.value.trim();


  if (!query) {
    return;
  }


  /*
   * Route erkennen.
   */
  const stops =
    parseRouteString(
      query
    );


  if (
    stops.length >= 2
  ) {

    setRouteFields(
      stops
    );

    await calculateRoute(
      stops
    );

    return;

  }


  /*
   * NORMALER ORT
   *
   * Wichtig:
   * Keine automatische Skatepark-Suche.
   */
  searchButton.disabled =
    true;


  try {

    setStatus(
      "Ort wird gesucht …",
      true
    );


    const location =
      await geocode(
        query
      );


    map.setView(
      [
        location.lat,
        location.lon
      ],
      13,
      {
        animate: true
      }
    );


    setStatus(
      location.display_name ||
      "Ort gefunden."
    );


  } catch (error) {

    setStatus(
      error.message ||
      "Ort nicht gefunden."
    );

  } finally {

    searchButton.disabled =
      false;

  }

}


/* ============================================================
   EVENTS – SUCHE
   ============================================================ */

searchButton.addEventListener(
  "click",
  performSearch
);


searchInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      performSearch();

    }

  }
);


/* ============================================================
   EVENTS – ROUTE
   ============================================================ */

routeButton.addEventListener(
  "click",
  () =>
    calculateRoute()
);


addStopButton.addEventListener(
  "click",
  () =>
    createRouteField(
      "",
      true
    )
);


/* ============================================================
   EVENTS – RADIUS
   ============================================================ */

document
  .querySelectorAll(
    ".radius-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".radius-button"
            )
            .forEach(
              other =>
                other.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          selectedRadius =
            Number(
              button.dataset.radius
            );

        }
      );

    }
  );


/* ============================================================
   EVENTS – SKATEPARKS
   ============================================================ */

searchParksButton.addEventListener(
  "click",
  searchLocalParks
);


searchRouteParksButton.addEventListener(
  "click",
  searchParksAlongRoute
);


/* ============================================================
   EVENTS – KARTENART
   ============================================================ */

mapModeButton.addEventListener(
  "click",
  () => {

    currentMapMode =
      "map";


    mapModeButton.classList.add(
      "active"
    );

    satelliteModeButton.classList.remove(
      "active"
    );


    if (
      map.hasLayer(
        satelliteLayer
      )
    ) {

      map.removeLayer(
        satelliteLayer
      );

    }


    if (
      !map.hasLayer(
        osmLayer
      )
    ) {

      osmLayer.addTo(
        map
      );

    }

  }
);


satelliteModeButton.addEventListener(
  "click",
  () => {

    currentMapMode =
      "satellite";


    satelliteModeButton.classList.add(
      "active"
    );

    mapModeButton.classList.remove(
      "active"
    );


    if (
      map.hasLayer(
        osmLayer
      )
    ) {

      map.removeLayer(
        osmLayer
      );

    }


    if (
      !map.hasLayer(
        satelliteLayer
      )
    ) {

      satelliteLayer.addTo(
        map
      );

    }

  }
);


/* ============================================================
   PANEL
   ============================================================ */

closePanelButton.addEventListener(
  "click",
  () => {

    panel.classList.add(
      "collapsed"
    );

    openPanelButton.classList.add(
      "visible"
    );


    setTimeout(
      () =>
        map.invalidateSize(),
      300
    );

  }
);


openPanelButton.addEventListener(
  "click",
  () => {

    panel.classList.remove(
      "collapsed"
    );

    openPanelButton.classList.remove(
      "visible"
    );


    setTimeout(
      () =>
        map.invalidateSize(),
      300
    );

  }
);


/* ============================================================
   ENDE
   ============================================================ */

setStatus(
  "Bereit – suche einen Ort oder eine Route."
);

</script>

</body>
</html>
