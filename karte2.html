<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>MOI-CY – Karte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }

    #map,
    #globe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      z-index: 1;
    }

    #globe {
      z-index: 2;
      display: none;
      background: #02050a;
    }

    /* ------------------------------
       PANEL
    ------------------------------ */

    #panel {
      position: fixed;
      z-index: 1000;
      top: 16px;
      left: 16px;

      width: min(430px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);

      background: rgba(15, 15, 15, 0.95);
      color: white;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.45);

      overflow: hidden;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    #panel.collapsed {
      transform: translateX(calc(-100% - 20px));
      opacity: 0;
      pointer-events: none;
    }

    .panel-inner {
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      padding: 18px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 16px;
    }

    .panel-title h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .close-panel {
      width: 34px;
      height: 34px;

      border: 0;
      border-radius: 50%;

      background: #292929;
      color: white;

      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .close-panel:hover {
      background: #3a3a3a;
    }

    /* ------------------------------
       SUCHE
    ------------------------------ */

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;

      height: 48px;
      padding: 0 15px;

      border: 1px solid #444;
      border-radius: 12px;

      background: #202020;
      color: white;

      outline: none;
      font-size: 15px;
    }

    #searchInput:focus {
      border-color: #777;
    }

    #searchButton {
      width: 52px;
      height: 48px;

      border: 0;
      border-radius: 12px;

      background: white;
      color: #111;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;
    }

    #searchButton:hover {
      background: #ddd;
    }

    .hint {
      margin: 0 2px 16px;

      color: #aaa;
      font-size: 12px;
      line-height: 1.45;
    }

    /* ------------------------------
       ROUTE
    ------------------------------ */

    .section {
      margin-top: 15px;
      padding-top: 15px;

      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .section-title {
      margin-bottom: 10px;

      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.8px;
      color: #ddd;
    }

    .route-row {
      display: flex;
      gap: 7px;
      margin-bottom: 7px;
    }

    .route-row input {
      flex: 1;
      min-width: 0;

      height: 40px;
      padding: 0 11px;

      border: 1px solid #444;
      border-radius: 9px;

      background: #202020;
      color: white;

      outline: none;
    }

    .remove-stop {
      width: 40px;
      height: 40px;

      border: 0;
      border-radius: 9px;

      background: #292929;
      color: #aaa;

      cursor: pointer;
      font-size: 18px;
    }

    .remove-stop:hover {
      background: #3b3b3b;
      color: white;
    }

    .route-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    button.action {
      min-height: 40px;
      padding: 0 13px;

      border: 0;
      border-radius: 9px;

      background: #292929;
      color: white;

      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }

    button.action:hover {
      background: #3a3a3a;
    }

    button.action.primary {
      background: white;
      color: #111;
    }

    button.action.primary:hover {
      background: #ddd;
    }

    /* ------------------------------
       SKATEPARK
    ------------------------------ */

    .radius-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 9px;
    }

    .radius-button {
      height: 38px;

      border: 1px solid #444;
      border-radius: 8px;

      background: #202020;
      color: #bbb;

      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    .radius-button.active {
      background: white;
      color: #111;
      border-color: white;
    }

    #searchParksButton {
      width: 100%;
      min-height: 43px;

      border: 0;
      border-radius: 10px;

      background: #e53935;
      color: white;

      cursor: pointer;

      font-weight: bold;
      letter-spacing: 0.4px;
    }

    #searchParksButton:hover {
      background: #c62828;
    }

    #searchRouteParksButton {
      width: 100%;
      margin-top: 7px;
      min-height: 43px;

      border: 1px solid #e53935;
      border-radius: 10px;

      background: transparent;
      color: #ff6b67;

      cursor: pointer;

      font-weight: bold;
      letter-spacing: 0.3px;
    }

    #searchRouteParksButton:hover {
      background: rgba(229, 57, 53, 0.1);
    }

    /* ------------------------------
       KARTENART
    ------------------------------ */

    .map-switch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .map-switch button {
      height: 38px;

      border: 1px solid #444;
      border-radius: 8px;

      background: #202020;
      color: #bbb;

      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .map-switch button.active {
      background: white;
      color: #111;
      border-color: white;
    }

    /* ------------------------------
       STATUS
    ------------------------------ */

    #status {
      min-height: 20px;
      margin-top: 12px;

      color: #aaa;
      font-size: 12px;
      line-height: 1.45;
    }

    #results {
      margin-top: 10px;
    }

    .result-summary {
      margin-bottom: 8px;
      color: #aaa;
      font-size: 12px;
    }

    .park-result {
      margin-bottom: 7px;
      padding: 10px;

      background: #1d1d1d;
      border-radius: 10px;

      cursor: pointer;
      border: 1px solid transparent;
    }

    .park-result:hover {
      border-color: #555;
    }

    .park-name {
      font-size: 13px;
      font-weight: bold;
      color: white;
      margin-bottom: 5px;
    }

    .park-meta {
      color: #aaa;
      font-size: 11px;
      line-height: 1.5;
    }

    /* ------------------------------
       PANEL ÖFFNEN
    ------------------------------ */

    #openPanelButton {
      position: fixed;
      z-index: 1100;

      top: 16px;
      left: 16px;

      width: 46px;
      height: 46px;

      border: 0;
      border-radius: 50%;

      background: rgba(15, 15, 15, 0.95);
      color: white;

      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);

      cursor: pointer;
      font-size: 20px;

      display: none;
    }

    #openPanelButton.visible {
      display: block;
    }

    /* ------------------------------
       LEAFLET POPUP
    ------------------------------ */

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
    }

    .leaflet-popup-content {
      margin: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .popup-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .popup-line {
      color: #555;
    }

    /* ------------------------------
       ROTE SKATEPARK MARKER
    ------------------------------ */

    .skate-marker {
      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #e53935;
      border: 3px solid white;

      box-shadow:
        0 0 0 2px rgba(229, 57, 53, 0.35),
        0 3px 8px rgba(0, 0, 0, 0.45);
    }

    /* ------------------------------
       LOADING
    ------------------------------ */

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .spinner {
      width: 12px;
      height: 12px;

      border: 2px solid #555;
      border-top-color: white;

      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ------------------------------
       MOBILE
    ------------------------------ */

    @media (max-width: 600px) {
      #panel {
        top: 8px;
        left: 8px;

        width: calc(100vw - 16px);
        max-height: calc(100vh - 16px);
      }

      .panel-inner {
        max-height: calc(100vh - 16px);
        padding: 14px;
      }

      #openPanelButton {
        top: 8px;
        left: 8px;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>
  <div id="globe"></div>

  <button id="openPanelButton" aria-label="Menü öffnen">☰</button>

  <aside id="panel">
    <div class="panel-inner">

      <div class="panel-title">
        <h1>MOI-CY KARTE</h1>
        <button class="close-panel" id="closePanelButton">×</button>
      </div>

      <!-- EINHEITLICHE SUCHE -->
      <div class="search-box">
        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          placeholder="Ort oder Route suchen …"
        >
        <button id="searchButton" aria-label="Suchen">⌕</button>
      </div>

      <p class="hint">
        Ort eingeben, um die Karte zu zentrieren.
        Für eine Route mehrere Orte mit <b>→</b> trennen,
        z. B. Karlsruhe → Stuttgart → München.
      </p>

      <!-- ROUTE -->
      <div class="section">
        <div class="section-title">ROUTE</div>

        <div id="routeFields"></div>

        <div class="route-actions">
          <button class="action" id="addStopButton">
            + Zwischenstopp hinzufügen
          </button>

          <button class="action primary" id="routeButton">
            ROUTE BERECHNEN
          </button>
        </div>
      </div>

      <!-- SKATEPARKS -->
      <div class="section">
        <div class="section-title">SKATEPARKS</div>

        <div class="radius-buttons">
          <button class="radius-button active" data-radius="5">5 km</button>
          <button class="radius-button" data-radius="10">10 km</button>
          <button class="radius-button" data-radius="25">25 km</button>
          <button class="radius-button" data-radius="50">50 km</button>
        </div>

        <button id="searchParksButton">
          🔴 SKATEPARKS IN DER UMGEBUNG
        </button>

        <button id="searchRouteParksButton">
          SKATEPARKS ENTLANG DER ROUTE
        </button>
      </div>

      <!-- KARTENTYP -->
      <div class="section">
        <div class="section-title">KARTE</div>

        <div class="map-switch">
          <button id="mapModeButton" class="active">KARTE</button>
          <button id="satelliteModeButton">SATELLIT</button>
          <button id="globeModeButton">GLOBUS</button>
        </div>
      </div>

      <div id="status"></div>

      <div id="results"></div>

    </div>
  </aside>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    /* =========================================================
       MOI-CY KARTE
       Komplett eigenständig.
       WICHTIG:
       script.js wird absichtlich NICHT geladen.
       ========================================================= */

    "use strict";

    /* ---------------------------------------------------------
       KONSTANTEN
    --------------------------------------------------------- */

    const DEFAULT_CENTER = [49.1, 8.4];
    const DEFAULT_ZOOM = 6;

    const MAP_BOUNDS = L.latLngBounds(
      [-85.05112878, -180],
      [85.05112878, 180]
    );

    const NOMINATIM_URL =
      "https://nominatim.openstreetmap.org/search";

    const PHOTON_URL =
      "https://photon.komoot.io/api/";

    const OSRM_URL =
      "https://router.project-osrm.org/route/v1/driving/";

    const OVERPASS_SERVERS = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter"
    ];

    const OSM_TILES =
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";

    const SATELLITE_TILES =
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";

    const PARK_LIMIT = 15;

    /* ---------------------------------------------------------
       DOM
    --------------------------------------------------------- */

    const mapElement = document.getElementById("map");
    const globeElement = document.getElementById("globe");

    const panel = document.getElementById("panel");
    const closePanelButton =
      document.getElementById("closePanelButton");
    const openPanelButton =
      document.getElementById("openPanelButton");

    const searchInput =
      document.getElementById("searchInput");
    const searchButton =
      document.getElementById("searchButton");

    const routeFields =
      document.getElementById("routeFields");

    const addStopButton =
      document.getElementById("addStopButton");

    const routeButton =
      document.getElementById("routeButton");

    const searchParksButton =
      document.getElementById("searchParksButton");

    const searchRouteParksButton =
      document.getElementById("searchRouteParksButton");

    const statusElement =
      document.getElementById("status");

    const resultsElement =
      document.getElementById("results");

    const mapModeButton =
      document.getElementById("mapModeButton");

    const satelliteModeButton =
      document.getElementById("satelliteModeButton");

    const globeModeButton =
      document.getElementById("globeModeButton");


    /* ---------------------------------------------------------
       LEAFLET KARTE
    --------------------------------------------------------- */

    const map = L.map("map", {
      center: DEFAULT_CENTER,
      zoom: DEFAULT_ZOOM,

      minZoom: 2,
      maxZoom: 18,

      maxBounds: MAP_BOUNDS,
      maxBoundsViscosity: 1.0,

      worldCopyJump: false,

      zoomControl: false,
      preferCanvas: true
    });

    /* Zoom unten rechts */
    L.control.zoom({
      position: "bottomright"
    }).addTo(map);


    /* ---------------------------------------------------------
       TILE LAYER
    --------------------------------------------------------- */

    const osmLayer = L.tileLayer(OSM_TILES, {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    });

    const satelliteLayer = L.tileLayer(SATELLITE_TILES, {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    });

    osmLayer.addTo(map);

    let currentMapMode = "map";


    /* ---------------------------------------------------------
       LAYER
    --------------------------------------------------------- */

    const routeLayer =
      L.layerGroup().addTo(map);

    const parkLayer =
      L.layerGroup().addTo(map);


    /* ---------------------------------------------------------
       STATE
    --------------------------------------------------------- */

    let selectedRadius = 5;

    let currentRoute = null;

    let currentRouteStops = [];

    let lastParkSearchCenter = null;

    let lastParkResults = [];

    const geocodeCache = new Map();
    const parkCache = new Map();

    let globeInstance = null;
    let globeLoadPromise = null;
    let globeVisible = false;

    let lastAutoGlobeState = null;


    /* ---------------------------------------------------------
       HELPERS
    --------------------------------------------------------- */

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ß/g, "ss")
        .trim();
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function distanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;

      const p1 = lat1 * Math.PI / 180;
      const p2 = lat2 * Math.PI / 180;

      const dp =
        (lat2 - lat1) * Math.PI / 180;

      const dl =
        (lon2 - lon1) * Math.PI / 180;

      const a =
        Math.sin(dp / 2) ** 2 +
        Math.cos(p1) *
        Math.cos(p2) *
        Math.sin(dl / 2) ** 2;

      return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );
    }


    function formatDistance(km) {
      if (km < 1) {
        return `${Math.round(km * 1000)} m`;
      }

      return `${km.toFixed(1)} km`;
    }


    function formatArea(m2) {
      if (!m2 || !Number.isFinite(m2)) {
        return "keine Flächendaten";
      }

      if (m2 < 1000) {
        return `ca. ${Math.round(m2)} m²`;
      }

      return `ca. ${(m2 / 1000).toFixed(1)} m²`;
    }


    function setStatus(message, loading = false) {
      if (loading) {
        statusElement.innerHTML =
          `<span class="loading">
             <span class="spinner"></span>
             ${escapeHtml(message)}
           </span>`;
      } else {
        statusElement.textContent = message;
      }
    }


    function clearResults() {
      resultsElement.innerHTML = "";
    }


    /* ---------------------------------------------------------
       TIMEOUT
    --------------------------------------------------------- */

    async function fetchWithTimeout(
      url,
      options = {},
      timeoutMs = 8000,
      externalSignal = null
    ) {
      const controller = new AbortController();

      let timeoutId = null;

      const abortFromExternal = () => {
        controller.abort();
      };

      if (externalSignal) {
        if (externalSignal.aborted) {
          controller.abort();
        } else {
          externalSignal.addEventListener(
            "abort",
            abortFromExternal,
            { once: true }
          );
        }
      }

      timeoutId = setTimeout(() => {
        controller.abort();
      }, timeoutMs);

      try {
        return await fetch(url, {
          ...options,
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeoutId);

        if (externalSignal) {
          externalSignal.removeEventListener(
            "abort",
            abortFromExternal
          );
        }
      }
    }


    /* ---------------------------------------------------------
       LEVENSHTEIN
    --------------------------------------------------------- */

    function levenshtein(a, b) {
      a = normalizeText(a);
      b = normalizeText(b);

      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;

      const previous = new Array(b.length + 1);

      for (let j = 0; j <= b.length; j++) {
        previous[j] = j;
      }

      for (let i = 1; i <= a.length; i++) {
        let current = [i];

        for (let j = 1; j <= b.length; j++) {
          const cost =
            a[i - 1] === b[j - 1]
              ? 0
              : 1;

          current[j] = Math.min(
            current[j - 1] + 1,
            previous[j] + 1,
            previous[j - 1] + cost
          );
        }

        for (let j = 0; j <= b.length; j++) {
          previous[j] = current[j];
        }
      }

      return previous[b.length];
    }


    function similarity(a, b) {
      const x = normalizeText(a);
      const y = normalizeText(b);

      if (!x || !y) return 0;

      const d = levenshtein(x, y);

      return 1 -
        d / Math.max(x.length, y.length);
    }


    /* ---------------------------------------------------------
       GEOCODING VARIANTEN
    --------------------------------------------------------- */

    function searchVariants(query) {
      const variants = [];
      const original = String(query || "").trim();

      if (!original) return variants;

      variants.push(original);

      const umlautVariant = original
        .replace(/ä/gi, "ae")
        .replace(/ö/gi, "oe")
        .replace(/ü/gi, "ue")
        .replace(/ß/gi, "ss");

      if (
        normalizeText(umlautVariant) !==
        normalizeText(original)
      ) {
        variants.push(umlautVariant);
      }

      const reverseVariant = original
        .replace(/ae/gi, "ä")
        .replace(/oe/gi, "ö")
        .replace(/ue/gi, "ü")
        .replace(/ss/gi, "ß");

      if (
        normalizeText(reverseVariant) !==
        normalizeText(original) &&
        !variants.some(
          v => normalizeText(v) ===
            normalizeText(reverseVariant)
        )
      ) {
        variants.push(reverseVariant);
      }

      return variants;
    }


    /* ---------------------------------------------------------
       NOMINATIM
    --------------------------------------------------------- */

    async function geocodeNominatim(query, signal) {
      const url =
        `${NOMINATIM_URL}?format=jsonv2` +
        `&addressdetails=1` +
        `&limit=5` +
        `&dedupe=1` +
        `&accept-language=de` +
        `&q=${encodeURIComponent(query)}`;

      const response =
        await fetchWithTimeout(
          url,
          {
            headers: {
              "Accept": "application/json"
            }
          },
          8000,
          signal
        );

      if (!response.ok) {
        throw new Error(
          `Nominatim HTTP ${response.status}`
        );
      }

      return await response.json();
    }


    /* ---------------------------------------------------------
       PHOTON
    --------------------------------------------------------- */

    async function geocodePhoton(query, signal) {
      const url =
        `${PHOTON_URL}?q=${encodeURIComponent(query)}` +
        `&limit=5&lang=de`;

      const response =
        await fetchWithTimeout(
          url,
          {
            headers: {
              "Accept": "application/json"
            }
          },
          8000,
          signal
        );

      if (!response.ok) {
        throw new Error(
          `Photon HTTP ${response.status}`
        );
      }

      const data = await response.json();

      return (data.features || []).map(feature => {
        const coords =
          feature.geometry?.coordinates || [];

        const props =
          feature.properties || {};

        const label = [
          props.name,
          props.city,
          props.state,
          props.country
        ]
          .filter(Boolean)
          .join(", ");

        return {
          lat: Number(coords[1]),
          lon: Number(coords[0]),
          display_name: label || query,
          type: props.type || "",
          source: "photon"
        };
      });
    }


    /* ---------------------------------------------------------
       GEOCODE
    --------------------------------------------------------- */

    async function geocode(query, signal) {
      const clean =
        String(query || "").trim();

      if (!clean) {
        throw new Error("Leerer Suchbegriff");
      }

      const cacheKey =
        normalizeText(clean);

      if (geocodeCache.has(cacheKey)) {
        return geocodeCache.get(cacheKey);
      }

      const variants =
        searchVariants(clean);

      let candidates = [];

      /* Nominatim */
      for (const variant of variants) {
        try {
          const data =
            await geocodeNominatim(
              variant,
              signal
            );

          candidates.push(
            ...data.map(item => ({
              lat: Number(item.lat),
              lon: Number(item.lon),
              display_name:
                item.display_name ||
                variant,
              source: "nominatim"
            }))
          );

          if (candidates.length) {
            break;
          }
        } catch (error) {
          if (
            error?.name === "AbortError"
          ) {
            throw error;
          }
        }
      }

      /* Photon fallback */
      if (!candidates.length) {
        for (const variant of variants) {
          try {
            const data =
              await geocodePhoton(
                variant,
                signal
              );

            candidates.push(...data);

            if (candidates.length) {
              break;
            }
          } catch (error) {
            if (
              error?.name === "AbortError"
            ) {
              throw error;
            }
          }
        }
      }

      if (!candidates.length) {
        throw new Error(
          `Ort nicht gefunden: ${clean}`
        );
      }

      /* leichtes Ranking */
      candidates.sort((a, b) => {
        const sa =
          similarity(
            clean,
            a.display_name
          );

        const sb =
          similarity(
            clean,
            b.display_name
          );

        return sb - sa;
      });

      const result = candidates[0];

      geocodeCache.set(
        cacheKey,
        result
      );

      return result;
    }


    /* ---------------------------------------------------------
       ROUTEN-PARSER
    --------------------------------------------------------- */

    function parseRouteString(text) {
      return String(text || "")
        .trim()
        .split(
          /\s*(?:→|->|=>)\s*|\s+(?:nach|bis|to)\s+/i
        )
        .map(v => v.trim())
        .filter(Boolean);
    }


    /* ---------------------------------------------------------
       ROUTENFELDER
    --------------------------------------------------------- */

    function createRouteField(
      value = "",
      removable = false
    ) {
      const row =
        document.createElement("div");

      row.className = "route-row";

      const input =
        document.createElement("input");

      input.type = "text";
      input.placeholder =
        routeFields.children.length === 0
          ? "Start"
          : "Zwischenstopp / Ziel";

      input.value = value;

      row.appendChild(input);

      if (removable) {
        const remove =
          document.createElement("button");

        remove.className =
          "remove-stop";

        remove.type = "button";
        remove.textContent = "×";

        remove.addEventListener(
          "click",
          () => {
            row.remove();
          }
        );

        row.appendChild(remove);
      }

      routeFields.appendChild(row);
    }


    function getRouteFieldValues() {
      return [...routeFields.querySelectorAll("input")]
        .map(input => input.value.trim())
        .filter(Boolean);
    }


    function setRouteFields(stops) {
      routeFields.innerHTML = "";

      stops.forEach((stop, index) => {
        createRouteField(
          stop,
          index > 1
        );
      });

      while (routeFields.children.length < 2) {
        createRouteField(
          "",
          routeFields.children.length > 1
        );
      }
    }


    /* Initial */
    setRouteFields(["", ""]);


    /* ---------------------------------------------------------
       ROUTE
    --------------------------------------------------------- */

    async function calculateRoute(
      stops = null
    ) {
      const names =
        stops || getRouteFieldValues();

      if (names.length < 2) {
        setStatus(
          "Für eine Route werden mindestens Start und Ziel benötigt."
        );
        return;
      }

      routeButton.disabled = true;

      try {
        setStatus(
          "Orte der Route werden gesucht …",
          true
        );

        const controller =
          new AbortController();

        const timeout =
          setTimeout(
            () => controller.abort(),
            10000
          );

        let locations;

        try {
          locations =
            await Promise.all(
              names.map(name =>
                geocode(
                  name,
                  controller.signal
                )
              )
            );
        } finally {
          clearTimeout(timeout);
        }

        setStatus(
          "Route wird berechnet …",
          true
        );

        const coordinates =
          locations
            .map(
              item =>
                `${item.lon},${item.lat}`
            )
            .join(";");

        const url =
          OSRM_URL +
          coordinates +
          "?overview=full" +
          "&geometries=geojson" +
          "&steps=false";

        const response =
          await fetchWithTimeout(
            url,
            {},
            10000
          );

        if (!response.ok) {
          throw new Error(
            `Routing HTTP ${response.status}`
          );
        }

        const data =
          await response.json();

        if (
          data.code !== "Ok" ||
          !data.routes?.length
        ) {
          throw new Error(
            "Keine Route gefunden."
          );
        }

        currentRoute =
          data.routes[0];

        currentRouteStops =
          locations;

        drawRoute(
          currentRoute,
          locations
        );

        const bounds =
          L.geoJSON(
            currentRoute.geometry
          ).getBounds();

        map.fitBounds(
          bounds,
          {
            padding: [60, 60]
          }
        );

        updateGlobeData();

        setStatus(
          `Route gefunden · ${formatDistance(
            currentRoute.distance / 1000
          )} · ca. ${Math.round(
            currentRoute.duration / 3600
          )} h`
        );

      } catch (error) {
        if (
          error?.name === "AbortError"
        ) {
          setStatus(
            "Die Routensuche hat zu lange gedauert."
          );
        } else {
          setStatus(
            error.message ||
            "Route konnte nicht berechnet werden."
          );
        }
      } finally {
        routeButton.disabled = false;
      }
    }


    function drawRoute(route, locations) {
      routeLayer.clearLayers();

      const geojson =
        route.geometry;

      const line =
        L.geoJSON(
          geojson,
          {
            style: {
              color: "#111",
              weight: 7,
              opacity: 0.35
            }
          }
        );

      routeLayer.addLayer(line);

      const mainLine =
        L.geoJSON(
          geojson,
          {
            style: {
              color: "#ffffff",
              weight: 4,
              opacity: 0.95
            }
          }
        );

      routeLayer.addLayer(mainLine);

      locations.forEach(
        (location, index) => {
          const marker =
            L.circleMarker(
              [location.lat, location.lon],
              {
                radius: 6,
                color: "#111",
                weight: 2,
                fillColor: "#fff",
                fillOpacity: 1
              }
            );

          marker.bindPopup(
            `<b>${escapeHtml(
              location.display_name
            )}</b>`
          );

          routeLayer.addLayer(marker);
        }
      );
    }


    /* ---------------------------------------------------------
       ROUTE-PARK-SUCHE
    --------------------------------------------------------- */

    function getRoutePoints(
      geometry,
      radiusKm
    ) {
      const coordinates =
        geometry?.coordinates || [];

      if (coordinates.length < 2) {
        return [];
      }

      const points = [];

      let totalDistance = 0;

      for (
        let i = 1;
        i < coordinates.length;
        i++
      ) {
        const a = coordinates[i - 1];
        const b = coordinates[i];

        totalDistance +=
          distanceKm(
            a[1],
            a[0],
            b[1],
            b[0]
          );
      }

      let targetCount;

      if (radiusKm <= 5) {
        targetCount = 6;
      } else if (radiusKm <= 10) {
        targetCount = 5;
      } else if (radiusKm <= 25) {
        targetCount = 4;
      } else {
        targetCount = 3;
      }

      targetCount =
        Math.min(
          targetCount,
          Math.max(
            2,
            Math.ceil(
              totalDistance / 100
            )
          )
        );

      for (
        let i = 0;
        i < targetCount;
        i++
      ) {
        const index =
          Math.round(
            i *
            (coordinates.length - 1) /
            (targetCount - 1)
          );

        const point =
          coordinates[index];

        points.push({
          lat: point[1],
          lon: point[0]
        });
      }

      return points;
    }


    /* ---------------------------------------------------------
       OVERPASS
    --------------------------------------------------------- */

    async function queryOverpass(
      query,
      deadline
    ) {
      let lastError = null;

      for (
        const server of OVERPASS_SERVERS
      ) {
        const remaining =
          deadline - Date.now();

        if (remaining <= 0) {
          throw new Error(
            "Zeitlimit erreicht."
          );
        }

        try {
          const response =
            await fetchWithTimeout(
              server,
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/x-www-form-urlencoded;charset=UTF-8"
                },
                body:
                  "data=" +
                  encodeURIComponent(query)
              },
              Math.min(
                7500,
                remaining
              )
            );

          if (!response.ok) {
            throw new Error(
              `Overpass HTTP ${response.status}`
            );
          }

          return await response.json();

        } catch (error) {
          lastError = error;
        }
      }

      throw lastError ||
        new Error(
          "Overpass nicht erreichbar."
        );
    }


    /* ---------------------------------------------------------
       SKATEPARK-FILTER
    --------------------------------------------------------- */

    const EXCLUDED_TERMS = [
      "spielplatz",
      "playground",
      "kinderspielplatz",
      "pumptrack",
      "bmx",
      "minigolf",
      "bolzplatz",
      "fussball",
      "fußball",
      "soccer",
      "basketball",
      "volleyball",
      "fitness",
      "parcours"
    ];


    function isValidSkatepark(element) {
      const tags =
        element.tags || {};

      const name =
        normalizeText(
          tags.name ||
          tags["name:de"] ||
          ""
        );

      const description =
        normalizeText(
          tags.description ||
          tags.note ||
          ""
        );

      const semanticText =
        `${name} ${description}`;

      const excluded =
        EXCLUDED_TERMS.some(
          term =>
            semanticText.includes(
              normalizeText(term)
            )
        );

      /*
       * leisure=skatepark ist der wichtigste
       * und eindeutigste OSM-Schlüssel.
       */
      if (
        tags.leisure === "skatepark"
      ) {
        return !excluded;
      }

      /*
       * sport=skateboard allein reicht NICHT.
       * Name/Beschreibung muss einen Skate-Bezug haben.
       */
      if (
        tags.sport === "skateboard"
      ) {
        if (excluded) {
          return false;
        }

        return (
          semanticText.includes("skate") ||
          semanticText.includes("skatepark")
        );
      }

      return false;
    }


    /* ---------------------------------------------------------
       GEOMETRIE / MITTELPUNKT
    --------------------------------------------------------- */

    function elementCenter(element) {
      if (
        Number.isFinite(
          Number(element.lat)
        ) &&
        Number.isFinite(
          Number(element.lon)
        )
      ) {
        return {
          lat: Number(element.lat),
          lon: Number(element.lon)
        };
      }

      const geometry =
        element.geometry || [];

      if (!geometry.length) {
        return null;
      }

      let latSum = 0;
      let lonSum = 0;

      geometry.forEach(point => {
        latSum += Number(point.lat);
        lonSum += Number(point.lon);
      });

      return {
        lat: latSum / geometry.length,
        lon: lonSum / geometry.length
      };
    }


    /* ---------------------------------------------------------
       GESCHÄTZTE FLÄCHE
       Lokale Projektion + Shoelace.
    --------------------------------------------------------- */

    function estimateAreaM2(element) {
      const geometry =
        element.geometry || [];

      if (
        geometry.length < 3
      ) {
        return null;
      }

      const first =
        geometry[0];

      const lat0 =
        Number(first.lat);

      const lon0 =
        Number(first.lon);

      const R = 6371000;

      const points =
        geometry.map(point => {
          const lat =
            Number(point.lat) *
            Math.PI / 180;

          const lon =
            Number(point.lon) *
            Math.PI / 180;

          const lat0Rad =
            lat0 *
            Math.PI / 180;

          const lon0Rad =
            lon0 *
            Math.PI / 180;

          return {
            x:
              (lon - lon0Rad) *
              Math.cos(lat0Rad) *
              R,

            y:
              (lat - lat0 * Math.PI / 180) *
              R
          };
        });

      let area = 0;

      for (
        let i = 0;
        i < points.length;
        i++
      ) {
        const a = points[i];
        const b =
          points[
            (i + 1) % points.length
          ];

        area +=
          a.x * b.y -
          b.x * a.y;
      }

      area =
        Math.abs(area) / 2;

      /*
       * OSM-Geometrien können offen sein.
       * Bei absurden Werten ignorieren.
       */
      if (
        !Number.isFinite(area) ||
        area <= 0 ||
        area > 1000000
      ) {
        return null;
      }

      return area;
    }


    /* ---------------------------------------------------------
       PARK-DATEN
    --------------------------------------------------------- */

    function normalizePark(
      element,
      center
    ) {
      const position =
        elementCenter(element);

      if (!position) {
        return null;
      }

      const tags =
        element.tags || {};

      const distance =
        distanceKm(
          center.lat,
          center.lon,
          position.lat,
          position.lon
        );

      const area =
        estimateAreaM2(element);

      return {
        id:
          `${element.type}/${element.id}`,

        lat:
          position.lat,

        lon:
          position.lon,

        name:
          tags.name ||
          tags["name:de"] ||
          "Skatepark",

        distance,

        area,

        lighting:
          tags.lit === "yes"
            ? "Ja"
            : tags.lit === "no"
              ? "Nein"
              : "unbekannt",

        surface:
          tags.surface ||
          tags["surface:material"] ||
          "unbekannt",

        tags
      };
    }


    /* ---------------------------------------------------------
       OVERPASS QUERY LOKAL
    --------------------------------------------------------- */

    function buildLocalParkQuery(
      lat,
      lon,
      radiusMeters
    ) {
      return `
        [out:json][timeout:8];
        (
          nwr["leisure"="skatepark"]
            (around:${radiusMeters},${lat},${lon});

          nwr["sport"="skateboard"]
            (around:${radiusMeters},${lat},${lon});
        );
        out geom tags;
      `;
    }


    /* ---------------------------------------------------------
       OVERPASS QUERY ROUTE
    --------------------------------------------------------- */

    function buildRouteParkQuery(
      points,
      radiusMeters
    ) {
      const blocks =
        points.map(point => `
          nwr["leisure"="skatepark"]
            (around:${radiusMeters},${point.lat},${point.lon});

          nwr["sport"="skateboard"]
            (around:${radiusMeters},${point.lat},${point.lon});
        `);

      return `
        [out:json][timeout:8];
        (
          ${blocks.join("\n")}
        );
        out geom tags;
      `;
    }


    /* ---------------------------------------------------------
       PARKS SUCHEN
       HARTE 10-SEKUNDEN-GRENZE
    --------------------------------------------------------- */

    async function searchParksAround(
      center,
      radiusKm
    ) {
      const cacheKey =
        [
          center.lat.toFixed(4),
          center.lon.toFixed(4),
          radiusKm
        ].join("|");

      if (
        parkCache.has(cacheKey)
      ) {
        return parkCache.get(cacheKey);
      }

      const deadline =
        Date.now() + 10000;

      const query =
        buildLocalParkQuery(
          center.lat,
          center.lon,
          radiusKm * 1000
        );

      const data =
        await queryOverpass(
          query,
          deadline
        );

      const elements =
        data.elements || [];

      const parks =
        elements
          .filter(isValidSkatepark)
          .map(element =>
            normalizePark(
              element,
              center
            )
          )
          .filter(Boolean);

      /*
       * Doppelte Elemente entfernen.
       */
      const unique =
        new Map();

      parks.forEach(park => {
        unique.set(
          park.id,
          park
        );
      });

      const result =
        [...unique.values()]
          .sort(
            (a, b) =>
              (b.area || 0) -
              (a.area || 0)
          );

      parkCache.set(
        cacheKey,
        result
      );

      return result;
    }


    /* ---------------------------------------------------------
       PARK MARKER
    --------------------------------------------------------- */

    function createRedParkMarker(

    ) {
      const icon =

          html:

        });

      const marker =
        L.marker(
          [park.lat, park.lon],

        );

      marker.bindPopup(
        `
        <div class="popup-title">
          ${escapeHtml(park.name)}
        </div>

        <div class="popup-line">
          Entfernung:
          <b>${formatDistance(park.distance)}</b>
        </div>

        <div class="popup-line">
          Größe:
          <b>${
            park.area
              ? formatArea(park.area) + " geschätzt"
              : "nicht verfügbar"
          }</b>
        </div>

        <div class="popup-line">
          Beleuchtung:
          <b>${escapeHtml(park.lighting)}</b>
        </div>

        <div class="popup-line">
          Oberfläche:
          <b>${escapeHtml(park.surface)}</b>
        </div>
        `
      );

      return marker;
    }


    /* ---------------------------------------------------------
       PARKS AUF KARTE
    --------------------------------------------------------- */

    function displayParks(
      parks,
      center
    ) {
      parkLayer.clearLayers();

      clearResults();

      lastParkResults =
        parks.slice();

      parks
        .slice(0, PARK_LIMIT)
        .forEach(park => {
          parkLayer.addLayer(
            createRedParkMarker(park)
          );
        });

      /*
       * Ergebnisliste
       */
      if (!parks.length) {
        resultsElement.innerHTML =
          `<div class="result-summary">
             Keine Skateparks gefunden.
           </div>`;

        return;
      }

      const shown =
        Math.min(
          PARK_LIMIT,
          parks.length
        );

      const summary =
        parks.length > PARK_LIMIT
          ? `${shown} von ${parks.length} Skateparks`
          : `${parks.length} Skateparks`;

      const summaryElement =
        document.createElement("div");

      summaryElement.className =
        "result-summary";

      summaryElement.textContent =
        summary;

      resultsElement.appendChild(
        summaryElement
      );

      parks
        .slice(0, PARK_LIMIT)
        .forEach(park => {
          const item =
            document.createElement("div");

          item.className =
            "park-result";

          item.innerHTML =
            `
            <div class="park-name">
              🔴 ${escapeHtml(park.name)}
            </div>

            <div class="park-meta">
              ${formatDistance(park.distance)}
              ·
              ${
                park.area
                  ? formatArea(park.area)
                  : "Größe unbekannt"
              }
              · Licht:
              ${escapeHtml(park.lighting)}
              · Oberfläche:
              ${escapeHtml(park.surface)}
            </div>
            `;

          item.addEventListener(
            "click",
            () => {
              map.setView(
                [park.lat, park.lon],
                Math.max(
                  map.getZoom(),
                  14
                ),
                {
                  animate: true
                }
              );

              /*
               * passenden Marker suchen
               */
              parkLayer.eachLayer(
                layer => {
                  if (
                    layer.getLatLng &&
                    Math.abs(
                      layer.getLatLng().lat -
                      park.lat
                    ) < 0.000001 &&
                    Math.abs(
                      layer.getLatLng().lng -
                      park.lon
                    ) < 0.000001
                  ) {
                    layer.openPopup();
                  }
                }
              );
            }
          );

          resultsElement.appendChild(
            item
          );
        });
    }


    /* ---------------------------------------------------------
       LOKALE PARKSUCHE
    --------------------------------------------------------- */

    async function searchLocalParks() {
      const center =
        map.getCenter();

      lastParkSearchCenter = {

      };

          );

        updateGlobeData();

        if (
          error?.name === "AbortError"
        ) {
          setStatus(
            "Skatepark-Suche nach 10 Sekunden abgebrochen."
          );
        } else {
          setStatus(
            "Skatepark-Suche fehlgeschlagen. Bitte erneut versuchen."
          );
        }

        clearResults();

        resultsElement.innerHTML =
          `<div class="result-summary">
             Der Server hat nicht rechtzeitig geantwortet.
             <br>
             Bitte erneut versuchen.
           </div>`;
      } finally {
        searchParksButton.disabled = false;
      }
    }


    /* ---------------------------------------------------------
       SKATEPARKS ENTLANG DER ROUTE
    --------------------------------------------------------- */

    async function searchParksAlongRoute() {
      if (
        !currentRoute?.geometry
      ) {
        setStatus(
          "Bitte zuerst eine Route berechnen."
        );
        return;
      }

      searchRouteParksButton.disabled =
        true;

      setStatus(
        "Suche nach Skateparks entlang der Route …",
        true
      );

      try {
        const points =
          getRoutePoints(
            currentRoute.geometry,
            selectedRadius
          );

        if (!points.length) {
          throw new Error(
            "Route enthält keine Geometrie."
          );
        }

        const query =
          buildRouteParkQuery(
            points,
            selectedRadius * 1000
          );

        const deadline =
          Date.now() + 10000;

        const data =
          await queryOverpass(
            query,
            deadline
          );

        const elements =
          data.elements || [];

        const routeCenter =
          currentRouteStops[0] || {
            lat: points[0].lat,
            lon: points[0].lon
          };

        const parks =
          elements
            .filter(isValidSkatepark)
            .map(element =>
              normalizePark(
                element,
                routeCenter
              )
            )
            .filter(Boolean);

        /*
         * Bei Routenparks ist die Entfernung
         * zum Start nicht entscheidend.
         *
         * Deshalb neu nach Nähe zur Route
         * sortieren.
         */
        const unique =
          new Map();

        parks.forEach(park => {
          unique.set(
            park.id,
            park
          );
        });

        const routeParks =
          [...unique.values()]
            .map(park => ({
              ...park,
              routeDistance:
                minDistanceToPoints(
                  park,
                  points
                )
            }))
            .sort(
              (a, b) =>
                (b.area || 0) -
                (a.area || 0)
            );

        parkLayer.clearLayers();

        routeParks
          .slice(0, PARK_LIMIT)
          .forEach(park => {
            parkLayer.addLayer(
              createRedParkMarker(park)
            );
          });

        clearResults();

        if (!routeParks.length) {
          setStatus(
            "Keine Skateparks entlang der Route gefunden."
          );

          resultsElement.innerHTML =
            `<div class="result-summary">
              Keine passenden Skateparks entlang dieser Route.
            </div>`;

          return;
        }

        const shown =
          Math.min(
            PARK_LIMIT,
            routeParks.length
          );

        resultsElement.innerHTML =
          `<div class="result-summary">
             ${shown} von ${routeParks.length}
             Skateparks entlang der Route
           </div>`;

        routeParks
          .slice(0, PARK_LIMIT)
          .forEach(park => {
            const item =
              document.createElement("div");

            item.className =
              "park-result";

            item.innerHTML =
              `
              <div class="park-name">
                🔴 ${escapeHtml(park.name)}
              </div>

              <div class="park-meta">
                ca. ${park.routeDistance.toFixed(1)} km
                von der Route
                ·
                ${
                  park.area
                    ? formatArea(park.area)
                    : "Größe unbekannt"
                }
                · Licht:
                ${escapeHtml(park.lighting)}
                · Oberfläche:
                ${escapeHtml(park.surface)}
              </div>
              `;

            item.addEventListener(
              "click",
              () => {
                map.setView(
                  [park.lat, park.lon],
                  14,
                  { animate: true }
                );

                parkLayer.eachLayer(
                  layer => {
                    if (
                      layer.getLatLng &&
                      Math.abs(
                        layer.getLatLng().lat -
                        park.lat
                      ) < 0.000001 &&
                      Math.abs(
                        layer.getLatLng().lng -
                        park.lon
                      ) < 0.000001
                    ) {
                      layer.openPopup();
                    }
                  }
                );
              }
            );

            resultsElement.appendChild(
              item
            );
          });

        lastParkResults =
          routeParks;

        setStatus(
          `${routeParks.length} Skateparks entlang der Route gefunden.`
        );

        updateGlobeData();

      } catch (error) {
        setStatus(
          "Skatepark-Suche entlang der Route fehlgeschlagen. Bitte erneut versuchen."
        );
      } finally {
        searchRouteParksButton.disabled =
          false;
      }
    }


    function minDistanceToPoints(
      park,
      points
    ) {
      let min = Infinity;

      points.forEach(point => {
        const d =
          distanceKm(
            park.lat,
            park.lon,
            point.lat,
            point.lon
          );

        min =
          Math.min(min, d);
      });

      return min;
    }


    /* ---------------------------------------------------------
       SUCHE
    --------------------------------------------------------- */

    async function performSearch() {
      const query =
        searchInput.value.trim();

      if (!query) {
        return;
      }

      /*
       * Route?
       */
      const routeStops =
        parseRouteString(query);

      if (routeStops.length >= 2) {
        setRouteFields(routeStops);

        await calculateRoute(
          routeStops
        );

        return;
      }

      /*
       * Normaler Ort:
       * Nur Karte zentrieren.
       * KEINE automatische Skatepark-Suche.
       */
      searchButton.disabled = true;

      try {
        setStatus(
          "Ort wird gesucht …",
          true
        );

        const location =
          await geocode(query);

        map.setView(
          [
            location.lat,
            location.lon
          ],
          13,
          {
            animate: true
          }
        );

        setStatus(
          location.display_name ||
          "Ort gefunden."
        );

      } catch (error) {
        setStatus(
          error.message ||
          "Ort nicht gefunden."
        );
      } finally {
        searchButton.disabled = false;
      }
    }


    /* ---------------------------------------------------------
       MAP MODE
    --------------------------------------------------------- */

    function setMapMode(mode) {
      currentMapMode = mode;

      mapModeButton.classList.toggle(
        "active",
        mode === "map"
      );

      satelliteModeButton.classList.toggle(
        "active",
        mode === "satellite"
      );

      globeModeButton.classList.toggle(
        "active",
        mode === "globe"
      );

      if (mode === "globe") {
        showGlobe();

        return;
      }

      hideGlobe();

      if (
        mode === "map"
      ) {
        if (
          map.hasLayer(
            satelliteLayer
          )
        ) {
          map.removeLayer(
            satelliteLayer
          );
        }

        if (
          !map.hasLayer(osmLayer)
        ) {
          osmLayer.addTo(map);
        }

      } else if (
        mode === "satellite"
      ) {
        if (
          map.hasLayer(osmLayer)
        ) {
          map.removeLayer(
            osmLayer
          );
        }

        if (
          !map.hasLayer(
            satelliteLayer
          )
        ) {
          satelliteLayer.addTo(map);
        }
      }

      setTimeout(() => {
        map.invalidateSize();
      }, 50);
    }


    /* ---------------------------------------------------------
       GLOBUS LAZY LOAD
    --------------------------------------------------------- */

    function loadGlobeLibrary() {
      if (
        window.Globe
      ) {
        return Promise.resolve();
      }

      if (
        globeLoadPromise
      ) {
        return globeLoadPromise;
      }

      globeLoadPromise =
        new Promise(
          (resolve, reject) => {
            const script =
              document.createElement(
                "script"
              );

            script.src =
              "https://unpkg.com/globe.gl/dist/globe.gl.min.js";

            script.async = true;

            script.onload =
              () => resolve();

            script.onerror =
              () =>
                reject(
                  new Error(
                    "Globus konnte nicht geladen werden."
                  )
                );

            document.head.appendChild(
              script
            );
          }
        );

      return globeLoadPromise;
    }


    /* ---------------------------------------------------------
       GLOBUS
    --------------------------------------------------------- */

    async function showGlobe() {
      try {
        await loadGlobeLibrary();

        if (!globeInstance) {
          globeInstance =
            window.Globe()(
              globeElement
            );

          globeInstance
            .globeImageUrl(
              "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
            )
            .bumpImageUrl(
              "https://unpkg.com/three-globe/example/img/earth-topology.png"
            )
            .backgroundColor(
              "#02050a"
            )
            .showAtmosphere(true)
            .atmosphereColor(
              "#5aa8ff"
            )
            .atmosphereAltitude(
              0.18
            )
            .pointAltitude(
              0.025
            )
            .pointColor(
              () => "#e53935"
            )
            .pointRadius(
              0.35
            )
            .pathColor(
              () => "#ffffff"
            )
            .pathStroke(
              1.5
            );

          globeInstance
            .pointLabel(
              point =>
                point.name ||
                "Skatepark"
            );

          globeInstance
            .pathLabel(
              () => "Route"
            );
        }

        globeVisible = true;

        mapElement.style.display =
          "none";

        globeElement.style.display =
          "block";

        updateGlobeData();

        /*
         * Blickrichtung aus Leaflet übernehmen.
         */
        const center =
          map.getCenter();

        globeInstance.pointOfView(
          {
            lat: center.lat,
            lng: center.lng,
            altitude:
              Math.max(
                1.6,
                3.8 -
                map.getZoom() * 0.12
              )
          },
          500
        );

      } catch (error) {
        setStatus(
          "Globus konnte nicht geladen werden."
        );

        setMapMode("map");
      }
    }


    function hideGlobe() {
      globeVisible = false;

      globeElement.style.display =
        "none";

      mapElement.style.display =
        "block";

      setTimeout(() => {
        map.invalidateSize();
      }, 50);
    }


    /* ---------------------------------------------------------
       GLOBUS DATEN
    --------------------------------------------------------- */

    function updateGlobeData() {
      if (
        !globeInstance
      ) {
        return;
      }

      const points =
        lastParkResults
          .slice(0, PARK_LIMIT)
          .map(park => ({
            lat: park.lat,
            lng: park.lon,
            name: park.name
          }));

      globeInstance
        .pointsData(points);

      if (
        currentRoute?.geometry?.coordinates
      ) {
        const routeCoordinates =
          currentRoute.geometry.coordinates;

        globeInstance.pathsData([
          {
            coords:
              routeCoordinates.map(
                coordinate => [
                  coordinate[1],
                  coordinate[0]
                ]
              )
          }
        ]);

      } else {
        globeInstance.pathsData([]);
      }
    }


    /* ---------------------------------------------------------
       AUTOMATISCHER GLOBUS BEI ZOOM 2
    --------------------------------------------------------- */

    map.on(
      "zoomend",
      () => {
        if (
          currentMapMode === "globe"
        ) {
          return;
        }

        const zoom =
          map.getZoom();

        if (
          zoom <= 2 &&
          lastAutoGlobeState !== "globe"
        ) {
          lastAutoGlobeState =
            "globe";

          showGlobe();

        } else if (
          zoom > 2 &&
          lastAutoGlobeState === "globe"
        ) {
          lastAutoGlobeState =
            "map";

          hideGlobe();
        }
      }
    );


    /* ---------------------------------------------------------
       PANEL
    --------------------------------------------------------- */

    closePanelButton.addEventListener(
      "click",
      () => {
        panel.classList.add(
          "collapsed"
        );

        openPanelButton.classList.add(
          "visible"
        );

        setTimeout(() => {
          map.invalidateSize();
        }, 300);
      }
    );


    openPanelButton.addEventListener(
      "click",
      () => {
        panel.classList.remove(
          "collapsed"
        );

        openPanelButton.classList.remove(
          "visible"
        );

        setTimeout(() => {
          map.invalidateSize();
        }, 300);
      }
    );


    /* ---------------------------------------------------------
       SUCHE EVENTS
    --------------------------------------------------------- */

    searchButton.addEventListener(
      "click",
      performSearch
    );

    searchInput.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter"
        ) {
          event.preventDefault();
          performSearch();
        }
      }
    );


    /* ---------------------------------------------------------
       ROUTE EVENTS
    --------------------------------------------------------- */

    addStopButton.addEventListener(
      "click",
      () => {
        createRouteField(
          "",
          true
        );
      }
    );


    routeButton.addEventListener(
      "click",
      () => {
        calculateRoute();
      }
    );


    /* ---------------------------------------------------------
       RADIUS
    --------------------------------------------------------- */

    document
      .querySelectorAll(
        ".radius-button"
      )
      .forEach(button => {
        button.addEventListener(
          "click",
          () => {
            document
              .querySelectorAll(
                ".radius-button"
              )
              .forEach(
                other =>
                  other.classList.remove(
                    "active"
                  )
              );

            button.classList.add(
              "active"
            );

            selectedRadius =
              Number(
                button.dataset.radius
              );
          }
        );
      });


    /* ---------------------------------------------------------
       PARK EVENTS
    --------------------------------------------------------- */

    searchParksButton.addEventListener(
      "click",
      searchLocalParks
    );


    searchRouteParksButton.addEventListener(
      "click",
      searchParksAlongRoute
    );


    /* ---------------------------------------------------------
       MAP MODE EVENTS
    --------------------------------------------------------- */

    mapModeButton.addEventListener(
      "click",
      () => {
        lastAutoGlobeState = null;
        setMapMode("map");
      }
    );


    satelliteModeButton.addEventListener(
      "click",
      () => {
        lastAutoGlobeState = null;
        setMapMode("satellite");
      }
    );


    globeModeButton.addEventListener(
      "click",
      () => {
        lastAutoGlobeState = null;
        setMapMode("globe");
      }
    );


    /* ---------------------------------------------------------
       INITIALER ZUSTAND
       KEIN NETZWERKCALL!
    --------------------------------------------------------- */

    setStatus(
      "Bereit – suche einen Ort oder eine Route."
    );

  </script>

</body>
</html>
