<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>MOI-CY – Karte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    :root {
      --bg: #090b10;
      --panel: #11151d;
      --panel-2: #171c25;
      --border: #2b3340;
      --text: #f4f6f8;
      --muted: #9ba5b3;
      --accent: #ffffff;
      --danger: #e53935;
      --shadow: 0 18px 50px rgba(0, 0, 0, .38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #dce4ec;
      z-index: 1;
    }

    /* -----------------------------
       PANEL
    ----------------------------- */

    .map-panel {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1000;
      width: min(420px, calc(100vw - 36px));
      max-height: calc(100vh - 36px);
      overflow-y: auto;

      background: rgba(17, 21, 29, .96);
      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);

      transition:
        transform .25s ease,
        opacity .25s ease,
        width .25s ease;
    }

    .map-panel.collapsed {
      transform: translateX(calc(-100% - 24px));
      opacity: 0;
      pointer-events: none;
    }

    .panel-inner {
      padding: 18px;
    }

    .panel-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .panel-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .icon-btn:hover {
      background: #202733;
    }

    #openPanelBtn {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1001;

      display: none;
      align-items: center;
      justify-content: center;

      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(17,21,29,.96);
      color: white;
      box-shadow: var(--shadow);
      cursor: pointer;
      font-size: 20px;
    }

    #openPanelBtn.visible {
      display: flex;
    }

    /* -----------------------------
       SEARCH
    ----------------------------- */

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-box input {
      min-width: 0;
      flex: 1;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      height: 44px;
      padding: 0 13px;

      color: var(--text);
      background: #0c1016;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #657386;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .primary-btn {
      height: 44px;
      padding: 0 16px;
      border-radius: 11px;
      background: white;
      color: #080a0d;
      font-weight: 800;
      white-space: nowrap;
    }

    .primary-btn:hover {
      background: #e8ebee;
    }

    .secondary-btn {
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-2);
      color: var(--text);
      font-weight: 700;
    }

    .secondary-btn:hover {
      background: #202733;
    }

    .danger-btn {
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid rgba(229,57,53,.35);
      border-radius: 10px;
      background: rgba(229,57,53,.08);
      color: #ff8a87;
      font-weight: 700;
    }

    .hint {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    /* -----------------------------
       ROUTE
    ----------------------------- */

    .section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .route-fields {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .route-row {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .route-row input {
      flex: 1;
    }

    .remove-stop {
      flex: 0 0 38px;
      width: 38px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0c1016;
      color: #aeb7c2;
      cursor: pointer;
    }

    .remove-stop:hover {
      color: white;
      background: #202733;
    }

    .route-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 9px;
    }

    /* -----------------------------
       SKATEPARK
    ----------------------------- */

    .park-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .park-controls .full {
      grid-column: 1 / -1;
    }

    .status {
      min-height: 19px;
      margin-top: 11px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .status.loading {
      color: #d7dde5;
    }

    .status.error {
      color: #ff8a87;
    }

    .status.success {
      color: #b8e5c0;
    }

    /* -----------------------------
       LEAFLET
    ----------------------------- */

    .leaflet-control-zoom {
      margin-bottom: 18px !important;
      margin-right: 18px !important;
    }

    .leaflet-control-zoom a {
      background: rgba(17,21,29,.95) !important;
      color: white !important;
      border-color: #303845 !important;
    }

    .leaflet-control-layers {
      border-radius: 10px !important;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }

    .route-line {
      color: #111;
      weight: 8;
      opacity: .9;
    }

    .skatepark-marker {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e53935;
      border: 3px solid white;
      box-shadow:
        0 2px 7px rgba(0,0,0,.5),
        0 0 0 1px rgba(0,0,0,.15);
    }

    .skatepark-marker.route {
      background: #e53935;
    }

    .leaflet-popup-content {
      margin: 13px 15px;
      min-width: 180px;
    }

    .popup-title {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: 800;
    }

    .popup-line {
      color: #4f5966;
      font-size: 12px;
      line-height: 1.5;
    }

    .popup-label {
      font-weight: 700;
    }

    /* -----------------------------
       MOBILE
    ----------------------------- */

    @media (max-width: 650px) {
      .map-panel {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        max-height: calc(100vh - 20px);
        border-radius: 15px;
      }

      .panel-inner {
        padding: 14px;
      }

      #openPanelBtn {
        top: 10px;
        left: 10px;
      }

      .search-box {
        flex-direction: column;
      }

      .primary-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <button
    id="openPanelBtn"
    aria-label="Suchpanel öffnen"
    title="Suchpanel öffnen"
  >☰</button>

  <aside id="mapPanel" class="map-panel">
    <div class="panel-inner">

      <div class="panel-title-row">
        <div>
          <div class="panel-title">MOI-CY Karte</div>
          <div class="panel-subtitle">
            Orte, Routen & Skateparks
          </div>
        </div>

        <button
          id="closePanelBtn"
          class="icon-btn"
          aria-label="Panel schließen"
          title="Panel schließen"
        >×</button>
      </div>

      <!-- EINHEITLICHE SUCHE -->
      <div class="search-box">
        <input
          id="mainSearch"
          type="text"
          autocomplete="off"
          placeholder="Ort oder Route, z. B. Karlsruhe → Stuttgart → München"
        >

        <button
          id="mainSearchBtn"
          class="primary-btn"
          type="button"
        >Suchen</button>
      </div>

      <p class="hint">
        Einen Ort suchen = Karte zentrieren.
        Mehrere Orte mit „→“ = Route berechnen.
        Skateparks werden dabei nicht automatisch geladen.
      </p>

      <!-- ROUTE -->
      <section class="section">

        <div class="section-header">
          <div class="section-title">Route</div>
        </div>

        <div id="routeFields" class="route-fields"></div>

        <div class="route-actions">
          <button
            id="addStopBtn"
            class="secondary-btn"
            type="button"
          >+ Zwischenstopp hinzufügen</button>

          <button
            id="calculateRouteBtn"
            class="primary-btn"
            type="button"
          >Route berechnen</button>
        </div>

      </section>

      <!-- SKATEPARKS -->
      <section class="section">

        <div class="section-header">
          <div class="section-title">Skateparks</div>
        </div>

        <div class="park-controls">

          <select id="radiusSelect">
            <option value="5">5 km</option>
            <option value="10" selected>10 km</option>
            <option value="25">25 km</option>
            <option value="50">50 km</option>
          </select>

          <button
            id="localParksBtn"
            class="secondary-btn"
            type="button"
          >Um aktuellen Ort suchen</button>

          <button
            id="routeParksBtn"
            class="primary-btn full"
            type="button"
          >SKATEPARKS ENTLANG DER ROUTE</button>

          <button
            id="clearParksBtn"
            class="danger-btn full"
            type="button"
          >Skateparks entfernen</button>

        </div>

      </section>

      <div id="status" class="status"></div>

    </div>
  </aside>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    "use strict";

    /* =========================================================
       KONFIGURATION
    ========================================================= */

    const DEFAULT_CENTER = [49.0069, 8.4037];
    const DEFAULT_ZOOM = 12;

    const MAP_BOUNDS = L.latLngBounds(
      [-85.05112878, -180],
      [85.05112878, 180]
    );

    const NOMINATIM_URL =
      "https://nominatim.openstreetmap.org/search";

    const PHOTON_URL =
      "https://photon.komoot.io/api/";

    const OSRM_URLS = [
      "https://router.project-osrm.org/route/v1/driving/"
    ];

    const OVERPASS_URLS = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter"
    ];

    const NOMINATIM_TIMEOUT = 8000;
    const PHOTON_TIMEOUT = 8000;
    const OSRM_TIMEOUT = 9000;

    /*
      WICHTIG:

      Für Skateparks gilt ab jetzt ein globales Limit
      von ungefähr 10 Sekunden.

      Einzelne Teilabfragen dürfen früher abbrechen,
      damit eine kaputte Overpass-Teilabfrage nicht
      die komplette Routensuche blockiert.
    */
    const PARK_GLOBAL_TIMEOUT = 10000;
    const PARK_REQUEST_TIMEOUT = 6500;

    const MAX_PARKS = 15;

    /*
      Route wird nicht mehr als eine riesige BBox abgefragt.

      Kleine Routen -> eine kompakte BBox.
      Lange Routen -> mehrere Abschnitte.
    */
    const ROUTE_CHUNK_KM = 90;
    const ROUTE_MAX_CHUNKS = 12;
    const ROUTE_QUERY_CONCURRENCY = 4;

    const CACHE_PREFIX = "moi_cy_map_v4_";
    const CACHE_TTL = 1000 * 60 * 60 * 24 * 7;

    /* =========================================================
       MAP
    ========================================================= */

    const map = L.map("map", {
      center: DEFAULT_CENTER,
      zoom: DEFAULT_ZOOM,
      minZoom: 2,
      maxZoom: 18,
      maxBounds: MAP_BOUNDS,
      maxBoundsViscosity: 1.0,
      worldCopyJump: false,
      zoomControl: true,
      preferCanvas: true
    });

    const streetLayer = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap-Mitwirkende"
      }
    ).addTo(map);

    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution:
          "Tiles &copy; Esri"
      }
    );

    L.control.layers(
      {
        "Karte": streetLayer,
        "Satellit": satelliteLayer
      },
      null,
      {
        position: "topright"
      }
    ).addTo(map);

    /* =========================================================
       LAYER
    ========================================================= */

    const parkLayer = L.layerGroup().addTo(map);

    let routeLayer = null;
    let currentRoute = null;
    let currentRouteStops = [];
    let currentRouteDistanceKm = 0;

    /* =========================================================
       DOM
    ========================================================= */

    const panel = document.getElementById("mapPanel");
    const openPanelBtn = document.getElementById("openPanelBtn");
    const closePanelBtn = document.getElementById("closePanelBtn");

    const mainSearch = document.getElementById("mainSearch");
    const mainSearchBtn = document.getElementById("mainSearchBtn");

    const routeFields = document.getElementById("routeFields");
    const addStopBtn = document.getElementById("addStopBtn");
    const calculateRouteBtn = document.getElementById("calculateRouteBtn");

    const radiusSelect = document.getElementById("radiusSelect");
    const localParksBtn = document.getElementById("localParksBtn");
    const routeParksBtn = document.getElementById("routeParksBtn");
    const clearParksBtn = document.getElementById("clearParksBtn");

    const statusBox = document.getElementById("status");

    /* =========================================================
       STATUS
    ========================================================= */

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "status" + (type ? " " + type : "");
    }

    /* =========================================================
       PANEL
    ========================================================= */

    closePanelBtn.addEventListener("click", () => {
      panel.classList.add("collapsed");
      openPanelBtn.classList.add("visible");
    });

    openPanelBtn.addEventListener("click", () => {
      panel.classList.remove("collapsed");
      openPanelBtn.classList.remove("visible");
    });

    /* =========================================================
       CACHE
    ========================================================= */

    function cacheGet(key) {
      try {
        const raw = localStorage.getItem(CACHE_PREFIX + key);

        if (!raw) {
          return null;
        }

        const parsed = JSON.parse(raw);

        if (!parsed || !parsed.time) {
          return null;
        }

        if (Date.now() - parsed.time > CACHE_TTL) {
          localStorage.removeItem(CACHE_PREFIX + key);
          return null;
        }

        return parsed.data;
      } catch {
        return null;
      }
    }

    function cacheSet(key, data) {
      try {
        localStorage.setItem(
          CACHE_PREFIX + key,
          JSON.stringify({
            time: Date.now(),
            data
          })
        );
      } catch {
        /* Cache ist nur Zusatzfunktion. */
      }
    }

    /* =========================================================
       ABORT / FETCH
    ========================================================= */

    async function fetchWithTimeout(
      url,
      options = {},
      timeoutMs = 8000,
      externalSignal = null
    ) {
      const controller = new AbortController();

      const timeout = setTimeout(() => {
        controller.abort();
      }, timeoutMs);

      let externalAbortHandler = null;

      if (externalSignal) {
        if (externalSignal.aborted) {
          controller.abort();
        } else {
          externalAbortHandler = () => controller.abort();
          externalSignal.addEventListener(
            "abort",
            externalAbortHandler,
            { once: true }
          );
        }
      }

      try {
        const response = await fetch(url, {
          ...options,
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        return response;
      } finally {
        clearTimeout(timeout);

        if (
          externalSignal &&
          externalAbortHandler
        ) {
          externalSignal.removeEventListener(
            "abort",
            externalAbortHandler
          );
        }
      }
    }

    /* =========================================================
       NORMALIZE
    ========================================================= */

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ß/g, "ss")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function transliterateGerman(value) {
      return String(value || "")
        .replace(/ä/gi, "ae")
        .replace(/ö/gi, "oe")
        .replace(/ü/gi, "ue")
        .replace(/ß/gi, "ss");
    }

    /* =========================================================
       DISTANZ
    ========================================================= */

    function haversineKm(a, b) {
      const R = 6371;

      const lat1 = a[0] * Math.PI / 180;
      const lat2 = b[0] * Math.PI / 180;

      const dLat =
        (b[0] - a[0]) * Math.PI / 180;

      const dLon =
        (b[1] - a[1]) * Math.PI / 180;

      const x =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(dLon / 2) ** 2;

      return (
        2 *
        R *
        Math.atan2(
          Math.sqrt(x),
          Math.sqrt(1 - x)
        )
      );
    }

    function pointSegmentDistanceKm(
      point,
      a,
      b
    ) {
      /*
        Lokale equirectangular Projektion.
        Für kurze Segmente völlig ausreichend.
      */

      const latRad =
        point[0] * Math.PI / 180;

      const kx =
        111.320 * Math.cos(latRad);

      const ky = 110.574;

      const px = point[1] * kx;
      const py = point[0] * ky;

      const ax = a[1] * kx;
      const ay = a[0] * ky;

      const bx = b[1] * kx;
      const by = b[0] * ky;

      const dx = bx - ax;
      const dy = by - ay;

      if (dx === 0 && dy === 0) {
        return Math.hypot(
          px - ax,
          py - ay
        );
      }

      const t = Math.max(
        0,
        Math.min(
          1,
          (
            (px - ax) * dx +
            (py - ay) * dy
          ) /
          (dx * dx + dy * dy)
        )
      );

      const cx = ax + t * dx;
      const cy = ay + t * dy;

      return Math.hypot(
        px - cx,
        py - cy
      );
    }

    function distanceToPolylineKm(
      point,
      polyline
    ) {
      let best = Infinity;

      for (
        let i = 0;
        i < polyline.length - 1;
        i++
      ) {
        const d = pointSegmentDistanceKm(
          point,
          polyline[i],
          polyline[i + 1]
        );

        if (d < best) {
          best = d;
        }
      }

      return best;
    }

    /* =========================================================
       BBOX
    ========================================================= */

    function bboxFromCenter(
      lat,
      lon,
      radiusKm
    ) {
      const latDelta =
        radiusKm / 110.574;

      const lonDelta =
        radiusKm /
        (
          111.320 *
          Math.cos(lat * Math.PI / 180)
        );

      return {
        south: lat - latDelta,
        west: lon - lonDelta,
        north: lat + latDelta,
        east: lon + lonDelta
      };
    }

    function bboxFromPoints(
      points,
      paddingKm
    ) {
      let south = Infinity;
      let west = Infinity;
      let north = -Infinity;
      let east = -Infinity;

      for (const p of points) {
        south = Math.min(south, p[0]);
        west = Math.min(west, p[1]);
        north = Math.max(north, p[0]);
        east = Math.max(east, p[1]);
      }

      const centerLat =
        (south + north) / 2;

      const latPad =
        paddingKm / 110.574;

      const lonPad =
        paddingKm /
        (
          111.320 *
          Math.cos(centerLat * Math.PI / 180)
        );

      return {
        south: south - latPad,
        west: west - lonPad,
        north: north + latPad,
        east: east + lonPad
      };
    }

    function bboxKey(bbox) {
      return [
        bbox.south.toFixed(3),
        bbox.west.toFixed(3),
        bbox.north.toFixed(3),
        bbox.east.toFixed(3)
      ].join("_");
    }

    /* =========================================================
       GEOCODING
    ========================================================= */

    async function geocodeNominatim(query) {
      const params = new URLSearchParams({
        q: query,
        format: "jsonv2",
        addressdetails: "1",
        limit: "5",
        dedupe: "1",
        "accept-language": "de"
      });

      const response = await fetchWithTimeout(
        NOMINATIM_URL + "?" + params.toString(),
        {
          headers: {
            "Accept": "application/json"
          }
        },
        NOMINATIM_TIMEOUT
      );

      return response.json();
    }

    async function geocodePhoton(query) {
      const params = new URLSearchParams({
        q: query,
        limit: "5",
        lang: "de"
      });

      const response = await fetchWithTimeout(
        PHOTON_URL + "?" + params.toString(),
        {
          headers: {
            "Accept": "application/json"
          }
        },
        PHOTON_TIMEOUT
      );

      const data = await response.json();

      return (data.features || []).map(feature => {
        const coords =
          feature.geometry?.coordinates || [];

        const props =
          feature.properties || {};

        return {
          lat: Number(coords[1]),
          lon: Number(coords[0]),
          display_name:
            [
              props.name,
              props.city,
              props.state,
              props.country
            ]
              .filter(Boolean)
              .join(", ")
        };
      });
    }

    function scoreGeocodeResult(
      query,
      result
    ) {
      const q =
        normalizeText(query);

      const text =
        normalizeText(
          result.display_name || ""
        );

      if (!q || !text) {
        return 0;
      }

      const words =
        q.split(" ").filter(Boolean);

      let score = 0;

      for (const word of words) {
        if (text.includes(word)) {
          score += 10;
        }
      }

      if (
        text.startsWith(q) ||
        text.includes(q)
      ) {
        score += 20;
      }

      return score;
    }

    async function geocode(query) {
      const clean =
        String(query || "").trim();

      if (!clean) {
        throw new Error(
          "Leerer Ort."
        );
      }

      const cacheKey =
        "geo_" +
        normalizeText(clean);

      const cached =
        cacheGet(cacheKey);

      if (cached) {
        return cached;
      }

      const queries = [
        clean,
        transliterateGerman(clean)
      ];

      const uniqueQueries =
        [...new Set(
          queries.filter(Boolean)
        )];

      let results = [];

      for (const q of uniqueQueries) {
        try {
          const data =
            await geocodeNominatim(q);

          results.push(
            ...(data || [])
          );

          if (results.length >= 5) {
            break;
          }
        } catch {
          /* nächster Fallback */
        }
      }

      if (!results.length) {
        for (const q of uniqueQueries) {
          try {
            const data =
              await geocodePhoton(q);

            results.push(
              ...(data || [])
            );

            if (results.length) {
              break;
            }
          } catch {
            /* nächster Versuch */
          }
        }
      }

      if (!results.length) {
        throw new Error(
          "Ort konnte nicht gefunden werden."
        );
      }

      results.sort(
        (a, b) =>
          scoreGeocodeResult(clean, b) -
          scoreGeocodeResult(clean, a)
      );

      const best = {
        lat: Number(results[0].lat),
        lon: Number(results[0].lon),
        displayName:
          results[0].display_name || clean
      };

      if (
        !Number.isFinite(best.lat) ||
        !Number.isFinite(best.lon)
      ) {
        throw new Error(
          "Ungültige Ortskoordinaten."
        );
      }

      cacheSet(
        cacheKey,
        best
      );

      return best;
    }

    function createRouteField(

    function setRouteFromMainSearch(
      query
    ) {
      const parts =
        query
          .split(/→|->|—|–/)
          .map(s => s.trim())
          .filter(Boolean);

      if (parts.length < 2) {
        return false;
      }

      routeFields.innerHTML = "";

      parts.forEach(
        (part, index) => {
          createRouteField(
            part,
            index > 0
          );
        }
      );

      return true;

    /* =========================================================
       OSRM ROUTING
    ========================================================= */

    async function requestRoute(
      locations
    ) {
      const coords =
        locations
          .map(
            p =>
              `${p.lon},${p.lat}`
          )
          .join(";");

      let lastError = null;

      for (const base of OSRM_URLS) {
        try {
          const url =
            base +
            coords +
            "?overview=full" +
            "&geometries=geojson" +
            "&steps=false";

          const response =
            await fetchWithTimeout(
              url,
              {
                headers: {
                  "Accept":
                    "application/json"
                }
              },
              OSRM_TIMEOUT
            );

          const data =
            await response.json();

          if (
            data.code !== "Ok" ||
            !data.routes?.length
          ) {
            throw new Error(
              data.message ||
              "Keine Route gefunden."
            );
          }

          return data.routes[0];

        } catch (error) {
          lastError = error;
        }
      }

      throw (
        lastError ||
        new Error(
          "Routenserver nicht erreichbar."
        )
      );
    }

    function geometryToLatLngs(
      geometry
    ) {
      return geometry.coordinates.map(
        coord => [
          coord[1],
          coord[0]
        ]
      );
    }

    /* =========================================================
       ROUTE SEGMENTE
    ========================================================= */

    function buildRouteChunks(
      polyline,
      radiusKm
    ) {
      if (polyline.length < 2) {
        return [];
      }

      const cumulative = [0];

      for (
        let i = 1;
        i < polyline.length;
        i++
      ) {
        cumulative[i] =
          cumulative[i - 1] +
          haversineKm(
            polyline[i - 1],
            polyline[i]
          );
      }

      const total =
        cumulative[
          cumulative.length - 1
        ];

      /*
        Kurze Route:
        Eine einzige, relativ kompakte BBox.
      */
      const wholeBox =
        bboxFromPoints(
          polyline,
          radiusKm
        );

      const widthKm =
        haversineKm(
          [
            wholeBox.south,
            wholeBox.west
          ],
          [
            wholeBox.south,
            wholeBox.east
          ]
        );

      const heightKm =
        haversineKm(
          [
            wholeBox.south,
            wholeBox.west
          ],
          [
            wholeBox.north,
            wholeBox.west
          ]
        );

      if (
        total <= 180 &&
        widthKm <= 300 &&
        heightKm <= 300
      ) {
        return [
          {
            startKm: 0,
            endKm: total,
            points: polyline,
            bbox: wholeBox
          }
        ];
      }

      /*
        Lange Route:
        Abschnitte.
      */

      let chunkKm =
        Math.max(
          60,
          Math.min(
            ROUTE_CHUNK_KM,
            total / ROUTE_MAX_CHUNKS
          )
        );

      /*
        Für mittlere Routen nicht unnötig
        viele Abfragen erzeugen.
      */
      const count =
        Math.ceil(total / chunkKm);

      if (count > ROUTE_MAX_CHUNKS) {
        chunkKm =
          total / ROUTE_MAX_CHUNKS;
      }

      const chunks = [];

      for (
        let start = 0;
        start < total;
        start += chunkKm
      ) {
        const end =
          Math.min(
            total,
            start + chunkKm
          );

        const points = [];

        for (
          let i = 0;
          i < polyline.length;
          i++
        ) {
          if (
            cumulative[i] >= start &&
            cumulative[i] <= end
          ) {
            points.push(
              polyline[i]
            );
          }
        }

        /*
          Randpunkte ergänzen, damit die
          Geometrie nicht durch Punkt-Sampling
          Löcher bekommt.
        */
        let nearestStart = 0;
        let nearestEnd =
          polyline.length - 1;

        for (
          let i = 0;
          i < cumulative.length;
          i++
        ) {
          if (
            cumulative[i] < start
          ) {
            nearestStart = i;
          }

          if (
            cumulative[i] >= end
          ) {
            nearestEnd = i;
            break;
          }
        }

        if (
          polyline[nearestStart] &&
          !points.includes(
            polyline[nearestStart]
          )
        ) {
          points.unshift(
            polyline[nearestStart]
          );
        }

        if (
          polyline[nearestEnd] &&
          !points.includes(
            polyline[nearestEnd]
          )
        ) {
          points.push(
            polyline[nearestEnd]
          );
        }

        if (points.length < 2) {
          continue;
        }

        chunks.push({
          startKm: start,
          endKm: end,
          points,
          bbox:
            bboxFromPoints(
              points,
              radiusKm
            )
        });
      }

      return chunks;
    }

    /* =========================================================
       OVERPASS QUERY
    ========================================================= */

    function overpassQueryForBbox(
      bbox
    ) {
      const b =
        [
          bbox.south,
          bbox.west,
          bbox.north,
          bbox.east
        ].join(",");

      /*
        WICHTIG:

        1. leisure=skatepark
        2. sport=skateboard
        3. Name mit skate/skater

        Damit finden wir auch Anlagen wie
        Daxlanden, die nicht zwingend
        leisure=skatepark tragen.
      */

      return `
[out:json][timeout:8];

(
  nwr["leisure"="skatepark"](${b});
  nwr["sport"="skateboard"](${b});
  nwr["name"~"skate|skater",i](${b});
);

out center tags;
      `.trim();
    }

    async function queryOverpass(
      bbox,
      signal
    ) {
      const key =
        "parks_" +
        bboxKey(bbox);

      const cached =
        cacheGet(key);

      if (cached) {
        return cached;
      }

      const query =
        overpassQueryForBbox(bbox);

      let lastError = null;

      /*
        Primärserver zuerst.
        Wenn er fehlschlägt, wird der zweite
        Server versucht.
      */

      for (
        const endpoint of OVERPASS_URLS
      ) {
        try {
          const response =
            await fetchWithTimeout(
              endpoint,
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/x-www-form-urlencoded;charset=UTF-8"
                },
                body:
                  "data=" +
                  encodeURIComponent(query)
              },
              PARK_REQUEST_TIMEOUT,
              signal
            );

          const data =
            await response.json();

          if (
            !Array.isArray(
              data.elements
            )
          ) {
            throw new Error(
              "Ungültige Overpass-Antwort."
            );
          }

          cacheSet(
            key,
            data.elements
          );

          return data.elements;

        } catch (error) {
          lastError = error;
        }
      }

      throw (
        lastError ||
        new Error(
          "Overpass nicht erreichbar."
        )
      );
    }

    /* =========================================================
       SKATEPARK FILTER
    ========================================================= */

    const HARD_BAD_WORDS = [
      "spielplatz",
      "kinderspielplatz",
      "minigolf",
      "bolzplatz",
      "fussballplatz",
      "fußballplatz",
      "soccerplatz",
      "basketballplatz",
      "volleyballplatz",
      "fitnessparcours",
      "fitness parcourt",
      "fitness",
      "kletterpark",
      "waldspielplatz"
    ];

    const SOFT_BAD_WORDS = [
      "pumptrack",
      "bmx"
    ];

    const SKATE_WORDS = [
      "skatepark",
      "skate park",
      "skaterpark",
      "skater park",
      "skateanlage",
      "skate anlage",
      "skateplatz",
      "skate platz",
      "skaterplatz",
      "skaterplatz",
      "skatehalle",
      "skate halle",
      "skate",
      "skater",
      "rollbrett"
    ];

    function parkText(tags) {
      return normalizeText(
        [
          tags.name,
          tags.description,
          tags.note,
          tags.operator,
          tags["sport:name"]
        ]
          .filter(Boolean)
          .join(" ")
      );
    }

    function isLikelySkatepark(
      tags
    ) {
      tags = tags || {};

      const leisure =
        normalizeText(
          tags.leisure
        );

      const sport =
        normalizeText(
          tags.sport
        );

      const text =
        parkText(tags);

      const explicitLeisure =
        leisure === "skatepark";

      const explicitSport =
        sport
          .split(";")
          .map(s => s.trim())
          .includes("skateboard");

      const explicitName =
        SKATE_WORDS.some(
          word =>
            text.includes(
              normalizeText(word)
            )
        );

      /*
        HARTE Ausschlüsse.

        ABER:
        Wenn OSM explizit sport=skateboard
        oder leisure=skatepark sagt, behalten
        wir die Anlage.

        Dadurch werden echte Skateparks mit
        "BMX", "Spielplatz" etc. in der
        Beschreibung nicht versehentlich gelöscht.
      */
      const hardBad =
        HARD_BAD_WORDS.some(
          word =>
            text.includes(
              normalizeText(word)
            )
        );

      if (
        hardBad &&
        !explicitLeisure &&
        !explicitSport &&
        !explicitName
      ) {
        return false;
      }

      if (explicitLeisure) {
        return true;
      }

      /*
        Das ist die entscheidende Änderung:
        sport=skateboard zählt jetzt direkt.
      */
      if (explicitSport) {
        return true;
      }

      if (explicitName) {
        /*
          Ein reiner "Pumptrack"-Name wird
          nicht automatisch als Skatepark
          akzeptiert.
        */
        const onlySoftBad =
          SOFT_BAD_WORDS.some(
            word =>
              text.includes(
                normalizeText(word)
              )
          );

        if (
          onlySoftBad &&
          !text.includes("skate")
        ) {
          return false;
        }

        return true;
      }

      return false;
    }

    /* =========================================================
       PARK NORMALISIEREN
    ========================================================= */

    function getElementCenter(
      element
    ) {
      if (
        element.center &&
        Number.isFinite(
          Number(element.center.lat)
        ) &&
        Number.isFinite(
          Number(element.center.lon)
        )
      ) {
        return [
          Number(element.center.lat),
          Number(element.center.lon)
        ];
      }

      if (
        Number.isFinite(
          Number(element.lat)
        ) &&
        Number.isFinite(
          Number(element.lon)
        )
      ) {
        return [
          Number(element.lat),
          Number(element.lon)
        ];
      }

      return null;
    }

    function normalizePark(
      element
    ) {
      const tags =
        element.tags || {};

      const center =
        getElementCenter(element);

      if (!center) {
        return null;
      }

      if (
        !isLikelySkatepark(tags)
      ) {
        return null;
      }

      return {
        key:
          element.type +
          "/" +
          element.id,

        osmType:
          element.type,

        osmId:
          element.id,

        lat:
          center[0],

        lon:
          center[1],

        name:
          tags.name ||
          tags["name:de"] ||
          "Skatepark",

        tags,

        areaM2:
          null,

        distanceKm:
          null,

        routeDistanceKm:
          null,

        routeProgressKm:
          null
      };
    }

    /* =========================================================
       DEDUP
    ========================================================= */

    function dedupeParks(
      parks
    ) {
      const byId =
        new Map();

      for (const park of parks) {
        if (!byId.has(park.key)) {
          byId.set(
            park.key,
            park
          );
        }
      }

      /*
        Zusätzlich nahe Dubletten entfernen,
        wenn OSM dasselbe Objekt über Name/Quelle
        mehrfach geliefert hat.
      */
      const result = [];

      for (const park of byId.values()) {
        const same =
          result.find(existing => {
            if (
              normalizeText(
                existing.name
              ) !==
              normalizeText(
                park.name
              )
            ) {
              return false;
            }

            return (
              haversineKm(
                [existing.lat, existing.lon],
                [park.lat, park.lon]
              ) < 0.05
            );
          });

        if (!same) {
          result.push(park);
        }
      }

      return result;
    }

    /* =========================================================
       POPUP
    ========================================================= */

    function formatKm(
      km
    ) {
      if (
        !Number.isFinite(km)
      ) {
        return "—";
      }

      if (km < 1) {
        return (
          Math.round(km * 1000) +
          " m"
        );
      }

      return (
        km.toFixed(1) +
        " km"
      );
    }

    function formatArea(
      m2
    ) {
      if (
        !Number.isFinite(m2) ||
        m2 <= 0
      ) {
        return "nicht angegeben";
      }

      if (m2 >= 10000) {
        return (
          (m2 / 10000).toFixed(2) +
          " ha geschätzt"
        );
      }

      return (
        Math.round(m2).toLocaleString(
          "de-DE"
        ) +
        " m² geschätzt"
      );
    }

    function lightingText(
      tags
    ) {
      const lit =
        normalizeText(
          tags?.lit
        );

      if (
        lit === "yes" ||
        lit === "true"
      ) {
        return "vorhanden";
      }

      if (
        lit === "no" ||
        lit === "false"
      ) {
        return "nein";
      }

      return "nicht angegeben";
    }

    function surfaceText(
      tags
    ) {
      if (!tags?.surface) {
        return "nicht angegeben";
      }

      return String(
        tags.surface
      )
        .replace(/_/g, " ");
    }

    function popupHtml(
      park
    ) {
      return `
        <div class="popup-title">
          ${escapeHtml(park.name)}
        </div>

        <div class="popup-line">
          <span class="popup-label">Entfernung:</span>
          ${formatKm(
            park.distanceKm ??
            park.routeDistanceKm
          )}
        </div>

        <div class="popup-line">
          <span class="popup-label">Größe:</span>
          ${formatArea(
            park.areaM2
          )}
        </div>

        <div class="popup-line">
          <span class="popup-label">Beleuchtung:</span>
          ${escapeHtml(
            lightingText(
              park.tags
            )
          )}
        </div>

        <div class="popup-line">
          <span class="popup-label">Belag:</span>
          ${escapeHtml(
            surfaceText(
              park.tags
            )
          )}
        </div>
      `;
    }

    function escapeHtml(
      value
    ) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* =========================================================
       PARK MARKER
    ========================================================= */

    function parkIcon(
      route = false
    ) {
      return L.divIcon({
        className: "",
        html:
          `<div class="skatepark-marker${route ? " route" : ""}"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9],
        popupAnchor: [0, -9]
      });
    }

    function renderParks(
      parks,
      route = false
    ) {
      parkLayer.clearLayers();

      for (const park of parks) {

    /* =========================================================
       GEOMETRIE / FLÄCHE
    ========================================================= */

    function projectPoint(
      lat,
      lon,
      refLat
    ) {
      const x =
        lon *
        111320 *
        Math.cos(
          refLat *
          Math.PI /
          180
        );

      const y =
        lat *
        110574;

      return [x, y];
    }

    function polygonArea(
      coords
    ) {
      if (
        !Array.isArray(coords) ||
        coords.length < 3
      ) {
        return 0;
      }

      const refLat =
        coords.reduce(
          (sum, p) =>
            sum + p[0],
          0
        ) /
        coords.length;

      const points =
        coords.map(
          p =>
            projectPoint(
              p[0],
              p[1],
              refLat
            )
        );

      let area = 0;

      for (
        let i = 0;
        i < points.length;
        i++
      ) {
        const j =
          (i + 1) %
          points.length;

        area +=
          points[i][0] *
          points[j][1] -
          points[j][0] *
          points[i][1];
      }

      return Math.abs(
        area / 2
      );
    }

    function estimateAreaFromGeometry(
      element
    ) {
      if (
        element.type !== "way" ||
        !Array.isArray(
          element.geometry
        ) ||
        element.geometry.length < 3
      ) {
        return null;
      }

      const coords =
        element.geometry
          .map(
            p => [
              Number(p.lat),
              Number(p.lon)
            ]
          )
          .filter(
            p =>
              Number.isFinite(p[0]) &&
              Number.isFinite(p[1])
          );

      if (
        coords.length < 3
      ) {
        return null;
      }

      /*
        Nur geschlossene Flächen.
      */
      const first =
        coords[0];

      const last =
        coords[
          coords.length - 1
        ];

      if (
        haversineKm(
          first,
          last
        ) > 0.02
      ) {
        return null;
      }

      const area =
        polygonArea(coords);

      if (
        area < 10 ||
        area > 500000
      ) {
        return null;
      }

      return area;
    }

    async function enrichParkGeometry(
      parks
    ) {
      const ways =
        parks.filter(
          park =>
            park.osmType === "way"
        );

      if (!ways.length) {
        return;
      }

      const ids =
        ways
          .slice(0, MAX_PARKS)
          .map(
            park =>
              park.osmId
          );

      const query = `
[out:json][timeout:5];
way(id:${ids.join(",")});
out geom tags;
      `.trim();

      let data = null;

      for (
        const endpoint of OVERPASS_URLS
      ) {
        try {
          const response =
            await fetchWithTimeout(
              endpoint,
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/x-www-form-urlencoded;charset=UTF-8"
                },
                body:
                  "data=" +
                  encodeURIComponent(query)
              },
              4500
            );

          data =
            await response.json();

          break;
        } catch {
          /* nächster Server */
        }
      }

      if (!data) {
        return;
      }

      const byId =
        new Map(
          (data.elements || [])
            .map(
              element =>
                [
                  element.id,
                  element
                ]
            )
        );

      for (const park of parks) {
        const element =
          byId.get(
            park.osmId
          );

        if (!element) {
          continue;
        }

        const area =
          estimateAreaFromGeometry(
            element
          );

        if (
          Number.isFinite(area)
        ) {
          park.areaM2 = area;
        }
      }
    }

    /* =========================================================
       LOKALE PARKSUCHE
    ========================================================= */

    async function searchLocalParks() {
      const center =
        map.getCenter();

      const radiusKm =
        Number(
          radiusSelect.value
        );

      const bbox =
        bboxFromCenter(
          center.lat,
          center.lng,
          radiusKm
        );

      setStatus(
        `Suche Skateparks im Umkreis von ${radiusKm} km …`,
        "loading"
      );

      const controller =
        new AbortController();

      const timer =
        setTimeout(
          () =>
            controller.abort(),
          PARK_GLOBAL_TIMEOUT
        );

      try {
        const elements =
          await queryOverpass(
            bbox,
            controller.signal
          );

        let parks =
          elements
            .map(normalizePark)
            .filter(Boolean);

        parks =
          dedupeParks(parks);

        parks =
          parks.filter(
            park =>
              haversineKm(
                [
                  center.lat,
                  center.lng
                ],
                [
                  park.lat,
                  park.lon
                ]
              ) <= radiusKm
          );

        for (const park of parks) {
          park.distanceKm =
            haversineKm(
              [
                center.lat,
                center.lng
              ],
              [
                park.lat,
                park.lon
              ]
            );
        }

        /*
          Primär nach Entfernung.
          Größe wird als zweites Kriterium
          verwendet, sobald sie bekannt ist.
        */
        parks.sort(
          (a, b) => {
            const distanceDiff =
              a.distanceKm -
              b.distanceKm;

            if (
              Math.abs(distanceDiff) > 0.5
            ) {
              return distanceDiff;
            }

            return (
              (b.areaM2 || 0) -
              (a.areaM2 || 0)
            );
          }
        );

        const total =
          parks.length;

        parks =
          parks.slice(
            0,
            MAX_PARKS
          );

        renderParks(
          parks,
          false
        );

        if (parks.length) {
          setStatus(
            `${parks.length}${total > MAX_PARKS ? " von " + total : ""} Skateparks gefunden.`,
            "success"
          );
        } else {
          setStatus(
            "Keine Skateparks im gewählten Radius gefunden.",
            "error"
          );
        }

        /*
          Geometrie erst NACH der schnellen
          Ergebnisausgabe nachladen.
        */
        enrichParkGeometry(
          parks
        ).then(() => {
          renderParks(
            parks,
            false
          );
        });

      } catch (error) {
        if (
          error?.name === "AbortError"
        ) {
          setStatus(
            "Die Skatepark-Suche hat länger als 10 Sekunden gedauert. Bitte erneut versuchen.",
            "error"
          );
        } else {
          setStatus(
            "Skateparks konnten nicht geladen werden. Bitte erneut versuchen.",
            "error"
          );
        }
      } finally {
        clearTimeout(timer);
      }
    }

    /* =========================================================
       ROUTE PARKS
    ========================================================= */

    async function searchRouteParks() {
      if (
        !currentRoute ||
        !currentRoute.geometry
      ) {
        setStatus(
          "Bitte zuerst eine Route berechnen.",
          "error"
        );

        return;
      }

      const radiusKm =
        Number(
          radiusSelect.value
        );

      const polyline =
        geometryToLatLngs(
          currentRoute.geometry
        );

      if (
        polyline.length < 2
      ) {
        setStatus(
          "Die Route enthält keine verwertbare Geometrie.",
          "error"
        );

        return;
      }

      setStatus(
        "Suche Skateparks entlang der Route …",
        "loading"
      );

      const globalController =
        new AbortController();

      const globalTimer =
        setTimeout(
          () =>
            globalController.abort(),
          PARK_GLOBAL_TIMEOUT
        );

      try {
        const chunks =
          buildRouteChunks(
            polyline,
            radiusKm
          );

        if (!chunks.length) {
          throw new Error(
            "Keine Routensegmente."
          );
        }

        let completed = 0;

        const allElements = [];

        /*
          Kleine parallele Warteschlange.
          Dadurch werden nicht 20 Overpass-
          Anfragen gleichzeitig rausgehauen.
        */
        let nextIndex = 0;

        async function worker() {
          while (
            nextIndex < chunks.length
          ) {
            if (
              globalController.signal.aborted
            ) {
              return;
            }

            const index =
              nextIndex++;

            const chunk =
              chunks[index];

            try {
              const elements =
                await queryOverpass(
                  chunk.bbox,
                  globalController.signal
                );

              allElements.push(
                ...elements
              );
            } catch {
              /*
                EIN kaputter Abschnitt darf
                die gesamte Route NICHT zerstören.
              */
            }

            completed++;

            if (
              !globalController.signal.aborted
            ) {
              setStatus(
                `Skateparks entlang der Route … ${completed}/${chunks.length} Bereiche geprüft`,
                "loading"
              );
            }
          }
        }

        const workerCount =
          Math.min(
            ROUTE_QUERY_CONCURRENCY,
            chunks.length
          );

        await Promise.all(
          Array.from(
            {
              length:
                workerCount
            },
            () => worker()
          )
        );

        /*
          Wenn wenigstens ein Teil erfolgreich
          war, arbeiten wir mit den Ergebnissen.
        */
        let parks =
          allElements
            .map(normalizePark)
            .filter(Boolean);

        parks =
          dedupeParks(parks);

        if (!parks.length) {
          if (
            globalController.signal.aborted
          ) {
            throw new Error(
              "timeout"
            );
          }

          setStatus(
            "Entlang der Route wurden keine Skateparks gefunden.",
            "error"
          );

          return;
        }

        /*
          Exakte Distanz zur tatsächlichen
          Routengeometrie.
        */
        for (const park of parks) {
          const point = [
            park.lat,
            park.lon
          ];

          park.routeDistanceKm =
            distanceToPolylineKm(
              point,
              polyline
            );

          /*
            Nur Parks innerhalb des gewünschten
            Radius bleiben übrig.
          */
          if (
            park.routeDistanceKm <=
            radiusKm
          ) {
            park.routeProgressKm =
              approximateRouteProgress(
                point,
                polyline,
                currentRouteDistanceKm
              );
          }
        }

        parks =
          parks.filter(
            park =>
              park.routeDistanceKm <=
              radiusKm
          );

        /*
          Nach Fortschritt auf der Route sortieren.
        */
        parks.sort(
          (a, b) =>
            a.routeProgressKm -
            b.routeProgressKm
        );

        /*
          Nicht alle 15 aus demselben
          Streckenabschnitt nehmen.

          Dafür Route in bis zu 15 Bins
          teilen und zunächst einen Park
          je Bin wählen.
        */
        const selected =
          selectDistributedRouteParks(
            parks,
            MAX_PARKS,
            currentRouteDistanceKm
          );

        renderParks(
          selected,
          true
        );

        const failed =
          chunks.length -
          completed;

        let message =
          `${selected.length} Skateparks entlang der Route gefunden.`;

        if (
          failed > 0
        ) {
          message +=
            ` ${failed} Teilbereich(e) konnten nicht geladen werden.`;
        }

        setStatus(
          message,
          "success"
        );

        /*
          Größe nachladen, ohne die
          eigentliche Routensuche zu blockieren.
        */
        enrichParkGeometry(
          selected
        ).then(() => {
          renderParks(
            selected,
            true
          );
        });

      } catch (error) {
        setStatus(
          "Die Skateparks entlang der Route konnten nicht geladen werden. Bitte erneut versuchen.",
          "error"
        );
      } finally {
        clearTimeout(
          globalTimer
        );
      }
    }

    /* =========================================================
       ROUTENPOSITION
    ========================================================= */

    function approximateRouteProgress(
      point,
      polyline,
      totalRouteKm
    ) {
      let bestDistance =
        Infinity;

      let bestProgress =
        0;

      let progress =
        0;

      for (
        let i = 0;
        i < polyline.length - 1;
        i++
      ) {
        const a =
          polyline[i];

        const b =
          polyline[i + 1];

        const segmentKm =
          haversineKm(a, b);

        const d =
          pointSegmentDistanceKm(
            point,
            a,
            b
          );

        if (
          d < bestDistance
        ) {
          bestDistance = d;

          const latRad =
            point[0] *
            Math.PI /
            180;

          const kx =
            111.320 *
            Math.cos(
              latRad
            );

          const ky =
            110.574;

          const px =
            point[1] * kx;

          const py =
            point[0] * ky;

          const ax =
            a[1] * kx;

          const ay =
            a[0] * ky;

          const bx =
            b[1] * kx;

          const by =
            b[0] * ky;

          const dx =
            bx - ax;

          const dy =
            by - ay;

          let t = 0;

          if (
            dx !== 0 ||
            dy !== 0
          ) {
            t =
              Math.max(
                0,
                Math.min(
                  1,
                  (
                    (px - ax) * dx +
                    (py - ay) * dy
                  ) /
                  (
                    dx * dx +
                    dy * dy
                  )
                )
              );
          }

          bestProgress =
            progress +
            segmentKm * t;
        }

        progress +=
          segmentKm;
      }

      return Math.min(
        totalRouteKm,
        bestProgress
      );
    }

    /* =========================================================
       ROUTE PARK AUSWAHL
    ========================================================= */

    function selectDistributedRouteParks(
      parks,
      max,
      totalKm
    ) {
      if (
        parks.length <= max
      ) {
        return parks;
      }

      const selected =
        [];

      const used =
        new Set();

      const bins =
        Math.min(
          max,
          Math.max(
            1,
            Math.ceil(
              totalKm / 40
            )
          )
        );

      /*
        Erst einen Park pro Bereich.
      */
      for (
        let bin = 0;
        bin < bins &&
        selected.length < max;
        bin++
      ) {
        const start =
          (bin / bins) *
          totalKm;

        const end =
          ((bin + 1) / bins) *
          totalKm;

        const candidate =
          parks.find(
            park =>
              !used.has(
                park.key
              ) &&
              park.routeProgressKm >=
                start &&
              park.routeProgressKm <=
                end
          );

        if (candidate) {
          selected.push(
            candidate
          );

          used.add(
            candidate.key
          );
        }
      }

      /*
        Danach auffüllen.
      */
      for (
        const park of parks
      ) {
        if (
          selected.length >= max
        ) {
          break;
        }

        if (
          used.has(
            park.key
          )
        ) {
          continue;
        }

        selected.push(
          park
        );

        used.add(
          park.key
        );
      }

      selected.sort(
        (a, b) =>
          a.routeProgressKm -
          b.routeProgressKm
      );

      return selected;
    }

    /* =========================================================
       ROUTE BERECHNEN
    ========================================================= */

    async function calculateRoute() {
      const inputs =
        getRouteInputs();

      const names =
        inputs
          .map(
            input =>
              input.value.trim()
          )
          .filter(Boolean);

      if (
        names.length < 2
      ) {
        setStatus(
          "Bitte mindestens Start und Ziel eingeben.",
          "error"
        );

        return;
      }

      setStatus(
        "Orte werden gesucht …",
        "loading"
      );

      calculateRouteBtn.disabled =
        true;

      mainSearchBtn.disabled =
        true;

      try {
        const locations = [];

        for (
          let i = 0;
          i < names.length;
          i++
        ) {
          setStatus(
            `Ort ${i + 1} von ${names.length} wird gesucht …`,
            "loading"
          );

          const location =
            await geocode(
              names[i]
            );

          locations.push(
            location
          );
        }

        setStatus(
          "Route wird berechnet …",
          "loading"
        );

        const route =
          await requestRoute(
            locations
          );

        currentRoute =
          route;

        currentRouteStops =
          locations;

        currentRouteDistanceKm =
          Number(
            route.distance || 0
          ) / 1000;

        if (
          routeLayer
        ) {
          map.removeLayer(
            routeLayer
          );
        }

        routeLayer =
          L.geoJSON(
            route.geometry,
            {
              style: {
                color: "#111111",
                weight: 8,
                opacity: .88
              }
            }
          ).addTo(map);

        const bounds =
          routeLayer.getBounds();

        if (
          bounds.isValid()
        ) {
          map.fitBounds(
            bounds.pad(0.08)
          );
        }

        setStatus(
          `Route gefunden: ${currentRouteDistanceKm.toFixed(1)} km.`,
          "success"
        );

      } catch (error) {
        currentRoute = null;
        currentRouteStops = [];
        currentRouteDistanceKm = 0;

        setStatus(
          "Die Route konnte nicht berechnet werden. Bitte Orte prüfen oder erneut versuchen.",
          "error"
        );

      } finally {
        calculateRouteBtn.disabled =
          false;

        mainSearchBtn.disabled =
          false;
      }
    }

    /* =========================================================
       HAUPTSUCHE
    ========================================================= */

    async function mainSearchAction() {
      const query =
        mainSearch.value.trim();

      if (!query) {
        return;
      }

      /*
        Route erkennen.
      */
      if (
        /→|->|—|–/.test(query)
      ) {
        const success =
          setRouteFromMainSearch(
            query
          );

        if (success) {
          await calculateRoute();
          return;
        }
      }

      /*
        Normale Ortssuche:
        Nur zentrieren.
        KEINE Skateparks automatisch suchen.
      */
      setStatus(
        "Ort wird gesucht …",
        "loading"
      );

      mainSearchBtn.disabled =
        true;

      try {
        const location =
          await geocode(
            query
          );

        map.setView(
          [
            location.lat,
            location.lon
          ],
          13
        );

        setStatus(
          location.displayName ||
          "Ort gefunden.",
          "success"
        );

      } catch {
        setStatus(
          "Ort konnte nicht gefunden werden.",
          "error"
        );
      } finally {
        mainSearchBtn.disabled =
          false;
      }
    }

    /* =========================================================
       EVENTS
    ========================================================= */

    mainSearchBtn.addEventListener(
      "click",
      mainSearchAction
    );

    mainSearch.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter"
        ) {
          event.preventDefault();
          mainSearchAction();
        }
      }
    );

    addStopBtn.addEventListener(
      "click",
      () => {
        createRouteField(
          "",
          true
        );
      }
    );

    calculateRouteBtn.addEventListener(
      "click",
      calculateRoute
    );

    localParksBtn.addEventListener(
      "click",
      searchLocalParks
    );

    routeParksBtn.addEventListener(
      "click",
      searchRouteParks
    );

    clearParksBtn.addEventListener(
      "click",
      () => {
        parkLayer.clearLayers();

        setStatus(
          "Skatepark-Marker entfernt."
        );
      }
    );

    /* =========================================================
       START
    ========================================================= */

    initializeRouteFields();

    setStatus(
      "Bereit. Suche einen Ort oder eine Route."
    );
  </script>
