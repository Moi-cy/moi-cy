<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MOI-CY – Skatepark Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: #050505;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =====================================================
           MAP
        ===================================================== */

        #map {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: #e8e8e8;
        }

        .leaflet-container {
            width: 100%;
            height: 100%;

            font-family: Arial, Helvetica, sans-serif;
        }

        .leaflet-control-zoom {
            border: 1px solid rgba(0,0,0,.18) !important;

            box-shadow:
                0 4px 15px rgba(0,0,0,.15) !important;
        }

        .leaflet-control-zoom a {
            width: 32px !important;
            height: 32px !important;

            line-height: 32px !important;

            background: rgba(255,255,255,.96) !important;
            color: #111 !important;
        }

        .leaflet-control-zoom a:hover {
            background: #168cff !important;
            color: #fff !important;
        }

        .leaflet-control-attribution {
            background: rgba(255,255,255,.92) !important;

            color: #555 !important;

            font-size: 10px;

            padding: 3px 6px !important;
        }

        .leaflet-control-attribution a {
            color: #333 !important;
        }

        /* =====================================================
           PANEL
        ===================================================== */

        .map-panel {

            position: fixed;

            z-index: 1000;

            top: 22px;
            left: 22px;

            width: 410px;
            max-width: calc(100vw - 44px);
            max-height: calc(100vh - 44px);

            padding: 20px;

            overflow-y: auto;

            background: rgba(8,8,8,.95);

            border:
                1px solid
                rgba(255,255,255,.13);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.35);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .map-panel::-webkit-scrollbar {
            width: 5px;
        }

        .map-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .map-panel::-webkit-scrollbar-thumb {
            background: #333;
        }

        .map-kicker {

            margin: 0 0 6px;

            color: #168cff;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: .18em;

            text-transform: uppercase;
        }

        .map-title {

            margin: 0;

            color: #fff;

            font-size: 38px;

            line-height: .95;

            font-weight: 900;

            letter-spacing: -.04em;

            text-transform: uppercase;
        }

        .map-intro {

            margin: 12px 0 18px;

            color: #929292;

            font-size: 12px;

            line-height: 1.55;
        }

        /* =====================================================
           INPUTS
        ===================================================== */

        .map-label {

            display: block;

            margin-bottom: 7px;

            color: #999;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: .14em;

            text-transform: uppercase;
        }

        .map-input {

            display: block;

            width: 100%;

            min-width: 0;

            padding: 12px 13px;

            background: #111;

            border:
                1px solid
                rgba(255,255,255,.13);

            color: #fff;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 12px;

            outline: none;

            border-radius: 0;
        }

        .map-input:focus {

            background: #151515;

            border-color: #168cff;
        }

        .map-input::placeholder {

            color: #555;
        }

        .search-row {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto;

            gap: 7px;
        }

        /* =====================================================
           BUTTONS
        ===================================================== */

        .map-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 40px;

            padding: 10px 13px;

            border: 0;

            border-radius: 0;

            background: #168cff;

            color: #fff;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: .1em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background .15s ease,
                transform .15s ease;
        }

        .map-button:hover {

            background: #2d9aff;

            transform: translateY(-1px);
        }

        .map-button.secondary {

            background: #1a1a1a;

            border:
                1px solid
                rgba(255,255,255,.13);
        }

        .map-button.secondary:hover {

            background: #252525;
        }

        .full {

            width: 100%;

            margin-top: 7px;
        }

        /* =====================================================
           ROUTE
        ===================================================== */

        .route-box {

            margin-top: 17px;

            padding-top: 17px;

            border-top:
                1px solid
                rgba(255,255,255,.09);
        }

        .route-fields {

            display: grid;

            gap: 7px;
        }

        .route-actions {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 7px;

            margin-top: 7px;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .map-status {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 14px;

            padding: 10px 12px;

            background: #0d0d0d;

            border-left:
                2px solid
                #333;

            color: #707070;

            font-size: 10px;

            line-height: 1.45;
        }

        .map-status.active {

            border-left-color: #168cff;

            color: #aaa;
        }

        .map-status.error {

            border-left-color: #ff4d4d;

            color: #ff8585;
        }

        .status-dot {

            width: 6px;

            height: 6px;

            min-width: 6px;

            border-radius: 50%;

            background: #555;
        }

        .map-status.active .status-dot {

            background: #168cff;

            box-shadow:
                0 0 10px
                rgba(22,140,255,.8);
        }

        .map-status.error .status-dot {

            background: #ff4d4d;
        }

        /* =====================================================
           RESULTS
        ===================================================== */

        .results {

            margin-top: 16px;
        }

        .results-heading {

            display: flex;

            justify-content: space-between;

            margin-bottom: 6px;

            color: #777;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: .14em;

            text-transform: uppercase;
        }

        .results-count {

            color: #168cff;
        }

        .park-result {

            display: block;

            width: 100%;

            padding: 11px 0;

            background: transparent;

            border: 0;

            border-top:
                1px solid
                rgba(255,255,255,.08);

            color: #fff;

            text-align: left;

            cursor: pointer;
        }

        .park-result:hover
        .park-result-name {

            color: #168cff;
        }

        .park-result-name {

            display: block;

            margin-bottom: 3px;

            color: #eee;

            font-size: 12px;

            font-weight: 900;

            text-transform: uppercase;
        }

        .park-result-meta {

            display: block;

            color: #666;

            font-size: 10px;

            line-height: 1.45;
        }

        .park-distance {

            color: #168cff;
        }

        /* =====================================================
           MARKER
        ===================================================== */

        .moi-marker {

            width: 18px;

            height: 18px;

            background: #168cff;

            border:
                3px solid
                #fff;

            border-radius: 50%;

            box-shadow:
                0 0 0 5px
                rgba(22,140,255,.16),

                0 4px 14px
                rgba(0,0,0,.35);
        }

        .moi-route-marker {

            width: 12px;

            height: 12px;

            background: #fff;

            border:
                3px solid
                #168cff;

            border-radius: 50%;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,.35);
        }

        /* =====================================================
           POPUP
        ===================================================== */

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {

            background: #101010;

            color: #fff;
        }

        .leaflet-popup-content {

            margin: 15px;

            min-width: 215px;
        }

        .popup-kicker {

            margin-bottom: 5px;

            color: #168cff;

            font-size: 8px;

            font-weight: 900;

            letter-spacing: .15em;

            text-transform: uppercase;
        }

        .popup-title {

            margin-bottom: 5px;

            color: #fff;

            font-size: 15px;

            font-weight: 900;

            text-transform: uppercase;
        }

        .popup-address {

            color: #999;

            font-size: 10px;

            line-height: 1.45;
        }

        .popup-link {

            display: inline-block;

            margin-top: 10px;

            padding: 8px 10px;

            background: #168cff;

            color: #fff;

            font-size: 8px;

            font-weight: 900;

            letter-spacing: .08em;

            text-decoration: none;

            text-transform: uppercase;
        }

        .popup-link:hover {

            background: #2d9aff;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .map-panel {

                top: 10px;

                left: 10px;

                width:
                    calc(100vw - 20px);

                max-width: none;

                max-height:
                    calc(100vh - 20px);

                padding: 15px;
            }

            .map-title {

                font-size: 30px;
            }

        }

    </style>
</head>

<body>

    <div id="map"></div>

    <aside class="map-panel">

        <p class="map-kicker">
            MOI-CY / OPEN MAP
        </p>

        <h1 class="map-title">
            FIND YOUR SPOT
        </h1>

        <p class="map-intro">
            Suche nach einer Stadt und die Karte sucht
            automatisch nach eingetragenen Skateparks
            in OpenStreetMap.
        </p>

        <!-- =================================================
             STADT
        ================================================= -->

        <label
            class="map-label"
            for="locationSearch"
        >
            Stadt oder Ort
        </label>

        <div class="search-row">

            <input
                id="locationSearch"
                class="map-input"
                type="search"
                placeholder="z. B. Karlsruhe, Heidelberg..."
                autocomplete="off"
            >

            <button
                id="searchButton"
                class="map-button"
                type="button"
            >
                SUCHEN
            </button>

        </div>

        <!-- =================================================
             ROUTE
        ================================================= -->

        <div class="route-box">

            <label class="map-label">
                Route planen
            </label>

            <div class="route-fields">

                <input
                    id="routeStart"
                    class="map-input"
                    type="text"
                    placeholder="Start"
                    autocomplete="off"
                >

                <input
                    id="routeEnd"
                    class="map-input"
                    type="text"
                    placeholder="Ziel"
                    autocomplete="off"
                >

            </div>

            <div class="route-actions">

                <button
                    id="routeButton"
                    class="map-button"
                    type="button"
                >
                    ROUTE + SPOTS
                </button>

                <button
                    id="clearButton"
                    class="map-button secondary"
                    type="button"
                >
                    ZURÜCKSETZEN
                </button>

            </div>

        </div>

        <!-- =================================================
             STATUS
        ================================================= -->

        <div
            id="mapStatus"
            class="map-status"
        >

            <span class="status-dot"></span>

            <span id="mapStatusText">
                Suche nach einer Stadt oder starte eine Route.
            </span>

        </div>

        <!-- =================================================
             RESULTS
        ================================================= -->

        <div
            id="results"
            class="results"
            hidden
        ></div>

    </aside>


    <!-- =====================================================
         LEAFLET
    ===================================================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        /* =====================================================
           KARTE
        ===================================================== */

        const map = L.map(
            "map",
            {
                zoomControl: false,

                minZoom: 3,

                maxZoom: 19
            }
        ).setView(
            [
                49.1,
                8.4
            ],
            6
        );


        L.control.zoom({
            position: "bottomright"
        }).addTo(map);


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    "&copy; OpenStreetMap-Mitwirkende"
            }
        ).addTo(map);


        /*
         * Layer für die gefundenen Skateparks
         */

        const parkLayer =
            L.layerGroup().addTo(map);


        /*
         * Route
         */

        let routeLayer = null;

        let routeStartMarker = null;

        let routeEndMarker = null;


        /* =====================================================
           ELEMENTE
        ===================================================== */

        const searchInput =
            document.getElementById(
                "locationSearch"
            );

        const searchButton =
            document.getElementById(
                "searchButton"
            );

        const routeStartInput =
            document.getElementById(
                "routeStart"
            );

        const routeEndInput =
            document.getElementById(
                "routeEnd"
            );

        const routeButton =
            document.getElementById(
                "routeButton"
            );

        const clearButton =
            document.getElementById(
                "clearButton"
            );

        const status =
            document.getElementById(
                "mapStatus"
            );

        const statusText =
            document.getElementById(
                "mapStatusText"
            );

        const results =
            document.getElementById(
                "results"
            );


        /* =====================================================
           STATUS
        ===================================================== */

        function setStatus(
            message,
            type = ""
        ) {

            status.classList.remove(
                "active",
                "error"
            );

            if (type) {

                status.classList.add(
                    type
                );

            }

            statusText.textContent =
                message;

        }


        /* =====================================================
           HTML ESCAPEN
        ===================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        /* =====================================================
           GEOCODING
           
           Nominatim:
           Stadt → Koordinaten
        ===================================================== */

        async function geocode(
            query
        ) {

            const url =
                "https://nominatim.openstreetmap.org/search" +

                "?format=jsonv2" +

                "&limit=1" +

                "&q=" +

                encodeURIComponent(
                    query
                );


            const response =
                await fetch(
                    url,
                    {
                        headers: {

                            "Accept":
                                "application/json"

                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Nominatim HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (!data.length) {

                return null;

            }


            return {

                lat:
                    Number(
                        data[0].lat
                    ),

                lng:
                    Number(
                        data[0].lon
                    ),

                displayName:
                    data[0].display_name

            };

        }


        /* =====================================================
           OPENSTREETMAP / OVERPASS
           
           Hier passiert die eigentliche Skatepark-Suche.
           
           Wir suchen:
           
           leisure=skatepark
           
           sport=skateboard
           
           amenity=skatepark
        ===================================================== */

        async function findSkateparks(
            lat,
            lng,
            radius
        ) {

            const query = `

[out:json][timeout:30];

(
    nwr(
        around:${radius},
        ${lat},
        ${lng}
    )["leisure"="skatepark"];

    nwr(
        around:${radius},
        ${lat},
        ${lng}
    )["sport"="skateboard"];

    nwr(
        around:${radius},
        ${lat},
        ${lng}
    )["amenity"="skatepark"];
);

out center tags;

            `;


            /*
             * Wir haben zwei Overpass-Server.
             * Falls einer gerade überlastet ist,
             * wird der zweite versucht.
             */

            const endpoints = [

                "https://overpass-api.de/api/interpreter",

                "https://overpass.kumi.systems/api/interpreter"

            ];


            let lastError = null;


            for (
                const endpoint
                of endpoints
            ) {

                try {

                    const response =
                        await fetch(
                            endpoint,
                            {
                                method:
                                    "POST",

                                body:
                                    query,

                                headers: {

                                    "Content-Type":
                                        "text/plain;charset=UTF-8"

                                }
                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Overpass HTTP " +
                            response.status
                        );

                    }


                    const data =
                        await response.json();


                    return normalizeParks(
                        data.elements || []
                    );

                }
                catch (error) {

                    lastError =
                        error;

                }

            }


            throw (
                lastError ||
                new Error(
                    "Overpass nicht erreichbar."
                )
            );

        }


        /* =====================================================
           OSM-DATEN AUFBEREITEN
        ===================================================== */

        function normalizeParks(
            elements
        ) {

            const seen =
                new Set();

            const parks = [];


            for (
                const element
                of elements
            ) {

                const tags =
                    element.tags || {};


                /*
                 * Nodes haben lat/lon.
                 *
                 * Ways und Relations bekommen
                 * ihre Position über center.
                 */

                const lat =
                    Number.isFinite(
                        element.lat
                    )

                    ? element.lat

                    : element.center?.lat;


                const lng =
                    Number.isFinite(
                        element.lon
                    )

                    ? element.lon

                    : element.center?.lon;


                if (
                    !Number.isFinite(lat) ||
                    !Number.isFinite(lng)
                ) {

                    continue;

                }


                const id =
                    element.type +
                    "/" +
                    element.id;


                /*
                 * Doppelte Einträge vermeiden.
                 */

                if (
                    seen.has(id)
                ) {

                    continue;

                }


                seen.add(id);


                const name =
                    tags.name ||
                    tags["name:de"] ||
                    tags["name:fr"] ||
                    "Skatepark";


                const address = [

                    tags["addr:street"],

                    tags["addr:housenumber"],

                    tags["addr:postcode"],

                    tags["addr:city"]

                ]
                .filter(Boolean)
                .join(" ");


                parks.push({

                    id,

                    name,

                    address,

                    lat,

                    lng,

                    osmUrl:
                        "https://www.openstreetmap.org/" +
                        element.type +
                        "/" +
                        element.id

                });

            }


            return parks;

        }


        /* =====================================================
           ENTFERNUNG
        ===================================================== */

        function distanceKm(
            a,
            b
        ) {

            const R =
                6371;


            const dLat =
                (
                    b.lat -
                    a.lat
                ) *
                Math.PI /
                180;


            const dLng =
                (
                    b.lng -
                    a.lng
                ) *
                Math.PI /
                180;


            const x =
                Math.sin(
                    dLat / 2
                ) ** 2 +

                Math.cos(
                    a.lat *
                    Math.PI /
                    180
                ) *

                Math.cos(
                    b.lat *
                    Math.PI /
                    180
                ) *

                Math.sin(
                    dLng / 2
                ) ** 2;


            return (
                2 *
                R *
                Math.atan2(
                    Math.sqrt(x),
                    Math.sqrt(1 - x)
                )
            );

        }


        /* =====================================================
           MARKER
        ===================================================== */

        function createParkMarker(
            park
        ) {

            const icon =
                L.divIcon({

                    className: "",

                    html:
                        '<div class="moi-marker"></div>',

                    iconSize:
                        [24, 24],

                    iconAnchor:
                        [12, 12],

                    popupAnchor:
                        [0, -14]

                });


            const marker =
                L.marker(
                    [
                        park.lat,
                        park.lng
                    ],
                    {
                        icon
                    }
                );


            marker.bindPopup(`

                <div class="popup-kicker">
                    MOI-CY SKATEPARK
                </div>

                <div class="popup-title">
                    ${escapeHtml(
                        park.name
                    )}
                </div>

                <div class="popup-address">
                    ${
                        escapeHtml(
                            park.address ||
                            "Keine Adresse eingetragen"
                        )
                    }
                </div>

                <a
                    class="popup-link"
                    href="${park.osmUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    OPENSTREETMAP →
                </a>

            `);


            marker.addTo(
                parkLayer
            );


            return marker;

        }


        /* =====================================================
           PARKS ANZEIGEN
        ===================================================== */

        function showParks(
            items,
            title
        ) {

            parkLayer.clearLayers();


            items.forEach(
                item => {

                    const park =
                        item.park ||
                        item;


                    createParkMarker(
                        park
                    );

                }
            );


            results.hidden =
                false;


            results.innerHTML = `

                <div class="results-heading">

                    <span>
                        ${escapeHtml(title)}
                    </span>

                    <span class="results-count">
                        ${items.length}
                    </span>

                </div>


                ${
                    items.length

                    ?

                    items.map(
                        (
                            item,
                            index
                        ) => {

                            const park =
                                item.park ||
                                item;


                            return `

                                <button
                                    type="button"
                                    class="park-result"
                                    data-index="${index}"
                                >

                                    <span class="park-result-name">
                                        ${escapeHtml(
                                            park.name
                                        )}
                                    </span>

                                    <span class="park-result-meta">

                                        ${
                                            escapeHtml(
                                                park.address ||
                                                "Keine Adresse eingetragen"
                                            )
                                        }

                                        ${
                                            Number.isFinite(
                                                item.distance
                                            )

                                            ?

                                            `<br>
                                            <span class="park-distance">
                                                ${item.distance.toFixed(1)}
                                                km entfernt
                                            </span>`

                                            :

                                            ""
                                        }

                                    </span>

                                </button>

                            `;

                        }
                    ).join("")

                    :

                    `

                        <div class="empty-results">

                            Keine Skateparks in diesem Bereich gefunden.

                        </div>

                    `

                }

            `;


            results
                .querySelectorAll(
                    ".park-result"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                const item =
                                    items[
                                        Number(
                                            button.dataset.index
                                        )
                                    ];


                                const park =
                                    item.park ||
                                    item;


                                map.setView(
                                    [
                                        park.lat,
                                        park.lng
                                    ],
                                    17,
                                    {
                                        animate:
                                            true
                                    }
                                );


                                /*
                                 * Marker finden und Popup öffnen.
                                 */

                                parkLayer.eachLayer(
                                    marker => {

                                        if (
                                            marker.getLatLng &&
                                            Math.abs(
                                                marker.getLatLng().lat -
                                                park.lat
                                            ) < 0.000001 &&
                                            Math.abs(
                                                marker.getLatLng().lng -
                                                park.lng
                                            ) < 0.000001
                                        ) {

                                            marker.openPopup();

                                        }

                                    }
                                );

                            }
                        );

                    }
                );

        }


        /* =====================================================
           STADT SUCHEN
           
           35 KM UM DIE GESUCHTE STADT
        ===================================================== */

        async function searchLocation() {

            const query =
                searchInput.value.trim();


            if (!query) {

                setStatus(
                    "Bitte eine Stadt oder einen Ort eingeben.",
                    "error"
                );

                return;

            }


            try {

                setStatus(
                    "Ort wird gesucht …",
                    "active"
                );


                results.hidden =
                    true;


                /*
                 * Stadt finden.
                 */

                const location =
                    await geocode(
                        query
                    );


                if (!location) {

                    setStatus(
                        "Der Ort wurde nicht gefunden.",
                        "error"
                    );

                    return;

                }


                /*
                 * Karte auf Stadt setzen.
                 */

                map.setView(
                    [
                        location.lat,
                        location.lng
                    ],
                    11
                );


                setStatus(
                    "OpenStreetMap wird nach Skateparks durchsucht …",
                    "active"
                );


                /*
                 * 35.000 Meter = 35 km
                 */

                const parks =
                    await findSkateparks(
                        location.lat,
                        location.lng,
                        35000
                    );


                /*
                 * Entfernung jedes Skateparks
                 * zur Stadt berechnen.
                 */

                const nearby =
                    parks
                        .map(
                            park => ({

                                park,

                                distance:
                                    distanceKm(
                                        location,
                                        park
                                    )

                            })
                        )
                        .filter(
                            item =>
                                item.distance <=
                                35
                        )
                        .sort(
                            (
                                a,
                                b
                            ) =>
                                a.distance -
                                b.distance
                        );


                /*
                 * Marker anzeigen.
                 */

                showParks(
                    nearby,
                    "SKATEPARKS IN DER UMGEBUNG"
                );


                /*
                 * Auf alle gefundenen Spots zoomen.
                 */

                if (
                    nearby.length
                ) {

                    const bounds =
                        L.latLngBounds([

                            [
                                location.lat,
                                location.lng
                            ],

                            ...nearby.map(
                                item => [

                                    item.park.lat,

                                    item.park.lng

                                ]
                            )

                        ]);


                    map.fitBounds(
                        bounds,
                        {
                            padding:
                                [80, 80],

                            maxZoom:
                                14
                        }
                    );

                }


                setStatus(

                    nearby.length

                    ?

                    `${nearby.length} Skatepark(s) im Umkreis von 35 km gefunden.`

                    :

                    "Keine Skateparks im Umkreis von 35 km gefunden.",

                    nearby.length
                        ? "active"
                        : ""

                );

            }
            catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "Die Skatepark-Suche konnte nicht durchgeführt werden.",
                    "error"
                );

            }

        }


        /* =====================================================
           ROUTE
           
           1. Start suchen
           2. Ziel suchen
           3. Route mit OSRM berechnen
           4. Skateparks entlang der Route suchen
        ===================================================== */

        async function searchRoute() {

            const startQuery =
                routeStartInput.value.trim();


            const endQuery =
                routeEndInput.value.trim();


            if (
                !startQuery ||
                !endQuery
            ) {

                setStatus(
                    "Bitte Start und Ziel eingeben.",
                    "error"
                );

                return;

            }


            try {

                setStatus(
                    "Start und Ziel werden gesucht …",
                    "active"
                );


                results.hidden =
                    true;


                /*
                 * START
                 */

                const start =
                    await geocode(
                        startQuery
                    );


                /*
                 * Kleine Pause für Nominatim.
                 */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            1100
                        )
                );


                /*
                 * ZIEL
                 */

                const end =
                    await geocode(
                        endQuery
                    );


                if (
                    !start ||
                    !end
                ) {

                    setStatus(
                        "Start oder Ziel wurde nicht gefunden.",
                        "error"
                    );

                    return;

                }


                setStatus(
                    "Route wird berechnet …",
                    "active"
                );


                /*
                 * OSRM ROUTING
                 */

                const routeUrl =

                    "https://router.project-osrm.org/route/v1/driving/" +

                    `${start.lng},${start.lat};` +

                    `${end.lng},${end.lat}` +

                    "?overview=full&geometries=geojson";


                const response =
                    await fetch(
                        routeUrl
                    );


                if (!response.ok) {

                    throw new Error(
                        "OSRM HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                if (
                    data.code !== "Ok" ||
                    !data.routes ||
                    !data.routes.length
                ) {

                    throw new Error(
                        "Keine Route gefunden."
                    );

                }


                const route =
                    data.routes[0];


                const coordinates =
                    route.geometry.coordinates;


                /*
                 * Alte Route entfernen.
                 */

                if (
                    routeLayer
                ) {

                    map.removeLayer(
                        routeLayer
                    );

                }


                if (
                    routeStartMarker
                ) {

                    map.removeLayer(
                        routeStartMarker
                    );

                }


                if (
                    routeEndMarker
                ) {

                    map.removeLayer(
                        routeEndMarker
                    );

                }


                /*
                 * Route zeichnen.
                 */

                routeLayer =
                    L.geoJSON(
                        route.geometry,
                        {

                            style: {

                                color:
                                    "#168cff",

                                weight:
                                    5,

                                opacity:
                                    .95

                            }

                        }
                    ).addTo(
                        map
                    );


                /*
                 * Start/Ziel Marker.
                 */

                const endpointIcon =
                    L.divIcon({

                        className: "",

                        html:
                            '<div class="moi-route-marker"></div>',

                        iconSize:
                            [18, 18],

                        iconAnchor:
                            [9, 9]

                    });


                routeStartMarker =
                    L.marker(
                        [
                            start.lat,
                            start.lng
                        ],
                        {
                            icon:
                                endpointIcon
                        }
                    ).addTo(
                        map
                    );


                routeEndMarker =
                    L.marker(
                        [
                            end.lat,
                            end.lng
                        ],
                        {
                            icon:
                                endpointIcon
                        }
                    ).addTo(
                        map
                    );


                setStatus(
                    "OpenStreetMap wird entlang der Route durchsucht …",
                    "active"
                );


                /* =================================================
                   ROUTEN-BEREICH
                   
                   Wir nehmen die Bounding Box der Route
                   und geben 15 km Puffer dazu.
                ================================================= */

                const routeBounds =
                    routeLayer.getBounds();


                const southWest =
                    routeBounds.getSouthWest();


                const northEast =
                    routeBounds.getNorthEast();


                const centerLat =
                    (
                        southWest.lat +
                        northEast.lat
                    ) / 2;


                const latBuffer =
                    15 / 111;


                const lngBuffer =
                    15 /
                    (
                        111 *
                        Math.max(
                            .2,
                            Math.cos(
                                centerLat *
                                Math.PI /
                                180
                            )
                        )
                    );


                const south =
                    southWest.lat -
                    latBuffer;


                const west =
                    southWest.lng -
                    lngBuffer;


                const north =
                    northEast.lat +
                    latBuffer;


                const east =
                    northEast.lng +
                    lngBuffer;


                /* =================================================
                   OVERPASS ROUTEN-SUCHE
                ================================================= */

                const query = `

[out:json][timeout:60];

(
    nwr[
        "leisure"="skatepark"
    ](
        ${south},
        ${west},
        ${north},
        ${east}
    );

    nwr[
        "sport"="skateboard"
    ](
        ${south},
        ${west},
        ${north},
        ${east}
    );

    nwr[
        "amenity"="skatepark"
    ](
        ${south},
        ${west},
        ${north},
        ${east}
    );
);

out center tags;

                `;


                const endpoints = [

                    "https://overpass-api.de/api/interpreter",

                    "https://overpass.kumi.systems/api/interpreter"

                ];


                let osmData =
                    null;

                let lastError =
                    null;


                for (
                    const endpoint
                    of endpoints
                ) {

                    try {

                        const response =
                            await fetch(
                                endpoint,
                                {

                                    method:
                                        "POST",

                                    body:
                                        query,

                                    headers: {

                                        "Content-Type":
                                            "text/plain;charset=UTF-8"

                                    }

                                }
                            );


                        if (!response.ok) {

                            throw new Error(
                                "Overpass HTTP " +
                                response.status
                            );

                        }


                        osmData =
                            await response.json();


                        break;

                    }
                    catch (error) {

                        lastError =
                            error;

                    }

                }


                if (!osmData) {

                    throw (
                        lastError ||
                        new Error(
                            "Overpass nicht erreichbar."
                        )
                    );

                }


                const parks =
                    normalizeParks(
                        osmData.elements || []
                    );


                /* =================================================
                   DISTANZ ZUR ROUTE
                   
                   Für eine erste Version benutzen wir
                   die nächstgelegene Position auf der Route.
                ================================================= */

                const nearby =
                    parks
                        .map(
                            park => ({

                                park,

                                distance:
                                    distanceToRoute(
                                        park,
                                        coordinates
                                    )

                            })
                        )
                        .filter(
                            item =>
                                item.distance <=
                                15
                        )
                        .sort(
                            (
                                a,
                                b
                            ) =>
                                a.distance -
                                b.distance
                        );


                /*
                 * Skateparks anzeigen.
                 */

                showParks(
                    nearby,
                    "SKATEPARKS AN DER ROUTE"
                );


                /*
                 * Route + Skateparks anzeigen.
                 */

                const bounds =
                    routeLayer.getBounds();


                nearby.forEach(
                    item => {

                        bounds.extend([
                            item.park.lat,
                            item.park.lng
                        ]);

                    }
                );


                map.fitBounds(
                    bounds,
                    {
                        padding:
                            [80, 80]
                    }
                );


                const routeDistance =
                    (
                        route.distance /
                        1000
                    ).toFixed(1);


                setStatus(

                    nearby.length

                    ?

                    `${nearby.length} Skatepark(s) bis 15 km von der Route. Route: ${routeDistance} km.`

                    :

                    `Keine Skateparks bis 15 km von der Route. Route: ${routeDistance} km.`,

                    nearby.length
                        ? "active"
                        : ""

                );

            }
            catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "Die Route konnte nicht berechnet werden.",
                    "error"
                );

            }

        }


        /* =====================================================
           PUNKT → ROUTE
        ===================================================== */

        function pointToSegmentKm(
            point,
            start,
            end
        ) {

            const factor =
                Math.cos(
                    point.lat *
                    Math.PI /
                    180
                );


            const px =
                point.lng *
                factor;


            const py =
                point.lat;


            const ax =
                start.lng *
                factor;


            const ay =
                start.lat;


            const bx =
                end.lng *
                factor;


            const by =
                end.lat;


            const dx =
                bx -
                ax;


            const dy =
                by -
                ay;


            if (
                dx === 0 &&
                dy === 0
            ) {

                return distanceKm(
                    point,
                    start
                );

            }


            const t =
                Math.max(
                    0,
                    Math.min(
                        1,

                        (
                            (
                                px -
                                ax
                            ) *
                            dx +

                            (
                                py -
                                ay
                            ) *
                            dy

                        ) /
                        (
                            dx * dx +
                            dy * dy
                        )
                    )
                );


            const closest = {

                lat:
                    ay +
                    t * dy,

                lng:
                    (
                        ax +
                        t * dx
                    ) /
                    factor

            };


            return distanceKm(
                point,
                closest
            );

        }


        function distanceToRoute(
            park,
            coordinates
        ) {

            let minimum =
                Infinity;


            for (
                let i = 0;
                i <
                coordinates.length - 1;
                i++
            ) {

                const start = {

                    lat:
                        coordinates[i][1],

                    lng:
                        coordinates[i][0]

                };


                const end = {

                    lat:
                        coordinates[i + 1][1],

                    lng:
                        coordinates[i + 1][0]

                };


                const distance =
                    pointToSegmentKm(
                        park,
                        start,
                        end
                    );


                minimum =
                    Math.min(
                        minimum,
                        distance
                    );

            }


            return minimum;

        }


        /* =====================================================
           ZURÜCKSETZEN
        ===================================================== */

        function clearMap() {

            parkLayer.clearLayers();


            if (
                routeLayer
            ) {

                map.removeLayer(
                    routeLayer
                );

                routeLayer =
                    null;

            }


            if (
                routeStartMarker
            ) {

                map.removeLayer(
                    routeStartMarker
                );

                routeStartMarker =
                    null;

            }


            if (
                routeEndMarker
            ) {

                map.removeLayer(
                    routeEndMarker
                );

                routeEndMarker =
                    null;

            }


            searchInput.value =
                "";

            routeStartInput.value =
                "";

            routeEndInput.value =
                "";


            results.innerHTML =
                "";

            results.hidden =
                true;


            map.setView(
                [
                    49.1,
                    8.4
                ],
                6
            );


            setStatus(
                "Suche nach einer Stadt oder starte eine Route."
            );

        }


        /* =====================================================
           EVENTS
        ===================================================== */

        searchButton.addEventListener(
            "click",
            searchLocation
        );


        searchInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    searchLocation();

                }

            }
        );


        routeButton.addEventListener(
            "click",
            searchRoute
        );


        routeStartInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    searchRoute();

                }

            }
        );


        routeEndInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    searchRoute();

                }

            }
        );


        clearButton.addEventListener(
            "click",
            clearMap
        );


        /* =====================================================
           LEAFLET SIZE
        ===================================================== */

        setTimeout(
            () => map.invalidateSize(true),
            300
        );


        setTimeout(
            () => map.invalidateSize(true),
            1000
        );

    </script>
