<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MOI-CY – Karte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      background: #111;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ---------------------------------------------------------
       PANEL
    --------------------------------------------------------- */

    #searchPanel {
      position: fixed;
      top: 18px;
      left: 18px;
      width: min(430px, calc(100vw - 36px));
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      z-index: 1000;

      background: rgba(15, 15, 15, 0.96);
      color: #fff;
      border-radius: 18px;
      padding: 16px;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.35);

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    #searchPanel.collapsed {
      transform: translateX(calc(-100% - 25px));
      opacity: 0;
      pointer-events: none;
    }

    #openPanelButton {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 1100;

      display: none;

      border: 0;
      border-radius: 12px;
      padding: 10px 14px;

      background: #111;
      color: #fff;

      font-weight: 700;
      cursor: pointer;

      box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }

    #openPanelButton.visible {
      display: block;
    }

    .panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panelTitle {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .panelSubtitle {
      margin-top: 3px;
      color: #aaa;
      font-size: 12px;
    }

    .iconButton {
      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 10px;

      background: #262626;
      color: #fff;

      font-size: 18px;
      cursor: pointer;
    }

    /* ---------------------------------------------------------
       SEARCH
    --------------------------------------------------------- */

    .searchBox {
      display: flex;
      gap: 8px;
    }

    #mainSearch {
      min-width: 0;
      flex: 1;

      border: 1px solid #444;
      border-radius: 12px;

      background: #202020;
      color: #fff;

      padding: 12px 13px;

      outline: none;
      font-size: 14px;
    }

    #mainSearch:focus {
      border-color: #888;
    }

    #searchButton {
      flex: 0 0 auto;

      border: 0;
      border-radius: 12px;

      padding: 0 15px;

      background: #fff;
      color: #111;

      font-weight: 800;
      cursor: pointer;
    }

    .searchHint {
      margin: 8px 2px 0;

      color: #929292;
      font-size: 11px;
      line-height: 1.4;
    }

    /* ---------------------------------------------------------
       SECTIONS
    --------------------------------------------------------- */

    .section {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid #303030;
    }

    .sectionTitle {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 10px;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: #bbb;
    }

    /* ---------------------------------------------------------
       ROUTE
    --------------------------------------------------------- */

    #routeFields {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .routeRow {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .routeRow input {
      flex: 1;
      min-width: 0;

      border: 1px solid #3d3d3d;
      border-radius: 10px;

      background: #1d1d1d;
      color: #fff;

      padding: 10px 11px;

      outline: none;
      font-size: 13px;
    }

    .routeRow input:focus {
      border-color: #777;
    }

    .removeStop {
      width: 32px;
      height: 32px;

      flex: 0 0 32px;

      border: 0;
      border-radius: 9px;

      background: #2b2b2b;
      color: #bbb;

      cursor: pointer;
    }

    .routeButtons {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    .secondaryButton,
    .primaryButton {
      border: 0;
      border-radius: 10px;

      padding: 10px 12px;

      font-size: 12px;
      font-weight: 800;

      cursor: pointer;
    }

    .secondaryButton {
      background: #292929;
      color: #fff;
    }

    .primaryButton {
      background: #fff;
      color: #111;
    }

    /* ---------------------------------------------------------
       SKATEPARK
    --------------------------------------------------------- */

    .radiusButtons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .radiusButton {
      border: 1px solid #3a3a3a;
      border-radius: 9px;

      background: #1e1e1e;
      color: #bbb;

      padding: 8px 4px;

      font-size: 12px;
      font-weight: 800;

      cursor: pointer;
    }

    .radiusButton.active {
      background: #fff;
      color: #111;
      border-color: #fff;
    }

    #findParksButton,
    #routeParksButton {
      width: 100%;
      margin-top: 9px;

      border: 0;
      border-radius: 11px;

      padding: 11px;

      background: #e92727;
      color: #fff;

      font-weight: 900;
      font-size: 12px;

      cursor: pointer;
    }

    #routeParksButton {
      background: #b51d1d;
      display: none;
    }

    #findParksButton:disabled,
    #routeParksButton:disabled,
    #searchButton:disabled,
    #routeSearchButton:disabled {
      opacity: .55;
      cursor: wait;
    }

    /* ---------------------------------------------------------
       STATUS
    --------------------------------------------------------- */

    #status {
      min-height: 18px;
      margin-top: 12px;

      color: #aaa;
      font-size: 12px;
      line-height: 1.4;
    }

    #status.error {
      color: #ff8585;
    }

    #status.success {
      color: #8ee59a;
    }

    #status.loading {
      color: #ddd;
    }

    /* ---------------------------------------------------------
       LEAFLET
    --------------------------------------------------------- */

    .leaflet-control-zoom {
      margin-right: 12px !important;
      margin-bottom: 12px !important;
    }

    .leaflet-control-layers {
      border-radius: 10px !important;
      overflow: hidden;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #111;
      color: #fff;
    }

    .leaflet-popup-content {
      margin: 13px 15px;
    }

    .parkPopup {
      min-width: 190px;
    }

    .parkPopupName {
      font-weight: 900;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .parkPopupLine {
      font-size: 12px;
      color: #bbb;
      margin-top: 4px;
    }

    .parkPopupLine strong {
      color: #fff;
    }

    /* ---------------------------------------------------------
       RED SKATEPARK MARKER
    --------------------------------------------------------- */

    .skatepark-marker {
      width: 17px;
      height: 17px;

      border-radius: 50%;

      background: #e92727;

      border: 3px solid #fff;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, .5);
    }

    .route-marker {
      width: 15px;
      height: 15px;

      border-radius: 50%;

      background: #fff;
      border: 3px solid #111;

      box-shadow: 0 2px 7px rgba(0,0,0,.45);
    }

    /* ---------------------------------------------------------
       MOBILE
    --------------------------------------------------------- */

    @media (max-width: 600px) {
      #searchPanel {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        max-height: calc(100vh - 20px);
      }

      #openPanelButton {
        left: 10px;
        top: 10px;
      }
    }
  </style>
</head>

<body>

<div id="map"></div>

<button id="openPanelButton" type="button">
  ☰ Suche
</button>

<aside id="searchPanel">

  <div class="panelHeader">
    <div>
      <div class="panelTitle">MOI-CY Karte</div>
      <div class="panelSubtitle">
        Orte, Routen & Skateparks
      </div>
    </div>

    <button
      id="closePanelButton"
      class="iconButton"
      type="button"
      aria-label="Suche schließen"
    >
      ×
    </button>
  </div>

  <!-- =======================================================
       UNIFIED SEARCH
  ======================================================== -->

  <div class="searchBox">
    <input
      id="mainSearch"
      type="text"
      autocomplete="off"
      placeholder="Ort oder Route, z. B. Karlsruhe"
    >

    <button id="searchButton" type="button">
      Suchen
    </button>
  </div>

  <div class="searchHint">
    Route z. B. „Karlsruhe → Stuttgart → München“
  </div>

  <!-- =======================================================
       ROUTE
  ======================================================== -->

  <div class="section">

    <div class="sectionTitle">
      <span>Route</span>
    </div>

    <div id="routeFields">

      <div class="routeRow">
        <input
          class="routeInput"
          type="text"
          placeholder="Start"
        >
      </div>

      <div class="routeRow">
        <input
          class="routeInput"
          type="text"
          placeholder="Ziel"
        >
        <button
          class="removeStop"
          type="button"
          title="Ziel entfernen"
          style="visibility:hidden"

          ×
        </button>
      </div>

    </div>

    <div class="routeButtons">

      <button
        id="addStopButton"
        class="secondaryButton"
        type="button"
      >
        + Zwischenstopp hinzufügen
      </button>

      <button
        id="routeSearchButton"
        class="primaryButton"
        type="button"
      >
        Route suchen
      </button>

    </div>

    <button
      id="routeParksButton"
      type="button"
    >
      🛹 SKATEPARKS ENTLANG DER ROUTE
    </button>

  </div>

  <!-- =======================================================
       SKATEPARKS
  ======================================================== -->

  <div class="section">

    <div class="sectionTitle">
      <span>Skateparks</span>
      <span id="parkCount"></span>
    </div>

    <div class="radiusButtons">

      <button
        class="radiusButton active"
        data-radius="5"
        type="button"
      >
        5 km
      </button>

      <button
        class="radiusButton"
        data-radius="10"
        type="button"
      >
        10 km
      </button>

      <button
        class="radiusButton"
        data-radius="25"
        type="button"
      >
        25 km
      </button>

      <button
        class="radiusButton"
        data-radius="50"
        type="button"
      >
        50 km
      </button>

    </div>

    <button
      id="findParksButton"
      type="button"
    >
      🛹 SKATEPARKS HIER SUCHEN
    </button>

  </div>

  <div id="status"></div>

</aside>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin=""
></script>

<script>
"use strict";

/* ============================================================
   CONFIG
============================================================ */

const DEFAULT_CENTER = [48.7758, 9.1829];
const DEFAULT_ZOOM = 6;

const MAP_BOUNDS = L.latLngBounds(
  [-85.05112878, -180],
  [85.05112878, 180]
);

const NOMINATIM_URL =
  "https://nominatim.openstreetmap.org/search";

const PHOTON_URL =
  "https://photon.komoot.io/api/";

const OSRM_URL =
  "https://router.project-osrm.org/route/v1/driving/";

const OVERPASS_ENDPOINTS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
];

/*
 * Harte Zeitgrenze:
 * Skateparks dürfen insgesamt höchstens 10 Sekunden suchen.
 */
const PARK_SEARCH_TIMEOUT = 10000;

/*
 * Andere Netzwerkanfragen
 */
const GEOCODE_TIMEOUT = 8000;
const ROUTE_TIMEOUT = 10000;
const OVERPASS_TIMEOUT = 9000;

/* ============================================================
   MAP
============================================================ */

const map = L.map("map", {
  center: DEFAULT_CENTER,
  zoom: DEFAULT_ZOOM,

  minZoom: 2,
  maxZoom: 18,

  maxBounds: MAP_BOUNDS,
  maxBoundsViscosity: 1.0,

  worldCopyJump: false,

  zoomControl: true,
  preferCanvas: true
});


const standardLayer = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }
).addTo(map);


const satelliteLayer = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution:
      "Tiles &copy; Esri"
  }
);


L.control.layers(
  {
    "Karte": standardLayer,
    "Satellit": satelliteLayer
  },
  null,
  {
    position: "topright"
  }
).addTo(map);


/* ============================================================
   UI
============================================================ */

const searchPanel =
  document.getElementById("searchPanel");

const openPanelButton =
  document.getElementById("openPanelButton");

const closePanelButton =
  document.getElementById("closePanelButton");

const mainSearch =
  document.getElementById("mainSearch");

const searchButton =
  document.getElementById("searchButton");

const routeFields =
  document.getElementById("routeFields");

const addStopButton =
  document.getElementById("addStopButton");

const routeSearchButton =
  document.getElementById("routeSearchButton");

const findParksButton =
  document.getElementById("findParksButton");

const routeParksButton =
  document.getElementById("routeParksButton");

const statusElement =
  document.getElementById("status");

const parkCountElement =
  document.getElementById("parkCount");


/* ============================================================
   STATE
============================================================ */

let selectedRadiusKm = 5;

let currentRoute = null;

let routeLayer = null;

let parkLayer = L.layerGroup().addTo(map);

let routeMarkerLayer = L.layerGroup().addTo(map);

let lastParkSearchKey = null;

let parkSearchCache = new Map();

let geocodeCache = new Map();

let currentSearchController = null;


/* ============================================================
   HELPERS
============================================================ */

function setStatus(message, type = "") {
  statusElement.textContent = message;
  statusElement.className = type;
}


function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}


function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function normalizeText(value) {
  return String(value ?? "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/ß/g, "ss")
    .trim();
}


function transliterations(value) {
  const original = String(value || "").trim();

  const variants = new Set([
    original
  ]);

  variants.add(
    original
      .replaceAll("ä", "ae")
      .replaceAll("ö", "oe")
      .replaceAll("ü", "ue")
      .replaceAll("Ä", "Ae")
      .replaceAll("Ö", "Oe")
      .replaceAll("Ü", "Ue")
      .replaceAll("ß", "ss")
  );

  variants.add(
    original
      .replaceAll("ä", "a")
      .replaceAll("ö", "o")
      .replaceAll("ü", "u")
      .replaceAll("Ä", "A")
      .replaceAll("Ö", "O")
      .replaceAll("Ü", "U")
      .replaceAll("ß", "ss")
  );

  return [...variants].filter(Boolean);
}


/* ============================================================
   ABORTABLE FETCH
============================================================ */

async function fetchWithTimeout(
  url,
  options = {},
  timeoutMs = 8000,
  externalSignal = null
) {
  const controller = new AbortController();

  const timer = setTimeout(() => {
    controller.abort();
  }, timeoutMs);

  let externalAbortHandler = null;

  if (externalSignal) {
    externalAbortHandler = () => {
      controller.abort();
    };

    if (externalSignal.aborted) {
      controller.abort();
    } else {
      externalSignal.addEventListener(
        "abort",
        externalAbortHandler,
        { once: true }
      );
    }
  }

  try {
    const response = await fetch(
      url,
      {
        ...options,
        signal: controller.signal
      }
    );

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    return response;

  } finally {
    clearTimeout(timer);

    if (
      externalSignal &&
      externalAbortHandler
    ) {
      externalSignal.removeEventListener(
        "abort",
        externalAbortHandler
      );
    }
  }
}


/* ============================================================
   GEOCODING
============================================================ */

/*
 * Nominatim und Photon laufen parallel.
 * Dadurch wartet die Suche nicht unnötig auf einen einzelnen
 * Geocoder.
 */

async function geocodeOne(query) {

  const cacheKey =
    normalizeText(query);

  if (geocodeCache.has(cacheKey)) {
    return geocodeCache.get(cacheKey);
  }

  const variants =
    transliterations(query);

  const nominatimPromises =
    variants.slice(0, 2).map(async variant => {

      const params =
        new URLSearchParams({
          q: variant,
          format: "jsonv2",
          addressdetails: "1",
          limit: "5",
          dedupe: "1",
          "accept-language": "de"
        });

      const response =
        await fetchWithTimeout(
          NOMINATIM_URL +
          "?" +
          params.toString(),
          {
            headers: {
              "Accept": "application/json"
            }
          },
          GEOCODE_TIMEOUT
        );

      return response.json();
    });


  const photonPromises =
    variants.slice(0, 2).map(async variant => {

      const params =
        new URLSearchParams({
          q: variant,
          limit: "5",
          lang: "de"
        });

      const response =
        await fetchWithTimeout(
          PHOTON_URL +
          "?" +
          params.toString(),
          {
            headers: {
              "Accept": "application/json"
            }
          },
          GEOCODE_TIMEOUT
        );

      return response.json();
    });


  const results = [];

  const settled =
    await Promise.allSettled([
      ...nominatimPromises,
      ...photonPromises
    ]);


  for (const item of settled) {

    if (
      item.status !== "fulfilled" ||
      !item.value
    ) {
      continue;
    }

    const value = item.value;

    if (Array.isArray(value)) {
      for (const result of value) {

        const lat =
          Number(result.lat);

        const lon =
          Number(result.lon);

        if (
          Number.isFinite(lat) &&
          Number.isFinite(lon)
        ) {
          results.push({
            lat,
            lon,
            displayName:
              result.display_name || query,

            source: "nominatim"
          });
        }
      }

      continue;
    }


    if (
      Array.isArray(value.features)
    ) {
      for (const feature of value.features) {

        const coords =
          feature?.geometry?.coordinates;

        if (
          !Array.isArray(coords) ||
          coords.length < 2
        ) {
          continue;
        }

        const lon =
          Number(coords[0]);

        const lat =
          Number(coords[1]);

        if (
          Number.isFinite(lat) &&
          Number.isFinite(lon)
        ) {
          results.push({
            lat,
            lon,
            displayName:
              feature?.properties?.name ||
              query,

            source: "photon"
          });
        }
      }
    }
  }


  if (!results.length) {
    throw new Error(
      "Ort wurde nicht gefunden."
    );
  }


  /*
   * Nominatim bekommt leicht Vorrang.
   * Wir nehmen das erste brauchbare Ergebnis.
   */
  const best =
    results.find(
      r => r.source === "nominatim"
    ) || results[0];


  geocodeCache.set(
    cacheKey,
    best
  );

  return best;
}


/* ============================================================
   SEARCH TYPE
============================================================ */

function looksLikeRoute(query) {

  return /(?:->|→|➜|>|↦)/.test(query);
}


function parseUnifiedRoute(query) {

  return query
    .split(/(?:->|→|➜|>|↦)/)
    .map(part => part.trim())
    .filter(Boolean);
}


/* ============================================================
   NORMAL PLACE SEARCH
============================================================ */

async function searchPlace(query) {

  setStatus(
    "Ort wird gesucht …",
    "loading"
  );

  searchButton.disabled = true;

  try {

    const result =
      await geocodeOne(query);

    map.setView(
      [result.lat, result.lon],
      13,
      {
        animate: true
      }
    );

    /*
     * WICHTIG:
     * Bei normaler Ortssuche KEINE automatische
     * Skatepark-Suche.
     */

    setStatus(
      result.displayName,
      "success"
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "Ort konnte nicht gefunden werden.",
      "error"
    );

  } finally {
    searchButton.disabled = false;
  }
}


/* ============================================================
   ROUTE INPUTS
============================================================ */

function getRouteInputs() {
  return [
    ...document.querySelectorAll(".routeInput")
  ];
}


function getRouteValues() {

  return getRouteInputs()
    .map(input => input.value.trim())
    .filter(Boolean);
}


function createRouteInput(
  placeholder = "Zwischenstopp"
) {

  const row =
    document.createElement("div");

  row.className = "routeRow";

  const input =
    document.createElement("input");

  input.className = "routeInput";
  input.type = "text";
  input.placeholder = placeholder;

  const remove =
    document.createElement("button");

  remove.className = "removeStop";
  remove.type = "button";
  remove.textContent = "×";
  remove.title = "Zwischenstopp entfernen";

  remove.addEventListener(
    "click",
    () => {
      row.remove();
      updateRemoveButtons();
    }
  );

  row.appendChild(input);
  row.appendChild(remove);

  routeFields.appendChild(row);

  updateRemoveButtons();

  input.focus();
}


function updateRemoveButtons() {

  const rows =
    [...routeFields.children];

  rows.forEach(
    (row, index) => {

      const button =
        row.querySelector(".removeStop");

      if (!button) {
        return;
      }

      /*
       * Start und Ziel bleiben erhalten.
       * Zusätzliche Zwischenstopps können gelöscht werden.
       */
      if (
        index === 0 ||
        index === rows.length - 1
      ) {
        button.style.visibility =
          "hidden";
      } else {
        button.style.visibility =
          "visible";
      }
    }
  );
}


/* ============================================================
   ROUTE
============================================================ */

async function searchRoute(
  routeNames
) {

  if (routeNames.length < 2) {
    setStatus(
      "Bitte mindestens Start und Ziel eingeben.",
      "error"
    );

    return;
  }


  routeSearchButton.disabled = true;
  searchButton.disabled = true;

  setStatus(
    "Route wird berechnet …",
    "loading"
  );


  try {

    /*
     * Alle Geocoding-Anfragen parallel.
     */
    const coordinates =
      await Promise.all(
        routeNames.map(
          name => geocodeOne(name)
        )
      );


    /*
     * EIN OSRM-Request für die komplette Route.
     */
    const coordinateString =
      coordinates
        .map(
          p => `${p.lon},${p.lat}`
        )
        .join(";");


    const url =
      OSRM_URL +
      coordinateString +
      "?" +
      new URLSearchParams({
        overview: "full",
        geometries: "geojson",
        steps: "false",
        alternatives: "false"
      }).toString();


    const response =
      await fetchWithTimeout(
        url,
        {
          headers: {
            "Accept": "application/json"
          }
        },
        ROUTE_TIMEOUT
      );


    const data =
      await response.json();


    if (
      data.code !== "Ok" ||
      !data.routes ||
      !data.routes.length
    ) {
      throw new Error(
        "Keine Route gefunden."
      );
    }


    const route =
      data.routes[0];


    currentRoute = {
      geometry:
        route.geometry,

      distance:
        route.distance,

      duration:
        route.duration,

      stops:
        coordinates
    };


    /*
     * Alte Route entfernen.
     */
    if (routeLayer) {
      map.removeLayer(routeLayer);
    }


    routeLayer =
      L.geoJSON(
        route.geometry,
        {
          style: {
            weight: 5,
            opacity: .9
          }
        }
      ).addTo(map);


    routeMarkerLayer.clearLayers();


    coordinates.forEach(
      (point, index) => {

        const marker =
          L.marker(
            [point.lat, point.lon],
            {
              icon:
                L.divIcon({
                  className: "",
                  html:
                    '<div class="route-marker"></div>',
                  iconSize: [15, 15],
                  iconAnchor: [7.5, 7.5]
                })
            }
          );


        marker.bindTooltip(
          routeNames[index],
          {
            direction: "top"
          }
        );


        marker.addTo(
          routeMarkerLayer
        );
      }
    );


    map.fitBounds(
      routeLayer.getBounds(),
      {
        padding: [35, 35]
      }
    );


    routeParksButton.style.display =
      "block";


    const km =
      route.distance / 1000;

    const minutes =
      route.duration / 60;


    setStatus(
      `Route: ${km.toFixed(0)} km · ` +
      `${Math.round(minutes)} min`,
      "success"
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "Route konnte nicht berechnet werden.",
      "error"
    );

  } finally {

    routeSearchButton.disabled =
      false;

    searchButton.disabled =
      false;
  }
}


/* ============================================================
   DISTANCE MATH
============================================================ */

const EARTH_RADIUS =
  6371008.8;


function toRad(degrees) {
  return degrees * Math.PI / 180;
}


function haversineDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const p1 =
    toRad(lat1);

  const p2 =
    toRad(lat2);

  const dLat =
    toRad(lat2 - lat1);

  const dLon =
    toRad(lon2 - lon1);


  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon / 2) ** 2;


  return (
    EARTH_RADIUS *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );
}


/*
 * Distanz Punkt -> Liniensegment.
 *
 * Für lokale Bereiche reicht eine lokale
 * equirectangular Projektion sehr gut.
 */
function pointToSegmentDistance(
  point,
  a,
  b
) {

  const lat0 =
    toRad(
      (point.lat + a.lat + b.lat) / 3
    );


  const cosLat =
    Math.cos(lat0);


  const x =
    toRad(point.lon) *
    cosLat *
    EARTH_RADIUS;


  const y =
    toRad(point.lat) *
    EARTH_RADIUS;


  const ax =
    toRad(a.lon) *
    cosLat *
    EARTH_RADIUS;


  const ay =
    toRad(a.lat) *
    EARTH_RADIUS;


  const bx =
    toRad(b.lon) *
    cosLat *
    EARTH_RADIUS;


  const by =
    toRad(b.lat) *
    EARTH_RADIUS;


  const dx =
    bx - ax;

  const dy =
    by - ay;


  if (
    dx === 0 &&
    dy === 0
  ) {
    return Math.hypot(
      x - ax,
      y - ay
    );
  }


  const t =
    Math.max(
      0,
      Math.min(
        1,
        (
          (x - ax) * dx +
          (y - ay) * dy
        ) /
        (dx * dx + dy * dy)
      )
    );


  const px =
    ax + t * dx;

  const py =
    ay + t * dy;


  return Math.hypot(
    x - px,
    y - py
  );
}


function distanceToRoute(
  point,
  coordinates
) {

  let minimum =
    Infinity;

  let bestSegment = 0;

  for (
    let i = 0;
    i < coordinates.length - 1;
    i++
  ) {

    const distance =
      pointToSegmentDistance(
        point,
        coordinates[i],
        coordinates[i + 1]
      );

    if (
      distance < minimum
    ) {
      minimum = distance;
      bestSegment = i;
    }
  }


  return {
    distance: minimum,
    segment: bestSegment
  };
}


/* ============================================================
   ROUTE PROGRESS
============================================================ */

function calculateRouteProgress(
  point,
  coordinates
) {

  let bestDistance =
    Infinity;

  let progress =
    0;


  for (
    let i = 0;
    i < coordinates.length - 1;
    i++
  ) {

    const a =
      coordinates[i];

    const b =
      coordinates[i + 1];


    const distance =
      pointToSegmentDistance(
        point,
        a,
        b
      );


    if (
      distance < bestDistance
    ) {

      bestDistance =
        distance;

      const segmentLength =
        haversineDistance(
          a.lat,
          a.lon,
          b.lat,
          b.lon
        );


      progress =
        i + 0.5;

      /*
       * Kleine Approximation reicht zur
       * Sortierung entlang der Route.
       */
      if (segmentLength > 0) {

        const localA =
          haversineDistance(
            a.lat,
            a.lon,
            point.lat,
            point.lon
          );

        const localB =
          haversineDistance(
            point.lat,
            point.lon,
            b.lat,
            b.lon
          );

        const ratio =
          localA /
          (
            localA +
            localB
          );

        progress =
          i + ratio;
      }
    }
  }


  return progress;
}


/* ============================================================
   BOUNDING BOX
============================================================ */

function getRouteBoundingBox(
  geometry,
  paddingKm
) {

  const coordinates =
    geometry.coordinates;


  let minLat = Infinity;
  let minLon = Infinity;

  let maxLat = -Infinity;
  let maxLon = -Infinity;


  for (
    const coordinate of coordinates
  ) {

    const lon =
      Number(coordinate[0]);

    const lat =
      Number(coordinate[1]);


    minLat =
      Math.min(minLat, lat);

    maxLat =
      Math.max(maxLat, lat);

    minLon =
      Math.min(minLon, lon);

    maxLon =
      Math.max(maxLon, lon);
  }


  const centerLat =
    (minLat + maxLat) / 2;


  const latPadding =
    paddingKm / 111;


  const lonPadding =
    paddingKm /
    (
      111 *
      Math.cos(
        toRad(centerLat)
      )
    );


  return {
    south:
      minLat - latPadding,

    west:
      minLon - lonPadding,

    north:
      maxLat + latPadding,

    east:
      maxLon + lonPadding
  };
}


/* ============================================================
   SKATEPARK FILTER
============================================================ */

const BAD_WORDS = [
  "spielplatz",
  "playground",
  "kinderspielplatz",
  "pumptrack",
  "bmx",
  "minigolf",
  "bolzplatz",
  "fussball",
  "fußball",
  "soccer",
  "basketball",
  "volleyball",
  "fitness",
  "parcours"
];


const SKATE_WORDS = [
  "skate",
  "skater",
  "skatepark",
  "skateplatz",
  "skateanlage",
  "skatehalle",
  "skatepark",
  "skating"
];


function isBadPark(tags) {

  const text =
    normalizeText([
      tags?.name,
      tags?.description,
      tags?.sport
    ].join(" "));


  return BAD_WORDS.some(
    word =>
      text.includes(
        normalizeText(word)
      )
  );
}


function isLikelySkatepark(tags) {

  if (!tags) {
    return false;
  }


  if (isBadPark(tags)) {
    return false;
  }


  /*
   * Der wichtigste Fall.
   */
  if (
    tags.leisure === "skatepark"
  ) {
    return true;
  }


  const text =
    normalizeText([
      tags.name,
      tags.description,
      tags.note
    ].join(" "));


  /*
   * sport=skateboard alleine reicht NICHT.
   */
  if (
    tags.sport === "skateboard"
  ) {

    return SKATE_WORDS.some(
      word =>
        text.includes(
          normalizeText(word)
        )
    );
  }


  return SKATE_WORDS.some(
    word =>
      text.includes(
        normalizeText(word)
      )
  );
}


/* ============================================================
   OSM ELEMENT -> PARK
============================================================ */

function osmElementToPark(
  element
) {

  const tags =
    element.tags || {};


  let lat =
    Number(element.lat);

  let lon =
    Number(element.lon);


  /*
   * Ways/Relations können Geometrie statt
   * lat/lon besitzen.
   */
  if (
    (!Number.isFinite(lat) ||
     !Number.isFinite(lon)) &&
    Array.isArray(element.geometry) &&
    element.geometry.length
  ) {

    let sumLat = 0;
    let sumLon = 0;
    let count = 0;


    for (
      const point of element.geometry
    ) {

      if (
        Number.isFinite(point.lat) &&
        Number.isFinite(point.lon)
      ) {

        sumLat += point.lat;
        sumLon += point.lon;
        count++;
      }
    }


    if (count) {
      lat = sumLat / count;
      lon = sumLon / count;
    }
  }


  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ) {
    return null;
  }


  if (
    !isLikelySkatepark(tags)
  ) {
    return null;
  }


  return {
    id:
      `osm-${element.type}-${element.id}`,

    osmId:
      element.id,

    type:
      element.type,

    name:
      tags.name ||
      "Skatepark",

    lat,
    lon,

    tags,

    area:
      estimateArea(element),

    lighting:
      tags.lit === "yes"
        ? "Ja"
        : tags.lit === "no"
          ? "Nein"
          : "unbekannt",

    surface:
      tags.surface ||
      "unbekannt"
  };
}


/* ============================================================
   AREA ESTIMATION
============================================================ */

function estimateArea(
  element
) {

  if (
    element.type !== "way" ||
    !Array.isArray(element.geometry) ||
    element.geometry.length < 4
  ) {
    return null;
  }


  const first =
    element.geometry[0];

  const last =
    element.geometry[
      element.geometry.length - 1
    ];


  if (
    !first ||
    !last ||
    first.lat !== last.lat ||
    first.lon !== last.lon
  ) {
    return null;
  }


  const lat0 =
    toRad(first.lat);


  const cosLat =
    Math.cos(lat0);


  const points =
    element.geometry.map(
      point => ({
        x:
          toRad(point.lon) *
          EARTH_RADIUS *
          cosLat,

        y:
          toRad(point.lat) *
          EARTH_RADIUS
      })
    );


  let area = 0;


  for (
    let i = 0;
    i < points.length - 1;
    i++
  ) {

    area +=
      points[i].x *
      points[i + 1].y -
      points[i + 1].x *
      points[i].y;
  }


  area =
    Math.abs(area) / 2;


  if (
    !Number.isFinite(area) ||
    area < 5
  ) {
    return null;
  }


  return area;
}


/* ============================================================
   OVERPASS QUERY
============================================================ */

function buildOverpassQuery(
  south,
  west,
  north,
  east
) {

  /*
   * Nur die wichtigsten Tags + Geometrie.
   *
   * Kein riesiger Kreis-Multipolygon-Query.
   * Eine einzige Bounding Box ist deutlich einfacher
   * und schneller.
   */

  return `
[out:json][timeout:8];

(
  nwr["leisure"="skatepark"](
    ${south},
    ${west},
    ${north},
    ${east}
  );

  nwr["sport"="skateboard"](
    ${south},
    ${west},
    ${north},
    ${east}
  );
);

out geom tags;
`;
}


/* ============================================================
   OVERPASS PARALLEL
============================================================ */

async function queryOverpassFast(
  query,
  totalSignal
) {

  /*
   * Beide Server starten parallel.
   *
   * Sobald einer erfolgreich ist,
   * verwenden wir dessen Antwort.
   */

  const requests =
    OVERPASS_ENDPOINTS.map(
      endpoint =>
        fetchWithTimeout(
          endpoint,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "data=" +
              encodeURIComponent(query)
          },

          OVERPASS_TIMEOUT,

          totalSignal
        )
        .then(
          response =>
            response.json()
        )
    );


  /*
   * Der erste erfolgreiche Server gewinnt.
   */
  return Promise.any(
    requests
  );
}


/* ============================================================
   PARK SEARCH AROUND MAP
============================================================ */

async function searchLocalParks() {

  if (
    currentSearchController
  ) {
    currentSearchController.abort();
  }


  currentSearchController =
    new AbortController();


  const totalTimer =
    setTimeout(
      () =>
        currentSearchController.abort(),
      PARK_SEARCH_TIMEOUT
    );


  findParksButton.disabled =
    true;


  setStatus(
    `Skateparks im Radius von ${selectedRadiusKm} km werden gesucht …`,
    "loading"
  );


  try {

    const center =
      map.getCenter();


    const radius =
      selectedRadiusKm;


    const latPadding =
      radius / 111;


    const lonPadding =
      radius /
      (
        111 *
        Math.cos(
          toRad(center.lat)
        )
      );


    const south =
      Math.max(
        -85,
        center.lat - latPadding
      );

    const north =
      Math.min(
        85,
        center.lat + latPadding
      );

    const west =
      center.lng - lonPadding;

    const east =
      center.lng + lonPadding;


    /*
     * Cache-Key auf ca. 1 km Raster.
     */
    const cacheLat =
      Math.round(center.lat * 100) / 100;

    const cacheLon =
      Math.round(center.lng * 100) / 100;


    const cacheKey =
      `local:${cacheLat}:${cacheLon}:${radius}`;


    if (
      parkSearchCache.has(cacheKey)
    ) {

      const cached =
        parkSearchCache.get(cacheKey);

      displayParks(
        cached,
        center
      );

      setStatus(
        `${cached.length} Skateparks gefunden.`,
        "success"
      );

      return;
    }


    const query =
      buildOverpassQuery(
        south,
        west,
        north,
        east
      );


    const data =
      await queryOverpassFast(
        query,
        currentSearchController.signal
      );


    const parks =
      dedupeParks(
        (data.elements || [])
          .map(osmElementToPark)
          .filter(Boolean)
      );


    /*
     * Exakte Distanz zum Kartenzentrum.
     */
    const enriched =
      parks
        .map(park => ({
          ...park,

          distance:
            haversineDistance(
              center.lat,
              center.lng,
              park.lat,
              park.lon
            )
        }))
        .filter(
          park =>
            park.distance <=
            selectedRadiusKm * 1000
        );


    /*
     * Größere Parks zuerst.
     * Parks ohne Fläche kommen danach.
     */
    enriched.sort(
      (a, b) => {

        const areaA =
          a.area ?? -1;

        const areaB =
          b.area ?? -1;

        if (
          areaA !== areaB
        ) {
          return areaB - areaA;
        }

        return (
          a.distance -
          b.distance
        );
      }
    );


    const limited =
      enriched.slice(0, 15);


    parkSearchCache.set(
      cacheKey,
      limited
    );


    displayParks(
      limited,
      center
    );


    const total =
      enriched.length;


    if (
      total > 15
    ) {

      setStatus(
        `15 von ${total} Skateparks angezeigt.`,
        "success"
      );

    } else {

      setStatus(
        `${total} Skateparks gefunden.`,
        "success"
      );
    }


  } catch (error) {

    if (
      error.name === "AbortError"
    ) {

      setStatus(
        "Skatepark-Suche nach 10 Sekunden abgebrochen. Bitte erneut versuchen.",
        "error"
      );

    } else {

      console.error(error);

      setStatus(
        "Skateparks konnten gerade nicht geladen werden. Bitte erneut versuchen.",
        "error"
      );
    }

  } finally {

    clearTimeout(
      totalTimer
    );

    findParksButton.disabled =
      false;

    currentSearchController =
      null;
  }
}


/* ============================================================
   PARK DEDUPLICATION
============================================================ */

function dedupeParks(
  parks
) {

  const byId =
    new Map();


  for (
    const park of parks
  ) {

    const existing =
      byId.get(park.id);


    if (!existing) {

      byId.set(
        park.id,
        park
      );

      continue;
    }


    /*
     * Wenn einmal ein Objekt mit Name
     * vorhanden ist, behalten wir es.
     */
    if (
      existing.name === "Skatepark" &&
      park.name !== "Skatepark"
    ) {
      byId.set(
        park.id,
        park
      );
    }
  }


  /*
   * Zusätzliche geografische Duplikate.
   */
  const result = [];


  for (
    const park of byId.values()
  ) {

    const duplicate =
      result.some(
        existing =>
          haversineDistance(
            park.lat,
            park.lon,
            existing.lat,
            existing.lon
          ) < 25 &&
          normalizeText(park.name) ===
          normalizeText(existing.name)
      );


    if (!duplicate) {
      result.push(park);
    }
  }


  return result;
}


/* ============================================================
   PARK POPUP
============================================================ */

function parkPopup(
  park
) {

  const distance =
    park.distance != null
      ? `${(
          park.distance / 1000
        ).toFixed(1)} km`
      : "–";


  const size =
    park.area != null
      ? `${Math.round(
          park.area
        ).toLocaleString("de-DE")} m² geschätzt`
      : "nicht angegeben";


  return `
    <div class="parkPopup">

      <div class="parkPopupName">
        ${escapeHtml(park.name)}
      </div>

      <div class="parkPopupLine">
        <strong>Entfernung:</strong>
        ${escapeHtml(distance)}
      </div>

      <div class="parkPopupLine">
        <strong>Größe:</strong>
        ${escapeHtml(size)}
      </div>

      <div class="parkPopupLine">
        <strong>Beleuchtung:</strong>
        ${escapeHtml(park.lighting)}
      </div>

      <div class="parkPopupLine">
        <strong>Belag:</strong>
        ${escapeHtml(park.surface)}
      </div>

    </div>
  `;
}


/* ============================================================
   DISPLAY PARKS
============================================================ */

function displayParks(
  parks,
  referencePoint = null
) {

  parkLayer.clearLayers();


  if (
    referencePoint
  ) {

    parks.forEach(
      park => {

        if (
          park.distance == null
        ) {

          park.distance =
            haversineDistance(
              referencePoint.lat,
              referencePoint.lng,
              park.lat,
              park.lon
            );
        }
      }
    );
  }


  for (
    const park of parks
  ) {

    const marker =
      L.marker(
        [park.lat, park.lon],
        {
          icon:
            L.divIcon({
              className: "",
              html:
                '<div class="skatepark-marker"></div>',
              iconSize: [17, 17],
              iconAnchor: [8.5, 8.5]
            })
        }
      );


    marker.bindPopup(
      parkPopup(park),
      {
        maxWidth: 280
      }
    );


    marker.addTo(
      parkLayer
    );
  }


  parkCountElement.textContent =
    parks.length
      ? `${parks.length}`
      : "";
}


/* ============================================================
   SKATEPARKS ALONG ROUTE
============================================================ */

async function searchRouteParks() {

  if (
    !currentRoute ||
    !currentRoute.geometry
  ) {

    setStatus(
      "Bitte zuerst eine Route suchen.",
      "error"
    );

    return;
  }


  if (
    currentSearchController
  ) {
    currentSearchController.abort();
  }


  currentSearchController =
    new AbortController();


  const totalTimer =
    setTimeout(
      () =>
        currentSearchController.abort(),
      PARK_SEARCH_TIMEOUT
    );


  routeParksButton.disabled =
    true;


  setStatus(
    "Skateparks entlang der Route werden gesucht …",
    "loading"
  );


  try {

    /*
     * Route komplett als Linie betrachten.
     */
    const geometry =
      currentRoute.geometry;


    const bbox =
      getRouteBoundingBox(
        geometry,
        selectedRadiusKm
      );


    const query =
      buildOverpassQuery(
        bbox.south,
        bbox.west,
        bbox.north,
        bbox.east
      );


    const data =
      await queryOverpassFast(
        query,
        currentSearchController.signal
      );


    const parks =
      dedupeParks(
        (data.elements || [])
          .map(osmElementToPark)
          .filter(Boolean)
      );


    /*
     * GeoJSON-Koordinaten:
     * [lon, lat]
     */
    const routeCoordinates =
      geometry.coordinates.map(
        coordinate => ({
          lon:
            Number(coordinate[0]),

          lat:
            Number(coordinate[1])
        })
      );


    const enriched =
      [];


    for (
      const park of parks
    ) {

      const nearest =
        distanceToRoute(
          park,
          routeCoordinates
        );


      if (
        nearest.distance >
        selectedRadiusKm * 1000
      ) {
        continue;
      }


      enriched.push({
        ...park,

        distanceToRoute:
          nearest.distance,

        routeProgress:
          calculateRouteProgress(
            park,
            routeCoordinates
          )
      });
    }


    /*
     * Entlang der Route sortieren.
     */
    enriched.sort(
      (a, b) =>
        a.routeProgress -
        b.routeProgress
    );


    /*
     * Verteilung entlang der Route:
     * Wir vermeiden, dass alle 15 Parks nur
     * aus einem einzigen Stadtgebiet kommen.
     */
    const selected =
      selectDistributedParks(
        enriched,
        15
      );


    displayRouteParks(
      selected
    );


    if (
      enriched.length > 15
    ) {

      setStatus(
        `15 von ${enriched.length} Skateparks entlang der Route angezeigt.`,
        "success"
      );

    } else {

      setStatus(
        `${enriched.length} Skateparks entlang der Route gefunden.`,
        "success"
      );
    }


  } catch (error) {

    if (
      error.name === "AbortError"
    ) {

      setStatus(
        "Skatepark-Suche nach 10 Sekunden abgebrochen. Bitte erneut versuchen.",
        "error"
      );

    } else {

      console.error(error);

      setStatus(
        "Skateparks entlang der Route konnten nicht geladen werden.",
        "error"
      );
    }

  } finally {

    clearTimeout(
      totalTimer
    );

    routeParksButton.disabled =
      false;

    currentSearchController =
      null;
  }
}


/* ============================================================
   DISTRIBUTE PARKS ALONG ROUTE
============================================================ */

function selectDistributedParks(
  parks,
  maximum
) {

  if (
    parks.length <= maximum
  ) {
    return parks;
  }


  const result = [];

  const used =
    new Set();


  /*
   * 15 Fortschrittsbereiche.
   */
  for (
    let i = 0;
    i < maximum;
    i++
  ) {

    const target =
      i /
      (maximum - 1);


    let best = null;
    let bestScore = Infinity;


    for (
      const park of parks
    ) {

      if (
        used.has(park.id)
      ) {
        continue;
      }


      const normalized =
        parks.length > 1
          ? park.routeProgress /
            (
              parks[
                parks.length - 1
              ].routeProgress || 1
            )
          : 0;


      const score =
        Math.abs(
          normalized - target
        );


      if (
        score < bestScore
      ) {
        bestScore = score;
        best = park;
      }
    }


    if (best) {
      result.push(best);
      used.add(best.id);
    }
  }


  return result;
}


/* ============================================================
   DISPLAY ROUTE PARKS
============================================================ */

function displayRouteParks(
  parks
) {

  parkLayer.clearLayers();


  for (
    const park of parks
  ) {

    park.distance =
      park.distanceToRoute;


    const marker =
      L.marker(
        [park.lat, park.lon],
        {
          icon:
            L.divIcon({
              className: "",
              html:
                '<div class="skatepark-marker"></div>',
              iconSize: [17, 17],
              iconAnchor: [8.5, 8.5]
            })
        }
      );


    marker.bindPopup(
      parkPopup(park),
      {
        maxWidth: 280
      }
    );


    marker.addTo(
      parkLayer
    );
  }


  parkCountElement.textContent =
    parks.length
      ? `${parks.length}`
      : "";
}


/* ============================================================
   MAIN SEARCH
============================================================ */

async function runMainSearch() {

  const query =
    mainSearch.value.trim();


  if (!query) {
    return;
  }


  if (
    looksLikeRoute(query)
  ) {

    const stops =
      parseUnifiedRoute(query);


    /*
     * Route-Felder synchronisieren.
     */
    routeFields.innerHTML = "";


    stops.forEach(
      (stop, index) => {

        const row =
          document.createElement("div");

        row.className =
          "routeRow";


        const input =
          document.createElement("input");

        input.className =
          "routeInput";

        input.type =
          "text";

        input.value =
          stop;

        input.placeholder =
          index === 0
            ? "Start"
            : index === stops.length - 1
              ? "Ziel"
              : "Zwischenstopp";


        const remove =
          document.createElement("button");

        remove.className =
          "removeStop";

        remove.type =
          "button";

        remove.textContent =
          "×";


        remove.addEventListener(
          "click",
          () => {

            row.remove();

            updateRemoveButtons();
          }
        );


        row.appendChild(input);

        row.appendChild(remove);

        routeFields.appendChild(row);
      }
    );


    updateRemoveButtons();

    await searchRoute(stops);

    return;
  }


  await searchPlace(query);
}
