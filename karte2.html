<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SkateRoute 🛹</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      color: #ccc;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 15px;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr 180px auto auto;
      gap: 10px;
    }

    label {
      font-size: 13px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      height: 45px;
      border-radius: 9px;
      border: 1px solid #ccc;
      padding: 8px 12px;
      font-size: 16px;
    }

    input,
    select {
      margin-top: 5px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    .route-button {
      background: #111;
      color: white;
    }

    .city-button {
      background: white;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 15px;
    }

    #map {
      height: 650px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .sidebar {
      background: white;
      border-radius: 14px;
      padding: 15px;
      max-height: 650px;
      overflow-y: auto;
    }

    .sidebar h2 {
      margin-top: 0;
    }

    #status {
      color: #666;
      margin-bottom: 10px;
    }

    .park {
      padding: 13px 5px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .park:hover {
      background: #f5f5f5;
    }

    .park-name {
      font-weight: bold;
    }

    .park-city {
      color: #777;
      font-size: 14px;
      margin-top: 4px;
    }

    .distance {
      display: inline-block;
      background: #eee;
      border-radius: 20px;
      padding: 4px 8px;
      font-size: 12px;
      margin-top: 6px;
    }

    .error {
      color: #c00 !important;
    }

    @media (max-width: 900px) {
      .search-box {
        grid-template-columns: 1fr 1fr;
      }

      .content {
        grid-template-columns: 1fr;
      }

      .sidebar {
        max-height: none;
      }
    }

    @media (max-width: 550px) {
      .search-box {
        grid-template-columns: 1fr;
      }

      #map {
        height: 450px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <h1>🛹 SkateRoute</h1>
    <p>Routen planen und Skateparks entlang der Strecke entdecken.</p>
  </div>
</header>

<div class="container">

  <form id="routeForm" class="search-box">

    <label>
      Start
      <input
        id="start"
        type="text"
        value="Karlsruhe"
        placeholder="z. B. Karlsruhe"
      >
    </label>

    <label>
      Ziel
      <input
        id="destination"
        type="text"
        value="München"
        placeholder="z. B. München"
      >
    </label>

    <label>
      Radius
      <select id="radius">
        <option value="1">1 km</option>
        <option value="5">5 km</option>
        <option value="10" selected>10 km</option>
        <option value="25">25 km</option>
        <option value="50">50 km</option>
      </select>
    </label>

    <button class="route-button" type="submit">
      🗺️ Route suchen
    </button>

    <button class="city-button" type="button" id="cityButton">
      🏙️ Stadt suchen
    </button>

  </form>

  <div class="content">

    <div id="map"></div>

    <aside class="sidebar">

      <h2>🛹 Skateparks</h2>

      <div id="status">
        Wähle eine Route oder suche nach einer Stadt.
      </div>

      <div id="parkList"></div>

    </aside>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const skateparks = [

  {
    name: "Skatepark ODP",
    city: "Karlsruhe",
    country: "Deutschland",
    lat: 49.0092,
    lon: 8.4210,
    description: "Skatepark ODP in Karlsruhe"
  },

  {
    name: "Skatepark Heidelberg",
    city: "Heidelberg",
    country: "Deutschland",
    lat: 49.3774,
    lon: 8.6773,
    description: "Skateanlage in Heidelberg"
  },

  {
    name: "Skatepark München",
    city: "München",
    country: "Deutschland",
    lat: 48.1351,
    lon: 11.5820,
    description: "Skatepark in München"
  },

  {
    name: "Skatepark Magdeburg",
    city: "Magdeburg",
    country: "Deutschland",
    lat: 52.1518,
    lon: 11.5805,
    description: "Skatepark in Magdeburg"
  },

  {
    name: "Skatepark Fehmarn",
    city: "Fehmarn",
    country: "Deutschland",
    lat: 54.4378,
    lon: 11.1936,
    description: "Skatepark auf Fehmarn"
  },

  {
    name: "Skatepark Parc des Sports",
    city: "Perpignan",
    country: "Frankreich",
    lat: 42.6880,
    lon: 2.8940,
    description: "Skatepark im Bereich Parc des Sports"
  },

  {
    name: "389 Park Indoor",
    city: "Valence",
    country: "Frankreich",
    lat: 44.9216,
    lon: 4.8954,
    description: "Indoor-Skatepark in Valence"
  }

];


// --------------------------------------------------
// KARTE
// --------------------------------------------------

const map = L.map("map").setView(
  [49.0, 8.4],
  6
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);


// --------------------------------------------------
// LAYER
// --------------------------------------------------

const parkLayer = L.layerGroup().addTo(map);

const routeLayer = L.layerGroup().addTo(map);

const radiusLayer = L.layerGroup().addTo(map);

let startMarker = null;
let destinationMarker = null;


// --------------------------------------------------
// SKATEPARK ICON
// --------------------------------------------------

function skateIcon() {

  return L.divIcon({

    className: "",

    html: `
      <div style="
        width:32px;
        height:32px;
        border-radius:50%;
        background:#111;
        border:3px solid white;
        box-shadow:0 2px 6px #555;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:17px;
      ">
        🛹
      </div>
    `,

    iconSize: [32, 32],
    iconAnchor: [16, 16]

  });

}


// --------------------------------------------------
// HTML SICHER MACHEN
// --------------------------------------------------

function escapeHtml(text) {

  return String(text).replace(
    /[&<>"']/g,

    function(character) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[character];

    }
  );

}


// --------------------------------------------------
// PARKS ANZEIGEN
// --------------------------------------------------

function showParks(parks) {

  parkLayer.clearLayers();

  const list =
    document.getElementById("parkList");

  list.innerHTML = "";

  parks.forEach(park => {

    const marker =
      L.marker(
        [park.lat, park.lon],
        {
          icon: skateIcon()
        }
      )
      .addTo(parkLayer);

    marker.bindPopup(`
      <strong>🛹 ${escapeHtml(park.name)}</strong>
      <br>
      ${escapeHtml(park.city)},
      ${escapeHtml(park.country)}
      <br><br>
      ${escapeHtml(park.description)}
    `);


    const item =
      document.createElement("div");

    item.className = "park";

    item.innerHTML = `

      <div class="park-name">
        🛹 ${escapeHtml(park.name)}
      </div>

      <div class="park-city">
        ${escapeHtml(park.city)},
        ${escapeHtml(park.country)}
      </div>

      ${
        park.distance !== undefined
        ?
        `<div class="distance">
          ${park.distance.toFixed(1)} km
        </div>`
        :
        ""
      }

    `;


    item.addEventListener(
      "click",
      function() {

        map.setView(
          [park.lat, park.lon],
          14
        );

        marker.openPopup();

      }
    );


    list.appendChild(item);

  });

}


// --------------------------------------------------
// ORT SUCHEN
// --------------------------------------------------

async function geocode(search) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=jsonv2" +
    "&limit=1" +
    "&accept-language=de" +
    "&q=" +
    encodeURIComponent(search);


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "Ortssuche momentan nicht verfügbar."
    );

  }


  const data =
    await response.json();


  if (!data.length) {

    throw new Error(
      "Ort wurde nicht gefunden: " + search
    );

  }


  return {

    lat: Number(data[0].lat),

    lon: Number(data[0].lon),

    name: data[0].display_name

  };

}


// --------------------------------------------------
// ROUTE
// --------------------------------------------------

async function getRoute(start, destination) {

  const url =
    `https://router.project-osrm.org/route/v1/driving/` +
    `${start.lon},${start.lat};` +
    `${destination.lon},${destination.lat}` +
    `?overview=full&geometries=geojson`;


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "Routing momentan nicht verfügbar."
    );

  }


  const data =
    await response.json();


  if (
    data.code !== "Ok" ||
    !data.routes ||
    !data.routes.length
  ) {

    throw new Error(
      "Keine Route gefunden."
    );

  }


  return data.routes[0];

}


// --------------------------------------------------
// DISTANZ ZUM ROUTENVERLAUF
// --------------------------------------------------

function pointToSegmentDistance(
  point,
  a,
  b
) {

  const latitudeScale = 111.32;

  const longitudeScale =
    111.32 *
    Math.cos(
      point.lat * Math.PI / 180
    );


  const px =
    point.lon * longitudeScale;

  const py =
    point.lat * latitudeScale;


  const ax =
    a.lon * longitudeScale;

  const ay =
    a.lat * latitudeScale;


  const bx =
    b.lon * longitudeScale;

  const by =
    b.lat * latitudeScale;


  const dx = bx - ax;

  const dy = by - ay;


  const lengthSquared =
    dx * dx + dy * dy;


  let t = 0;


  if (lengthSquared !== 0) {

    t =
      (
        (px - ax) * dx +
        (py - ay) * dy
      )
      /
      lengthSquared;

  }


  t =
    Math.max(
      0,
      Math.min(1, t)
    );


  const closestX =
    ax + t * dx;

  const closestY =
    ay + t * dy;


  return Math.hypot(
    px - closestX,
    py - closestY
  );

}


function distanceToRoute(
  park,
  routeCoordinates
) {

  let shortest =
    Infinity;


  for (
    let i = 1;
    i < routeCoordinates.length;
    i++
  ) {

    shortest =
      Math.min(
        shortest,

        pointToSegmentDistance(
          park,
          routeCoordinates[i - 1],
          routeCoordinates[i]
        )
      );

  }


  return shortest;

}


// --------------------------------------------------
// DISTANZ ZWISCHEN ZWEI PUNKTEN
// --------------------------------------------------

function distanceBetween(a, b) {

  const earthRadius = 6371;

  const lat1 =
    a.lat * Math.PI / 180;

  const lat2 =
    b.lat * Math.PI / 180;


  const deltaLat =
    (b.lat - a.lat) *
    Math.PI / 180;

  const deltaLon =
    (b.lon - a.lon) *
    Math.PI / 180;


  const x =
    Math.sin(deltaLat / 2) ** 2 +
    Math.cos(lat1) *
    Math.cos(lat2) *
    Math.sin(deltaLon / 2) ** 2;


  return (
    earthRadius *
    2 *
    Math.atan2(
      Math.sqrt(x),
      Math.sqrt(1 - x)
    )
  );

}


// --------------------------------------------------
// STATUS
// --------------------------------------------------

function status(text, error = false) {

  const element =
    document.getElementById("status");

  element.textContent = text;

  element.className =
    error ? "error" : "";

}


// --------------------------------------------------
// ROUTE SUCHEN
// --------------------------------------------------

async function searchRoute() {

  const startText =
    document
      .getElementById("start")
      .value
      .trim();


  const destinationText =
    document
      .getElementById("destination")
      .value
      .trim();


  const radius =
    Number(
      document
        .getElementById("radius")
        .value
    );


  if (
    !startText ||
    !destinationText
  ) {

    status(
      "Bitte Start und Ziel eingeben.",
      true
    );

    return;

  }


  status(
    "Route wird berechnet …"
  );


  routeLayer.clearLayers();

  radiusLayer.clearLayers();


  try {

    const [
      start,
      destination
    ] =
      await Promise.all([

        geocode(startText),

        geocode(destinationText)

      ]);


    const route =
      await getRoute(
        start,
        destination
      );


    const coordinates =
      route.geometry.coordinates.map(
        coordinate => [
          coordinate[1],
          coordinate[0]
        ]
      );


    L.polyline(
      coordinates,
      {
        color: "#f97316",
        weight: 6,
        opacity: 0.9
      }
    ).addTo(routeLayer);


    if (startMarker) {

      map.removeLayer(
        startMarker
      );

    }


    if (destinationMarker) {

      map.removeLayer(
        destinationMarker
      );

    }


    startMarker =
      L.marker([
        start.lat,
        start.lon
      ])
      .addTo(map)
      .bindPopup(
        "<strong>Start</strong><br>" +
        escapeHtml(start.name)
      );


    destinationMarker =
      L.marker([
        destination.lat,
        destination.lon
      ])
      .addTo(map)
      .bindPopup(
        "<strong>Ziel</strong><br>" +
        escapeHtml(destination.name)
      );


    const matchingParks =
      skateparks

        .map(
          park => ({

            ...park,

            distance:
              distanceToRoute(
                park,
                coordinates
              )

          })
        )

        .filter(
          park =>
            park.distance <= radius
        )

        .sort(
          (a, b) =>
            a.distance - b.distance
        );


    showParks(
      matchingParks
    );


    const bounds =
      L.latLngBounds(
        coordinates
      );


    matchingParks.forEach(
      park => {

        bounds.extend([
          park.lat,
          park.lon
        ]);

      }
    );


    map.fitBounds(
      bounds,
      {
        padding: [30, 30]
      }
    );


    status(
      `${matchingParks.length} Skatepark(s) innerhalb von ${radius} km zur Route.`
    );

  }

  catch (error) {

    status(
      error.message,
      true
    );

  }

}


// --------------------------------------------------
// STADT SUCHEN
// --------------------------------------------------

async function searchCity() {

  const city =
    document
      .getElementById("start")
      .value
      .trim();


  const radius =
    Number(
      document
        .getElementById("radius")
        .value
    );


  if (!city) {

    status(
      "Bitte eine Stadt eingeben.",
      true
    );

    return;

  }


  status(
    "Stadt wird gesucht …"
  );


  routeLayer.clearLayers();

  radiusLayer.clearLayers();


  try {

    const center =
      await geocode(city);


    const matchingParks =
      skateparks

        .map(
          park => ({

            ...park,

            distance:
              distanceBetween(
                center,
                park
              )

          })
        )

        .filter(
          park =>
            park.distance <= radius
        )

        .sort(
          (a, b) =>
            a.distance - b.distance
        );


    showParks(
      matchingParks
    );


    if (startMarker) {

      map.removeLayer(
        startMarker
      );

    }


    startMarker =
      L.marker([
        center.lat,
        center.lon
      ])
      .addTo(map)
      .bindPopup(
        "<strong>Suchort</strong><br>" +
        escapeHtml(center.name)
      );


    L.circle(
      [
        center.lat,
        center.lon
      ],
      {
        radius: radius * 1000,
        color: "#f97316",
        fillColor: "#f97316",
        fillOpacity: 0.08,
        weight: 2
      }
    ).addTo(radiusLayer);


    const bounds =
      L.latLngBounds([
        [
          center.lat,
          center.lon
        ]
      ]);


    matchingParks.forEach(
      park => {

        bounds.extend([
          park.lat,
          park.lon
        ]);

      }
    );


    map.fitBounds(
      bounds,
      {
        padding: [30, 30],
        maxZoom: 13
      }
    );


    status(
      `${matchingParks.length} Skatepark(s) innerhalb von ${radius} km um ${city}.`
    );

  }

  catch (error) {

    status(
      error.message,
      true
    );

  }

}


// --------------------------------------------------
// EVENTS
// --------------------------------------------------

document
  .getElementById("routeForm")
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();

      searchRoute();

    }
  );


document
  .getElementById("cityButton")
  .addEventListener(
    "click",
    searchCity
  );


// --------------------------------------------------
// STARTANZEIGE
// --------------------------------------------------

showParks(skateparks);

</script>

</body>
</html>
