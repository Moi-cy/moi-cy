        /* =====================================================
           ENTFERNUNG
        ===================================================== */

        function haversineKm(
            lat1,
            lng1,
            lat2,
            lng2
        ) {

            const R =
                6371;


            const dLat =
                (
                    lat2 -
                    lat1
                ) *
                Math.PI /
                180;


            const dLng =
                (
                    lng2 -
                    lng1
                ) *
                Math.PI /
                180;


            const a =

                Math.sin(
                    dLat / 2
                ) ** 2

                +

                Math.cos(
                    lat1 *
                    Math.PI /
                    180
                )

                *

                Math.cos(
                    lat2 *
                    Math.PI /
                    180
                )

                *

                Math.sin(
                    dLng / 2
                ) ** 2;


            return (

                2 *
                R *
                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(
                        1 - a
                    )
                )

            );

        }


        /* =====================================================
           ERGEBNISSE
        ===================================================== */

        function showResults(
            list,
            title,
            totalFound = list.length
        ) {

            results.hidden =
                false;


            if (!list.length) {

                results.innerHTML = `

                    <div class="results-heading">

                        <span>
                            ${escapeHtml(
                                title
                            )}
                        </span>

                        <span class="results-count">
                            0
                        </span>

                    </div>


                    <div class="empty-results">

                        Keine passenden Skateparks
                        in diesem Bereich gefunden.

                    </div>

                `;

                return;

            }


            results.innerHTML = `

                <div class="results-heading">

                    <span>
                        ${escapeHtml(
                            title
                        )}
                    </span>

                    <span class="results-count">
                        ${list.length}
                        ${
                            totalFound >
                            list.length

                                ? ` / ${totalFound}`

                                : ""
                        }
                    </span>

                </div>


                ${list.map(
                    item => {

                        const park =
                            item.park;

                        const distance =
                            item.distance;


                        const area =
                            Number.isFinite(
                                park.area
                            )

                                ? formatArea(
                                    park.area
                                )

                                : "";


                        return `

                            <button
                                type="button"
                                class="park-result"
                                data-park-id="${escapeHtml(
                                    park.id
                                )}"
                            >

                                <span
                                    class="park-result-name"
                                >
                                    ${escapeHtml(
                                        park.name
                                    )}
                                </span>


                                <span
                                    class="park-result-meta"
                                >

                                    ${escapeHtml(
                                        park.address
                                    )}


                                    ${
                                        area

                                            ? `

                                                <br>

                                                <span
                                                    class="park-size"
                                                >
                                                    ${escapeHtml(
                                                        area
                                                    )}
                                                </span>

                                            `

                                            : ""

                                    }


                                    ${
                                        Number.isFinite(
                                            distance
                                        )

                                            ? `

                                                <br>

                                                <span
                                                    class="park-distance"
                                                >
                                                    ${distance.toFixed(
                                                        1
                                                    )} km entfernt
                                                </span>

                                            `

                                            : ""

                                    }

                                </span>

                            </button>

                        `;

                    }
                ).join("")}

            `;


            results
                .querySelectorAll(
                    ".park-result"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                const park =
                                    currentParks.find(
                                        item =>
                                            item.id ===
                                            button.dataset.parkId
                                    );


                                if (!park) {

                                    return;

                                }


                                map.setView(

                                    [
                                        park.lat,
                                        park.lng
                                    ],

                                    17,

                                    {
                                        animate:
                                            true
                                    }

                                );


                                const marker =
                                    parkMarkers.get(
                                        park.id
                                    );


                                if (marker) {

                                    marker.openPopup();

                                }

                            }
                        );

                    }
                );

        }


        /* =====================================================
           ORT SUCHEN
        ===================================================== */

        async function searchLocation() {

            const query =
                searchInput.value.trim();


            if (!query) {

                setStatus(
                    "Bitte einen Ort oder eine Adresse eingeben.",
                    "error"
                );

                return;

            }


            searchButton.disabled =
                true;


            setStatus(
                "Ort wird gesucht …",
                "active"
            );


            try {

                const location =
                    await geocode(
                        query
                    );


                if (!location) {

                    setStatus(
                        "Der Ort wurde nicht gefunden. Versuche einen anderen Suchbegriff.",
                        "error"
                    );

                    return;

                }


                currentLocation =
                    location;


                map.setView(

                    [
                        location.lat,
                        location.lng
                    ],

                    13,

                    {
                        animate:
                            true
                    }

                );


                locationCard.hidden =
                    false;


                locationCardName.textContent =
                    location.displayName;


                /*
                 * WICHTIG:
                 *
                 * Eine normale Ortssuche
                 * sucht KEINE Skateparks.
                 */

                clearParks();

                currentParks =
                    [];

                results.innerHTML =
                    "";

                results.hidden =
                    true;


                removeRoute();


                /*
                 * Falls Route-Felder vorher gefüllt waren,
                 * wird der gefundene Ort als Start angeboten.
                 */

                if (
                    !routeStartInput.value.trim()
                ) {

                    routeStartInput.value =
                        location.name;

                }


                setStatus(
                    `${location.name || query} gefunden.`,
                    "active"
                );

            } catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "Die Ortssuche konnte nicht durchgeführt werden.",
                    "error"
                );

            } finally {

                searchButton.disabled =
                    false;

            }

        }


        /* =====================================================
           MODUS ROUTE
        ===================================================== */

        function activateRouteMode() {

            activeMode =
                "route";


            routeBox.classList.add(
                "active"
            );


            skateOptions.hidden =
                true;


            routeModeButton.classList.remove(
                "secondary"
            );


            skateModeButton.classList.add(
                "secondary"
            );


            /*
             * Keine Skateparks beim Wechsel
             * in den Routenmodus.
             */

            clearParks();

            currentParks =
                [];


            results.innerHTML =
                "";

            results.hidden =
                true;


            setStatus(
                "Route planen – Start und Ziel eingeben.",
                "active"
            );


            if (
                currentLocation &&
                !routeStartInput.value.trim()
            ) {

                routeStartInput.value =
                    currentLocation.name;

            }

        }


        /* =====================================================
           MODUS SKATEPARKS
        ===================================================== */

        function activateSkateMode() {

            activeMode =
                "skate";


            routeBox.classList.remove(
                "active"
            );


            skateOptions.hidden =
                false;


            skateModeButton.classList.remove(
                "secondary"
            );


            routeModeButton.classList.add(
                "secondary"
            );


            /*
             * Eine alte Route nicht automatisch
             * mit den Skateparks vermischen.
             */

            removeRoute();


            setStatus(
                currentLocation

                    ? "Radius auswählen und Skateparks suchen."

                    : "Erst einen Ort suchen, danach Skateparks auswählen.",

                currentLocation
                    ? "active"
                    : ""
            );

        }


        /* =====================================================
           SKATEPARKS SUCHEN
        ===================================================== */

        async function searchSkateparks() {

            if (!currentLocation) {

                setStatus(
                    "Bitte zuerst einen Ort suchen.",
                    "error"
                );

                return;

            }


            const radiusInput =
                document.querySelector(
                    'input[name="radius"]:checked'
                );


            const radius =
                Number(
                    radiusInput?.value ||
                    5000
                );


            const radiusKm =
                radius /
                1000;


            skateSearchButton.disabled =
                true;


            setStatus(
                `Skateparks im Umkreis von ${radiusKm} km werden gesucht …`,
                "active"
            );


            try {

                const parks =
                    await findSkateparksAround(

                        currentLocation.lat,
                        currentLocation.lng,

                        radius

                    );


                /*
                 * Nach Relevanz / Größe sortiert.
                 */

                parks.sort(
                    (
                        a,
                        b
                    ) =>
                        b.score -
                        a.score
                );


                currentParks =
                    parks;


                /*
                 * Nur Top-Parks darstellen.
                 */

                const visibleParks =
                    parks.slice(
                        0,
                        MAX_VISIBLE_PARKS
                    );


                showParks(
                    visibleParks
                );


                /*
                 * Ergebnisliste nach Entfernung.
                 *
                 * Wenn zwei Parks ähnlich weit entfernt
                 * sind, gewinnt der größere/relevantere.
                 */

                const resultItems =
                    visibleParks
                        .map(
                            park => ({

                                park,

                                distance:
                                    haversineKm(

                                        currentLocation.lat,
                                        currentLocation.lng,

                                        park.lat,
                                        park.lng

                                    )

                            })
                        )
                        .sort(
                            (
                                a,
                                b
                            ) => {

                                const distanceDifference =
                                    a.distance -
                                    b.distance;


                                /*
                                 * Entfernung ist primär.
                                 * Bei nahezu gleicher Entfernung
                                 * gewinnt der Score.
                                 */

                                if (
                                    Math.abs(
                                        distanceDifference
                                    ) < 2
                                ) {

                                    return (
                                        b.park.score -
                                        a.park.score
                                    );

                                }


                                return distanceDifference;

                            }
                        );


                showResults(

                    resultItems,

                    `SKATEPARKS IM RADIUS ${radiusKm} KM`,

                    parks.length

                );


                /*
                 * Karte auf Suchradius + Ort.
                 */

                const circle =
                    L.circle(

                        [
                            currentLocation.lat,
                            currentLocation.lng
                        ],

                        {

                            radius,

                            color:
                                "#168cff",

                            weight:
                                1,

                            opacity:
                                0.35,

                            fillOpacity:
                                0.04,

                            interactive:
                                false

                        }

                    );


                /*
                 * Alten Suchkreis entfernen.
                 */

                if (
                    window.moiCySearchCircle
                ) {

                    map.removeLayer(
                        window.moiCySearchCircle
                    );

                }


                window.moiCySearchCircle =
                    circle;


                circle.addTo(
                    map
                );


                /*
                 * Kreis in die Karte einpassen,
                 * aber nicht zu weit herauszoomen.
                 */

                map.fitBounds(
                    circle.getBounds(),
                    {

                        padding:
                            [80, 80],

                        maxZoom:
                            13

                    }
                );


                if (parks.length) {

                    setStatus(

                        parks.length >
                        MAX_VISIBLE_PARKS

                            ? `${parks.length} Skateparks gefunden. Die ${MAX_VISIBLE_PARKS} relevantesten werden angezeigt.`

                            : `${parks.length} Skatepark(s) gefunden.`,

                        "active"

                    );

                } else {

                    setStatus(
                        "Keine passenden Skateparks in diesem Radius gefunden."
                    );

                }

            } catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "Die Skatepark-Suche konnte nicht durchgeführt werden.",
                    "error"
                );

            } finally {

                skateSearchButton.disabled =
                    false;

            }

        }


        /* =====================================================
           ROUTE
        ===================================================== */

        async function searchRoute() {

            const startQuery =
                routeStartInput.value.trim();


            const endQuery =
                routeEndInput.value.trim();


            if (
                !startQuery ||
                !endQuery
            ) {

                setStatus(
                    "Bitte Start und Ziel eingeben.",
                    "error"
                );

                return;

            }


            routeButton.disabled =
                true;


            setStatus(
                "Start und Ziel werden gesucht …",
                "active"
            );


            try {

                const start =
                    await geocode(
                        startQuery
                    );


                if (!start) {

                    setStatus(
                        "Der Start wurde nicht gefunden.",
                        "error"
                    );

                    return;

                }


                /*
                 * Nominatim nicht direkt zweimal hintereinander
                 * bombardieren.
                 */

                await wait(
                    1100
                );


                const end =
                    await geocode(
                        endQuery
                    );


                if (!end) {

                    setStatus(
                        "Das Ziel wurde nicht gefunden.",
                        "error"
                    );

                    return;

                }


                const routeUrl =

                    "https://router.project-osrm.org/route/v1/driving/" +

                    `${start.lng},${start.lat};` +

                    `${end.lng},${end.lat}` +

                    "?overview=full&geometries=geojson";


                setStatus(
                    "Route wird berechnet …",
                    "active"
                );


                const response =
                    await fetch(
                        routeUrl
                    );


                if (!response.ok) {

                    throw new Error(
                        `OSRM HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                if (
                    data.code !== "Ok" ||
                    !data.routes ||
                    !data.routes.length
                ) {

                    throw new Error(
                        "Keine Route gefunden."
                    );

                }


                const route =
                    data.routes[0];


                /*
                 * Skateparks bewusst entfernen.
                 */

                clearParks();

                currentParks =
                    [];


                results.innerHTML =
                    "";

                results.hidden =
                    true;


                removeRoute();


                /*
                 * Route zeichnen.
                 */

                routeLayer =
                    L.geoJSON(

                        route.geometry,

                        {

                            style: {

                                color:
                                    "#168cff",

                                weight:
                                    5,

                                opacity:
                                    0.95

                            }

                        }

                    )
                    .addTo(map);


                const endpointIcon =
                    L.divIcon({

                        className: "",

                        html:
                            '<div class="moi-route-marker"></div>',

                        iconSize:
                            [18, 18],

                        iconAnchor:
                            [9, 9]

                    });


                routeStartMarker =
                    L.marker(

                        [
                            start.lat,
                            start.lng
                        ],

                        {
                            icon:
                                endpointIcon
                        }

                    )
                    .addTo(map)
                    .bindPopup(

                        `<strong>START</strong><br>${escapeHtml(
                            start.displayName
                        )}`

                    );


                routeEndMarker =
                    L.marker(

                        [
                            end.lat,
                            end.lng
                        ],

                        {
                            icon:
                                endpointIcon
                        }

                    )
                    .addTo(map)
                    .bindPopup(

                        `<strong>ZIEL</strong><br>${escapeHtml(
                            end.displayName
                        )}`

                    );


                map.fitBounds(

                    routeLayer.getBounds(),

                    {

                        padding:
                            [80, 80]

                    }

                );


                const distanceKm =
                    (
                        route.distance /
                        1000
                    )
                    .toFixed(1);


                const durationMinutes =
                    Math.round(
                        route.duration /
                        60
                    );


                const durationText =
                    durationMinutes >= 60

                        ? `${Math.floor(
                            durationMinutes / 60
                        )} h ${durationMinutes % 60} min`

                        : `${durationMinutes} min`;


                setStatus(

                    `Route: ${distanceKm} km · ca. ${durationText}`,

                    "active"

                );

            } catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "Die Route konnte nicht berechnet werden.",
                    "error"
                );

            } finally {

                routeButton.disabled =
                    false;

            }

        }


        /* =====================================================
           ROUTE ENTFERNEN
        ===================================================== */

        function removeRoute() {

            if (routeLayer) {

                map.removeLayer(
                    routeLayer
                );

                routeLayer =
                    null;

            }


            if (routeStartMarker) {

                map.removeLayer(
                    routeStartMarker
                );

                routeStartMarker =
                    null;

            }


            if (routeEndMarker) {

                map.removeLayer(
                    routeEndMarker
                );

                routeEndMarker =
                    null;

            }

        }


        /* =====================================================
           SUCHKREIS ENTFERNEN
        ===================================================== */

        function removeSearchCircle() {

            if (
                window.moiCySearchCircle
            ) {

                map.removeLayer(
                    window.moiCySearchCircle
                );

                window.moiCySearchCircle =
                    null;

            }

        }


        /* =====================================================
           ZURÜCKSETZEN
        ===================================================== */

        function clearMap() {

            clearParks();

            removeRoute();

            removeSearchCircle();


            currentParks =
                [];

            currentLocation =
                null;


            activeMode =
                null;


            searchInput.value =
                "";


            routeStartInput.value =
                "";


            routeEndInput.value =
                "";


            locationCard.hidden =
                true;


            results.innerHTML =
                "";

            results.hidden =
                true;


            routeBox.classList.remove(
                "active"
            );


            skateOptions.hidden =
                true;


            routeModeButton.classList.add(
                "secondary"
            );


            skateModeButton.classList.remove(
                "secondary"
            );


            map.setView(

                [
                    49.1,
                    8.4
                ],

                6

            );


            setStatus(
                "Suche einen Ort, plane eine Route oder suche Skateparks."
            );

        }


        /* =====================================================
           HTML ESCAPEN
        ===================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value
            )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );

        }


        /* =====================================================
           WAIT
        ===================================================== */

        function wait(
            milliseconds
        ) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        milliseconds
                    )
            );

        }


        /* =====================================================
           EVENTS
        ===================================================== */

        searchButton.addEventListener(
            "click",
            searchLocation
        );


        searchInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    searchLocation();

                }

            }
        );


        routeModeButton.addEventListener(
            "click",
            activateRouteMode
        );


        skateModeButton.addEventListener(
            "click",
            activateSkateMode
        );


        skateSearchButton.addEventListener(
            "click",
            searchSkateparks
        );


        routeButton.addEventListener(
            "click",
            searchRoute
        );


        clearButton.addEventListener(
            "click",
            clearMap
        );


        routeStartInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    searchRoute();

                }

            }
        );


        routeEndInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    searchRoute();

                }

            }
        );


        /* =====================================================
           LEAFLET SIZE
        ===================================================== */

        setTimeout(
            () =>
                map.invalidateSize(true),
            100
        );


        setTimeout(
            () =>
                map.invalidateSize(true),
            500
        );


        setTimeout(
            () =>
                map.invalidateSize(true),
            1000
        );

    </script>

         DEIN BESTEHENDES SCRIPT

        type="module"
        src="script.js"
    ></script>
