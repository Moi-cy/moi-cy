<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MOI-CY – Karte</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        /* =====================================================
           GRUNDLAYOUT
        ===================================================== */

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }

        body {

            overflow: hidden;

            background: #050505;

        }

        main.map-page {

            position: relative;

            width: 100%;
            height: 100dvh;

            padding: 0 !important;
            margin: 0;

        }

        .map-wrapper {

            position: fixed;

            top: var(--header-height);
            right: 0;
            bottom: 0;
            left: 0;

            overflow: hidden;

            background: #e8e8e8;

        }

        #map {

            position: absolute;

            top: 0;
            right: 0;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: #e8e8e8;

        }

        /* =====================================================
           LEAFLET
        ===================================================== */

        .leaflet-container {

            width: 100%;
            height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #e8e8e8;

            overflow: hidden;

        }

        .leaflet-tile {

            max-width: none !important;
            max-height: none !important;

            filter: none !important;

        }

        .leaflet-tile-container img {

            max-width: none !important;

        }

        .leaflet-control-attribution {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.92
                ) !important;

            color: #555 !important;

            font-size: 10px;

            padding: 3px 6px !important;

        }

        .leaflet-control-attribution a {

            color: #333 !important;

        }

        .leaflet-control-zoom {

            border:
                1px solid
                rgba(
                    0,
                    0,
                    0,
                    0.18
                ) !important;

            box-shadow:
                0 4px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.15
                ) !important;

        }

        .leaflet-control-zoom a {

            width: 32px !important;
            height: 32px !important;

            line-height: 32px !important;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                ) !important;

            color: #111 !important;

            border-bottom-color:
                rgba(
                    0,
                    0,
                    0,
                    0.12
                ) !important;

        }

        .leaflet-control-zoom a:hover {

            background: #168cff !important;

            color: #fff !important;

        }

        /* =====================================================
           PANEL
        ===================================================== */

        .map-panel {

            position: absolute;

            z-index: 1000;

            top: 22px;
            left: 22px;

            width: 410px;

            max-width:
                calc(
                    100vw - 44px
                );

            max-height:
                calc(
                    100% - 44px
                );

            box-sizing: border-box;

            padding: 20px;

            overflow-y: auto;

            background:
                rgba(
                    8,
                    8,
                    8,
                    0.95
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.13
                );

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

        }

        .map-panel::-webkit-scrollbar {

            width: 5px;

        }

        .map-panel::-webkit-scrollbar-track {

            background: transparent;

        }

        .map-panel::-webkit-scrollbar-thumb {

            background: #333;

        }

        .map-kicker {

            margin:
                0 0 6px;

            color: #168cff;

            font-size: 10px;

            font-weight: 900;

            letter-spacing:
                0.18em;

            text-transform:
                uppercase;

        }

        .map-title {

            margin: 0;

            color: #fff;

            font-size: 38px;

            line-height: 0.95;

            font-weight: 900;

            letter-spacing:
                -0.04em;

            text-transform:
                uppercase;

        }

        .map-intro {

            margin:
                12px 0 18px;

            color: #929292;

            font-size: 12px;

            line-height: 1.55;

        }

        /* =====================================================
           SEARCH
        ===================================================== */

        .map-search {

            margin-bottom: 9px;

        }

        .map-search label,
        .route-label {

            display: block;

            margin-bottom: 7px;

            color: #999;

            font-size: 9px;

            font-weight: 900;

            letter-spacing:
                0.14em;

            text-transform:
                uppercase;

        }

        .map-search-row {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto;

            gap: 7px;

        }

        .map-input,
        .route-input {

            display: block;

            width: 100%;

            min-width: 0;

            box-sizing: border-box;

            padding:
                12px 13px;

            background: #111;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.13
                );

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 12px;

            outline: none;

            border-radius: 0;

            transition:
                border-color
                0.2s ease,

                background
                0.2s ease;

        }

        .map-input:focus,
        .route-input:focus {

            background: #151515;

            border-color:
                #168cff;

        }

        .map-input::placeholder,
        .route-input::placeholder {

            color: #555;

        }

        /* =====================================================
           BUTTONS
        ===================================================== */

        .map-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 40px;

            box-sizing: border-box;

            padding:
                10px 13px;

            border: 0;

            border-radius: 0;

            background: #168cff;

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 9px;

            font-weight: 900;

            letter-spacing:
                0.1em;

            text-transform:
                uppercase;

            cursor: pointer;

            transition:
                background
                0.15s ease,

                transform
                0.15s ease;

        }

        .map-button:hover {

            background: #2d9aff;

            transform:
                translateY(-1px);

        }

        .map-button.secondary {

            background: #1a1a1a;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.13
                );

        }

        .map-button.secondary:hover {

            background: #252525;

        }

        .map-button.full {

            width: 100%;

            margin-top: 7px;

        }

        /* =====================================================
           ROUTE
        ===================================================== */

        .route-box {

            margin-top: 17px;

            padding-top: 17px;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.09
                );

        }

        .route-fields {

            display: grid;

            gap: 7px;

        }

        .route-actions {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 7px;

            margin-top: 7px;

        }

        /* =====================================================
           STATUS
        ===================================================== */

        .map-status {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 14px;

            padding:
                10px 12px;

            box-sizing: border-box;

            background: #0d0d0d;

            border-left:
                2px solid
                #333;

            color: #707070;

            font-size: 10px;

            line-height: 1.45;

        }

        .map-status.active {

            border-left-color:
                #168cff;

            color: #aaa;

        }

        .map-status.error {

            border-left-color:
                #ff4d4d;

            color: #ff8585;

        }

        .status-dot {

            width: 6px;
            height: 6px;

            min-width: 6px;

            border-radius: 50%;

            background: #555;

        }

        .map-status.active
        .status-dot {

            background: #168cff;

            box-shadow:
                0 0 10px
                rgba(
                    22,
                    140,
                    255,
                    0.8
                );

        }

        .map-status.error
        .status-dot {

            background: #ff4d4d;

        }

        /* =====================================================
           RESULTS
        ===================================================== */

        .results {

            margin-top: 16px;

        }

        .results-heading {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 6px;

            color: #777;

            font-size: 9px;

            font-weight: 900;

            letter-spacing:
                0.14em;

            text-transform:
                uppercase;

        }

        .results-count {

            color: #168cff;

        }

        .park-result {

            display: block;

            width: 100%;

            padding:
                11px 0;

            background: transparent;

            border: 0;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            color: #fff;

            text-align: left;

            cursor: pointer;

        }

        .park-result:hover
        .park-result-name {

            color: #168cff;

        }

        .park-result-name {

            display: block;

            margin-bottom: 3px;

            color: #eee;

            font-size: 12px;

            font-weight: 900;

            text-transform:
                uppercase;

            transition:
                color
                0.15s ease;

        }

        .park-result-meta {

            display: block;

            color: #666;

            font-size: 10px;

            line-height: 1.45;

        }

        .park-distance {

            color: #168cff;

        }

        .empty-results {

            padding:
                13px 0;

            color: #666;

            font-size: 11px;

            line-height: 1.5;

        }

        /* =====================================================
           MARKER
        ===================================================== */

        .moi-marker {

            width: 18px;
            height: 18px;

            box-sizing: border-box;

            background: #168cff;

            border:
                3px solid
                #fff;

            border-radius: 50%;

            box-shadow:

                0 0 0 5px
                rgba(
                    22,
                    140,
                    255,
                    0.16
                ),

                0 4px 14px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

        }

        .moi-route-marker {

            width: 12px;
            height: 12px;

            box-sizing: border-box;

            background: #fff;

            border:
                3px solid
                #168cff;

            border-radius: 50%;

            box-shadow:
                0 3px 12px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

        }

        /* =====================================================
           POPUP
        ===================================================== */

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {

            background: #101010;

            color: #fff;

        }

        .leaflet-popup-content {

            margin: 15px;

            min-width: 215px;

        }

        .popup-kicker {

            margin-bottom: 5px;

            color: #168cff;

            font-size: 8px;

            font-weight: 900;

            letter-spacing:
                0.15em;

            text-transform:
                uppercase;

        }

        .popup-title {

            margin-bottom: 5px;

            color: #fff;

            font-size: 15px;

            font-weight: 900;

            text-transform:
                uppercase;

        }

        .popup-address {

            color: #999;

            font-size: 10px;

            line-height: 1.45;

        }

        .popup-route {

            display: inline-block;

            margin-top: 10px;

            padding:
                8px 10px;

            background: #168cff;

            color: #fff;

            font-size: 8px;

            font-weight: 900;

            letter-spacing:
                0.08em;

            text-decoration: none;

            text-transform:
                uppercase;

        }

        .popup-route:hover {

            background: #2d9aff;

        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 900px) {

            .map-panel {

                width: 390px;

            }

        }

        @media (max-width: 700px) {

            .map-wrapper {

                top: 68px;

            }

            .map-panel {

                top: 10px;
                left: 10px;

                width:
                    calc(
                        100vw - 20px
                    );

                max-width: none;

                max-height:
                    calc(
                        100% - 20px
                    );

                padding: 15px;

            }

            .map-title {

                font-size: 30px;

            }

            .map-intro {

                margin-top: 10px;

                margin-bottom: 13px;

                font-size: 11px;

            }

        }

        @media (max-width: 430px) {

            .map-panel {

                padding: 13px;

            }

            .map-title {

                font-size: 27px;

            }

            .map-input,
            .route-input {

                padding: 11px;

                font-size: 11px;

            }

            .map-button {

                padding:
                    9px 10px;

                font-size: 8px;

            }

        }

    </style>

</head>


<body>

    <div id="site-header"></div>


    <main class="map-page">

        <div class="map-wrapper">

            <aside class="map-panel">

                <p class="map-kicker">

                </p>


                <h1 class="map-title">
                    FIND YOUR SPOT
                </h1>


                <p class="map-intro">

                    Suche eine Stadt, einen Ort

                    MOI-CY sucht anschließend
                    nach echten Skatepark-Einträgen

                </p>


                <!-- =========================================

                ========================================== -->

                <div class="map-search">

                    <label for="locationSearch">
                        Stadt oder Ort
                    </label>


                    <div class="map-search-row">

                            id="locationSearch"

                        <button
                            id="searchButton"

                </div>


                <button
                    id="allParksButton"

                    type="button"
                >

                </button>


                <!-- =========================================
                     ROUTE
                ========================================== -->

                <div class="route-box">

                    <label class="route-label">

                    </label>


                    <div class="route-fields">

                        <input
                            id="routeStart"
                            class="route-input"
                            type="text"
                            placeholder="Start"
                            autocomplete="off"
                        >


                        <input
                            id="routeEnd"
                            class="route-input"
                            type="text"
                            placeholder="Ziel"

                        >

                    </div>


                    <div class="route-actions">

                            id="routeButton"

                            type="button"

    </main>


    <div id="site-footer"></div>


    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =====================================================
         MOI-CY MAP
    ====================================================== -->

    <script type="module">

        /* =====================================================
           KONFIGURATION
        ===================================================== */

        const NOMINATIM_URL =
            "https://nominatim.openstreetmap.org/search";

        const OVERPASS_URLS = [

            "https://overpass-api.de/api/interpreter",

            "https://overpass.kumi.systems/api/interpreter",

            "https://overpass.private.coffee/api/interpreter"

        ];


        /*
         * Suchradius für Skateparks um einen gefundenen Ort.
         *
         * WICHTIG:
         * Das ist KEINE Begrenzung der Anzahl.
         *
         * Es bedeutet nur:
         * Wie weit um die gesuchte Stadt herum
         * nach Skateparks gesucht wird.
         */

        const SEARCH_RADIUS_METERS =
            50000;


        /*
         * Bei einer Route wird nicht die Anzahl
         * der Skateparks begrenzt.
         *
         * Dieser Wert bestimmt nur,
         * wie weit ein Skatepark von der Route
         * entfernt sein darf.
         */

        const ROUTE_RADIUS_METERS =
            15000;


        /* =====================================================
           KARTE
        ===================================================== */

        const map =
            L.map(
                "map",
                {

                    zoomControl:
                        false,

                    minZoom:
                        3,

                    maxZoom:
                        19,

                    preferCanvas:
                        false

                }
            )
            .setView(
                [
                    49.1,
                    8.4
                ],
                6
            );


        L.control.zoom({

            position:
                "bottomright"

        }).addTo(map);


        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom:
                    19,

                tileSize:
                    256,

                attribution:
                    '&copy; OpenStreetMap-Mitwirkende'

            }

        ).addTo(map);


        /* =====================================================
           LAYER
        ===================================================== */

        const parkLayer =
            L.layerGroup()
            .addTo(map);


        let routeLayer =
            null;


        let routeStartMarker =
            null;


        let routeEndMarker =
            null;


        const parkMarkers =
            new Map();


        /* =====================================================
           ELEMENTE
        ===================================================== */

        const searchInput =
            document.getElementById(
                "locationSearch"
            );


        const searchButton =
            document.getElementById(
                "searchButton"
            );


        const allParksButton =
            document.getElementById(
                "allParksButton"
            );


        const routeStartInput =
            document.getElementById(
                "routeStart"
            );


        const routeEndInput =
            document.getElementById(
                "routeEnd"
            );


        const routeButton =
            document.getElementById(
                "routeButton"
            );


        const clearButton =
            document.getElementById(
                "clearButton"
            );


        const status =
            document.getElementById(
                "mapStatus"
            );


        const statusText =
            document.getElementById(
                "mapStatusText"
            );


        const results =
            document.getElementById(
                "results"
            );


        /* =====================================================
           STATUS
        ===================================================== */

        function setStatus(
            message,
            type = ""
        ) {

            status.classList.remove(
                "active",
                "error"
            );


            if (type) {

                status.classList.add(
                    type
                );

            }


            statusText.textContent =
                message;

        }


        /* =====================================================
           CACHE FÜR ORTSSUCHE
        ===================================================== */

        const cacheKey =
            "moiCyGeocodeCacheV2";


        function readCache() {

            try {

                return JSON.parse(

                    localStorage.getItem(
                        cacheKey
                    ) || "{}"

                );

            } catch {

                return {};

            }

        }


        function writeCache(
            cache
        ) {

            try {

                localStorage.setItem(
                    cacheKey,
                    JSON.stringify(cache)
                );

            } catch {

                /*
                 * Cache ist optional.
                 */

            }

        }


        /* =====================================================
           NOMINATIM
        ===================================================== */

        async function geocode(
            query
        ) {

            const cleanQuery =
                query.trim();


            if (!cleanQuery) {

                return null;

            }


            const cache =
                readCache();


            const key =
                cleanQuery
                    .toLowerCase();


            if (cache[key]) {

                return cache[key];

            }


            const url =
                NOMINATIM_URL +

                "?format=jsonv2" +

                "&limit=1" +

                "&addressdetails=1" +

                "&q=" +

                encodeURIComponent(
                    cleanQuery
                );


            const response =
                await fetch(
                    url,
                    {

                        headers: {

                            /*
                             * Der Referer deiner Website
                             * wird vom Browser automatisch
                             * übertragen.
                             *
                             * Nominatim verlangt eine
                             * identifizierbare Anwendung.
                             */

                            "Accept":
                                "application/json"

                        }

                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Geocoding HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            if (
                !Array.isArray(data) ||
                !data.length
            ) {

                return null;

            }


            const result = {

                lat:
                    Number(
                        data[0].lat
                    ),

                lng:
                    Number(
                        data[0].lon
                    ),

                displayName:
                    data[0].display_name ||
                    cleanQuery

            };


            cache[key] =
                result;


            writeCache(
                cache
            );


            return result;

        }


        /* =====================================================
           OVERPASS QUERY
        ===================================================== */

        async function queryOverpass(
            query
        ) {

            let lastError =
                null;


            for (
                const endpoint
                of OVERPASS_URLS
            ) {

                try {

                    const response =
                        await fetch(
                            endpoint,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "text/plain;charset=UTF-8",

                                    "Accept":
                                        "application/json"

                                },

                                body:
                                    query

                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            `Overpass HTTP ${response.status}`
                        );

                    }


                    const data =
                        await response.json();


                    return data;

                } catch (error) {

                    console.warn(
                        "Overpass-Server fehlgeschlagen:",
                        endpoint,
                        error
                    );


                    lastError =
                        error;

                }

            }


            throw (
                lastError ||
                new Error(
                    "Kein Overpass-Server erreichbar."
                )
            );

        }


        /* =====================================================
           SKATEPARK-ABFRAGE
        ===================================================== */

        async function findSkateparksAround(
            lat,
            lng,
            radius =
                SEARCH_RADIUS_METERS
        ) {

            /*
             * Wir fragen bewusst nach:
             *
             * leisure=skatepark
             *
             * und nicht einfach nach
             * irgendwelchen Suchergebnissen.
             *
             * Dadurch fallen viele falsche Treffer
             * bereits auf Datenebene weg.
             */

            const query = `

                [out:json][timeout:60];

                (

                    nwr(
                        around:${radius},
                        ${lat},
                        ${lng}
                    )["leisure"="skatepark"];

                    nwr(
                        around:${radius},
                        ${lat},
                        ${lng}
                    )["sport"="skateboard"];

                );

                out center tags;

            `;


            const data =
                await queryOverpass(
                    query
                );


            return normalizeSkateparks(
                data.elements || []
            );

        }


        /* =====================================================
           FILTER
        ===================================================== */

        const EXCLUDED_WORDS = [

            "playground",
            "spielplatz",

            "kinderspielplatz",

            "basketball",

            "streetball",

            "football",

            "soccer",

            "fußball",

            "tennis",

            "volleyball",

            "golf",

            "parking",

            "parkplatz",

            "parkhaus",

            "schule",

            "school",

            "kindergarten",

            "kita",

            "pumptrack",

            "pump track",

            "bmx only",

            "bmx-only"

        ];


        const POSITIVE_WORDS = [

            "skatepark",

            "skate park",

            "skate plaza",

            "skateanlage",

            "skate-anlage",

            "skateplatz",

            "skate platz",

            "skate bowl",

            "skatebowl",

            "bowl",

            "skateboard",

            "skateboarding"

        ];


        function normalizeText(
            value
        ) {

            return String(
                value || ""
            )
            .toLowerCase()
            .normalize(
                "NFD"
            )
            .replace(
                /[\u0300-\u036f]/g,
                ""
            );

        }


        function shouldKeepSkatepark(
            element
        ) {

            const tags =
                element.tags || {};


            /*
             * Ein echtes leisure=skatepark
             * bekommt grundsätzlich einen starken
             * Vertrauensbonus.
             */

            const isOfficialSkateparkTag =
                tags.leisure ===
                "skatepark";


            const name =
                normalizeText(
                    tags.name
                );


            const description =
                normalizeText(
                    tags.description
                );


            const sport =
                normalizeText(
                    tags.sport
                );


            const combined =
                [
                    name,
                    description,
                    sport
                ]
                .filter(Boolean)
                .join(" ");


            /*
             * Ausschlussbegriffe.
             *
             * Bei einem echten leisure=skatepark
             * sind wir etwas vorsichtiger:
             * "BMX / Skatepark" soll bleiben.
             */

            const hasHardExcludedWord =
                EXCLUDED_WORDS.some(
                    word =>
                        combined.includes(
                            normalizeText(word)
                        )
                );


            if (
                hasHardExcludedWord &&
                !isOfficialSkateparkTag
            ) {

                return false;

            }


            /*
             * Wenn es kein leisure=skatepark ist,
             * muss zumindest ein klarer Skateboard-Begriff
             * vorhanden sein.
             */

            if (
                !isOfficialSkateparkTag &&
                !POSITIVE_WORDS.some(
                    word =>
                        combined.includes(
                            normalizeText(word)
                        )
                )
            ) {

                return false;

            }


            /*
             * Reine BMX-Treffer raus.
             */

            const isOnlyBmx =
                sport === "bmx" &&
                !name.includes(
                    "skate"
                );


            if (isOnlyBmx) {

                return false;

            }


            return true;

        }


        /* =====================================================
           OSM ELEMENT -> PARK
        ===================================================== */

        function elementCoordinates(
            element
        ) {

            if (
                Number.isFinite(
                    Number(
                        element.lat
                    )
                ) &&
                Number.isFinite(
                    Number(
                        element.lon
                    )
                )
            ) {

                return {

                    lat:
                        Number(
                            element.lat
                        ),

                    lng:
                        Number(
                            element.lon
                        )

                };

            }


            if (
                element.center &&
                Number.isFinite(
                    Number(
                        element.center.lat
                    )
                ) &&
                Number.isFinite(
                    Number(
                        element.center.lon
                    )
                )
            ) {

                return {

                    lat:
                        Number(
                            element.center.lat
                        ),

                    lng:
                        Number(
                            element.center.lon
                        )

                };

            }


            return null;

        }


        function createParkAddress(
            tags
        ) {

            const street =
                tags["addr:street"] ||
                "";


            const houseNumber =
                tags["addr:housenumber"] ||
                "";


            const postcode =
                tags["addr:postcode"] ||
                "";


            const city =
                tags["addr:city"] ||
                "";


            const streetLine =
                [
                    street,
                    houseNumber
                ]
                .filter(Boolean)
                .join(" ");


            const cityLine =
                [
                    postcode,
                    city
                ]
                .filter(Boolean)
                .join(" ");


            return [
                streetLine,
                cityLine
            ]
            .filter(Boolean)
            .join(", ");

        }


        function normalizeSkateparks(
            elements
        ) {

            const parks =
                [];


            const seen =
                new Set();


            for (
                const element
                of elements
            ) {

                if (
                    !shouldKeepSkatepark(
                        element
                    )
                ) {

                    continue;

                }


                const coordinates =
                    elementCoordinates(
                        element
                    );


                if (!coordinates) {

                    continue;

                }


                const tags =
                    element.tags || {};


                const name =
                    (
                        tags.name ||
                        tags["name:de"] ||
                        tags["name:fr"] ||
                        tags["name:en"] ||
                        "Skatepark"
                    )
                    .trim();


                /*
                 * Dubletten über OSM-ID,
                 * Koordinaten und Namen entfernen.
                 */

                const roundedLat =
                    coordinates.lat
                        .toFixed(5);


                const roundedLng =
                    coordinates.lng
                        .toFixed(5);


                const duplicateKey =
                    [
                        normalizeText(name),
                        roundedLat,
                        roundedLng
                    ].join("|");


                if (
                    seen.has(
                        duplicateKey
                    )
                ) {

                    continue;

                }


                seen.add(
                    duplicateKey
                );


                const address =
                    createParkAddress(
                        tags
                    );


                const website =
                    tags.website ||
                    tags["contact:website"] ||
                    "";


                const city =
                    tags["addr:city"] ||
                    tags["addr:town"] ||
                    tags["addr:village"] ||
                    "";


                parks.push({

                    id:
                        `osm-${element.type}-${element.id}`,

                    osmType:
                        element.type,

                    osmId:
                        element.id,

                    name,

                    city,

                    address:
                        address ||
                        city ||
                        "OpenStreetMap-Eintrag",

                    lat:
                        coordinates.lat,

                    lng:
                        coordinates.lng,

                    website,

                    tags

                });

            }


            /*
             * Zweiter Dublettencheck:
             *
             * Wenn zwei unterschiedliche OSM-Objekte
             * praktisch am gleichen Ort liegen,
             * behalten wir nur eines.
             */

            const finalParks =
                [];


            for (
                const park
                of parks
            ) {

                const duplicate =
                    finalParks.some(
                        existing =>

                            haversineKm(
                                park.lat,
                                park.lng,
                                existing.lat,
                                existing.lng
                            ) < 0.08

                            &&

                            normalizeText(
                                park.name
                            ) ===
                            normalizeText(
                                existing.name
                            )

                    );


                if (!duplicate) {

                    finalParks.push(
                        park
                    );

                }

            }


            return finalParks;

        }

        /* =====================================================
           ENTFERNUNG
        ===================================================== */

        function haversineKm(
            lat1,
            lng1,
            lat2,
            lng2
        ) {

            const R =
                6371;


            const dLat =
                (
                    lat2 -
                    lat1
                ) *
                Math.PI /
                180;


            const dLng =
                (
                    lng2 -
                    lng1
                ) *
                Math.PI /
                180;


            const a =

                Math.sin(
                    dLat / 2
                ) ** 2

                +

                Math.cos(
                    lat1 *
                    Math.PI /
                    180
                )

                *

                Math.cos(
                    lat2 *
                    Math.PI /
                    180
                )

                *

                Math.sin(
                    dLng / 2
                ) ** 2;


            return (

                2 *
                R *
                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(
                        1 - a
                    )
                )

            );

        }

        async function searchLocation() {

            const query =
                searchInput.value.trim();


            if (!query) {

                setStatus(
                    "Bitte eine Stadt oder einen Ort eingeben.",
                    "error"
                );

                return;

            }


            setStatus(
                "Ort wird gesucht …",
                "active"
            );


            results.hidden =
                true;


            try {

                const location =
                    await geocode(
                        query
                    );


                if (!location) {

                    setStatus(
                        "Der Ort wurde nicht gefunden.",
                        "error"
                    );

                    return;

                }


                map.setView(

                    [
                        location.lat,
                        location.lng
                    ],

                    12,

                    {
                        animate:
                            true
                    }

                );


                setStatus(
                    "OpenStreetMap wird nach Skateparks durchsucht …",
                    "active"
                );


                const parks =
                    await findSkateparksAround(

                        location.lat,
                        location.lng,

                        SEARCH_RADIUS_METERS

                    );


                currentParks =
                    parks;


                showParks(
                    parks
                );


                if (parks.length) {

                    const bounds =
                        L.latLngBounds(
                            parks.map(
                                park => [
                                    park.lat,
                                    park.lng
                                ]
                            )
                        );


                    /*
                     * Stadt selbst mit einbeziehen.
                     */

                    bounds.extend(
                        [
                            location.lat,
                            location.lng
                        ]
                    );


                    map.fitBounds(

                        bounds,

                        {
                            padding:
                                [90, 90],

                            maxZoom:
                                14

                        }

                    );

                }


                const resultItems =
                    parks
                        .map(
                            park => ({

                                park,

                                distance:
                                    haversineKm(

                                        location.lat,
                                        location.lng,

                                        park.lat,
                                        park.lng

                                    )

                            })
                        )
                        .sort(
                            (
                                a,
                                b
                            ) =>
                                a.distance -
                                b.distance
                        );


                showResults(

                    resultItems,

                    `SKATEPARKS BEI ${query.toUpperCase()}`

                );


                setStatus(

                    parks.length

                        ? `${parks.length} Skatepark(s) gefunden.`

                        : "Keine passenden Skateparks gefunden.",

                    parks.length
                        ? "active"
                        : ""

                );

            } catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "Die Skatepark-Suche konnte nicht durchgeführt werden.",
                    "error"
                );

            }

        }

        /* =====================================================

        ===================================================== */

        async function searchRoute() {

            const startQuery =
                routeStartInput.value.trim();


            const endQuery =
                routeEndInput.value.trim();


            if (
                !startQuery ||
                !endQuery
            ) {

                setStatus(
                    "Bitte Start und Ziel eingeben.",
                    "error"
                );

                return;

            }


            setStatus(
                "Start und Ziel werden gesucht …",
                "active"
            );


            results.hidden =
                true;


            try {

                const start =
                    await geocode(
                        startQuery
                    );


                if (!start) {

                    setStatus(
                        "Der Start wurde nicht gefunden.",
                        "error"
                    );

                    return;

                }


                /*
                 * Nominatim ist öffentlich und limitiert.
                 * Deshalb mindestens eine Sekunde Abstand
                 * zwischen zwei nicht gecachten Anfragen.
                 */

                await wait(
                    1100
                );


                const end =
                    await geocode(
                        endQuery
                    );


                if (!end) {

                    setStatus(
                        "Das Ziel wurde nicht gefunden.",
                        "error"
                    );

                    return;

                }


                const routeUrl =

                    "https://router.project-osrm.org/route/v1/driving/" +

                    `${start.lng},${start.lat};` +

                    `${end.lng},${end.lat}` +

                    "?overview=full&geometries=geojson";


                setStatus(
                    "Route wird berechnet …",
                    "active"
                );


                const response =
                    await fetch(
                        routeUrl
                    );


                if (!response.ok) {

                    throw new Error(
                        `OSRM HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                if (
                    data.code !== "Ok" ||
                    !data.routes ||
                    !data.routes.length
                ) {

                    throw new Error(
                        "Keine Route gefunden."
                    );

                }


                const route =
                    data.routes[0];


                removeRoute();


                routeLayer =
                    L.geoJSON(

                        route.geometry,

                        {

                            style: {

                                color:
                                    "#168cff",

                                weight:
                                    5,

                                opacity:
                                    0.95

                            }

                        }

                    )
                    .addTo(map);


                const endpointIcon =
                    L.divIcon({

                        className: "",

                        html:
                            '<div class="moi-route-marker"></div>',

                        iconSize:
                            [18, 18],

                        iconAnchor:
                            [9, 9]

                    });


                routeStartMarker =
                    L.marker(

                        [
                            start.lat,
                            start.lng
                        ],

                        {
                            icon:
                                endpointIcon
                        }

                    )
                    .addTo(map)
                    .bindPopup(

                        `<strong>START</strong><br>${escapeHtml(
                            start.displayName
                        )}`

                    );


                routeEndMarker =
                    L.marker(

                        [
                            end.lat,
                            end.lng
                        ],

                        {
                            icon:
                                endpointIcon
                        }

                    )
                    .addTo(map)
                    .bindPopup(

                        `<strong>ZIEL</strong><br>${escapeHtml(
                            end.displayName
                        )}`

                    );


                setStatus(
                    "Skateparks entlang der Route werden gesucht …",
                    "active"
                );


                /*
                 * Skateparks rund um Start und Ziel
                 * plus entlang der Route.
                 *
                 * Wir suchen mehrere Punkte entlang der Route,
                 * damit nicht nur die Gegend um Start/Ziel
                 * berücksichtigt wird.
                 */

                const routeCoordinates =
                    route.geometry.coordinates;


                const routeSearchPoints =
                    createRouteSearchPoints(
                        routeCoordinates
                    );


                const routeParks =
                    await findParksAlongRoute(
                        routeSearchPoints
                    );


                currentParks =
                    routeParks;


                showParks(
                    routeParks
                );


                const routeBounds =
                    routeLayer.getBounds();


                routeParks.forEach(
                    park => {

                        routeBounds.extend(

                            [
                                park.lat,
                                park.lng
                            ]

                        );

                    }
                );


                map.fitBounds(

                    routeBounds,

                    {
                        padding:
                            [80, 80]
                    }

                );


                const resultItems =
                    routeParks
                        .map(
                            park => ({

                                park,

                                distance:
                                    parkDistanceToRouteKm(

                                        park,

                                        routeCoordinates

                                    )

                            })
                        )
                        .sort(
                            (
                                a,
                                b
                            ) =>
                                a.distance -
                                b.distance
                        );


                showResults(
                    resultItems,
                    "SKATEPARKS AN DER ROUTE"
                );


                const distanceKm =
                    (
                        route.distance /
                        1000
                    )
                    .toFixed(1);


                setStatus(

                    routeParks.length

                        ? `${routeParks.length} Skatepark(s) an der Route gefunden. Route: ${distanceKm} km.`

                        : `Keine passenden Skateparks an der Route gefunden. Route: ${distanceKm} km.`,

                    routeParks.length
                        ? "active"
                        : ""

                );

            } catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "Die Route konnte nicht berechnet werden.",
                    "error"
                );

            }

        }


        /* =====================================================
           ROUTEN-SUCHPUNKTE
        ===================================================== */

        function createRouteSearchPoints(
            coordinates
        ) {

            const points =
                [];


            if (
                !coordinates ||
                coordinates.length < 2
            ) {

                return points;

            }


            /*
             * Wir nehmen Start und Ende
             * und verteilen weitere Suchpunkte
             * entlang der Route.
             *
             * Keine Begrenzung der Anzahl
             * gefundener Skateparks.
             */

            const step =
                Math.max(
                    1,
                    Math.floor(
                        coordinates.length /
                        12
                    )
                );


            for (
                let i = 0;
                i < coordinates.length;
                i += step
            ) {

                const point =
                    coordinates[i];


                points.push({

                    lat:
                        point[1],

                    lng:
                        point[0]

                });

            }


            const last =
                coordinates[
                    coordinates.length - 1
                ];


            points.push({

                lat:
                    last[1],

                lng:
                    last[0]

            });


            /*
             * Dubletten der Suchpunkte entfernen.
             */

            const unique =
                [];


            const seen =
                new Set();


            for (
                const point
                of points
            ) {

                const key =
                    `${point.lat.toFixed(3)}|${point.lng.toFixed(3)}`;


                if (
                    seen.has(key)
                ) {

                    continue;

                }


                seen.add(key);

                unique.push(
                    point
                );

            }


            return unique;

        }


        /* =====================================================
           SKATEPARKS ENTLANG ROUTE
        ===================================================== */

        async function findParksAlongRoute(
            searchPoints
        ) {

            const allParks =
                [];


            /*
             * Wir machen die Anfragen bewusst
             * nacheinander.
             *
             * Dadurch vermeiden wir eine riesige
             * parallele Belastung des Overpass-Dienstes.
             */

            for (
                const point
                of searchPoints
            ) {

                try {

                    const parks =
                        await findSkateparksAround(

                            point.lat,
                            point.lng,

                            ROUTE_RADIUS_METERS

                        );


                    allParks.push(
                        ...parks
                    );


                    /*
                     * Kleine Pause zwischen Overpass-Anfragen.
                     */

                    await wait(
                        250
                    );

                } catch (error) {

                    console.warn(
                        "Route-Skateparks konnten an einem Punkt nicht geladen werden.",
                        error
                    );

                }

            }


            /*
             * Alle gefundenen Parks zusammenführen.
             */

            const unique =
                [];


            const seen =
                new Set();


            for (
                const park
                of allParks
            ) {

                const key =
                    `${park.lat.toFixed(5)}|${park.lng.toFixed(5)}`;


                if (
                    seen.has(key)
                ) {

                    continue;

                }


                seen.add(key);


                unique.push(
                    park
                );

            }


            return unique;

        }


        /* =====================================================
           DISTANZ ZUR ROUTE
        ===================================================== */

        function pointToSegmentKm(
            point,
            start,
            end
        ) {

            const latRad =
                point.lat *
                Math.PI /
                180;


            const factor =
                Math.cos(
                    latRad
                );


            const px =
                point.lng *
                factor;


            const py =
                point.lat;


            const ax =
                start.lng *
                factor;


            const ay =
                start.lat;


            const bx =
                end.lng *
                factor;


            const by =
                end.lat;


            const dx =
                bx - ax;


            const dy =
                by - ay;


            if (
                dx === 0 &&
                dy === 0
            ) {

                return haversineKm(

                    point.lat,
                    point.lng,

                    start.lat,
                    start.lng

                );

            }


            const t =

                Math.max(

                    0,

                    Math.min(

                        1,

                        (

                            (px - ax) *
                            dx

                            +

                            (py - ay) *
                            dy

                        )

                        /

                        (

                            dx * dx +
                            dy * dy

                        )

                    )

                );


            const closestLat =
                ay +
                t * dy;


            const closestLng =
                (
                    ax +
                    t * dx
                ) /
                factor;


            return haversineKm(

                point.lat,
                point.lng,

                closestLat,
                closestLng

            );

        }


        function parkDistanceToRouteKm(
            park,
            coordinates
        ) {

            let minimum =
                Infinity;


            for (
                let i = 0;
                i <
                coordinates.length - 1;
                i++
            ) {

                const start = {

                    lat:
                        coordinates[i][1],

                    lng:
                        coordinates[i][0]

                };


                const end = {

                    lat:
                        coordinates[i + 1][1],

                    lng:
                        coordinates[i + 1][0]

                };


                const distance =
                    pointToSegmentKm(

                        {
                            lat:
                                park.lat,

                            lng:
                                park.lng
                        },

                        start,
                        end

                    );


                minimum =
                    Math.min(
                        minimum,
                        distance
                    );

            }


            return minimum;

        }


        /* =====================================================
           ROUTE ENTFERNEN
        ===================================================== */

        function removeRoute() {

            if (routeLayer) {

                map.removeLayer(
                    routeLayer
                );

                routeLayer =
                    null;

            }


            if (routeStartMarker) {

                map.removeLayer(
                    routeStartMarker
                );

                routeStartMarker =
                    null;

            }


            if (routeEndMarker) {

                map.removeLayer(
                    routeEndMarker
                );

                routeEndMarker =
                    null;

            }

        }


        /* =====================================================
           ZURÜCKSETZEN
        ===================================================== */

        function clearMap() {

            clearParks();

            removeRoute();


            currentParks =

            searchInput.value =

            routeStartInput.value =

            routeEndInput.value =

            results.innerHTML =

            results.hidden =

            map.setView(

                [
                    49.1,
                    8.4
                ],

                6

            );


            setStatus(
                "Suche nach einer Stadt oder starte eine Route."
            );

        }


        /* =====================================================
           HTML ESCAPEN
        ===================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value
            )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );

        }


        /* =====================================================
           WAIT
        ===================================================== */

        function wait(
            milliseconds
        ) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        milliseconds
                    )
            );

        }

        );


        setTimeout(
            () =>
                map.invalidateSize(true),
            1000
        );

    </script>
