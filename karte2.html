<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MOI-CY – Karte</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        /* =====================================================
           GRUNDLAYOUT
        ===================================================== */

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }


        body {

            overflow: hidden;

            background: #050505;

        }


        main.map-page {

            position: relative;

            width: 100%;
            height: 100dvh;

            padding: 0 !important;
            margin: 0;

        }


        .map-wrapper {

            position: fixed;

            top: var(--header-height);
            right: 0;
            bottom: 0;
            left: 0;

            overflow: hidden;

            background: #e8e8e8;

        }


        #map {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #e8e8e8;

        }


        /* =====================================================
           LEAFLET
        ===================================================== */

        .leaflet-container {

            width: 100%;
            height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #e8e8e8;

            overflow: hidden;

        }


        .leaflet-tile {

            max-width: none !important;
            max-height: none !important;

            filter: none !important;

        }


        .leaflet-tile-container img {

            max-width: none !important;

        }


        .leaflet-control-attribution {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.92
                ) !important;

            color: #555 !important;

            font-size: 10px;

            padding: 3px 6px !important;

        }


        .leaflet-control-attribution a {

            color: #333 !important;

        }


        .leaflet-control-zoom {

            border:
                1px solid
                rgba(
                    0,
                    0,
                    0,
                    0.18
                ) !important;

            box-shadow:
                0 4px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.15
                ) !important;

        }


        .leaflet-control-zoom a {

            width: 32px !important;
            height: 32px !important;

            line-height: 32px !important;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                ) !important;

            color: #111 !important;

            border-bottom-color:
                rgba(
                    0,
                    0,
                    0,
                    0.12
                ) !important;

        }


        .leaflet-control-zoom a:hover {

            background: #168cff !important;

            color: #fff !important;

        }


        /* =====================================================
           PANEL
        ===================================================== */

        .map-panel {

            position: absolute;

            z-index: 1000;

            top: 22px;
            left: 22px;

            width: 410px;

            max-width:
                calc(
                    100vw - 44px
                );

            max-height:
                calc(
                    100% - 44px
                );

            box-sizing: border-box;

            padding: 20px;

            overflow-y: auto;

            background:
                rgba(
                    8,
                    8,
                    8,
                    0.95
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.13
                );

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

        }


        .map-panel::-webkit-scrollbar {

            width: 5px;

        }


        .map-panel::-webkit-scrollbar-track {

            background: transparent;

        }


        .map-panel::-webkit-scrollbar-thumb {

            background: #333;

        }


        .map-kicker {

            margin:
                0 0 6px;

            color: #168cff;

            font-size: 10px;

            font-weight: 900;

            letter-spacing:
                0.18em;

            text-transform:
                uppercase;

        }


        .map-title {

            margin: 0;

            color: #fff;

            font-size: 38px;

            line-height: 0.95;

            font-weight: 900;

            letter-spacing:
                -0.04em;

            text-transform:
                uppercase;

        }


        .map-intro {

            margin:
                12px 0 18px;

            color: #929292;

            font-size: 12px;

            line-height: 1.55;

        }


        /* =====================================================
           SUCHLEISTE
        ===================================================== */

        .search-label {

            display: block;

            margin-bottom: 7px;

            color: #999;

            font-size: 9px;

            font-weight: 900;

            letter-spacing:
                0.14em;

            text-transform:
                uppercase;

        }


        .map-search-row {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto;

            gap: 7px;

        }


        .map-input,
        .route-input {

            display: block;

            width: 100%;

            min-width: 0;

            box-sizing: border-box;

            padding:
                12px 13px;

            background: #111;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.13
                );

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 12px;

            outline: none;

            border-radius: 0;

            transition:
                border-color
                0.2s ease,

                background
                0.2s ease;

        }


        .map-input:focus,
        .route-input:focus {

            background: #151515;

            border-color:
                #168cff;

        }


        .map-input::placeholder,
        .route-input::placeholder {

            color: #555;

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .map-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 40px;

            box-sizing: border-box;

            padding:
                10px 13px;

            border: 0;

            border-radius: 0;

            background: #168cff;

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 9px;

            font-weight: 900;

            letter-spacing:
                0.1em;

            text-transform:
                uppercase;

            cursor: pointer;

            transition:
                background
                0.15s ease,

                transform
                0.15s ease;

        }


        .map-button:hover {

            background: #2d9aff;

            transform:
                translateY(-1px);

        }


        .map-button.secondary {

            background: #1a1a1a;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.13
                );

        }


        .map-button.secondary:hover {

            background: #252525;

        }


        .map-button.full {

            width: 100%;

            margin-top: 7px;

        }


        .map-button:disabled {

            opacity: 0.45;

            cursor: wait;

            transform: none;

        }


        /* =====================================================
           MODUS BUTTONS
        ===================================================== */

        .mode-actions {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 7px;

            margin-top: 12px;

        }


        .mode-button {

            min-height: 42px;

        }


        /* =====================================================
           LOCATION INFO
        ===================================================== */

        .location-card {

            margin-top: 12px;

            padding:
                10px 12px;

            background: #0d0d0d;

            border-left:
                2px solid
                #168cff;

        }


        .location-card[hidden] {

            display: none;

        }


        .location-card-label {

            margin-bottom: 4px;

            color: #666;

            font-size: 8px;

            font-weight: 900;

            letter-spacing:
                0.14em;

            text-transform:
                uppercase;

        }


        .location-card-name {

            color: #eee;

            font-size: 11px;

            line-height: 1.45;

        }


        /* =====================================================
           SKATEPARK OPTIONS
        ===================================================== */

        .skate-options {

            margin-top: 17px;

            padding-top: 17px;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.09
                );

        }


        .skate-options[hidden] {

            display: none;

        }


        .section-label {

            display: block;

            margin-bottom: 8px;

            color: #999;

            font-size: 9px;

            font-weight: 900;

            letter-spacing:
                0.14em;

            text-transform:
                uppercase;

        }


        .radius-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    5,
                    1fr
                );

            gap: 5px;

        }


        .radius-option {

            position: relative;

        }


        .radius-option input {

            position: absolute;

            opacity: 0;

            pointer-events: none;

        }


        .radius-option span {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 34px;

            box-sizing: border-box;

            background: #111;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            color: #777;

            font-size: 9px;

            font-weight: 900;

            cursor: pointer;

            transition:
                0.15s ease;

        }


        .radius-option span:hover {

            color: #fff;

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

        }


        .radius-option input:checked + span {

            background: #168cff;

            border-color: #168cff;

            color: #fff;

        }


        .skate-search-button {

            width: 100%;

            margin-top: 8px;

        }


        /* =====================================================
           ROUTE
        ===================================================== */

        .route-box {

            display: none;

            margin-top: 17px;

            padding-top: 17px;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.09
                );

        }


        .route-box.active {

            display: block;

        }


        .route-fields {

            display: grid;

            gap: 7px;

        }


        .route-label {

            display: block;

            margin-bottom: 7px;

            color: #999;

            font-size: 9px;

            font-weight: 900;

            letter-spacing:
                0.14em;

            text-transform:
                uppercase;

        }


        .route-actions {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 7px;

            margin-top: 7px;

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .map-status {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 14px;

            padding:
                10px 12px;

            box-sizing: border-box;

            background: #0d0d0d;

            border-left:
                2px solid
                #333;

            color: #707070;

            font-size: 10px;

            line-height: 1.45;

        }


        .map-status.active {

            border-left-color:
                #168cff;

            color: #aaa;

        }


        .map-status.error {

            border-left-color:
                #ff4d4d;

            color: #ff8585;

        }


        .status-dot {

            width: 6px;
            height: 6px;

            min-width: 6px;

            border-radius: 50%;

            background: #555;

        }


        .map-status.active .status-dot {

            background: #168cff;

            box-shadow:
                0 0 10px
                rgba(
                    22,
                    140,
                    255,
                    0.8
                );

        }


        .map-status.error .status-dot {

            background: #ff4d4d;

        }


        /* =====================================================
           RESULTS
        ===================================================== */

        .results {

            margin-top: 16px;

        }


        .results[hidden] {

            display: none;

        }


        .results-heading {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 6px;

            color: #777;

            font-size: 9px;

            font-weight: 900;

            letter-spacing:
                0.14em;

            text-transform:
                uppercase;

        }


        .results-count {

            color: #168cff;

        }


        .park-result {

            display: block;

            width: 100%;

            padding:
                11px 0;

            background: transparent;

            border: 0;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            color: #fff;

            text-align: left;

            cursor: pointer;

        }


        .park-result:hover
        .park-result-name {

            color: #168cff;

        }


        .park-result-name {

            display: block;

            margin-bottom: 3px;

            color: #eee;

            font-size: 12px;

            font-weight: 900;

            text-transform:
                uppercase;

            transition:
                color
                0.15s ease;

        }


        .park-result-meta {

            display: block;

            color: #666;

            font-size: 10px;

            line-height: 1.45;

        }


        .park-distance {

            color: #168cff;

        }


        .park-size {

            color: #999;

        }


        .empty-results {

            padding:
                13px 0;

            color: #666;

            font-size: 11px;

            line-height: 1.5;

        }


        /* =====================================================
           MARKER
        ===================================================== */

        .moi-marker {

            width: 18px;
            height: 18px;

            box-sizing: border-box;

            background: #168cff;

            border:
                3px solid
                #fff;

            border-radius: 50%;

            box-shadow:

                0 0 0 5px
                rgba(
                    22,
                    140,
                    255,
                    0.16
                ),

                0 4px 14px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

        }


        .moi-route-marker {

            width: 12px;
            height: 12px;

            box-sizing: border-box;

            background: #fff;

            border:
                3px solid
                #168cff;

            border-radius: 50%;

            box-shadow:
                0 3px 12px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

        }


        /* =====================================================
           POPUP
        ===================================================== */

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {

            background: #101010;

            color: #fff;

        }


        .leaflet-popup-content {

            margin: 15px;

            min-width: 215px;

        }


        .popup-kicker {

            margin-bottom: 5px;

            color: #168cff;

            font-size: 8px;

            font-weight: 900;

            letter-spacing:
                0.15em;

            text-transform:
                uppercase;

        }


        .popup-title {

            margin-bottom: 5px;

            color: #fff;

            font-size: 15px;

            font-weight: 900;

            text-transform:
                uppercase;

        }


        .popup-address {

            color: #999;

            font-size: 10px;

            line-height: 1.45;

        }


        .popup-route {

            display: inline-block;

            margin-top: 10px;

            padding:
                8px 10px;

            background: #168cff;

            color: #fff;

            font-size: 8px;

            font-weight: 900;

            letter-spacing:
                0.08em;

            text-decoration: none;

            text-transform:
                uppercase;

        }


        .popup-route:hover {

            background: #2d9aff;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 900px) {

            .map-panel {

                width: 390px;

            }

        }


        @media (max-width: 700px) {

            .map-wrapper {

                top: 68px;

            }


            .map-panel {

                top: 10px;
                left: 10px;

                width:
                    calc(
                        100vw - 20px
                    );

                max-width: none;

                max-height:
                    calc(
                        100% - 20px
                    );

                padding: 15px;

            }


            .map-title {

                font-size: 30px;

            }


            .map-intro {

                margin-top: 10px;

                margin-bottom: 13px;

                font-size: 11px;

            }

        }


        @media (max-width: 430px) {

            .map-panel {

                padding: 13px;

            }


            .map-title {

                font-size: 27px;

            }


            .map-input,
            .route-input {

                padding: 11px;

                font-size: 11px;

            }


            .map-button {

                padding:
                    9px 10px;

                font-size: 8px;

            }


            .radius-grid {

                grid-template-columns:
                    repeat(
                        3,
                        1fr
                    );

            }

        }

    </style>

</head>


<body>

    <div id="site-header"></div>


    <main class="map-page">

        <div class="map-wrapper">

            <div id="map"></div>


            <aside class="map-panel">

                <p class="map-kicker">
                    MOI-CY / MAP
                </p>


                <h1 class="map-title">
                    FIND YOUR SPOT
                </h1>


                <p class="map-intro">

                    Suche zuerst einen Ort.
                    Danach kannst du unabhängig
                    davon eine Route planen oder
                    Skateparks in einem frei
                    wählbaren Radius suchen.

                </p>


                <!-- =========================================
                     EINE ZENTRALE SUCHLEISTE
                ========================================== -->

                <label
                    class="search-label"
                    for="locationSearch"
                >
                    Ort oder Adresse
                </label>


                <div class="map-search-row">

                    <input
                        id="locationSearch"
                        class="map-input"
                        type="search"
                        placeholder="z. B. Karlsruhe, Heidelberg..."
                        autocomplete="off"
                    >


                    <button
                        id="searchButton"
                        class="map-button"
                        type="button"
                    >
                        SUCHEN
                    </button>

                </div>


                <!-- =========================================
                     GEFUNDENER ORT
                ========================================== -->

                <div
                    id="locationCard"
                    class="location-card"
                    hidden
                >

                    <div class="location-card-label">
                        AKTUELLER ORT
                    </div>


                    <div
                        id="locationCardName"
                        class="location-card-name"
                    ></div>

                </div>


                <!-- =========================================
                     MODI
                ========================================== -->

                <div class="mode-actions">

                    <button
                        id="routeModeButton"
                        class="map-button secondary mode-button"
                        type="button"
                    >
                        ROUTE
                    </button>


                    <button
                        id="skateModeButton"
                        class="map-button mode-button"
                        type="button"
                    >
                        SKATEPARKS
                    </button>

                </div>


                <!-- =========================================
                     SKATEPARK OPTIONEN
                ========================================== -->

                <div
                    id="skateOptions"
                    class="skate-options"
                    hidden
                >

                    <label class="section-label">
                        Suchradius
                    </label>


                    <div class="radius-grid">

                        <label class="radius-option">

                            <input
                                type="radio"
                                name="radius"
                                value="2000"
                            >

                            <span>
                                2 KM
                            </span>

                        </label>


                        <label class="radius-option">

                            <input
                                type="radio"
                                name="radius"
                                value="5000"
                                checked
                            >

                            <span>
                                5 KM
                            </span>

                        </label>


                        <label class="radius-option">

                            <input
                                type="radio"
                                name="radius"
                                value="10000"
                            >

                            <span>
                                10 KM
                            </span>

                        </label>


                        <label class="radius-option">

                            <input
                                type="radio"
                                name="radius"
                                value="25000"
                            >

                            <span>
                                25 KM
                            </span>

                        </label>


                        <label class="radius-option">

                            <input
                                type="radio"
                                name="radius"
                                value="50000"
                            >

                            <span>
                                50 KM
                            </span>

                        </label>

                    </div>


                    <button
                        id="skateSearchButton"
                        class="map-button skate-search-button"
                        type="button"
                    >
                        SKATEPARKS SUCHEN
                    </button>

                </div>


                <!-- =========================================
                     ROUTE
                ========================================== -->

                <div
                    id="routeBox"
                    class="route-box"
                >

                    <label class="route-label">
                        Route planen
                    </label>


                    <div class="route-fields">

                        <input
                            id="routeStart"
                            class="route-input"
                            type="text"
                            placeholder="Start"
                            autocomplete="off"
                        >


                        <input
                            id="routeEnd"
                            class="route-input"
                            type="text"
                            placeholder="Ziel"
                            autocomplete="off"
                        >

                    </div>


                    <div class="route-actions">

                        <button
                            id="routeButton"
                            class="map-button"
                            type="button"
                        >
                            ROUTE BERECHNEN
                        </button>


                        <button
                            id="clearButton"
                            class="map-button secondary"
                            type="button"
                        >
                            ZURÜCKSETZEN
                        </button>

                    </div>

                </div>


                <!-- =========================================
                     STATUS
                ========================================== -->

                <div
                    id="mapStatus"
                    class="map-status"
                >

                    <span class="status-dot"></span>


                    <span id="mapStatusText">

                        Suche einen Ort, plane eine
                        Route oder suche Skateparks.

                    </span>

                </div>


                <!-- =========================================
                     ERGEBNISSE
                ========================================== -->

                <div
                    id="results"
                    class="results"
                    hidden
                ></div>

            </aside>

        </div>

    </main>


    <div id="site-footer"></div>


    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =====================================================
         MOI-CY MAP
    ====================================================== -->

    <script type="module">

        /* =====================================================
           KONFIGURATION
        ===================================================== */

        const NOMINATIM_URL =
            "https://nominatim.openstreetmap.org/search";


        const OVERPASS_URLS = [

            "https://overpass-api.de/api/interpreter",

            "https://overpass.kumi.systems/api/interpreter",

            "https://overpass.private.coffee/api/interpreter"

        ];


        /*
         * Es werden maximal diese Skateparks
         * standardmäßig angezeigt.
         *
         * Wichtig:
         * Die Datenbankabfrage selbst wird NICHT
         * auf diese Anzahl begrenzt.
         */

        const MAX_VISIBLE_PARKS =
            15;


        /*
         * Anzahl der Geocoding-Treffer.
         *
         * Dadurch können wir bei Schreibfehlern
         * mehrere Kandidaten vergleichen.
         */

        const GEOCODE_LIMIT =
            5;


        /* =====================================================
           KARTE
        ===================================================== */

        const map =
            L.map(
                "map",
                {

                    zoomControl:
                        false,

                    minZoom:
                        3,

                    maxZoom:
                        19,

                    preferCanvas:
                        false

                }
            )
            .setView(
                [
                    49.1,
                    8.4
                ],
                6
            );


        L.control.zoom({

            position:
                "bottomright"

        }).addTo(map);


        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom:
                    19,

                tileSize:
                    256,

                attribution:
                    '&copy; OpenStreetMap-Mitwirkende'

        /* =====================================================
           TEXT NORMALISIERUNG
        ===================================================== */

        function normalizeText(
            value
        ) {

            return String(
                value || ""
            )
            .toLowerCase()
            .normalize(
                "NFD"
            )
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
            .replace(
                /ß/g,
                "ss"
            )
            .replace(
                /[^a-z0-9\s]/g,
                " "
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();

        }


        /* =====================================================
           STRING ÄHNLICHKEIT
        ===================================================== */

        function levenshtein(
            a,
            b
        ) {

            a =
                normalizeText(a);

            b =
                normalizeText(b);


            if (a === b) {

                return 0;

            }


            if (!a.length) {

                return b.length;

            }


            if (!b.length) {

                return a.length;

            }


            const matrix =
                Array.from(
                    {
                        length:
                            a.length + 1
                    },
                    () =>
                        new Array(
                            b.length + 1
                        )
                        .fill(0)
                );


            for (
                let i = 0;
                i <= a.length;
                i++
            ) {

                matrix[i][0] =
                    i;

            }


            for (
                let j = 0;
                j <= b.length;
                j++
            ) {

                matrix[0][j] =
                    j;

            }


            for (
                let i = 1;
                i <= a.length;
                i++
            ) {

                for (
                    let j = 1;
                    j <= b.length;
                    j++
                ) {

                    const cost =
                        a[i - 1] ===
                        b[j - 1]
                            ? 0
                            : 1;


                    matrix[i][j] =
                        Math.min(

                            matrix[i - 1][j] + 1,

                            matrix[i][j - 1] + 1,

                            matrix[i - 1][j - 1] +
                                cost

                        );

                }

            }


            return matrix
                [a.length]
                [b.length];

        }


        function similarity(
            a,
            b
        ) {

            const aa =
                normalizeText(a);


            const bb =
                normalizeText(b);


            if (
                !aa ||
                !bb
            ) {

                return 0;

            }


            const distance =
                levenshtein(
                    aa,
                    bb
                );


            return Math.max(

                0,

                1 -
                    distance /
                    Math.max(
                        aa.length,
                        bb.length
                    )

            );

        }


        /* =====================================================
           NOMINATIM
        ===================================================== */

        async function geocode(
            query
        ) {

            const cleanQuery =
                query.trim();


            if (!cleanQuery) {

                return null;

            }


            const cache =
                readCache();


            const key =
                normalizeText(
                    cleanQuery
                );


            if (cache[key]) {

                return cache[key];

            }


            const url =
                NOMINATIM_URL +

                "?format=jsonv2" +

                `&limit=${GEOCODE_LIMIT}` +

                "&addressdetails=1" +

                "&countrycodes=de" +

                "&accept-language=de" +

                "&q=" +

                encodeURIComponent(
                    cleanQuery
                );


            const response =
                await fetch(
                    url,
                    {

                        headers: {

                            "Accept":
                                "application/json"

                        }

                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Geocoding HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            if (
                !Array.isArray(data) ||
                !data.length
            ) {

                return null;

            }


            /*
             * Kandidaten bewerten.
             *
             * Ein exakter Name bekommt einen hohen Score.
             * Zusätzlich werden Adresse und Displayname
             * berücksichtigt.
             */

            const scored =
                data
                    .map(
                        item => {

                            const display =
                                item.display_name ||
                                "";


                            const name =
                                item.name ||
                                "";


                            const address =
                                [
                                    item.address?.city,
                                    item.address?.town,
                                    item.address?.village,
                                    item.address?.municipality,
                                    item.address?.state
                                ]
                                .filter(Boolean)
                                .join(" ");


                            const nameSimilarity =
                                similarity(
                                    cleanQuery,
                                    name
                                );


                            const displaySimilarity =
                                similarity(
                                    cleanQuery,
                                    display
                                );


                            const addressSimilarity =
                                similarity(
                                    cleanQuery,
                                    address
                                );


                            let score =

                                nameSimilarity *
                                0.55

                                +

                                displaySimilarity *
                                0.30

                                +

                                addressSimilarity *
                                0.15;


                            if (
                                normalizeText(
                                    name
                                ) === key
                            ) {

                                score +=
                                    0.35;

                            }


                            /*
                             * Orte bevorzugen.
                             */

                            const type =
                                item.type ||
                                "";


                            if (
                                [
                                    "city",
                                    "town",
                                    "village",
                                    "municipality",
                                    "suburb"
                                ]
                                .includes(type)
                            ) {

                                score +=
                                    0.12;

                            }


                            return {

                                item,
                                score

                            };

                        }
                    )
                    .sort(
                        (
                            a,
                            b
                        ) =>
                            b.score -
                            a.score
                    );


            const best =
                scored[0]?.item;


            if (!best) {

                return null;

            }


            const result = {

                lat:
                    Number(
                        best.lat
                    ),

                lng:
                    Number(
                        best.lon
                    ),

                displayName:
                    best.display_name ||
                    cleanQuery,

                name:
                    best.name ||
                    cleanQuery

            };


            cache[key] =
                result;


            writeCache(
                cache
            );


            return result;

        }


        /* =====================================================
           OVERPASS
        ===================================================== */

        async function queryOverpass(
            query
        ) {

            let lastError =
                null;


            for (
                const endpoint
                of OVERPASS_URLS
            ) {

                try {

                    const response =
                        await fetch(
                            endpoint,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "text/plain;charset=UTF-8",

                                    "Accept":
                                        "application/json"

                                },

                                body:
                                    query

                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            `Overpass HTTP ${response.status}`
                        );

                    }


                    return await response.json();

                } catch (error) {

                    console.warn(
                        "Overpass-Server fehlgeschlagen:",
                        endpoint,
                        error
                    );


                    lastError =
                        error;

                }

            }


            throw (
                lastError ||
                new Error(
                    "Kein Overpass-Server erreichbar."
                )
            );

        }

        /* =====================================================
           SKATEPARK FILTER
        ===================================================== */

        const EXCLUDED_WORDS = [

            "playground",
            "spielplatz",
            "kinderspielplatz",
            "basketball",
            "streetball",
            "football",
            "soccer",
            "fussball",
            "tennis",
            "volleyball",
            "golf",
            "parking",
            "parkplatz",
            "parkhaus",
            "schule",
            "school",
            "kindergarten",
            "kita",
            "pumptrack",
            "pump track",
            "bmx only",
            "bmx-only"

        ];


        const POSITIVE_WORDS = [

            "skatepark",
            "skate park",
            "skate plaza",
            "skateanlage",
            "skate anlage",
            "skateplatz",
            "skate platz",
            "skate bowl",
            "skatebowl",
            "bowl",
            "skateboard",
            "skateboarding"

        ];


        function shouldKeepSkatepark(
            element
        ) {

            const tags =
                element.tags || {};


            const isOfficialSkateparkTag =
                tags.leisure ===
                "skatepark";


            const name =
                normalizeText(
                    tags.name
                );


            const description =
                normalizeText(
                    tags.description
                );


            const sport =
                normalizeText(
                    tags.sport
                );


            const combined =
                [
                    name,
                    description,
                    sport
                ]
                .filter(Boolean)
                .join(" ");


            const hasExcludedWord =
                EXCLUDED_WORDS.some(
                    word =>
                        combined.includes(
                            normalizeText(
                                word
                            )
                        )
                );


            if (
                hasExcludedWord &&
                !isOfficialSkateparkTag
            ) {

                return false;

            }


            if (
                !isOfficialSkateparkTag &&
                !POSITIVE_WORDS.some(
                    word =>
                        combined.includes(
                            normalizeText(
                                word
                            )
                        )
                )
            ) {

                return false;

            }


            const isOnlyBmx =
                sport === "bmx" &&
                !name.includes(
                    "skate"
                );


            if (isOnlyBmx) {

                return false;

            }


            return true;

        }

                    )

                        ),

                        Number(

                        )

                };

            }


            return null;

        }


        /* =====================================================
           ADRESSE
        ===================================================== */

        function createParkAddress(
            tags
        ) {

            const street =
                tags["addr:street"] ||
                "";


            const houseNumber =
                tags["addr:housenumber"] ||
                "";


            const postcode =
                tags["addr:postcode"] ||
                "";


            const city =
                tags["addr:city"] ||
                tags["addr:town"] ||
                tags["addr:village"] ||
                "";


            const streetLine =
                [
                    street,
                    houseNumber
                ]
                .filter(Boolean)
                .join(" ");


            const cityLine =
                [
                    postcode,
                    city
                ]
                .filter(Boolean)
                .join(" ");


            return [

                streetLine,
                cityLine

            ]
            .filter(Boolean)
            .join(", ");

        }


        /* =====================================================
           PARK-GRÖSSE / RELEVANZ
        ===================================================== */

        function getNumericArea(
            tags
        ) {

            const possibleValues = [

                tags.area,
                tags["area:m2"],
                tags["surface:area"]

            ];


            for (
                const value
                of possibleValues
            ) {

                if (!value) {

                    continue;

                }


                const match =
                    String(value)
                        .replace(
                            ",",
                            "."
                        )
                        .match(
                            /[\d.]+/
                        );


                if (!match) {

                    continue;

                }


                const number =
                    Number(
                        match[0]
                    );


                if (
                    Number.isFinite(
                        number
                    )
                ) {

                    return number;

                }

            }


            return null;

        }


        function getParkScore(
            tags
        ) {

            let score =
                0;


            /*
             * Offizielles OSM-Tag
             * ist der wichtigste Faktor.
             */

            if (
                tags.leisure ===
                "skatepark"
            ) {

                score +=
                    100;

            }


            const name =
                normalizeText(
                    tags.name
                );


            const description =
                normalizeText(
                    tags.description
                );


            const sport =
                normalizeText(
                    tags.sport
                );


            const combined =
                [
                    name,
                    description,
                    sport
                ]
                .join(" ");


            /*
             * Skateboard-Bezug.
             */

            if (
                sport.includes(
                    "skateboard"
                )
            ) {

                score +=
                    25;

            }


            if (
                name.includes(
                    "skatepark"
                )
            ) {

                score +=
                    20;

            }


            if (
                name.includes(
                    "skateanlage"
                ) ||
                name.includes(
                    "skate plaza"
                )
            ) {

                score +=
                    15;

            }


            /*
             * Mehrere Skate-Elemente können
             * auf eine größere Anlage hindeuten.
             */

            const featureWords = [

                "bowl",
                "ramp",
                "quarter",
                "miniramp",
                "funbox",
                "ledge",
                "rail",
                "curb",
                "bank",
                "spine"

            ];


            let featureCount =
                0;


            for (
                const word
                of featureWords
            ) {

                if (
                    combined.includes(
                        word
                    )
                ) {

                    featureCount++;

                }

            }


            score +=
                Math.min(
                    featureCount * 4,
                    24
                );


            /*
             * Flächenangabe.
             */

            const area =
                getNumericArea(
                    tags
                );


            if (
                Number.isFinite(
                    area
                )
            ) {

                score +=
                    Math.min(
                        area / 100,
                        50
                    );

            }


            /*
             * Website / Social / Kontakt
             * macht einen Eintrag nicht größer,
             * aber etwas vollständiger.
             */

            if (
                tags.website ||
                tags["contact:website"]
            ) {

                score +=
                    5;

            }


            return score;

        }


        function formatArea(
            area
        ) {

            if (
                !Number.isFinite(
                    area
                )
            ) {

                return "";

            }


            if (
                area >= 10000
            ) {

                return (
                    area /
                    10000
                )
                .toFixed(1)
                .replace(
                    ".0",
                    ""
                )
                + " ha";

            }


            return (
                Math.round(
                    area
                )
            )
            + " m²";

        }


        /* =====================================================
           NORMALISIEREN
        ===================================================== */

        function normalizeSkateparks(
            elements
        ) {

            const parks =
                [];


            const seen =
                new Set();


            for (
                const element
                of elements
            ) {

                if (
                    !shouldKeepSkatepark(
                        element
                    )
                ) {

                    continue;

                }


                const coordinates =
                    elementCoordinates(
                        element
                    );


                if (!coordinates) {

                    continue;

                }


                const tags =
                    element.tags || {};


                const name =
                    (
                        tags.name ||
                        tags["name:de"] ||
                        tags["name:en"] ||
                        "Skatepark"
                    )
                    .trim();


                const roundedLat =
                    coordinates.lat
                        .toFixed(5);


                const roundedLng =
                    coordinates.lng
                        .toFixed(5);


                const duplicateKey =

                    [
                        normalizeText(
                            name
                        ),

                        roundedLat,

                        roundedLng

                    ]
                    .join("|");


                if (
                    seen.has(
                        duplicateKey
                    )
                ) {

                    continue;

                }


                seen.add(
                    duplicateKey
                );


                const address =
                    createParkAddress(
                        tags
                    );


                const city =
                    tags["addr:city"] ||
                    tags["addr:town"] ||
                    tags["addr:village"] ||
                    "";


                const website =
                    tags.website ||
                    tags["contact:website"] ||
                    "";


                const area =
                    getNumericArea(
                        tags
                    );


                const score =
                    getParkScore(
                        tags
                    );


                parks.push({

                    id:
                        `osm-${element.type}-${element.id}`,

                    osmType:
                        element.type,

                    osmId:
                        element.id,

                    name,

                    city,

                    address:
                        address ||
                        city ||
                        "OpenStreetMap-Eintrag",

                    lat:
                        coordinates.lat,

                    lng:
                        coordinates.lng,

                    website,

                    area,

                    score,

                    tags

                });

            }


            /*
             * Zweiter Dublettencheck:
             * gleiche Anlage mit verschiedenen OSM-Objekten.
             */

            const finalParks =
                [];


            for (
                const park
                of parks
            ) {

                const duplicate =
                    finalParks.some(
                        existing =>

                            haversineKm(

                                park.lat,
                                park.lng,

                                existing.lat,
                                existing.lng

                            ) < 0.08

                            &&

                            normalizeText(
                                park.name
                            ) ===
                            normalizeText(
                                existing.name
                            )

                    );


                if (!duplicate) {

                    finalParks.push(
                        park
                    );

                }

            }


            /*
             * Größere/relevantere Anlagen zuerst.
             */

            finalParks.sort(
                (
                    a,
                    b
                ) => {

                    if (
                        b.score !==
                        a.score
                    ) {

                        return (
                            b.score -
                            a.score
                        );

                    }


                    return (
                        a.name.localeCompare(
                            b.name,
                            "de"
                        )
                    );

                }
            );


            return finalParks;

        }
