<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MOI-CY – Karte</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    :root {
      --header-height: 68px;
      --panel-width: 390px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
    }

    #site-header {
      position: relative;
      z-index: 2000;
    }

    .map-page {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--header-height));
      min-height: 400px;
    }

    .map-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #e9e9e9;
    }

    /* --------------------------------------------------
       PANEL
    -------------------------------------------------- */

    .map-panel {
      position: absolute;
      z-index: 1000;
      top: 16px;
      left: 16px;
      width: var(--panel-width);
      max-width: calc(100vw - 32px);
      max-height: calc(100% - 32px);
      overflow-y: auto;

      background: rgba(255, 255, 255, 0.97);
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.18);

      padding: 16px;
    }

    .map-panel.collapsed {
      width: auto;
      max-height: none;
      overflow: visible;
      padding: 8px;
    }

    .map-panel.collapsed .panel-content {
      display: none;
    }

    .panel-toggle {
      border: 0;
      background: #111;
      color: #fff;
      border-radius: 10px;
      min-width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
    }

    .collapsed .panel-toggle {
      display: block;
    }

    .panel-top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .panel-title {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.2;
    }

    .panel-subtitle {
      margin: 0 0 14px;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
    }

    /* --------------------------------------------------
       SEARCH
    -------------------------------------------------- */

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;

      width: 100%;
      height: 48px;

      padding: 0 12px;

      border: 1px solid #ddd;
      border-radius: 24px;

      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .search-icon {
      flex: 0 0 auto;
      font-size: 18px;
      color: #777;
    }

    .search-box input {
      flex: 1;
      min-width: 0;

      border: 0;
      outline: 0;

      font-size: 15px;
      background: transparent;
    }

    .search-box button {
      flex: 0 0 auto;

      border: 0;
      border-radius: 18px;

      padding: 8px 13px;

      background: #111;
      color: #fff;

      cursor: pointer;
      font-weight: 700;
    }

    .search-box button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .search-hint {
      margin: 7px 8px 14px;
      font-size: 12px;
      color: #777;
    }

    /* --------------------------------------------------
       SECTIONS
    -------------------------------------------------- */

    .panel-section {
      border-top: 1px solid #eee;
      padding-top: 14px;
      margin-top: 14px;
    }

    .section-title {
      margin: 0 0 9px;
      font-size: 14px;
      font-weight: 700;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control label {
      font-size: 12px;
      color: #666;
    }

    .control select,
    .control input {
      width: 100%;
      height: 40px;

      border: 1px solid #ddd;
      border-radius: 9px;

      background: #fff;
      padding: 0 9px;

      font-size: 14px;
      outline: none;
    }

    .control select:focus,
    .control input:focus {
      border-color: #999;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .button {
      flex: 1;

      min-height: 40px;

      border: 0;
      border-radius: 9px;

      padding: 8px 10px;

      cursor: pointer;

      background: #111;
      color: #fff;

      font-size: 13px;
      font-weight: 700;
    }

    .button.secondary {
      background: #eee;
      color: #111;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    /* --------------------------------------------------
       ROUTE
    -------------------------------------------------- */

    .route-stop {
      display: flex;
      gap: 7px;
      margin-bottom: 7px;
    }

    .route-stop input {
      flex: 1;

      height: 40px;

      border: 1px solid #ddd;
      border-radius: 9px;

      padding: 0 10px;

      font-size: 13px;
      outline: none;
    }

    .route-stop button {
      width: 40px;
      border: 0;
      border-radius: 9px;
      background: #eee;
      cursor: pointer;
      font-size: 17px;
    }

    .route-stop button:hover {
      background: #ddd;
    }

    /* --------------------------------------------------
       STATUS
    -------------------------------------------------- */

    .status {
      display: none;

      margin-top: 12px;
      padding: 10px 11px;

      border-radius: 9px;

      background: #f2f2f2;
      color: #444;

      font-size: 12px;
      line-height: 1.4;
    }

    .status.visible {
      display: block;
    }

    .status.error {
      background: #fff0f0;
      color: #a00000;
    }

    .status.success {
      background: #eff8ef;
      color: #256325;
    }

    .progress {
      width: 100%;
      height: 4px;

      margin-top: 7px;

      overflow: hidden;

      border-radius: 5px;

      background: #ddd;
    }

    .progress-bar {
      width: 35%;
      height: 100%;

      background: #111;

      animation: loading 1.1s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(350%);
      }
    }

    /* --------------------------------------------------
       RESULTS
    -------------------------------------------------- */

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-top: 14px;
      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .result-item {
      padding: 10px;

      border: 1px solid #eee;
      border-radius: 10px;

      background: #fff;

      cursor: pointer;

      transition: background 0.15s, transform 0.15s;
    }

    .result-item:hover {
      background: #f7f7f7;
      transform: translateY(-1px);
    }

    .result-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    .result-meta {
      margin-top: 3px;

      color: #666;

      font-size: 11px;
      line-height: 1.35;
    }

    .result-empty {
      padding: 12px;

      border-radius: 10px;

      background: #f5f5f5;

      color: #666;

      font-size: 12px;
      line-height: 1.45;
    }

    /* --------------------------------------------------
       LEAFLET
    -------------------------------------------------- */

    .leaflet-control-zoom {
      margin-bottom: 18px !important;
    }

    .leaflet-bottom.leaflet-right {
      bottom: 10px;
      right: 10px;
    }

    .park-marker {
      display: flex;
      justify-content: center;
      align-items: center;

      width: 30px;
      height: 30px;

      border-radius: 50%;

      background: #111;
      color: #fff;

      border: 3px solid #fff;

      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.35);

      font-size: 14px;
    }

    .route-marker {
      display: flex;
      justify-content: center;
      align-items: center;

      width: 30px;
      height: 30px;

      border-radius: 50%;

      background: #fff;
      color: #111;

      border: 3px solid #111;

      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.3);

      font-size: 12px;
      font-weight: 700;
    }

    .popup-title {
      margin-bottom: 5px;
      font-weight: 700;
      font-size: 15px;
    }

    .popup-meta {
      color: #555;
      font-size: 12px;
      line-height: 1.45;
    }

    .popup-button {
      display: inline-block;

      margin-top: 8px;

      padding: 7px 9px;

      border-radius: 7px;

      background: #111;
      color: #fff !important;

      text-decoration: none;

      font-size: 12px;
      font-weight: 700;
    }

    /* --------------------------------------------------
       MOBILE
    -------------------------------------------------- */

    @media (max-width: 700px) {
      :root {
        --header-height: 60px;
      }

      .map-panel {
        top: 9px;
        left: 9px;

        width: calc(100vw - 18px);
        max-height: calc(100% - 18px);

        padding: 12px;
        border-radius: 13px;
      }

      .panel-title {
        font-size: 19px;
      }

      .controls-grid {
        grid-template-columns: 1fr 1fr;
      }

      .leaflet-bottom.leaflet-right {
        bottom: 8px;
        right: 8px;
      }
    }
  </style>
</head>

<body>

  <div id="site-header"></div>

  <main class="map-page">
    <div class="map-wrapper">

      <div id="map"></div>

      <aside class="map-panel" id="mapPanel">

        <div class="panel-top">
          <button
            class="panel-toggle"
            id="panelToggle"
            type="button"
            title="Menü ein-/ausblenden"
            aria-label="Menü ein-/ausblenden"
          >
            ☰
          </button>
        </div>

        <div class="panel-content">

          <h1 class="panel-title">Skatepark-Karte</h1>

          <p class="panel-subtitle">
            Ort suchen, Skateparks separat laden oder eine Route planen.
          </p>

          <!-- ==================================================
               ORTSSUCHE
          =================================================== -->

          <form id="placeSearchForm">

            <div class="search-box">

              <span class="search-icon">⌕</span>

              <input
                id="placeInput"
                type="text"
                autocomplete="off"
                placeholder="Ort, Stadt oder Adresse suchen"
              >

              <button
                id="placeSearchButton"
                type="submit"
              >
                Suchen
              </button>

            </div>

          </form>

          <div class="search-hint">
            Tippfehler sind okay – z. B. „Karlsrue“.
          </div>

          <!-- ==================================================
               SKATEPARK-SUCHE
          =================================================== -->

          <section class="panel-section">

            <h2 class="section-title">
              Skateparks suchen
            </h2>

            <div class="controls-grid">

              <div class="control">

                <label for="radiusSelect">
                  Radius
                </label>

                <select id="radiusSelect">

                  <option value="2">2 km</option>
                  <option value="5">5 km</option>
                  <option value="10">10 km</option>
                  <option value="15">15 km</option>
                  <option value="20">20 km</option>
                  <option value="25" selected>25 km</option>

                </select>

              </div>

              <div class="control">

                <label for="resultCountSelect">
                  Anzahl
                </label>

                <select id="resultCountSelect">

                  <option value="10">10</option>
                  <option value="15">15</option>
                  <option value="20" selected>20</option>
                  <option value="25">25</option>
                  <option value="30">30</option>

                </select>

              </div>

            </div>

            <div class="button-row">

              <button
                class="button"
                id="searchParksButton"
                type="button"
              >
                Skateparks hier suchen
              </button>

              <button
                class="button secondary"
                id="clearButton"
                type="button"
              >
                Zurücksetzen
              </button>

            </div>

          </section>

          <!-- ==================================================
               ROUTE
          =================================================== -->

          <section class="panel-section">

            <h2 class="section-title">
              Route
            </h2>

            <div id="routeStops">

              <div class="route-stop">
                <input
                  type="text"
                  class="route-input"
                  placeholder="Start"
                  autocomplete="off"
                >
                <button
                  type="button"
                  class="remove-stop"
                  title="Stop entfernen"
                  style="visibility:hidden"
                >
                  ×
                </button>
              </div>

              <div class="route-stop">
                <input
                  type="text"
                  class="route-input"
                  placeholder="Ziel"
                  autocomplete="off"
                >
                <button
                  type="button"
                  class="remove-stop"
                  title="Stop entfernen"
                  style="visibility:hidden"
                >
                  ×
                </button>
              </div>

            </div>

            <div class="button-row">

              <button
                class="button secondary"
                id="addStopButton"
                type="button"
              >
                + Zwischenstopp
              </button>

              <button
                class="button"
                id="routeButton"
                type="button"
              >
                Route planen
              </button>

            </div>

            <div class="button-row">

              <button
                class="button secondary"
                id="parksAlongRouteButton"
                type="button"
              >
                Skateparks an Route
              </button>

            </div>

          </section>

          <!-- ==================================================
               STATUS
          =================================================== -->

          <div
            class="status"
            id="status"
            role="status"
            aria-live="polite"
          ></div>

          <!-- ==================================================
               ERGEBNISSE
          =================================================== -->

          <div class="results-header">

            <span>
              Ergebnisse
            </span>

            <span id="resultCount">
              0
            </span>

          </div>

          <div
            class="results"
            id="results"
          >
            <div class="result-empty">
              Noch keine Skateparks gesucht.
            </div>
          </div>

        </div>

      </aside>

    </div>
  </main>

  <div id="site-footer"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>

    /* =========================================================
       KONFIGURATION
    ========================================================= */

    const CONFIG = {

      /* Öffentliche Geocoding-Dienste */
      nominatim:
        "https://nominatim.openstreetmap.org/search",

      photon:
        "https://photon.komoot.io/api/",

      /* Mehrere Overpass-Server als Fallback */
      overpass: [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.kumi.systems/api/interpreter",
        "https://overpass.private.coffee/api/interpreter"
      ],

      osrm:
        "https://router.project-osrm.org/route/v1/driving",

      /* Harte Grenzen */
      maxRadiusKm: 25,
      maxResults: 30,

      /* Gesamtlimit pro Suchvorgang */
      searchTimeoutMs: 45000,

      /* Einzelne Overpass-Anfrage */
      overpassTimeoutMs: 11000,

      /* maximal gleichzeitig laufende Anfragen */
      overpassConcurrency: 2,

      /* maximal 8 Zwischenstopps */
      maxRouteStops: 8,

      /* Nominatim-Regel */
      geocodeDelayMs: 1100,

      cacheDays: 14

    };


    /* =========================================================
       MAP
    ========================================================= */

    const map = L.map("map", {

      minZoom: 2,
      maxZoom: 19,

      worldCopyJump: false,

      maxBounds: [
        [-85, -180],
        [85, 180]
      ],

      maxBoundsViscosity: 1.0,

      zoomControl: false

    }).setView([51.1657, 10.4515], 6);


    L.control.zoom({
      position: "bottomright"
    }).addTo(map);


    const osmLayer = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
      }
    ).addTo(map);


    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution:
          "Tiles &copy; Esri"
      }
    );


    L.control.layers(
      {
        "Karte": osmLayer,
        "Satellit": satelliteLayer
      },
      {},
      {
        position: "bottomright"
      }
    ).addTo(map);


    const parkLayer = L.layerGroup().addTo(map);
    const routeLayer = L.layerGroup().addTo(map);


    /* =========================================================
       DOM
    ========================================================= */

    const panel =
      document.getElementById("mapPanel");

    const panelToggle =
      document.getElementById("panelToggle");

    const placeInput =
      document.getElementById("placeInput");

    const placeSearchForm =
      document.getElementById("placeSearchForm");

    const placeSearchButton =
      document.getElementById("placeSearchButton");

    const radiusSelect =
      document.getElementById("radiusSelect");

    const resultCountSelect =
      document.getElementById("resultCountSelect");

    const searchParksButton =
      document.getElementById("searchParksButton");

    const clearButton =
      document.getElementById("clearButton");

    const routeStops =
      document.getElementById("routeStops");

    const addStopButton =
      document.getElementById("addStopButton");

    const routeButton =
      document.getElementById("routeButton");

    const parksAlongRouteButton =
      document.getElementById("parksAlongRouteButton");

    const statusBox =
      document.getElementById("status");

    const resultsBox =
      document.getElementById("results");

    const resultCount =
      document.getElementById("resultCount");


    /* =========================================================
       STATE
    ========================================================= */

    let lastSearchLocation = null;

    let currentParks = [];

    let currentRoute = null;

    let startMarker = null;
    let endMarker = null;


    /* =========================================================
       PANEL
    ========================================================= */

    panelToggle.addEventListener("click", () => {

      panel.classList.toggle("collapsed");

      panelToggle.textContent =
        panel.classList.contains("collapsed")
          ? "☰"
          : "×";

      setTimeout(() => {
        map.invalidateSize();
      }, 250);

    });


    /* =========================================================
       STATUS
    ========================================================= */

    function setStatus(
      message,
      type = "",
      loading = false
    ) {

      statusBox.className = "status visible";

      if (type) {
        statusBox.classList.add(type);
      }

      statusBox.innerHTML =
        escapeHtml(message) +
        (
          loading
            ? `
              <div class="progress">
                <div class="progress-bar"></div>
              </div>
            `
            : ""
        );

    }


    function clearStatus() {

      statusBox.className = "status";
      statusBox.innerHTML = "";

    }


    /* =========================================================
       HTML ESCAPE
    ========================================================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       TEXT NORMALIZATION
    ========================================================= */

    function normalizeText(value) {

      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/ß/g, "ss")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();

    }


    /* =========================================================
       CACHE
    ========================================================= */

    function cacheGet(key) {

      try {

        const raw =
          localStorage.getItem(key);

        if (!raw) return null;

        const item =
          JSON.parse(raw);

        if (
          Date.now() - item.time >
          CONFIG.cacheDays * 86400000
        ) {

          localStorage.removeItem(key);

          return null;
        }

        return item.data;

      } catch {

        return null;

      }

    }


    function cacheSet(key, data) {

      try {

        localStorage.setItem(
          key,
          JSON.stringify({
            time: Date.now(),
            data
          })
        );

      } catch {}

    }


    /* =========================================================
       FETCH MIT TIMEOUT
    ========================================================= */

    async function fetchWithTimeout(
      url,
      options = {},
      timeout = 10000,
      externalSignal = null
    ) {

      const controller =
        new AbortController();

      let timer = null;

      const abortExternal = () => {
        controller.abort();
      };

      if (externalSignal) {

        if (externalSignal.aborted) {
          controller.abort();
        } else {
          externalSignal.addEventListener(
            "abort",
            abortExternal,
            { once: true }
          );
        }

      }

      timer = setTimeout(() => {
        controller.abort();
      }, timeout);

      try {

        return await fetch(
          url,
          {
            ...options,
            signal: controller.signal
          }
        );

      } finally {

        clearTimeout(timer);

        if (externalSignal) {

          externalSignal.removeEventListener(
            "abort",
            abortExternal
          );

        }

      }

    }


    /* =========================================================
       GEOCODING
       Nominatim + Photon
    ========================================================= */

    let lastNominatimRequest = 0;

    async function geocode(query, signal) {

      const clean =
        String(query || "").trim();

      if (!clean) {
        throw new Error(
          "Bitte einen Ort eingeben."
        );
      }


      const cacheKey =
        "moi-cy-geocode-" +
        normalizeText(clean);


      const cached =
        cacheGet(cacheKey);

      if (cached) {
        return cached;
      }


      /* Nominatim etwas ausbremsen */
      const wait =
        CONFIG.geocodeDelayMs -
        (Date.now() - lastNominatimRequest);

      if (wait > 0) {
        await sleep(wait);
      }

      lastNominatimRequest =
        Date.now();


      try {

        const url =
          CONFIG.nominatim +
          "?format=jsonv2" +
          "&limit=1" +
          "&accept-language=de" +
          "&q=" +
          encodeURIComponent(clean);


        const response =
          await fetchWithTimeout(
            url,
            {
              headers: {
                "Accept": "application/json"
              }
            },
            8000,
            signal
          );


        if (!response.ok) {
          throw new Error(
            "Nominatim HTTP " +
            response.status
          );
        }


        const data =
          await response.json();


        if (
          Array.isArray(data) &&
          data.length
        ) {

          const result = {
            lat: Number(data[0].lat),
            lng: Number(data[0].lon),
            name:
              data[0].display_name ||
              clean
          };

          cacheSet(cacheKey, result);

          return result;

        }

      } catch (error) {

        if (
          error.name === "AbortError"
        ) {
          throw error;
        }

      }


      /* Photon Fallback */

      const photonUrl =
        CONFIG.photon +
        "?q=" +
        encodeURIComponent(clean) +
        "&limit=1" +
        "&lang=de";


      const response =
        await fetchWithTimeout(
          photonUrl,
          {
            headers: {
              "Accept": "application/json"
            }
          },
          8000,
          signal
        );


      if (!response.ok) {
        throw new Error(
          "Ort konnte nicht gefunden werden."
        );
      }


      const data =
        await response.json();


      if (
        !data.features ||
        !data.features.length
      ) {

        throw new Error(
          "Ort konnte nicht gefunden werden."
        );

      }


      const feature =
        data.features[0];

      const coords =
        feature.geometry.coordinates;

      const props =
        feature.properties || {};


      const result = {

        lat: Number(coords[1]),
        lng: Number(coords[0]),

        name:
          [
            props.name,
            props.city,
            props.state,
            props.country
          ]
          .filter(Boolean)
          .join(", ") ||
          clean

      };


      cacheSet(cacheKey, result);

      return result;

    }


    /* =========================================================
       OVERPASS QUERY
    ========================================================= */

    function buildOverpassQuery(
      lat,
      lng,
      radiusMeters
    ) {

      return `
[out:json][timeout:10];
(
  nwr(
    around:${Math.round(radiusMeters)},
    ${lat},
    ${lng}
  )["leisure"="skatepark"];

  nwr(
    around:${Math.round(radiusMeters)},
    ${lat},
    ${lng}
  )["sport"~"(^|;)skateboard(;|$)",i];

  nwr(
    around:${Math.round(radiusMeters)},
    ${lat},
    ${lng}
  )["skateboard"~"^(yes|designated|permissive)$",i];
);
out center tags qt;
`;

    }


    async function overpassRequest(
      query,
      signal,
      preferredIndex = 0
    ) {

      const servers = [
        ...CONFIG.overpass
      ];


      /* Serverreihenfolge leicht rotieren */
      const rotated =
        servers
          .slice(preferredIndex)
          .concat(
            servers.slice(0, preferredIndex)
          );


      let lastError = null;


      for (
        const endpoint of rotated
      ) {

        try {

          const response =
            await fetchWithTimeout(
              endpoint,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/x-www-form-urlencoded;charset=UTF-8"
                },

                body:
                  "data=" +
                  encodeURIComponent(query)
              },
              CONFIG.overpassTimeoutMs,
              signal
            );


          if (!response.ok) {

            throw new Error(
              "Overpass HTTP " +
              response.status
            );

          }


          const data =
            await response.json();


          if (
            !data ||
            !Array.isArray(data.elements)
          ) {

            throw new Error(
              "Ungültige Overpass-Antwort."
            );

          }


          return data.elements;

        } catch (error) {

          lastError = error;

          if (
            error.name === "AbortError"
          ) {
            throw error;
          }

        }

      }


      throw lastError ||
        new Error(
          "Overpass nicht erreichbar."
        );

    }


    /* =========================================================
       OSM ELEMENT → PARK
    ========================================================= */

    function elementToPark(element) {

      const tags =
        element.tags || {};


      let lat =
        Number(element.lat);

      let lng =
        Number(element.lon);


      if (
        (!Number.isFinite(lat) ||
         !Number.isFinite(lng)) &&
        element.center
      ) {

        lat =
          Number(element.center.lat);

        lng =
          Number(element.center.lon);

      }


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        return null;

      }


      const name =
        tags.name ||
        tags["name:de"] ||
        tags["alt_name"] ||
        "Skatepark";


      const official =
        tags.leisure === "skatepark";


      const searchText =
        normalizeText(
          [
            name,
            tags.description,
            tags.sport,
            tags.leisure,
            tags["sport:type"],
            tags.skateboard
          ]
          .filter(Boolean)
          .join(" ")
        );


      const positive =
        [
          "skatepark",
          "skate park",
          "skateplatz",
          "skateplatz",
          "skateanlage",
          "skate anlage",
          "skate plaza",
          "skateplaza",
          "skatehalle",
          "skatehalle",
          "skate bowl",
          "skatebowl",
          "skatepool",
          "skate pool",
          "skate",
          "skateboard"
        ]
        .some(word =>
          searchText.includes(word)
        );


      const negative =
        [
          "spielplatz",
          "playground",
          "kinderspielplatz",
          "basketball",
          "soccer",
          "fussball",
          "football",
          "volleyball",
          "tennis",
          "bolzplatz",
          "streetball",
          "pumptrack"
        ]
        .some(word =>
          searchText.includes(word)
        );


      /*
       * Ein offiziell als Skatepark getaggtes Objekt
       * wird grundsätzlich behalten.
       *
       * Bei anderen Tags muss es einen deutlichen
       * Skate-Bezug geben.
       */

      if (
        !official &&
        !positive
      ) {
        return null;
      }


      /*
       * Offensichtliche Fremdobjekte entfernen.
       * Skate-positive Namen dürfen diese Regel überstimmen.
       */

      if (
        negative &&
        !positive &&
        !official
      ) {
        return null;
      }


      const address =
        [
          tags["addr:street"],
          tags["addr:housenumber"],
          tags["addr:postcode"],
          tags["addr:city"]
        ]
        .filter(Boolean)
        .join(" ");


      let website =
        tags.website ||
        tags["contact:website"] ||
        "";


      if (
        website &&
        !/^https?:\/\//i.test(website)
      ) {

        website =
          "https://" +
          website;

      }


      /*
       * Relevanz ist kein "Qualitätsranking".
       * Sie dient nur dazu, typische Skatepark-Objekte
       * vor unklaren Skateboard-Tags zu bevorzugen.
       */

      let relevance =
        official ? 100 : 60;


      if (
        /skatepark|skateanlage|skate plaza|skateplatz/i
          .test(name)
      ) {
        relevance += 20;
      }


      if (tags.lit) {
        relevance += 3;
      }

      if (tags.surface) {
        relevance += 2;
      }

      if (tags.website) {
        relevance += 2;
      }

      if (tags.operator) {
        relevance += 1;
      }


      return {

        id:
          element.type +
          "/" +
          element.id,

        lat,
        lng,

        name,

        address,

        website,

        official,

        relevance,

        tags

      };

    }


    /* =========================================================
       DISTANZEN
    ========================================================= */

    function distanceKm(
      lat1,
      lng1,
      lat2,
      lng2
    ) {

      const R = 6371;

      const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

      const dLng =
        (lng2 - lng1) *
        Math.PI / 180;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;

      return (
        2 *
        R *
        Math.asin(
          Math.sqrt(a)
        )
      );

    }


    function distancePointToSegmentKm(
      point,
      a,
      b
    ) {

      const latScale =
        111.32;

      const lngScale =
        111.32 *
        Math.cos(
          point.lat *
          Math.PI / 180
        );


      const px = 0;
      const py = 0;

      const ax =
        (a.lng - point.lng) *
        lngScale;

      const ay =
        (a.lat - point.lat) *
        latScale;

      const bx =
        (b.lng - point.lng) *
        lngScale;

      const by =
        (b.lat - point.lat) *
        latScale;


      const dx = bx - ax;
      const dy = by - ay;

      const len2 =
        dx * dx + dy * dy;


      let t = 0;

      if (len2 > 0) {

        t =
          -(ax * dx + ay * dy) /
          len2;

        t =
          Math.max(
            0,
            Math.min(1, t)
          );

      }


      const cx =
        ax + t * dx;

      const cy =
        ay + t * dy;


      return Math.sqrt(
        (px - cx) ** 2 +
        (py - cy) ** 2
      );

    }


    function distanceToRouteKm(
      park,
      coordinates
    ) {

      let best =
        Infinity;


      /*
       * Bei sehr langen OSRM-Routen
       * nehmen wir nicht jedes einzelne Segment,
       * sondern überspringen teilweise.
       */

      const maxSegments = 2500;

      const step =
        Math.max(
          1,
          Math.ceil(
            (coordinates.length - 1) /
            maxSegments
          )
        );


      for (
        let i = 0;
        i < coordinates.length - 1;
        i += step
      ) {

        const a = {
          lat: coordinates[i][1],
          lng: coordinates[i][0]
        };

        const nextIndex =
          Math.min(
            i + step,
            coordinates.length - 1
          );

        const b = {
          lat: coordinates[nextIndex][1],
          lng: coordinates[nextIndex][0]
        };


        const d =
          distancePointToSegmentKm(
            park,
            a,
            b
          );


        if (d < best) {
          best = d;
        }

      }


      return best;

    }


    /* =========================================================
       DEDUPE
    ========================================================= */

    function dedupeParks(parks) {

      const output = [];


      for (const park of parks) {

        let duplicate = false;


        for (const existing of output) {

          const d =
            distanceKm(
              park.lat,
              park.lng,
              existing.lat,
              existing.lng
            );


          if (
            d <= 0.08 ||
            (
              normalizeText(park.name) ===
              normalizeText(existing.name) &&
              d <= 0.3
            )
          ) {

            duplicate = true;


            /*
             * Offizielles Skatepark-Objekt
             * bevorzugen, wenn zwei Datenobjekte
             * denselben Ort beschreiben.
             */

            if (
              park.relevance >
              existing.relevance
            ) {

              Object.assign(
                existing,
                park
              );

            }

            break;

          }

        }


        if (!duplicate) {
          output.push(park);
        }

      }


      return output;

    }


    /* =========================================================
       PARKS LADEN
    ========================================================= */

    async function searchParksAround(
      location,
      radiusKm,
      wantedCount,
      signal,
      options = {}
    ) {

      const radiusMeters =
        Math.min(
          CONFIG.maxRadiusKm,
          Math.max(
            1,
            Number(radiusKm)
          )
        ) * 1000;


      const query =
        buildOverpassQuery(
          location.lat,
          location.lng,
          radiusMeters
        );


      const elements =
        await overpassRequest(
          query,
          signal,
          options.serverIndex || 0
        );


      let parks =
        elements
          .map(elementToPark)
          .filter(Boolean);


      parks =
        dedupeParks(parks);


      for (const park of parks) {

        park.distance =
          distanceKm(
            location.lat,
            location.lng,
            park.lat,
            park.lng
          );

      }


      parks =
        parks.filter(
          park =>
            park.distance <=
            Number(radiusKm) + 0.1
        );


      parks.sort(
        (a, b) => {

          /*
           * Entfernung ist Hauptkriterium,
           * Relevanz löst nur annähernd gleiche
           * Entfernungen auf.
           */

          if (
            Math.abs(
              a.distance -
              b.distance
            ) < 1.5
          ) {

            return (
              b.relevance -
              a.relevance
            );

          }

          return (
            a.distance -
            b.distance
          );

        }
      );


      return parks.slice(
        0,
        wantedCount
      );

    }


    /* =========================================================
       PARK MARKER
    ========================================================= */

    function createParkMarker(park) {

      const icon =
        L.divIcon({

          className: "",

          html:
            '<div class="park-marker">S</div>',

          iconSize: [30, 30],

          iconAnchor: [15, 15],

          popupAnchor: [0, -15]

        });


      const marker =
        L.marker(
          [park.lat, park.lng],
          { icon }
        );


      let popup =
        `
          <div class="popup-title">
            ${escapeHtml(park.name)}
          </div>
        `;


      if (park.address) {

        popup +=
          `
            <div class="popup-meta">
              ${escapeHtml(park.address)}
            </div>
          `;

      }


      if (
        Number.isFinite(park.distance)
      ) {

        popup +=
          `
            <div class="popup-meta">
              ${park.distance.toFixed(1)} km entfernt
            </div>
          `;

      }


      if (park.tags?.lit) {

        popup +=
          `
            <div class="popup-meta">
              Beleuchtung: ${escapeHtml(
                park.tags.lit
              )}
            </div>
          `;

      }


      popup +=
        `
          <a
            class="popup-button"
            href="https://www.google.com/maps/dir/?api=1&destination=${park.lat},${park.lng}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Route dorthin
          </a>
        `;


      if (park.website) {

        popup +=
          `
            <br>
            <a
              class="popup-button"
              href="${escapeHtml(park.website)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Website
            </a>
          `;

      }


      marker.bindPopup(popup);

      return marker;

    }


    /* =========================================================
       ERGEBNISLISTE
    ========================================================= */

    function renderResults(
      parks
    ) {

      resultCount.textContent =
        parks.length;


      if (!parks.length) {

        resultsBox.innerHTML =
          `
            <div class="result-empty">
              Keine passenden Skateparks gefunden.
            </div>
          `;

        return;

      }


      resultsBox.innerHTML =
        parks
          .map(
            (park, index) => {

              return `
                <div
                  class="result-item"
                  data-index="${index}"
                >

                  <div class="result-name">
                    ${escapeHtml(
                      park.name
                    )}
                  </div>

                  <div class="result-meta">
                    ${
                      Number.isFinite(
                        park.distance
                      )
                        ? park.distance.toFixed(1) +
                          " km entfernt"
                        : ""
                    }
                    ${
                      park.address
                        ? " · " +
                          escapeHtml(
                            park.address
                          )
                        : ""
                    }
                  </div>

                </div>
              `;

            }
          )
          .join("");


      resultsBox
        .querySelectorAll(".result-item")
        .forEach(item => {

          item.addEventListener(
            "click",
            () => {

              const index =
                Number(
                  item.dataset.index
                );

              const park =
                currentParks[index];

              if (!park) return;


              map.setView(
                [
                  park.lat,
                  park.lng
                ],
                Math.max(
                  map.getZoom(),
                  13
                )
              );


              const markers =
                parkLayer.getLayers();


              const marker =
                markers[index];


              if (
                marker &&
                marker.openPopup
              ) {
                marker.openPopup();
              }

            }
          );

        });

    }


    /* =========================================================
       PARKS AUF KARTE
    ========================================================= */

    function displayParks(
      parks,
      fit = true
    ) {

      parkLayer.clearLayers();

      currentParks =
        parks;


      for (const park of parks) {

        parkLayer.addLayer(
          createParkMarker(park)
        );

      }


      renderResults(parks);


      if (
        fit &&
        parks.length
      ) {

        const bounds =
          L.latLngBounds(
            parks.map(
              park => [
                park.lat,
                park.lng
              ]
            )
          );


        map.fitBounds(
          bounds,
          {
            padding: [45, 45],
            maxZoom: 14
          }
        );

      }

    }


    /* =========================================================
       NORMALE ORTSSUCHE
    ========================================================= */

    placeSearchForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const query =
          placeInput.value.trim();


        if (!query) {

          setStatus(
            "Bitte einen Ort eingeben.",
            "error"
          );

          return;

        }


        placeSearchButton.disabled =
          true;


        const controller =
          new AbortController();


        setStatus(
          "Ort wird gesucht …",
          "",
          true
        );


        try {

          const location =
            await geocode(
              query,
              controller.signal
            );


          lastSearchLocation =
            location;


          map.setView(
            [
              location.lat,
              location.lng
            ],
            12
          );


          clearStatus();


          /*
           * Wichtig:
           * Die normale Ortssuche sucht NICHT automatisch
           * nach Skateparks.
           */

        } catch (error) {

          setStatus(
            "Ort konnte nicht gefunden werden. Bitte eine andere Schreibweise versuchen.",
            "error"
          );

        } finally {

          placeSearchButton.disabled =
            false;

        }

      }
    );


    /* =========================================================
       SKATEPARK-SUCHE
    ========================================================= */

    searchParksButton.addEventListener(
      "click",
      async () => {

        const radiusKm =
          Math.min(
            CONFIG.maxRadiusKm,
            Number(
              radiusSelect.value
            )
          );


        const wanted =
          Math.min(
            CONFIG.maxResults,
            Number(
              resultCountSelect.value
            )
          );


        /*
         * Letzte Suche bevorzugen.
         * Falls keine vorhanden ist:
         * Kartenmitte verwenden.
         */

        const center =
          lastSearchLocation ||
          {
            lat:
              map.getCenter().lat,

            lng:
              map.getCenter().lng,

            name:
              "Kartenzentrum"
          };


        searchParksButton.disabled =
          true;


        placeSearchButton.disabled =
          true;


        const controller =
          new AbortController();


        const deadline =
          setTimeout(
            () => controller.abort(),
            CONFIG.searchTimeoutMs
          );


        setStatus(
          `Suche nach bis zu ${wanted} Skateparks im Radius von ${radiusKm} km …`,
          "",
          true
        );


        try {

          const parks =
            await searchParksAround(
              center,
              radiusKm,
              wanted,
              controller.signal
            );


          displayParks(
            parks,
            true
          );


          if (parks.length) {

            setStatus(
              `${parks.length} Skateparks gefunden.`,
              "success"
            );

          } else {

            setStatus(
              "Keine Skateparks gefunden. Der Kartenausschnitt oder die OSM-Daten können unvollständig sein.",
              "error"
            );

          }

        } catch (error) {

          if (
            error.name === "AbortError"
          ) {

            setStatus(
              "Die Suche hat das Zeitlimit erreicht. Bitte Radius verkleinern oder erneut versuchen.",
              "error"
            );

          } else {

            setStatus(
              "Die Skatepark-Datenquelle ist gerade überlastet oder nicht erreichbar. Bitte erneut versuchen.",
              "error"
            );

          }

        } finally {

          clearTimeout(deadline);

          searchParksButton.disabled =
            false;

          placeSearchButton.disabled =
            false;

        }

      }
    );


    /* =========================================================
       ROUTE INPUTS
    ========================================================= */

    function getRouteInputs() {

      return [
        ...routeStops.querySelectorAll(
          ".route-input"
        )
      ];

    }


    function updateRemoveButtons() {

      const rows =
        [
          ...routeStops.children
        ];


      rows.forEach(
        (row, index) => {

          const button =
            row.querySelector(
              ".remove-stop"
            );


          if (!button) return;


          /*
           * Start und Ziel bleiben immer erhalten.
           */

          button.style.visibility =
            index === 0 ||
            index === rows.length - 1
              ? "hidden"
              : "visible";

        }
      );

    }


    addStopButton.addEventListener(
      "click",
      () => {

        const inputs =
          getRouteInputs();


        if (
          inputs.length >=
          CONFIG.maxRouteStops
        ) {

          setStatus(
            `Maximal ${CONFIG.maxRouteStops} Punkte erlaubt.`,
            "error"
          );

          return;

        }


        const row =
          document.createElement("div");


        row.className =
          "route-stop";


        row.innerHTML =
          `
            <input
              type="text"
              class="route-input"
              placeholder="Zwischenstopp"
              autocomplete="off"
            >

            <button
              type="button"
              class="remove-stop"
              title="Stop entfernen"
            >
              ×
            </button>
          `;


        row
          .querySelector(".remove-stop")
          .addEventListener(
            "click",
            () => {

              row.remove();

              updateRemoveButtons();

            }
          );


        /*
         * Vor dem Ziel einfügen.
         */

        const rows =
          [
            ...routeStops.children
          ];


        routeStops.insertBefore(
          row,
          rows[rows.length - 1]
        );


        updateRemoveButtons();

      }
    );


    updateRemoveButtons();


    /* =========================================================
       ROUTE GEOCODEN
    ========================================================= */

    async function geocodeRouteInputs(
      inputs,
      signal
    ) {

      const locations = [];


      for (
        let i = 0;
        i < inputs.length;
        i++
      ) {

        const value =
          inputs[i].value.trim();


        if (!value) {
          continue;
        }


        setStatus(
          `Routepunkt ${i + 1} von ${inputs.length} wird gesucht …`,
          "",
          true
        );


        const location =
          await geocode(
            value,
            signal
          );


        locations.push(location);

      }


      return locations;

    }


    /* =========================================================
       OSRM ROUTE
    ========================================================= */

    async function requestRoute(
      locations,
      signal
    ) {

      if (locations.length < 2) {

        throw new Error(
          "Bitte mindestens Start und Ziel eingeben."
        );

      }


      const coordinates =
        locations
          .map(
            location =>
              `${location.lng},${location.lat}`
          )
          .join(";");


      const url =
        CONFIG.osrm +
        "/" +
        coordinates +
        "?overview=full" +
        "&geometries=geojson" +
        "&steps=false";


      const response =
        await fetchWithTimeout(
          url,
          {},
          15000,
          signal
        );


      if (!response.ok) {

        throw new Error(
          "Routenserver nicht erreichbar."
        );

      }


      const data =
        await response.json();


      if (
        data.code !== "Ok" ||
        !data.routes ||
        !data.routes.length
      ) {

        throw new Error(
          "Keine Route gefunden."
        );

      }


      return data.routes[0];

    }


    /* =========================================================
       ROUTE ZEICHNEN
    ========================================================= */

    function drawRoute(
      route,
      locations
    ) {

      routeLayer.clearLayers();


      const latLngs =
        route.geometry.coordinates
          .map(
            coordinate => [
              coordinate[1],
              coordinate[0]
            ]
          );


      const polyline =
        L.polyline(
          latLngs,
          {
            weight: 5,
            opacity: 0.85
          }
        );


      routeLayer.addLayer(
        polyline
      );


      if (startMarker) {
        map.removeLayer(startMarker);
      }

      if (endMarker) {
        map.removeLayer(endMarker);
      }


      const markerIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="route-marker">A</div>',

          iconSize: [30, 30],

          iconAnchor: [15, 15]

        });


      const endIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="route-marker">B</div>',

          iconSize: [30, 30],

          iconAnchor: [15, 15]

        });


      startMarker =
        L.marker(
          [
            locations[0].lat,
            locations[0].lng
          ],
          {
            icon: markerIcon
          }
        )
        .bindPopup(
          escapeHtml(
            locations[0].name
          )
        )
        .addTo(routeLayer);


      endMarker =
        L.marker(
          [
            locations[
              locations.length - 1
            ].lat,
            locations[
              locations.length - 1
            ].lng
          ],
          {
            icon: endIcon
          }
        )
        .bindPopup(
          escapeHtml(
            locations[
              locations.length - 1
            ].name
          )
        )
        .addTo(routeLayer);


      /*
       * Zwischenstopps
       */

      for (
        let i = 1;
        i < locations.length - 1;
        i++
      ) {

        const stop =
          locations[i];


        const stopIcon =
          L.divIcon({

            className: "",

            html:
              `<div class="route-marker">${i + 1}</div>`,

            iconSize: [30, 30],

            iconAnchor: [15, 15]

          });


        L.marker(
          [stop.lat, stop.lng],
          {
            icon: stopIcon
          }
        )
        .bindPopup(
          escapeHtml(
            stop.name
          )
        )
        .addTo(routeLayer);

      }


      map.fitBounds(
        polyline.getBounds(),
        {
          padding: [50, 50]
        }
      );

    }


    /* =========================================================
       ROUTE PLANEN
    ========================================================= */

    routeButton.addEventListener(
      "click",
      async () => {

        const inputs =
          getRouteInputs();


        const values =
          inputs.map(
            input =>
              input.value.trim()
          );


        if (
          !values[0] ||
          !values[
            values.length - 1
          ]
        ) {

          setStatus(
            "Bitte Start und Ziel eingeben.",
            "error"
          );

          return;

        }


        /*
         * Leere Zwischenstopps entfernen.
         */

        const activeInputs =
          inputs.filter(
            input =>
              input.value.trim()
          );


        const controller =
          new AbortController();


        const deadline =
          setTimeout(
            () => controller.abort(),
            CONFIG.searchTimeoutMs
          );


        routeButton.disabled =
          true;

        parksAlongRouteButton.disabled =
          true;


        setStatus(
          "Route wird berechnet …",
          "",
          true
        );


        try {

          const locations =
            await geocodeRouteInputs(
              activeInputs,
              controller.signal
            );


          const route =
            await requestRoute(
              locations,
              controller.signal
            );


          currentRoute =
            {
              locations,
              route
            };


          drawRoute(
            route,
            locations
          );


          const km =
            Number(route.distance) /
            1000;


          const minutes =
            Math.round(
              Number(route.duration) /
              60
            );


          setStatus(
            `Route: ${km.toFixed(0)} km · ca. ${minutes} Minuten`,
            "success"
          );


        } catch (error) {

          if (
            error.name === "AbortError"
          ) {

            setStatus(
              "Die Routenberechnung hat das Zeitlimit erreicht.",
              "error"
            );

          } else {

            setStatus(
              error.message ||
              "Route konnte nicht berechnet werden.",
              "error"
            );

          }

        } finally {

          clearTimeout(deadline);

          routeButton.disabled =
            false;

          parksAlongRouteButton.disabled =
            false;

        }

      }
    );


    /* =========================================================
       ROUTE IN BBOX-ABSCHNITTE AUFTEILEN
    ========================================================= */

    function buildRouteChunks(
      coordinates,
      radiusKm
    ) {

      /*
       * Die alte Version hat an wenigen Punkten
       * einzelne Kreissuchen gemacht.
       *
       * Dadurch konnten Skateparks entlang langer
       * Routen übersehen werden.
       *
       * Jetzt wird die Route in Abschnitte geteilt
       * und jeder Abschnitt als BBOX abgefragt.
       */

      if (
        !coordinates ||
        coordinates.length < 2
      ) {
        return [];
      }


      const points =
        coordinates.map(
          c => ({
            lat: c[1],
            lng: c[0]
          })
        );


      let chunks = [];

      let start = 0;

      const targetChunkKm = 120;

      let accumulated = 0;


      for (
        let i = 1;
        i < points.length;
        i++
      ) {

        accumulated +=
          distanceKm(
            points[i - 1].lat,
            points[i - 1].lng,
            points[i].lat,
            points[i].lng
          );


        if (
          accumulated >=
          targetChunkKm
        ) {

          chunks.push(
            points.slice(
              start,
              i + 1
            )
          );

          start = i;

          accumulated = 0;

        }

      }


      if (
        start <
        points.length - 1
      ) {

        chunks.push(
          points.slice(
            start
          )
        );

      }


      /*
       * Sehr kurze Route → ein Chunk.
       */

      if (!chunks.length) {

        chunks = [
          points
        ];

      }


      /*
       * Sicherheitslimit.
       * Bei extrem langen Routen nicht hunderte
       * Anfragen senden.
       */

      if (chunks.length > 16) {

        const factor =
          Math.ceil(
            chunks.length / 16
          );


        const merged = [];


        for (
          let i = 0;
          i < chunks.length;
          i += factor
        ) {

          const group =
            chunks.slice(
              i,
              i + factor
            );


          const combined =
            group.flat();


          merged.push(
            combined
          );

        }


        chunks = merged;

      }


      return chunks.map(
        chunk => {

          const lats =
            chunk.map(
              p => p.lat
            );

          const lngs =
            chunk.map(
              p => p.lng
            );


          /*
           * Radius in Grad ungefähr erweitern.
           */

          const latDelta =
            radiusKm / 111;


          const averageLat =
            lats.reduce(
              (a, b) => a + b,
              0
            ) /
            lats.length;


          const lngDelta =
            radiusKm /
            (
              111 *
              Math.max(
                0.15,
                Math.cos(
                  averageLat *
                  Math.PI / 180
                )
              )
            );


          return {

            south:
              Math.max(
                -85,
                Math.min(
                  85,
                  Math.min(...lats) -
                  latDelta
                )
              ),

            north:
              Math.max(
                -85,
                Math.min(
                  85,
                  Math.max(...lats) +
                  latDelta
                )
              ),

            west:
              Math.max(
                -180,
                Math.min(
                  180,
                  Math.min(...lngs) -
                  lngDelta
                )
              ),

            east:
              Math.max(
                -180,
                Math.min(
                  180,
                  Math.max(...lngs) +
                  lngDelta
                )
              ),

            points: chunk

          };

        }
      );

    }


    /* =========================================================
       OVERPASS BBOX
    ========================================================= */

    function buildBBoxQuery(
      bbox
    ) {

      return `
[out:json][timeout:10];
(
  nwr(
    ${bbox.south},
    ${bbox.west},
    ${bbox.north},
    ${bbox.east}
  )["leisure"="skatepark"];

  nwr(
    ${bbox.south},
    ${bbox.west},
    ${bbox.north},
    ${bbox.east}
  )["sport"~"(^|;)skateboard(;|$)",i];

  nwr(
    ${bbox.south},
    ${bbox.west},
    ${bbox.north},
    ${bbox.east}
  )["skateboard"~"^(yes|designated|permissive)$",i];
);
out center tags qt;
`;

    }


    /* =========================================================
       CONCURRENCY HELPER
    ========================================================= */

    async function runLimited(
      items,
      concurrency,
      worker,
      signal
    ) {

      const results =
        [];

      let index = 0;


      async function runner() {

        while (true) {

          if (signal.aborted) {
            return;
          }


          const current =
            index++;


          if (
            current >=
            items.length
          ) {
            return;
          }


          try {

            const result =
              await worker(
                items[current],
                current
              );


            if (result) {
              results.push(result);
            }

          } catch {

            /*
             * Einzelner Abschnitt darf scheitern.
             * Die anderen Abschnitte laufen weiter.
             */

          }

        }

      }


      const workers =
        Array.from(
          {
            length:
              Math.min(
                concurrency,
                items.length
              )
          },
          () => runner()
        );


      await Promise.all(
        workers
      );


      return results;

    }


    /* =========================================================
       SKATEPARKS AN ROUTE
    ========================================================= */

    parksAlongRouteButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoute ||
          !currentRoute.route
        ) {

          setStatus(
            "Bitte zuerst eine Route planen.",
            "error"
          );

          return;

        }


        const radiusKm =
          Math.min(
            CONFIG.maxRadiusKm,
            Number(
              radiusSelect.value
            )
          );


        const wanted =
          Math.min(
            CONFIG.maxResults,
            Number(
              resultCountSelect.value
            )
          );


        const coordinates =
          currentRoute.route.geometry
            .coordinates;


        const chunks =
          buildRouteChunks(
            coordinates,
            radiusKm
          );


        if (!chunks.length) {

          setStatus(
            "Die Route enthält keine verwertbaren Daten.",
            "error"
          );

          return;

        }


        const controller =
          new AbortController();


        const deadline =
          setTimeout(
            () => controller.abort(),
            CONFIG.searchTimeoutMs
          );


        parksAlongRouteButton.disabled =
          true;

        searchParksButton.disabled =
          true;


        setStatus(
          `Suche Skateparks entlang der gesamten Route (${chunks.length} Abschnitte) …`,
          "",
          true
        );


        try {

          const chunkResults =
            await runLimited(
              chunks,
              CONFIG.overpassConcurrency,

              async (
                chunk,
                index
              ) => {

                if (
                  controller.signal.aborted
                ) {
                  return [];
                }


                const query =
                  buildBBoxQuery(
                    chunk
                  );


                const elements =
                  await overpassRequest(
                    query,
                    controller.signal,
                    index %
                    CONFIG.overpass.length
                  );


                return elements
                  .map(
                    elementToPark
                  )
                  .filter(Boolean);

              },

              controller.signal
            );


          let parks =
            chunkResults.flat();


          parks =
            dedupeParks(
              parks
            );


          /*
           * Jetzt erst gegen die tatsächliche Route
           * filtern.
           */

          parks =
            parks
              .map(
                park => {

                  const distance =
                    distanceToRouteKm(
                      park,
                      coordinates
                    );


                  return {
                    ...park,
                    routeDistance:
                      distance
                  };

                }
              )
              .filter(
                park =>
                  park.routeDistance <=
                  radiusKm + 0.2
              );


          /*
           * Zusätzlich Entfernung zum
           * nächstgelegenen Routenabschnitt
           * als primäres Kriterium.
           */

          parks.sort(
            (a, b) => {

              if (
                Math.abs(
                  a.routeDistance -
                  b.routeDistance
                ) < 0.5
              ) {

                return (
                  b.relevance -
                  a.relevance
                );

              }

              return (
                a.routeDistance -
                b.routeDistance
              );

            }
          );


          parks =
            parks.slice(
              0,
              wanted
            );


          /*
           * Für die Ergebnisanzeige zusätzlich
           * Entfernung zum Routenanfang.
           */

          for (const park of parks) {

            park.distance =
              distanceKm(
                currentRoute.locations[0].lat,
                currentRoute.locations[0].lng,
                park.lat,
                park.lng
              );

          }


          displayParks(
            parks,
            false
          );


          if (parks.length) {

            setStatus(
              `${parks.length} Skateparks entlang der Route gefunden.`,
              "success"
            );

          } else {

            setStatus(
              "Keine Skateparks innerhalb des gewählten Routenradius gefunden.",
              "error"
            );

          }

        } catch (error) {

          if (
            error.name === "AbortError"
          ) {

            setStatus(
              "Die Routensuche hat das 45-Sekunden-Limit erreicht. Bereits geladene Teilbereiche wurden berücksichtigt.",
              "error"
            );

          } else {

            setStatus(
              "Die Datenserver sind momentan überlastet. Bitte erneut versuchen.",
              "error"
            );

          }

        } finally {

          clearTimeout(deadline);

          parksAlongRouteButton.disabled =
            false;

          searchParksButton.disabled =
            false;

        }

      }
    );


    /* =========================================================
       RESET
    ========================================================= */

    clearButton.addEventListener(
      "click",
      () => {

        placeInput.value = "";

        lastSearchLocation = null;

        currentParks = [];

        currentRoute = null;

        parkLayer.clearLayers();

        routeLayer.clearLayers();


        if (startMarker) {
          startMarker = null;
        }

        if (endMarker) {
          endMarker = null;
        }


        resultCount.textContent =
          "0";


        resultsBox.innerHTML =
          `
            <div class="result-empty">
              Noch keine Skateparks gesucht.
            </div>
          `;


        const inputs =
          getRouteInputs();


        inputs.forEach(
          input => {
            input.value = "";
          }
        );


        /*
         * Zwischenstopps entfernen.
         */

        const rows =
          [
            ...routeStops.children
          ];


        while (
          routeStops.children.length > 2
        ) {

          routeStops.removeChild(
            routeStops.children[
              routeStops.children.length - 2
            ]
          );

        }


        updateRemoveButtons();


        map.setView(
          [51.1657, 10.4515],
          6
        );


        clearStatus();

      }
    );


    /* =========================================================
       ENTER AUF ROUTENFELDERN
    ========================================================= */

    routeStops.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          routeButton.click();

        }

      }
    );


    /* =========================================================
       UTILITY
    ========================================================= */

    function sleep(ms) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );

    }


    /* =========================================================
       MAP INVALIDATE
    ========================================================= */

    window.addEventListener(
      "resize",
      () => {

        map.invalidateSize();

      }
    );


    setTimeout(
      () => {
        map.invalidateSize();
      },
      300
    );

  </script>
