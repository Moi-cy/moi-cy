<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MOI-CY – Karte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    :root {
      --bg: #111;
      --panel: rgba(15, 15, 15, 0.96);
      --panel-soft: #1c1c1c;
      --line: #333;
      --text: #fff;
      --muted: #aaa;
      --accent: #fff;
      --danger: #ff5c5c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #ddd;
    }

    #globe {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: none;
      background: #05070a;
    }

    #globe canvas {
      display: block;
    }

    /* -----------------------------------------
       SEARCH PANEL
    ----------------------------------------- */

    #controlPanel {
      position: fixed;
      z-index: 1000;
      top: 18px;
      left: 18px;
      width: min(390px, calc(100vw - 36px));
      max-height: calc(100vh - 36px);
      overflow-y: auto;

      padding: 16px;
      border-radius: 16px;

      background: var(--panel);
      color: var(--text);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    #controlPanel.hidden {
      transform: translateX(calc(-100% - 30px));
      opacity: 0;
      pointer-events: none;
    }

    .panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panelTitle {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .closePanel {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 9px;
      background: #292929;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .closePanel:hover {
      background: #3a3a3a;
    }

    .section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .sectionTitle {
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #ddd;
      text-transform: uppercase;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      background: #202020;
      color: #fff;
      outline: none;
      padding: 0 12px;
    }

    input:focus,
    select:focus {
      border-color: #777;
    }

    button {
      border: 0;
      border-radius: 10px;
      min-height: 42px;
      padding: 0 13px;
      cursor: pointer;
      font-weight: 800;
    }

    .primaryButton {
      width: 100%;
      margin-top: 8px;
      background: #fff;
      color: #111;
    }

    .secondaryButton {
      width: 100%;
      margin-top: 8px;
      background: #2b2b2b;
      color: #fff;
    }

    .secondaryButton:hover {
      background: #3a3a3a;
    }

    .dangerButton {
      background: #342020;
      color: #ffb0b0;
    }

    .searchRow {
      display: flex;
      gap: 7px;
    }

    .searchRow input {
      flex: 1;
      min-width: 0;
    }

    .searchRow button {
      flex: 0 0 auto;
      width: 48px;
      background: #fff;
      color: #111;
      font-size: 18px;
    }

    /* -----------------------------------------
       ROUTE
    ----------------------------------------- */

    #routeStops {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .routeStop {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .routeStop input {
      flex: 1;
      min-width: 0;
    }

    .removeStop {
      width: 38px;
      min-height: 42px;
      padding: 0;
      background: #292929;
      color: #aaa;
    }

    .removeStop:hover {
      background: #3a3a3a;
      color: #fff;
    }

    #addStopButton {
      width: 100%;
      margin-top: 8px;
      background: #242424;
      color: #fff;
      border: 1px dashed #555;
    }

    #addStopButton:hover {
      background: #303030;
    }

    .routeButtons {
      display: flex;
      gap: 7px;
      margin-top: 8px;
    }

    .routeButtons button {
      flex: 1;
    }

    /* -----------------------------------------
       SKATEPARKS
    ----------------------------------------- */

    .radiusRow {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .radiusRow select {
      flex: 1;
    }

    .parkSearchButton {
      flex: 1;
      background: #fff;
      color: #111;
    }

    #status {
      margin-top: 12px;
      padding: 10px 11px;
      border-radius: 10px;
      background: #1b1b1b;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    #status.error {
      color: #ffadad;
      background: #2c1717;
    }

    #status.success {
      color: #c9ffc9;
      background: #172817;
    }

    #results {
      margin-top: 10px;
    }

    .resultsHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      font-size: 12px;
      color: #aaa;
    }

    .parkResult {
      padding: 11px;
      margin-bottom: 7px;
      border: 1px solid #303030;
      border-radius: 10px;
      background: #1b1b1b;
      cursor: pointer;
    }

    .parkResult:hover {
      background: #252525;
    }

    .parkName {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .parkMeta {
      color: #aaa;
      font-size: 12px;
      line-height: 1.5;
    }

    .emptyResults {
      color: #888;
      font-size: 13px;
      padding: 8px 2px;
    }

    /* -----------------------------------------
       PANEL OPEN BUTTON
    ----------------------------------------- */

    #openPanelButton {
      position: fixed;
      z-index: 1100;
      top: 18px;
      left: 18px;

      width: 44px;
      height: 44px;

      border-radius: 12px;
      background: rgba(15, 15, 15, 0.95);
      color: #fff;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);

      display: none;
      align-items: center;
      justify-content: center;

      font-size: 20px;
    }

    #openPanelButton.visible {
      display: flex;
    }

    /* -----------------------------------------
       MAP VIEW SWITCH
    ----------------------------------------- */

    #mapModeControl {
      position: fixed;
      z-index: 1000;
      right: 18px;
      top: 18px;

      display: flex;
      gap: 5px;

      padding: 5px;
      border-radius: 12px;
      background: rgba(15, 15, 15, 0.94);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    #mapModeControl button {
      min-height: 36px;
      padding: 0 11px;
      border-radius: 8px;
      background: transparent;
      color: #aaa;
      font-size: 11px;
    }

    #mapModeControl button.active {
      background: #fff;
      color: #111;
    }

    /* -----------------------------------------
       LEAFLET ZOOM
       Traditional: bottom right
    ----------------------------------------- */

    .leaflet-top.leaflet-left {
      display: none;
    }

    .leaflet-bottom.leaflet-right {
      z-index: 1000;
    }

    .leaflet-control-zoom {
      margin-right: 18px !important;
      margin-bottom: 18px !important;
      border: 0 !important;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3) !important;
    }

    .leaflet-control-zoom a {
      width: 42px !important;
      height: 42px !important;
      line-height: 42px !important;
      background: rgba(15, 15, 15, 0.95) !important;
      color: #fff !important;
      border: 0 !important;
    }

    .leaflet-control-zoom a:first-child {
      border-radius: 10px 10px 0 0 !important;
      border-bottom: 1px solid #333 !important;
    }

    .leaflet-control-zoom a:last-child {
      border-radius: 0 0 10px 10px !important;
    }

    /* -----------------------------------------
       LEAFLET POPUPS
    ----------------------------------------- */

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #171717;
      color: #fff;
    }

    .leaflet-popup-content {
      margin: 12px 14px;
      line-height: 1.45;
    }

    .popupTitle {
      font-weight: 800;
      margin-bottom: 6px;
    }

    .popupMeta {
      font-size: 12px;
      color: #bbb;
    }

    /* -----------------------------------------
       RESPONSIVE
    ----------------------------------------- */

    @media (max-width: 600px) {
      #controlPanel {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        max-height: calc(100vh - 20px);
      }

      #mapModeControl {
        top: 10px;
        right: 10px;
      }

      #openPanelButton {
        top: 10px;
        left: 10px;
      }

      .leaflet-control-zoom {
        margin-right: 10px !important;
        margin-bottom: 10px !important;
      }
    }
  </style>
</head>

<body>

  <!-- 2D MAP -->
  <div id="map"></div>

  <!-- 3D GLOBE -->
  <div id="globe"></div>

  <!-- MAP TYPE / GLOBE -->
  <div id="mapModeControl">
    <button id="mapModeButton" class="active" type="button">KARTE</button>
    <button id="satelliteModeButton" type="button">SATELLIT</button>
    <button id="globeModeButton" type="button">GLOBUS</button>
  </div>

  <!-- OPEN PANEL -->
  <button
    id="openPanelButton"
    type="button"
    title="Suchfeld öffnen"
    aria-label="Suchfeld öffnen"
  >
    ☰
  </button>

  <!-- CONTROL PANEL -->
  <aside id="controlPanel">

    <div class="panelHeader">
      <div class="panelTitle">MOI-CY MAP</div>

      <button
        id="closePanelButton"
        class="closePanel"
        type="button"
        title="Suchfeld einklappen"
        aria-label="Suchfeld einklappen"
      >
        ×
      </button>
    </div>

    <!-- SEARCH -->
    <section>
      <div class="sectionTitle">Ort oder Route</div>

      <div class="searchRow">
        <input
          id="mainSearch"
          type="text"
          autocomplete="off"
          placeholder="Ort oder z. B. Karlsruhe → Stuttgart"
        >

        <button
          id="mainSearchButton"
          type="button"
          title="Suchen"
        >
          →
        </button>
      </div>
    </section>

    <!-- ROUTE -->
    <section class="section">

      <div class="sectionTitle">Route</div>

      <div id="routeStops"></div>

      <button
        id="addStopButton"
        type="button"
      >
        + Zwischenstopp hinzufügen
      </button>

      <div class="routeButtons">
        <button
          id="calculateRouteButton"
          class="primaryButton"
          type="button"
        >
          ROUTE BERECHNEN
        </button>
      </div>

      <button
        id="routeParksButton"
        class="secondaryButton"
        type="button"
        disabled
      >
        SKATEPARKS ENTLANG DER ROUTE
      </button>

    </section>

    <!-- SKATEPARKS -->
    <section class="section">

      <div class="sectionTitle">Skateparks</div>

      <div class="radiusRow">

        <select id="parkRadius">
          <option value="5000">5 km</option>
          <option value="10000" selected>10 km</option>
          <option value="25000">25 km</option>
          <option value="50000">50 km</option>
        </select>

        <button
          id="searchParksButton"
          class="parkSearchButton"
          type="button"
        >
          HIER SUCHEN
        </button>

      </div>

    </section>

    <!-- STATUS -->
    <div id="status">
      Bereit.
    </div>

    <!-- RESULTS -->
    <div id="results"></div>

  </aside>


  <!-- LEAFLET -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>


  <script>
    (() => {
      "use strict";

      /* =========================================================
         CONFIG
      ========================================================= */

      const DEFAULT_CENTER = [49.1, 8.4];
      const DEFAULT_ZOOM = 6;

      const MAP_BOUNDS = L.latLngBounds(
        [-85.05112878, -180],
        [85.05112878, 180]
      );

      const NOMINATIM_URL =
        "https://nominatim.openstreetmap.org/search";

      const PHOTON_URL =
        "https://photon.komoot.io/api/";

      const OSRM_URL =
        "https://router.project-osrm.org/route/v1/driving/";

      const OVERPASS_SERVERS = [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.kumi.systems/api/interpreter"
      ];

      const SEARCH_TIMEOUT = 8000;
      const ROUTE_TIMEOUT = 10000;

      /*
       * WICHTIG:
       * Der komplette Skatepark-Vorgang darf niemals länger
       * als diese Zeit laufen.
       */
      const PARK_TOTAL_TIMEOUT = 10000;

      /* =========================================================
         DOM
      ========================================================= */

      const mapElement =
        document.getElementById("map");

      const globeElement =
        document.getElementById("globe");

      const controlPanel =
        document.getElementById("controlPanel");

      const openPanelButton =
        document.getElementById("openPanelButton");

      const closePanelButton =
        document.getElementById("closePanelButton");

      const mainSearch =
        document.getElementById("mainSearch");

      const mainSearchButton =
        document.getElementById("mainSearchButton");

      const routeStopsElement =
        document.getElementById("routeStops");

      const addStopButton =
        document.getElementById("addStopButton");

      const calculateRouteButton =
        document.getElementById("calculateRouteButton");

      const routeParksButton =
        document.getElementById("routeParksButton");

      const parkRadius =
        document.getElementById("parkRadius");

      const searchParksButton =
        document.getElementById("searchParksButton");

      const statusElement =
        document.getElementById("status");

      const resultsElement =
        document.getElementById("results");

      const mapModeButton =
        document.getElementById("mapModeButton");

      const satelliteModeButton =
        document.getElementById("satelliteModeButton");

      const globeModeButton =
        document.getElementById("globeModeButton");


      /* =========================================================
         MAP
      ========================================================= */

      const map = L.map("map", {
        center: DEFAULT_CENTER,
        zoom: DEFAULT_ZOOM,

        minZoom: 2,
        maxZoom: 18,

        maxBounds: MAP_BOUNDS,
        maxBoundsViscosity: 1.0,

        worldCopyJump: false,
        zoomControl: true,
        preferCanvas: true
      });

      /*
       * Zoom traditionell unten rechts.
       */
      L.control.zoom({
        position: "bottomright"
      }).addTo(map);


      const streetLayer = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution: "© OpenStreetMap contributors"
        }
      );

      const satelliteLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 19,
          attribution: "Tiles © Esri"
        }
      );

      streetLayer.addTo(map);


      /* =========================================================
         STATE
      ========================================================= */

      let currentMapLayer = streetLayer;

      let viewMode = "map";

      let globeInstance = null;
      let globeLoadPromise = null;

      let routeLayer = null;
      let routeMarkers = [];

      let routeLatLngs = [];
      let routeStopsData = [];

      let parkMarkers = [];
      let currentParks = [];

      const geocodeCache = new Map();
      const parkCache = new Map();


      /* =========================================================
         HELPERS
      ========================================================= */

      function setStatus(message, type = "") {
        statusElement.textContent = message;

        statusElement.classList.remove(
          "error",
          "success"
        );

        if (type) {
          statusElement.classList.add(type);
        }
      }


      function clearResults() {
        resultsElement.innerHTML = "";
      }


      function clearParkMarkers() {
        for (const marker of parkMarkers) {
          map.removeLayer(marker);
        }

        parkMarkers = [];
      }


      function clearRoute() {
        if (routeLayer) {
          map.removeLayer(routeLayer);
          routeLayer = null;
        }

        for (const marker of routeMarkers) {
          map.removeLayer(marker);
        }

        routeMarkers = [];

        routeLatLngs = [];
        routeStopsData = [];

        routeParksButton.disabled = true;

        updateGlobeData();
      }


      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }


      function normalizeText(value) {
        return String(value ?? "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/ß/g, "ss")
          .replace(/ä/g, "ae")
          .replace(/ö/g, "oe")
          .replace(/ü/g, "ue")
          .replace(/[^a-z0-9\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }


      function transliterationVariants(value) {
        const original = String(value ?? "").trim();

        const variants = new Set([
          original,
          original.replace(/ä/g, "ae")
            .replace(/ö/g, "oe")
            .replace(/ü/g, "ue")
            .replace(/Ä/g, "Ae")
            .replace(/Ö/g, "Oe")
            .replace(/Ü/g, "Ue")
            .replace(/ß/g, "ss")
        ]);

        return [...variants].filter(Boolean);
      }


      function levenshtein(a, b) {
        a = normalizeText(a);
        b = normalizeText(b);

        if (!a) return b.length;
        if (!b) return a.length;

        const previous = new Array(b.length + 1);

        for (let j = 0; j <= b.length; j++) {
          previous[j] = j;
        }

        for (let i = 1; i <= a.length; i++) {
          let current = [i];

          for (let j = 1; j <= b.length; j++) {
            const cost = a[i - 1] === b[j - 1]
              ? 0
              : 1;

            current[j] = Math.min(
              current[j - 1] + 1,
              previous[j] + 1,
              previous[j - 1] + cost
            );
          }

          for (let j = 0; j <= b.length; j++) {
            previous[j] = current[j];
          }
        }

        return previous[b.length];
      }


      function similarity(a, b) {
        const aa = normalizeText(a);
        const bb = normalizeText(b);

        if (!aa || !bb) return 0;

        const distance = levenshtein(aa, bb);

        return Math.max(
          0,
          1 - distance / Math.max(aa.length, bb.length)
        );
      }


      function formatDistance(km) {
        if (!Number.isFinite(km)) return "–";

        if (km < 1) {
          return Math.round(km * 1000) + " m";
        }

        return km.toFixed(1) + " km";
      }


      function formatArea(areaM2) {
        if (!Number.isFinite(areaM2) || areaM2 <= 0) {
          return "nicht erfasst";
        }

        if (areaM2 < 1000) {
          return "ca. " + Math.round(areaM2) + " m²";
        }

        return "ca. " + (areaM2 / 10000).toFixed(2) + " ha";
      }


      function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371;

        const dLat =
          (lat2 - lat1) * Math.PI / 180;

        const dLon =
          (lon2 - lon1) * Math.PI / 180;

        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1 * Math.PI / 180) *
          Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon / 2) ** 2;

        return 2 * R * Math.asin(
          Math.sqrt(a)
        );
      }


      /* =========================================================
         TIMEOUT FETCH
      ========================================================= */

      async function fetchWithTimeout(
        url,
        options = {},
        timeoutMs = 8000
      ) {
        const controller =
          new AbortController();

        const timer =
          setTimeout(
            () => controller.abort(),
            timeoutMs
          );

        try {
          const response =
            await fetch(url, {
              ...options,
              signal: controller.signal
            });

          if (!response.ok) {
            throw new Error(
              "HTTP " + response.status
            );
          }

          return response;
        } finally {
          clearTimeout(timer);
        }
      }


      /* =========================================================
         PANEL
      ========================================================= */

      closePanelButton.addEventListener(
        "click",
        () => {
          controlPanel.classList.add("hidden");
          openPanelButton.classList.add("visible");

          setTimeout(() => {
            map.invalidateSize();
          }, 300);
        }
      );


      openPanelButton.addEventListener(
        "click",
        () => {
          controlPanel.classList.remove("hidden");
          openPanelButton.classList.remove("visible");

          setTimeout(() => {
            map.invalidateSize();
          }, 300);
        }
      );


      /* =========================================================
         ROUTE INPUTS
      ========================================================= */

      function addRouteStop(
        value = "",
        removable = true
      ) {
        const wrapper =
          document.createElement("div");

        wrapper.className = "routeStop";

        const input =
          document.createElement("input");

        input.type = "text";
        input.placeholder =
          routeStopsElement.children.length === 0
            ? "Start"
            : "Ziel / Zwischenstopp";

        input.value = value;
        input.className = "routeInput";

        wrapper.appendChild(input);

        if (removable) {
          const remove =
            document.createElement("button");

          remove.type = "button";
          remove.className = "removeStop";
          remove.textContent = "×";
          remove.title = "Stopp entfernen";

          remove.addEventListener(
            "click",
            () => {
              wrapper.remove();

              if (
                routeStopsElement.children.length < 2
              ) {
                addRouteStop("");
              }
            }
          );

          wrapper.appendChild(remove);
        }

        routeStopsElement.appendChild(wrapper);
      }


      function getRouteInputValues() {
        return [
          ...routeStopsElement
            .querySelectorAll(".routeInput")
        ]
          .map(input => input.value.trim())
          .filter(Boolean);
      }


      function setRouteStops(values) {
        routeStopsElement.innerHTML = "";

        values.forEach(
          (value, index) => {
            addRouteStop(
              value,
              index > 0
            );
          }
        );

        if (values.length < 2) {
          addRouteStop("");
        }
      }


      addRouteStop("");
      addRouteStop("");


      addStopButton.addEventListener(
        "click",
        () => {
          addRouteStop("");
        }
      );


      /* =========================================================
         ROUTE PARSER
      ========================================================= */

      function parseRouteString(value) {
        const text =
          String(value ?? "").trim();

        if (!text) return [];

        const parts =
          text
            .split(
              /\s*(?:→|->|=>)\s*|\s+(?:nach|bis|to)\s+/i
            )
            .map(x => x.trim())
            .filter(Boolean);

        return parts;
      }


      /* =========================================================
         GEOCODING
      ========================================================= */

      async function geocodePlace(query) {
        const cleanQuery =
          String(query ?? "").trim();

        if (!cleanQuery) {
          throw new Error(
            "Bitte einen Ort eingeben."
          );
        }

        const cacheKey =
          normalizeText(cleanQuery);

        if (geocodeCache.has(cacheKey)) {
          return geocodeCache.get(cacheKey);
        }

        let bestResult = null;

        /*
         * Nominatim zuerst.
         */
        for (
          const variant of transliterationVariants(cleanQuery)
        ) {
          try {
            const params =
              new URLSearchParams({
                q: variant,
                format: "jsonv2",
                addressdetails: "1",
                limit: "5",
                dedupe: "1",
                "accept-language": "de"
              });

            const response =
              await fetchWithTimeout(
                NOMINATIM_URL +
                "?" +
                params.toString(),
                {
                  headers: {
                    "Accept": "application/json"
                  }
                },
                SEARCH_TIMEOUT
              );

            const data =
              await response.json();

            if (
              Array.isArray(data) &&
              data.length
            ) {
              bestResult =
                data
                  .map(item => ({
                    lat: Number(item.lat),
                    lon: Number(item.lon),
                    display_name:
                      item.display_name || variant,
                    address:
                      item.address || {},
                    score:
                      similarity(
                        cleanQuery,
                        item.display_name
                      )
                  }))
                  .sort(
                    (a, b) => b.score - a.score
                  )[0];

              if (bestResult) {
                break;
              }
            }
          } catch (error) {
            /* Nominatim kann ausfallen → Photon */
          }
        }


        /*
         * Photon als Fallback.
         */
        if (!bestResult) {
          for (
            const variant of transliterationVariants(cleanQuery)
          ) {
            try {
              const params =
                new URLSearchParams({
                  q: variant,
                  limit: "5",
                  lang: "de"
                });

              const response =
                await fetchWithTimeout(
                  PHOTON_URL +
                  "?" +
                  params.toString(),
                  {},
                  SEARCH_TIMEOUT
                );

              const data =
                await response.json();

              const features =
                Array.isArray(data.features)
                  ? data.features
                  : [];

              if (!features.length) {
                continue;
              }

              const candidates =
                features.map(feature => {
                  const coords =
                    feature.geometry?.coordinates || [];

                  const props =
                    feature.properties || {};

                  const label =
                    [
                      props.name,
                      props.city,
                      props.country
                    ]
                      .filter(Boolean)
                      .join(", ");

                  return {
                    lat: Number(coords[1]),
                    lon: Number(coords[0]),
                    display_name:
                      label || variant,
                    address: props,
                    score:
                      similarity(
                        cleanQuery,
                        label
                      )
                  };
                });

              bestResult =
                candidates.sort(
                  (a, b) => b.score - a.score
                )[0];

              if (bestResult) break;

            } catch (error) {
              /* nächster Fallback */
            }
          }
        }


        if (
          !bestResult ||
          !Number.isFinite(bestResult.lat) ||
          !Number.isFinite(bestResult.lon)
        ) {
          throw new Error(
            "Ort konnte nicht gefunden werden."
          );
        }

        geocodeCache.set(
          cacheKey,
          bestResult
        );

        return bestResult;
      }

      /* =========================================================
         ROUTE CALCULATION
      ========================================================= */

      async function calculateRoute() {
        const names =
          getRouteInputValues();

        if (names.length < 2) {
          setStatus(
            "Bitte mindestens Start und Ziel eingeben.",
            "error"
          );

          return;
        }

        clearRoute();
        clearParkMarkers();
        clearResults();

        calculateRouteButton.disabled = true;

        setStatus(
          "Route wird berechnet …"
        );

        try {
          const locations = [];

          /*
           * Alle Orte nacheinander geocoden.
           * Der OSRM-Request kommt erst danach.
           */
          for (let i = 0; i < names.length; i++) {
            setStatus(
              `Ort ${i + 1} von ${names.length} wird gesucht …`
            );

            const result =
              await geocodePlace(names[i]);

            locations.push(result);
          }


          const coordinates =
            locations
              .map(
                loc =>
                  `${loc.lon},${loc.lat}`
              )
              .join(";");


          setStatus(
            "Straßenroute wird berechnet …"
          );


          const url =
            OSRM_URL +
            coordinates +
            "?overview=full&geometries=geojson&steps=false";


          const response =
            await fetchWithTimeout(
              url,
              {},
              ROUTE_TIMEOUT
            );

          const data =
            await response.json();


          if (
            data.code !== "Ok" ||
            !data.routes ||
            !data.routes.length
          ) {
            throw new Error(
              "Keine Route gefunden."
            );
          }


          const route =
            data.routes[0];

          routeStopsData =
            locations.map(
              (location, index) => ({
                ...location,
                name: names[index]
              })
            );


          routeLatLngs =
            route.geometry.coordinates.map(
              coord => [
                coord[1],
                coord[0]
              ]
            );


          routeLayer =
            L.geoJSON(
              route.geometry,
              {
                style: {
                  weight: 5
                }
              }
            ).addTo(map);


          /*
           * Stop-Marker
           */
          routeStopsData.forEach(
            (stop, index) => {
              const marker =
                L.marker([
                  stop.lat,
                  stop.lon
                ]).addTo(map);

              const googleUrl =
                "https://www.google.com/maps/dir/?api=1&destination=" +
                encodeURIComponent(
                  stop.lat + "," + stop.lon
                );

              marker.bindPopup(`
                <div class="popupTitle">
                  ${escapeHtml(
                    stop.name
                  )}
                </div>

                <div class="popupMeta">
                  Stopp ${index + 1}
                </div>

                <div style="margin-top:8px;">
                  <a
                    href="${googleUrl}"
                    target="_blank"
                    rel="noopener"
                  >
                    Route in Google Maps
                  </a>
                </div>
              `);

              routeMarkers.push(marker);
            }
          );


          const bounds =
            routeLayer.getBounds();

          if (bounds.isValid()) {
            map.fitBounds(
              bounds,
              {
                padding: [40, 40]
              }
            );
          }


          const distanceKm =
            Number(route.distance) / 1000;

          const durationMin =
            Number(route.duration) / 60;

          setStatus(
            `Route gefunden · ${distanceKm.toFixed(1)} km · ca. ${Math.round(durationMin)} min`,
            "success"
          );


          routeParksButton.disabled = false;

          updateGlobeData();

          switchToMap();

        } catch (error) {

          setStatus(
            error.name === "AbortError"
              ? "Die Routenberechnung hat zu lange gedauert."
              : (
                  error.message ||
                  "Routenberechnung fehlgeschlagen."
                ),
            "error"
          );

        } finally {
          calculateRouteButton.disabled = false;
        }
      }


      calculateRouteButton.addEventListener(
        "click",
        calculateRoute
      );


      /* =========================================================
         SKATEPARK FILTER
      ========================================================= */

      const EXCLUDED_TERMS = [
        "spielplatz",
        "playground",
        "kinderspielplatz",
        "pumptrack",
        "bmx",
        "minigolf",
        "bolzplatz",
        "fussball",
        "fußball",
        "soccer",
        "basketball",
        "volleyball",
        "fitness",
        "parcours"
      ];


      function isValidSkatepark(element) {
        const tags =
          element.tags || {};

        const name =
          normalizeText(
            tags.name ||
            tags["name:de"] ||
            ""
          );

        const description =
          normalizeText(
            tags.description || ""
          );

        const combined =
          `${name} ${description}`;


        /*
         * Harte Ausschlüsse.
         */
        if (
          EXCLUDED_TERMS.some(
            term =>
              combined.includes(
                normalizeText(term)
              )
          )
        ) {
          return false;
        }


        /*
         * leisure=skatepark ist der primäre
         * und zuverlässigste Filter.
         */
        if (
          tags.leisure === "skatepark"
        ) {
          return true;
        }


        /*
         * sport=skateboard alleine reicht NICHT.
         */
        if (
          tags.sport === "skateboard" &&
          (
            combined.includes("skate") ||
            combined.includes("skatepark")
          )
        ) {
          return true;
        }

        return false;
      }


      /* =========================================================
         AREA CALCULATION
      ========================================================= */

      function calculatePolygonAreaM2(
        geometry
      ) {
        if (
          !Array.isArray(geometry) ||
          geometry.length < 3
        ) {
          return null;
        }

        const first =
          geometry[0];

        const last =
          geometry[geometry.length - 1];

        if (
          !first ||
          !last ||
          first.lat !== last.lat ||
          first.lon !== last.lon
        ) {
          return null;
        }

        const lat0 =
          first.lat *
          Math.PI /
          180;

        const R = 6371000;

        const points =
          geometry.map(point => {
            const x =
              R *
              point.lon *
              Math.PI /
              180 *
              Math.cos(lat0);

            const y =
              R *
              point.lat *
              Math.PI /
              180;

            return [x, y];
          });


        let area = 0;

        for (
          let i = 0;
          i < points.length;
          i++
        ) {
          const j =
            (i + 1) %
            points.length;

          area +=
            points[i][0] *
              points[j][1] -
            points[j][0] *
              points[i][1];
        }

        return Math.abs(area) / 2;
      }


      /* =========================================================
         OVERPASS
      ========================================================= */

      function buildOverpassQuery(
        lat,
        lon,
        radius
      ) {
        return `
[out:json][timeout:8];
(
  nwr["leisure"="skatepark"](around:${radius},${lat},${lon});
);
out geom tags;
        `.trim();
      }


      function buildRouteOverpassQuery(
        points,
        radius
      ) {
        const queries =
          points.map(
            point =>
              `nwr["leisure"="skatepark"](around:${radius},${point.lat},${point.lon});`
          );

        return `
[out:json][timeout:8];
(
  ${queries.join("\n  ")}
);
out geom tags;
        `.trim();
      }


      /*
       * Das ist der zentrale Sicherheitsmechanismus:
       *
       * Der gesamte Overpass-Vorgang bekommt EIN gemeinsames
       * Zeitlimit. Serverwechsel starten KEIN neues 10-Sekunden-
       * Zeitfenster.
       */
      async function queryOverpass(
        query,
        deadline
      ) {
        let lastError = null;

        for (
          const server of OVERPASS_SERVERS
        ) {
          const remaining =
            deadline -
            Date.now();

          if (remaining <= 0) {
            throw new Error(
              "Zeitlimit erreicht."
            );
          }

          try {
            const response =
              await fetchWithTimeout(
                server +
                "?data=" +
                encodeURIComponent(query),
                {
                  headers: {
                    "Accept":
                      "application/json"
                  }
                },
                Math.min(
                  remaining,
                  7500
                )
              );

            const data =
              await response.json();

            if (
              data &&
              Array.isArray(data.elements)
            ) {
              return data.elements;
            }

            throw new Error(
              "Ungültige Overpass-Antwort."
            );

          } catch (error) {
            lastError = error;
          }
        }

        throw lastError ||
          new Error(
            "Overpass nicht erreichbar."
          );
      }


      /* =========================================================
         PARK NORMALIZATION
      ========================================================= */

      function normalizePark(
        element,
        center = null,
        routePoints = null
      ) {
        const tags =
          element.tags || {};

        let lat = null;
        let lon = null;


        if (
          Number.isFinite(element.lat) &&
          Number.isFinite(element.lon)
        ) {
          lat = Number(element.lat);
          lon = Number(element.lon);
        }


        if (
          (!Number.isFinite(lat) ||
           !Number.isFinite(lon)) &&
          Array.isArray(element.geometry) &&
          element.geometry.length
        ) {
          const middle =
            element.geometry[
              Math.floor(
                element.geometry.length / 2
              )
            ];

          lat = Number(middle.lat);
          lon = Number(middle.lon);
        }


        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lon)
        ) {
          return null;
        }


        const areaM2 =
          calculatePolygonAreaM2(
            element.geometry
          );


        let distanceKm = null;

        if (center) {
          distanceKm =
            haversineKm(
              center.lat,
              center.lon,
              lat,
              lon
            );
        }


        let routeDistanceKm = null;

        if (
          Array.isArray(routePoints) &&
          routePoints.length
        ) {
          routeDistanceKm =
            Math.min(
              ...routePoints.map(
                point =>
                  haversineKm(
                    point.lat,
                    point.lon,
                    lat,
                    lon
                  )
              )
            );
        }


        const name =
          tags.name ||
          tags["name:de"] ||
          "Skatepark";


        return {
          id:
            element.type +
            "/" +
            element.id,

          osmType: element.type,
          osmId: element.id,

          name,

          lat,
          lon,

          areaM2,

          distanceKm,

          routeDistanceKm,

          lit:
            tags.lit === "yes"
              ? "Ja"
              : tags.lit === "no"
                ? "Nein"
                : "unbekannt",

          surface:
            tags.surface ||
            tags["surface:material"] ||
            "unbekannt",

          tags
        };
      }


      /* =========================================================
         PARK SEARCH CORE
      ========================================================= */

      async function performParkSearch({
        center = null,
        routePoints = null,
        radius
      }) {
        const deadline =
          Date.now() +
          PARK_TOTAL_TIMEOUT;


        /*
         * Cache-Key.
         */
        let cacheKey;

        if (center) {
          cacheKey =
            [
              "center",
              center.lat.toFixed(4),
              center.lon.toFixed(4),
              radius
            ].join(":");
        } else {
          cacheKey =
            [
              "route",
              radius,
              routePoints
                .map(
                  p =>
                    `${p.lat.toFixed(3)},${p.lon.toFixed(3)}`
                )
                .join("|")
            ].join(":");
        }


        if (parkCache.has(cacheKey)) {
          return parkCache.get(cacheKey);
        }


        const query =
          center
            ? buildOverpassQuery(
                center.lat,
                center.lon,
                radius
              )
            : buildRouteOverpassQuery(
                routePoints,
                radius
              );


        const elements =
          await queryOverpass(
            query,
            deadline
          );


        /*
         * Deduplizieren.
         */
        const unique =
          new Map();

        for (const element of elements) {
          const key =
            `${element.type}/${element.id}`;

          if (!unique.has(key)) {
            unique.set(
              key,
              element
            );
          }
        }


        const parks =
          [...unique.values()]
            .filter(isValidSkatepark)
            .map(
              element =>
                normalizePark(
                  element,
                  center,
                  routePoints
                )
            )
            .filter(Boolean);


        /*
         * Große Parks zuerst.
         *
         * Bekannte Flächen werden vor unbekannten
         * Flächen sortiert; innerhalb derselben
         * Gruppe ist die Fläche ausschlaggebend.
         */
        parks.sort(
          (a, b) => {

            const aHasArea =
              Number.isFinite(a.areaM2);

            const bHasArea =
              Number.isFinite(b.areaM2);

            if (
              aHasArea !== bHasArea
            ) {
              return bHasArea - aHasArea;
            }

            if (
              aHasArea &&
              bHasArea &&
              a.areaM2 !== b.areaM2
            ) {
              return b.areaM2 - a.areaM2;
            }

            if (
              center &&
              Number.isFinite(a.distanceKm) &&
              Number.isFinite(b.distanceKm)
            ) {
              return (
                a.distanceKm -
                b.distanceKm
              );
            }

            if (
              Number.isFinite(a.routeDistanceKm) &&
              Number.isFinite(b.routeDistanceKm)
            ) {
              return (
                a.routeDistanceKm -
                b.routeDistanceKm
              );
            }

            return a.name.localeCompare(
              b.name,
              "de"
            );
          }
        );


        const result =
          parks.slice(0, 15);

        parkCache.set(
          cacheKey,
          result
        );

        return result;
      }

      /* =========================================================
         ROUTE PARK SEARCH
      ========================================================= */

      function sampleRoutePoints(
        points,
        maxPoints = 6
      ) {
        if (
          !Array.isArray(points) ||
          !points.length
        ) {
          return [];
        }

        if (
          points.length <= maxPoints
        ) {
          return points.map(
            p => ({
              lat: p[0],
              lon: p[1]
            })
          );
        }


        /*
         * Gleichmäßig über die Route verteilt.
         */
        const sampled = [];

        for (
          let i = 0;
          i < maxPoints;
          i++
        ) {
          const ratio =
            i /
            (maxPoints - 1);

          const index =
            Math.round(
              ratio *
              (points.length - 1)
            );

          const point =
            points[index];

          sampled.push({
            lat: point[0],
            lon: point[1]
          });
        }

        return sampled;
      }


      async function searchParksAlongRoute() {
        if (
          !routeLatLngs.length
        ) {
          setStatus(
            "Bitte zuerst eine Route berechnen.",
            "error"
          );

          return;
        }


        const radius =
          Number(
            parkRadius.value
          );


        routeParksButton.disabled =
          true;

        clearResults();

        setStatus(
          "Skateparks entlang der Route werden gesucht …"
        );


        try {

          /*
           * Je größer der Radius, desto weniger
           * Abfragepunkte werden benötigt.
           */
          let count = 6;

          if (radius >= 10000) {
            count = 5;
          }

          if (radius >= 25000) {
            count = 4;
          }

          if (radius >= 50000) {
            count = 3;
          }


          const points =
            sampleRoutePoints(
              routeLatLngs,
              count
            );


          const parks =
            await performParkSearch({
              routePoints: points,
              radius
            });


          displayParks(
            parks,
            "entlang der Route"
          );


          if (parks.length) {
            setStatus(
              `${parks.length >= 15 ? "15+" : parks.length} Skateparks entlang der Route gefunden.`,
              "success"
            );
          }

        } catch (error) {

          console.error(
            "Route-Skatepark-Suche:",
            error
          );


          setStatus(
            "Die Skatepark-Suche wurde nach 10 Sekunden beendet. Bitte erneut versuchen.",
            "error"
          );


          resultsElement.innerHTML = `
            <button
              id="retryRouteParksButton"
              class="secondaryButton"
              type="button"
            >
              ↻ ERNEUT VERSUCHEN
            </button>
          `;


          document
            .getElementById(
              "retryRouteParksButton"
            )
            .addEventListener(
              "click",
              searchParksAlongRoute
            );

        } finally {
          routeParksButton.disabled =
            false;
        }
      }


      routeParksButton.addEventListener(
        "click",
        searchParksAlongRoute
      );


      /* =========================================================
         GLOBE LAZY LOAD
      ========================================================= */

      function loadGlobeLibrary() {
        if (
          window.Globe
        ) {
          return Promise.resolve();
        }

        if (
          globeLoadPromise
        ) {
          return globeLoadPromise;
        }


        globeLoadPromise =
          new Promise(
            (resolve, reject) => {

              const script =
                document.createElement(
                  "script"
                );

              script.src =
                "https://unpkg.com/globe.gl/dist/globe.gl.min.js";

              script.async = true;

              script.onload =
                () => resolve();

              script.onerror =
                () => reject(
                  new Error(
                    "3D-Globus konnte nicht geladen werden."
                  )
                );

              document.head.appendChild(
                script
              );
            }
          );


        return globeLoadPromise;
      }


      /* =========================================================
         GLOBE INIT
      ========================================================= */

      async function initGlobe() {
        if (globeInstance) {
          return;
        }


        await loadGlobeLibrary();


        if (
          typeof window.Globe !==
          "function"
        ) {
          throw new Error(
            "Globus-Bibliothek nicht verfügbar."
          );
        }


        globeInstance =
          window.Globe()(
            globeElement
          );


        globeInstance
          .globeImageUrl(
            "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
          )
          .bumpImageUrl(
            "https://unpkg.com/three-globe/example/img/earth-topology.png"
          )
          .backgroundColor(
            "#05070a"
          )
          .showAtmosphere(true)
          .atmosphereAltitude(
            0.15
          );


        const controls =
          globeInstance.controls();

        controls.autoRotate =
          false;

        controls.enableZoom =
          true;


        globeInstance
          .pointLabel(
            point => point.name || "Skatepark"
          )
          .pointLat(
            point => point.lat
          )
          .pointLng(
            point => point.lon
          )
          .pointAltitude(
            0.01
          )
          .pointRadius(
            0.35
          );


        updateGlobeData();
      }


      function updateGlobeData() {
        if (!globeInstance) {
          return;
        }


        globeInstance
          .pointsData(
            currentParks
          );


        if (
          routeLatLngs.length
        ) {
          globeInstance.pathsData([
            {
              coords:
                routeLatLngs
                  .map(
                    p => [
                      p[0],
                      p[1]
                    ]
                  )
            }
          ]);
        } else {
          globeInstance.pathsData([]);
        }
      }


      /* =========================================================
         VIEW SWITCH
      ========================================================= */

      function updateModeButtons() {
        mapModeButton.classList.toggle(
          "active",
          viewMode === "map"
        );

        satelliteModeButton.classList.toggle(
          "active",
          viewMode === "satellite"
        );

        globeModeButton.classList.toggle(
          "active",
          viewMode === "globe"
        );
      }


      async function switchToGlobe() {
        try {

          setStatus(
            "3D-Globus wird geladen …"
          );

          await initGlobe();

          viewMode = "globe";

          mapElement.style.display =
            "none";

          globeElement.style.display =
            "block";

          updateModeButtons();

          setTimeout(
            () => {
              if (globeInstance) {
                globeInstance
                  .width(
                    globeElement.clientWidth
                  )
                  .height(
                    globeElement.clientHeight
                  );
              }
            },
            50
          );


          setStatus(
            "3D-Globus aktiv.",
            "success"
          );

        } catch (error) {

          console.error(
            "Globus:",
            error
          );

          setStatus(
            "Der 3D-Globus konnte nicht geladen werden.",
            "error"
          );

          switchToMap();
        }
      }


      function switchToMap() {
        viewMode = "map";

        globeElement.style.display =
          "none";

        mapElement.style.display =
          "block";

        updateModeButtons();

        setTimeout(
          () => map.invalidateSize(),
          50
        );
      }


      function switchToSatellite() {
        viewMode = "satellite";

        if (
          currentMapLayer !==
          satelliteLayer
        ) {
          map.removeLayer(
            currentMapLayer
          );

          satelliteLayer.addTo(map);

          currentMapLayer =
            satelliteLayer;
        }

        globeElement.style.display =
          "none";

        mapElement.style.display =
          "block";

        updateModeButtons();

        setTimeout(
          () => map.invalidateSize(),
          50
        );
      }


      function switchToStreetMap() {
        viewMode = "map";

        if (
          currentMapLayer !==
          streetLayer
        ) {
          map.removeLayer(
            currentMapLayer
          );

          streetLayer.addTo(map);

          currentMapLayer =
            streetLayer;
        }

        globeElement.style.display =
          "none";

        mapElement.style.display =
          "block";

        updateModeButtons();

        setTimeout(
          () => map.invalidateSize(),
          50
        );
      }


      mapModeButton.addEventListener(
        "click",
        switchToStreetMap
      );


      satelliteModeButton.addEventListener(
        "click",
        switchToSatellite
      );


      globeModeButton.addEventListener(
        "click",
        switchToGlobe
      );


      /* =========================================================
         AUTOMATIC GLOBE WHEN ZOOMING OUT
      ========================================================= */

      let globeSwitchLock = false;


      map.on(
        "zoomend",
        () => {

          if (
            globeSwitchLock ||
            viewMode === "globe"
          ) {
            return;
          }


          /*
           * Bei Zoom 2 oder kleiner:
           * runde Erde zeigen.
           */
          if (
            map.getZoom() <= 2
          ) {

            globeSwitchLock = true;

            switchToGlobe()
              .finally(
                () => {
                  setTimeout(
                    () => {
                      globeSwitchLock =
                        false;
                    },
                    300
                  );
                }
              );
          }
        }
      );


      /*
       * Wenn der Nutzer aus dem Globus zurück
       * auf die Karte möchte, nicht bei Zoom 2
       * hängen bleiben.
       */
      mapModeButton.addEventListener(
        "click",
        () => {
          if (
            map.getZoom() <= 2
          ) {
            map.setZoom(3);
          }
        }
      );


      satelliteModeButton.addEventListener(
        "click",
        () => {
          if (
            map.getZoom() <= 2
          ) {
            map.setZoom(3);
          }
        }
      );


      /* =========================================================
         GLOBE RESIZE
      ========================================================= */

      window.addEventListener(
        "resize",
        () => {
          if (
            globeInstance &&
            viewMode === "globe"
          ) {
            globeInstance
              .width(
                globeElement.clientWidth
              )
              .height(
                globeElement.clientHeight
              );
          }
        }
      );


      /* =========================================================
         MAIN SEARCH BUTTON
      ========================================================= */

      /*
       * Auch Enter im ersten Routenfeld kann Route starten.
       */
      routeStopsElement.addEventListener(
        "keydown",
        event => {
          if (
            event.key === "Enter"
          ) {
            event.preventDefault();

            calculateRoute();
          }
        }
      );


      /* =========================================================
         INITIAL STATE
      ========================================================= */

      setStatus(
        "Bereit. Karte und Suche sind geladen."
      );

      /*
       * WICHTIG:
       * Hier findet KEINE Netzwerk-Suche statt.
       *
       * Die Karte wird sofort angezeigt.
       */
      updateModeButtons();

    })();
  </script>
