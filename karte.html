<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MOI-CY – Karte</title>

    <link rel="stylesheet" href="style.css">

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: #050505;
        }

        main.map-page {
            position: relative;
            width: 100%;
            height: 100dvh;
            padding: 0 !important;
            margin: 0;
        }

        .map-wrapper {
            position: fixed;
            top: var(--header-height);
            right: 0;
            bottom: 0;
            left: 0;

            overflow: hidden;
            background: #101010;
        }

        #map {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: #101010;
        }

        /* =========================================
           LEAFLET
        ========================================= */

        .leaflet-container {
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #101010;
        }

        .leaflet-control-attribution {
            background: rgba(5, 5, 5, 0.85) !important;
            color: #777 !important;
            font-size: 10px;
            padding: 3px 6px !important;
        }

        .leaflet-control-attribution a {
            color: #999 !important;
        }

        .leaflet-control-zoom {
            border: 1px solid rgba(255,255,255,0.15) !important;
            box-shadow: none !important;
        }

        .leaflet-control-zoom a {
            width: 32px !important;
            height: 32px !important;
            line-height: 32px !important;

            background: rgba(8,8,8,0.94) !important;
            color: #fff !important;

            border-bottom-color: rgba(255,255,255,0.1) !important;
        }

        .leaflet-control-zoom a:hover {
            background: #168cff !important;
            color: #fff !important;
        }

        /* =========================================
           PANEL
        ========================================= */

        .map-panel {
            position: absolute;
            z-index: 1000;

            top: 22px;
            left: 22px;

            width: 410px;
            max-width: calc(100vw - 44px);
            max-height: calc(100% - 44px);

            box-sizing: border-box;

            padding: 20px;

            overflow-y: auto;

            background: rgba(8,8,8,0.95);
            border: 1px solid rgba(255,255,255,0.13);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .map-panel::-webkit-scrollbar {
            width: 5px;
        }

        .map-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .map-panel::-webkit-scrollbar-thumb {
            background: #333;
        }

        .map-kicker {
            margin: 0 0 6px;

            color: #168cff;

            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .map-title {
            margin: 0;

            color: #fff;

            font-size: 38px;
            line-height: 0.95;
            font-weight: 900;
            letter-spacing: -0.04em;
            text-transform: uppercase;
        }

        .map-intro {
            margin: 12px 0 18px;

            color: #929292;

            font-size: 12px;
            line-height: 1.55;
        }

        /* =========================================
           SEARCH
        ========================================= */

        .map-search {
            margin-bottom: 9px;
        }

        .map-search label,
        .route-label {
            display: block;

            margin-bottom: 7px;

            color: #999;

            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .map-search-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 7px;
        }

        .map-input,
        .route-input {
            display: block;

            width: 100%;
            min-width: 0;

            box-sizing: border-box;

            padding: 12px 13px;

            background: #111;
            border: 1px solid rgba(255,255,255,0.13);

            color: #fff;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;

            outline: none;

            border-radius: 0;

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .map-input:focus,
        .route-input:focus {
            background: #151515;
            border-color: #168cff;
        }

        .map-input::placeholder,
        .route-input::placeholder {
            color: #555;
        }

        /* =========================================
           BUTTONS
        ========================================= */

        .map-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 40px;

            box-sizing: border-box;

            padding: 10px 13px;

            border: 0;
            border-radius: 0;

            background: #168cff;
            color: #fff;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .map-button:hover {
            background: #2d9aff;
            transform: translateY(-1px);
        }

        .map-button.secondary {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.13);
        }

        .map-button.secondary:hover {
            background: #252525;
        }

        .map-button.full {
            width: 100%;
            margin-top: 7px;
        }

        /* =========================================
           ROUTE
        ========================================= */

        .route-box {
            margin-top: 17px;
            padding-top: 17px;

            border-top: 1px solid rgba(255,255,255,0.09);
        }

        .route-fields {
            display: grid;
            gap: 7px;
        }

        .route-actions {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 7px;

            margin-top: 7px;
        }

        /* =========================================
           STATUS
        ========================================= */

        .map-status {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-top: 14px;
            padding: 10px 12px;

            box-sizing: border-box;

            background: #0d0d0d;
            border-left: 2px solid #333;

            color: #707070;

            font-size: 10px;
            line-height: 1.45;
        }

        .map-status.active {
            border-left-color: #168cff;
            color: #aaa;
        }

        .map-status.error {
            border-left-color: #ff4d4d;
            color: #ff8585;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            min-width: 6px;

            border-radius: 50%;

            background: #555;
        }

        .map-status.active .status-dot {
            background: #168cff;
            box-shadow: 0 0 10px rgba(22,140,255,0.8);
        }

        .map-status.error .status-dot {
            background: #ff4d4d;
        }

        /* =========================================
           RESULTS
        ========================================= */

        .results {
            margin-top: 16px;
        }

        .results-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 6px;

            color: #777;

            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .results-count {
            color: #168cff;
        }

        .park-result {
            display: block;

            width: 100%;

            padding: 11px 0;

            background: transparent;
            border: 0;
            border-top: 1px solid rgba(255,255,255,0.08);

            color: #fff;

            text-align: left;

            cursor: pointer;
        }

        .park-result:hover .park-result-name {
            color: #168cff;
        }

        .park-result-name {
            display: block;

            margin-bottom: 3px;

            color: #eee;

            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;

            transition: color 0.15s ease;
        }

        .park-result-meta {
            display: block;

            color: #666;

            font-size: 10px;
            line-height: 1.45;
        }

        .park-distance {
            color: #168cff;
        }

        .empty-results {
            padding: 13px 0;

            color: #666;

            font-size: 11px;
            line-height: 1.5;
        }

        /* =========================================
           SKATEPARK MARKER
        ========================================= */

        .moi-marker {
            width: 18px;
            height: 18px;

            box-sizing: border-box;

            background: #168cff;
            border: 3px solid #fff;

            border-radius: 50%;

            box-shadow:
                0 0 0 5px rgba(22,140,255,0.16),
                0 4px 14px rgba(0,0,0,0.55);
        }

        .moi-route-marker {
            width: 12px;
            height: 12px;

            box-sizing: border-box;

            background: #fff;
            border: 3px solid #168cff;

            border-radius: 50%;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.5);
        }

        /* =========================================
           POPUP
        ========================================= */

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #101010;
            color: #fff;
        }

        .leaflet-popup-content {
            margin: 15px;
            min-width: 215px;
        }

        .popup-kicker {
            margin-bottom: 5px;

            color: #168cff;

            font-size: 8px;
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .popup-title {
            margin-bottom: 5px;

            color: #fff;

            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .popup-address {
            color: #999;

            font-size: 10px;
            line-height: 1.45;
        }

        .popup-route {
            display: inline-block;

            margin-top: 10px;
            padding: 8px 10px;

            background: #168cff;
            color: #fff;

            font-size: 8px;
            font-weight: 900;
            letter-spacing: 0.08em;

            text-decoration: none;
            text-transform: uppercase;
        }

        .popup-route:hover {
            background: #2d9aff;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 900px) {

            .map-panel {
                width: 390px;
            }

        }

        @media (max-width: 700px) {

            .map-wrapper {
                top: 68px;
            }

            .map-panel {
                top: 10px;
                left: 10px;

                width: calc(100vw - 20px);
                max-width: none;

                max-height: calc(100% - 20px);

                padding: 15px;
            }

            .map-title {
                font-size: 30px;
            }

            .map-intro {
                margin-top: 10px;
                margin-bottom: 13px;
                font-size: 11px;
            }

            .map-search-row {
                grid-template-columns: minmax(0, 1fr) auto;
            }

            .route-actions {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            }

        }

        @media (max-width: 430px) {

            .map-panel {
                padding: 13px;
            }

            .map-title {
                font-size: 27px;
            }

            .map-input,
            .route-input {
                padding: 11px;
                font-size: 11px;
            }

            .map-button {
                padding: 9px 10px;
                font-size: 8px;
            }

        }

    </style>
</head>

<body>

    <!-- Gemeinsame Moi-cy Navigation -->
    <div id="site-header"></div>

    <main class="map-page">

        <div class="map-wrapper">

            <div id="map"></div>

            <aside class="map-panel">

                <p class="map-kicker">
                    MOI-CY / MAP
                </p>

                <h1 class="map-title">
                    FIND YOUR SPOT
                </h1>

                <p class="map-intro">
                    Suche eine Stadt, plane eine Route oder zeige alle registrierten Moi-cy-Spots.
                    Die Skateparks erscheinen erst nach deiner Suche.
                </p>

                <!-- STADT / ORT -->

                <div class="map-search">

                    <label for="locationSearch">
                        Stadt oder Ort
                    </label>

                    <div class="map-search-row">

                        <input
                            id="locationSearch"
                            class="map-input"
                            type="search"
                            placeholder="z. B. Karlsruhe, Heidelberg..."
                            autocomplete="off"
                        >

                        <button
                            id="searchButton"
                            class="map-button"
                            type="button"
                        >
                            SUCHEN
                        </button>

                    </div>

                </div>

                <!-- ALLE SKATEPARKS -->

                <button
                    id="allParksButton"
                    class="map-button secondary full"
                    type="button"
                >
                    ALLE SKATEPLÄTZE
                </button>

                <!-- ROUTE -->

                <div class="route-box">

                    <label class="route-label">
                        Route planen
                    </label>

                    <div class="route-fields">

                        <input
                            id="routeStart"
                            class="route-input"
                            type="text"
                            placeholder="Start"
                            autocomplete="off"
                        >

                        <input
                            id="routeEnd"
                            class="route-input"
                            type="text"
                            placeholder="Ziel"
                            autocomplete="off"
                        >

                    </div>

                    <div class="route-actions">

                        <button
                            id="routeButton"
                            class="map-button"
                            type="button"
                        >
                            ROUTE SUCHEN
                        </button>

                        <button
                            id="clearButton"
                            class="map-button secondary"
                            type="button"
                        >
                            ZURÜCKSETZEN
                        </button>

                    </div>

                </div>

                <!-- STATUS -->

                <div
                    id="mapStatus"
                    class="map-status"
                >

                    <span class="status-dot"></span>

                    <span id="mapStatusText">
                        Suche nach einer Stadt oder starte eine Route.
                    </span>

                </div>

                <!-- ERGEBNISSE -->

                <div
                    id="results"
                    class="results"
                    hidden
                ></div>

            </aside>

        </div>

    </main>

    <!-- Gemeinsamer Footer -->
    <div id="site-footer"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">

        /* =====================================================
           MOI-CY KARTE
        ===================================================== */

        const parks = [

            {
                id: "valence",
                name: "Valence",
                city: "Valence",
                country: "FR",
                address: "53 Allée Raymond Mias, 26000 Valence, France",
                query: "53 Allée Raymond Mias, 26000 Valence, France",
                lat: null,
                lng: null
            },

            {
                id: "karlsruhe",
                name: "Karlsruhe",
                city: "Karlsruhe",
                country: "DE",
                address: "Schlachthausstraße 9A, 76131 Karlsruhe, Deutschland",
                query: "Schlachthausstraße 9A, 76131 Karlsruhe, Deutschland",
                lat: null,
                lng: null
            },

            {
                id: "heidelberg",
                name: "Heidelberg",
                city: "Heidelberg",
                country: "DE",
                address: "Uferstraße 78, 69120 Heidelberg, Deutschland",
                query: "Uferstraße 78, 69120 Heidelberg, Deutschland",
                lat: null,
                lng: null
            },

            {
                id: "heidelberg-bowl",
                name: "Heidelberg Bowl",
                city: "Heidelberg",
                country: "DE",
                address: "Elsa-Brändström-Straße, 69126 Heidelberg, Deutschland",
                query: "Elsa-Brändström-Straße, 69126 Heidelberg, Deutschland",
                lat: null,
                lng: null
            },

            {
                id: "perpignan",
                name: "Perpignan",
                city: "Perpignan",
                country: "FR",
                address: "80 Avenue Paul Alduy, 66100 Perpignan, France",
                query: "80 Avenue Paul Alduy, 66100 Perpignan, France",
                lat: null,
                lng: null
            },

            {
                id: "muenchen",
                name: "München Hirschgarten",
                city: "München",
                country: "DE",
                address: "Engasserbogen 34, 80639 München, Deutschland",
                query: "Engasserbogen 34, 80639 München, Deutschland",
                lat: null,
                lng: null
            }

        ];

        /* =====================================================
           KARTE
        ===================================================== */

        const map = L.map("map", {
            zoomControl: false,
            minZoom: 3,
            maxZoom: 19
        }).setView(
            [49.1, 8.4],
            6
        );

        L.control.zoom({
            position: "bottomright"
        }).addTo(map);

        L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
            {
                maxZoom: 20,
                attribution:
                    '&copy; OpenStreetMap-Mitwirkende &copy; CARTO'
            }
        ).addTo(map);

        /*
         * Wichtig:
         * Diese Layergruppe bleibt beim Seitenstart leer.
         */
        const parkLayer =
            L.layerGroup().addTo(map);

        let routeLayer = null;
        let routeStartMarker = null;
        let routeEndMarker = null;

        const parkMarkers =
            new Map();

        /* =====================================================
           ELEMENTE
        ===================================================== */

        const searchInput =
            document.getElementById(
                "locationSearch"
            );

        const searchButton =
            document.getElementById(
                "searchButton"
            );

        const allParksButton =
            document.getElementById(
                "allParksButton"
            );

        const routeStartInput =
            document.getElementById(
                "routeStart"
            );

        const routeEndInput =
            document.getElementById(
                "routeEnd"
            );

        const routeButton =
            document.getElementById(
                "routeButton"
            );

        const clearButton =
            document.getElementById(
                "clearButton"
            );

        const status =
            document.getElementById(
                "mapStatus"
            );

        const statusText =
            document.getElementById(
                "mapStatusText"
            );

        const results =
            document.getElementById(
                "results"
            );

        /* =====================================================
           STATUS
        ===================================================== */

        function setStatus(
            message,
            type = ""
        ) {

            status.classList.remove(
                "active",
                "error"
            );

            if (type) {
                status.classList.add(type);
            }

            statusText.textContent =
                message;

        }

        /* =====================================================
           GEOCODING CACHE
        ===================================================== */

        const cacheKey =
            "moiCyMapGeocodeCache";

        function readCache() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        cacheKey
                    ) || "{}"
                );

            } catch {

                return {};

            }

        }

        function writeCache(cache) {

            try {

                localStorage.setItem(
                    cacheKey,
                    JSON.stringify(cache)
                );

            } catch {

                // Karte funktioniert auch ohne Cache.

            }

        }

        /* =====================================================
           GEOCODING
        ===================================================== */

        async function geocode(query) {

            const cache =
                readCache();

            const key =
                query
                    .trim()
                    .toLowerCase();

            if (cache[key]) {
                return cache[key];
            }

            const url =
                "https://nominatim.openstreetmap.org/search" +
                "?format=jsonv2" +
                "&limit=1" +
                "&addressdetails=1" +
                "&q=" +
                encodeURIComponent(query);

            const response =
                await fetch(url, {
                    headers: {
                        "Accept":
                            "application/json"
                    }
                });

            if (!response.ok) {

                throw new Error(
                    `Geocoding HTTP ${response.status}`
                );

            }

            const data =
                await response.json();

            if (!data.length) {
                return null;
            }

            const result = {

                lat:
                    Number(
                        data[0].lat
                    ),

                lng:
                    Number(
                        data[0].lon
                    ),

                displayName:
                    data[0].display_name ||
                    query

            };

            cache[key] =
                result;

            writeCache(cache);

            return result;

        }

        /* =====================================================
           EXAKTE SKATEPARK-POSITIONEN
        ===================================================== */

        async function loadParkPosition(
            park
        ) {

            if (
                Number.isFinite(park.lat) &&
                Number.isFinite(park.lng)
            ) {
                return park;
            }

            const cache =
                readCache();

            const key =
                park.query
                    .trim()
                    .toLowerCase();

            if (cache[key]) {

                park.lat =
                    cache[key].lat;

                park.lng =
                    cache[key].lng;

                return park;

            }

            const result =
                await geocode(
                    park.query
                );

            if (!result) {

                throw new Error(
                    `Standort nicht gefunden: ${park.name}`
                );

            }

            park.lat =
                result.lat;

            park.lng =
                result.lng;

            /*
             * Kleine Pause zwischen
             * Nominatim-Anfragen.
             */
            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1100
                    )
            );

            return park;

        }

        async function loadAllParkPositions() {

            const loaded = [];

            for (
                const park of parks
            ) {

                try {

                    await loadParkPosition(
                        park
                    );

                    loaded.push(
                        park
                    );

                } catch (error) {

                    console.warn(
                        `Moi-cy: ${park.name} konnte nicht geocodiert werden.`,
                        error
                    );

                }

            }

            return loaded;

        }

        /* =====================================================
           MARKER
        ===================================================== */

        function createParkMarker(
            park
        ) {

            if (
                !Number.isFinite(park.lat) ||
                !Number.isFinite(park.lng)
            ) {
                return null;
            }

            const icon =
                L.divIcon({

                    className: "",

                    html:
                        '<div class="moi-marker"></div>',

                    iconSize:
                        [24, 24],

                    iconAnchor:
                        [12, 12],

                    popupAnchor:
                        [0, -14]

                });

            const marker =
                L.marker(
                    [
                        park.lat,
                        park.lng
                    ],
                    {
                        icon
                    }
                );

            const routeUrl =
                "https://www.google.com/maps/dir/?api=1" +
                `&destination=${park.lat},${park.lng}`;

            marker.bindPopup(`

                <div class="popup-kicker">
                    MOI-CY SKATEPARK
                </div>

                <div class="popup-title">
                    ${escapeHtml(
                        park.name
                    )}
                </div>

                <div class="popup-address">
                    ${escapeHtml(
                        park.address
                    )}
                </div>

                <a
                    class="popup-route"
                    href="${routeUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ROUTE ZUM SPOT →
                </a>

            `);

            parkMarkers.set(
                park.id,
                marker
            );

            return marker;

        }

        function showParks(
            list
        ) {

            parkLayer.clearLayers();

            parkMarkers.clear();

            list.forEach(
                park => {

                    const marker =
                        createParkMarker(
                            park
                        );

                    if (marker) {

                        marker.addTo(
                            parkLayer
                        );

                    }

                }
            );

        }

        function clearParks() {

            parkLayer.clearLayers();

            parkMarkers.clear();

        }

        /* =====================================================
           ENTFERNUNG
        ===================================================== */

        function haversineKm(
            lat1,
            lng1,
            lat2,
            lng2
        ) {

            const R = 6371;

            const dLat =
                (lat2 - lat1) *
                Math.PI /
                180;

            const dLng =
                (lng2 - lng1) *
                Math.PI /
                180;

            const a =
                Math.sin(
                    dLat / 2
                ) ** 2 +

                Math.cos(
                    lat1 *
                    Math.PI /
                    180
                ) *

                Math.cos(
                    lat2 *
                    Math.PI /
                    180
                ) *

                Math.sin(
                    dLng / 2
                ) ** 2;

            return (
                2 *
                R *
                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                )
            );

        }

        /* =====================================================
           ERGEBNISLISTE
        ===================================================== */

        function showResults(
            list,
            title
        ) {

            results.hidden =
                false;

            if (!list.length) {

                results.innerHTML = `

                    <div class="results-heading">

                        <span>
                            ${escapeHtml(title)}
                        </span>

                        <span class="results-count">
                            0
                        </span>

                    </div>

                    <div class="empty-results">
                        In diesem Bereich wurde kein Moi-cy-Skatepark gefunden.
                    </div>

                `;

                return;

            }

            results.innerHTML = `

                <div class="results-heading">

                    <span>
                        ${escapeHtml(title)}
                    </span>

                    <span class="results-count">
                        ${list.length}
                    </span>

                </div>

                ${list.map(
                    item => {

                        const park =
                            item.park;

                        const distance =
                            item.distance;

                        return `

                            <button
                                type="button"
                                class="park-result"
                                data-park-id="${escapeHtml(park.id)}"
                            >

                                <span class="park-result-name">
                                    ${escapeHtml(
                                        park.name
                                    )}
                                </span>

                                <span class="park-result-meta">

                                    ${escapeHtml(
                                        park.address
                                    )}

                                    ${
                                        Number.isFinite(
                                            distance
                                        )

                                        ? `<br>
                                           <span class="park-distance">
                                               ${distance.toFixed(1)} km entfernt
                                           </span>`

                                        : ""
                                    }

                                </span>

                            </button>

                        `;

                    }
                ).join("")}

            `;

            results
                .querySelectorAll(
                    ".park-result"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                const park =
                                    parks.find(
                                        item =>
                                            item.id ===
                                            button.dataset.parkId
                                    );

                                if (!park) {
                                    return;
                                }

                                map.setView(
                                    [
                                        park.lat,
                                        park.lng
                                    ],
                                    17,
                                    {
                                        animate:
                                            true
                                    }
                                );

                                const marker =
                                    parkMarkers.get(
                                        park.id
                                    );

                                if (marker) {

                                    marker.openPopup();

                                }

                            }
                        );

                    }
                );

        }

        /* =====================================================
           ALLE SKATEPARKS
        ===================================================== */

        async function showAllParks() {

            setStatus(
                "Genaue Skatepark-Standorte werden geladen …",
                "active"
            );

            results.hidden =
                true;

            const loaded =
                await loadAllParkPositions();

            if (!loaded.length) {

                setStatus(
                    "Die Skatepark-Standorte konnten nicht geladen werden.",
                    "error"
                );

                return;

            }

            showParks(
                loaded
            );

            const bounds =
                L.latLngBounds(
                    loaded.map(
                        park => [
                            park.lat,
                            park.lng
                        ]
                    )
                );

            map.fitBounds(
                bounds,
                {
                    padding:
                        [80, 80],

                    maxZoom:
                        12
                }
            );

            showResults(
                loaded.map(
                    park => ({
                        park,
                        distance: null
                    })
                ),
                "ALLE SKATEPLÄTZE"
            );

            setStatus(
                `${loaded.length} Skateplätze angezeigt.`,
                "active"
            );

        }

        /* =====================================================
           STADT / ORT SUCHEN
        ===================================================== */

        async function searchLocation() {

            const query =
                searchInput.value.trim();

            if (!query) {

                setStatus(
                    "Bitte eine Stadt oder einen Ort eingeben.",
                    "error"
                );

                return;

            }

            setStatus(
                "Standort wird gesucht …",
                "active"
            );

            results.hidden =
                true;

            try {

                const location =
                    await geocode(
                        query
                    );

                if (!location) {

                    setStatus(
                        "Der Ort wurde nicht gefunden.",
                        "error"
                    );

                    return;

                }

                map.setView(
                    [
                        location.lat,
                        location.lng
                    ],
                    12,
                    {
                        animate:
                            true
                    }
                );

                setStatus(
                    "Skateparks in der Umgebung werden gesucht …",
                    "active"
                );

                const loaded =
                    await loadAllParkPositions();

                const nearby =
                    loaded

                        .map(
                            park => ({

                                park,

                                distance:
                                    haversineKm(
                                        location.lat,
                                        location.lng,
                                        park.lat,
                                        park.lng
                                    )

                            })
                        )

                        .filter(
                            item =>
                                item.distance <=
                                35
                        )

                        .sort(
                            (a, b) =>
                                a.distance -
                                b.distance
                        );

                showParks(
                    nearby.map(
                        item =>
                            item.park
                    )
                );

                if (nearby.length) {

                    const bounds =
                        L.latLngBounds([

                            [
                                location.lat,
                                location.lng
                            ],

                            ...nearby.map(
                                item => [
                                    item.park.lat,
                                    item.park.lng
                                ]
                            )

                        ]);

                    map.fitBounds(
                        bounds,
                        {
                            padding:
                                [90, 90],

                            maxZoom:
                                14
                        }
                    );

                }

                showResults(
                    nearby,
                    `SPOTS BEI ${query.toUpperCase()}`
                );

                setStatus(
                    nearby.length

                        ? `${nearby.length} Skatepark(s) im Umkreis von 35 km.`

                        : `Keine Moi-cy-Spots im Umkreis von 35 km.`,

                    nearby.length
                        ? "active"
                        : ""
                );

            } catch (error) {

                console.error(
                    error
                );

                setStatus(
                    "Die Suche konnte nicht durchgeführt werden.",
                    "error"
                );

            }

        }

        /* =====================================================
           ROUTE – PUNKT ZU ROUTE
        ===================================================== */

        function pointToSegmentKm(
            point,
            start,
            end
        ) {

            const latRad =
                point.lat *
                Math.PI /
                180;

            const factor =
                Math.cos(
                    latRad
                );

            const px =
                point.lng *
                factor;

            const py =
                point.lat;

            const ax =
                start.lng *
                factor;

            const ay =
                start.lat;

            const bx =
                end.lng *
                factor;

            const by =
                end.lat;

            const dx =
                bx - ax;

            const dy =
                by - ay;

            if (
                dx === 0 &&
                dy === 0
            ) {

                return haversineKm(
                    point.lat,
                    point.lng,
                    start.lat,
                    start.lng
                );

            }

            const t =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (
                            (px - ax) *
                            dx +

                            (py - ay) *
                            dy
                        ) /
                        (
                            dx * dx +
                            dy * dy
                        )
                    )
                );

            const closestLat =
                ay +
                t * dy;

            const closestLng =
                (
                    ax +
                    t * dx
                ) /
                factor;

            return haversineKm(
                point.lat,
                point.lng,
                closestLat,
                closestLng
            );

        }

        function parkDistanceToRoute(
            park,
            coordinates
        ) {

            let minimum =
                Infinity;

            for (
                let i = 0;
                i <
                coordinates.length - 1;
                i++
            ) {

                const start = {

                    lat:
                        coordinates[i][1],

                    lng:
                        coordinates[i][0]

                };

                const end = {

                    lat:
                        coordinates[i + 1][1],

                    lng:
                        coordinates[i + 1][0]

                };

                const distance =
                    pointToSegmentKm(
                        {
                            lat:
                                park.lat,

                            lng:
                                park.lng
                        },
                        start,
                        end
                    );

                minimum =
                    Math.min(
                        minimum,
                        distance
                    );

            }

            return minimum;

        }

        /* =====================================================
           ROUTE SUCHEN
        ===================================================== */

        async function searchRoute() {

            const startQuery =
                routeStartInput.value.trim();

            const endQuery =
                routeEndInput.value.trim();

            if (
                !startQuery ||
                !endQuery
            ) {

                setStatus(
                    "Bitte Start und Ziel eingeben.",
                    "error"
                );

                return;

            }

            setStatus(
                "Start und Ziel werden gesucht …",
                "active"
            );

            results.hidden =
                true;

            try {

                const start =
                    await geocode(
                        startQuery
                    );

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            1100
                        )
                );

                const end =
                    await geocode(
                        endQuery
                    );

                if (
                    !start ||
                    !end
                ) {

                    setStatus(
                        "Start oder Ziel wurde nicht gefunden.",
                        "error"
                    );

                    return;

                }

                const routeUrl =
                    "https://router.project-osrm.org/route/v1/driving/" +

                    `${start.lng},${start.lat};` +

                    `${end.lng},${end.lat}` +

                    "?overview=full&geometries=geojson";

                setStatus(
                    "Route wird berechnet …",
                    "active"
                );

                const response =
                    await fetch(
                        routeUrl
                    );

                if (!response.ok) {

                    throw new Error(
                        `OSRM HTTP ${response.status}`
                    );

                }

                const data =
                    await response.json();

                if (
                    data.code !== "Ok" ||
                    !data.routes ||
                    !data.routes.length
                ) {

                    throw new Error(
                        "Keine Route gefunden."
                    );

                }

                const route =
                    data.routes[0];

                /* Alte Route entfernen */

                if (routeLayer) {

                    map.removeLayer(
                        routeLayer
                    );

                }

                if (routeStartMarker) {

                    map.removeLayer(
                        routeStartMarker
                    );

                }

                if (routeEndMarker) {

                    map.removeLayer(
                        routeEndMarker
                    );

                }

                /* Route zeichnen */

                routeLayer =
                    L.geoJSON(
                        route.geometry,
                        {

                            style: {

                                color:
                                    "#168cff",

                                weight:
                                    5,

                                opacity:
                                    0.95

                            }

                        }
                    ).addTo(
                        map
                    );

                /* Start / Ziel Marker */

                const endpointIcon =
                    L.divIcon({

                        className: "",

                        html:
                            '<div class="moi-route-marker"></div>',

                        iconSize:
                            [18, 18],

                        iconAnchor:
                            [9, 9]

                    });

                routeStartMarker =
                    L.marker(
                        [
                            start.lat,
                            start.lng
                        ],
                        {
                            icon:
                                endpointIcon
                        }
                    )
                        .addTo(map)
                        .bindPopup(
                            `<strong>START</strong><br>${escapeHtml(start.displayName)}`
                        );

                routeEndMarker =
                    L.marker(
                        [
                            end.lat,
                            end.lng
                        ],
                        {
                            icon:
                                endpointIcon
                        }
                    )
                        .addTo(map)
                        .bindPopup(
                            `<strong>ZIEL</strong><br>${escapeHtml(end.displayName)}`
                        );

                /* Skateparks laden */

                const loaded =
                    await loadAllParkPositions();

                const routeCoordinates =
                    route.geometry.coordinates;

                /*
                 * 15 km links/rechts
                 * entlang der gesamten Route.
                 */

                const nearby =
                    loaded

                        .map(
                            park => ({

                                park,

                                distance:
                                    parkDistanceToRoute(
                                        park,
                                        routeCoordinates
                                    )

                            })
                        )

                        .filter(
                            item =>
                                item.distance <=
                                15
                        )

                        .sort(
                            (a, b) =>
                                a.distance -
                                b.distance
                        );

                showParks(
                    nearby.map(
                        item =>
                            item.park
                    )
                );

                const routeBounds =
                    routeLayer.getBounds();

                nearby.forEach(
                    item => {

                        routeBounds.extend([
                            item.park.lat,
                            item.park.lng
                        ]);

                    }
                );

                map.fitBounds(
                    routeBounds,
                    {
                        padding:
                            [80, 80]
                    }
                );

                showResults(
                    nearby,
                    "SKATEPARKS AN DER ROUTE"
                );

                const distanceKm =
                    (
                        route.distance /
                        1000
                    ).toFixed(1);

                setStatus(

                    nearby.length

                        ? `${nearby.length} Skatepark(s) bis 15 km von der Route. Route: ${distanceKm} km.`

                        : `Keine Moi-cy-Spots bis 15 km von der Route. Route: ${distanceKm} km.`,

                    nearby.length
                        ? "active"
                        : ""

                );

            } catch (error) {

                console.error(
                    error
                );

                setStatus(
                    "Die Route konnte nicht berechnet werden.",
                    "error"
                );

            }

        }

        /* =====================================================
           ZURÜCKSETZEN
        ===================================================== */

        function clearMap() {

            clearParks();

            if (routeLayer) {

                map.removeLayer(
                    routeLayer
                );

                routeLayer =
                    null;

            }

            if (routeStartMarker) {

                map.removeLayer(
                    routeStartMarker
                );

                routeStartMarker =
                    null;

            }

            if (routeEndMarker) {

                map.removeLayer(
                    routeEndMarker
                );

                routeEndMarker =
                    null;

            }

            searchInput.value =
                "";

            routeStartInput.value =
                "";

            routeEndInput.value =
                "";

            results.innerHTML =
                "";

            results.hidden =
                true;

            map.setView(
                [
                    49.1,
                    8.4
                ],
                6
            );

            setStatus(
                "Suche nach einer Stadt oder starte eine Route."
            );

        }

        /* =====================================================
           HTML SICHER AUSGEBEN
        ===================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }

        /* =====================================================
           EVENTS
        ===================================================== */

        searchButton.addEventListener(
            "click",
            searchLocation
        );

        searchInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    searchLocation();

                }

            }
        );

        allParksButton.addEventListener(
            "click",
            showAllParks
        );

        routeButton.addEventListener(
            "click",
            searchRoute
        );

        clearButton.addEventListener(
            "click",
            clearMap
        );

        routeStartInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    searchRoute();

                }

            }
        );

        routeEndInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    searchRoute();

                }

            }
        );

        /*
         * Leaflet braucht nach dem Einblenden
         * manchmal einen Größen-Refresh.
         */
        setTimeout(
            () => {
                map.invalidateSize();
            },
            300
        );

    </script>

    <script
        type="module"
        src="script.js"
    ></script>
