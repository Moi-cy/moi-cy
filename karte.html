<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moi-cy – Skate Karte</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>
        /* =====================================================
           GRUNDLAGE
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden;
            background: #111111;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .leaflet-container {
            width: 100%;
            height: 100%;
            background: #111111;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================================
           OBERE NAVIGATION
        ===================================================== */

        .map-navigation {
            position: absolute;
            top: 18px;
            left: 20px;
            z-index: 1200;

            display: flex;
            align-items: center;
            gap: 7px;
        }

        .map-nav-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 40px;
            padding: 0 13px;

            border: 1px solid rgba(22,140,255,.75);
            background: rgba(5,5,5,.94);
            color: #ffffff;

            text-decoration: none;

            font-size: .62rem;
            font-weight: 900;
            letter-spacing: .12em;
            text-transform: uppercase;

            box-shadow:
                0 8px 25px rgba(0,0,0,.35);

            backdrop-filter: blur(10px);

            transition:
                background .2s ease,
                color .2s ease,
                border-color .2s ease;
        }

        .map-nav-button:hover {
            background: #168cff;
            border-color: #168cff;
            color: #ffffff;
        }

        .map-nav-back {
            font-size: .85rem;
            padding: 0 12px;
        }


        /* =====================================================
           TITEL
        ===================================================== */

        .map-title {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1100;

            margin: 0;

            color: #ffffff;

            font-size:
                clamp(1.3rem, 3vw, 2.4rem);

            font-weight: 900;
            letter-spacing: .12em;
            text-transform: uppercase;

            white-space: nowrap;
            pointer-events: none;

            text-shadow:
                0 0 12px rgba(0,0,0,.9),
                0 0 25px rgba(0,0,0,.8);
        }

        .map-title span {
            color: #168cff;
        }


        /* =====================================================
           ELECTRIC MODE
        ===================================================== */

        .electric-toggle {
            position: absolute;
            top: 18px;
            right: 20px;
            z-index: 1200;

            min-height: 40px;
            padding: 0 14px;

            border: 1px solid #168cff;
            background: rgba(5,5,5,.94);
            color: #168cff;

            font-size: .62rem;
            font-weight: 900;
            letter-spacing: .12em;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(0,0,0,.35);

            backdrop-filter: blur(10px);

            transition:
                background .2s ease,
                color .2s ease;
        }

        .electric-toggle:hover,
        .map-wrapper.electric-mode .electric-toggle {
            background: #168cff;
            color: #ffffff;
        }


        /* =====================================================
           MAP SUCHFELD
        ===================================================== */

        .map-search-panel {
            position: absolute;
            top: 72px;
            left: 20px;
            z-index: 1100;

            width: min(390px, calc(100vw - 40px));

            padding: 14px;

            background: rgba(5,5,5,.95);
            border: 1px solid rgba(22,140,255,.65);

            box-shadow:
                0 10px 35px rgba(0,0,0,.45),
                0 0 20px rgba(22,140,255,.08);

            backdrop-filter: blur(12px);
        }

        .search-brand {
            margin-bottom: 10px;

            color: #ffffff;

            font-size: .72rem;
            font-weight: 900;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .search-brand span {
            color: #168cff;
        }


        /* =====================================================
           SUCHZEILE
        ===================================================== */

        .input-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .input-wrapper input {
            width: 100%;
            height: 44px;

            padding:
                0 39px 0 13px;

            border: 1px solid rgba(255,255,255,.18);
            outline: none;

            background: #111111;
            color: #ffffff;

            font-size: .78rem;
            font-weight: 700;
        }

        .input-wrapper input::placeholder {
            color: #777777;
        }

        .input-wrapper input:focus {
            border-color: #168cff;
        }


        /* =====================================================
           KLEINES X IN INPUT
        ===================================================== */

        .clear-input {
            position: absolute;
            top: 50%;
            right: 7px;
            transform: translateY(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            width: 25px;
            height: 25px;

            padding: 0;

            border: 0;
            background: transparent;
            color: #777777;

            font-size: 17px;
            font-weight: 700;
            line-height: 1;

            cursor: pointer;

            transition:
                color .2s ease,
                background .2s ease;
        }

        .clear-input:hover {
            background: rgba(22,140,255,.15);
            color: #168cff;
        }


        /* =====================================================
           SUCHBUTTON
        ===================================================== */

        .search-button {
            flex: 0 0 48px;

            width: 48px;
            height: 44px;

            border: 1px solid #168cff;
            background: #168cff;
            color: #ffffff;

            font-size: 1rem;
            font-weight: 900;

            cursor: pointer;

            transition:
                background .2s ease,
                color .2s ease;
        }

        .search-button:hover {
            background: #ffffff;
            color: #050505;
        }


        /* =====================================================
           SUCHERGEBNISSE
        ===================================================== */

        .search-results {
            display: none;

            max-height: 250px;
            overflow-y: auto;

            margin-top: 7px;

            border:
                1px solid rgba(255,255,255,.1);

            background: #0a0a0a;
        }

        .search-results.active {
            display: block;
        }

        .search-result {
            display: block;

            width: 100%;

            padding: 10px 12px;

            border: 0;
            border-bottom:
                1px solid rgba(255,255,255,.07);

            background: transparent;
            color: #ffffff;

            text-align: left;

            cursor: pointer;
        }

        .search-result:hover {
            background:
                rgba(22,140,255,.14);
        }

        .search-result-name {
            display: block;

            color: #ffffff;

            font-size: .7rem;
            font-weight: 900;
        }

        .search-result-location {
            display: block;

            margin-top: 3px;

            color: #777777;

            font-size: .58rem;
        }


        /* =====================================================
           TRENNER
        ===================================================== */

        .route-divider {
            height: 1px;

            margin: 14px 0;

            background:
                rgba(255,255,255,.12);
        }


        /* =====================================================
           ROUTE
        ===================================================== */

        .route-label {
            margin-bottom: 7px;

            color: #777777;

            font-size: .62rem;
            font-weight: 900;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .route-input-row {
            margin-bottom: 7px;
        }

        .route-input-wrapper input {
            height: 40px;
        }

        .route-buttons {
            display: grid;

            grid-template-columns:
                1fr auto;

            gap: 7px;

            margin-top: 8px;
        }

        .route-plan-button,
        .location-button {
            min-height: 40px;

            border: 1px solid #168cff;
            background: #168cff;
            color: #ffffff;

            font-size: .62rem;
            font-weight: 900;
            letter-spacing: .1em;

            cursor: pointer;

            transition:
                background .2s ease,
                color .2s ease;
        }

        .route-plan-button:hover,
        .location-button:hover {
            background: #ffffff;
            color: #050505;
        }

        .location-button {
            padding: 0 13px;
        }


        /* =====================================================
           ROUTEN-ERGEBNIS
           
           WICHTIG:
           Das Ergebnis befindet sich NICHT im eigentlichen
           Suchfeld, sondern als eigene Box darunter.
        ===================================================== */

        .route-result-area {
            width: min(390px, calc(100vw - 40px));

            margin-top: 12px;
        }

        .route-info {
            position: relative;

            display: none;

            width: 100%;

            padding:
                14px 48px 14px 14px;

            background:
                rgba(5,5,5,.96);

            border:
                1px solid #168cff;

            box-shadow:
                0 10px 30px rgba(0,0,0,.45),
                0 0 18px rgba(22,140,255,.15);
        }

        .route-info.active {
            display: block;
        }

        .route-info-title {
            margin-bottom: 5px;

            color: #168cff;

            font-size: .6rem;
            font-weight: 900;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .route-info-main {
            color: #ffffff;

            font-size: .84rem;
            font-weight: 900;
        }

        .route-info-sub {
            margin-top: 5px;

            color: #888888;

            font-size: .65rem;
            line-height: 1.4;
        }

        .route-close {
            position: absolute;

            top: 8px;
            right: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 28px;
            height: 28px;

            padding: 0;

            border:
                1px solid rgba(255,255,255,.2);

            background: #111111;
            color: #ffffff;

            font-size: 18px;
            font-weight: 900;

            line-height: 1;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease;
        }

        .route-close:hover {
            background: #168cff;
            border-color: #168cff;
        }


        /* =====================================================
           PLATZHALTER FÜR SPÄTERE BILDER
           
           Der Bereich liegt bewusst unter dem Routenergebnis.
           Hier können später Bilder / weitere Infos ergänzt
           werden.
        ===================================================== */

        .route-extra-content {
            width: min(390px, calc(100vw - 40px));

            margin-top: 12px;

            pointer-events: none;
        }


        /* =====================================================
           LEAFLET
        ===================================================== */

        .leaflet-bottom.leaflet-left {
            left: 20px;
            bottom: 20px;
        }

        .leaflet-control-zoom {
            margin: 0 !important;

            border:
                1px solid rgba(22,140,255,.75) !important;

            box-shadow:
                0 8px 25px rgba(0,0,0,.4) !important;
        }

        .leaflet-control-zoom a {
            width: 38px !important;
            height: 38px !important;

            line-height: 38px !important;

            background: #050505 !important;
            color: #168cff !important;

            border-color:
                rgba(255,255,255,.12) !important;

            transition:
                background .2s ease,
                color .2s ease;
        }

        .leaflet-control-zoom a:hover {
            background: #168cff !important;
            color: #ffffff !important;
        }


        /* =====================================================
           POPUPS
        ===================================================== */

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #080808;
            color: #ffffff;

            border:
                1px solid rgba(22,140,255,.6);
        }

        .leaflet-popup-content {
            margin: 14px;
        }

        .popup-title {
            margin-bottom: 5px;

            color: #168cff;

            font-size: .78rem;
            font-weight: 900;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .popup-location {
            margin-bottom: 10px;

            color: #999999;

            font-size: .68rem;
        }

        .popup-route {
            min-height: 34px;

            padding: 0 11px;

            border:
                1px solid #168cff;

            background: #168cff;
            color: #ffffff;

            font-size: .58rem;
            font-weight: 900;
            letter-spacing: .08em;

            cursor: pointer;
        }

        .popup-route:hover {
            background: #ffffff;
            color: #050505;
        }


        /* =====================================================
           PARK MARKER
        ===================================================== */

        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 28px;
            height: 28px;

            background: #168cff;

            border:
                2px solid #ffffff;

            color: #ffffff;

            font-size: 14px;
            font-weight: 900;

            box-shadow:
                0 0 0 4px rgba(22,140,255,.18),
                0 0 15px rgba(22,140,255,.55);
        }

        .map-wrapper.electric-mode .custom-marker {
            box-shadow:
                0 0 0 4px rgba(22,140,255,.25),
                0 0 12px #168cff,
                0 0 28px #168cff;
        }


        /* =====================================================
           ROUTEN MARKER
        ===================================================== */

        .route-start-marker,
        .route-end-marker {
            width: 20px;
            height: 20px;

            border-radius: 50%;

            border:
                3px solid #ffffff;

            background: #168cff;

            box-shadow:
                0 0 10px #168cff,
                0 0 25px rgba(22,140,255,.9);
        }

        .route-line {
            filter:
                drop-shadow(
                    0 0 4px
                    rgba(22,140,255,.95)
                )
                drop-shadow(
                    0 0 10px
                    rgba(22,140,255,.65)
                );
        }


        /* =====================================================
           ELECTRIC MAP
        ===================================================== */

        .map-wrapper.electric-mode
        .leaflet-tile-pane {

            filter:
                grayscale(1)
                brightness(.52)
                contrast(1.45)
                sepia(.12)
                hue-rotate(165deg)
                saturate(3.5);
        }

        .map-wrapper.electric-mode::after {
            content: "";

            position: absolute;
            inset: 0;

            z-index: 2;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    transparent 0%,
                    rgba(0,110,255,.04) 55%,
                    rgba(0,110,255,.12) 100%
                );
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .map-navigation {
                top: 10px;
                left: 10px;
            }

            .map-nav-button {
                min-height: 36px;
                padding: 0 10px;
            }

            .map-nav-button:not(.map-nav-back) {
                display: none;
            }

            .map-title {
                top: 13px;

                font-size: 1.1rem;

                left: 50%;
            }

            .electric-toggle {
                top: 10px;
                right: 10px;

                min-height: 36px;
                padding: 0 10px;
            }

            .map-search-panel {
                top: 55px;
                left: 10px;

                width:
                    calc(100vw - 20px);

                padding: 11px;
            }

            .route-result-area {
                width:
                    calc(100vw - 20px);
            }

            .route-extra-content {
                width:
                    calc(100vw - 20px);
            }

            .leaflet-bottom.leaflet-left {
                left: 10px;
                bottom: 12px;
            }

            .leaflet-control-zoom a {
                width: 40px !important;
                height: 40px !important;
                line-height: 40px !important;
            }
        }
    </style>
</head>

<body>

<div
    class="map-wrapper"
    id="mapWrapper"
>

    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <nav
        class="map-navigation"
        aria-label="Karten Navigation"
    >

        <a
            href="index.html"
            class="map-nav-button map-nav-back"
            aria-label="Zurück zur Startseite"
        >
            ←
        </a>

        <a
            href="index.html"
            class="map-nav-button"
        >
            START
        </a>

        <a
            href="skateplaetze.html"
            class="map-nav-button"
        >
            SKATEPLÄTZE
        </a>

    </nav>


    <!-- =========================================
         TITEL
    ========================================== -->

    <h1 class="map-title">
        SKATE <span>KARTE</span>
    </h1>


    <!-- =========================================
         ELECTRIC MODE
    ========================================== -->

    <button
        class="electric-toggle"
        id="electricToggle"
        type="button"
    >
        ELECTRIC MODE
    </button>


    <!-- =========================================
         SUCH- UND ROUTENPANEL
    ========================================== -->

    <div class="map-search-panel">

        <div class="search-brand">
            <span>Moi-cy</span> MAP
        </div>


        <!-- NORMALE SUCHE -->

        <div class="input-row">

            <div class="input-wrapper">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Skatepark, Stadt oder Straße..."
                    autocomplete="off"
                >

                <button
                    class="clear-input"
                    id="clearSearch"
                    type="button"
                    aria-label="Suche löschen"
                >
                    ×
                </button>

            </div>

            <button
                class="search-button"
                id="searchButton"
                type="button"
                aria-label="Suchen"
            >
                ↗
            </button>

        </div>


        <!-- SUCHERGEBNISSE -->

        <div
            class="search-results"
            id="searchResults"
        ></div>


        <div class="route-divider"></div>


        <!-- ROUTE -->

        <div class="route-label">
            ROUTE PLANEN
        </div>


        <div class="route-input-row">

            <div class="input-wrapper route-input-wrapper">

                <input
                    type="text"
                    id="routeStart"
                    placeholder="Von – Stadt oder Adresse"
                    autocomplete="off"
                >

                <button
                    class="clear-input"
                    id="clearRouteStart"
                    type="button"
                    aria-label="Start löschen"
                >
                    ×
                </button>

            </div>

        </div>


        <div class="route-input-row">

            <div class="input-wrapper route-input-wrapper">

                <input
                    type="text"
                    id="routeDestination"
                    placeholder="Nach – Stadt oder Adresse"
                    autocomplete="off"
                >

                <button
                    class="clear-input"
                    id="clearRouteDestination"
                    type="button"
                    aria-label="Ziel löschen"
                >
                    ×
                </button>

            </div>

        </div>


        <div class="route-buttons">

            <button
                class="route-plan-button"
                id="routeButton"
                type="button"
            >
                ROUTE PLANEN
            </button>

            <button
                class="location-button"
                id="locationButton"
                type="button"
            >
                MEIN STANDORT
            </button>

        </div>

    </div>


    <!-- =========================================
         ROUTEN-ERGEBNIS
         
         KOMPLETT AUSSERHALB DES SUCHFELDES
    ========================================== -->

    <div
        class="route-result-area"
        id="routeResultArea"
    >

        <div
            class="route-info"
            id="routeInfo"
        >

            <button
                class="route-close"
                id="routeClose"
                type="button"
                aria-label="Route löschen"
            >
                ×
            </button>

            <div class="route-info-title">
                ROUTE
            </div>

            <div
                class="route-info-main"
                id="routeInfoMain"
            >
                –
            </div>

            <div
                class="route-info-sub"
                id="routeInfoSub"
            >
                –
            </div>

        </div>

    </div>


    <!--
        Hier kann später weiterer Inhalt hin,
        z.B. Bilder, Infos zur Route usw.
    -->

    <div
        class="route-extra-content"
        id="routeExtraContent"
    ></div>


    <!-- =========================================
         KARTE
    ========================================== -->

    <div id="map"></div>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
></script>


<script>

    /* =====================================================
       SKATEPARK-DATEN
    ===================================================== */

    const skateparks = [

        {
            name: "Valence",
            city: "Valence",
            country: "Frankreich",
            lat: 44.9334,
            lng: 4.8924
        },

        {
            name: "Karlsruhe",
            city: "Karlsruhe",
            country: "Deutschland",
            lat: 49.0069,
            lng: 8.4037
        },

        {
            name: "Heidelberg",
            city: "Heidelberg",
            country: "Deutschland",
            lat: 49.3988,
            lng: 8.6724
        },

        {
            name: "Heidelberg Bowl",
            city: "Heidelberg",
            country: "Deutschland",
            lat: 49.4077,
            lng: 8.6908
        },

        {
            name: "Perpignan",
            city: "Perpignan",
            country: "Frankreich",
            lat: 42.6887,
            lng: 2.8948
        },

        {
            name: "München Hirschgarten",
            city: "München",
            country: "Deutschland",
            lat: 48.1445,
            lng: 11.4854
        }

    ];


    /* =====================================================
       KARTE
    ===================================================== */

    const map =
        L.map(
            "map",
            {
                zoomControl: true,
                attributionControl: true
            }
        );

    map.setView(
        [48.9, 8.5],
        7
    );


    L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    /*
     * Leaflet neu berechnen lassen.
     * Das verhindert, dass die Karte in falsche
     * Kachelbereiche aufgeteilt dargestellt wird.
     */

    function refreshMapSize() {

        setTimeout(
            () => {

                map.invalidateSize({
                    animate: false,
                    pan: false
                });

            },
            100
        );
    }


    window.addEventListener(
        "load",
        refreshMapSize
    );

    window.addEventListener(
        "resize",
        refreshMapSize
    );

    setTimeout(
        refreshMapSize,
        500
    );


    /* =====================================================
       ELEMENTE
    ===================================================== */

    const mapWrapper =
        document.getElementById(
            "mapWrapper"
        );

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const searchButton =
        document.getElementById(
            "searchButton"
        );

    const clearSearch =
        document.getElementById(
            "clearSearch"
        );

    const searchResults =
        document.getElementById(
            "searchResults"
        );

    const routeStart =
        document.getElementById(
            "routeStart"
        );

    const routeDestination =
        document.getElementById(
            "routeDestination"
        );

    const clearRouteStart =
        document.getElementById(
            "clearRouteStart"
        );

    const clearRouteDestination =
        document.getElementById(
            "clearRouteDestination"
        );

    const routeButton =
        document.getElementById(
            "routeButton"
        );

    const locationButton =
        document.getElementById(
            "locationButton"
        );

    const routeInfo =
        document.getElementById(
            "routeInfo"
        );

    /* =====================================================
       SUCHE NORMALISIEREN
    ===================================================== */

    function normalizeSearchText(
        value
    ) {

        return String(
            value || ""
        )
            .toLowerCase()
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
            .replace(
                /ß/g,
                "ss"
            )
            .replace(
                /[^a-z0-9]+/g,
                " "
            )
            .trim();
    }


    /* =====================================================
       LEVENSHTEIN
    ===================================================== */

    function levenshteinDistance(
        a,
        b
    ) {

        if (a === b) {
            return 0;
        }

        if (!a.length) {
            return b.length;
        }

        if (!b.length) {
            return a.length;
        }

        const matrix =
            Array.from(
                {
                    length:
                        b.length + 1
                },
                (_, i) => {

                    const row =
                        new Array(
                            a.length + 1
                        );

                    row[0] = i;

                    return row;
                }
            );


        for (
            let j = 0;
            j <= a.length;
            j++
        ) {

            matrix[0][j] = j;
        }


        for (
            let i = 1;
            i <= b.length;
            i++
        ) {

            for (
                let j = 1;
                j <= a.length;
                j++
            ) {

                const cost =
                    a[j - 1] ===
                    b[i - 1]
                        ? 0
                        : 1;

                matrix[i][j] =
                    Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
            }
        }


        return matrix
            [b.length]
            [a.length];
    }


    /* =====================================================
       ÄHNLICHKEIT
    ===================================================== */

    function tokenSimilarity(
        queryToken,
        candidateToken
    ) {

        if (
            !queryToken ||
            !candidateToken
        ) {
            return 0;
        }

        if (
            candidateToken.includes(
                queryToken
            ) ||
            queryToken.includes(
                candidateToken
            )
        ) {
            return 1;
        }


        const maxLength =
            Math.max(
                queryToken.length,
                candidateToken.length
            );


        const distance =
            levenshteinDistance(
                queryToken,
                candidateToken
            );


        const allowed =
            maxLength <= 4
                ? 1
                : maxLength <= 7
                    ? 2
                    : 3;


        if (
            distance <= allowed
        ) {

            return (
                1 -
                distance /
                    maxLength
            );
        }


        return 0;
    }


    function fuzzyScore(
        query,
        text
    ) {

        const q =
            normalizeSearchText(
                query
            );

        const t =
            normalizeSearchText(
                text
            );


        if (!q || !t) {
            return 0;
        }


        if (
            t.includes(q)
        ) {
            return 1;
        }


        const qTokens =
            q.split(/\s+/)
                .filter(Boolean);

        const tTokens =
            t.split(/\s+/)
                .filter(Boolean);


        let total = 0;


        for (
            const qt of qTokens
        ) {

            let best = 0;


            for (
                const tt of tTokens
            ) {

                best =
                    Math.max(
                        best,
                        tokenSimilarity(
                            qt,
                            tt
                        )
                    );
            }


            total += best;
        }


        return (
            total /
            qTokens.length
        );
    }

    /* =====================================================
       PARK-SUCHE
    ===================================================== */

    function showParkSearchResults(
        query
    ) {

        const normalizedQuery =
            normalizeSearchText(
                query
            );


        if (!normalizedQuery) {

            searchResults
                .classList
                .remove(
                    "active"
                );

            searchResults.innerHTML =
                "";

            return;
        }


        const scored =
            skateparks
                .map(
                    park => {

                        const text = `
                            ${park.name}
                            ${park.city}
                            ${park.country}
                        `;

                        return {
                            park,
                            score:
                                fuzzyScore(
                                    normalizedQuery,
                                    text
                                )
                        };
                    }
                )
                .filter(
                    item =>
                        item.score >= .45
                )
                .sort(
                    (a,b) =>
                        b.score -
                        a.score
                );


        if (!scored.length) {

            searchResults
                .classList
                .remove(
                    "active"
                );

            searchResults.innerHTML =
                "";

            return;
        }


        searchResults.innerHTML =
            scored
                .slice(0,6)
                .map(
                    item => {

                        const park =
                            item.park;

                        return `
                            <button
                                class="search-result"
                                type="button"
                                data-lat="${park.lat}"
                                data-lng="${park.lng}"
                                data-name="${encodeURIComponent(park.name)}"
                            >
                                <span class="search-result-name">
                                    ${park.name}
                                </span>

                                <span class="search-result-location">
                                    ${park.city}, ${park.country}
                                </span>
                            </button>
                        `;
                    }
                )
                .join("");


        searchResults
            .classList
            .add("active");


        searchResults
            .querySelectorAll(
                ".search-result"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const lat =
                                Number(
                                    button.dataset.lat
                                );

                            const lng =
                                Number(
                                    button.dataset.lng
                                );

                            const name =
                                decodeURIComponent(
                                    button.dataset.name
                                );


                            map.setView(
                                [lat,lng],
                                15,
                                {
                                    animate:
                                        true
                                }
                            );


                            const found =
                                parkMarkers.find(
                                    item =>
                                        item.park.lat === lat &&
                                        item.park.lng === lng
                                );


                            if (found) {
                                found.marker
                                    .openPopup();
                            }


                            searchInput.value =
                                name;


                            searchResults
                                .classList
                                .remove(
                                    "active"
                                );
                        }
                    );
                }
            );
    }


    /* =====================================================
       NOMINATIM
    ===================================================== */

    async function searchPlace(
        query
    ) {

        const url =
            "https://nominatim.openstreetmap.org/search?" +
            new URLSearchParams({
                q: query,
                format: "json",
                limit: "5",
                addressdetails: "1"
            });


        const response =
            await fetch(
                url,
                {
                    headers: {
                        Accept:
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Nominatim Fehler"
            );
        }


        return response.json();
    }


    /* =====================================================
       HAUPTSUCHE
    ===================================================== */

    async function performSearch() {

        const query =
            searchInput.value.trim();


        if (!query) {
            return;
        }


        showParkSearchResults(
            query
        );


        const normalizedQuery =
            normalizeSearchText(
                query
            );


        const bestPark =
            skateparks
                .map(
                    park => ({
                        park,

                        score:
                            fuzzyScore(
                                normalizedQuery,
                                `
                                    ${park.name}
                                    ${park.city}
                                    ${park.country}
                                `
                            )
                    })
                )
                .sort(
                    (a,b) =>
                        b.score -
                        a.score
                )[0];


        if (
            bestPark &&
            bestPark.score >= .78
        ) {

            map.setView(
                [
                    bestPark.park.lat,
                    bestPark.park.lng
                ],
                15,
                {
                    animate:
                        true
                }
            );


            const found =
                parkMarkers.find(
                    item =>
                        item.park.name ===
                        bestPark.park.name
                );


            if (found) {
                found.marker
                    .openPopup();
            }


            return;
        }


        try {

            const results =
                await searchPlace(
                    query
                );


            if (!results.length) {
                return;
            }


            const result =
                results[0];


            const lat =
                Number(
                    result.lat
                );

            const lng =
                Number(
                    result.lon
                );


            map.setView(
                [lat,lng],
                14,
                {
                    animate:
                        true
                }
            );


            L.marker(
                [lat,lng],
                {
                    icon:
                        createParkIcon()
                }
            )
                .addTo(map)
                .bindPopup(`
                    <div class="popup-title">
                        ${result.display_name.split(",")[0]}
                    </div>

                    <div class="popup-location">
                        ${result.display_name}
                    </div>
                `)
                .openPopup();


        } catch (error) {

            console.error(
                "Moi-cy Suche:",
                error
            );
        }
    }

    /* =====================================================
       ROUTEN-INFO
    ===================================================== */

    function showRouteInfo(
        distance,
        duration
    ) {

        const distanceKm =
            (
                distance /
                1000
            ).toFixed(1);


        const totalMinutes =
            Math.round(
                duration /
                60
            );


        let durationText;


        if (
            totalMinutes < 60
        ) {

            durationText =
                `${totalMinutes} Min.`;

        } else {

            const hours =
                Math.floor(
                    totalMinutes /
                    60
                );

            const minutes =
                totalMinutes %
                60;


            durationText =
                `${hours} Std. ${minutes} Min.`;
        }


        routeInfoMain.textContent =
            `${distanceKm} km · ${durationText}`;


        routeInfoSub.textContent =
            "Route wird auf der Karte angezeigt.";


        routeInfo
            .classList
            .add(
                "active"
            );
    }


    /* =====================================================
       GEOCODING
    ===================================================== */

    async function geocodePlace(
        query
    ) {

        const trimmed =
            String(
                query || ""
            ).trim();


        if (!trimmed) {

            throw new Error(
                "Kein Ort angegeben."
            );
        }


        const normalized =
            normalizeSearchText(
                trimmed
            );


        const matches =
            skateparks
                .map(
                    park => ({
                        park,

                        score:
                            fuzzyScore(
                                normalized,
                                `
                                    ${park.name}
                                    ${park.city}
                                    ${park.country}
                                `
                            )
                    })
                )
                .sort(
                    (a,b) =>
                        b.score -
                        a.score
                );


        if (
            matches.length &&
            matches[0].score >= .78
        ) {

            return {

                lat:
                    matches[0]
                        .park.lat,

                lng:
                    matches[0]
                        .park.lng,

                name:
                    matches[0]
                        .park.name
            };
        }


        const results =
            await searchPlace(
                trimmed
            );


        if (!results.length) {

            throw new Error(
                `Ort nicht gefunden: ${trimmed}`
            );
        }


        return {

            lat:
                Number(
                    results[0].lat
                ),

            lng:
                Number(
                    results[0].lon
                ),

            name:
                results[0]
                    .display_name
        };
    }


    /* =====================================================
       ROUTE BERECHNEN
    ===================================================== */

    async function planRoute(
        startQuery,
        destinationQuery
    ) {

        clearRoute();


        const start =
            await geocodePlace(
                startQuery
            );


        const destination =
            await geocodePlace(
                destinationQuery
            );


        const url =
            "https://router.project-osrm.org/route/v1/driving/" +

            `${start.lng},${start.lat};` +

            `${destination.lng},${destination.lat}` +

            "?overview=full&geometries=geojson";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Routenserver nicht erreichbar."
            );
        }


        const data =
            await response.json();


        if (
            data.code !== "Ok" ||
            !data.routes ||
            !data.routes.length
        ) {

            throw new Error(
                "Keine Route gefunden."
            );
        }


        const route =
            data.routes[0];


        routeLayer =
            L.geoJSON(
                route.geometry,
                {
                    style: {

                        color:
                            "#168cff",

                        weight:
                            6,

                        opacity:
                            .95,

                        className:
                            "route-line"
                    }
                }
            )
            .addTo(map);


        routeStartMarker =
            L.marker(
                [
                    start.lat,
                    start.lng
                ],
                {
                    icon:
                        L.divIcon({

                            className:
                                "",

                            html:
                                '<div class="route-start-marker"></div>',

                            iconSize:
                                [20,20],

                            iconAnchor:
                                [10,10]
                        })
                }
            )
            .addTo(map);


        routeEndMarker =
            L.marker(
                [
                    destination.lat,
                    destination.lng
                ],
                {
                    icon:
                        L.divIcon({

                            className:
                                "",

                            html:
                                '<div class="route-end-marker"></div>',

                            iconSize:
                                [20,20],

                            iconAnchor:
                                [10,10]
                        })
                }
            )
            .addTo(map);


        map.fitBounds(
            routeLayer.getBounds(),
            {
                padding:
                    [70,70]
            }
        );


        showRouteInfo(
            route.distance,
            route.duration
        );
    }

    /* =====================================================
       ROUTE ZU SKATEPARK
    ===================================================== */

    window.routeToPark =
        function(
            lat,
            lng,
            name
        ) {

            if (
                !navigator.geolocation
            ) {

                routeInfoMain.textContent =
                    "Standort nicht verfügbar";

                routeInfoSub.textContent =
                    "Bitte Start und Ziel manuell eingeben.";

                routeInfo
                    .classList
                    .add(
                        "active"
                    );

                return;
            }


            navigator.geolocation.getCurrentPosition(

                async position => {

                    const currentLat =
                        position.coords.latitude;

                    const currentLng =
                        position.coords.longitude;


                    routeStart.value =
                        "Mein Standort";


                    routeDestination.value =
                        name;


                    try {

                        clearRoute();


                        /*
                         * clearRoute leert die Felder.
                         * Deshalb danach wieder einsetzen.
                         */

                        routeStart.value =
                            "Mein Standort";

                        routeDestination.value =
                            name;


                        const url =
                            "https://router.project-osrm.org/route/v1/driving/" +

                            `${currentLng},${currentLat};` +

                            `${lng},${lat}` +

                            "?overview=full&geometries=geojson";


                        const response =
                            await fetch(url);


                        const data =
                            await response.json();


                        if (
                            data.code !== "Ok" ||
                            !data.routes.length
                        ) {

                            throw new Error(
                                "Keine Route gefunden."
                            );
                        }


                        const route =
                            data.routes[0];


                        routeLayer =
                            L.geoJSON(
                                route.geometry,
                                {
                                    style: {

                                        color:
                                            "#168cff",

                                        weight:
                                            6,

                                        opacity:
                                            .95,

                                        className:
                                            "route-line"
                                    }
                                }
                            )
                            .addTo(map);


                        routeStartMarker =
                            L.marker(
                                [
                                    currentLat,
                                    currentLng
                                ],
                                {
                                    icon:
                                        L.divIcon({

                                            className:
                                                "",

                                            html:
                                                '<div class="route-start-marker"></div>',

                                            iconSize:
                                                [20,20],

                                            iconAnchor:
                                                [10,10]
                                        })
                                }
                            )
                            .addTo(map);


                        routeEndMarker =
                            L.marker(
                                [lat,lng],
                                {
                                    icon:
                                        L.divIcon({

                                            className:
                                                "",

                                            html:
                                                '<div class="route-end-marker"></div>',

                                            iconSize:
                                                [20,20],

                                            iconAnchor:
                                                [10,10]
                                        })
                                }
                            )
                            .addTo(map);


                        map.fitBounds(
                            routeLayer.getBounds(),
                            {
                                padding:
                                    [70,70]
                            }
                        );


                        showRouteInfo(
                            route.distance,
                            route.duration
                        );

                    } catch (error) {

                        routeInfoMain.textContent =
                            "Route konnte nicht erstellt werden";

                        routeInfoSub.textContent =
                            error.message;

                        routeInfo
                            .classList
                            .add(
                                "active"
                            );
                    }
                },


                () => {

                    routeInfoMain.textContent =
                        "Standortfreigabe benötigt";

                    routeInfoSub.textContent =
                        "Erlaube deinem Browser den Zugriff auf deinen Standort.";

                    routeInfo
                        .classList
                        .add(
                            "active"
                        );
                }
            );
        };


    /* =====================================================
       ELECTRIC MODE
    ===================================================== */

    mapWrapper
        .classList
        .remove(
            "electric-mode"
        );


    electricToggle.addEventListener(
        "click",
        () => {

            const electric =
                mapWrapper
                    .classList
                    .toggle(
                        "electric-mode"
                    );


            electricToggle.textContent =
                electric
                    ? "NORMAL MODE"
                    : "ELECTRIC MODE";
        }
    );


    /* =====================================================
       ESC
    ===================================================== */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                clearRoute();

                map.closePopup();
            }
        }
    );


    /* =====================================================
       KLICK AUF KARTE
    ===================================================== */

    map.on(
        "click",
        () => {

            searchResults
                .classList
                .remove(
                    "active"
                );
        }
    );

</script>

</body>
</html>
