<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moi-cy – Skate Karte</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3nZ5X7W5t8qX6j5t5L5l5m5m5m5m5="
        crossorigin=""
    >

    <style>
        :root {
            --black: #050505;
            --black-2: #090909;
            --dark: #101010;
            --dark-2: #151515;
            --dark-3: #1d1d1d;
            --white: #f5f5f5;
            --white-pure: #ffffff;
            --muted: #858585;
            --line: rgba(255,255,255,0.13);
            --blue: #168cff;
            --blue-bright: #00a8ff;
            --blue-dark: #0864bd;
            --header-height: 76px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--black);
            color: var(--white);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        a {
            color: inherit;
        }

        /* =========================================================
           NAVIGATION
        ========================================================= */

        .site-navigation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            z-index: 5000;

            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;

            padding: 0 28px;

            background: rgba(5,5,5,0.96);
            border-bottom: 1px solid var(--line);
        }

        .nav-logo {
            justify-self: start;
            text-decoration: none;

            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 0.05em;
        }

        .nav-logo-box {
            width: 42px;
            height: 42px;
            min-width: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--blue);
            color: white;

            font-size: 24px;
            font-weight: 900;
            line-height: 1;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;

            font-size: 0.66rem;
            font-weight: 900;
            letter-spacing: 0.13em;

            transition:
                color 0.2s ease,
                opacity 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--blue-bright);
        }

        .nav-right {
            justify-self: end;

            display: flex;
            align-items: center;
            gap: 7px;
        }

        .language {
            border: 0;
            background: transparent;
            color: var(--muted);

            padding: 5px;

            font-size: 0.62rem;
            font-weight: 900;

            cursor: pointer;
        }

        .language.active,
        .language:hover {
            color: var(--white);
        }

        .mobile-menu-button {
            display: none;

            width: 42px;
            height: 42px;

            border: 1px solid var(--line);
            background: transparent;
            color: var(--white);

            cursor: pointer;
        }

        .mobile-menu-button span {
            display: block;
            width: 19px;
            height: 2px;
            margin: 4px auto;
            background: currentColor;
        }

        .mobile-navigation {
            display: none;
        }

        /* =========================================================
           MAP WRAPPER
        ========================================================= */

        .map-wrapper {
            position: fixed;
            top: var(--header-height);
            left: 0;
            right: 0;
            bottom: 0;

            overflow: hidden;
            background: #d7d7d7;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* =========================================================
           MAP TITLE
        ========================================================= */

        .map-title {
            position: absolute;
            top: 20px;
            right: 20px;

            z-index: 1000;

            pointer-events: none;

            font-size: clamp(1rem, 2vw, 1.45rem);
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;

            color: var(--black);
            background: rgba(255,255,255,0.92);

            padding: 10px 14px;
        }

        .map-title span {
            color: var(--blue);
        }

        /* =========================================================
           ELECTRIC MODE
        ========================================================= */

        .electric-toggle {
            position: absolute;
            top: 20px;
            right: 20px;

            transform: translateY(58px);

            z-index: 1200;

            display: flex;
            align-items: center;
            gap: 9px;

            min-height: 38px;
            padding: 0 12px;

            border: 1px solid rgba(0,168,255,0.55);
            background: rgba(5,5,5,0.9);
            color: var(--blue-bright);

            font-size: 0.61rem;
            font-weight: 900;
            letter-spacing: 0.1em;

            cursor: pointer;
        }

        .electric-toggle-indicator {
            width: 9px;
            height: 9px;

            border-radius: 50%;
            background: var(--muted);
        }

        .electric-toggle.active {
            background: rgba(0,168,255,0.14);
            border-color: var(--blue-bright);
        }

        .electric-toggle.active .electric-toggle-indicator {
            background: var(--blue-bright);
            box-shadow: 0 0 12px var(--blue-bright);
        }

        /* =========================================================
           LEFT MAP UI
        ========================================================= */

        .map-ui-left {
            position: absolute;
            top: 20px;
            left: 20px;

            width: min(390px, calc(100vw - 40px));

            z-index: 2000;
        }

        .map-search-panel {
            width: 100%;

            padding: 16px;

            background: rgba(5,5,5,0.95);
            border: 1px solid rgba(255,255,255,0.16);

            box-shadow: 0 14px 40px rgba(0,0,0,0.25);
        }

        .panel-heading {
            margin: 0 0 12px;

            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;

            color: var(--white);
        }

        .search-group {
            margin-bottom: 12px;
        }

        .search-group:last-child {
            margin-bottom: 0;
        }

        .search-label {
            display: block;

            margin-bottom: 6px;

            color: var(--muted);

            font-size: 0.56rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;
            align-items: stretch;

            width: 100%;

            border: 1px solid rgba(255,255,255,0.18);
            background: var(--dark-2);

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .input-row:focus-within {
            border-color: var(--blue-bright);
            background: var(--dark-3);
        }

        .search-input {
            flex: 1;
            min-width: 0;

            height: 43px;

            padding: 0 11px;

            border: 0;
            outline: 0;

            background: transparent;
            color: var(--white);

            font-size: 0.75rem;
        }

        .search-input::placeholder {
            color: #686868;
        }

        .clear-input {
            width: 37px;
            min-width: 37px;

            border: 0;
            border-left: 1px solid rgba(255,255,255,0.08);

            background: transparent;
            color: var(--muted);

            font-size: 1rem;
            line-height: 1;

            cursor: pointer;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        .clear-input:hover {
            color: var(--white);
            background: rgba(255,255,255,0.06);
        }

        .search-submit {
            width: 48px;
            min-width: 48px;

            border: 0;
            border-left: 1px solid rgba(255,255,255,0.08);

            background: var(--blue);
            color: white;

            font-size: 0.85rem;
            font-weight: 900;

            cursor: pointer;

            transition: background 0.2s ease;
        }

        .search-submit:hover {
            background: var(--blue-dark);
        }

        .route-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;

            margin-top: 9px;
        }

        .route-button,
        .location-button {
            height: 40px;

            border: 1px solid var(--blue);
            background: var(--blue);

            color: white;

            font-size: 0.6rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .route-button:hover {
            background: var(--blue-dark);
            border-color: var(--blue-dark);
        }

        .location-button {
            width: 43px;

            background: transparent;
            color: var(--blue-bright);
            border-color: rgba(0,168,255,0.5);

            font-size: 1rem;
        }

        .location-button:hover {
            background: rgba(0,168,255,0.12);
            border-color: var(--blue-bright);
        }

        /* =========================================================
           SEARCH RESULTS
        ========================================================= */

        .search-results {
            margin-top: 10px;
        }

        .search-results:empty {
            display: none;
        }

        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            width: 100%;

            margin-bottom: 5px;
            padding: 10px 11px;

            border: 1px solid rgba(255,255,255,0.1);

            background: rgba(21,21,21,0.97);

            cursor: pointer;

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item:hover {
            border-color: var(--blue-bright);
            background: #1b1b1b;
        }

        .result-main {
            min-width: 0;
        }

        .result-name {
            margin-bottom: 3px;

            color: var(--white);

            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .result-meta {
            color: var(--muted);

            font-size: 0.57rem;
            line-height: 1.4;
        }

        .result-arrow {
            flex-shrink: 0;

            color: var(--blue-bright);

            font-size: 1rem;
            font-weight: 900;
        }

        .search-message {
            padding: 10px 11px;

            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(21,21,21,0.97);

            color: var(--muted);

            font-size: 0.59rem;
            line-height: 1.45;
        }

        /* =========================================================
           ROUTE RESULT
        ========================================================= */

        .route-result-area {
            width: 100%;
            margin-top: 12px;
        }

        .route-result {
            position: relative;

            width: 100%;

            padding: 15px 45px 15px 15px;

            background: rgba(5,5,5,0.96);
            border: 1px solid var(--blue-bright);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.28),
                0 0 18px rgba(0,168,255,0.08);
        }

        .route-result-title {
            margin-bottom: 9px;

            color: var(--blue-bright);

            font-size: 0.59rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .route-path {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 12px;

            color: var(--white);

            font-size: 0.69rem;
            font-weight: 800;

            line-height: 1.4;
        }

        .route-path span {
            color: var(--muted);
        }

        .route-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;

            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 11px;
        }

        .route-stat {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .route-stat + .route-stat {
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 14px;
        }

        .route-stat-label {
            color: var(--muted);

            font-size: 0.52rem;
            font-weight: 900;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .route-stat-value {
            color: var(--white);

            font-size: 0.9rem;
            font-weight: 900;
        }

        .route-close {
            position: absolute;
            top: 9px;
            right: 9px;

            width: 28px;
            height: 28px;

            border: 0;
            background: transparent;
            color: var(--muted);

            font-size: 1rem;
            line-height: 1;

            cursor: pointer;
        }

        .route-close:hover {
            color: var(--white);
        }

        .route-extra-content {
            width: 100%;
            min-height: 1px;

            margin-top: 12px;
        }

        /* =========================================================
           ZOOM
        ========================================================= */

        .leaflet-bottom.leaflet-left {
            left: 20px;
            bottom: 20px;
        }

        .leaflet-control-zoom {
            margin: 0 !important;

            border: 1px solid rgba(255,255,255,0.22) !important;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2) !important;
        }

        .leaflet-control-zoom a {
            width: 40px !important;
            height: 40px !important;

            display: flex !important;
            align-items: center;
            justify-content: center;

            background: rgba(5,5,5,0.95) !important;
            color: var(--white) !important;

            border: 0 !important;

            font-size: 22px !important;
            font-weight: 400 !important;
        }

        .leaflet-control-zoom a:hover {
            background: var(--blue) !important;
            color: white !important;
        }

        /* =========================================================
           MARKER
        ========================================================= */

        .moi-marker {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--blue);
            color: white;

            border: 2px solid white;

            font-size: 15px;
            font-weight: 900;

            box-shadow: 0 5px 16px rgba(0,0,0,0.3);

            transform: rotate(45deg);
        }

        .moi-marker span {
            transform: rotate(-45deg);
        }

        .electric-mode .moi-marker {
            background: var(--blue-bright);
            border-color: #b9efff;

            box-shadow:
                0 0 8px var(--blue-bright),
                0 0 18px rgba(0,168,255,0.85),
                0 0 32px rgba(0,168,255,0.5);
        }

        /* =========================================================
           LEAFLET POPUP
        ========================================================= */

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #080808;
            color: white;
        }

        .leaflet-popup-content-wrapper {
            border: 1px solid rgba(0,168,255,0.35);
            border-radius: 0;
        }

        .leaflet-popup-tip {
            border-right: 1px solid rgba(0,168,255,0.35);
            border-bottom: 1px solid rgba(0,168,255,0.35);
        }

        .leaflet-popup-close-button {
            color: #aaa !important;
        }

        .popup-name {
            margin-bottom: 5px;

            color: var(--blue-bright);

            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .popup-location {
            margin-bottom: 10px;

            color: #999;

            font-size: 0.65rem;
        }

        .popup-route {
            width: 100%;

            padding: 8px 10px;

            border: 1px solid var(--blue);
            background: var(--blue);
            color: white;

            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;

            cursor: pointer;
        }

        /* =========================================================
           ELECTRIC MAP
        ========================================================= */

        .map-wrapper.electric-mode .leaflet-tile-pane {
            filter:
                grayscale(1)
                brightness(0.52)
                contrast(1.45)
                sepia(0.12)
                hue-rotate(165deg)
                saturate(3.5);
        }

        .map-wrapper.electric-mode .leaflet-overlay-pane path {
            filter:
                drop-shadow(0 0 5px var(--blue-bright))
                drop-shadow(0 0 12px var(--blue-bright));
        }

        .map-wrapper.electric-mode .leaflet-marker-pane {
            filter: saturate(1.2);
        }

        /* =========================================================
           ROUTE LINE
        ========================================================= */

        .route-line {
            filter:
                drop-shadow(0 0 3px rgba(0,168,255,0.9))
                drop-shadow(0 0 8px rgba(0,168,255,0.65));
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 1100px) {

            .site-navigation {
                grid-template-columns: 1fr auto;

                height: 68px;

                padding: 0 18px;
            }

            .nav-links,
            .nav-right {
                display: none;
            }

            .mobile-menu-button {
                display: block;
            }

            .map-wrapper {
                top: 68px;
            }

            .mobile-navigation {
                position: fixed;
                top: 68px;
                left: 0;
                right: 0;

                z-index: 4900;

                display: none;

                padding: 15px 18px 20px;

                background: rgba(5,5,5,0.98);
                border-bottom: 1px solid var(--line);
            }

            .mobile-navigation.active {
                display: block;
            }

            .mobile-navigation a {
                display: block;

                padding: 13px 0;

                border-bottom: 1px solid rgba(255,255,255,0.08);

                color: var(--white);
                text-decoration: none;

                font-size: 0.7rem;
                font-weight: 900;
                letter-spacing: 0.12em;
            }

            .mobile-navigation a:last-child {
                border-bottom: 0;
            }
        }

        @media (max-width: 700px) {

            .map-title {
                display: none;
            }

            .electric-toggle {
                top: auto;
                right: 10px;
                bottom: 12px;

                transform: none;
            }

            .map-ui-left {
                top: 10px;
                left: 10px;

                width: calc(100vw - 20px);
            }

            .map-search-panel {
                padding: 13px;
            }

            .panel-heading {
                margin-bottom: 9px;
            }

            .search-group {
                margin-bottom: 9px;
            }

            .search-input {
                height: 41px;
            }

            .route-button,
            .location-button {
                height: 40px;
            }

            .route-result {
                padding: 14px 42px 14px 14px;
            }

            .leaflet-bottom.leaflet-left {
                left: 10px;
                bottom: 10px;
            }

            .leaflet-control-zoom a {
                width: 38px !important;
                height: 38px !important;
            }
        }

        @media (max-width: 450px) {

            .nav-logo {
                gap: 9px;

                font-size: 1rem;
            }

            .nav-logo-box {
                width: 38px;
                height: 38px;
                min-width: 38px;

                font-size: 21px;
            }

            .site-navigation {
                padding: 0 12px;
            }

            .route-path {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         NAVIGATION
    ========================================================== -->

    <header class="site-navigation">

        <a href="index.html" class="nav-logo" aria-label="Moi-cy Startseite">

            <span class="nav-logo-box">M</span>

            <span>Moi-cy</span>

        </a>

        <nav class="nav-links" aria-label="Hauptnavigation">
            <a href="bilder.html">BILDER</a>
            <a href="videos.html">VIDEOS</a>
            <a href="skateplaetze.html">SKATEPLÄTZE</a>
            <a href="kontakt.html">KONTAKT</a>
            <a href="shop.html">SHOP</a>
        </nav>

        <div class="nav-right">
            <button class="language active" type="button">DE</button>
            <button class="language" type="button">EN</button>
            <button class="language" type="button">FR</button>
        </div>

        <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            type="button"
            aria-label="Menü öffnen"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </header>

    <nav class="mobile-navigation" id="mobileNavigation">
        <a href="index.html">START</a>
        <a href="bilder.html">BILDER</a>
        <a href="videos.html">VIDEOS</a>
        <a href="skateplaetze.html">SKATEPLÄTZE</a>
        <a href="kontakt.html">KONTAKT</a>
        <a href="shop.html">SHOP</a>
    </nav>


    <!-- =========================================================
         MAP
    ========================================================== -->

    <main class="map-wrapper" id="mapWrapper">

        <div id="map"></div>

        <div class="map-title">
            SKATE <span>KARTE</span>
        </div>

        <button
            class="electric-toggle"
            id="electricToggle"
            type="button"
            aria-pressed="false"
        >
            <span class="electric-toggle-indicator"></span>
            ELECTRIC MODE
        </button>


        <!-- =====================================================
             LEFT UI
        ====================================================== -->

        <div class="map-ui-left">

            <section class="map-search-panel">

                <h1 class="panel-heading">
                    SUCHEN &amp; ROUTE PLANEN
                </h1>


                <!-- NORMALE SUCHE -->

                <div class="search-group">

                    <label
                        class="search-label"
                        for="searchInput"
                    >
                        Ort / Straße / Skatepark
                    </label>

                    <div class="input-row">

                        <input
                            id="searchInput"
                            class="search-input"
                            type="text"
                            autocomplete="off"
                            placeholder="z. B. Karlsruhe oder Kaiserallee"
                        >

                        <button
                            class="clear-input"
                            id="clearSearch"
                            type="button"
                            aria-label="Suche löschen"
                        >
                            ×
                        </button>

                        <button
                            class="search-submit"
                            id="searchButton"
                            type="button"
                            aria-label="Suchen"
                        >
                            →
                        </button>

                    </div>

                    <div
                        class="search-results"
                        id="searchResults"
                    ></div>

                </div>


                <!-- START -->

                <div class="search-group">

                    <label
                        class="search-label"
                        for="routeStart"
                    >
                        Von
                    </label>

                    <div class="input-row">

                        <input
                            id="routeStart"
                            class="search-input"
                            type="text"
                            autocomplete="off"
                            placeholder="Startort eingeben"
                        >

                        <button
                            class="clear-input"
                            id="clearRouteStart"
                            type="button"
                            aria-label="Start löschen"
                        >
                            ×
                        </button>

                    </div>

                </div>


                <!-- ZIEL -->

                <div class="search-group">

                    <label
                        class="search-label"
                        for="routeDestination"
                    >
                        Nach
                    </label>

                    <div class="input-row">

                        <input
                            id="routeDestination"
                            class="search-input"
                            type="text"
                            autocomplete="off"
                            placeholder="Zielort eingeben"
                        >

                        <button

        /* =========================================================

        function createMarkerIcon() {

        /* =========================================================
           SEARCH NORMALIZATION
        ========================================================== */

        function normalizeSearchText(value) {

            return String(value || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/ß/g, "ss")
                .replace(/[^a-z0-9]+/g, " ")
                .trim();

        }


        /* =========================================================
           LEVENSHTEIN
        ========================================================== */

        function levenshteinDistance(a, b) {

            const rows = a.length + 1;
            const cols = b.length + 1;

            const matrix = Array.from(
                { length: rows },
                () => new Array(cols).fill(0)
            );

            for (let i = 0; i < rows; i++) {
                matrix[i][0] = i;
            }

            for (let j = 0; j < cols; j++) {
                matrix[0][j] = j;
            }

            for (let i = 1; i < rows; i++) {

                for (let j = 1; j < cols; j++) {

                    const cost =
                        a[i - 1] === b[j - 1]
                            ? 0
                            : 1;

                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );

                }

            }

            return matrix[rows - 1][cols - 1];

        }


        /* =========================================================
           FUZZY SEARCH
        ========================================================== */

        function tokenSimilarity(queryToken, candidateToken) {

            if (!queryToken || !candidateToken) {
                return 0;
            }

            if (candidateToken === queryToken) {
                return 1;
            }

            if (candidateToken.includes(queryToken)) {
                return 0.9;
            }

            if (queryToken.includes(candidateToken)) {
                return 0.82;
            }

            const distance =
                levenshteinDistance(
                    queryToken,
                    candidateToken
                );

            const maxLength =
                Math.max(
                    queryToken.length,
                    candidateToken.length
                );

            if (!maxLength) {
                return 1;
            }

            return Math.max(
                0,
                1 - distance / maxLength
            );

        }


        function fuzzyScore(query, text) {

            const normalizedQuery =
                normalizeSearchText(query);

            const normalizedText =
                normalizeSearchText(text);

            if (!normalizedQuery || !normalizedText) {
                return 0;
            }

            if (normalizedText.includes(normalizedQuery)) {
                return 1;
            }

            const queryTokens =
                normalizedQuery.split(/\s+/);

            const textTokens =
                normalizedText.split(/\s+/);

            let total = 0;

            queryTokens.forEach((queryToken) => {

                let best = 0;

                textTokens.forEach((textToken) => {

                    best = Math.max(
                        best,
                        tokenSimilarity(
                            queryToken,
                            textToken
                        )
                    );

                });

                total += best;

            });

            return total / queryTokens.length;

        }


        /* =========================================================
           ESCAPE HELPERS
        ========================================================== */

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function escapeJs(value) {

            return String(value)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }


        /* =========================================================
           SEARCH RESULTS
        ========================================================== */

        const searchInput =
            document.getElementById("searchInput");

        const searchResults =
            document.getElementById("searchResults");


        function showParkSearchResults(query) {

            searchResults.innerHTML = "";

            const normalized =
                normalizeSearchText(query);

            if (!normalized) {
                return;
            }

            const scored =
                skateparks
                    .map((park) => {

                        const combined = [
                            park.name,
                            park.city,
                            park.country
                        ].join(" ");

                        return {
                            park,
                            score: fuzzyScore(
                                normalized,
                                combined
                            )
                        };

                    })
                    .filter((item) => item.score >= 0.45)
                    .sort(
                        (a, b) =>
                            b.score - a.score
                    )
                    .slice(0, 6);


            if (!scored.length) {
                return false;
            }


            scored.forEach(({ park }) => {

                const item =
                    document.createElement("button");

                item.type = "button";
                item.className = "result-item";

                item.innerHTML = `
                    <span class="result-main">
                        <span class="result-name">
                            ${escapeHtml(park.name)}
                        </span>

                        <span class="result-meta">
                            ${escapeHtml(park.city)},
                            ${escapeHtml(park.country)}
                        </span>
                    </span>

                    <span class="result-arrow">→</span>
                `;

                item.addEventListener(
                    "click",
                    () => {

                        map.setView(
                            [park.lat, park.lng],
                            15,
                            {
                                animate: true
                            }
                        );

                        const found =
                            parkMarkers.find(
                                (entry) =>
                                    entry.park.name === park.name
                            );

                        if (found) {
                            found.marker.openPopup();
                        }

                    }
                );

                searchResults.appendChild(item);

            });

            return true;

        }


        /* =========================================================
           NOMINATIM SEARCH
        ========================================================== */

        let temporarySearchMarker = null;


        async function searchPlace(query) {

            try {

                const url =
                    "https://nominatim.openstreetmap.org/search?" +
                    new URLSearchParams({
                        q: query,
                        format: "json",
                        limit: "5",
                        addressdetails: "1"
                    });


                const response =
                    await fetch(url, {
                        headers: {
                            "Accept": "application/json"
                        }
                    });


                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                const results =
                    await response.json();


                if (!results.length) {

                    searchResults.innerHTML = `
                        <div class="search-message">
                            Kein Ort gefunden. Versuch eine andere Schreibweise.
                        </div>
                    `;

                    return;

                }


                searchResults.innerHTML = "";


                results.forEach((result) => {

                    const item =
                        document.createElement("button");

                    item.type = "button";
                    item.className = "result-item";

                    item.innerHTML = `
                        <span class="result-main">
                            <span class="result-name">
                                ${escapeHtml(
                                    result.name ||
                                    result.display_name.split(",")[0]
                                )}
                            </span>

                            <span class="result-meta">
                                ${escapeHtml(
                                    result.display_name
                                )}
                            </span>
                        </span>

                        <span class="result-arrow">→</span>
                    `;


                    item.addEventListener(
                        "click",
                        () => {

                            const lat =
                                Number(result.lat);

                            const lng =
                                Number(result.lon);


                            map.setView(
                                [lat, lng],
                                15,
                                {
                                    animate: true
                                }
                            );


                            if (temporarySearchMarker) {
                                map.removeLayer(
                                    temporarySearchMarker
                                );
                            }


                            temporarySearchMarker =
                                L.marker(
                                    [lat, lng],
                                    {
                                        icon:
                                            createMarkerIcon()
                                    }
                                )
                                .addTo(map)
                                .bindPopup(`
                                    <div class="popup-name">
                                        ${escapeHtml(
                                            result.name ||
                                            "Suchergebnis"
                                        )}
                                    </div>

                                    <div class="popup-location">
                                        ${escapeHtml(
                                            result.display_name
                                        )}
                                    </div>
                                `)
                                .openPopup();

                        }
                    );


                    searchResults.appendChild(item);

                });

            } catch (error) {

                console.error(
                    "Moi-cy Suche:",
                    error
                );

                searchResults.innerHTML = `
                    <div class="search-message">
                        Die Suche konnte gerade nicht geladen werden.
                    </div>
                `;

            }

        }


        /* =========================================================
           SEARCH
        ========================================================== */

        async function performSearch() {

            const query =
                searchInput.value.trim();

            searchResults.innerHTML = "";

            if (!query) {
                return;
            }


            const parkFound =
                showParkSearchResults(query);


            if (parkFound) {
                return;
            }


            searchResults.innerHTML = `
                <div class="search-message">

                </div>

        }


        document
            .getElementById("searchButton")

                "click",

        searchInput.addEventListener(

        /* =========================================================

        ========================================================== */

            .getElementById("clearSearch")

        /* =========================================================
           ROUTE ELEMENTS
        ========================================================== */

        const routeStart =
            document.getElementById("routeStart");

        const routeDestination =
            document.getElementById("routeDestination");

        const routeResultArea =

        let routeLayer = null;
        let routeStartMarker = null;
        let routeDestinationMarker = null;


        /* =========================================================
           CLEAR ROUTE
        ========================================================== */

        function clearRoute() {

            if (routeLayer) {

                map.removeLayer(routeLayer);
                routeLayer = null;

            }


            if (routeStartMarker) {

                map.removeLayer(routeStartMarker);
                routeStartMarker = null;

            }


            if (routeDestinationMarker) {

                map.removeLayer(
                    routeDestinationMarker
                );

                routeDestinationMarker = null;

        ========================================================== */

                    routeStart.focus();

        /* =========================================================
           GEOCODING
        ========================================================== */

        async function geocodePlace(query) {

            const url =
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({
                    q: query,
                    format: "json",
                    limit: "1",
                    addressdetails: "1"
                });


            const response =
                await fetch(url, {
                    headers: {
                        "Accept": "application/json"
                    }
                });


            if (!response.ok) {
                throw new Error(
                    `Geocoding HTTP ${response.status}`
                );
            }


            const results =
                await response.json();


            if (!results.length) {
                throw new Error(
                    `Ort nicht gefunden: ${query}`
                );
            }


            return {
                lat: Number(results[0].lat),
                lng: Number(results[0].lon),
                name:
                    results[0].display_name
            };

        }


        /* =========================================================
           ROUTE INFO
        ========================================================== */

        function formatDistance(meters) {

            if (meters < 1000) {

                return `${Math.round(meters)} m`;

            }

            return `${(
                meters / 1000
            ).toFixed(1)} km`;

        }


        function formatDuration(seconds) {

            const minutes =
                Math.round(seconds / 60);


            if (minutes < 60) {
                return `${minutes} min`;
            }


            const hours =
                Math.floor(minutes / 60);

            const remaining =
                minutes % 60;


            if (!remaining) {
                return `${hours} h`;
            }


            return `${hours} h ${remaining} min`;

        }


        function showRouteInfo(
            startName,
            destinationName,
            distance,
            duration
        ) {

            routeResultArea.innerHTML = `
                <div class="route-result">

                    <button
                        class="route-close"
                        id="routeResultClose"
                        type="button"
                        aria-label="Route löschen"
                    >
                        ×
                    </button>

                    <div class="route-result-title">
                        ROUTE GEPLANT
                    </div>

                    <div class="route-path">
                        <span>
                            ${escapeHtml(startName)}
                        </span>

                        →
                        
                        <span>
                            ${escapeHtml(destinationName)}
                        </span>
                    </div>

                    <div class="route-stats">

                        <div class="route-stat">

                            <span class="route-stat-label">
                                Entfernung
                            </span>

                            <span class="route-stat-value">
                                ${formatDistance(distance)}
                            </span>

                        </div>

                        <div class="route-stat">

                            <span class="route-stat-label">
                                Fahrzeit
                            </span>

                            <span class="route-stat-value">
                                ${formatDuration(duration)}
                            </span>

                        </div>

                    </div>

                </div>
            `;


            document
                .getElementById("routeResultClose")
                .addEventListener(
                    "click",
                    () => {

                        clearRoute();

                        routeStart.value = "";
                        routeDestination.value = "";

                    }
                );

        }


        /* =========================================================
           PLAN ROUTE
        ========================================================== */

        async function planRoute() {

            const startQuery =
                routeStart.value.trim();

            const destinationQuery =
                routeDestination.value.trim();


            if (!startQuery || !destinationQuery) {

                routeResultArea.innerHTML = `
                    <div class="search-message">
                        Bitte Start und Ziel eingeben.
                    </div>
                `;

                return;

            }


            clearRoute();


            routeResultArea.innerHTML = `
                <div class="search-message">
                    Route wird berechnet ...
                </div>
            `;


            try {

                const [
                    start,
                    destination
                ] = await Promise.all([
                    geocodePlace(startQuery),
                    geocodePlace(destinationQuery)
                ]);


                const osrmUrl =
                    "https://router.project-osrm.org/route/v1/driving/" +
                    `${start.lng},${start.lat};` +
                    `${destination.lng},${destination.lat}` +
                    "?" +
                    new URLSearchParams({
                        overview: "full",
                        geometries: "geojson"
                    });


                const response =
                    await fetch(osrmUrl);


                if (!response.ok) {
                    throw new Error(
                        `Routing HTTP ${response.status}`
                    );
                }


                const data =
                    await response.json();


                if (
                    data.code !== "Ok" ||
                    !data.routes ||
                    !data.routes.length
                ) {
                    throw new Error(
                        "Keine Route gefunden."
                    );
                }


                const route =
                    data.routes[0];


                routeLayer =
                    L.geoJSON(
                        route.geometry,
                        {
                            style: {
                                className: "route-line",
                                color: "#00a8ff",
                                weight: 6,
                                opacity: 0.92
                            }
                        }
                    ).addTo(map);


                routeStartMarker =
                    L.circleMarker(
                        [start.lat, start.lng],
                        {
                            radius: 7,
                            color: "#ffffff",
                            weight: 2,
                            fillColor: "#168cff",
                            fillOpacity: 1
                        }
                    ).addTo(map);


                routeDestinationMarker =
                    L.circleMarker(
                        [
                            destination.lat,
                            destination.lng
                        ],
                        {
                            radius: 7,
                            color: "#ffffff",
                            weight: 2,
                            fillColor: "#00a8ff",
                            fillOpacity: 1
                        }
                    ).addTo(map);


                const bounds =
                    routeLayer.getBounds();


                if (bounds.isValid()) {

                    map.fitBounds(
                        bounds,
                        {
                            paddingTopLeft: [420, 80],
                            paddingBottomRight: [80, 80],
                            maxZoom: 14
                        }
                    );

                }


                showRouteInfo(
                    startQuery,
                    destinationQuery,
                    route.distance,
                    route.duration
                );


            } catch (error) {

                console.error(
                    "Moi-cy Route:",
                    error
                );


                routeResultArea.innerHTML = `
                    <div class="search-message">
                        Die Route konnte nicht berechnet werden.
                        Bitte überprüfe Start und Ziel.
                    </div>
                `;

            }

        }


        document
            .getElementById("routeButton")
            .addEventListener(
                "click",
                planRoute
            );


        /* =========================================================
           ENTER IN ROUTE FIELDS
        ========================================================== */

        [
            routeStart,
            routeDestination
        ].forEach((input) => {

            input.addEventListener(
                "keydown",
                (event) => {

                    if (event.key === "Enter") {

                        event.preventDefault();
                        planRoute();

                    }

                }
            );

        });


        /* =========================================================
           CURRENT LOCATION
        ========================================================== */

        document
            .getElementById("locationButton")
            .addEventListener(
                "click",
                () => {

                    if (!navigator.geolocation) {

                        routeResultArea.innerHTML = `
                            <div class="search-message">
                                Dein Browser unterstützt keine Standortbestimmung.
                            </div>
                        `;

                        return;

                    }


                    routeResultArea.innerHTML = `
                        <div class="search-message">
                            Standort wird ermittelt ...
                        </div>
                    `;


                    navigator.geolocation.getCurrentPosition(
                        (position) => {

                            const lat =
                                position.coords.latitude;

                            const lng =
                                position.coords.longitude;


                            routeStart.value =
                                "Mein Standort";


                            if (
                                !window.currentLocationMarker
                            ) {

                                window.currentLocationMarker =
                                    L.circleMarker(
                                        [lat, lng],
                                        {
                                            radius: 8,
                                            color: "#ffffff",
                                            weight: 2,
                                            fillColor: "#168cff",
                                            fillOpacity: 1
                                        }
                                    ).addTo(map);

                            } else {

                                window.currentLocationMarker
                                    .setLatLng(
                                        [lat, lng]
                                    );

                            }


                            map.setView(
                                [lat, lng],
                                14,
                                {
                                    animate: true
                                }
                            );


                            routeStart.dataset.lat =
                                String(lat);

                            routeStart.dataset.lng =
                                String(lng);


                            routeResultArea.innerHTML = "";

                        },
                        () => {

                            routeResultArea.innerHTML = `
                                <div class="search-message">
                                    Standort konnte nicht ermittelt werden.
                                    Du kannst einen Startort manuell eingeben.
                                </div>
                            `;

                        },
                        {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 300000
                        }
                    );

                }
            );


        /* =========================================================
           ROUTE FROM CURRENT LOCATION
        ========================================================== */

        async function planRouteWithCurrentLocation() {

            const destinationQuery =
                routeDestination.value.trim();


            if (!destinationQuery) {

                routeResultArea.innerHTML = `
                    <div class="search-message">
                        Bitte zuerst ein Ziel eingeben.
                    </div>
                `;

                return;

            }


            if (!navigator.geolocation) {

                routeResultArea.innerHTML = `
                    <div class="search-message">
                        Standortbestimmung wird nicht unterstützt.
                    </div>
                `;

                return;

            }


            clearRoute();


            routeResultArea.innerHTML = `
                <div class="search-message">
                    Standort und Route werden ermittelt ...
                </div>
            `;


            navigator.geolocation.getCurrentPosition(
                async (position) => {

                    try {

                        const start = {
                            lat:
                                position.coords.latitude,
                            lng:
                                position.coords.longitude,
                            name:
                                "Mein Standort"
                        };


                        const destination =
                            await geocodePlace(
                                destinationQuery
                            );


                        const osrmUrl =
                            "https://router.project-osrm.org/route/v1/driving/" +
                            `${start.lng},${start.lat};` +
                            `${destination.lng},${destination.lat}` +
                            "?" +
                            new URLSearchParams({
                                overview: "full",
                                geometries: "geojson"
                            });


                        const response =
                            await fetch(osrmUrl);


                        if (!response.ok) {
                            throw new Error(
                                `Routing HTTP ${response.status}`
                            );
                        }


                        const data =
                            await response.json();


                        if (
                            data.code !== "Ok" ||
                            !data.routes ||
                            !data.routes.length
                        ) {
                            throw new Error(
                                "Keine Route gefunden."
                            );
                        }


                        const route =
                            data.routes[0];


                        routeLayer =
                            L.geoJSON(
                                route.geometry,
                                {
                                    style: {
                                        className:
                                            "route-line",
                                        color: "#00a8ff",
                                        weight: 6,
                                        opacity: 0.92
                                    }
                                }
                            ).addTo(map);


                        routeStartMarker =
                            L.circleMarker(
                                [
                                    start.lat,
                                    start.lng
                                ],
                                {
                                    radius: 7,
                                    color: "#ffffff",
                                    weight: 2,
                                    fillColor: "#168cff",
                                    fillOpacity: 1
                                }
                            ).addTo(map);


                        routeDestinationMarker =
                            L.circleMarker(
                                [
                                    destination.lat,
                                    destination.lng
                                ],
                                {
                                    radius: 7,
                                    color: "#ffffff",
                                    weight: 2,
                                    fillColor: "#00a8ff",
                                    fillOpacity: 1
                                }
                            ).addTo(map);


                        const bounds =
                            routeLayer.getBounds();


                        if (bounds.isValid()) {

                            map.fitBounds(
                                bounds,
                                {
                                    paddingTopLeft:
                                        [420, 80],
                                    paddingBottomRight:
                                        [80, 80],
                                    maxZoom: 14
                                }
                            );

                        }


                        routeStart.value =
                            "Mein Standort";


                        routeStart.dataset.lat =
                            String(start.lat);

                        routeStart.dataset.lng =
                            String(start.lng);


                        showRouteInfo(
                            "Mein Standort",
                            destinationQuery,
                            route.distance,
                            route.duration
                        );


                    } catch (error) {

                        console.error(
                            "Moi-cy Standort-Route:",
                            error
                        );


                        routeResultArea.innerHTML = `
                            <div class="search-message">
                                Die Route konnte nicht berechnet werden.
                            </div>
                        `;

                    }

                },
                () => {

                    routeResultArea.innerHTML = `
                        <div class="search-message">
                            Dein Standort konnte nicht ermittelt werden.
                        </div>
                    `;

                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 300000
                }
            );

        }


        /* =========================================================
           ROUTE TO SKATEPARK
        ========================================================== */

        window.routeToPark = function(name) {

            const park =
                skateparks.find(
                    (item) =>
                        item.name === name
                );


            if (!park) {
                return;
            }


            routeStart.value =
                "Mein Standort";

            routeDestination.value =
                park.name;


            routeStart.dataset.lat = "";
            routeStart.dataset.lng = "";


            planRouteWithCurrentLocation();

        };


        /* =========================================================
           ELECTRIC MODE
        ========================================================== */

        const mapWrapper =
            document.getElementById("mapWrapper");

        const electricToggle =
            document.getElementById("electricToggle");


        electricToggle.addEventListener(
            "click",
            () => {

                const active =
                    mapWrapper.classList.toggle(
                        "electric-mode"
                    );


                electricToggle.classList.toggle(
                    "active",
                    active
                );


                electricToggle.setAttribute(
                    "aria-pressed",
                    String(active)
                );

            }
        );


        /* =========================================================
           MOBILE NAVIGATION
        ========================================================== */

        const mobileMenuButton =
            document.getElementById(
                "mobileMenuButton"
            );

        const mobileNavigation =
            document.getElementById(
                "mobileNavigation"
            );


        mobileMenuButton.addEventListener(
            "click",
            () => {

                const active =
                    mobileNavigation.classList.toggle(
                        "active"
                    );


                mobileMenuButton.setAttribute(
                    "aria-expanded",
                    String(active)
                );

            }
        );


        mobileNavigation
            .querySelectorAll("a")
            .forEach((link) => {

                link.addEventListener(
                    "click",
                    () => {

                        mobileNavigation.classList.remove(
                            "active"
                        );

                        mobileMenuButton.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }
                );

            });


        /* =========================================================
           ESC
        ========================================================== */

        document.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Escape") {

                    clearRoute();

                    if (temporarySearchMarker) {

                        map.removeLayer(
                            temporarySearchMarker
                        );

                        temporarySearchMarker = null;

                    }

                }

            }
        );


        /* =========================================================
           MAP RESIZE
        ========================================================== */

        window.addEventListener(
            "resize",
            () => {

                map.invalidateSize();

            }
        );


        window.addEventListener(
            "load",
            () => {

                setTimeout(
                    () => {
                        map.invalidateSize();
                    },
                    300
                );

            }
        );

    </script>

</body>
</html>
