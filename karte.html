<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moi-cy – Skate Karte</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>
        :root {
            --black: #050505;
            --dark: #0b0b0b;
            --dark-2: #111111;
            --dark-3: #181818;
            --white: #f5f5f5;
            --muted: #858585;
            --line: rgba(255,255,255,0.12);
            --blue: #168cff;
            --blue-bright: #00a8ff;
            --blue-dark: #0864bd;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--black);
            color: var(--white);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */

        .site-navigation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 76px;

            z-index: 5000;

            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;

            padding: 0 28px;

            background: rgba(5,5,5,0.96);
            backdrop-filter: blur(18px);

            border-bottom: 1px solid var(--line);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;

            color: white;
            text-decoration: none;

            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.05em;
        }

        .nav-logo-box {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--blue);
            color: white;

            font-size: 24px;
            font-weight: 900;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;

            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 0.13em;

            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--blue-bright);
        }

        .nav-right {
            justify-self: end;

            display: flex;
            gap: 4px;
        }

        .language {
            border: 0;
            background: transparent;
            color: #666;

            padding: 5px;

            font-size: 0.62rem;
            font-weight: 900;

            cursor: pointer;
        }

        .language.active,
        .language:hover {
            color: white;
        }

        .mobile-menu-button {
            display: none;

            width: 42px;
            height: 42px;

            border: 1px solid var(--line);
            background: transparent;
            color: white;

            cursor: pointer;
        }

        .mobile-menu-button span {
            display: block;
            width: 19px;
            height: 2px;
            margin: 4px auto;
            background: white;
        }

        .mobile-navigation {
            display: none;
        }

        /* =====================================================
           MAP
        ===================================================== */

        .map-wrapper {
            position: fixed;

            top: 76px;
            left: 0;
            right: 0;
            bottom: 0;

            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .leaflet-container {
            background: #d5d5d5;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =====================================================
           MODERN MAP FILTER
        ===================================================== */

        .map-wrapper .leaflet-tile-pane {
            filter:
                saturate(0.72)
                contrast(1.04)
                brightness(1.03);
        }

        .map-wrapper.electric-mode .leaflet-tile-pane {
            filter:
                grayscale(1)
                brightness(0.45)
                contrast(1.5)
                sepia(0.1)
                hue-rotate(165deg)
                saturate(3.5);
        }

        /* =====================================================
           TOP TITLE
        ===================================================== */

        .map-title {
            position: absolute;
            top: 20px;
            right: 20px;

            z-index: 1500;

            padding: 12px 16px;

            background: rgba(5,5,5,0.9);
            backdrop-filter: blur(12px);

            border: 1px solid var(--line);

            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.12em;
        }

        .map-title span {
            color: var(--blue-bright);
        }

        /* =====================================================
           LEFT PANEL
        ===================================================== */

        .map-ui-left {
            position: absolute;

            top: 20px;
            left: 20px;

            width: 370px;

            z-index: 3000;
        }

        .search-panel {
            padding: 18px;

            background: rgba(5,5,5,0.94);
            backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.14);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.32);
        }

        .panel-kicker {
            margin-bottom: 5px;

            color: var(--blue-bright);

            font-size: 0.55rem;
            font-weight: 900;
            letter-spacing: 0.18em;
        }

        .panel-heading {
            margin: 0 0 17px;

            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 0.09em;
        }

        .search-group {
            margin-bottom: 12px;
        }

        .search-label {
            display: block;

            margin-bottom: 6px;

            color: #777;

            font-size: 0.54rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;

            border: 1px solid rgba(255,255,255,0.13);

            background: var(--dark-2);

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .input-row:focus-within {
            border-color: var(--blue-bright);
            background: var(--dark-3);
        }

        .search-input {
            flex: 1;

            min-width: 0;
            height: 42px;

            padding: 0 11px;

            border: 0;
            outline: 0;

            background: transparent;
            color: white;

            font-size: 0.72rem;
        }

        .search-input::placeholder {
            color: #666;
        }

        .clear-input {
            width: 36px;

            border: 0;
            border-left: 1px solid rgba(255,255,255,0.08);

            background: transparent;
            color: #777;

            cursor: pointer;
        }

        .clear-input:hover {
            color: white;
        }

        .search-submit {
            width: 46px;

            border: 0;

            background: var(--blue);
            color: white;

            font-weight: 900;

            cursor: pointer;
        }

        .search-submit:hover {
            background: var(--blue-dark);
        }

        /* =====================================================
           ACTION BUTTONS
        ===================================================== */

        .main-actions {
            display: grid;
            grid-template-columns: 1fr 44px;
            gap: 8px;

            margin-top: 8px;
        }

        .route-button,
        .location-button,
        .all-parks-button {
            height: 42px;

            border: 1px solid var(--blue);

            background: var(--blue);
            color: white;

            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.08em;

            cursor: pointer;
        }

        .route-button:hover,
        .all-parks-button:hover {
            background: var(--blue-dark);
        }

        .location-button {
            background: transparent;
            color: var(--blue-bright);
        }

        .location-button:hover {
            background: rgba(0,168,255,0.12);
        }

        .all-parks-button {
            width: 100%;
            margin-top: 8px;
        }

        /* =====================================================
           RESULTS
        ===================================================== */

        .search-results {
            margin-top: 9px;
        }

        .search-results:empty {
            display: none;
        }

        .result-item {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 5px;
            padding: 10px;

            border: 1px solid rgba(255,255,255,0.1);

            background: #151515;
            color: white;

            text-align: left;

            cursor: pointer;
        }

        .result-item:hover {
            border-color: var(--blue-bright);
        }

        .result-name {
            display: block;

            margin-bottom: 3px;

            font-size: 0.67rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .result-meta {
            display: block;

            color: #777;

            font-size: 0.54rem;
            line-height: 1.4;
        }

        .result-distance {
            flex-shrink: 0;

            color: var(--blue-bright);

            font-size: 0.55rem;
            font-weight: 900;
        }

        .search-message {
            padding: 10px;

            border: 1px solid rgba(255,255,255,0.1);

            background: #151515;
            color: #888;

            font-size: 0.57rem;
            line-height: 1.45;
        }

        /* =====================================================
           ROUTE RESULT
        ===================================================== */

        .route-result {
            position: relative;

            margin-top: 10px;
            padding: 15px;

            background: rgba(5,5,5,0.96);

            border: 1px solid var(--blue-bright);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.3);
        }

        .route-title {
            color: var(--blue-bright);

            font-size: 0.56rem;
            font-weight: 900;
            letter-spacing: 0.15em;
        }

        .route-path {
            margin-top: 8px;

            color: white;

            font-size: 0.68rem;
            font-weight: 800;
            line-height: 1.5;
        }

        .route-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;

            margin-top: 12px;
            padding-top: 10px;

            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .route-stat small {
            display: block;

            color: #777;

            font-size: 0.49rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .route-stat strong {
            display: block;

            margin-top: 3px;

            color: white;

            font-size: 0.85rem;
        }

        .route-close {
            position: absolute;
            top: 7px;
            right: 7px;

            border: 0;
            background: transparent;
            color: #777;

            font-size: 1rem;

            cursor: pointer;
        }

        .route-close:hover {
            color: white;
        }

        /* =====================================================
           ELECTRIC
        ===================================================== */

        .electric-toggle {
            position: absolute;

            right: 20px;
            bottom: 20px;

            z-index: 3000;

            display: flex;
            align-items: center;
            gap: 8px;

            min-height: 38px;
            padding: 0 12px;

            border: 1px solid rgba(0,168,255,0.45);

            background: rgba(5,5,5,0.9);
            color: var(--blue-bright);

            font-size: 0.55rem;
            font-weight: 900;
            letter-spacing: 0.1em;

            cursor: pointer;
        }

        .electric-indicator {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #555;
        }

        .electric-toggle.active {
            border-color: var(--blue-bright);
        }

        .electric-toggle.active .electric-indicator {
            background: var(--blue-bright);

            box-shadow:
                0 0 8px var(--blue-bright),
                0 0 16px var(--blue-bright);
        }

        /* =====================================================
           MARKER
        ===================================================== */

        .moi-marker {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--blue);
            color: white;

            border: 2px solid white;

            transform: rotate(45deg);

            box-shadow:
                0 4px 15px rgba(0,0,0,0.35);
        }

        .moi-marker span {
            transform: rotate(-45deg);

            font-size: 13px;
            font-weight: 900;
        }

        .electric-mode .moi-marker {
            background: var(--blue-bright);

            box-shadow:
                0 0 8px var(--blue-bright),
                0 0 20px var(--blue-bright);
        }

        /* =====================================================
           POPUP
        ===================================================== */

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #080808;
            color: white;
        }

        .leaflet-popup-content-wrapper {
            border: 1px solid rgba(0,168,255,0.4);
            border-radius: 0;
        }

        .popup-name {
            margin-bottom: 5px;

            color: var(--blue-bright);

            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .popup-location {
            margin-bottom: 9px;

            color: #999;

            font-size: 0.59rem;
        }

        .popup-distance {
            margin-bottom: 10px;

            color: #ddd;

            font-size: 0.58rem;
        }

        .popup-route {
            width: 100%;

            padding: 8px;

            border: 0;

            background: var(--blue);
            color: white;

            font-size: 0.55rem;
            font-weight: 900;

            cursor: pointer;
        }

        .popup-route:hover {
            background: var(--blue-dark);
        }

        /* =====================================================
           ROUTE LINE
        ===================================================== */

        .route-line {
            filter:
                drop-shadow(0 0 3px rgba(0,168,255,0.9))
                drop-shadow(0 0 8px rgba(0,168,255,0.55));
        }

        /* =====================================================
           ZOOM
        ===================================================== */

        .map-zoom-controls {
            position: absolute;

            left: 20px;
            bottom: 20px;

            z-index: 3000;

            display: flex;
            flex-direction: column;
        }

        .map-zoom-button {
            width: 40px;
            height: 40px;

            border: 1px solid rgba(255,255,255,0.15);

            background: rgba(5,5,5,0.92);
            color: white;

            font-size: 22px;

            cursor: pointer;
        }

        .map-zoom-button + .map-zoom-button {
            border-top: 0;
        }

        .map-zoom-button:hover {
            background: var(--blue);
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 1100px) {

            .site-navigation {
                height: 68px;

                grid-template-columns: 1fr auto;

                padding: 0 18px;
            }

            .nav-links,
            .nav-right {
                display: none;
            }

            .mobile-menu-button {
                display: block;
            }

            .map-wrapper {
                top: 68px;
            }

            .mobile-navigation {
                position: fixed;

                top: 68px;
                left: 0;
                right: 0;

                z-index: 4900;

                display: none;

                padding: 12px 18px 18px;

                background: rgba(5,5,5,0.98);

                border-bottom: 1px solid var(--line);
            }

            .mobile-navigation.active {
                display: block;
            }

            .mobile-navigation a {
                display: block;

                padding: 13px 0;

                border-bottom: 1px solid rgba(255,255,255,0.08);

                color: white;
                text-decoration: none;

                font-size: 0.68rem;
                font-weight: 900;
                letter-spacing: 0.12em;
            }
        }

        @media (max-width: 700px) {

            .map-ui-left {
                top: 10px;
                left: 10px;

                width: calc(100vw - 20px);
            }

            .map-title {
                display: none;
            }

            .search-panel {
                padding: 13px;
            }

            .electric-toggle {
                right: 10px;
                bottom: 10px;
            }

            .map-zoom-controls {
                left: 10px;
                bottom: 10px;
            }
        }
    </style>
</head>

<body>

<header class="site-navigation">

    <a
        href="index.html"
        class="nav-logo"
        aria-label="Moi-cy Startseite"
    >
        <span class="nav-logo-box">M</span>
        <span>Moi-cy</span>
    </a>

    <nav class="nav-links" aria-label="Hauptnavigation">
        <a href="bilder.html">BILDER</a>
        <a href="videos.html">VIDEOS</a>
        <a href="skateplaetze.html">SKATEPLÄTZE</a>
        <a href="kontakt.html">KONTAKT</a>
        <a href="shop.html">SHOP</a>
    </nav>

    <div class="nav-right">
        <button class="language active" type="button">DE</button>
        <button class="language" type="button">EN</button>
        <button class="language" type="button">FR</button>
    </div>

    <button
        class="mobile-menu-button"
        id="mobileMenuButton"
        type="button"
        aria-expanded="false"
        aria-label="Menü öffnen"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

</header>


<nav
    class="mobile-navigation"
    id="mobileNavigation"
    aria-label="Mobile Navigation"
>
    <a href="index.html">START</a>
    <a href="bilder.html">BILDER</a>
    <a href="videos.html">VIDEOS</a>
    <a href="skateplaetze.html">SKATEPLÄTZE</a>
    <a href="kontakt.html">KONTAKT</a>
    <a href="shop.html">SHOP</a>
</nav>


<main class="map-wrapper" id="mapWrapper">

    <div id="map"></div>

    <div class="map-title">
        SKATE <span>KARTE</span>
    </div>


    <div class="map-ui-left">

        <section class="search-panel">

            <div class="panel-kicker">
                MOI-CY MAP
            </div>

            <h1 class="panel-heading">
                FINDE DEINEN SPOT
            </h1>


            <!-- STADT / ORT -->

            <div class="search-group">

                <label
                    class="search-label"
                    for="searchInput"
                >
                    Stadt / Ort / Straße
                </label>

                <div class="input-row">

                    <input
                        id="searchInput"
                        class="search-input"
                        type="text"
                        autocomplete="off"
                        placeholder="z. B. Karlsruhe"
                    >

                    <button
                        id="clearSearch"
                        class="clear-input"
                        type="button"
                    >
                        ×
                    </button>

                    <button
                        id="searchButton"
                        class="search-submit"
                        type="button"
                    >
                        →
                    </button>

                </div>

                <div
                    id="searchResults"
                    class="search-results"
                ></div>

            </div>


            <!-- START -->

            <div class="search-group">

                <label
                    class="search-label"
                    for="routeStart"
                >
                    Von
                </label>

                <div class="input-row">

                    <input
                        id="routeStart"
                        class="search-input"
                        type="text"
                        autocomplete="off"
                        placeholder="Startort"
                    >

                    <button
                        id="clearRouteStart"
                        class="clear-input"
                        type="button"
                    >
                        ×
                    </button>

                </div>

            </div>


            <!-- ZIEL -->

            <div class="search-group">

                <label
                    class="search-label"
                    for="routeDestination"
                >
                    Nach
                </label>

                <div class="input-row">

                    <input
                        id="routeDestination"
                        class="search-input"
                        type="text"
                        autocomplete="off"
                        placeholder="Zielort"
                    >

                    <button
                        id="clearRouteDestination"
                        class="clear-input"
                        type="button"
                    >
                        ×
                    </button>

                </div>

            </div>


            <div class="main-actions">

                <button
                    id="routeButton"
                    class="route-button"
                    type="button"
                >
                    ROUTE + SKATEPARKS
                </button>

                <button
                    id="locationButton"
                    class="location-button"
                    type="button"
                    title="Mein Standort"
                    aria-label="Mein Standort"
                >
                    ◎
                </button>

            </div>


            <button
                id="allParksButton"
                class="all-parks-button"
                type="button"
            >
                ALLE SKATEPARKS ANZEIGEN
            </button>

        </section>


        <section
            id="routeResultArea"
            aria-live="polite"
        ></section>

    </div>


    <button
        id="electricToggle"
        class="electric-toggle"
        type="button"
        aria-pressed="false"
    >
        <span class="electric-indicator"></span>
        ELECTRIC MODE
    </button>


    <div class="map-zoom-controls">

        <button
            id="zoomIn"
            class="map-zoom-button"
            type="button"
            aria-label="Hineinzoomen"
        >
            +
        </button>

        <button
            id="zoomOut"
            class="map-zoom-button"
            type="button"
            aria-label="Herauszoomen"
        >
            −
        </button>

    </div>

</main>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
></script>


<script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
        "https://lkxvhrcvoizozmddmefh.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_mrwTwHx3Xzc-7hcdvRxPyw_1JomCQvA";


    /* =====================================================
       FESTE SKATEPARKS
       Diese dienen als Grundbestand.
    ===================================================== */

    const skateparks = [

        {
            name: "Valence",
            city: "Valence",
            country: "Frankreich",
            lat: 44.9334,
            lng: 4.8924
        },

        {
            name: "Karlsruhe",
            city: "Karlsruhe",
            country: "Deutschland",
            lat: 49.0069,
            lng: 8.4037
        },

        {
            name: "Heidelberg",
            city: "Heidelberg",
            country: "Deutschland",
            lat: 49.3988,
            lng: 8.6724
        },

        {
            name: "Heidelberg Bowl",
            city: "Heidelberg",
            country: "Deutschland",
            lat: 49.4077,
            lng: 8.6908
        },

        {
            name: "Perpignan",
            city: "Perpignan",
            country: "Frankreich",
            lat: 42.6887,
            lng: 2.8948
        },

        {
            name: "München Hirschgarten",
            city: "München",
            country: "Deutschland",
            lat: 48.1445,
            lng: 11.4854
        }

    ];


    /* =====================================================
       MAP
    ===================================================== */

    const map =
        L.map("map", {
            zoomControl: false,
            preferCanvas: true
        });


    map.setView(
        [49.0069, 8.4037],
        6
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            minZoom: 2,
            maxZoom: 19,

            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
        }
    ).addTo(map);


    function refreshMapSize() {

        requestAnimationFrame(() => {

            map.invalidateSize({
                animate: false,
                pan: false
            });

        });

    }


    window.addEventListener(
        "load",
        () => {

            refreshMapSize();

            setTimeout(
                refreshMapSize,
                300
            );

        }
    );


    window.addEventListener(
        "resize",
        refreshMapSize
    );


    /* =====================================================
       MARKER ICON
    ===================================================== */

    function createMarkerIcon() {

        return L.divIcon({

            className: "",

            html: `

    /* =====================================================

    ===================================================== */

    async function loadSupabaseParks() {

        try {

            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/skateparks?status=eq.approved&select=id,name,city,country,address,description,latitude,longitude`,
                    {
                        headers: {
                            apikey:
                                SUPABASE_KEY,

                            Authorization:
                                `Bearer ${SUPABASE_KEY}`
                        }
                    }
                );


            if (!response.ok) {
                throw new Error(
                    `Supabase HTTP ${response.status}`
                );
            }


            const data =
                await response.json();


            data.forEach(
                (park) => {

                    const lat =
                        Number(
                            park.latitude
                        );

                    const lng =
                        Number(
                            park.longitude
                        );


                    if (
                        !Number.isFinite(lat) ||
                        !Number.isFinite(lng)
                    ) {
                        return;
                    }


                    const exists =
                        skateparks.some(
                            (existing) =>
                                normalize(
                                    existing.name
                                ) ===
                                normalize(
                                    park.name
                                ) &&
                                Math.abs(
                                    existing.lat - lat
                                ) < 0.0001 &&
                                Math.abs(
                                    existing.lng - lng
                                ) < 0.0001
                        );


                    if (!exists) {

                        skateparks.push({

                            id: park.id,

                            name:
                                park.name,

                            city:
                                park.city,

                            country:
                                park.country,

                            address:
                                park.address || "",

                            description:
                                park.description || "",

                            lat,
                            lng

                        });

                    }

                }
            );


        } catch (error) {

            console.warn(
                "Moi-cy: Supabase Skateparks konnten nicht geladen werden.",
                error
            );

        }

    }


    /* =====================================================
       NORMALIZE
    ===================================================== */

    function normalize(value) {

        return String(value || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
            .replace(
                /ß/g,
                "ss"
            )
            .trim();

    }


    /* =====================================================
       ESCAPE
    ===================================================== */

    function escapeHtml(value) {

        return String(value || "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       DISTANCE
       Haversine
    ===================================================== */

    function distanceKm(
        lat1,
        lng1,
        lat2,
        lng2
    ) {

        const earthRadius = 6371;

        const dLat =
            (
                lat2 - lat1
            ) *
            Math.PI /
            180;

        const dLng =
            (
                lng2 - lng1
            ) *
            Math.PI /
            180;


        const a =
            Math.sin(dLat / 2) ** 2 +
            Math.cos(
                lat1 * Math.PI / 180
            ) *
            Math.cos(
                lat2 * Math.PI / 180
            ) *
            Math.sin(dLng / 2) ** 2;


        return (
            earthRadius *
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            )
        );

    }


    function formatDistance(km) {

        if (km < 1) {
            return `${Math.round(km * 1000)} m`;
        }

        return `${km.toFixed(1)} km`;

    }

                new URLSearchParams({

                    q: query,

                    format: "json",

                    limit: "1",

                    addressdetails: "1"

                });


            const response =
                await fetch(
                    url,
                    {
                        headers: {
                            Accept:
                                "application/json"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Nominatim HTTP ${response.status}`
                );

            }


            const results =
                await response.json();


            if (!results.length) {

    async function geocodePlace(
        query
    ) {

        const url =
            "https://nominatim.openstreetmap.org/search?" +
            new URLSearchParams({

                q: query,

                format: "json",

                limit: "1"

            });


        const response =
            await fetch(
                url,
                {
                    headers: {
                        Accept:
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                `Geocoding HTTP ${response.status}`
            );

        }


        const results =
            await response.json();


        if (!results.length) {

            throw new Error(
                `Nicht gefunden: ${query}`
            );

        }


        return {

            lat:
                Number(
                    results[0].lat
                ),

            lng:
                Number(
                    results[0].lon
                ),

            name:
                results[0].display_name

        };

    }


    /* =====================================================
       DISTANCE TO ROUTE SEGMENT
    ===================================================== */

    function distancePointToSegmentKm(
        point,
        start,
        end
    ) {

        const latFactor = 111;

        const lngFactor =
            111 *
            Math.cos(
                point.lat *
                Math.PI /
                180
            );


        const px =
            point.lng *
            lngFactor;

        const py =
            point.lat *
            latFactor;


        const ax =
            start.lng *
            lngFactor;

        const ay =
            start.lat *
            latFactor;


        const bx =
            end.lng *
            lngFactor;

        const by =
            end.lat *
            latFactor;


        const dx =
            bx - ax;

        const dy =
            by - ay;


        if (
            dx === 0 &&
            dy === 0
        ) {

            return Math.sqrt(
                (px - ax) ** 2 +
                (py - ay) ** 2
            );

        }


        const t =
            Math.max(
                0,
                Math.min(
                    1,
                    (
                        (px - ax) * dx +
                        (py - ay) * dy
                    ) /
                    (dx * dx + dy * dy)
                )
            );


        const closestX =
            ax + t * dx;

        const closestY =
            ay + t * dy;


        return Math.sqrt(
            (px - closestX) ** 2 +
            (py - closestY) ** 2
        );

    }


    function distanceParkToRoute(
        park,
        coordinates
    ) {

        let closest =
            Infinity;


        for (
            let i = 0;
            i < coordinates.length - 1;
            i++
        ) {

            const start = {

                lat:
                    coordinates[i][1],

                lng:
                    coordinates[i][0]

            };


            const end = {

                lat:
                    coordinates[i + 1][1],

                lng:
                    coordinates[i + 1][0]

            };


            const distance =
                distancePointToSegmentKm(
                    park,
                    start,
                    end
                );


            closest =
                Math.min(
                    closest,
                    distance
                );

        }


        return closest;

    }

    /* =====================================================
       ROUTE REQUEST
    ===================================================== */

    async function requestRoute(
        start,
        destination
    ) {

        clearRoute();


        routeResultArea.innerHTML = `
            <div class="search-message">
                Route wird berechnet ...
            </div>
        `;


        try {

            const url =
                "https://router.project-osrm.org/route/v1/driving/" +
                `${start.lng},${start.lat};` +
                `${destination.lng},${destination.lat}` +
                "?" +
                new URLSearchParams({

                    overview:
                        "full",

                    geometries:
                        "geojson"

                });


            const response =
                await fetch(
                    url
                );


            if (!response.ok) {

                throw new Error(
                    `OSRM HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            if (
                data.code !== "Ok" ||
                !data.routes ||
                !data.routes.length
            ) {

                throw new Error(
                    "Keine Route gefunden."
                );

            }


            const route =
                data.routes[0];


            routeLayer =
                L.geoJSON(
                    route.geometry,
                    {
                        style: {

                            className:
                                "route-line",

                            color:
                                "#00a8ff",

                            weight:
                                6,

                            opacity:
                                0.9

                        }
                    }
                )
                .addTo(map);


            routeStartMarker =
                L.circleMarker(
                    [
                        start.lat,
                        start.lng
                    ],
                    {

                        radius:
                            7,

                        color:
                            "#fff",

                        weight:
                            2,

                        fillColor:
                            "#168cff",

                        fillOpacity:
                            1

                    }
                )
                .addTo(map);


            routeDestinationMarker =
                L.circleMarker(
                    [
                        destination.lat,
                        destination.lng
                    ],
                    {

                        radius:
                            7,

                        color:
                            "#fff",

                        weight:
                            2,

                        fillColor:
                            "#00a8ff",

                        fillOpacity:
                            1

                    }
                )
                .addTo(map);


            const bounds =
                routeLayer.getBounds();


            map.fitBounds(
                bounds,
                {

                    paddingTopLeft:
                        [420, 80],

                    paddingBottomRight:
                        [70, 80],

                    maxZoom:
                        12,

                    animate:
                        true

                }
            );


            const minutes =
                Math.round(
                    route.duration / 60
                );


            const hours =
                Math.floor(
                    minutes / 60
                );


            const remaining =
                minutes % 60;


            const durationText =
                hours > 0
                    ? `${hours} h ${remaining} min`
                    : `${minutes} min`;


            routeResultArea.innerHTML = `

                <div class="route-result">

                    <button
                        id="routeClose"
                        class="route-close"
                        type="button"
                    >
                        ×
                    </button>

                    <div class="route-title">
                        ROUTE + SKATEPARKS
                    </div>

                    <div class="route-path">
                        ${escapeHtml(start.name)}
                        →
                        ${escapeHtml(destination.name)}
                    </div>

                    <div class="route-stats">

                        <div class="route-stat">
                            <small>Entfernung</small>
                            <strong>
                                ${(route.distance / 1000).toFixed(1)} km
                            </strong>
                        </div>

                        <div class="route-stat">
                            <small>Fahrzeit</small>
                            <strong>
                                ${durationText}
                            </strong>
                        </div>

                    </div>

                </div>

            `;


            document
                .getElementById(
                    "routeClose"
                )
                .addEventListener(
                    "click",
                    clearRoute
                );


            /*
             * Jetzt werden die Skateparks entlang
             * der Route eingeblendet.
             */
            showParksAlongRoute(
                route.geometry.coordinates
            );


        } catch (error) {

            console.error(
                "Moi-cy Route:",
                error
            );


            routeResultArea.innerHTML = `
                <div class="search-message">
                    Die Route konnte nicht berechnet werden.
                    Bitte Start und Ziel überprüfen.
                </div>
            `;

        }

    }

    /* =====================================================
       MOBILE MENU
    ===================================================== */

    const mobileMenuButton =
        document.getElementById(
            "mobileMenuButton"
        );


    const mobileNavigation =
        document.getElementById(
            "mobileNavigation"
        );


    mobileMenuButton.addEventListener(
        "click",
        () => {

            const active =
                mobileNavigation.classList.toggle(
                    "active"
                );


            mobileMenuButton.setAttribute(
                "aria-expanded",
                String(active)
            );

        }
    );


    mobileNavigation
        .querySelectorAll("a")
        .forEach(
            (link) => {

                link.addEventListener(
                    "click",
                    () => {

                        mobileNavigation.classList.remove(
                            "active"
                        );

                        mobileMenuButton.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }
                );

            }
        );


    /* =====================================================
       ESC
    ===================================================== */

    document.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Escape"
            ) {

                clearRoute();

                markerLayer.clearLayers();

                searchResults.innerHTML = "";

            }

        }
    );


    /* =====================================================
       START
       Daten laden, aber KEINE Marker anzeigen.
    ===================================================== */

    loadSupabaseParks();

</script>

</body>
</html>
