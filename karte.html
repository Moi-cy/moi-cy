<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moi-cy – Skate Karte</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>
        :root {
            --black: #050505;
            --black-2: #090909;
            --dark: #101010;
            --dark-2: #151515;
            --dark-3: #1d1d1d;
            --white: #f5f5f5;
            --muted: #858585;
            --line: rgba(255,255,255,0.13);
            --blue: #168cff;
            --blue-bright: #00a8ff;
            --blue-dark: #0864bd;
            --header-height: 76px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--black);
            color: var(--white);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        /* =====================================================
           MAP AREA
        ===================================================== */

        .map-wrapper {
            position: fixed;
            top: var(--header-height);
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: calc(100dvh - var(--header-height));

            overflow: hidden;

            background: #d7d7d7;
        }

        #map {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }

        .leaflet-container {
            width: 100%;
            height: 100%;

            background: #d7d7d7;

            font-family: Arial, Helvetica, sans-serif;
        }

        /* =====================================================
           MAP TITLE
        ===================================================== */

        .map-title {
            position: absolute;

            top: 20px;
            right: 20px;

            z-index: 1000;

            padding: 10px 14px;

            background: rgba(255,255,255,0.94);

            color: #050505;

            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 0.12em;

            pointer-events: none;
        }

        .map-title span {
            color: var(--blue);
        }

        /* =====================================================
           ELECTRIC MODE
        ===================================================== */

        .electric-toggle {
            position: absolute;

            top: 20px;
            right: 20px;

            transform: translateY(58px);

            z-index: 1500;

            display: flex;
            align-items: center;
            gap: 9px;

            min-height: 38px;
            padding: 0 12px;

            border: 1px solid rgba(0,168,255,0.55);

            background: rgba(5,5,5,0.94);
            color: var(--blue-bright);

            font-size: 0.61rem;
            font-weight: 900;
            letter-spacing: 0.1em;

            cursor: pointer;
        }

        .electric-toggle-indicator {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #666;
        }

        .electric-toggle.active {
            border-color: var(--blue-bright);
            background: rgba(0,168,255,0.13);
        }

        .electric-toggle.active .electric-toggle-indicator {
            background: var(--blue-bright);

            box-shadow:
                0 0 8px var(--blue-bright),
                0 0 15px var(--blue-bright);
        }

        /* =====================================================
           LEFT UI
        ===================================================== */

        .map-ui-left {
            position: absolute;

            top: 20px;
            left: 20px;

            width: min(390px, calc(100vw - 40px));

            z-index: 2000;
        }

        .map-search-panel {
            width: 100%;

            padding: 16px;

            background: rgba(5,5,5,0.96);
            border: 1px solid rgba(255,255,255,0.16);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);
        }

        .panel-heading {
            margin: 0 0 12px;

            color: white;

            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .search-group {
            margin-bottom: 11px;
        }

        .search-group:last-child {
            margin-bottom: 0;
        }

        .search-label {
            display: block;

            margin-bottom: 6px;

            color: var(--muted);

            font-size: 0.56rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;

            width: 100%;

            border: 1px solid rgba(255,255,255,0.18);

            background: var(--dark-2);

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .input-row:focus-within {
            border-color: var(--blue-bright);
            background: var(--dark-3);
        }

        .search-input {
            flex: 1;

            width: 100%;
            min-width: 0;
            height: 43px;

            padding: 0 11px;

            border: 0;
            outline: 0;

            background: transparent;
            color: white;

            font-size: 0.75rem;
        }

        .search-input::placeholder {
            color: #686868;
        }

        .clear-input {
            width: 37px;
            min-width: 37px;

            border: 0;
            border-left: 1px solid rgba(255,255,255,0.08);

            background: transparent;
            color: #777;

            font-size: 1rem;

            cursor: pointer;
        }

        .clear-input:hover {
            color: white;
            background: rgba(255,255,255,0.06);
        }

        .search-submit {
            width: 48px;
            min-width: 48px;

            border: 0;
            border-left: 1px solid rgba(255,255,255,0.08);

            background: var(--blue);
            color: white;

            font-size: 0.85rem;
            font-weight: 900;

            cursor: pointer;
        }

        .search-submit:hover {
            background: var(--blue-dark);
        }

        /* =====================================================
           QUICK ACTIONS
        ===================================================== */

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 8px;

            margin-top: 8px;
        }

        .quick-button {
            height: 40px;

            border: 1px solid var(--blue);

            background: var(--blue);
            color: white;

            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.08em;

            cursor: pointer;
        }

        .quick-button:hover {
            background: var(--blue-dark);
            border-color: var(--blue-dark);
        }

        .quick-button.secondary {
            background: transparent;
            color: var(--blue-bright);

            border-color: rgba(0,168,255,0.5);
        }

        .quick-button.secondary:hover {
            background: rgba(0,168,255,0.12);
            border-color: var(--blue-bright);
        }

        /* =====================================================
           SEARCH RESULTS
        ===================================================== */

        .search-results {
            margin-top: 9px;
        }

        .search-results:empty {
            display: none;
        }

        .result-item {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;

            margin-bottom: 5px;
            padding: 10px;

            border: 1px solid rgba(255,255,255,0.1);

            background: rgba(21,21,21,0.98);
            color: white;

            text-align: left;

            cursor: pointer;
        }

        .result-item:hover {
            border-color: var(--blue-bright);
            background: #1b1b1b;
        }

        .result-main {
            min-width: 0;
        }

        .result-name {
            display: block;

            margin-bottom: 3px;

            color: white;

            font-size: 0.69rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .result-meta {
            display: block;

            color: var(--muted);

            font-size: 0.56rem;
            line-height: 1.4;
        }

        .result-distance {
            flex-shrink: 0;

            color: var(--blue-bright);

            font-size: 0.58rem;
            font-weight: 900;
        }

        .search-message {
            padding: 10px;

            border: 1px solid rgba(255,255,255,0.1);

            background: rgba(21,21,21,0.98);
            color: var(--muted);

            font-size: 0.59rem;
            line-height: 1.45;
        }

        /* =====================================================
           ROUTE RESULT
        ===================================================== */

        .route-result-area {
            width: 100%;

            margin-top: 12px;
        }

        .route-result {
            position: relative;

            width: 100%;

            padding: 15px;

            background: rgba(5,5,5,0.97);

            border: 1px solid var(--blue-bright);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.28),
                0 0 18px rgba(0,168,255,0.08);
        }

        .route-result-title {
            margin-bottom: 9px;

            color: var(--blue-bright);

            font-size: 0.59rem;
            font-weight: 900;
            letter-spacing: 0.14em;
        }

        .route-path {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;

            margin-bottom: 12px;

            color: white;

            font-size: 0.68rem;
            font-weight: 800;
            line-height: 1.4;
        }

        .route-path span {
            color: #aaa;
        }

        .route-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;

            padding-top: 11px;

            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .route-stat {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .route-stat + .route-stat {
            padding-left: 14px;

            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .route-stat-label {
            color: var(--muted);

            font-size: 0.51rem;
            font-weight: 900;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .route-stat-value {
            color: white;

            font-size: 0.9rem;
            font-weight: 900;
        }

        .nearby-parks {
            margin-top: 12px;
        }

        .nearby-heading {
            margin-bottom: 7px;

            color: var(--blue-bright);

            font-size: 0.56rem;
            font-weight: 900;
            letter-spacing: 0.12em;
        }

        /* =====================================================
           ZOOM
        ===================================================== */

        .map-zoom-controls {
            position: absolute;

            left: 20px;
            bottom: 20px;

            z-index: 2500;

            display: flex;
            flex-direction: column;

            width: 42px;

            box-shadow:
                0 8px 22px rgba(0,0,0,0.28);
        }

        .map-zoom-button {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,0.2);

            background: rgba(5,5,5,0.96);
            color: white;

            font-size: 23px;
            font-weight: 400;
            line-height: 1;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .map-zoom-button + .map-zoom-button {
            border-top: 0;
        }

        .map-zoom-button:hover {
            background: var(--blue);
            color: white;
        }

        /* =====================================================
           MARKER
        ===================================================== */

        .moi-marker {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--blue);
            color: white;

            border: 2px solid white;

            font-size: 15px;
            font-weight: 900;

            transform: rotate(45deg);

            box-shadow:
                0 5px 16px rgba(0,0,0,0.3);
        }

        .moi-marker span {
            transform: rotate(-45deg);
        }

        .moi-marker.nearby {
            background: var(--blue-bright);

            box-shadow:
                0 0 8px var(--blue-bright),
                0 0 18px rgba(0,168,255,0.6);
        }

        .moi-marker.all {
            background: #111;

            border-color: var(--blue-bright);

            color: var(--blue-bright);
        }

        /* =====================================================
           POPUP
        ===================================================== */

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #080808;
            color: white;
        }

        .leaflet-popup-content-wrapper {
            border: 1px solid rgba(0,168,255,0.35);
            border-radius: 0;
        }

        .leaflet-popup-close-button {
            color: #aaa !important;
        }

        .popup-name {
            margin-bottom: 5px;

            color: var(--blue-bright);

            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .popup-location {
            margin-bottom: 5px;

            color: #999;

            font-size: 0.64rem;
        }

        .popup-address {
            margin-bottom: 10px;

            color: #ddd;

            font-size: 0.61rem;
            line-height: 1.4;
        }

        .popup-route {
            width: 100%;

            padding: 8px 10px;

            border: 1px solid var(--blue);

            background: var(--blue);
            color: white;

            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.08em;

            cursor: pointer;
        }

        /* =====================================================
           ELECTRIC MAP
        ===================================================== */

        .map-wrapper.electric-mode .leaflet-tile-pane {
            filter:
                grayscale(1)
                brightness(0.52)
                contrast(1.45)
                sepia(0.12)
                hue-rotate(165deg)
                saturate(3.5);
        }

        .map-wrapper.electric-mode .leaflet-overlay-pane path {
            filter:
                drop-shadow(0 0 5px var(--blue-bright))
                drop-shadow(0 0 12px var(--blue-bright));
        }

        .route-line {
            filter:
                drop-shadow(0 0 3px rgba(0,168,255,0.95))
                drop-shadow(0 0 9px rgba(0,168,255,0.7));
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 1100px) {

            .map-wrapper {
                top: 68px;
                height: calc(100dvh - 68px);
            }
        }

        @media (max-width: 700px) {

            .map-ui-left {
                top: 10px;
                left: 10px;

                width: calc(100vw - 20px);
            }

            .map-title {
                display: none;
            }

            .electric-toggle {
                top: auto;
                right: 10px;
                bottom: 10px;

                transform: none;
            }

            .map-search-panel {
                padding: 13px;
            }

            .search-input {
                height: 41px;
            }

            .map-zoom-controls {
                left: 10px;
                bottom: 10px;

                width: 38px;
            }

            .map-zoom-button {
                width: 38px;
                height: 38px;
            }
        }

        @media (max-width: 500px) {

            .quick-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         SHARED HEADER
    ===================================================== -->

    <div id="site-header"></div>


    <!-- =====================================================
         MAP
    ===================================================== -->

    <main
        class="map-wrapper"
        id="mapWrapper"
    >

        <div id="map"></div>


        <div class="map-title">
            SKATE <span>KARTE</span>
        </div>


        <button
            class="electric-toggle"
            id="electricToggle"
            type="button"
            aria-pressed="false"
        >
            <span class="electric-toggle-indicator"></span>
            ELECTRIC MODE
        </button>


        <!-- =================================================
             SEARCH UI
        ================================================== -->

        <div class="map-ui-left">

            <section class="map-search-panel">

                <h1 class="panel-heading">
                    SKATEPLÄTZE FINDEN
                </h1>


                <div class="search-group">

                    <label
                        class="search-label"
                        for="searchInput"
                    >
                        Stadt / Ort / Skatepark
                    </label>

                    <div class="input-row">

                        <input
                            id="searchInput"
                            class="search-input"
                            type="text"
                            autocomplete="off"
                            placeholder="z. B. Karlsruhe"
                        >

                        <button
                            id="clearSearch"
                            class="clear-input"
                            type="button"
                            aria-label="Suche löschen"
                        >
                            ×
                        </button>

                        <button
                            id="searchButton"
                            class="search-submit"
                            type="button"
                            aria-label="Suchen"
                        >
                            →
                        </button>

                    </div>

                    <div
                        id="searchResults"
                        class="search-results"
                    ></div>

                </div>


                <div class="quick-actions">

                    <button
                        id="showAllParks"
                        class="quick-button"
                        type="button"
                    >
                        ALLE SKATEPLÄTZE
                    </button>

                    <button
                        id="locationButton"
                        class="quick-button secondary"
                        type="button"
                    >
                        MEIN STANDORT
                    </button>

                </div>

            </section>


            <!-- ROUTE -->

            <section
                id="routeResultArea"
                class="route-result-area"
                aria-live="polite"
            ></section>

        </div>


        <!-- =================================================
             ZOOM
        ================================================== -->

        <div
            class="map-zoom-controls"
            aria-label="Kartenzoom"
        >

            <button
                id="zoomIn"
                class="map-zoom-button"
                type="button"
                aria-label="Hineinzoomen"
            >
                +
            </button>

            <button
                id="zoomOut"
                class="map-zoom-button"
                type="button"
                aria-label="Herauszoomen"
            >
                −
            </button>

        </div>

    </main>


    <!-- =====================================================
         LEAFLET
    ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>


    <!-- =====================================================
         MAP SCRIPT
    ===================================================== -->

    <script>

        /* =====================================================
           MOI-CY SKATEPARKS
           Konkrete Skatepark-Adressen statt Stadtzentren
        ===================================================== */

        const skateparks = [

            {
                name: "Valence",
                city: "Valence",
                country: "Frankreich",
                address: "53 Allée Raymond Mias, 26000 Valence, Frankreich",
                query: "53 Allée Raymond Mias, 26000 Valence, France",
                lat: 44.9217,
                lng: 4.8917
            },

            {
                name: "Karlsruhe",
                city: "Karlsruhe",
                country: "Deutschland",
                address: "Schlachthausstraße 9A, 76131 Karlsruhe, Deutschland",
                query: "Schlachthausstraße 9A, 76131 Karlsruhe, Germany",
                lat: 49.0086,
                lng: 8.4254
            },

            {
                name: "Heidelberg",
                city: "Heidelberg",
                country: "Deutschland",
                address: "Uferstraße 78, 69120 Heidelberg, Deutschland",
                query: "Uferstraße 78, 69120 Heidelberg, Germany",
                lat: 49.4115,
                lng: 8.6863
            },

            {
                name: "Heidelberg Bowl",
                city: "Heidelberg",
                country: "Deutschland",
                address: "Elsa-Brändström-Straße 15, 69126 Heidelberg, Deutschland",
                query: "Elsa-Brändström-Straße 15, 69126 Heidelberg, Germany",
                lat: 49.3768,
                lng: 8.6764
            },

            {
                name: "Perpignan",
                city: "Perpignan",
                country: "Frankreich",
                address: "80 Avenue Paul Alduy, 66100 Perpignan, Frankreich",
                query: "80 Avenue Paul Alduy, 66100 Perpignan, France",
                lat: 42.6887,
                lng: 2.8948
            },

            {
                name: "München Hirschgarten",
                city: "München",
                country: "Deutschland",
                address: "Engasserbogen 34, 80639 München, Deutschland",
                query: "Engasserbogen 34, 80639 München, Germany",
                lat: 48.1445,
                lng: 11.4854
            }

        ];


        /* =====================================================
           MAP
        ===================================================== */

        const map =
            L.map("map", {
                zoomControl: false,
                attributionControl: true,
                preferCanvas: true
            });


        map.setView(
            [49.0069, 8.4037],
            6
        );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                minZoom: 2,

                updateWhenIdle: true,
                keepBuffer: 2,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
            }
        ).addTo(map);


        function refreshMapSize() {

            requestAnimationFrame(() => {

                map.invalidateSize({
                    animate: false,
                    pan: false
                });

            });

        }


        window.addEventListener(
            "load",
            () => {

                refreshMapSize();

                setTimeout(
                    refreshMapSize,
                    200
                );

                setTimeout(
                    refreshMapSize,
                    700
                );

            }
        );


        window.addEventListener(
            "resize",
            refreshMapSize
        );


        /* =====================================================
           MARKER ICON
        ===================================================== */

        function createMarkerIcon(
            mode = ""
        ) {

            return L.divIcon({
                className: "",
                html: `
                    <div class="moi-marker ${mode}">
                        <span>M</span>
                    </div>
                `,
                iconSize: [36, 36],
                iconAnchor: [18, 18],
                popupAnchor: [0, -23]
            });

        }


        /* =====================================================
           MARKERS
        ===================================================== */

        const parkMarkers = [];


        function createParkMarker(
            park,
            mode = ""
        ) {

            const marker =
                L.marker(
                    [park.lat, park.lng],
                    {
                        icon:
                            createMarkerIcon(mode)
                    }
                );


            marker.bindPopup(`
                <div class="popup-name">
                    ${escapeHtml(park.name)}
                </div>

                <div class="popup-location">
                    ${escapeHtml(park.city)},
                    ${escapeHtml(park.country)}
                </div>

                <div class="popup-address">
                    ${escapeHtml(park.address)}
                </div>

                <button
                    class="popup-route"
                    type="button"
                    onclick="routeToPark('${escapeJs(park.name)}')"
                >
                    ROUTE HIERHER
                </button>
            `);


            parkMarkers.push({
                park,
                marker
            });


            return marker;

        }


        skateparks.forEach(
            (park) => {

                createParkMarker(
                    park
                );

            }
        );


        /* =====================================================
           SHOW / HIDE ALL MARKERS
        ===================================================== */

        function hideAllParkMarkers() {

            parkMarkers.forEach(
                ({ marker }) => {

                    if (map.hasLayer(marker)) {
                        map.removeLayer(marker);
                    }

                }
            );

        }


        function showAllParkMarkers(
            fit = true
        ) {

            hideAllParkMarkers();


            const group =
                L.featureGroup();


            parkMarkers.forEach(
                ({ marker }) => {

                    marker.setIcon(
                        createMarkerIcon("all")
                    );

                    marker.addTo(map);

                    group.addLayer(
                        marker
                    );

                }
            );


            if (
                fit &&
                group.getBounds().isValid()
            ) {

                map.fitBounds(
                    group.getBounds(),
                    {
                        padding: [90, 90],
                        maxZoom: 7,
                        animate: true
                    }
                );

            }

        }


        /* =====================================================
           DISTANCE
        ===================================================== */

        function distanceKm(
            lat1,
            lng1,
            lat2,
            lng2
        ) {

            const earthRadius = 6371;

            const dLat =
                (
                    (lat2 - lat1) *
                    Math.PI
                ) / 180;

            const dLng =
                (
                    (lng2 - lng1) *
                    Math.PI
                ) / 180;


            const a =
                Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) *
                Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) ** 2;


            return (
                earthRadius *
                2 *
                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                )
            );

        }


        function formatDistance(
            km
        ) {

            if (km < 1) {
                return `${Math.round(km * 1000)} m`;
            }

            return `${km.toFixed(1)} km`;

        }


        /* =====================================================
           SHOW PARKS NEAR POINT
        ===================================================== */

        function showNearbyParks(
            lat,
            lng,
            label = "Skateplätze in der Nähe",
            radius = 40
        ) {

            const nearby =
                skateparks
                    .map(
                        (park) => ({
                            park,
                            distance:
                                distanceKm(
                                    lat,
                                    lng,
                                    park.lat,
                                    park.lng
                                )
                        })
                    )
                    .filter(
                        (item) =>
                            item.distance <= radius
                    )
                    .sort(
                        (a, b) =>
                            a.distance -
                            b.distance
                    );


            hideAllParkMarkers();


            nearby.forEach(
                ({ park }) => {

                    const entry =
                        parkMarkers.find(
                            (item) =>
                                item.park.name ===
                                park.name
                        );


                    if (!entry) {
                        return;
                    }


                    entry.marker.setIcon(
                        createMarkerIcon("nearby")
                    );


                    entry.marker.addTo(
                        map
                    );

                }
            );


            const bounds =
                L.latLngBounds([
                    [lat, lng]
                ]);


            nearby.forEach(
                ({ park }) => {

                    bounds.extend([
                        park.lat,
                        park.lng
                    ]);

                }
            );


            map.fitBounds(
                bounds,
                {
                    padding: [100, 100],
                    maxZoom: 13,
                    animate: true
                }
            );


            showNearbyResults(
                nearby,
                label
            );

        }


        /* =====================================================
           NEARBY RESULT UI
        ===================================================== */

        function showNearbyResults(
            nearby,
            title
        ) {

            searchResults.innerHTML = "";


            if (!nearby.length) {

                searchResults.innerHTML = `
                    <div class="search-message">
                        Keine Moi-cy Skateplätze in diesem Bereich gefunden.
                    </div>
                `;

                return;

            }


            nearby.forEach(
                ({ park, distance }) => {

                    const item =
                        document.createElement(
                            "button"
                        );


                    item.type = "button";
                    item.className =
                        "result-item";


                    item.innerHTML = `
                        <span class="result-main">

                            <span class="result-name">
                                ${escapeHtml(park.name)}
                            </span>

                            <span class="result-meta">
                                ${escapeHtml(park.address)}
                            </span>

                        </span>

                        <span class="result-distance">
                            ${formatDistance(distance)}
                        </span>
                    `;


                    item.addEventListener(
                        "click",
                        () => {

                            map.setView(
                                [
                                    park.lat,
                                    park.lng
                                ],
                                16,
                                {
                                    animate: true
                                }
                            );


                            const entry =
                                parkMarkers.find(
                                    (item) =>
                                        item.park.name ===
                                        park.name
                                );


                            if (entry) {
                                entry.marker.openPopup();
                            }

                        }
                    );


                    searchResults.appendChild(
                        item
                    );

                }
            );

        }


        /* =====================================================
           SEARCH NORMALIZATION
        ===================================================== */

        function normalizeSearchText(
            value
        ) {

            return String(value || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                )
                .replace(
                    /ß/g,
                    "ss"
                )
                .replace(
                    /[^a-z0-9]+/g,
                    " "
                )
                .trim();

        }


        function fuzzyScore(
            query,
            text
        ) {

            const q =
                normalizeSearchText(
                    query
                );

            const t =
                normalizeSearchText(
                    text
                );


            if (!q || !t) {
                return 0;
            }


            if (
                t.includes(q)
            ) {
                return 1;
            }


            const qTokens =
                q.split(/\s+/);


            const tTokens =
                t.split(/\s+/);


            let total = 0;


            qTokens.forEach(
                (qt) => {

                    let best = 0;


                    tTokens.forEach(
                        (tt) => {

                            if (
                                tt === qt
                            ) {
                                best = 1;
                                return;
                            }


                            if (
                                tt.includes(qt)
                            ) {
                                best =
                                    Math.max(
                                        best,
                                        0.9
                                    );
                            }

                        }
                    );


                    total += best;

                }
            );


            return (
                total /
                qTokens.length
            );

        }


        /* =====================================================
           ESCAPE
        ===================================================== */

        function escapeHtml(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeJs(
            value
        ) {

            return String(value)
                .replace(
                    /\\/g,
                    "\\\\"
                )
                .replace(
                    /'/g,
                    "\\'"
                );

        }


        /* =====================================================
           CITY / PARK SEARCH
        ===================================================== */

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const searchResults =
            document.getElementById(
                "searchResults"
            );


        function searchLocalParks(
            query
        ) {

            const matches =
                skateparks
                    .map(
                        (park) => {

                            const combined = [
                                park.name,
                                park.city,
                                park.country,
                                park.address
                            ].join(" ");


                            return {
                                park,
                                score:
                                    fuzzyScore(
                                        query,
                                        combined
                                    )
                            };

                        }
                    )
                    .filter(
                        (item) =>
                            item.score >= 0.35
                    )
                    .sort(
                        (a, b) =>
                            b.score -
                            a.score
                    );


            return matches;

        }


        /* =====================================================
           NOMINATIM
        ===================================================== */

        async function geocodePlace(
            query
        ) {

            const url =
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({
                    q: query,
                    format: "json",
                    limit: "1",
                    addressdetails: "1"
                });


            const response =
                await fetch(
                    url,
                    {
                        headers: {
                            Accept:
                                "application/json"
                        }
                    }
                );


            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const results =
                await response.json();


            if (!results.length) {
                throw new Error(
                    "Ort nicht gefunden"
                );
            }


            return {
                lat:
                    Number(
                        results[0].lat
                    ),
                lng:
                    Number(
                        results[0].lon
                    ),
                name:
                    results[0].display_name
            };

        }


        async function performSearch() {

            const query =
                searchInput.value.trim();


            searchResults.innerHTML = "";


            if (!query) {
                showAllParkMarkers();

                return;
            }


            const localMatches =
                searchLocalParks(
                    query
                );


            /*
             * Wenn direkt ein Moi-cy Park gefunden wurde:
             * diesen Park anzeigen.
             */

            if (
                localMatches.length &&
                localMatches[0].score >= 0.85
            ) {

                const park =
                    localMatches[0].park;


                showNearbyParks(
                    park.lat,
                    park.lng,
                    `Skateplätze bei ${park.city}`,
                    40
                );


                const entry =
                    parkMarkers.find(
                        (item) =>
                            item.park.name ===
                            park.name
                    );


                if (entry) {

                    setTimeout(
                        () => {

                            entry.marker.openPopup();

                        },
                        400
                    );

                }


                return;

            }


            /*
             * Sonst Stadt / Ort über Nominatim suchen.
             */

            searchResults.innerHTML = `
                <div class="search-message">
                    Ort wird gesucht ...
                </div>
            `;


            try {

                const location =
                    await geocodePlace(
                        query
                    );


                showNearbyParks(
                    location.lat,
                    location.lng,
                    `Skateplätze bei ${query}`,
                    40
                );

            } catch (error) {

                console.error(
                    "Moi-cy Suche:",
                    error
                );


                searchResults.innerHTML = `
                    <div class="search-message">
                        Ort nicht gefunden. Versuch z. B. Karlsruhe, Heidelberg oder München.
                    </div>
                `;

            }

        }


        document
            .getElementById(
                "searchButton"
            )
            .addEventListener(
                "click",
                performSearch
            );


        searchInput.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    performSearch();

                }

            }
        );


        document
            .getElementById(
                "clearSearch"
            )
            .addEventListener(
                "click",
                () => {

                    searchInput.value = "";

                    searchResults.innerHTML =
                        "";

                    showAllParkMarkers();

                    searchInput.focus();

                }
            );


        /* =====================================================
           SHOW ALL
        ===================================================== */

        document
            .getElementById(
                "showAllParks"
            )
            .addEventListener(
                "click",
                () => {

                    searchInput.value =
                        "";

                    searchResults.innerHTML =
                        "";

                    showAllParkMarkers();

                }
            );


        /* =====================================================
           CURRENT LOCATION
        ===================================================== */

        document
            .getElementById(
                "locationButton"
            )
            .addEventListener(
                "click",
                () => {

                    if (
                        !navigator.geolocation
                    ) {

                        searchResults.innerHTML = `
                            <div class="search-message">
                                Dein Browser unterstützt keine Standortbestimmung.
                            </div>
                        `;

                        return;

                    }


                    searchResults.innerHTML = `
                        <div class="search-message">
                            Standort wird ermittelt ...
                        </div>
                    `;


                    navigator.geolocation.getCurrentPosition(
                        (position) => {

                            const lat =
                                position.coords.latitude;

                            const lng =
                                position.coords.longitude;


                            showNearbyParks(
                                lat,
                                lng,
                                "Skateplätze bei dir",
                                40
                            );

                        },
                        () => {

                            searchResults.innerHTML = `
                                <div class="search-message">
                                    Standort konnte nicht ermittelt werden.
                                </div>
                            `;

                        },
                        {
                            enableHighAccuracy:
                                true,
                            timeout:
                                10000,
                            maximumAge:
                                300000
                        }
                    );

                }
            );


        /* =====================================================
           ROUTE
        ===================================================== */

        let routeLayer = null;


        async function requestRoute(
            start,
            destination,
            startName,
            destinationName
        ) {

            if (routeLayer) {

                map.removeLayer(
                    routeLayer
                );

                routeLayer =
                    null;

            }


            const routeUrl =
                "https://router.project-osrm.org/route/v1/driving/" +
                `${start.lng},${start.lat};` +
                `${destination.lng},${destination.lat}` +
                "?" +
                new URLSearchParams({
                    overview: "full",
                    geometries: "geojson"
                });


            const response =
                await fetch(
                    routeUrl
                );


            if (!response.ok) {
                throw new Error(
                    `Routing HTTP ${response.status}`
                );
            }


            const data =
                await response.json();


            if (
                data.code !== "Ok" ||
                !data.routes ||
                !data.routes.length
            ) {

                throw new Error(
                    "Keine Route gefunden"
                );

            }


            const route =
                data.routes[0];


            routeLayer =
                L.geoJSON(
                    route.geometry,
                    {
                        style: {
                            className:
                                "route-line",
                            color:
                                "#00a8ff",
                            weight: 6,
                            opacity: 0.92
                        }
                    }
                ).addTo(map);


            const bounds =
                routeLayer.getBounds();


            if (
                bounds.isValid()
            ) {

                map.fitBounds(
                    bounds,
                    {
                        paddingTopLeft:
                            [430, 80],
                        paddingBottomRight:
                            [80, 80],
                        maxZoom: 13,
                        animate: true
                    }
                );

            }


            /*
             * Skateparks in der Nähe
             * der kompletten Route.
             */

            const routeCoordinates =
                route.geometry.coordinates;


            const nearby =
                skateparks
                    .map(
                        (park) => {

                            let closest =
                                Infinity;


                            routeCoordinates.forEach(
                                (coordinate) => {

                                    const d =
                                        distanceKm(
                                            park.lat,
                                            park.lng,
                                            coordinate[1],
                                            coordinate[0]
                                        );


                                    closest =
                                        Math.min(
                                            closest,
                                            d
                                        );

                                }
                            );


                            return {
                                park,
                                distance:
                                    closest
                            };

                        }
                    )
                    .filter(
                        (item) =>
                            item.distance <= 8
                    )
                    .sort(
                        (a, b) =>
                            a.distance -
                            b.distance
                    );


            hideAllParkMarkers();


            nearby.forEach(
                ({ park }) => {

                    const entry =
                        parkMarkers.find(
                            (item) =>
                                item.park.name ===
                                park.name
                        );


                    if (!entry) {
                        return;
                    }


                    entry.marker.setIcon(
                        createMarkerIcon(
                            "nearby"
                        )
                    );


                    entry.marker.addTo(
                        map
                    );

                }
            );


            const distance =
                route.distance >= 1000
                    ? `${(
                        route.distance / 1000
                    ).toFixed(1)} km`
                    : `${Math.round(route.distance)} m`;


            const minutes =
                Math.round(
                    route.duration / 60
                );


            routeResultArea.innerHTML = `
                <div class="route-result">

                    <div class="route-result-title">
                        ROUTE &amp; SKATEPARKS
                    </div>

                    <div class="route-path">
                        <span>
                            ${escapeHtml(startName)}
                        </span>

                        →

                        <span>
                            ${escapeHtml(destinationName)}
                        </span>
                    </div>

                    <div class="route-stats">

                        <div class="route-stat">
                            <span class="route-stat-label">
                                Strecke
                            </span>

                            <span class="route-stat-value">
                                ${distance}
                            </span>
                        </div>

                        <div class="route-stat">
                            <span class="route-stat-label">
                                Fahrzeit
                            </span>

                            <span class="route-stat-value">
                                ${minutes} min
                            </span>
                        </div>

                    </div>

                    <div class="nearby-parks">

                        <div class="nearby-heading">
                            ${nearby.length}
                            SKATEPLÄTZE NAHE DER ROUTE
                        </div>

                        ${
                            nearby.length
                                ? nearby
                                    .map(
                                        ({ park, distance }) => `
                                            <button
                                                type="button"
                                                class="result-item"
                                                data-park-name="${escapeHtml(park.name)}"
                                            >
                                                <span class="result-main">

                                                    <span class="result-name">
                                                        ${escapeHtml(park.name)}
                                                    </span>

                                                    <span class="result-meta">
                                                        ${escapeHtml(park.address)}
                                                    </span>

                                                </span>

                                                <span class="result-distance">
                                                    ${formatDistance(distance)}
                                                </span>
                                            </button>
                                        `
                                    )
                                    .join("")
                                : `
                                    <div class="search-message">
                                        Kein Moi-cy Skateplatz liegt innerhalb von 8 km entlang dieser Route.
                                    </div>
                                `
                        }

                    </div>

                </div>
            `;


            routeResultArea
                .querySelectorAll(
                    "[data-park-name]"
                )
                .forEach(
                    (button) => {

                        button.addEventListener(
                            "click",
                            () => {

                                const park =
                                    skateparks.find(
                                        (item) =>
                                            item.name ===
                                            button.dataset.parkName
                                    );


                                if (!park) {
                                    return;
                                }


                                map.setView(
                                    [
                                        park.lat,
                                        park.lng
                                    ],
                                    16,
                                    {
                                        animate: true
                                    }
                                );


                                const entry =
                                    parkMarkers.find(
                                        (item) =>
                                            item.park.name ===
                                            park.name
                                    );


                                if (entry) {
                                    entry.marker.openPopup();
                                }

                            }
                        );

                    }
                );

        }


        async function planRoute() {

            const startQuery =
                prompt(
                    "Von wo soll die Route starten?"
                );


            if (!startQuery) {
                return;
            }


            const destinationQuery =
                prompt(
                    "Wohin soll die Route gehen?"
                );


            if (!destinationQuery) {
                return;
            }


            routeResultArea.innerHTML = `
                <div class="search-message">
                    Route wird berechnet ...
                </div>
            `;


            try {

                const [
                    start,
                    destination
                ] = await Promise.all([
                    geocodePlace(
                        startQuery
                    ),
                    geocodePlace(
                        destinationQuery
                    )
                ]);


                await requestRoute(
                    start,
                    destination,
                    startQuery,
                    destinationQuery
                );

            } catch (error) {

                console.error(
                    "Moi-cy Route:",
                    error
                );


                routeResultArea.innerHTML = `
                    <div class="search-message">
                        Die Route konnte nicht berechnet werden.
                    </div>
                `;

            }

        }


        /*
         * Route direkt über Marker.
         */

        window.routeToPark =
            async function(name) {

                const park =
                    skateparks.find(
                        (item) =>
                            item.name === name
                    );


                if (!park) {
                    return;
                }


                if (
                    !navigator.geolocation
                ) {

                    map.setView(
                        [
                            park.lat,
                            park.lng
                        ],
                        16
                    );

                    return;

                }


                navigator.geolocation.getCurrentPosition(
                    async (position) => {

                        try {

                            await requestRoute(
                                {
                                    lat:
                                        position.coords.latitude,
                                    lng:
                                        position.coords.longitude
                                },
                                {
                                    lat:
                                        park.lat,
                                    lng:
                                        park.lng
                                },
                                "Mein Standort",
                                park.name
                            );

                        } catch (error) {

                            console.error(
                                error
                            );

                        }

                    }
                );

            };


        /* =====================================================
           ELECTRIC MODE
        ===================================================== */

        const mapWrapper =
            document.getElementById(
                "mapWrapper"
            );

        const electricToggle =
            document.getElementById(
                "electricToggle"
            );


        electricToggle.addEventListener(
            "click",
            () => {

                const active =
                    mapWrapper.classList.toggle(
                        "electric-mode"
                    );


                electricToggle.classList.toggle(
                    "active",
                    active
                );


                electricToggle.setAttribute(
                    "aria-pressed",
                    String(active)
                );

            }
        );


        /* =====================================================
           INITIAL STATE
        ===================================================== */

        showAllParkMarkers(
            true
        );

    </script>
