<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moi-cy – Karte</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        .map-page {
            min-height: 100vh;
            padding-top: var(--header-height);
            background: var(--black);
        }

        .map-heading {
            width: min(1400px, calc(100% - 40px));
            margin: 0 auto;
            padding: 45px 0 25px;
        }

        .map-heading h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            text-transform: uppercase;
        }

        .map-heading p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .map-wrapper {
            position: relative;
            width: min(1400px, calc(100% - 40px));
            height: 650px;
            margin: 0 auto 60px;
            border: 1px solid var(--line);
            background: #111;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-search {
            position: absolute;
            z-index: 1000;
            top: 18px;
            left: 18px;
            width: min(380px, calc(100% - 36px));
        }

        .map-search-box {
            display: flex;
            background: rgba(5, 5, 5, 0.94);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .map-search input {
            width: 100%;
            min-height: 48px;
            padding: 0 15px;
            border: 0;
            outline: none;
            background: transparent;
            color: #fff;
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
        }

        .map-search input::placeholder {
            color: #777;
        }

        .map-search button {
            width: 52px;
            min-width: 52px;
            border: 0;
            border-left: 1px solid rgba(255,255,255,0.15);
            background: #168cff;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .map-search button:hover {
            background: #0864bd;
        }

        .search-message {
            display: none;
            margin-top: 7px;
            padding: 10px 13px;
            background: rgba(5,5,5,0.94);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .search-message.active {
            display: block;
        }

        .map-back {
            display: block;
            width: min(1400px, calc(100% - 40px));
            margin: 0 auto 60px;
        }

        .map-back a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid var(--line-light);
            color: var(--white);
            text-decoration: none;
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .map-back a:hover {
            background: var(--white);
            color: var(--black);
            border-color: var(--white);
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #111;
            color: #fff;
        }

        .leaflet-popup-content {
            margin: 14px 16px;
            font-family: Arial, sans-serif;
        }

        .popup-title {
            margin-bottom: 5px;
            font-size: 15px;
            font-weight: 900;
        }

        .popup-location {
            color: #aaa;
            font-size: 12px;
        }

        .popup-link {
            display: inline-block;
            margin-top: 10px;
            color: #168cff;
            font-size: 11px;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .popup-link:hover {
            color: #fff;
        }

        @media (max-width: 900px) {
            .map-page {
                padding-top: 68px;
            }

            .map-heading {
                padding-top: 35px;
            }

            .map-wrapper {
                height: 550px;
            }
        }

        @media (max-width: 600px) {
            .map-heading,
            .map-wrapper,
            .map-back {
                width: calc(100% - 24px);
            }

            .map-heading {
                padding: 28px 0 18px;
            }

            .map-wrapper {
                height: 500px;
                margin-bottom: 35px;
            }

            .map-search {
                top: 12px;
                left: 12px;
                width: calc(100% - 24px);
            }

            .map-search input {
                min-height: 46px;
            }

            .map-back {
                margin-bottom: 35px;
            }
        }
    </style>
</head>

<body>

    <div id="site-header"></div>

    <main class="map-page">

        <section class="map-heading">
            <h1>SKATE MAP</h1>
            <p>Finde deinen Spot.</p>
        </section>

        <section class="map-wrapper">

            <div class="map-search">

                <div class="map-search-box">

                    <input
                        type="search"
                        id="mapSearch"
                        placeholder="SKATEPARK ODER STADT SUCHEN..."
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        id="searchButton"
                        aria-label="Suchen"
                    >
                        🔎
                    </button>

                </div>

                <div
                    class="search-message"
                    id="searchMessage"
                ></div>

            </div>

            <div id="map"></div>

        </section>

        <div class="map-back">
            <a href="skateplaetze.html">
                ← ZU DEN SKATEPLÄTZEN
            </a>
        </div>

    </main>

    <div id="site-footer"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="script.js"></script>

    <script>
        const map = L.map("map", {
            zoomControl: true
        });

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>'
            }
        ).addTo(map);

        const skateparks = [
            {
                name: "Skatepark Valence",
                city: "Valence",
                country: "Frankreich",
                lat: 44.9543094,
                lng: 4.8978972
            },
            {
                name: "Skatepark Karlsruhe",
                city: "Karlsruhe",
                country: "Deutschland",
                lat: 49.0029885,
                lng: 8.4313306
            },
            {
                name: "Skatepark Heidelberg",
                city: "Heidelberg",
                country: "Deutschland",
                lat: 49.4115646,
                lng: 8.6767926
            },
            {
                name: "Heidelberg Bowl",
                city: "Heidelberg",
                country: "Deutschland",
                lat: 49.3919556,
                lng: 8.6835068
            },
            {
                name: "Skatepark Perpignan",
                city: "Perpignan",
                country: "Frankreich",
                lat: 42.6778339,
                lng: 2.9032284
            },
            {
                name: "München Hirschgarten",
                city: "München",
                country: "Deutschland",
                lat: 48.1455915,
                lng: 11.5097967
            }
        ];

        const markers = [];

        skateparks.forEach((park) => {

            const marker = L.marker([
                park.lat,
                park.lng
            ]).addTo(map);

            marker.bindPopup(`
                <div class="popup-title">
                    ${park.name}
                </div>

                <div class="popup-location">
                    ${park.city}, ${park.country}
                </div>

                <a
                    class="popup-link"
                    href="skateplaetze.html"
                >
                    Skateplatz ansehen →
                </a>
            `);

            markers.push({
                park,
                marker
            });
        });

        map.setView([48.5, 10.5], 6);

        const searchInput = document.getElementById("mapSearch");
        const searchButton = document.getElementById("searchButton");
        const searchMessage = document.getElementById("searchMessage");

        function searchSkatepark() {

            const searchTerm = searchInput.value
                .trim()
                .toLowerCase();

            searchMessage.classList.remove("active");
            searchMessage.textContent = "";

            if (!searchTerm) {
                map.setView([48.5, 10.5], 6);
                return;
            }

            const matches = markers.filter(({ park }) => {

                return (
                    park.name.toLowerCase().includes(searchTerm) ||
                    park.city.toLowerCase().includes(searchTerm) ||
                    park.country.toLowerCase().includes(searchTerm)
                );

            });

            if (matches.length === 0) {

                searchMessage.textContent =
                    "Kein Skatepark gefunden.";

                searchMessage.classList.add("active");

                return;
            }

            if (matches.length === 1) {

                const result = matches[0];

                map.flyTo(
                    [
                        result.park.lat,
                        result.park.lng
                    ],
                    15,
                    {
                        duration: 1
                    }
                );

                result.marker.openPopup();

                return;
            }

            const bounds = L.latLngBounds(
                matches.map(({ park }) => [
                    park.lat,
                    park.lng
                ])
            );

            map.fitBounds(bounds, {
                padding: [80, 80],
                maxZoom: 13
            });

            searchMessage.textContent =
                `${matches.length} Skateparks gefunden.`;

            searchMessage.classList.add("active");
        }

        searchButton.addEventListener(
            "click",
            searchSkatepark
        );

        searchInput.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {
                    searchSkatepark();
                }

            }
        );

        searchInput.addEventListener(
            "input",
            () => {

                if (searchInput.value.trim() === "") {
                    searchMessage.classList.remove("active");
                    searchMessage.textContent = "";
                }

            }
        );
    </script>

</body>
</html>
