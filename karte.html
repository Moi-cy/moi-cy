<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moi-cy – Skate Karte</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden;
            background: #111;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .leaflet-container {
            width: 100%;
            height: 100%;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================================
           TITEL
        ========================================= */

        .map-title {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;

            margin: 0;

            color: #fff;
            font-size: clamp(1.3rem, 3vw, 2.4rem);
            font-weight: 900;
            letter-spacing: .12em;
            text-transform: uppercase;

            white-space: nowrap;
            pointer-events: none;

            text-shadow:
                0 0 12px rgba(0,0,0,.9),
                0 0 25px rgba(0,0,0,.8);
        }

        .map-title span {
            color: #168cff;
        }

        /* =========================================
           SUCH- UND ROUTENLEISTE
        ========================================= */

        .map-search-panel {
            position: absolute;
            top: 72px;
            left: 20px;
            z-index: 1100;

            width: min(390px, calc(100vw - 40px));

            padding: 14px;

            background: rgba(5,5,5,.94);
            border: 1px solid rgba(22,140,255,.65);

            box-shadow:
                0 10px 35px rgba(0,0,0,.45),
                0 0 20px rgba(22,140,255,.08);

            backdrop-filter: blur(12px);
        }

        .search-brand {
            margin-bottom: 10px;

            color: #fff;
            font-size: .72rem;
            font-weight: 900;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .search-brand span {
            color: #168cff;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-row input {
            flex: 1;
            min-width: 0;
            height: 44px;

            padding: 0 13px;

            border: 1px solid rgba(255,255,255,.18);
            outline: none;

            background: #111;
            color: #fff;

            font-size: .82rem;
            font-weight: 700;
        }

        .search-row input::placeholder {
            color: #777;
        }

        .search-row input:focus {
            border-color: #168cff;
        }

        .search-button {
            width: 48px;
            height: 44px;

            border: 1px solid #168cff;
            background: #168cff;
            color: #fff;

            font-size: 1rem;
            font-weight: 900;

            cursor: pointer;
        }

        .search-button:hover {
            background: #fff;
            color: #050505;
        }

        .route-divider {
            height: 1px;
            margin: 14px 0;
            background: rgba(255,255,255,.12);
        }

        .route-label {
            margin-bottom: 7px;

            color: #777;
            font-size: .62rem;
            font-weight: 900;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .route-input {
            width: 100%;
            height: 40px;

            margin-bottom: 7px;
            padding: 0 11px;

            border: 1px solid rgba(255,255,255,.15);
            outline: none;

            background: #101010;
            color: #fff;

            font-size: .76rem;
            font-weight: 700;
        }

        .route-input::placeholder {
            color: #666;
        }

        .route-input:focus {
            border-color: #168cff;
        }

        .route-buttons {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 7px;
            margin-top: 8px;
        }

        .route-plan-button,
        .location-button {
            min-height: 40px;

            border: 1px solid #168cff;
            background: #168cff;
            color: #fff;

            font-size: .62rem;
            font-weight: 900;
            letter-spacing: .1em;

            cursor: pointer;
        }

        .route-plan-button:hover,
        .location-button:hover {
            background: #fff;
            color: #050505;
        }

        .location-button {
            padding: 0 13px;
        }

        /* =========================================
           SUCHERGEBNISSE
        ========================================= */

        .search-results {
            display: none;

            max-height: 250px;
            overflow-y: auto;

            margin-top: 7px;

            border: 1px solid rgba(255,255,255,.1);
            background: #0a0a0a;
        }

        .search-results.active {
            display: block;
        }

        .search-result {
            display: block;
            width: 100%;

            padding: 10px 12px;

            border: 0;
            border-bottom: 1px solid rgba(255,255,255,.07);

            background: transparent;
            color: #fff;

            text-align: left;
            cursor: pointer;
        }

        .search-result:hover {
            background: rgba(22,140,255,.14);
        }

        .search-result-name {
            display: block;
            color: #fff;
            font-size: .7rem;
            font-weight: 900;
        }

        .search-result-location {
            display: block;
            margin-top: 3px;
            color: #777;
            font-size: .58rem;
        }

        /* =========================================
           ROUTE INFO
        ========================================= */

        .route-info {
            position: absolute;
            left: 0;
            bottom: 0;
            z-index: 1200;

            display: none;

            width: 100%;

            margin-top: 12px;
            padding: 13px 44px 13px 14px;

            background: rgba(5,5,5,.96);
            border: 1px solid #168cff;

            box-shadow:
                0 8px 25px rgba(0,0,0,.45),
                0 0 20px rgba(22,140,255,.15);
        }

        .route-info.active {
            display: block;
        }

        .route-info-title {
            margin-bottom: 5px;

            color: #168cff;
            font-size: .6rem;
            font-weight: 900;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .route-info-main {
            color: #fff;
            font-size: .82rem;
            font-weight: 900;
        }

        .route-info-sub {
            margin-top: 4px;
            color: #888;
            font-size: .66rem;
        }

        .route-close {
            position: absolute;
            top: 8px;
            right: 8px;

            width: 27px;
            height: 27px;

            border: 1px solid rgba(255,255,255,.2);
            background: #111;
            color: #fff;

            font-size: 1rem;
            font-weight: 900;

            cursor: pointer;
        }

        .route-close:hover {
            background: #168cff;
            border-color: #168cff;
        }

        /* =========================================
           ELECTRIC MODE
        ========================================= */

        .map-wrapper.electric-mode .leaflet-tile-pane {
            filter:
                grayscale(1)
                brightness(.52)
                contrast(1.45)
                sepia(.12)
                hue-rotate(165deg)
                saturate(3.5);
        }

        .map-wrapper.electric-mode::after {
            content: "";

            position: absolute;
            inset: 0;

            z-index: 2;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    transparent 0%,
                    rgba(0,110,255,.04) 55%,
                    rgba(0,110,255,.12) 100%
                );
        }

        .electric-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1100;

            min-height: 40px;
            padding: 0 14px;

            border: 1px solid #168cff;
            background: rgba(5,5,5,.92);
            color: #168cff;

            font-size: .62rem;
            font-weight: 900;
            letter-spacing: .12em;

            cursor: pointer;
        }

        .electric-toggle:hover,
        .map-wrapper.electric-mode .electric-toggle {
            background: #168cff;
            color: #fff;
        }

        /* =========================================
           LEAFLET ZOOM
           
           NICHT fixed!
           Leaflet positioniert die Controls selbst.
        ========================================= */

        .leaflet-bottom.leaflet-right {
            right: 20px;
            bottom: 20px;
        }

        .leaflet-control-zoom {
            margin: 0 !important;

            border: 1px solid rgba(22,140,255,.7) !important;

            box-shadow:
                0 8px 25px rgba(0,0,0,.4) !important;
        }

        .leaflet-control-zoom a {
            width: 38px !important;
            height: 38px !important;
            line-height: 38px !important;

            background: #050505 !important;
            color: #168cff !important;

            border-color: rgba(255,255,255,.12) !important;
        }

        .leaflet-control-zoom a:hover {
            background: #168cff !important;
            color: #fff !important;
        }

        /* =========================================
           POPUPS
        ========================================= */

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #080808;
            color: #fff;
            border: 1px solid rgba(22,140,255,.6);
        }

        .leaflet-popup-content {
            margin: 14px;
        }

        .popup-title {
            margin-bottom: 5px;

            color: #168cff;
            font-size: .78rem;
            font-weight: 900;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .popup-location {
            margin-bottom: 10px;
            color: #999;
            font-size: .68rem;
        }

        .popup-route {
            min-height: 34px;
            padding: 0 11px;

            border: 1px solid #168cff;
            background: #168cff;
            color: #fff;

            font-size: .58rem;
            font-weight: 900;
            letter-spacing: .08em;

            cursor: pointer;
        }

        .popup-route:hover {
            background: #fff;
            color: #050505;
        }

        /* =========================================
           MARKER
        ========================================= */

        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 28px;
            height: 28px;

            background: #168cff;
            border: 2px solid #fff;

            color: #fff;

            font-size: 14px;
            font-weight: 900;

            box-shadow:
                0 0 0 4px rgba(22,140,255,.18),
                0 0 15px rgba(22,140,255,.55);
        }

        .map-wrapper.electric-mode .custom-marker {
            box-shadow:
                0 0 0 4px rgba(22,140,255,.25),
                0 0 12px #168cff,
                0 0 28px #168cff;
        }

        .route-start-marker,
        .route-end-marker {
            width: 20px;
            height: 20px;

            border-radius: 50%;
            border: 3px solid #fff;

            background: #168cff;

            box-shadow:
                0 0 10px #168cff,
                0 0 25px rgba(22,140,255,.9);
        }

        .route-line {
            filter:
                drop-shadow(0 0 4px rgba(22,140,255,.95))
                drop-shadow(0 0 10px rgba(22,140,255,.65));
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .map-title {
                top: 12px;
                font-size: 1.15rem;
            }

            .map-search-panel {
                top: 52px;
                left: 10px;
                width: calc(100vw - 20px);
                padding: 11px;
            }

            .electric-toggle {
                top: auto;
                right: 10px;
                bottom: 72px;
            }

            .leaflet-bottom.leaflet-right {
                right: 10px;
                bottom: 12px;
            }
        }
    </style>
</head>

<body>

<div class="map-wrapper" id="mapWrapper">

    <h1 class="map-title">
        SKATE <span>KARTE</span>
    </h1>

    <button
        class="electric-toggle"
        id="electricToggle"
        type="button"
    >
        ELECTRIC MODE
    </button>

    <div class="map-search-panel">

        <div class="search-brand">
            <span>Moi-cy</span> MAP
        </div>

        <div class="search-row">

            <input
                type="text"
                id="searchInput"
                placeholder="Skatepark, Stadt oder Straße..."
                autocomplete="off"
            >

            <button
                class="search-button"
                id="searchButton"
                type="button"
                aria-label="Suchen"
            >
                ↗
            </button>

        </div>

        <div
            class="search-results"
            id="searchResults"
        ></div>

        <div class="route-divider"></div>

        <div class="route-label">
            ROUTE PLANEN
        </div>

        <input
            type="text"
            class="route-input"
            id="routeStart"
            placeholder="Von – Stadt oder Adresse"
            autocomplete="off"
        >

        <input
            type="text"
            class="route-input"
            id="routeDestination"
            placeholder="Nach – Stadt oder Adresse"
            autocomplete="off"
        >

        <div class="route-buttons">

            <button
                class="route-plan-button"
                id="routeButton"
                type="button"
            >
                ROUTE PLANEN
            </button>

            <button
                class="location-button"
                id="locationButton"
                type="button"
            >
                MEIN STANDORT
            </button>

        </div>

        <div
            class="route-info"
            id="routeInfo"
        >

            <button
                class="route-close"
                id="routeClose"
                type="button"
                aria-label="Route schließen"
            >
                ×
            </button>

            <div class="route-info-title">
                ROUTE
            </div>

            <div
                class="route-info-main"
                id="routeInfoMain"
            >
                –
            </div>

            <div
                class="route-info-sub"
                id="routeInfoSub"
            >
                –
            </div>

        </div>

    </div>

    <div id="map"></div>

</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
></script>

<script>

    /* =========================================
       SKATEPARKS
    ========================================= */

    const skateparks = [
        {
            name: "Valence",
            city: "Valence",
            country: "Frankreich",
            lat: 44.9334,
            lng: 4.8924
        },
        {
            name: "Karlsruhe",
            city: "Karlsruhe",
            country: "Deutschland",
            lat: 49.0069,
            lng: 8.4037
        },
        {
            name: "Heidelberg",
            city: "Heidelberg",
            country: "Deutschland",
            lat: 49.3988,
            lng: 8.6724
        },
        {
            name: "Heidelberg Bowl",
            city: "Heidelberg",
            country: "Deutschland",
            lat: 49.4077,
            lng: 8.6908
        },
        {
            name: "Perpignan",
            city: "Perpignan",
            country: "Frankreich",
            lat: 42.6887,
            lng: 2.8948
        },
        {
            name: "München Hirschgarten",
            city: "München",
            country: "Deutschland",
            lat: 48.1445,
            lng: 11.4854
        }
    ];


    /* =========================================
       KARTE
    ========================================= */

    const map = L.map("map", {
        zoomControl: true,
        attributionControl: true
    });

    map.setView(
        [48.9, 8.5],
        7
    );

    L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    /*
     * WICHTIG:
     * Leaflet bekommt nach dem Laden noch einmal
     * die tatsächliche Größe des Containers.
     * Dadurch werden die Kartenkacheln nicht mehr
     * in falsche Stücke geteilt.
     */

    function refreshMapSize() {

        setTimeout(() => {
            map.invalidateSize({
                animate: false,
                pan: false
            });
        }, 100);
    }

    window.addEventListener(
        "load",
        refreshMapSize
    );

    window.addEventListener(
        "resize",
        refreshMapSize
    );

    setTimeout(
        refreshMapSize,
        500
    );


    /* =========================================
       ELEMENTE
    ========================================= */

    const mapWrapper =
        document.getElementById("mapWrapper");

    const searchInput =
        document.getElementById("searchInput");

    const searchButton =
        document.getElementById("searchButton");

    const searchResults =
        document.getElementById("searchResults");

    const routeStart =
        document.getElementById("routeStart");

    const routeDestination =
        document.getElementById("routeDestination");

    const routeButton =
        document.getElementById("routeButton");

    const locationButton =
        document.getElementById("locationButton");

    const routeInfo =
        document.getElementById("routeInfo");

    const routeInfoMain =
        document.getElementById("routeInfoMain");

    const routeInfoSub =
        document.getElementById("routeInfoSub");

    const routeClose =
        document.getElementById("routeClose");

    const electricToggle =
        document.getElementById("electricToggle");


    /* =========================================
       FUZZY SEARCH
    ========================================= */

    function normalizeSearchText(value) {

        return String(value || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/ß/g, "ss")
            .replace(/[^a-z0-9]+/g, " ")
            .trim();
    }


    function levenshteinDistance(a, b) {

        if (a === b) {
            return 0;
        }

        if (!a.length) {
            return b.length;
        }

        if (!b.length) {
            return a.length;
        }

        const matrix = Array.from(
            { length: b.length + 1 },
            (_, i) => {
                const row =
                    new Array(a.length + 1);

                row[0] = i;

                return row;
            }
        );

        for (
            let j = 0;
            j <= a.length;
            j++
        ) {
            matrix[0][j] = j;
        }

        for (
            let i = 1;
            i <= b.length;
            i++
        ) {

            for (
                let j = 1;
                j <= a.length;
                j++
            ) {

                const cost =
                    a[j - 1] === b[i - 1]
                        ? 0
                        : 1;

                matrix[i][j] =
                    Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
            }
        }

        return matrix[b.length][a.length];
    }


    function tokenSimilarity(
        queryToken,
        candidateToken
    ) {

        if (
            !queryToken ||
            !candidateToken
        ) {
            return 0;
        }

        if (
            candidateToken.includes(queryToken) ||
            queryToken.includes(candidateToken)
        ) {
            return 1;
        }

        const maxLength =
            Math.max(
                queryToken.length,
                candidateToken.length
            );

        const distance =
            levenshteinDistance(
                queryToken,
                candidateToken
            );

        const allowed =
            maxLength <= 4
                ? 1
                : maxLength <= 7
                    ? 2
                    : 3;

        if (distance <= allowed) {

            return (
                1 -
                distance / maxLength
            );
        }

        return 0;
    }


    function fuzzyScore(query, text) {

        const q =
            normalizeSearchText(query);

        const t =
            normalizeSearchText(text);

        if (!q || !t) {
            return 0;
        }

        if (t.includes(q)) {
            return 1;
        }

        const qTokens =
            q.split(/\s+/)
                .filter(Boolean);

        const tTokens =
            t.split(/\s+/)
                .filter(Boolean);

        let total = 0;

        for (const qt of qTokens) {

            let best = 0;

            for (const tt of tTokens) {

                best = Math.max(
                    best,
                    tokenSimilarity(qt, tt)
                );
            }

            total += best;
        }

        return total / qTokens.length;
    }


    /* =========================================
       MARKER
    ========================================= */

    function createParkIcon() {

        return L.divIcon({
            className: "",
            html:
                '<div class="custom-marker">M</div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14],
            popupAnchor: [0, -16]
        });
    }


    const parkMarkers = [];


    skateparks.forEach((park) => {

        const marker =
            L.marker(
                [park.lat, park.lng],
                {
                    icon: createParkIcon()
                }
            ).addTo(map);

        marker.bindPopup(`
            <div class="popup-title">
                ${park.name}
            </div>

            <div class="popup-location">
                ${park.city}, ${park.country}
            </div>

            <button
                class="popup-route"
                type="button"
                onclick="routeToPark(
                    ${park.lat},
                    ${park.lng},
                    '${park.name.replace(/'/g, "\\'")}'
                )"
            >
                ROUTE VON MEINEM STANDORT
            </button>
        `);

        parkMarkers.push({
            park,
            marker
        });
    });


    /* =========================================
       SUCHERGEBNISSE
    ========================================= */

    function showParkSearchResults(query) {

        const normalizedQuery =
            normalizeSearchText(query);

        if (!normalizedQuery) {

            searchResults.classList.remove(
                "active"
            );

            searchResults.innerHTML = "";

            return;
        }

        const scored =
            skateparks
                .map((park) => {

                    const text = `
                        ${park.name}
                        ${park.city}
                        ${park.country}
                    `;

                    return {
                        park,
                        score: fuzzyScore(
                            normalizedQuery,
                            text
                        )
                    };
                })
                .filter(
                    item => item.score >= .45
                )
                .sort(
                    (a, b) =>
                        b.score - a.score
                );

        if (!scored.length) {

            searchResults.classList.remove(
                "active"
            );

            searchResults.innerHTML = "";

            return;
        }

        searchResults.innerHTML =
            scored
                .slice(0, 6)
                .map((item) => {

                    const park =
                        item.park;

                    return `
                        <button
                            class="search-result"
                            type="button"
                            data-lat="${park.lat}"
                            data-lng="${park.lng}"
                            data-name="${encodeURIComponent(park.name)}"
                        >
                            <span class="search-result-name">
                                ${park.name}
                            </span>

                            <span class="search-result-location">
                                ${park.city}, ${park.country}
                            </span>
                        </button>
                    `;
                })
                .join("");

        searchResults.classList.add(
            "active"
        );

        searchResults
            .querySelectorAll(
                ".search-result"
            )
            .forEach((button) => {

                button.addEventListener(
                    "click",
                    () => {

                        const lat =
                            Number(
                                button.dataset.lat
                            );

                        const lng =
                            Number(
                                button.dataset.lng
                            );

                        const name =
                            decodeURIComponent(
                                button.dataset.name
                            );

                        map.setView(
                            [lat, lng],
                            15,
                            {
                                animate: true
                            }
                        );

                        const found =
                            parkMarkers.find(
                                item =>
                                    item.park.lat === lat &&
                                    item.park.lng === lng
                            );

                        if (found) {
                            found.marker.openPopup();
                        }

                        searchInput.value =
                            name;

                        searchResults.classList.remove(
                            "active"
                        );
                    }
                );
            });
    }


    /* =========================================
       NOMINATIM
    ========================================= */

    async function searchPlace(query) {

        const url =
            "https://nominatim.openstreetmap.org/search?" +
            new URLSearchParams({
                q: query,
                format: "json",
                limit: "5",
                addressdetails: "1"
            });

        const response =
            await fetch(
                url,
                {
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );

        if (!response.ok) {
            throw new Error(
                "Nominatim Fehler"
            );
        }

        return response.json();
    }


    async function performSearch() {

        const query =
            searchInput.value.trim();

        if (!query) {
            return;
        }

        showParkSearchResults(
            query
        );

        const normalizedQuery =
            normalizeSearchText(query);

        const bestPark =
            skateparks
                .map((park) => ({
                    park,
                    score: fuzzyScore(
                        normalizedQuery,
                        `
                            ${park.name}
                            ${park.city}
                            ${park.country}
                        `
                    )
                }))
                .sort(
                    (a, b) =>
                        b.score - a.score
                )[0];

        if (
            bestPark &&
            bestPark.score >= .78
        ) {

            map.setView(
                [
                    bestPark.park.lat,
                    bestPark.park.lng
                ],
                15,
                {
                    animate: true
                }
            );

            const found =
                parkMarkers.find(
                    item =>
                        item.park.name ===
                        bestPark.park.name
                );

            if (found) {
                found.marker.openPopup();
            }

            return;
        }

        try {

            const results =
                await searchPlace(
                    query
                );

            if (!results.length) {
                return;
            }

            const result =
                results[0];

            const lat =
                Number(result.lat);

            const lng =
                Number(result.lon);

            map.setView(
                [lat, lng],
                14,
                {
                    animate: true
                }
            );

            L.marker(
                [lat, lng],
                {
                    icon: createParkIcon()
                }
            )
                .addTo(map)
                .bindPopup(`
                    <div class="popup-title">
                        ${result.display_name.split(",")[0]}
                    </div>

                    <div class="popup-location">
                        ${result.display_name}
                    </div>
                `)
                .openPopup();

        } catch (error) {

            console.error(
                "Moi-cy Suche:",
                error
            );
        }
    }


    searchButton.addEventListener(
        "click",
        performSearch
    );


    searchInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                event.preventDefault();

                performSearch();
            }
        }
    );


    searchInput.addEventListener(
        "input",
        () => {

            if (
                searchInput.value.trim()
            ) {

                showParkSearchResults(
                    searchInput.value
                );

            } else {

                searchResults.classList.remove(
                    "active"
                );
            }
        }
    );


    /* =========================================
       ROUTE
    ========================================= */

    let routeLayer = null;
    let routeStartMarker = null;
    let routeEndMarker = null;


    function clearRoute() {

        if (routeLayer) {

            map.removeLayer(
                routeLayer
            );

            routeLayer = null;
        }

        if (routeStartMarker) {

            map.removeLayer(
                routeStartMarker
            );

            routeStartMarker = null;
        }

        if (routeEndMarker) {

            map.removeLayer(
                routeEndMarker
            );

            routeEndMarker = null;
        }

        routeInfo.classList.remove(
            "active"
        );

        routeInfoMain.textContent =
            "–";

        routeInfoSub.textContent =
            "–";
    }


    function showRouteInfo(
        distance,
        duration
    ) {

        const distanceKm =
            (distance / 1000)
                .toFixed(1);

        const totalMinutes =
            Math.round(
                duration / 60
            );

        let durationText;

        if (totalMinutes < 60) {

            durationText =
                `${totalMinutes} Min.`;

        } else {

            const hours =
                Math.floor(
                    totalMinutes / 60
                );

            const minutes =
                totalMinutes % 60;

            durationText =
                `${hours} Std. ${minutes} Min.`;
        }

        routeInfoMain.textContent =
            `${distanceKm} km · ${durationText}`;

        routeInfoSub.textContent =
            "Route wird auf der Karte angezeigt.";

        routeInfo.classList.add(
            "active"
        );
    }


    /* =========================================
       GEOCODING
    ========================================= */

    async function geocodePlace(query) {

        const trimmed =
            String(query || "")
                .trim();

        if (!trimmed) {
            throw new Error(
                "Kein Ort angegeben."
            );
        }

        const normalized =
            normalizeSearchText(
                trimmed
            );

        const matches =
            skateparks
                .map(park => ({
                    park,
                    score: fuzzyScore(
                        normalized,
                        `
                            ${park.name}
                            ${park.city}
                            ${park.country}
                        `
                    )
                }))
                .sort(
                    (a, b) =>
                        b.score - a.score
                );

        if (
            matches.length &&
            matches[0].score >= .78
        ) {

            return {
                lat: matches[0].park.lat,
                lng: matches[0].park.lng,
                name: matches[0].park.name
            };
        }

        const results =
            await searchPlace(
                trimmed
            );

        if (!results.length) {

            throw new Error(
                `Ort nicht gefunden: ${trimmed}`
            );
        }

        return {
            lat: Number(results[0].lat),
            lng: Number(results[0].lon),
            name: results[0].display_name
        };
    }


    /* =========================================
       ROUTE BERECHNEN
    ========================================= */

    async function planRoute(
        startQuery,
        destinationQuery
    ) {

        clearRoute();

        const start =
            await geocodePlace(
                startQuery
            );

        const destination =
            await geocodePlace(
                destinationQuery
            );

        const url =
            "https://router.project-osrm.org/route/v1/driving/" +
            `${start.lng},${start.lat};` +
            `${destination.lng},${destination.lat}` +
            "?overview=full&geometries=geojson";

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "Routenserver nicht erreichbar."
            );
        }

        const data =
            await response.json();

        if (
            data.code !== "Ok" ||
            !data.routes ||
            !data.routes.length
        ) {

            throw new Error(
                "Keine Route gefunden."
            );
        }

        const route =
            data.routes[0];

        routeLayer =
            L.geoJSON(
                route.geometry,
                {
                    style: {
                        color: "#168cff",
                        weight: 6,
                        opacity: .95,
                        className: "route-line"
                    }
                }
            ).addTo(map);

        routeStartMarker =
            L.marker(
                [
                    start.lat,
                    start.lng
                ],
                {
                    icon: L.divIcon({
                        className: "",
                        html:
                            '<div class="route-start-marker"></div>',
                        iconSize: [20,20],
                        iconAnchor: [10,10]
                    })
                }
            ).addTo(map);

        routeEndMarker =
            L.marker(
                [
                    destination.lat,
                    destination.lng
                ],
                {
                    icon: L.divIcon({
                        className: "",
                        html:
                            '<div class="route-end-marker"></div>',
                        iconSize: [20,20],
                        iconAnchor: [10,10]
                    })
                }
            ).addTo(map);

        map.fitBounds(
            routeLayer.getBounds(),
            {
                padding: [70,70]
            }
        );

        showRouteInfo(
            route.distance,
            route.duration
        );
    }


    /* =========================================
       ROUTE BUTTON
    ========================================= */

    routeButton.addEventListener(
        "click",
        async () => {

            const start =
                routeStart.value.trim();

            const destination =
                routeDestination.value.trim();

            if (
                !start ||
                !destination
            ) {

                routeInfoMain.textContent =
                    "Start und Ziel eingeben";

                routeInfoSub.textContent =
                    "Beide Felder werden benötigt.";

                routeInfo.classList.add(
                    "active"
                );

                return;
            }

            routeButton.disabled = true;

            routeButton.textContent =
                "ROUTE WIRD BERECHNET...";

            try {

                await planRoute(
                    start,
                    destination
                );

            } catch (error) {

                console.error(
                    "Moi-cy Route:",
                    error
                );

                routeInfoMain.textContent =
                    "Route konnte nicht erstellt werden";

                routeInfoSub.textContent =
                    error.message ||
                    "Bitte Eingaben prüfen.";

                routeInfo.classList.add(
                    "active"
                );

            } finally {

                routeButton.disabled = false;

                routeButton.textContent =
                    "ROUTE PLANEN";
            }
        }
    );


    /* =========================================
       ROUTE SCHLIESSEN
    ========================================= */

    routeClose.addEventListener(
        "click",
        () => {

            clearRoute();

            /*
             * Die obere Such-/Routenleiste
             * bleibt sichtbar.
             */
        }
    );


    /* =========================================
       MEIN STANDORT
    ========================================= */

    locationButton.addEventListener(
        "click",
        () => {

            if (
                !navigator.geolocation
            ) {

                routeInfoMain.textContent =
                    "Standort nicht verfügbar";

                routeInfoSub.textContent =
                    "Dein Browser unterstützt keine Standortabfrage.";

                routeInfo.classList.add(
                    "active"
                );

                return;
            }

            locationButton.disabled = true;

            locationButton.textContent =
                "STANDORT...";

            navigator.geolocation.getCurrentPosition(
                position => {

                    const lat =
                        position.coords.latitude;

                    const lng =
                        position.coords.longitude;

                    clearRoute();

                    routeStart.value =
                        "Mein Standort";

                    map.setView(
                        [lat,lng],
                        15,
                        {
                            animate: true
                        }
                    );

                    routeStartMarker =
                        L.marker(
                            [lat,lng],
                            {
                                icon: L.divIcon({
                                    className: "",
                                    html:
                                        '<div class="route-start-marker"></div>',
                                    iconSize: [20,20],
                                    iconAnchor: [10,10]
                                })
                            }
                        )
                        .addTo(map)
                        .bindPopup(
                            "<strong>Mein Standort</strong>"
                        )
                        .openPopup();

                    locationButton.disabled =
                        false;

                    locationButton.textContent =
                        "MEIN STANDORT";
                },

                error => {

                    console.error(
                        "Standort:",
                        error
                    );

                    routeInfoMain.textContent =
                        "Standort konnte nicht ermittelt werden";

                    routeInfoSub.textContent =
                        "Bitte Standortfreigabe im Browser erlauben.";

                    routeInfo.classList.add(
                        "active"
                    );

                    locationButton.disabled =
                        false;

                    locationButton.textContent =
                        "MEIN STANDORT";
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000
                }
            );
        }
    );


    /* =========================================
       ROUTE ZU SKATEPARK
    ========================================= */

    window.routeToPark =
        function(lat, lng, name) {

            if (
                !navigator.geolocation
            ) {

                routeInfoMain.textContent =
                    "Standort nicht verfügbar";

                routeInfoSub.textContent =
                    "Bitte gib Start und Ziel manuell ein.";

                routeInfo.classList.add(
                    "active"
                );

                return;
            }

            navigator.geolocation.getCurrentPosition(
                async position => {

                    const currentLat =
                        position.coords.latitude;

                    const currentLng =
                        position.coords.longitude;

                    routeStart.value =
                        "Mein Standort";

                    routeDestination.value =
                        name;

                    try {

                        clearRoute();

                        const url =
                            "https://router.project-osrm.org/route/v1/driving/" +
                            `${currentLng},${currentLat};` +
                            `${lng},${lat}` +
                            "?overview=full&geometries=geojson";

                        const response =
                            await fetch(url);

                        const data =
                            await response.json();

                        if (
                            data.code !== "Ok" ||
                            !data.routes.length
                        ) {

                            throw new Error(
                                "Keine Route gefunden."
                            );
                        }

                        const route =
                            data.routes[0];

                        routeLayer =
                            L.geoJSON(
                                route.geometry,
                                {
                                    style: {
                                        color: "#168cff",
                                        weight: 6,
                                        opacity: .95,
                                        className:
                                            "route-line"
                                    }
                                }
                            ).addTo(map);

                        routeStartMarker =
                            L.marker(
                                [
                                    currentLat,
                                    currentLng
                                ],
                                {
                                    icon:
                                        L.divIcon({
                                            className: "",
                                            html:
                                                '<div class="route-start-marker"></div>',
                                            iconSize: [20,20],
                                            iconAnchor: [10,10]
                                        })
                                }
                            ).addTo(map);

                        routeEndMarker =
                            L.marker(
                                [lat,lng],
                                {
                                    icon:
                                        L.divIcon({
                                            className: "",
                                            html:
                                                '<div class="route-end-marker"></div>',
                                            iconSize: [20,20],
                                            iconAnchor: [10,10]
                                        })
                                }
                            ).addTo(map);

                        map.fitBounds(
                            routeLayer.getBounds(),
                            {
                                padding: [70,70]
                            }
                        );

                        showRouteInfo(
                            route.distance,
                            route.duration
                        );

                    } catch (error) {

                        routeInfoMain.textContent =
                            "Route konnte nicht erstellt werden";

                        routeInfoSub.textContent =
                            error.message;

                        routeInfo.classList.add(
                            "active"
                        );
                    }
                },

                () => {

                    routeInfoMain.textContent =
                        "Standortfreigabe benötigt";

                    routeInfoSub.textContent =
                        "Erlaube deinem Browser den Zugriff auf deinen Standort.";

                    routeInfo.classList.add(
                        "active"
                    );
                }
            );
        };


    /* =========================================
       ELECTRIC MODE
    ========================================= */

    mapWrapper.classList.remove(
        "electric-mode"
    );

    electricToggle.addEventListener(
        "click",
        () => {

            const electric =
                mapWrapper.classList.toggle(
                    "electric-mode"
                );

            electricToggle.textContent =
                electric
                    ? "NORMAL MODE"
                    : "ELECTRIC MODE";
        }
    );


    /* =========================================
       ESC
    ========================================= */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                clearRoute();

                map.closePopup();
            }
        }
    );


    /* =========================================
       KARTENKLICK
    ========================================= */

    map.on(
        "click",
        () => {

            searchResults.classList.remove(
                "active"
            );
        }
    );

</script>

</body>
