<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MOI-CY – Skate Karte</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>

        :root {
            --black: #050505;
            --black-2: #090909;
            --white: #f5f5f5;
            --blue: #168cff;
            --blue-bright: #00a8ff;
            --line: rgba(255,255,255,0.13);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--black);
            color: var(--white);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .map-wrapper {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #050505;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #050505;
        }

        /*
        ============================================================
        ÜBERSCHRIFT
        ============================================================
        */

        .map-page-title {
            position: absolute;
            top: 20px;
            left: 50%;
            z-index: 1300;

            transform: translateX(-50%);

            pointer-events: none;

            color: #fff;

            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.24em;
            text-transform: uppercase;

            text-shadow:
                0 2px 10px rgba(0,0,0,0.85);
        }

        .map-page-title span {
            color: var(--blue-bright);
        }

        /*
        ============================================================
        ELECTRIC MODE
        ============================================================
        */

        /*
        WICHTIG:
        Die normale Karte bleibt sichtbar.
        Wir machen sie nur dunkel und bläulich.
        */

        .map-wrapper.electric-mode .leaflet-tile-pane {
            filter:
                grayscale(1)
                brightness(0.52)
                contrast(1.45)
                sepia(0.12)
                hue-rotate(165deg)
                saturate(3.5);
        }

        /*
        Nur ein sehr dezenter blauer Layer.
        Nicht mehr komplett schwarz.
        */

        .electric-map-overlay {
            position: absolute;
            inset: 0;
            z-index: 399;

            pointer-events: none;

            display: none;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(0,140,255,0.10) 0%,
                    rgba(0,80,180,0.04) 55%,
                    rgba(0,0,0,0.08) 100%
                );

            mix-blend-mode: screen;
        }

        .map-wrapper.electric-mode .electric-map-overlay {
            display: block;
        }

        /*
        ============================================================
        SUCHE
        ============================================================
        */

        .map-search-panel {
            position: absolute;
            top: 62px;
            left: 24px;
            z-index: 1200;

            width: min(470px, calc(100% - 48px));

            background: rgba(5,5,5,0.96);

            border: 1px solid rgba(255,255,255,0.16);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.55);

            backdrop-filter: blur(14px);
        }

        .map-search-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 14px 16px 12px;

            border-bottom: 1px solid var(--line);
        }

        .map-search-title {
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .map-search-status {
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 0.12em;

            color: var(--blue-bright);

            text-transform: uppercase;
        }

        .map-search-content {
            padding: 14px;
        }

        .search-input {
            width: 100%;
            height: 48px;

            padding: 0 15px;

            border: 1px solid rgba(255,255,255,0.18);
            outline: none;

            background: #101010;
            color: #fff;

            font-size: 0.75rem;
            font-weight: 700;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .search-input::placeholder {
            color: #707070;
        }

        .search-input:focus {
            border-color: var(--blue);

            box-shadow:
                0 0 0 1px rgba(22,140,255,0.18),
                0 0 25px rgba(22,140,255,0.10);
        }

        .search-results {
            display: none;

            max-height: 260px;
            overflow-y: auto;

            margin-top: 8px;

            border: 1px solid rgba(255,255,255,0.12);

            background: #0a0a0a;
        }

        .search-results.active {
            display: block;
        }

        .search-result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            width: 100%;

            padding: 12px 13px;

            border: 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);

            background: transparent;
            color: #fff;

            text-align: left;

            cursor: pointer;

            transition:
                background 0.2s ease,
                padding-left 0.2s ease;
        }

        .search-result:last-child {
            border-bottom: 0;
        }

        .search-result:hover {
            background: rgba(22,140,255,0.12);
            padding-left: 17px;
        }

        .search-result-name {
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .search-result-type {
            flex-shrink: 0;

            color: var(--blue-bright);

            font-size: 0.5rem;
            font-weight: 800;
            letter-spacing: 0.1em;

            text-transform: uppercase;
        }

        /*
        ============================================================
        ROUTE
        ============================================================
        */

        .route-box {
            display: grid;
            gap: 8px;

            margin-top: 12px;
            padding-top: 12px;

            border-top: 1px solid rgba(255,255,255,0.10);
        }

        .route-input {
            width: 100%;
            height: 42px;

            padding: 0 12px;

            border: 1px solid rgba(255,255,255,0.14);
            outline: none;

            background: #101010;
            color: #fff;

            font-size: 0.66rem;
            font-weight: 700;
        }

        .route-input::placeholder {
            color: #686868;
        }

        .route-input:focus {
            border-color: var(--blue);
        }

        .route-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .route-button {
            min-height: 42px;

            border: 1px solid var(--blue);
            background: var(--blue);
            color: #fff;

            font-size: 0.61rem;
            font-weight: 900;
            letter-spacing: 0.11em;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .route-button:hover {
            background: var(--blue-bright);
            transform: translateY(-1px);
        }

        .route-button.secondary {
            border-color: rgba(255,255,255,0.20);
            background: #111;
        }

        .route-button.secondary:hover {
            border-color: var(--blue);
            background: rgba(22,140,255,0.12);
        }

        /*
        ============================================================
        ROUTE INFO
        ============================================================
        */

        .route-info {
            display: none;

            margin: 0 14px 14px;

            border: 1px solid rgba(22,140,255,0.48);

            background:
                linear-gradient(
                    135deg,
                    rgba(0,80,160,0.18),
                    rgba(5,5,5,0.96)
                );

            box-shadow:
                0 0 25px rgba(22,140,255,0.12);
        }

        .route-info.active {
            display: block;
        }

        .route-info-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 11px 13px;

            border-bottom: 1px solid rgba(22,140,255,0.20);
        }

        .route-info-label {
            color: var(--blue-bright);

            font-size: 0.53rem;
            font-weight: 900;
            letter-spacing: 0.15em;
        }

        .route-info-close {
            width: 24px;
            height: 24px;

            border: 0;
            background: transparent;

            color: #777;

            cursor: pointer;
            font-size: 16px;
        }

        .route-info-close:hover {
            color: #fff;
        }

        .route-info-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .route-stat {
            padding: 13px;

            border-right: 1px solid rgba(255,255,255,0.08);
        }

        .route-stat:last-child {
            border-right: 0;
        }

        .route-stat-value {
            display: block;

            color: #fff;

            font-size: 1rem;
            font-weight: 900;
        }

        .route-stat-label {
            display: block;

            margin-top: 4px;

            color: #666;

            font-size: 0.5rem;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .route-message {
            padding: 9px 13px;

            border-top: 1px solid rgba(255,255,255,0.08);

            color: #888;

            font-size: 0.52rem;
            line-height: 1.5;
        }

        /*
        ============================================================
        ELECTRIC BUTTON
        ============================================================
        */

        .map-mode-button {
            position: absolute;

            right: 24px;
            top: 24px;

            z-index: 1200;

            min-height: 44px;
            padding: 0 16px;

            border: 1px solid rgba(22,140,255,0.75);

            background: rgba(5,5,5,0.94);
            color: #fff;

            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.13em;

            cursor: pointer;

            box-shadow:
                0 12px 35px rgba(0,0,0,0.4);

            transition:
                background 0.2s ease,
                color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .map-mode-button:hover {
            background: rgba(22,140,255,0.16);
            color: var(--blue-bright);
        }

        .map-wrapper.electric-mode .map-mode-button {
            background: var(--blue);

            color: #fff;

            box-shadow:
                0 0 25px rgba(22,140,255,0.32);
        }

        /*
        ============================================================
        ZOOM UNTEN RECHTS
        ============================================================
        */

        .leaflet-control-zoom {
            position: absolute !important;

            right: 20px !important;
            bottom: 20px !important;

            left: auto !important;
            top: auto !important;

            margin: 0 !important;

            border: 1px solid rgba(255,255,255,0.18) !important;

            box-shadow:
                0 12px 35px rgba(0,0,0,0.5) !important;
        }

        .leaflet-control-zoom a {
            width: 44px !important;
            height: 44px !important;

            line-height: 44px !important;

            border: 0 !important;

            border-bottom:
                1px solid rgba(255,255,255,0.12) !important;

            background:
                rgba(5,5,5,0.96) !important;

            color: #fff !important;

            font-size: 21px !important;
        }

        .leaflet-control-zoom a:last-child {
            border-bottom: 0 !important;
        }

        .leaflet-control-zoom a:hover {
            background:
                var(--blue) !important;

            color: #fff !important;
        }

        /*
        ============================================================
        MARKER
        ============================================================
        */

        .moi-marker {
            position: relative;

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050505;

            border: 2px solid var(--blue-bright);

            color: #fff;

            font-size: 17px;
            font-weight: 900;

            box-shadow:
                0 0 8px rgba(0,168,255,0.8),
                0 0 22px rgba(0,168,255,0.45);

            transform: rotate(45deg);
        }

        .moi-marker span {
            transform: rotate(-45deg);
        }

        .map-wrapper.electric-mode .moi-marker {
            border-color: #00b7ff;

            box-shadow:
                0 0 7px #00a8ff,
                0 0 18px #168cff,
                0 0 38px rgba(0,168,255,0.65);

            animation:
                electricPulse 1.8s ease-in-out infinite;
        }

        @keyframes electricPulse {

            0%,
            100% {
                box-shadow:
                    0 0 7px #00a8ff,
                    0 0 18px #168cff,
                    0 0 32px rgba(0,168,255,0.45);
            }

            50% {
                box-shadow:
                    0 0 10px #00c8ff,
                    0 0 28px #168cff,
                    0 0 52px rgba(0,168,255,0.75);
            }

        }

        /*
        ============================================================
        POPUP
        ============================================================
        */

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #080808;
            color: #fff;
        }

        .leaflet-popup-content-wrapper {
            border: 1px solid rgba(22,140,255,0.35);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.6);
        }

        .leaflet-popup-tip {
            border-right:
                1px solid rgba(22,140,255,0.35);

            border-bottom:
                1px solid rgba(22,140,255,0.35);
        }

        .leaflet-popup-close-button {
            color: #777 !important;
        }

        .leaflet-popup-close-button:hover {
            color: #fff !important;
        }

        .popup-title {
            margin-bottom: 5px;

            color: #fff;

            font-size: 0.8rem;
            font-weight: 900;

            text-transform: uppercase;
        }

        .popup-location {
            margin-bottom: 12px;

            color: #777;

            font-size: 0.58rem;
            font-weight: 700;
        }

        .popup-route {
            display: block;

            padding: 10px 12px;

            border: 1px solid var(--blue);

            background:
                rgba(22,140,255,0.10);

            color: var(--blue-bright);

            font-size: 0.56rem;
            font-weight: 900;

            letter-spacing: 0.08em;

            text-align: center;
            text-decoration: none;

            text-transform: uppercase;
        }

        .popup-route:hover {
            background: var(--blue);
            color: #fff;
        }

        /*
        ============================================================
        ROUTE LINE
        ============================================================
        */

        .electric-route {
            filter:
                drop-shadow(
                    0 0 4px rgba(0,168,255,0.9)
                )
                drop-shadow(
                    0 0 12px rgba(0,168,255,0.65)
                );
        }

        /*
        ============================================================
        LOCATION
        ============================================================
        */

        .location-marker {
            width: 18px;
            height: 18px;

            border-radius: 50%;

            background: #168cff;

            border: 3px solid #fff;

            box-shadow:
                0 0 0 5px rgba(22,140,255,0.25),
                0 0 25px rgba(22,140,255,0.8);
        }

        /*
        ============================================================
        MOBILE
        ============================================================
        */

        @media (max-width: 700px) {

            .map-page-title {
                top: 12px;

                font-size: 0.78rem;
                letter-spacing: 0.16em;
            }

            .map-search-panel {
                top: 48px;
                left: 12px;

                width:
                    calc(100% - 24px);
            }

            .map-mode-button {
                top: auto;
                right: 12px;
                bottom: 76px;
            }

            .leaflet-control-zoom {
                right: 12px !important;
                bottom: 12px !important;
            }

            .route-buttons {
                grid-template-columns: 1fr;
            }

            .search-results {
                max-height: 210px;
            }

        }

    </style>
</head>

<body>

<div
    class="map-wrapper"
    id="mapWrapper"
>

    <div id="map"></div>

    <div class="electric-map-overlay"></div>

    <!-- ========================================================
         ÜBERSCHRIFT
         ======================================================== -->

    <div class="map-page-title">
        SKATE <span>KARTE</span>
    </div>


    <!-- ========================================================
         SUCHE
         ======================================================== -->

    <section class="map-search-panel">

        <div class="map-search-header">

            <div class="map-search-title">
                MOI-CY MAP
            </div>

            <div
                class="map-search-status"
                id="searchStatus"
            >
                NORMAL
            </div>

        </div>

        <div class="map-search-content">

            <input
                type="search"
                id="placeSearch"
                class="search-input"
                placeholder="Ort, Stadt, Straße oder Skatepark suchen..."
                autocomplete="off"
            >

            <div
                class="search-results"
                id="searchResults"
            ></div>


            <!-- ROUTE -->

            <div class="route-box">

                <input
                    type="text"
                    id="routeStart"
                    class="route-input"
                    placeholder="Start: Stadt, Straße oder Ort"
                >

                <input
                    type="text"
                    id="routeDestination"
                    class="route-input"
                    placeholder="Ziel: Stadt, Straße oder Ort"
                >

                <div class="route-buttons">

                    <button
                        type="button"
                        class="route-button"
                        id="planRouteButton"
                    >
                        ROUTE PLANEN
                    </button>

                    <button
                        type="button"
                        class="route-button secondary"
                        id="myLocationButton"
                    >
                        MEIN STANDORT
                    </button>

                </div>

            </div>

        </div>


        <!-- ROUTE INFO -->

        <div
            class="route-info"
            id="routeInfo"
        >

            <div class="route-info-top">

                <span class="route-info-label">
                    ROUTE GEFUNDEN
                </span>

                <button
                    type="button"
                    class="route-info-close"
                    id="closeRouteInfo"
                >
                    ×
                </button>

            </div>

            <div class="route-info-main">

                <div class="route-stat">

                    <span
                        class="route-stat-value"
                        id="routeDistance"
                    >
                        –
                    </span>

                    <span class="route-stat-label">
                        Entfernung
                    </span>

                </div>

                <div class="route-stat">

                    <span
                        class="route-stat-value"
                        id="routeDuration"
                    >
                        –
                    </span>

                    <span class="route-stat-label">
                        Fahrzeit
                    </span>

                </div>

            </div>

            <div
                class="route-message"
                id="routeMessage"
            >
                Route wurde berechnet.
            </div>

        </div>

    </section>


    <!-- ========================================================
         ELECTRIC MODE
         ======================================================== -->

    <button
        type="button"
        class="map-mode-button"
        id="mapModeButton"
    >
        ELECTRIC MAP
    </button>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
></script>


<script>

    /*
    ================================================================
    SKATEPARKS
    ================================================================
    */

    const skateparks = [

        {
            name: "Valence",
            city: "Valence",
            country: "Frankreich",
            lat: 44.9334,
            lng: 4.8924
        },

        {
            name: "Karlsruhe",
            city: "Karlsruhe",
            country: "Deutschland",
            lat: 49.0069,
            lng: 8.4037
        },

        {
            name: "Heidelberg",
            city: "Heidelberg",
            country: "Deutschland",
            lat: 49.3988,
            lng: 8.6724
        },

        {
            name: "Heidelberg Bowl",
            city: "Heidelberg",
            country: "Deutschland",
            lat: 49.4019,
            lng: 8.6877
        },

        {
            name: "Perpignan",
            city: "Perpignan",
            country: "Frankreich",
            lat: 42.6887,
            lng: 2.8948
        },

        {
            name: "München Hirschgarten",
            city: "München",
            country: "Deutschland",
            lat: 48.1438,
            lng: 11.4813
        }

    ];


    /*
    ================================================================
    KARTE
    ================================================================
    */

    const map =
        L.map(
            "map",
            {
                zoomControl: true,
                attributionControl: true,
                worldCopyJump: true
            }
        ).setView(
            [49.0069, 8.4037],
            6
        );


    const osmLayer =
        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
            }
        );

    osmLayer.addTo(map);


    /*
    ================================================================
    MARKER
    ================================================================
    */

    const parkMarkers = [];


    function createParkIcon() {

        return L.divIcon({

            className: "",

            html: `
                <div class="moi-marker">
                    <span>M</span>
                </div>
            `,

            iconSize: [36,36],

            iconAnchor: [18,18],

            popupAnchor: [0,-20]

        });

    }


    skateparks.forEach(
        (park) => {

            const marker =
                L.marker(
                    [
                        park.lat,
                        park.lng
                    ],
                    {
                        icon:
                            createParkIcon()
                    }
                ).addTo(map);


            const googleMapsSearch =
                "https://www.google.com/maps/search/?api=1&query=" +
                encodeURIComponent(
                    `${park.name}, ${park.city}, ${park.country}`
                );


            marker.bindPopup(`

                <div class="popup-title">
                    ${park.name}
                </div>

                <div class="popup-location">
                    ${park.city}, ${park.country}
                </div>

                <a
                    class="popup-route"
                    href="${googleMapsSearch}"
                    target="_blank"
                    rel="noopener"
                >
                    IN GOOGLE MAPS ÖFFNEN
                </a>

            `);


            parkMarkers.push({
                park,
                marker
            });

        }
    );


    /*
    ================================================================
    SUCHE
    ================================================================
    */

    const placeSearch =
        document.getElementById(
            "placeSearch"
        );

    const searchResults =
        document.getElementById(
            "searchResults"
        );

    const searchStatus =
        document.getElementById(
            "searchStatus"
        );


    let searchTimeout = null;


    function escapeHtml(value) {

        return String(value)
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll('"',"&quot;")
            .replaceAll("'","&#039;");

    }


    function clearSearchResults() {

        searchResults.innerHTML = "";

        searchResults.classList.remove(
            "active"
        );

    }


    function addSearchResult(
        title,
        type,
        callback
    ) {

        const button =
            document.createElement(
                "button"
            );

        button.type = "button";

        button.className =
            "search-result";

        button.innerHTML = `

            <span class="search-result-name">
                ${escapeHtml(title)}
            </span>

            <span class="search-result-type">
                ${escapeHtml(type)}
            </span>

        `;


        button.addEventListener(
            "click",
            callback
        );


        searchResults.appendChild(
            button
        );

        searchResults.classList.add(
            "active"
        );

    }


    function showParkSearchResults(
        query
    ) {

        const normalized =
            query
                .toLowerCase()
                .trim();


        const matches =
            skateparks.filter(
                (park) => {

                    const text =
                        `${park.name} ${park.city} ${park.country}`
                            .toLowerCase();

                    return text.includes(
                        normalized
                    );

                }
            );


        matches.forEach(
            (park) => {

                addSearchResult(

                    `${park.name} – ${park.city}`,

                    "SKATEPARK",

                    () => {

                        map.setView(
                            [
                                park.lat,
                                park.lng
                            ],
                            16,
                            {
                                animate: true
                            }
                        );


                        const found =
                            parkMarkers.find(
                                item =>
                                    item.park.name ===
                                    park.name
                            );


                        if (found) {
                            found.marker.openPopup();
                        }


                        placeSearch.value =
                            `${park.name}, ${park.city}`;


                        clearSearchResults();

                    }
                );

            }
        );


        return matches.length;

    }


    async function searchPlace(query) {

        try {

            searchStatus.textContent =
                "SUCHE...";


            const url =
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({

                    q: query,

                    format: "json",

                    limit: "5",

                    addressdetails: "1"

                });


            const response =
                await fetch(
                    url,
                    {
                        headers: {
                            Accept:
                                "application/json"
                        }
                    }
                );


            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const places =
                await response.json();


            places.forEach(
                (place) => {

                    addSearchResult(

                        place.display_name,

                        "ORT / STRASSE",

                        () => {

                            const lat =
                                Number(
                                    place.lat
                                );

                            const lng =
                                Number(
                                    place.lon
                                );


                            map.setView(
                                [
                                    lat,
                                    lng
                                ],
                                16,
                                {
                                    animate: true
                                }
                            );


                            const marker =
                                L.marker(
                                    [
                                        lat,
                                        lng
                                    ],
                                    {
                                        icon:
                                            createParkIcon()
                                    }
                                ).addTo(map);


                            marker.bindPopup(`

                                <div class="popup-title">
                                    AUSGEWÄHLTER ORT
                                </div>

                                <div class="popup-location">
                                    ${escapeHtml(
                                        place.display_name
                                    )}
                                </div>

                            `).openPopup();


                            placeSearch.value =
                                place.display_name;


                            clearSearchResults();

                        }

                    );

                }
            );


            searchStatus.textContent =
                mapWrapper.classList.contains(
                    "electric-mode"
                )
                    ? "ELECTRIC"
                    : "NORMAL";


        } catch (error) {

            console.error(
                "Moi-cy Suche:",
                error
            );

            searchStatus.textContent =
                "FEHLER";

        }

    }


    placeSearch.addEventListener(
        "input",
        () => {

            clearTimeout(
                searchTimeout
            );


            const query =
                placeSearch.value.trim();


            if (query.length < 2) {

                clearSearchResults();

                return;

            }


            clearSearchResults();

            showParkSearchResults(
                query
            );


            searchTimeout =
                setTimeout(
                    () => {

                        searchPlace(
                            query
                        );

                    },
                    500
                );

        }
    );


    /*
    ================================================================
    GEOCODING
    ================================================================
    */

    async function geocodePlace(
        query
    ) {

        const url =
            "https://nominatim.openstreetmap.org/search?" +
            new URLSearchParams({

                q: query,

                format: "json",

                limit: "1",

                addressdetails: "1"

            });


        const response =
            await fetch(
                url,
                {
                    headers: {
                        Accept:
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                `Geocoding HTTP ${response.status}`
            );

        }


        const results =
            await response.json();


        if (!results.length) {

            throw new Error(
                `Ort nicht gefunden: ${query}`
            );

        }


        return {

            lat:
                Number(results[0].lat),

            lng:
                Number(results[0].lon),

            name:
                results[0].display_name

        };

    }


    /*
    ================================================================
    ROUTE
    ================================================================
    */

    let routeLayer = null;

    let routeStartMarker = null;

    let routeEndMarker = null;


    const routeStart =
        document.getElementById(
            "routeStart"
        );

    const routeDestination =
        document.getElementById(
            "routeDestination"
        );

    const planRouteButton =
        document.getElementById(
            "planRouteButton"
        );


    const routeInfo =
        document.getElementById(
            "routeInfo"
        );

    const routeDistance =
        document.getElementById(
            "routeDistance"
        );

    const routeDuration =
        document.getElementById(
            "routeDuration"
        );

    const routeMessage =
        document.getElementById(
            "routeMessage"
        );


    function removeRoute() {

        if (routeLayer) {

            map.removeLayer(
                routeLayer
            );

            routeLayer = null;

        }


        if (routeStartMarker) {

            map.removeLayer(
                routeStartMarker
            );

            routeStartMarker = null;

        }


        if (routeEndMarker) {

            map.removeLayer(
                routeEndMarker
            );

            routeEndMarker = null;

        }

    }


    function formatDistance(
        meters
    ) {

        if (meters < 1000) {

            return `${Math.round(meters)} m`;

        }


        return `${(
            meters / 1000
        ).toFixed(1)} km`;

    }


    function formatDuration(
        seconds
    ) {

        const minutes =
            Math.round(
                seconds / 60
            );


        if (minutes < 60) {

            return `${minutes} min`;

        }


        const hours =
            Math.floor(
                minutes / 60
            );


        const remaining =
            minutes % 60;


        if (remaining === 0) {

            return `${hours} h`;

        }


        return `${hours} h ${remaining} min`;

    }


    function createRouteMarkerIcon() {

        return L.divIcon({

            className: "",

            html: `
                <div class="moi-marker">
                    <span>•</span>
                </div>
            `,

            iconSize: [36,36],

            iconAnchor: [18,18]

        });

    }


    async function planRoute() {

        const startQuery =
            routeStart.value.trim();

        const destinationQuery =
            routeDestination.value.trim();


        if (
            !startQuery ||
            !destinationQuery
        ) {

            routeMessage.textContent =
                "Bitte Start und Ziel eingeben.";

            routeInfo.classList.add(
                "active"
            );

            return;

        }


        planRouteButton.disabled =
            true;

        planRouteButton.textContent =
            "ROUTE WIRD BERECHNET...";


        try {

            removeRoute();


            const [
                start,
                destination
            ] =
                await Promise.all([

                    geocodePlace(
                        startQuery
                    ),

                    geocodePlace(
                        destinationQuery
                    )

                ]);


            const routeUrl =
                "https://router.project-osrm.org/route/v1/driving/" +
                `${start.lng},${start.lat};` +
                `${destination.lng},${destination.lat}` +
                "?" +
                new URLSearchParams({

                    overview:
                        "full",

                    geometries:
                        "geojson"

                });


            const response =
                await fetch(
                    routeUrl
                );


            if (!response.ok) {

                throw new Error(
                    `Routing HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            if (
                data.code !== "Ok" ||
                !data.routes ||
                !data.routes.length
            ) {

                throw new Error(
                    "Keine Route gefunden."
                );

            }


            const route =
                data.routes[0];


            routeLayer =
                L.geoJSON(
                    route.geometry,
                    {

                        style: {

                            color:
                                "#168cff",

                            weight:
                                7,

                            opacity:
                                0.95,

                            lineCap:
                                "round",

                            lineJoin:
                                "round",

                            className:
                                "electric-route"

                        }

                    }
                ).addTo(map);


            routeStartMarker =
                L.marker(
                    [
                        start.lat,
                        start.lng
                    ],
                    {
                        icon:
                            createRouteMarkerIcon()
                    }
                ).addTo(map);


            routeEndMarker =
                L.marker(
                    [
                        destination.lat,
                        destination.lng
                    ],
                    {
                        icon:
                            createRouteMarkerIcon()
                    }
                ).addTo(map);


            routeStartMarker.bindPopup(`
                <div class="popup-title">
                    START
                </div>

                <div class="popup-location">
                    ${escapeHtml(start.name)}
                </div>
            `);


            routeEndMarker.bindPopup(`
                <div class="popup-title">
                    ZIEL
                </div>

                <div class="popup-location">
                    ${escapeHtml(destination.name)}
                </div>
            `);


            map.fitBounds(
                routeLayer.getBounds(),
                {
                    paddingTopLeft: [
                        40,
                        40
                    ],

                    paddingBottomRight: [
                        40,
                        40
                    ]
                }
            );


            routeDistance.textContent =
                formatDistance(
                    route.distance
                );


            routeDuration.textContent =
                formatDuration(
                    route.duration
                );


            routeMessage.textContent =
                `${startQuery} → ${destinationQuery}`;


            routeInfo.classList.add(
                "active"
            );


        } catch (error) {

            console.error(
                "Moi-cy Route:",
                error
            );


            routeDistance.textContent =
                "–";

            routeDuration.textContent =
                "–";


            routeMessage.textContent =
                error.message ||
                "Route konnte nicht berechnet werden.";


            routeInfo.classList.add(
                "active"
            );


        } finally {

            planRouteButton.disabled =
                false;

            planRouteButton.textContent =
                "ROUTE PLANEN";

        }

    }


    planRouteButton.addEventListener(
        "click",
        planRoute
    );


    routeStart.addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {
                planRoute();
            }

        }
    );


    routeDestination.addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {
                planRoute();
            }

        }
    );


    /*
    ================================================================
    ROUTE INFO SCHLIESSEN
    ================================================================
    */

    document
        .getElementById(
            "closeRouteInfo"
        )
        .addEventListener(
            "click",
            () => {

                routeInfo.classList.remove(
                    "active"
                );

                removeRoute();

            }
        );


    /*
    ================================================================
    STANDORT
    ================================================================
    */

    const myLocationButton =
        document.getElementById(
            "myLocationButton"
        );


    let locationMarker = null;


    myLocationButton.addEventListener(
        "click",
        () => {

            if (
                !navigator.geolocation
            ) {

                alert(
                    "Dein Browser unterstützt keine Standortbestimmung."
                );

                return;

            }


            myLocationButton.textContent =
                "STANDORT WIRD GESUCHT...";


            navigator.geolocation.getCurrentPosition(

                (position) => {

                    const lat =
                        position.coords.latitude;

                    const lng =
                        position.coords.longitude;


                    if (locationMarker) {

                        map.removeLayer(
                            locationMarker
                        );

                    }


                    locationMarker =
                        L.marker(
                            [
                                lat,
                                lng
                            ],
                            {

                                icon:
                                    L.divIcon({

                                        className:
                                            "",

                                        html: `
                                            <div class="location-marker"></div>
                                        `,

                                        iconSize:
                                            [18,18],

                                        iconAnchor:
                                            [9,9]

                                    })

                            }
                        ).addTo(map);


                    locationMarker.bindPopup(
                        "<strong>DEIN STANDORT</strong>"
                    );


                    map.setView(
                        [
                            lat,
                            lng
                        ],
                        14,
                        {
                            animate: true
                        }
                    );


                    routeStart.value =
                        "Mein Standort";


                    myLocationButton.textContent =
                        "MEIN STANDORT";

                },


                (error) => {

                    console.error(
                        "Geolocation:",
                        error
                    );


                    myLocationButton.textContent =
                        "MEIN STANDORT";


                    alert(
                        "Dein Standort konnte nicht ermittelt werden."
                    );

                },


                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        10000,

                    maximumAge:
                        60000

                }

            );

        }
    );


    /*
    ================================================================
    ELECTRIC MODE
    ================================================================
    */

    const mapWrapper =
        document.getElementById(
            "mapWrapper"
        );

    const mapModeButton =
        document.getElementById(
            "mapModeButton"
        );


    function updateMapMode() {

        const electric =
            mapWrapper.classList.contains(
                "electric-mode"
            );


        mapModeButton.textContent =
            electric
                ? "NORMAL MAP"
                : "ELECTRIC MAP";


        searchStatus.textContent =
            electric
                ? "ELECTRIC"
                : "NORMAL";

    }


    mapModeButton.addEventListener(
        "click",
        () => {

            mapWrapper.classList.toggle(
                "electric-mode"
            );

            updateMapMode();

        }
    );


    /*
    WICHTIG:
    Kein electric-mode beim Start.
    */

    mapWrapper.classList.remove(
        "electric-mode"
    );

    updateMapMode();


    /*
    ================================================================
    LEAFLET
    ================================================================
    */

    map.attributionControl.setPrefix(
        '<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>'
    );

</script>

</body>
