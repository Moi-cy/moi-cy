<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moi-cy – Skate Map</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        /* =========================================================
           MOI-CY SKATE MAP
           ========================================================= */

        .map-page {
            min-height: 100vh;
            padding-top: var(--header-height);
            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(22,140,255,0.08),
                    transparent 38%
                ),
                var(--black);
        }

        .map-heading {
            width: min(1400px, calc(100% - 40px));
            margin: 0 auto;
            padding: 48px 0 25px;
        }

        .map-heading-top {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 30px;
        }

        .map-heading h1 {
            margin: 0;
            font-size: clamp(2.5rem, 7vw, 5.5rem);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -0.06em;
            text-transform: uppercase;
        }

        .map-heading h1 span {
            color: var(--blue);
        }

        .map-heading p {
            max-width: 430px;
            margin: 0 0 4px;
            color: var(--muted);
            font-size: 0.72rem;
            line-height: 1.7;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        /* =========================================================
           MAP
           ========================================================= */

        .map-wrapper {
            position: relative;
            width: min(1400px, calc(100% - 40px));
            height: 700px;
            margin: 0 auto 30px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
            background: #050505;
            box-shadow:
                0 25px 70px rgba(0,0,0,0.45),
                0 0 0 1px rgba(22,140,255,0.03);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* =========================================================
           ELECTRIC MAP MODE
           ========================================================= */

        /*
         * Kein Hue-Rotate mehr.
         * Dadurch wird die Karte nicht mehr lila.
         *
         * Electric Blue:
         * - sehr dunkel
         * - hoher Kontrast
         * - Blau bleibt Blau
         */

        .map-wrapper.electric-mode .leaflet-tile-pane {
            filter:
                brightness(0.34)
                contrast(1.65)
                saturate(1.15);
        }

        .map-wrapper.electric-mode .leaflet-tile-pane::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    rgba(0,0,0,0.38),
                    rgba(0,0,0,0.38)
                );
            pointer-events: none;
        }

        .map-wrapper.electric-mode {
            background: #020202;
            box-shadow:
                0 25px 70px rgba(0,0,0,0.75),
                inset 0 0 100px rgba(22,140,255,0.07);
        }

        .map-wrapper.electric-mode #map {
            background: #020202;
        }

        /* =========================================================
           ZOOM CONTROLS
           ========================================================= */

        .leaflet-control-zoom {
            position: absolute !important;
            top: 20px !important;
            left: 20px !important;
            margin: 0 !important;
            border: 1px solid rgba(22,140,255,0.55) !important;
            border-radius: 0 !important;
            overflow: hidden;
            box-shadow:
                0 12px 35px rgba(0,0,0,0.55),
                0 0 20px rgba(22,140,255,0.08) !important;
        }

        .leaflet-control-zoom a {
            width: 42px !important;
            height: 42px !important;
            line-height: 42px !important;
            border: 0 !important;
            border-bottom: 1px solid rgba(22,140,255,0.28) !important;
            background: #030303 !important;
            color: #ffffff !important;
            font-size: 20px !important;
            font-weight: 700;
            transition:
                background 0.2s ease,
                color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .leaflet-control-zoom a:last-child {
            border-bottom: 0 !important;
        }

        .leaflet-control-zoom a:hover {
            background: var(--blue) !important;
            color: #fff !important;
            box-shadow:
                inset 0 0 18px rgba(255,255,255,0.12);
        }

        /* =========================================================
           SEARCH
           ========================================================= */

        .map-search {
            position: absolute;
            z-index: 1000;
            top: 82px;
            left: 20px;
            width: min(430px, calc(100% - 40px));
        }

        .map-search-box {
            display: flex;
            overflow: hidden;
            background: rgba(3,3,3,0.97);
            border: 1px solid rgba(22,140,255,0.35);
            box-shadow:
                0 15px 40px rgba(0,0,0,0.55),
                0 0 25px rgba(22,140,255,0.06);
            backdrop-filter: blur(12px);
        }

        .map-search-box:focus-within {
            border-color: var(--blue);
            box-shadow:
                0 15px 40px rgba(0,0,0,0.55),
                0 0 25px rgba(22,140,255,0.15);
        }

        .map-search input {
            width: 100%;
            min-height: 52px;
            padding: 0 17px;
            border: 0;
            outline: none;
            background: transparent;
            color: #fff;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .map-search input::placeholder {
            color: #555;
        }

        .map-search button {
            width: 56px;
            min-width: 56px;
            border: 0;
            background: var(--blue);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition:
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .map-search button:hover {
            background: #39a3ff;
            box-shadow:
                inset 0 0 18px rgba(255,255,255,0.12);
        }

        /* =========================================================
           ROUTE PANEL
           ========================================================= */

        .route-panel {
            position: absolute;
            z-index: 1000;
            top: 20px;
            right: 20px;
            width: min(350px, calc(100% - 40px));
            padding: 18px;
            background: rgba(3,3,3,0.97);
            border: 1px solid rgba(22,140,255,0.35);
            box-shadow:
                0 18px 45px rgba(0,0,0,0.6),
                0 0 30px rgba(22,140,255,0.06);
            backdrop-filter: blur(14px);
        }

        .route-panel-title {
            margin-bottom: 14px;
        }

        .route-panel-kicker {
            margin-bottom: 4px;
            color: var(--blue);
            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .route-panel-heading {
            color: #fff;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .route-fields {
            display: grid;
            gap: 8px;
        }

        .route-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .route-dot {
            width: 9px;
            height: 9px;
            min-width: 9px;
            border: 2px solid #fff;
            border-radius: 50%;
            background: var(--blue);
        }

        .route-dot.destination {
            background: #fff;
        }

        .route-input {
            width: 100%;
            min-height: 43px;
            padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.13);
            outline: none;
            background: #090909;
            color: #fff;
            font-family: inherit;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .route-input:focus {
            border-color: var(--blue);
        }

        .route-input::placeholder {
            color: #555;
        }

        .route-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .route-button {
            min-height: 42px;
            border: 1px solid var(--blue);
            background: var(--blue);
            color: #fff;
            font-family: inherit;
            font-size: 0.62rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .route-button:hover {
            background: #39a3ff;
            border-color: #39a3ff;
        }

        .route-button.secondary {
            border-color: rgba(255,255,255,0.2);
            background: transparent;
        }

        .route-button.secondary:hover {
            border-color: #fff;
            background: #fff;
            color: #000;
        }

        .route-result {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(22,140,255,0.25);
        }

        .route-result.active {
            display: block;
        }

        .route-result-main {
            color: #fff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.05em;
        }

        .route-result-sub {
            margin-top: 4px;
            color: #777;
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        /* =========================================================
           MAP STYLE SWITCH
           ========================================================= */

        .map-style-switch {
            position: absolute;
            z-index: 1000;
            left: 20px;
            bottom: 20px;
            display: flex;
            padding: 4px;
            background: rgba(3,3,3,0.97);
            border: 1px solid rgba(22,140,255,0.4);
            box-shadow:
                0 12px 35px rgba(0,0,0,0.55);
        }

        .map-style-button {
            min-height: 36px;
            padding: 0 13px;
            border: 0;
            background: transparent;
            color: #666;
            font-family: inherit;
            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .map-style-button.active {
            background: var(--blue);
            color: #fff;
            box-shadow:
                0 0 18px rgba(22,140,255,0.2);
        }

        /* =========================================================
           STATUS
           ========================================================= */

        .map-status {
            position: absolute;
            z-index: 1000;
            right: 20px;
            bottom: 20px;
            max-width: 330px;
            padding: 13px 16px;
            background: rgba(3,3,3,0.97);
            border-left: 3px solid var(--blue);
            box-shadow: 0 12px 35px rgba(0,0,0,0.55);
            color: #fff;
            font-size: 0.61rem;
            font-weight: 800;
            line-height: 1.5;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(8px);
            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .map-status.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================================
           MARKERS
           ========================================================= */

        .moi-marker {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: 2px solid #fff;
            border-radius: 50%;
            background: var(--blue);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: 900;
            box-shadow:
                0 0 0 5px rgba(22,140,255,0.18),
                0 5px 18px rgba(0,0,0,0.4);
        }

        .moi-marker::after {
            content: "";
            position: absolute;
            bottom: -7px;
            width: 10px;
            height: 10px;
            background: var(--blue);
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(45deg);
            z-index: -1;
        }

        .location-marker {
            width: 22px;
            height: 22px;
            border: 3px solid #fff;
            border-radius: 50%;
            background: #050505;
            box-shadow:
                0 0 0 7px rgba(22,140,255,0.18),
                0 4px 15px rgba(0,0,0,0.5);
        }

        .route-marker-start {
            width: 22px;
            height: 22px;
            border: 3px solid #fff;
            border-radius: 50%;
            background: var(--blue);
            box-shadow:
                0 0 0 7px rgba(22,140,255,0.18);
        }

        .route-marker-end {
            width: 22px;
            height: 22px;
            border: 3px solid #fff;
            border-radius: 50%;
            background: #050505;
            box-shadow:
                0 0 0 7px rgba(255,255,255,0.12);
        }

        /* =========================================================
           POPUP
           ========================================================= */

        .leaflet-popup-content-wrapper {
            padding: 0;
            overflow: hidden;
            border: 1px solid rgba(22,140,255,0.35);
            border-radius: 0;
            background: #050505;
            color: #fff;
            box-shadow: 0 18px 50px rgba(0,0,0,0.7);
        }

        .leaflet-popup-tip {
            background: #050505;
        }

        .leaflet-popup-content {
            width: 245px !important;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .popup {
            padding: 17px;
        }

        .popup-kicker {
            margin-bottom: 6px;
            color: var(--blue);
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .popup-title {
            margin-bottom: 5px;
            color: #fff;
            font-size: 17px;
            font-weight: 900;
            line-height: 1.1;
        }

        .popup-location {
            color: #888;
            font-size: 11px;
        }

        .popup-actions {
            display: grid;
            gap: 7px;
            margin-top: 15px;
        }

        .popup-action {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 10px;
            border: 1px solid rgba(255,255,255,0.16);
            background: #0c0c0c;
            color: #fff;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
        }

        .popup-action:hover {
            border-color: var(--blue);
            background: var(--blue);
            color: #fff;
        }

        .popup-action.route {
            border-color: var(--blue);
            background: var(--blue);
        }

        /* =========================================================
           BACK
           ========================================================= */

        .map-back {
            width: min(1400px, calc(100% - 40px));
            margin: 0 auto 70px;
        }

        .map-back a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid var(--line-light);
            color: var(--white);
            text-decoration: none;
            font-size: 0.66rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .map-back a:hover {
            background: #fff;
            color: #000;
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 900px) {

            .map-page {
                padding-top: 68px;
            }

            .map-heading {
                padding-top: 38px;
            }

            .map-heading-top {
                display: block;
            }

            .map-heading p {
                margin-top: 16px;
            }

            .map-wrapper {
                height: 720px;
            }

            .route-panel {
                top: 170px;
                right: 20px;
                left: 20px;
                width: auto;
            }
        }

        @media (max-width: 600px) {

            .map-heading,
            .map-wrapper,
            .map-back {
                width: calc(100% - 24px);
            }

            .map-heading {
                padding-top: 28px;
                padding-bottom: 18px;
            }

            .map-heading h1 {
                font-size: 3rem;
            }

            .map-wrapper {
                height: 760px;
            }

            .leaflet-control-zoom {
                top: 12px !important;
                left: 12px !important;
            }

            .map-search {
                top: 70px;
                left: 12px;
                width: calc(100% - 24px);
            }

            .route-panel {
                top: 135px;
                right: 12px;
                left: 12px;
                padding: 14px;
            }

            .map-style-switch {
                left: 12px;
                bottom: 12px;
            }

            .map-status {
                right: 12px;
                bottom: 65px;
                left: 12px;
                max-width: none;
            }

            .map-back {
                margin-bottom: 40px;
            }
        }

    </style>
</head>

<body>

    <div id="site-header"></div>

    <main class="map-page">

        <section class="map-heading">

            <div class="map-heading-top">

                <h1>
                    SKATE<br>
                    <span>MAP</span>
                </h1>

                <p>
                    Finde Skateparks, Städte und neue Spots.
                    Suche Orte oder plane direkt deine Route.
                </p>

            </div>

        </section>


        <section class="map-wrapper" id="mapWrapper">

            <!-- =================================================
                 NORMAL SEARCH
                 ================================================= -->

            <div class="map-search">

                <div class="map-search-box">

                    <input
                        type="search"
                        id="mapSearch"
                        placeholder="STADT ODER SKATEPARK SUCHEN..."
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        id="searchButton"
                        aria-label="Suchen"
                    >
                        🔎
                    </button>

                </div>

            </div>


            <!-- =================================================
                 ROUTE PLANNER
                 ================================================= -->

            <div class="route-panel">

                <div class="route-panel-title">

                    <div class="route-panel-kicker">
                        MOI-CY ROUTE
                    </div>

                    <div class="route-panel-heading">
                        Route planen
                    </div>

                </div>


                <div class="route-fields">

                    <div class="route-input-row">

                        <span class="route-dot"></span>

                        <input
                            type="text"
                            id="routeStart"
                            class="route-input"
                            placeholder="START – STADT ODER ORT"
                            autocomplete="off"
                        >

                    </div>


                    <div class="route-input-row">

                        <span class="route-dot destination"></span>

                        <input
                            type="text"
                            id="routeDestination"
                            class="route-input"
                            placeholder="ZIEL – STADT ODER ORT"
                            autocomplete="off"
                        >

                    </div>

                </div>


                <div class="route-buttons">

                    <button
                        type="button"
                        class="route-button"
                        id="planRouteButton"
                    >
                        ROUTE PLANEN
                    </button>

                    <button
                        type="button"
                        class="route-button secondary"
                        id="myLocationButton"
                    >
                        MEIN STANDORT
                    </button>

                </div>


                <div
                    class="route-result"
                    id="routeResult"
                >

                    <div
                        class="route-result-main"
                        id="routeResultMain"
                    ></div>

                    <div
                        class="route-result-sub"
                        id="routeResultSub"
                    ></div>

                </div>

            </div>


            <!-- =================================================
                 MAP
                 ================================================= -->

            <div id="map"></div>


            <!-- =================================================
                 MAP STYLE
                 ================================================= -->

            <div class="map-style-switch">

                <button
                    type="button"
                    class="map-style-button"
                    id="normalMapButton"
                >
                    NORMAL
                </button>

                <button
                    type="button"
                    class="map-style-button active"
                    id="electricMapButton"
                >
                    ELECTRIC
                </button>

            </div>


            <!-- =================================================
                 STATUS
                 ================================================= -->

            <div
                class="map-status"
                id="mapStatus"
            ></div>

        </section>


        <div class="map-back">

            <a href="skateplaetze.html">
                ← ZU DEN SKATEPLÄTZEN
            </a>

        </div>

    </main>


    <div id="site-footer"></div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="script.js"></script>


    <script>

        /* =========================================================
           MAP
           ========================================================= */

        const map = L.map("map", {
            zoomControl: true
        });


        const normalTiles = L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
            }
        );


        normalTiles.addTo(map);


        map.setView(
            [48.5, 10.5],
            6
        );


        const mapWrapper =
            document.getElementById("mapWrapper");


        /*
         * Electric mode starts active.
         */

        mapWrapper.classList.add(
            "electric-mode"
        );


        /* =========================================================
           SKATEPARK DATA
           ========================================================= */

        const skateparks = [

            {
                name: "Skatepark Valence",
                city: "Valence",
                country: "Frankreich",
                lat: 44.9543094,
                lng: 4.8978972
            },

            {
                name: "Skatepark Karlsruhe",
                city: "Karlsruhe",
                country: "Deutschland",
                lat: 49.0029885,
                lng: 8.4313306
            },

            {
                name: "Skatepark Heidelberg",
                city: "Heidelberg",
                country: "Deutschland",
                lat: 49.4115646,
                lng: 8.6767926
            },

            {
                name: "Heidelberg Bowl",
                city: "Heidelberg",
                country: "Deutschland",
                lat: 49.3919556,
                lng: 8.6835068
            },

            {
                name: "Skatepark Perpignan",
                city: "Perpignan",
                country: "Frankreich",
                lat: 42.6778339,
                lng: 2.9032284
            },

            {
                name: "München Hirschgarten",
                city: "München",
                country: "Deutschland",
                lat: 48.1455915,
                lng: 11.5097967
            }

        ];


        /* =========================================================
           ICONS
           ========================================================= */

        const skateIcon = L.divIcon({
            className: "",
            html:
                '<div class="moi-marker">M</div>',
            iconSize: [34, 42],
            iconAnchor: [17, 42],
            popupAnchor: [0, -42]
        });


        const startIcon = L.divIcon({
            className: "",
            html:
                '<div class="route-marker-start"></div>',
            iconSize: [22, 22],
            iconAnchor: [11, 11]
        });


        const endIcon = L.divIcon({
            className: "",
            html:
                '<div class="route-marker-end"></div>',
            iconSize: [22, 22],
            iconAnchor: [11, 11]
        });


        const locationIcon = L.divIcon({
            className: "",
            html:
                '<div class="location-marker"></div>',
            iconSize: [22, 22],
            iconAnchor: [11, 11]
        });


        /* =========================================================
           SKATEPARK MARKERS
           ========================================================= */

        const markers = [];


        skateparks.forEach((park) => {

            const marker =
                L.marker(
                    [
                        park.lat,
                        park.lng
                    ],
                    {
                        icon: skateIcon
                    }
                ).addTo(map);


            marker.bindPopup(`
                <div class="popup">

                    <div class="popup-kicker">
                        MOI-CY SKATE SPOT
                    </div>

                    <div class="popup-title">
                        ${park.name}
                    </div>

                    <div class="popup-location">
                        ${park.city}, ${park.country}
                    </div>

                    <div class="popup-actions">

                        <button
                            type="button"
                            class="popup-action route"
                            onclick="routeFromCurrentLocation(
                                ${park.lat},
                                ${park.lng},
                                '${park.name.replace(/'/g, "\\'")}'
                            )"
                        >
                            📍 Route von meinem Standort
                        </button>

                        <a
                            class="popup-action"
                            href="skateplaetze.html"
                        >
                            Skateplatz ansehen →
                        </a>

                    </div>

                </div>
            `);


            markers.push({
                park,
                marker
            });

        });


        /* =========================================================
           SEARCH
           ========================================================= */

        const searchInput =
            document.getElementById("mapSearch");

        const searchButton =
            document.getElementById("searchButton");


        let cityMarker = null;


        async function searchPlace() {

            const searchTerm =
                searchInput.value.trim();


            if (!searchTerm) {

                map.setView(
                    [48.5, 10.5],
                    6
                );

                return;
            }


            /*
             * Check our own skateparks first.
             */

            const localMatches =
                markers.filter(({ park }) => {

                    const search =
                        searchTerm.toLowerCase();

                    return (
                        park.name
                            .toLowerCase()
                            .includes(search) ||

                        park.city
                            .toLowerCase()
                            .includes(search) ||

                        park.country
                            .toLowerCase()
                            .includes(search)
                    );

                });


            if (localMatches.length === 1) {

                const result =
                    localMatches[0];


                map.flyTo(
                    [
                        result.park.lat,
                        result.park.lng
                    ],
                    15,
                    {
                        duration: 1
                    }
                );


                result.marker.openPopup();

                return;
            }


            if (localMatches.length > 1) {

                const bounds =
                    L.latLngBounds(
                        localMatches.map(
                            ({ park }) => [
                                park.lat,
                                park.lng
                            ]
                        )
                    );


                map.fitBounds(
                    bounds,
                    {
                        padding: [100, 100],
                        maxZoom: 13
                    }
                );


                return;
            }


            /*
             * Search any city/place.
             */

            searchButton.disabled = true;


            try {

                const url =
                    "https://nominatim.openstreetmap.org/search" +
                    "?format=jsonv2" +
                    "&limit=1" +
                    "&q=" +
                    encodeURIComponent(searchTerm);


                const response =
                    await fetch(url);


                if (!response.ok) {
                    throw new Error(
                        "Geocoding failed"
                    );
                }


                const results =
                    await response.json();


                if (!results.length) {
                    return;
                }


                const result =
                    results[0];


                const lat =
                    Number(result.lat);

                const lon =
                    Number(result.lon);


                map.flyTo(
                    [lat, lon],
                    12,
                    {
                        duration: 1.2
                    }
                );


                if (cityMarker) {
                    map.removeLayer(
                        cityMarker
                    );
                }


                cityMarker =
                    L.marker(
                        [lat, lon],
                        {
                            icon: locationIcon
                        }
                    ).addTo(map);


                cityMarker
                    .bindPopup(`
                        <div class="popup">

                            <div class="popup-kicker">
                                GESUCHTER ORT
                            </div>

                            <div class="popup-title">
                                ${escapeHtml(
                                    result.display_name
                                        .split(",")[0]
                                )}
                            </div>

                            <div class="popup-location">
                                Ort gefunden
                            </div>

                        </div>
                    `)
                    .openPopup();


            } catch (error) {

                console.error(
                    "Moi-cy Suche:",
                    error
                );

            } finally {

                searchButton.disabled = false;

            }

        }


        searchButton.addEventListener(
            "click",
            searchPlace
        );


        searchInput.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {
                    searchPlace();
                }

            }
        );


        /* =========================================================
           MAP STYLE SWITCH
           ========================================================= */

        const normalMapButton =
            document.getElementById(
                "normalMapButton"
            );


        const electricMapButton =
            document.getElementById(
                "electricMapButton"
            );


        normalMapButton.addEventListener(
            "click",
            () => {

                mapWrapper.classList.remove(
                    "electric-mode"
                );

                normalMapButton.classList.add(
                    "active"
                );

                electricMapButton.classList.remove(
                    "active"
                );

            }
        );


        electricMapButton.addEventListener(
            "click",
            () => {

                mapWrapper.classList.add(
                    "electric-mode"
                );

                electricMapButton.classList.add(
                    "active"
                );

                normalMapButton.classList.remove(
                    "active"
                );

            }
        );


        /* =========================================================
           ROUTE VARIABLES
           ========================================================= */

        let routeLayer = null;

        let routeStartMarker = null;

        let routeEndMarker = null;

        let currentLocationMarker = null;


        /* =========================================================
           STATUS
           ========================================================= */

        const mapStatus =
            document.getElementById(
                "mapStatus"
            );


        const routeResult =
            document.getElementById(
                "routeResult"
            );


        const routeResultMain =
            document.getElementById(
                "routeResultMain"
            );


        const routeResultSub =
            document.getElementById(
                "routeResultSub"
            );


        function setStatus(message) {

            mapStatus.textContent =
                message;

            mapStatus.classList.add(
                "active"
            );

        }


        function clearStatus() {

            mapStatus.textContent = "";

            mapStatus.classList.remove(
                "active"
            );

        }


        /* =========================================================
           CLEAR ROUTE
           ========================================================= */

        function clearRoute() {

            if (routeLayer) {

                map.removeLayer(
                    routeLayer
                );

                routeLayer = null;

            }


            if (routeStartMarker) {

                map.removeLayer(
                    routeStartMarker
                );

                routeStartMarker = null;

            }


            if (routeEndMarker) {

                map.removeLayer(
                    routeEndMarker
                );

                routeEndMarker = null;

            }


            routeResult.classList.remove(
                "active"
            );

        }


        /* =========================================================
           GEOCODING
           ========================================================= */

        async function geocodePlace(
            place
        ) {

            const url =
                "https://nominatim.openstreetmap.org/search" +
                "?format=jsonv2" +
                "&limit=1" +
                "&q=" +
                encodeURIComponent(place);


            const response =
                await fetch(url);


            if (!response.ok) {
                throw new Error(
                    "Ort konnte nicht gesucht werden."
                );
            }


            const results =
                await response.json();


            if (!results.length) {

                throw new Error(
                    `Ort nicht gefunden: ${place}`
                );

            }


            return {

                lat:
                    Number(results[0].lat),

                lng:
                    Number(results[0].lon),

                name:
                    results[0]
                        .display_name
                        .split(",")[0]

            };

        }


        /* =========================================================
           PLAN ROUTE BETWEEN TWO PLACES
           ========================================================= */

        async function planRoute() {

            const startInput =
                document.getElementById(
                    "routeStart"
                );


            const destinationInput =
                document.getElementById(
                    "routeDestination"
                );


            const startName =
                startInput.value.trim();


            const destinationName =
                destinationInput.value.trim();


            if (
                !startName ||
                !destinationName
            ) {

                setStatus(
                    "Bitte Start und Ziel eingeben."
                );

                return;

            }


            clearRoute();


            setStatus(
                "Start und Ziel werden gesucht..."
            );


            try {

                const start =
                    await geocodePlace(
                        startName
                    );


                const destination =
                    await geocodePlace(
                        destinationName
                    );


                setStatus(
                    "Route wird berechnet..."
                );


                const route =
                    await requestRoute(
                        start,
                        destination
                    );


                drawRoute(
                    start,
                    destination,
                    route
                );


                routeResultMain.textContent =
                    `${formatDistance(route.distance)} · ${formatDuration(route.duration)}`;


                routeResultSub.textContent =
                    `${start.name} → ${destination.name}`;


                routeResult.classList.add(
                    "active"
                );


                setStatus(
                    `Route gefunden: ${start.name} → ${destination.name}`
                );


            } catch (error) {

                console.error(
                    "Moi-cy Route:",
                    error
                );


                setStatus(
                    error.message ||
                    "Route konnte nicht berechnet werden."
                );

            }

        }


        /* =========================================================
           OSRM ROUTE
           ========================================================= */

        async function requestRoute(
            start,
            destination
        ) {

            const routeUrl =
                "https://router.project-osrm.org/route/v1/driving/" +
                `${start.lng},${start.lat};` +
                `${destination.lng},${destination.lat}` +
                "?overview=full&geometries=geojson";


            const response =
                await fetch(routeUrl);


            if (!response.ok) {

                throw new Error(
                    "Routing-Service ist momentan nicht erreichbar."
                );

            }


            const data =
                await response.json();


            if (
                data.code !== "Ok" ||
                !data.routes ||
                !data.routes.length
            ) {

                throw new Error(
                    "Für diese Orte wurde keine Route gefunden."
                );

            }


            return data.routes[0];

        }


        /* =========================================================
           DRAW ROUTE
           ========================================================= */

        function drawRoute(
            start,
            destination,
            route
        ) {

            routeLayer =
                L.geoJSON(
                    route.geometry,
                    {
                        style: {

                            color: "#168cff",

                            weight: 6,

                            opacity: 0.95,

                            lineCap: "round",

                            lineJoin: "round"

                        }
                    }
                ).addTo(map);


            routeStartMarker =
                L.marker(
                    [
                        start.lat,
                        start.lng
                    ],
                    {
                        icon: startIcon
                    }
                )
                .addTo(map)
                .bindPopup(
                    `<strong>${escapeHtml(start.name)}</strong><br>Start`
                );


            routeEndMarker =
                L.marker(
                    [
                        destination.lat,
                        destination.lng
                    ],
                    {
                        icon: endIcon
                    }
                )
                .addTo(map)
                .bindPopup(
                    `<strong>${escapeHtml(destination.name)}</strong><br>Ziel`
                );


            map.fitBounds(
                routeLayer.getBounds(),
                {
                    padding: [80, 80]
                }
            );

        }


        /* =========================================================
           CURRENT LOCATION → DESTINATION
           ========================================================= */

        async function routeFromCurrentLocation(
            destinationLat,
            destinationLng,
            destinationName
        ) {

            if (!navigator.geolocation) {

                setStatus(
                    "Dein Browser unterstützt keine Standortabfrage."
                );

                return;

            }


            clearRoute();


            setStatus(
                "Dein Standort wird ermittelt..."
            );


            navigator.geolocation.getCurrentPosition(

                async (position) => {

                    const start = {

                        lat:
                            position.coords.latitude,

                        lng:
                            position.coords.longitude,

                        name:
                            "Mein Standort"

                    };


                    const destination = {

                        lat:
                            destinationLat,

                        lng:
                            destinationLng,

                        name:
                            destinationName

                    };


                    try {

                        setStatus(
                            "Route wird berechnet..."
                        );


                        const route =
                            await requestRoute(
                                start,
                                destination
                            );


                        drawRoute(
                            start,
                            destination,
                            route
                        );


                        routeResultMain.textContent =
                            `${formatDistance(route.distance)} · ${formatDuration(route.duration)}`;


                        routeResultSub.textContent =
                            `Mein Standort → ${destinationName}`;


                        routeResult.classList.add(
                            "active"
                        );


                        setStatus(
                            `Route zu ${destinationName} gefunden.`
                        );


                    } catch (error) {

                        setStatus(
                            error.message ||
                            "Route konnte nicht berechnet werden."
                        );

                    }

                },


                (error) => {

                    console.error(
                        "Moi-cy Standort:",
                        error
                    );


                    if (
                        error.code ===
                        error.PERMISSION_DENIED
                    ) {

                        setStatus(
                            "Standortzugriff wurde nicht erlaubt."
                        );

                    } else {

                        setStatus(
                            "Dein Standort konnte nicht ermittelt werden."
                        );

                    }

                },


                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }

            );

        }


        /* =========================================================
           CURRENT LOCATION BUTTON
           ========================================================= */

        const myLocationButton =
            document.getElementById(
                "myLocationButton"
            );


        myLocationButton.addEventListener(
            "click",
            () => {

                if (!navigator.geolocation) {

                    setStatus(
                        "Dein Browser unterstützt keine Standortabfrage."
                    );

                    return;

                }


                setStatus(
                    "Standort wird ermittelt..."
                );


                navigator.geolocation.getCurrentPosition(

                    (position) => {

                        const lat =
                            position.coords.latitude;

                        const lng =
                            position.coords.longitude;


                        if (
                            currentLocationMarker
                        ) {

                            map.removeLayer(
                                currentLocationMarker
                            );

                        }


                        currentLocationMarker =
                            L.marker(
                                [lat, lng],
                                {
                                    icon:
                                        locationIcon
                                }
                            )
                            .addTo(map)
                            .bindPopup(
                                "<strong>Mein Standort</strong>"
                            )
                            .openPopup();


                        map.flyTo(
                            [lat, lng],
                            14,
                            {
                                duration: 1
                            }
                        );


                        setStatus(
                            "Dein Standort wurde gefunden."
                        );

                    },


                    () => {

                        setStatus(
                            "Dein Standort konnte nicht ermittelt werden."
                        );

                    },


                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 60000
                    }

                );

            }
        );


        /* =========================================================
           PLAN ROUTE BUTTON
           ========================================================= */

        document
            .getElementById(
                "planRouteButton"
            )
            .addEventListener(
                "click",
                planRoute
            );


        /* =========================================================
           ENTER IN ROUTE FIELDS
           ========================================================= */

        document
            .getElementById(
                "routeStart"
            )
            .addEventListener(
                "keydown",
                (event) => {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        planRoute();

                    }

                }
            );


        document
            .getElementById(
                "routeDestination"
            )
            .addEventListener(
                "keydown",
                (event) => {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        planRoute();

                    }

                }
            );


        /* =========================================================
           FORMATTING
           ========================================================= */

        function formatDistance(
            meters
        ) {

            const kilometers =
                meters / 1000;


            if (
                kilometers < 1
            ) {

                return `${Math.round(meters)} m`;

            }


            return `${kilometers.toFixed(1)} km`;

        }


        function formatDuration(
            seconds
        ) {

            const minutes =
                Math.round(
                    seconds / 60
                );


            if (
                minutes < 60
            ) {

                return `ca. ${minutes} Min.`;

            }


            const hours =
                Math.floor(
                    minutes / 60
                );


            const remaining =
                minutes % 60;


            if (!remaining) {

                return `ca. ${hours} Std.`;

            }


            return `ca. ${hours} Std. ${remaining} Min.`;

        }


        /* =========================================================
           ESCAPE HTML
           ========================================================= */

        function escapeHtml(
            value
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================================================
           GLOBAL FUNCTION
           ========================================================= */

        window.routeFromCurrentLocation =
            routeFromCurrentLocation;

    </script>

</body>
</html>
